    GeniusEmbednfCompetitionSchedule:
      properties:
        matches:
          description: Every game of the competition (roundNumber=-1 = all rounds), in page order
          items:
            description: One game (a div.match-wrap block)
            properties:
              away_score:
                description: Away points; null before tip-off
                type: integer
              away_team_code:
                description: Away team code (local script possible)
                type: string
              away_team_id:
                description: 'Away team: Genius team id (warehouse key space, global across orgs and seasons;
                  the /team/{id} of hosted pages, the tid of the widget, the teamId of data/competition).
                  data.json carries no team id: join on name/code'
                type: integer
              away_team_name:
                description: Away team full name
                type: string
              comp_id:
                description: CompId of the match link, or of the team links when the org hides match pages
                  (FFBB); equals the {compId} asked for
                type: integer
              date_time:
                description: Tip-off as displayed, 'Mon D, YYYY, h:mm AM' (local time, zone not stated);
                  null when unscheduled
                type: string
              home_score:
                description: Home points; null before tip-off
                type: integer
              home_team_code:
                description: Home team code (local script possible)
                type: string
              home_team_id:
                description: 'Home team: Genius team id (warehouse key space, global across orgs and seasons;
                  the /team/{id} of hosted pages, the tid of the widget, the teamId of data/competition).
                  data.json carries no team id: join on name/code'
                type: integer
              home_team_name:
                description: Home team full name
                type: string
              link_match_id:
                description: Match id of the block's /match/<id>/summary link; equals match_id (the capture
                  refuses a page where it does not); null when the org hides match pages (FFBB)
                type: integer
              match_id:
                description: 'From the block id extfix_<id>. Genius match id: the {matchId} of data.json
                  and /u/; one global sequence across every Genius customer (~0.3 M in 2016, ~2.9 M in
                  Oct 2026)'
                type: integer
              org:
                description: ORG code of the match link (or the team links, as comp_id)
                type: string
              status:
                description: 'Status from the block class STATUS_*: COMPLETE, SCHEDULED, POSTPONED, ...'
                type: string
              venue_id:
                description: Genius venue id (the /venue/{id} of hosted pages); null when the venue is
                  plain text (FFBB)
                type: integer
              venue_name:
                description: Venue name as entered (local script)
                type: string
            type: object
          type: array
      type: object
