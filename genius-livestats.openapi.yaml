info:
  description: 'Cross-league basketball stats platform behind 20+ domestic leagues (see x-leagues). Keyless
    GET on three hosts; each path carries its own servers entry. CloudFront blocks datacenter IPs such
    as the SDV droplet on fibalivestats.* and hosted.* (403 ''Request blocked''); route through a proxy
    (capture.py reads GENIUS_PROXY). A missing object is a different 403 (S3 AccessDenied). data.json
    is the full game (box score, newest-first play-by-play, shot x/y as 0-100 percent of the full court)
    but carries no date, no competition id and no global player or team id. Season key: none in the API;
    inputs/leagues.json maps each compId to the sdv END year. Not official or supported.'
  title: Genius Sports / FIBA LiveStats (fibalivestats, hosted WebStats, widget)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /data/competition/{compId}.json:
    get:
      description: 'Captured for 2 org(s): ESAKE, POL. JSON body served as application/javascript.'
      operationId: genius_competition
      parameters:
      - description: 'Genius competition id: one per org competition-season (the comp_id rows of x-leagues)'
        example: 49915
        in: path
        name: compId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/javascript:
              schema:
                $ref: '#/components/schemas/GeniusCompetition'
          description: OK
        '403':
          description: 'CloudFront ''Request blocked'' (~919 B HTML: this egress IP is refused; use a
            proxy) OR S3 AccessDenied (~303 B HTML: no such object, wrong ORG, or a game from before data.json
            existed). Tell them apart by the body'
      summary: Recent window of a competition's games, with global team ids
    servers:
    - url: https://fibalivestats.dcd.shared.geniussports.com
  /data/{matchId}/data.json:
    get:
      description: 'Captured for 18 org(s): BAL, BNXT, BSN, CBFFE, CEBL, ESAKE, FFBB, FRB, FUBB, HKS,
        IBBA, LNBP, NBL, NZNBL, POL, SLB, WBBL. JSON body served as application/javascript.'
      operationId: genius_data
      parameters:
      - description: Genius match id (one global sequence across every Genius customer). data.json needs
          only this id
        example: 2902690
        in: path
        name: matchId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/javascript:
              schema:
                $ref: '#/components/schemas/GeniusData'
          description: OK
        '403':
          description: 'CloudFront ''Request blocked'' (~919 B HTML: this egress IP is refused; use a
            proxy) OR S3 AccessDenied (~303 B HTML: no such object, wrong ORG, or a game from before data.json
            existed). Tell them apart by the body'
      summary: 'Full live game: team and player box scores, play-by-play, shot chart'
    servers:
    - url: https://fibalivestats.dcd.shared.geniussports.com
  /embednf/{org}/en/competition/{compId}/schedule:
    get:
      description: 'Captured for 1 org(s): HKS. The capture banks the PARSED record of x-parsed-schema
        (the envelope''s html member, parsed like the hosted schedule).'
