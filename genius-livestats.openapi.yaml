                type: string
              id:
                description: Genius match id as a STRING (the {matchId} of data.json and /u/)
                type: string
              period:
                description: That game's current period number
                type: integer
              periodType:
                description: That game's current period type
                type: string
              team1:
                description: Team 1 of that game
                properties:
                  logoS:
                    description: Team logo image (standard)
                    properties:
                      bytes:
                        description: Image file size, bytes
                        type: integer
                      height:
                        description: Image height, pixels
                        type: integer
                      size:
                        description: 'Image size code: T1 = thumbnail (75 px), S1 = standard (200 px)'
                        type: string
                      url:
