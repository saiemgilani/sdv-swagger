components:
  schemas:
    GeniusCompetition:
      items:
        description: One game of the recent window (the endpoint returns only a few recent or upcoming
          games, not the season)
        properties:
          awaycode:
            description: Away team code
            type: string
          awaylogo:
            description: Away team logo URL
            type: string
          awayname:
            description: Away team name
            type: string
          awaynameInternational:
            description: Away team name in Latin script
            type: string
          awayscore:
            description: 'Away points: a string on most rows, an integer on some ('''' before tip-off);
              cast it'
            type:
            - integer
            - string
          awayteamId:
            description: 'Away team: Genius team id (warehouse key space, global across orgs and seasons;
              the /team/{id} of hosted pages, the tid of the widget, the teamId of data/competition).
              data.json carries no team id: join on name/code'
            type: integer
          clock:
            description: Period clock of a live or finished game, 'mm:ss' remaining (present on some rows
              only)
            type: string
          competitionId:
            description: 'Genius competition id (compId): one per org competition-season; the {compId}
              of hosted and data/competition paths'
            type: integer
          homecode:
            description: Home team code
            type: string
          homelogo:
            description: Home team logo URL
            type: string
          homename:
            description: Home team name
            type: string
          homenameInternational:
            description: Home team name in Latin script
            type: string
          homescore:
            description: 'Home points: a string on most rows, an integer on some ('''' before tip-off);
              cast it'
            type:
            - integer
            - string
          hometeamId:
            description: 'Home team: Genius team id (warehouse key space, global across orgs and seasons;
              the /team/{id} of hosted pages, the tid of the widget, the teamId of data/competition).
              data.json carries no team id: join on name/code'
            type: integer
          leagueId:
            description: Genius league id of the org (ESAKE = 115); the leagueId column of the hosted
              chooser
            type: integer
          live:
            description: 1 while the game is live, else 0
            type: integer
          matchId:
            description: 'Genius match id: the {matchId} of data.json and /u/; one global sequence across
              every Genius customer (~0.3 M in 2016, ~2.9 M in Oct 2026)'
            type: integer
          matchStatus:
            description: 'Match status: COMPLETE, SCHEDULED, IN_PROGRESS, ... (upper case)'
            type: string
          matchTime:
            description: Local tip-off time, 'YYYY-MM-DD HH:MM:SS' (venue time zone, not stated)
            type: string
          matchTimeUTC:
            description: Tip-off time in UTC, 'YYYY-MM-DD HH:MM:SS'
            type: string
          period:
            description: Current period of a live or finished game (present on some rows only)
            type: integer
          periodType:
            description: 'Current period type: REGULAR or OVERTIME (present on some rows only)'
            type: string
        type: object
      type: array
    GeniusData:
      properties:
        attendance:
          description: Attendance as entered by the org; 0 when not entered
          type: integer
        clock:
          description: Clock of the current period at capture time, 'mm:ss' remaining ('00:00' once the
            game is over)
          type: string
        disableMatch:
          description: 1 when the org disabled the public feed for this game, else 0
          type: integer
        inOT:
          description: 1 when the game is (or ended) in overtime, else 0
          type: integer
        leaddata:
          description: 'Lead-tracker chart: two parallel series. [0] holds axis labels (''P1'', ''P2'',
            ... at period starts, '''' elsewhere), [1] the score margin (team 1 minus team 2) at each
            step'
          items:
            description: One lead-tracker series (labels or margins; see leaddata)
            items:
              description: Axis label (string) in series 0, score margin team 1 minus team 2 (integer)
                in series 1
              type:
              - integer
              - string
            type: array
          type: array
        officials:
          description: Game officials keyed by role
          properties:
            commissioner:
              description: Commissioner (game supervisor); absent in some orgs
              properties:
                externalId:
                  description: Id of this official in the org's own system (federation licence number),
                    as a string; not a Genius id
                  type: string
                familyName:
                  description: Family name in the competition's own script
                  type: string
                familyNameInitial:
                  description: Initial of familyName
                  type: string
                familyNameTV:
                  description: TV-graphics family name; empty string in every sample
                  type: string
                firstName:
                  description: Given name in the competition's own script and spelling (Greek, Hebrew,
                    Czech, ... as entered)
                  type: string
                firstNameInitial:
                  description: Initial of firstName
                  type: string
                firstNameTV:
                  description: TV-graphics given name; empty string in every sample
                  type: string
                internationalFamilyName:
                  description: Family name in Latin script (often upper case)
                  type: string
                internationalFamilyNameInitial:
                  description: Initial of internationalFamilyName
                  type: string
                internationalFirstName:
                  description: Given name in Latin script
                  type: string
                internationalFirstNameInitial:
                  description: Initial of internationalFirstName
                  type: string
                internationalReference:
                  description: FIBA international reference of the official; empty string in every sample
                  type: string
                name:
                  description: Display name ('F. Abou Chacra')
                  type: string
                nationality:
                  description: Nationality, English, upper case ('GREECE'); empty string when unset
                  type: string
                nationalityCode:
                  description: ISO 3166-1 alpha-2 nationality code; empty string when unset
