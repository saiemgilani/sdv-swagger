          type: array
        pbp:
          description: Play-by-play, NEWEST FIRST (descending actionNumber); one row per action
          items:
            description: One action
            properties:
              actionNumber:
                description: Action sequence number, unique within the game (gaps where actions were deleted);
                  shots join on it
                type: integer
              actionType:
                description: 'Action type: 2pt, 3pt, freethrow, rebound, assist, turnover, steal, block,
                  foul, foulon (foul drawn), substitution, timeout, jumpball, period, game, headcoachchallenge'
                type: string
              clock:
                description: Game clock with hundredths, 'mm:ss:cc' remaining in the period
                type: string
              familyName:
                description: Family name in the competition's own script
                type: string
              familyNameInitial:
                description: Initial of familyName
                type: string
              firstName:
                description: Given name in the competition's own script and spelling (Greek, Hebrew, Czech,
                  ... as entered)
                type: string
              firstNameInitial:
                description: Initial of firstName
                type: string
              gt:
                description: Game clock, 'mm:ss' remaining in the period
                type: string
              internationalFamilyName:
                description: Family name in Latin script (often upper case)
                type: string
              internationalFamilyNameInitial:
                description: Initial of internationalFamilyName
                type: string
              internationalFirstName:
                description: Given name in Latin script
                type: string
              internationalFirstNameInitial:
                description: Initial of internationalFirstName
                type: string
              lead:
                description: Score margin after the action, team 1 minus team 2 (negative when team 2
                  leads)
                type: integer
              period:
                description: Period number; restarts at 1 for the first overtime (read it with periodType)
                type: integer
              periodType:
                description: 'Period type: REGULAR or OVERTIME'
                type: string
              player:
                description: Player display name; '' when no player
                type: string
              pno:
                description: 'Player number within this game (the key of tm.<tno>.pl); 0 = no player.
                  In-game only: not a person id and not the shirt number'
                type: integer
              previousAction:
                description: ActionNumber of the linked earlier action (the shot an assist or rebound
                  belongs to), or '' (string)
                type:
                - integer
                - string
              qualifier:
                description: 'Qualifier codes: pointsinthepaint, fromturnover, 2ndchance, fastbreak, blocked,
                  1freethrow/2freethrow (free throws awarded), shooting (shooting foul), team (team rebound/turnover),
                  confirmed, accepted/rejected (challenge outcome), ...'
                items:
                  description: One qualifier code
                  type: string
                type: array
              s1:
                description: 'Team 1 score after the action. Type varies by game: a string in most samples,
                  an integer in BSN 2080988 and LNBP 1913661; cast it'
                type:
                - integer
                - string
              s2:
                description: 'Team 2 score after the action. Type varies by game: a string in most samples,
                  an integer in BSN 2080988 and LNBP 1913661; cast it'
                type:
                - integer
                - string
              scoreboardName:
                description: Short display name ('T. Nichols'), in the local script when the org enters
                  one
                type: string
              scoring:
                description: 1 when the action is a scoring attempt (shot or free throw), else 0
                type: integer
              shirtNumber:
                description: Player shirt number (string); '' when no player
                type: string
              subType:
                description: 'Action subtype, free-text code per actionType: shot type for 2pt/3pt (layup,
                  drivinglayup, jumpshot, pullupjumpshot, turnaroundjumpshot, ...), ''in''/''out'' for
                  substitutions, ''start''/''end'' for period and game, foul kind for fouls; empty string
                  when none'
                type: string
              success:
                description: 1 = made / successful, 0 = missed (shots, free throws); 1 for other actions
                type: integer
              tno:
                description: 'Team number within this game: 1 = the team listed first (home on the hosted
                  schedule and widget), 2 = the other; 0 = no team (period/game rows). In-game only: not
                  a team id'
                type: integer
            type: object
          type: array
        period:
          description: Current (or last) period number; restarts at 1 in overtime
          type: integer
        periodLength:
          description: Length of the current period, minutes
          type: integer
        periodLengthOVERTIME:
          description: Length of an overtime period, minutes
          type: integer
        periodLengthREGULAR:
          description: Length of a regulation period, minutes (10 under FIBA rules, 12 in some leagues)
          type: integer
        periodType:
          description: 'Current period type: REGULAR or OVERTIME'
          type: string
        periodsMax:
          description: Number of regulation periods (4)
          type: integer
        scorers:
          additionalProperties:
            description: The team's scorers
            items:
              description: One scorer
              properties:
                familyName:
                  description: Family name in the competition's own script
                  type: string
                familyNameInitial:
                  description: Initial of familyName
                  type: string
                firstName:
                  description: Given name in the competition's own script and spelling (Greek, Hebrew,
