                  type: string
                firstNameInitial:
                  description: Initial of firstName
                  type: string
                internationalFamilyName:
                  description: Family name in Latin script (often upper case)
                  type: string
                internationalFamilyNameInitial:
                  description: Initial of internationalFamilyName
                  type: string
                internationalFirstName:
                  description: Given name in Latin script
                  type: string
                internationalFirstNameInitial:
                  description: Initial of internationalFirstName
                  type: string
                player:
                  description: Player display name
                  type: string
                pno:
                  description: 'Player number within this game (the key of tm.<tno>.pl); 0 = no player.
                    In-game only: not a person id and not the shirt number'
                  type: integer
                scoreboardName:
                  description: Short display name ('T. Nichols'), in the local script when the org enters
                    one
                  type: string
                shirtNumber:
                  description: Shirt number (string)
                  type: string
                summary:
                  description: Space-separated two-digit game-clock minutes of each of the player's scores
                    ('09 06 06 ...'), display string
                  type: string
                times:
                  description: The player's scores in order
                  items:
                    description: One score
                    properties:
                      gt:
                        description: Game clock of the score, 'mm:ss' remaining in the period
                        type: string
                      per:
                        description: Period number; restarts at 1 for the first overtime (read it with
                          periodType)
                        type: integer
                      perType:
                        description: 'Period type: REGULAR or OVERTIME'
                        type: string
                      subType:
                        description: Shot type of the score; '' for free throws
                        type: string
                    type: object
                  type: array
                tno:
                  description: 'Team number within this game: 1 = the team listed first (home on the hosted
                    schedule and widget), 2 = the other; 0 = no team (period/game rows). In-game only:
                    not a team id'
                  type: integer
              type: object
            type: array
            x-key: <tno>
          description: Scorers per team, keyed by tno
          type: object
        timeline:
          description: Timeline events; an empty list in every sample (unobserved)
          items:
            description: 'One timeline event (unobserved: the list is always empty)'
            x-unobserved: true
          type: array
        tm:
          additionalProperties:
            description: One team's box score, roster and shots
            properties:
              assistcoach1:
                description: Assistant coach 1 display name
                type: string
              assistcoach1Details:
                description: Name parts of the assistcoach1
                properties:
                  familyName:
                    description: Family name in the competition's own script
                    type: string
                  familyNameInitial:
                    description: Initial of familyName
                    type: string
                  firstName:
                    description: Given name in the competition's own script and spelling (Greek, Hebrew,
