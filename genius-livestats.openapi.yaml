                    type: string
                  firstNameInitial:
                    description: Initial of firstName
                    type: string
                  internationalFamilyName:
                    description: Family name in Latin script (often upper case)
                    type: string
                  internationalFamilyNameInitial:
                    description: Initial of internationalFamilyName
                    type: string
                  internationalFirstName:
                    description: Given name in Latin script
                    type: string
                  internationalFirstNameInitial:
                    description: Initial of internationalFirstName
                    type: string
                  scoreboardName:
                    description: Short display name ('T. Nichols'), in the local script when the org enters
                      one
                    type: string
                type: object
              assistcoach2:
                description: Assistant coach 2 display name
                type: string
              assistcoach2Details:
                description: Name parts of the assistcoach2
                properties:
                  familyName:
                    description: Family name in the competition's own script
                    type: string
                  familyNameInitial:
                    description: Initial of familyName
                    type: string
                  firstName:
                    description: Given name in the competition's own script and spelling (Greek, Hebrew,
                      Czech, ... as entered)
                    type: string
                  firstNameInitial:
                    description: Initial of firstName
                    type: string
                  internationalFamilyName:
                    description: Family name in Latin script (often upper case)
                    type: string
                  internationalFamilyNameInitial:
                    description: Initial of internationalFamilyName
                    type: string
                  internationalFirstName:
                    description: Given name in Latin script
                    type: string
                  internationalFirstNameInitial:
                    description: Initial of internationalFirstName
                    type: string
                  scoreboardName:
                    description: Short display name ('T. Nichols'), in the local script when the org enters
                      one
                    type: string
                type: object
