info:
  description: 'Market, event and tag metadata; keyless. Reverse-engineered from committed captures in
    polymarket/captures/ (2026-10-06). List routes page by limit/offset and the captures hold the first
    page only (see x-pagination). Decimal fields arrive as strings, and outcomePrices / clobTokenIds /
    outcomes are JSON arrays serialised inside a string: the spec types them string. Not official or supported.'
  title: Polymarket Gamma API (gamma-api.polymarket.com)
  version: '2026-10-06'
openapi: 3.1.0
paths:
  /events:
    get:
      operationId: get_events
      parameters:
      - description: Page size.
        example: '3'
        in: query
        name: limit
        required: false
        schema:
          type: string
      - description: Filter closed markets/events (true/false).
        example: 'false'
        in: query
        name: closed
        required: false
        schema:
          type: string
      - description: Filter events by tag slug (e.g. sports; see /tags).
        example: sports
        in: query
        name: tag_slug
        required: false
        schema:
          type: string
      - description: Row offset; offset=1 shifts the first row by one (verified 2026-10-06).
        in: query
        name: offset
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GammaApiEvents'
          description: OK
      summary: gamma-api.polymarket.com/events
      x-pagination:
        parameters:
        - limit
        - offset
        request: 'unverified: pages by the same limit/offset pair as /markets, not probed; the capture
          holds the first page only'
  /markets:
    get:
      operationId: get_markets
      parameters:
      - description: Page size.
        example: '3'
        in: query
        name: limit
        required: false
        schema:
          type: string
      - description: Filter closed markets/events (true/false).
        example: 'false'
        in: query
        name: closed
        required: false
        schema:
          type: string
      - description: Sort field, e.g. volume24hr, liquidity, startDate.
        example: volume24hr
        in: query
        name: order
        required: false
        schema:
          type: string
      - description: Sort direction (true/false).
        example: 'false'
        in: query
        name: ascending
        required: false
        schema:
          type: string
      - description: Row offset; offset=1 shifts the first row by one (verified 2026-10-06).
        in: query
        name: offset
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GammaApiMarkets'
          description: OK
      summary: gamma-api.polymarket.com/markets
      x-pagination:
        parameters:
        - limit
        - offset
        request: 'verified: offset=1 shifts the first row by one; the capture holds the first page only
          (probed 2026-10-06)'
  /markets/{id}:
    get:
      operationId: get_markets_id
      parameters:
      - description: Gamma market id (from /markets).
        example: '608565'
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GammaApiMarketsId'
          description: OK
      summary: gamma-api.polymarket.com/markets/{id}
  /tags:
    get:
      operationId: get_tags
      parameters:
      - description: Page size.
        example: '3'
        in: query
        name: limit
        required: false
        schema:
          type: string
      - description: Row offset; offset=1 shifts the first row by one (verified 2026-10-06).
        in: query
        name: offset
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GammaApiTags'
          description: OK
      summary: gamma-api.polymarket.com/tags
      x-pagination:
        parameters:
        - limit
        - offset
        request: 'unverified: pages by the same limit/offset pair as /markets, not probed; the capture
          holds the first page only'
servers:
- url: https://gamma-api.polymarket.com
