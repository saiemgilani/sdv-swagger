info:
  description: 'Routes per docs.sleeper.com; shapes from committed captures in sleeper/captures/. Read-only,
    keyless, about 1000 requests per minute. /players/nfl is a 5 MB map keyed by player id: fetch it at
    most once a day. Not official or supported.'
  title: Sleeper API v1 (api.sleeper.app)
  version: '2026-10-06'
openapi: 3.1.0
paths:
  /draft/{draft_id}:
    get:
      operationId: draft_draft_id
      parameters:
      - description: Draft id (from /league/{league_id}/drafts).
        example: '257270643320426496'
        in: path
        name: draft_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftDraftId'
          description: OK
      summary: A draft
  /draft/{draft_id}/picks:
    get:
      operationId: draft_draft_id_picks
      parameters:
      - description: Draft id (from /league/{league_id}/drafts).
        example: '257270643320426496'
        in: path
        name: draft_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftDraftIdPicks'
          description: OK
      summary: Picks of a draft
  /league/{league_id}:
    get:
      operationId: league_league_id
      parameters:
      - description: League id.
        example: '289646328504385536'
        in: path
        name: league_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueLeagueId'
          description: OK
      summary: A league
  /league/{league_id}/drafts:
    get:
      operationId: league_league_id_drafts
      parameters:
      - description: League id.
        example: '289646328504385536'
        in: path
        name: league_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueLeagueIdDrafts'
          description: OK
      summary: Drafts of a league
  /league/{league_id}/matchups/{week}:
    get:
      operationId: league_league_id_matchups_week
      parameters:
      - description: League id.
        example: '289646328504385536'
        in: path
        name: league_id
        required: true
        schema:
          type: string
      - description: NFL week (1-18).
        example: '1'
        in: path
        name: week
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueLeagueIdMatchupsWeek'
          description: OK
      summary: Matchups for a week
  /league/{league_id}/rosters:
    get:
      operationId: league_league_id_rosters
      parameters:
      - description: League id.
        example: '289646328504385536'
        in: path
        name: league_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueLeagueIdRosters'
          description: OK
      summary: Rosters in a league
  /league/{league_id}/traded_picks:
    get:
      operationId: league_league_id_traded_picks
      parameters:
      - description: League id.
        example: '289646328504385536'
        in: path
        name: league_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueLeagueIdTradedPicks'
          description: OK
      summary: Traded draft picks
  /league/{league_id}/transactions/{week}:
    get:
      operationId: league_league_id_transactions_week
      parameters:
      - description: League id.
        example: '289646328504385536'
        in: path
        name: league_id
        required: true
        schema:
          type: string
      - description: NFL week (1-18).
        example: '1'
        in: path
        name: week
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueLeagueIdTransactionsWeek'
          description: OK
      summary: Transactions for a week
  /league/{league_id}/users:
    get:
      operationId: league_league_id_users
      parameters:
      - description: League id.
        example: '289646328504385536'
        in: path
        name: league_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueLeagueIdUsers'
          description: OK
      summary: Users in a league
  /league/{league_id}/winners_bracket:
    get:
      operationId: league_league_id_winners_bracket
      parameters:
      - description: League id.
        example: '289646328504385536'
        in: path
        name: league_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueLeagueIdWinnersBracket'
          description: OK
      summary: Playoff bracket
  /players/nfl:
    get:
      operationId: players_nfl
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersNfl'
          description: OK
      summary: All NFL players (large; fetch at most once per day)
  /players/nfl/trending/add:
    get:
      operationId: players_nfl_trending_add
      parameters:
      - description: Hours to look back (default 24).
        in: query
        name: lookback_hours
        required: false
        schema:
          type: integer
      - description: Number of players (default 25).
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersNflTrendingAdd'
          description: OK
      summary: Trending adds (lookback_hours, limit)
  /state/nfl:
    get:
      operationId: state_nfl
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateNfl'
          description: OK
      summary: Current NFL week and season state
  /user/{user_id}/leagues/nfl/{season}:
    get:
      operationId: user_user_id_leagues_nfl_season
      parameters:
      - description: User id (from /user/{username}).
        example: '457511950237696'
        in: path
        name: user_id
        required: true
        schema:
          type: string
      - description: Season year, e.g. 2018 (the season the example league played).
        example: '2018'
        in: path
        name: season
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUserIdLeaguesNflSeason'
          description: OK
      summary: Leagues a user is in for a season
  /user/{username}:
    get:
      operationId: user_username
      parameters:
      - description: Username or user id.
        example: '457511950237696'
        in: path
        name: username
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUsername'
          description: OK
      summary: Look up a user by username or id
servers:
- url: https://api.sleeper.app/v1
