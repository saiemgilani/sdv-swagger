info:
  description: 'UNOFFICIAL, THIRD-PARTY INTERMEDIARY. https://easl.joshricha.com/api/v1 is an Express
    server run by an individual, not by the East Asia Super League or Sportradar. It copies Sportradar
    DataCore (ex-Synergy; organisation b1e0z) into SQLite and serves it keyless; www.easl.basketball reads
    it from an inline script. It can change or vanish without notice, and a first-party DataCore feed
    needs credentials. EASL is the men''s club league of Japan, Korea, Taiwan, the Philippines, Hong Kong,
    Macau and Mongolia (one competition, 4 seasons here: 2023-24 to 2026-27). Ids are DataCore UUID v1
    strings. A season is keyed by `year` = its START year (EASL 24-25 is year 2024); the sdv season is
    the END year, year + 1. Lists are returned whole (no paging). The play-by-play has no x/y and no game
    clock, and its text always says ''missed'' for field goals (the result is in the running score); see
    the divergence notes. Samples of 2026-10-12; x-unobserved = null in every full body.'
  title: East Asia Super League (EASL) sync API (UNOFFICIAL third-party proxy of Sportradar DataCore)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /health:
    get:
      description: 'Liveness probe of the sync server: status, message and a server timestamp. UNOFFICIAL
        third-party proxy: the host, its routes and its field names (for example `steak`, `facebook_username`)
        belong to the proxy''s author, not to Sportradar DataCore.'
      operationId: get_easl_health
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslHealth'
          description: Liveness probe of the sync server
      security: []
      summary: Liveness probe of the sync server
  /leaders:
    get:
      description: 'Tournament-wide top-5 player leaders per statistical category: an object with 9 category
        keys, each an array of up to 5 rows. Nine categories, up to five rows each. Verified by diffing
        seasons: every row echoes its season in `seasonId`.'
      operationId: get_easl_leaders
      parameters:
      - description: 'seasonId: the season whose leaders to list. Omitted = the active season.'
        example: 77441bb3-9759-11f0-b659-0561c09a0222
        in: query
        name: seasonId
        required: false
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslLeaders'
          description: Tournament-wide top-5 player leaders per category
      security: []
      summary: Tournament-wide top-5 player leaders per category
  /matches:
    get:
      description: 'Fixtures of one season, one row per game, unordered (not by date). Finished games
        are CONFIRMED with both scores; future ones SCHEDULED; unscheduled placeholders DRAFT with no
        competitors. `seasonId` is the only parameter. Verified by diffing seasons: 2023-24 returns 28
        fixtures, 2024-25 34, 2025-26 42, 2026-27 42, every row carrying the requested seasonId.'
      operationId: get_easl_matches
      parameters:
      - description: 'seasonId: the season whose fixtures to list. Omitted = the active season.'
        example: 77441bb3-9759-11f0-b659-0561c09a0222
        in: query
        name: seasonId
        required: false
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslFixtures'
          description: 'Fixtures of one season (default: the active season)'
      security: []
      summary: 'Fixtures of one season (default: the active season)'
  /matches/{fixtureId}:
    get:
      description: 'One fixture, the same shape as a /matches row. An unknown or malformed fixtureId answers
        500 {"error": "Internal Server Error"} (the sub-routes answer 200 with empty lists), so a 500
        here is final.'
      operationId: get_easl_matches__fixtureId
      parameters:
      - description: 'fixtureId: a DataCore fixture (game) UUID v1, `fixtureId` of a /matches row. A well-formed
          but unknown id answers 500 on /matches/{fixtureId} and 200 with an empty body on the sub-routes;
          a malformed id answers 500 everywhere.'
        example: a823ed1a-99e2-11f0-8d9c-69906d8f9f5f
        in: path
        name: fixtureId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslFixture'
          description: 'One fixture: teams, score, status, venue'
        '500':
          description: 'Unknown or malformed fixtureId: {"error": "Internal Server Error"}. Final, not
            retried.'
      security: []
      summary: 'One fixture: teams, score, status, venue'
  /matches/{fixtureId}/boxscore:
    get:
      description: 'Player box score of a finished game: {boxScore: one row per rostered player of both
        teams, teams: the two teams}. Players who did not play are listed with null statistics. Empty
        lists for unplayed or unknown games. In box-score rows the percentage columns are null when the
        player has no attempts (0 of 0), and assistsTurnoverRatio is null when he has no turnovers.'
      operationId: get_easl_matches__fixtureId__boxscore
      parameters:
      - description: 'fixtureId: a DataCore fixture (game) UUID v1, `fixtureId` of a /matches row. A well-formed
          but unknown id answers 500 on /matches/{fixtureId} and 200 with an empty body on the sub-routes;
          a malformed id answers 500 everywhere.'
        example: a823ed1a-99e2-11f0-8d9c-69906d8f9f5f
        in: path
        name: fixtureId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslBoxScore'
          description: Player box score of both teams
      security: []
      summary: Player box score of both teams
  /matches/{fixtureId}/playbyplay:
    get:
      description: 'Play-by-play of a finished game: {playbyplay: one row per event, teams: the two teams}.
        No x/y, no game clock; see the divergence notes. Empty lists for unplayed or unknown games. No
        x/y coordinates anywhere (no shot chart route exists on this proxy): shot locations are only the
        text modifiers ''in the paint'', ''fast break'' and so on.'
      operationId: get_easl_matches__fixtureId__playbyplay
      parameters:
      - description: 'fixtureId: a DataCore fixture (game) UUID v1, `fixtureId` of a /matches row. A well-formed
          but unknown id answers 500 on /matches/{fixtureId} and 200 with an empty body on the sub-routes;
          a malformed id answers 500 everywhere.'
        example: a823ed1a-99e2-11f0-8d9c-69906d8f9f5f
        in: path
        name: fixtureId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslPlayByPlay'
          description: Play-by-play event stream
      security: []
      summary: Play-by-play event stream
  /matches/{fixtureId}/teamstats:
    get:
      description: 'Team totals of a finished game: one row per team (two rows). [] for unplayed or unknown
        games. Two rows (one per team), each with a flat `statistics` object of about 110 keys. The `*Against`
        family (opponent''s figures) is absent from 2023-24 bodies; `timeoutsUsed` appears from 2025-26;
        `pointsFour*`, `foulsDisruptive`, `foulsFlagrant` and `foulsTechnicalCat1/2` are present only
        from 2026-27 and null.'
      operationId: get_easl_matches__fixtureId__teamstats
      parameters:
      - description: 'fixtureId: a DataCore fixture (game) UUID v1, `fixtureId` of a /matches row. A well-formed
          but unknown id answers 500 on /matches/{fixtureId} and 200 with an empty body on the sub-routes;
          a malformed id answers 500 everywhere.'
        example: a823ed1a-99e2-11f0-8d9c-69906d8f9f5f
        in: path
        name: fixtureId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslTeamStats'
          description: Team totals of both teams
      security: []
      summary: Team totals of both teams
  /matches/{fixtureId}/teamstats/by/period:
    get:
      description: 'Team totals of a finished game split by period: one row per team, with one `period_{n}`
        object per period played and the team. [] for unplayed or unknown games. Each team row holds `team`
        and one `period_{n}` object per period played: period_1..period_4 plus period_11 / period_12 for
        overtime (the Atrium embed numbers its first overtime 11 as well). The same key set as teamstats''
        statistics.'
      operationId: get_easl_matches__fixtureId__teamstats__by__period
      parameters:
      - description: 'fixtureId: a DataCore fixture (game) UUID v1, `fixtureId` of a /matches row. A well-formed
          but unknown id answers 500 on /matches/{fixtureId} and 200 with an empty body on the sub-routes;
          a malformed id answers 500 everywhere.'
        example: a823ed1a-99e2-11f0-8d9c-69906d8f9f5f
        in: path
        name: fixtureId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslTeamStatsByPeriod'
          description: Team totals of both teams per period
      security: []
      summary: Team totals of both teams per period
  /metadata/seasons:
    get:
      description: 'Every configured EASL season, one row per season (4 rows: 2023-24, 2024-25, 2025-26,
        2026-27), unordered. UNOFFICIAL third-party proxy: the host, its routes and its field names (for
        example `steak`, `facebook_username`) belong to the proxy''s author, not to Sportradar DataCore.'
      operationId: get_easl_metadata__seasons
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslSeasons'
          description: Every configured EASL season (DataCore season ids)
      security: []
      summary: Every configured EASL season (DataCore season ids)
  /players:
    get:
      description: Every player in the database (552 rows, all seasons; not paged) with biographical fields.
        With seasonId + teamId it is a roster and gains jerseyNumber and position. 552 players, all seasons,
        not paged. The unfiltered list has no position or jerseyNumber; with seasonId + teamId (a roster)
        those two columns appear.
      operationId: get_easl_players
      parameters:
      - description: 'seasonId: with teamId, returns that team''s players of the season (the roster, with
          jerseyNumber and position added). Alone it filters to the players of the season (188 rows for
          2026-27 against 552 unfiltered).'
        example: 77441bb3-9759-11f0-b659-0561c09a0222
        in: query
        name: seasonId
        required: false
        schema:
          format: uuid
          type: string
      - description: 'teamId: restricts to one team''s players; send it with seasonId for a roster.'
        example: 0548e9a7-99e0-11f0-9c0a-a1d6bfd6d57a
        in: query
        name: teamId
        required: false
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslPlayers'
          description: Every EASL player (all seasons)
      security: []
      summary: Every EASL player (all seasons)
  /players/{playerId}:
    get:
      description: One player's biography. Unknown id answers 200 {}.
      operationId: get_easl_players__playerId
      parameters:
      - description: 'playerId: a DataCore person UUID v1 (`personId` in a box score, `playerId` elsewhere).'
        example: 0d532bfc-9f65-11f0-8bb6-5d1ba9abdf0e
        in: path
        name: playerId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslPlayer'
          description: 'One player: biography'
      security: []
      summary: 'One player: biography'
  /players/{playerId}/stats:
    get:
      description: 'A player''s cumulative statistics (103 keys): season totals and per-game averages.
        The seasonId parameter is ignored (see the parameter). `seasonId` is IGNORED: the body is identical
        for every seasonId and for none (verified on 40 players across 2023-24, 2024-25 and 2025-26, and
        on one player across all four seasons). The figures are one cumulative line per player, so this
        route cannot be scoped to a season and is listed in the README''s unscoped routes.'
      operationId: get_easl_players__playerId__stats
      parameters:
      - description: 'playerId: a DataCore person UUID v1 (`personId` in a box score, `playerId` elsewhere).'
        example: 0d532bfc-9f65-11f0-8bb6-5d1ba9abdf0e
        in: path
        name: playerId
        required: true
        schema:
          format: uuid
          type: string
      - description: 'seasonId: accepted but IGNORED. The same body came back for all four seasons and
          for no seasonId at all (verified on 40 players across 2023-24, 2024-25 and 2025-26, and on one
          player across all four seasons and with none), so there is no season to scope; the figures do
          not vary with it.'
        example: 77441bb3-9759-11f0-b659-0561c09a0222
        in: query
        name: seasonId
        required: false
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslPlayerStats'
          description: A player's cumulative statistics
      security: []
      summary: A player's cumulative statistics
  /standings:
    get:
      description: 'Standings of one season: one row per team, grouped by pool (group), position 1-n within
        the pool. Verified by diffing seasons: 2023-24, 2024-25 and 2025-26 return different team sets
        and records. The body does not echo the season, so the capture ties it to the season by the teams
        (all played that season) and by lastFiveMatches dates inside the season''s start..end dates.'
      operationId: get_easl_standings
      parameters:
      - description: 'seasonId: the season whose standings to list. Omitted = the active season. Unknown
          = 404.'
        example: 77441bb3-9759-11f0-b659-0561c09a0222
        in: query
        name: seasonId
        required: false
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslStandings'
          description: 'Standings of one season (default: the active season)'
        '404':
          description: 'Unknown seasonId: {"error": "Season not found in DB"}.'
      security: []
      summary: 'Standings of one season (default: the active season)'
  /teams:
    get:
      description: 'Every ACTIVE team (12 rows on 2026-10-12: the current season''s teams). Historical
        teams are not listed; /teams/{teamId} still resolves them. Lists only the 12 ACTIVE (current-season)
        teams: 12 of the 24 teams that played since 2023 are missing. Use /teams/{teamId} for a historical
        team.'
      operationId: get_easl_teams
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslTeams'
          description: Every EASL team (all seasons)
      security: []
      summary: Every EASL team (all seasons)
  /teams/{teamId}:
    get:
      description: One team (resolves ACTIVE and INACTIVE teams). Resolves ACTIVE and INACTIVE teams;
        an unknown id answers 200 {}.
      operationId: get_easl_teams__teamId
      parameters:
      - description: 'teamId: a DataCore team (entity) UUID v1, the `teamId` of /teams, the `teamId` /
          `entityId` of a fixture competitor. /teams/{teamId} also resolves INACTIVE (historical) teams
          that /teams does not list.'
        example: 0548e9a7-99e0-11f0-9c0a-a1d6bfd6d57a
        in: path
        name: teamId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslTeam'
          description: One team
      security: []
      summary: One team
  /teams/{teamId}/leaders:
    get:
      description: 'A team''s top-5 player leaders per statistical category in one season: the same shape
        as /leaders. Same shape as /leaders, restricted to one team; every row echoes the season and the
        team.'
      operationId: get_easl_teams__teamId__leaders
      parameters:
      - description: 'teamId: a DataCore team (entity) UUID v1, the `teamId` of /teams, the `teamId` /
          `entityId` of a fixture competitor. /teams/{teamId} also resolves INACTIVE (historical) teams
          that /teams does not list.'
        example: 0548e9a7-99e0-11f0-9c0a-a1d6bfd6d57a
        in: path
        name: teamId
        required: true
        schema:
          format: uuid
          type: string
      - description: 'seasonId: the season whose team leaders to list. Omitted = the active season.'
        example: 77441bb3-9759-11f0-b659-0561c09a0222
        in: query
        name: seasonId
        required: false
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslTeamLeaders'
          description: A team's top-5 player leaders per category
      security: []
      summary: A team's top-5 player leaders per category
  /teams/{teamId}/matches:
    get:
      description: 'All fixtures of one team in one season (finished and scheduled), the same shape as
        a /matches row. Rows are the same as /matches rows (no per-row seasonId is needed: the capture
        compares the fixture ids with the season''s fixtures of that team).'
      operationId: get_easl_teams__teamId__matches
      parameters:
      - description: 'teamId: a DataCore team (entity) UUID v1, the `teamId` of /teams, the `teamId` /
          `entityId` of a fixture competitor. /teams/{teamId} also resolves INACTIVE (historical) teams
          that /teams does not list.'
        example: 0548e9a7-99e0-11f0-9c0a-a1d6bfd6d57a
        in: path
        name: teamId
        required: true
        schema:
          format: uuid
          type: string
      - description: 'seasonId: the season whose fixtures of this team to list. Omitted = the active season
          (only SCHEDULED fixtures before it starts).'
        example: 77441bb3-9759-11f0-b659-0561c09a0222
        in: query
        name: seasonId
        required: false
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslTeamFixtures'
          description: A team's fixtures in one season
      security: []
      summary: A team's fixtures in one season
  /teams/{teamId}/stats:
    get:
      description: 'A team''s cumulative statistics over one season''s finished games, as season totals
        and per-game averages (159 keys). {} when the team played no game that season. Verified by diffing
        seasons: the 2025-26 line has 8 games, the other seasons {} for Alvark Tokyo (who joined in 2025-26).'
      operationId: get_easl_teams__teamId__stats
      parameters:
      - description: 'teamId: a DataCore team (entity) UUID v1, the `teamId` of /teams, the `teamId` /
          `entityId` of a fixture competitor. /teams/{teamId} also resolves INACTIVE (historical) teams
          that /teams does not list.'
        example: 0548e9a7-99e0-11f0-9c0a-a1d6bfd6d57a
        in: path
        name: teamId
        required: true
        schema:
          format: uuid
          type: string
      - description: 'seasonId: REQUIRED in practice. Omitted, the body is {} (the default season has
          no finished game for most teams). A season the team did not play also answers {}.'
        example: 77441bb3-9759-11f0-b659-0561c09a0222
        in: query
        name: seasonId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaslTeamSeasonStats'
          description: A team's cumulative season statistics
      security: []
      summary: A team's cumulative season statistics
