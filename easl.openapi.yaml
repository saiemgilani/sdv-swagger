components:
  schemas:
    EaslBoxScore:
      description: 'Player box score of a finished game: {boxScore: one row per rostered player of both
        teams, teams: the two teams}. Players who did not play are listed with null statistics. Empty
        lists for unplayed or unknown games.'
      properties:
        boxScore:
          description: One row per rostered player of both teams (22 rows in a typical game). Players
            who did not play have null statistics.
          items:
            properties:
              bib:
                description: Jersey number as a string ('00' and '0' are distinct).
                type: string
              didNotPlayReason:
                description: 'Unobserved: null in every full body, so no type and no meaning is claimed.'
                x-unobserved: true
              entityId:
                description: 'The player''s team: DataCore team UUID v1 (key space: EASL teams; equals
                  teams[].teamId).'
                type: string
              fixtureId:
                description: 'fixtureId: DataCore fixture (game) UUID v1 (key space: EASL games; the {fixtureId}
                  of every /matches route).'
                type: string
              isPlayer:
                description: True on every row (team officials are never listed).
                type: boolean
              isTeamOfficial:
                description: False on every row.
                type: boolean
              personId:
                description: 'playerId: DataCore person UUID v1 (key space: EASL persons, the same id
                  as the box score''s `personId`; joins /players, leaders and play-by-play players). Not
                  a team id.'
                type: string
              player:
                description: The player's identity block.
                properties:
                  headshot:
                    description: Headshot URL on the DataCore asset CDN (size=800); null when no photo.
                      Absent on some rows.
                    type:
                    - string
                    - 'null'
                    x-absent-in-some-rows: true
                  nameFullLatin:
                    description: 'Alternative name: equal to nameFullLocal for 257 of 552 players, otherwise
                      null; never non-Latin in the observed data. Absent on some rows.'
                    type:
                    - string
                    - 'null'
                    x-absent-in-some-rows: true
                  nameFullLocal:
                    description: Player display name in 'FAMILY Given' form with the family name upper-cased
                      (OSAKABE Taiki), in Latin script. Absent on some rows.
                    type: string
                    x-absent-in-some-rows: true
                  playerId:
                    description: 'playerId: DataCore person UUID v1 (key space: EASL persons, the same
                      id as the box score''s `personId`; joins /players, leaders and play-by-play players).
                      Not a team id.'
                    type: string
                type: object
              position:
                description: 'Playing position: G, F, C, PG, SG, SF, PF or GF; 13 of 2,444 rows have none.
                  Null on some rows.'
                type:
                - string
                - 'null'
              starter:
                description: True for a starter (five per team).
                type: boolean
              statistics:
                description: The player's game statistics (about 70 keys); null counting stats for a player
                  who did not play.
                properties:
                  assists:
                    description: 'Assists: passes that directly lead to a made field goal. Null on some
                      rows.'
                    type:
                    - integer
                    - 'null'
                  assistsDefensive:
                    description: Defensive assists (DataCore column; meaning unverified). Null on some
                      rows.
                    type:
                    - integer
                    - 'null'
                  assistsTurnoverRatio:
                    description: Assists divided by turnovers (a ratio, not a percentage). Null on some
                      rows.
                    type:
                    - number
                    - 'null'
                  blocks:
                    description: Shots blocked (made by this player or team). Null on some rows.
                    type:
                    - integer
                    - 'null'
                  blocksReceived:
                    description: The team's or player's own shots that were blocked by an opponent. Null
                      on some rows.
                    type:
                    - integer
                    - 'null'
                  doubleDouble:
                    description: 'Double-double flag: 1 when exactly two of points, rebounds, assists,
                      steals, blocks reached 10 in the game, else 0 (a triple-double is counted in tripleDouble
                      instead). In a season line it is a count of such games.'
                    type: integer
                  dunks:
                    description: Dunks made. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  efficiency:
                    description: 'NBA-style efficiency: points + rebounds + assists + steals + blocks
                      - missed field goals - missed free throws - turnovers (verified on all 2,143 played
                      player-games).'
                    type: integer
                  efficiencyCustom:
                    description: Custom efficiency slot (DataCore column; meaning unverified). Null on
                      some rows.
                    type:
                    - integer
                    - 'null'
                  fieldGoalsAttempted:
                    description: Field goals attempted (2- and 3-point shots; free throws excluded). Null
                      on some rows.
                    type:
                    - integer
                    - 'null'
                  fieldGoalsEffectivePercentage:
                    description: 'Effective field-goal percentage on a 0-100 scale: (FGM + 0.5 x 3PM)
                      / FGA x 100; can exceed 100 on small samples. Null on some rows.'
                    type:
                    - number
                    - 'null'
                  fieldGoalsMade:
                    description: Field goals made (2- and 3-point shots). Null on some rows.
                    type:
                    - integer
                    - 'null'
                  fieldGoalsPercentage:
                    description: Field-goal percentage on a 0-100 scale (made / attempted x 100). Null
                      on some rows.
                    type:
                    - number
                    - 'null'
                  foulsCoachDisqualifying:
                    description: Disqualifying fouls on the coach. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  foulsCoachTechnical:
                    description: Technical fouls on the coach. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  foulsDisqualifying:
                    description: Disqualifying fouls. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  foulsDisruptive:
                    description: Disruptive fouls (DataCore column; filled from 2026-27). Null on some
                      rows.
                    type:
                    - integer
                    - 'null'
                  foulsDrawn:
                    description: Fouls drawn (committed against this player or team by an opponent). Null
                      on some rows.
                    type:
                    - integer
                    - 'null'
                  foulsFlagrant:
                    description: Flagrant fouls (DataCore column; filled from 2026-27). Null on some rows.
                    type:
                    - integer
                    - 'null'
                  foulsOffensive:
                    description: Offensive fouls committed. Counted separately from foulsPersonal. Null
                      on some rows.
                    type:
                    - integer
                    - 'null'
                  foulsPersonal:
                    description: Personal fouls committed (offensive, technical and unsportsmanlike fouls
                      are separate columns). Null on some rows.
                    type:
                    - integer
                    - 'null'
                  foulsTechnical:
                    description: Technical fouls committed by the player or team. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  foulsTechnicalCat1:
                    description: Technical fouls of category 1 (DataCore column; filled from 2026-27).
                      Null on some rows.
                    type:
                    - integer
                    - 'null'
                  foulsTechnicalCat2:
                    description: Technical fouls of category 2 (DataCore column; filled from 2026-27).
                      Null on some rows.
                    type:
                    - integer
                    - 'null'
                  foulsTotal:
                    description: 'Fouls charged in total: personal + technical + unsportsmanlike + offensive
                      (matches 2,142 of 2,143 played player-games; the exception is unexplained).'
                    type: integer
                  foulsUnsportsmanlike:
                    description: Unsportsmanlike fouls committed. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  freeThrowsAttempted:
                    description: Free throws attempted. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  freeThrowsMade:
                    description: Free throws made.
                    type: integer
                  freeThrowsPercentage:
                    description: Free-throw percentage on a 0-100 scale. Null on some rows.
                    type:
                    - number
                    - 'null'
                  indexOfSuccess:
                    description: 'Index of success: efficiency + fouls drawn - personal fouls - technical
                      fouls - blocks received (verified on all 2,143 played player-games). It differs
                      from pir only in which fouls it subtracts.'
                    type: integer
                  maxAssists:
                    description: 'Highest assists in a single game: in a game row it equals assists; in
                      a season line it is the best game. Null on some rows.'
                    type:
                    - integer
                    - 'null'
                  maxFreeThrowsMade:
                    description: Highest free throws made in a single game (equals freeThrowsMade in a
                      game row).
                    type: integer
                  maxPoints:
                    description: Highest points in a single game (equals points in a game row).
                    type: integer
                  maxPointsFourMade:
                    description: Highest 4-point shots made in a game (DataCore column; EASL has no 4-point
                      line; filled from 2026-27). Null on some rows.
                    type:
                    - integer
                    - 'null'
                  maxPointsThreeMade:
                    description: Highest 3-pointers made in a single game. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  maxPointsTwoMade:
                    description: Highest 2-pointers made in a single game. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  maxRebounds:
                    description: Highest rebounds in a single game. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  maxReboundsDefensive:
                    description: Highest defensive rebounds in a single game. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  maxReboundsOffensive:
                    description: Highest offensive rebounds in a single game. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  maxSteals:
                    description: Highest steals in a single game. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  minus:
                    description: Points the opponents scored while the player was on the court. Null on
                      some rows.
                    type:
                    - integer
                    - 'null'
                  minutes:
                    description: Playing time as an ISO 8601 duration PT{m}M{s}S with the minutes NOT
                      wrapped at 60 (PT27M53S; a team's is the sum of its players', PT200M for a 40-minute
                      game, PT250M with one overtime). Null on some rows.
                    type:
                    - string
                    - 'null'
                  pir:
                    description: 'Performance index rating: efficiency + fouls drawn - total fouls - blocks
                      received (verified on all 2,143 played player-games).'
                    type: integer
                  plus:
                    description: Points the player's team scored while he was on the court. Null on some
                      rows.
                    type:
                    - integer
                    - 'null'
                  plusMinus:
                    description: 'plus - minus: the team''s point margin while the player was on the court.
                      Null on some rows.'
                    type:
                    - integer
                    - 'null'
                  points:
                    description: Points scored.
                    type: integer
                  pointsFastBreak:
                    description: Points scored on fast breaks. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsFastBreakAttempted:
                    description: Fast-break field goals attempted. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsFastBreakMade:
                    description: Fast-break field goals made. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsFourAttempted:
                    description: 4-point shots attempted (DataCore column; EASL has no 4-point line; filled
                      from 2026-27). Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsFourMade:
                    description: 4-point shots made (see pointsFourAttempted). Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsFourPercentage:
                    description: 'Unobserved: null in every full body, so no type and no meaning is claimed.'
                    x-unobserved: true
                  pointsFromTurnover:
                    description: Points scored off opponent turnovers. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsInThePaint:
                    description: Points scored in the paint. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsInThePaintAttempted:
                    description: Field goals attempted in the paint. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsInThePaintMade:
                    description: Field goals made in the paint. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsSecondChance:
                    description: Points scored on second-chance possessions (after an offensive rebound).
                      Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsSecondChanceAttempted:
                    description: Second-chance field goals attempted. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsSecondChanceMade:
                    description: Second-chance field goals made. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsThreeAttempted:
                    description: 3-point field goals attempted. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsThreeMade:
                    description: 3-point field goals made. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsThreePercentage:
                    description: 3-point percentage on a 0-100 scale. Null on some rows.
                    type:
                    - number
                    - 'null'
                  pointsTwoAttempted:
                    description: 2-point field goals attempted. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsTwoMade:
                    description: 2-point field goals made. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  pointsTwoPercentage:
                    description: 2-point percentage on a 0-100 scale. Null on some rows.
                    type:
                    - number
                    - 'null'
                  powerPlayPoints:
                    description: Power-play points (an ice-hockey column; meaning in basketball unverified).
                      Null on some rows.
                    type:
                    - integer
                    - 'null'
                  powerPlayPointsAwarded:
                    description: Power-play points awarded (an ice-hockey column; meaning in basketball
                      unverified). Null on some rows.
                    type:
                    - integer
                    - 'null'
                  rebounds:
                    description: 'Total rebounds: offensive + defensive. Team''s totals include team rebounds.
                      Null on some rows.'
                    type:
                    - integer
                    - 'null'
                  reboundsDefensive:
                    description: Defensive rebounds. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  reboundsDefensivePercentage:
                    description: Share of available defensive rebounds taken while on the court, on a
                      0-100 scale; values above 100 (up to 108.9) occur, so the definition is unverified.
                      Null on some rows.
                    type:
                    - number
                    - 'null'
                  reboundsOffensive:
                    description: Offensive rebounds. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  reboundsOffensivePercentage:
                    description: Share of available offensive rebounds taken while on the court, 0-100
                      scale (up to 91.4 observed); definition unverified. Null on some rows.
                    type:
                    - number
                    - 'null'
                  reboundsPercentage:
                    description: Share of all available rebounds taken while on the court, 0-100 scale;
                      definition unverified. Null on some rows.
                    type:
                    - number
                    - 'null'
                  steals:
                    description: Steals. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  tripleDouble:
                    description: 'Triple-double flag: 1 when three or more of points, rebounds, assists,
                      steals, blocks reached 10, else 0.'
                    type: integer
                  trueShootingAttempts:
                    description: 'Unobserved: null in every full body, so no type and no meaning is claimed.'
                    x-unobserved: true
                  trueShootingPercentage:
                    description: 'Unobserved: null in every full body, so no type and no meaning is claimed.'
                    x-unobserved: true
                  turnovers:
                    description: Turnovers committed by players. Null on some rows.
                    type:
                    - integer
                    - 'null'
                  turnoversPercentage:
                    description: 'Unobserved: null in every full body, so no type and no meaning is claimed.'
                    x-unobserved: true
                  usageRate:
                    description: 'Usage rate on a 0-100 scale: share of the team''s possessions used while
                      on the court (up to 136 observed); definition unverified. Null on some rows.'
                    type:
                    - number
                    - 'null'
                type: object
            type: object
          type: array
        teams:
          description: The two teams of the game, in the order of the fixture's competitors.
          items:
            properties:
              logo:
                description: Club logo URL on the Sportradar DataCore asset CDN (images.dc.connect.sportradar.com/b1e0z/...).
                type: string
              nameFullLatin:
                description: 'Alternative name: the native-script name of some Japanese clubs (for example
                  宇都宮ブレックス for Utsunomiya Brex), blank for most clubs; for players it usually equals nameFullLocal.
                  Despite the field name it is not always Latin script. Null on some rows.'
                type:
                - string
                - 'null'
              nameFullLocal:
                description: Display name. Despite the field name this is the English / Latin-script name
                  used on the league site.
                type: string
              teamId:
                description: 'teamId: DataCore team (entity) UUID v1 (key space: EASL teams, the same
                  id as `entityId`; joins /teams, /standings team.id, fixture competitors, box and play-by-play
                  teams). Not a player id.'
                type: string
            type: object
          type: array
      type: object
    EaslFixture:
      description: One fixture, the same shape as a /matches row.
      properties:
        attendance:
          description: Announced attendance of the game; null when not recorded.
          type:
          - integer
          - 'null'
        broadcasts:
          description: 'Unobserved: null in every full body, so no type and no meaning is claimed.'
          x-unobserved: true
        competitors:
          description: 'The two teams of the game, in an arbitrary order (home first in 72 fixtures, away
            first in 68): use isHome. Empty on DRAFT fixtures.'
          items:
            properties:
              codeLatin:
                description: Three-letter club code (for example BRE); null or empty for some clubs.
                type:
                - string
                - 'null'
              codeLocal:
                description: Alternative three-letter club code (for example TPP); null for most clubs.
                  A club may have only one of codeLatin / codeLocal.
                type:
                - string
                - 'null'
              draw:
                description: 'True when the game has no winner YET or ever: true on every unplayed competitor,
                  false on every finished one (a tie has never happened).'
                type: boolean
              entityId:
                description: 'The team''s DataCore entity UUID v1: always equal to teamId.'
                type: string
              isHome:
                description: True for the home side; neutral-site games still name one team home.
                type: boolean
              logo:
                description: Club logo URL on the Sportradar DataCore asset CDN (images.dc.connect.sportradar.com/b1e0z/...).
                type: string
              nameFullLatin:
                description: 'Alternative name: the native-script name of some Japanese clubs (for example
                  宇都宮ブレックス for Utsunomiya Brex), blank for most clubs; for players it usually equals nameFullLocal.
                  Despite the field name it is not always Latin script. Null on some rows.'
                type:
                - string
                - 'null'
              nameFullLocal:
                description: Display name. Despite the field name this is the English / Latin-script name
                  used on the league site.
                type: string
              primaryColor:
                description: Club colour as a 6-digit hex string without '#'; '000000' is a placeholder
                  on several clubs. Null on some rows.
                type:
                - string
                - 'null'
              resultPlace:
                description: 'Result place: 1 = winner, 2 = loser; null before the game is played.'
                type: integer
              score:
                description: Final score as a numeric STRING ('84'); null before the game is played.
                type: string
              secondaryColor:
                description: Club colour as a 6-digit hex string without '#'; '000000' is a placeholder
                  on several clubs. Null on some rows.
                type:
                - string
                - 'null'
              teamId:
                description: 'teamId: DataCore team (entity) UUID v1 (key space: EASL teams, the same
                  id as `entityId`; joins /teams, /standings team.id, fixture competitors, box and play-by-play
                  teams). Not a player id.'
                type: string
              tertiaryColor:
                description: Club colour as a 6-digit hex string without '#'; '000000' is a placeholder
                  on several clubs. Null on some rows.
                type:
                - string
                - 'null'
            type: object
          type: array
        endTimeActualUTC:
          description: 'Unobserved: null in every full body, so no type and no meaning is claimed.'
          x-unobserved: true
        fixtureId:
          description: 'fixtureId: DataCore fixture (game) UUID v1 (key space: EASL games; the {fixtureId}
            of every /matches route).'
          type: string
        fixtureNumber:
          description: 'Fixture number YYSSNNN: two-digit start year, two-digit end year, three-digit
            sequence (2627001 = first game of 2026-27, 2526003 = third of 2025-26). Null on every 2023-24
            fixture.'
          type:
          - integer
          - 'null'
        fixtureType:
          description: REGULAR (group stage), PLAYOFF (quarter- and semifinals) or FINAL (championship
            and third-place games). Missing from the DRAFT placeholders.
          type: string
        liveDataAvailable:
          description: Whether live stats were collected for the game (present on a minority of fixtures;
            meaning unverified). Absent on some rows.
          type: boolean
          x-absent-in-some-rows: true
        liveVideoAvailable:
          description: Whether live video was available (false on all 146 fixtures of the four seasons).
          type: boolean
        nameLatin:
          description: 'Unobserved: null in every full body, so no type and no meaning is claimed.'
          x-unobserved: true
        nameLocal:
          description: Fixture name for special games ('EASL Championship', 'Semifinals 2', 'EASL Tip-Off
            2026 Cebu'); null for ordinary group games.
          type:
          - string
          - 'null'
        pool:
          description: Pool (group) of the game.
          properties:
            abb:
              description: Pool abbreviation (A, B, C); null or 'N/A' for the placeholder pool.
              type: string
            id:
              description: 'Pool id: a 30-character hex string; null for playoff games (''Unknown Pool'').'
              type:
              - string
              - 'null'
            name:
              description: 'Pool name: ''Group A'', ''Group B'', ''Group C'' or the placeholder ''Unknown
                Pool''.'
              type: string
          type: object
        poolCode:
          description: 'Pool (group) id: a 30-character hex string, equal to pool.id; null on playoff
            and DRAFT fixtures.'
          type:
          - string
          - 'null'
        roundNumber:
          description: 'Unobserved: null in every full body, so no type and no meaning is claimed.'
          x-unobserved: true
        stage:
          description: Stage of the competition; empty on DRAFT fixtures.
          type: object
        startTimeActualUTC:
          description: 'Unobserved: null in every full body, so no type and no meaning is claimed.'
          x-unobserved: true
        startTimeLocal:
          description: Scheduled tip-off in the venue's local time, 'YYYY-MM-DDTHH:MM:SS' with no zone
            (19:10 local = 10:10 UTC in Tokyo). DRAFT fixtures carry a date at 00:00:00.
          type: string
        startTimeUTC:
          description: Scheduled tip-off in UTC, 'YYYY-MM-DDTHH:MM:SS' with no zone marker; null on DRAFT
            fixtures.
          type: string
        status:
          description: CONFIRMED = finished with a final box score; SCHEDULED = future; DRAFT = a placeholder
            with no teams or time.
          type: string
        venue:
          description: Arena of the game; empty on DRAFT fixtures.
          properties:
            abbreviationLatin:
              description: 'Unobserved: null in every full body, so no type and no meaning is claimed.'
              x-unobserved: true
            abbreviationLocal:
              description: 'Unobserved: null in every full body, so no type and no meaning is claimed.'
              x-unobserved: true
            address:
              description: Venue address (city and, for some, state); empty on some rows. Absent on some
                rows.
              properties:
                city:
                  description: City of the arena.
                  type: string
                state:
                  description: State or province of the arena (Philippine games, for example Cebu).
                  type: string
              type: object
              x-absent-in-some-rows: true
            alternateNameLatin:
              description: 'Unobserved: null in every full body, so no type and no meaning is claimed.'
              x-unobserved: true
            alternateNameLocal:
              description: 'Unobserved: null in every full body, so no type and no meaning is claimed.'
              x-unobserved: true
            countryCode:
              description: 'ISO 3166-1 alpha-3 country code of the arena: JPN, TWN, PHL, KOR, MAC, HKG,
                MNG, CHN; null on DRAFT fixtures.'
              type: string
            nameLatin:
              description: Venue name in Latin script; null on most rows.
              type:
              - string
              - 'null'
            nameLocal:
              description: Arena name.
              type: string
          type: object
      type: object
    EaslFixtures:
      description: Fixtures of one season, one row per game, unordered (not by date). Finished games are
        CONFIRMED with both scores; future ones SCHEDULED; unscheduled placeholders DRAFT with no competitors.
      items:
        properties:
          attendance:
            description: Announced attendance of the game; null when not recorded.
            type:
            - integer
            - 'null'
          broadcasts:
            description: 'Unobserved: null in every full body, so no type and no meaning is claimed.'
            x-unobserved: true
          competitors:
            description: 'The two teams of the game, in an arbitrary order (home first in 72 fixtures,
              away first in 68): use isHome. Empty on DRAFT fixtures.'
            items:
              properties:
                codeLatin:
                  description: Three-letter club code (for example BRE); null or empty for some clubs.
                  type:
                  - string
                  - 'null'
                codeLocal:
                  description: Alternative three-letter club code (for example TPP); null for most clubs.
                    A club may have only one of codeLatin / codeLocal.
                  type:
                  - string
                  - 'null'
                draw:
                  description: 'True when the game has no winner YET or ever: true on every unplayed competitor,
                    false on every finished one (a tie has never happened).'
                  type: boolean
                entityId:
                  description: 'The team''s DataCore entity UUID v1: always equal to teamId.'
                  type: string
                isHome:
                  description: True for the home side; neutral-site games still name one team home.
                  type: boolean
                logo:
                  description: Club logo URL on the Sportradar DataCore asset CDN (images.dc.connect.sportradar.com/b1e0z/...).
                  type: string
                nameFullLatin:
                  description: 'Alternative name: the native-script name of some Japanese clubs (for example
                    宇都宮ブレックス for Utsunomiya Brex), blank for most clubs; for players it usually equals
                    nameFullLocal. Despite the field name it is not always Latin script. Null on some
                    rows.'
                  type:
                  - string
                  - 'null'
