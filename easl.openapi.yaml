    EaslPlayByPlay:
      description: 'Play-by-play of a finished game: {playbyplay: one row per event, teams: the two teams}.
        No x/y, no game clock; see the divergence notes. Empty lists for unplayed or unknown games.'
      properties:
        playbyplay:
          description: Events of the game in delivered order (not by sequence; the array order is the
            one whose running score never falls).
          items:
            properties:
              description:
                description: 'Event text. Shots read ''<2pt|3pt> <shot type> missed[ (modifier)]'' for
                  EVERY field-goal attempt, made or not: the word ''missed'' is always there and the result
                  is the change of `scores` (see the divergence notes). Shot types: Jump shot, Layup,
                  Driving layup, Pull-up jump shot, Floating jump shot, Tip-in, Fadeaway, Step-back jump
                  shot, Turnaround jump shot, Hook shot, Dunk, Reverse layup, Alley-oop, Alley-oop dunk,
                  Euro step (none on 23 rows: ''3pt missed''). Modifiers: in the paint, second chance,
                  from turnover, fast break, blocked. Free throws read ''Free throw K of M made'' (M =
                  1, 2 or 3) for every attempt, also always ''made''. Other events (complete list): Assist;
                  Block; Steal; Substitution in; Substitution out; Defensive rebound; Defensive rebound
                  (team); Offensive rebound; Offensive rebound (team); Foul; Foul (N FT); Foul drawn;
                  Foul drawn (N FT); Personal foul; Personal foul (N FT); Personal foul (shooting); Personal
                  foul (shooting) (N FT); Offensive foul; Offensive foul (charge); Technical foul; Technical
                  foul (N FT); Bench technical foul; Bench technical foul (N FT); Coach technical foul;
                  Coach technical foul (N FT); Unsportsmanlike foul; Unsportsmanlike foul (N FT); Disqualifying
                  foul (N FT); Jump ball won; Jump ball won (held ball); Jump ball lost; Full timeout;
                  Short timeout; Media timeout; Commercial timeout; Officials timeout; Officials timeout
                  (mandatory); Coach''s challenge (pending); Coach''s challenge (complete) - upheld; Coach''s
                  challenge (complete) - overturned; Instant replay review (complete) - upheld; Instant
                  replay review (complete) - overturned; Turnover - Bad pass; Ball handling; Traveling;
                  Out of bounds; Offensive; Backcourt violation; Double dribble; Carrying; Offensive goaltending;
                  3 second violation; 5 second violation; 5 second violation (team); 8 second violation
                  (team); Shot clock violation (team); Other; Other (team). N FT = free throws awarded.'
                type: string
              eventTime:
                description: When the event was logged, wall-clock 'YYYY-MM-DDTHH:MM:SS.mmm' in UTC with
                  no zone marker. There is NO game clock (time remaining) in this feed.
                type: string
              periodId:
                description: 'Period: 1-4 regulation, 11 = first overtime (12 = second overtime appears
                  in team totals).'
                type: integer
              player:
                description: The acting player; an EMPTY object for team events (team rebounds, team turnovers,
                  timeouts, challenges).
                properties:
                  jerseyNumber:
                    description: Jersey number as a string; null on one event. Absent on some rows.
                    type:
                    - string
                    - 'null'
                    x-absent-in-some-rows: true
                  nameFullLatin:
                    description: 'Alternative name: equal to nameFullLocal for 257 of 552 players, otherwise
                      null; never non-Latin in the observed data. Absent on some rows.'
                    type:
                    - string
                    - 'null'
                    x-absent-in-some-rows: true
                  nameFullLocal:
                    description: Player display name in 'FAMILY Given' form with the family name upper-cased
                      (OSAKABE Taiki), in Latin script. Absent on some rows.
                    type: string
                    x-absent-in-some-rows: true
                  playerId:
                    description: 'playerId: DataCore person UUID v1 (key space: EASL persons, the same
                      id as the box score''s `personId`; joins /players, leaders and play-by-play players).
                      Not a team id. Absent on some rows.'
                    type: string
                    x-absent-in-some-rows: true
                type: object
              receivedTime:
                description: 'When the event was received upstream, Unix epoch MILLISECONDS (UTC): a median
                  1.6 s after eventTime (5th to 95th percentile -0.6 s to +55 s over 30,874 events); meaning
                  unverified.'
                type: integer
              scores:
                additionalProperties:
                  description: Points of the team whose DataCore team UUID is the key. The key is one
                    of the two teams[].teamId values.
                  type: integer
                description: 'Running score of the game keyed by team id, as of the event. It lags the
                  true score on a minority of events: the final event''s score falls short of the final
                  result in 18 of 106 games.'
                type: object
              sequence:
                description: 'Event sequence number from the scorer''s system: NOT in game order (the
                  delivered array order is), and not always unique within a game (35 of 106 games repeat
                  values).'
                type: integer
              teamId:
                description: 'teamId: DataCore team (entity) UUID v1 (key space: EASL teams, the same
                  id as `entityId`; joins /teams, /standings team.id, fixture competitors, box and play-by-play
                  teams). Not a player id. The acting team; null on media, commercial and officials timeouts.'
