openapi: 3.1.0
info:
  title: PGA TOUR orchestrator GraphQL API (unofficial)
  version: '2026-11-25'
  description: 'The GraphQL API behind www.pgatour.com: schedules, leaderboards, hole-by-hole and shot-level
    scoring, tee times, fields, course and hole stats, players, season stats and the points race, for
    every PGA TOUR-operated tour. Each GraphQL operation is one `POST /graphql`; paths are keyed `/graphql#<Operation>`
    so each operation is its own OpenAPI operation -- the fragment is never sent. Documents are built
    from live introspection (`pgatour/schema/schema.graphql`); response schemas from committed captures
    typed by that schema. Every request needs an `x-api-key` header. The key is the public one www.pgatour.com''s
    own frontend ships in its Next.js `_app` bundle (site config `api.prod.apiKey`); `tools/pgatour_api.py`
    discovers it at run time and honours a `PGA_API_KEY` override. No key is committed anywhere. Without
    the header the CloudFront edge answers HTTP 503 (`x-cache: LambdaExecutionError`); on 2026-11-25 the
    edge accepted any `da2-` value, so presence, not value, was checked -- do not rely on that. `*Compressed`
    operations return `{id, payload}` where `payload` is base64 text of a gzip stream of the JSON the
    uncompressed sibling type would return (same fields, plus `__typename`). Decode: `json.loads(gzip.decompress(base64.b64decode(payload)))`.
    AWS AppSync behind CloudFront. No rate-limit headers are sent; a sequential capture at 1 request/second
    (33 requests) saw no 429 and no 5xx beyond the deliberate no-key probe. Keep it gentle. Unofficial
    and undocumented; PGA TOUR data is proprietary -- wrap-only, never republished as release assets.
    Captures here are 3-row documentation excerpts.'
servers:
- url: https://orchestrator.pgatour.com
  description: Production (AppSync via CloudFront)
tags:
- name: schedule
  description: Seasons, schedules and tournament headers.
- name: tournament
  description: 'Tournament-level resources: tee times, field, past results, course and hole stats.'
- name: scoring
  description: Leaderboards, scorecards and shot-level detail.
- name: players
  description: Player directory, bios and career results.
- name: stats
  description: Season stat tables and the points race.
paths:
  /graphql#ScheduleYears:
    post:
      operationId: ScheduleYears
      summary: Seasons with a published schedule for a tour.
      description: 'Seasons with a published schedule for a tour. GraphQL root field `scheduleYears` (ScheduleYears!).
        Document: `pgatour/queries/ScheduleYears.graphql`. Rows documented at `years`.'
      tags:
      - schedule
      x-graphql-operation: ScheduleYears
      x-graphql-root-field: scheduleYears
      x-graphql-document: |
        # Seasons with a published schedule for a tour.
        # Generated by pgatour/tools/build_documents.py from schema/schema.graphql; do not hand-edit.
        query ScheduleYears($tourCode: TourCode!) {
          scheduleYears(tourCode: $tourCode) {
            years {
              default
              displayValue
              queryValue
            }
          }
        }
      security:
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              - variables
              properties:
                operationName:
                  type: string
                  const: ScheduleYears
                query:
                  type: string
                  description: The GraphQL document (x-graphql-document).
                variables:
                  type: object
                  properties:
                    tourCode:
                      type: string
                      enum:
                      - C
                      - E
                      - H
                      - I
                      - M
                      - R
                      - S
                      - U
                      - Y
                      description: Tour code (R = PGA TOUR, S = Champions, H = Korn Ferry).
                      x-graphql-type: TourCode!
                  required:
                  - tourCode
                  additionalProperties: false
            example:
              operationName: ScheduleYears
              query: |
                # Seasons with a published schedule for a tour.
                # Generated by pgatour/tools/build_documents.py from schema/schema.graphql; do not hand-edit.
                query ScheduleYears($tourCode: TourCode!) {
                  scheduleYears(tourCode: $tourCode) {
                    years {
                      default
                      displayValue
                      queryValue
                    }
                  }
                }
              variables:
                tourCode: R
      responses:
        '200':
          description: GraphQL response. A failed operation is still HTTP 200 with `data` null (or the
            root field null) and `errors` set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type:
                    - object
                    - 'null'
                    properties:
                      scheduleYears:
                        $ref: '#/components/schemas/ScheduleYears'
                  errors:
                    $ref: '#/components/schemas/GraphQLErrors'
        '503':
          description: 'No x-api-key header: the CloudFront edge function fails (x-cache: LambdaExecutionError)
            and no body is returned.'
