x-league-ids:
  '1': National League (NL)
  '10': 2nd Liga
  '100': MyHockey League
  '101': SWHL C
  '104': SWHL D
  '113': U21-Elit
  '114': U21-Top
  '115': U21-A
  '116': U18-Elit
  '117': U18-Top
  '118': U18-A
  '119': U16-Elit
  '120': U16-Top
  '121': U16-A
  '122': U14-Elit
  '18': 3rd Liga
  '19': 4th Liga
  '2': Swiss League (SL)
  '3': 1st Liga
  '33': Seniors A
  '35': Seniors B
  '36': Seniors C
  '37': Seniors D
  '39': Veterans A
  '40': Veterans B
  '41': Division 50+
  '42': PostFinance Women's League
  '43': SWHL B
  '90': National Cup Men (tournament 11)
x-tournament-ids:
  '1': Championship (Meisterschaft); confirmed from gameDetail.tournament
  '10': National-team games; inferred (Switzerland U16 teams appeared)
  '11': Cup; confirmed, uses league 90
  '8': Unknown; no 2026 data (unverified)
