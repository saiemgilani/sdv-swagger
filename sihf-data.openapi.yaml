info:
  description: 'Swiss Ice Hockey Federation statistics backend behind sihf.ch: National League (league
    1), Swiss League (league 2) and the other Swiss leagues. Keyless. `/cache300` and `/table` answer
    identical payloads (cache300 sends max-age=300 on current-season bodies); `/gameoverview` serves one
    game. Each `alias` is modelled as its own operation under a fragment-suffixed path (`/cache300#teamGoal`);
    the fragment is documentation only. Table rows are positional arrays described by `header`. Season
    tables carry NO player id, only the name; the join key is the SIHF licence number, which equals the
    nationalleague.ch playerId (gameDetail carries it). Shapes from committed captures in sihf/captures/
    (NL 2025/26, captured 2026-10-12). Not official or supported.'
  title: SIHF statistics API (data.sihf.ch)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /cache300#goalkeeper:
    get:
      description: 'Wire request: `GET /cache300?alias=goalkeeper&...` (or `/table`, same payload).'
      operationId: cache300_goalkeeper
      parameters:
      - description: 'Selects the table. An unknown alias answers 200 {"stub": true, "data": []}.'
        example: goalkeeper
        in: query
        name: alias
        required: true
        schema:
          const: goalkeeper
          type: string
      - description: '`<tournamentIds>/<seasonRange>/<leagueIds>`, each a comma list (see x-tournament-ids,
          x-league-ids). Keep the season segment empty and pick the season with filterBy=Season. The league
          must be the last segment: as a League filter the current season answers 400 MissingLeagueId.
          An unknown league answers one [''Keine Tabelle gefunden!''] row.'
        example: 1//1
        in: query
        name: searchQuery
        required: true
        schema: &id001
          type: string
      - description: Comma list of filter names (Season, Date, Phase, League, Licence, Region, Team),
          matched in order by filterQuery. A filterQuery value without its filterBy name is ignored (the
          current season is served).
        example: Season
        in: query
        name: filterBy
        required: false
        schema: &id002
          type: string
      - description: 'Slash list of values in filterBy order. Season is the END year (2026 = 2025/26),
          2009 (2008/09) onward; the Season filter also lists a bogus `1047`, which (like any unknown
          season) is silently answered with the current season, so check the body''s Season filter `selected`.
          Phase ids change every season (NL regular season: 4940 in 2026, 657 in 2027); read them from
          the Phase filter `entries` (filterBy=Season,Phase&filterQuery=<season>/). Date is `dd.mm.yyyy-dd.mm.yyyy`.'
        example: '2026'
        in: query
        name: filterQuery
        required: false
        schema: &id003
          type: string
      - description: UI language. Header descriptions stay German with `en`.
        example: en
        in: query
        name: language
        required: false
        schema: &id004
          enum:
          - de
          - fr
          - it
          - en
          type: string
      - &id005
        description: Rows per page. Without it every row is returned and `pages` equals the row count.
        in: query
        name: take
        required: false
        schema:
          type: integer
      - &id006
        description: Zero-based PAGE index, not a row offset (take=10&skip=1 answers selectedPage 2, rows
          11-20).
        in: query
        name: skip
        required: false
        schema:
          type: integer
      - &id007
        description: 'JSONP: wraps the body as `/**/ typeof x === ''function'' && x({...})` with content-type
          application/javascript. Omit it for plain application/json.'
        in: query
        name: callback
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cache300Goalkeeper'
          description: OK
      summary: Goalkeeper summary
      tags:
      - goalkeeper
      x-pagination:
        request:
        - take
        - skip
        style: page index
        verified: 2026-10-12 (take=10&skip=1 -> selectedPage 2)
  /cache300#goalkeeperShootout:
    get:
