components:
  schemas:
    Cache300Goalkeeper:
      properties:
        alias:
          type: string
        availableExports:
          items:
            type: string
          type: array
        data:
          description: Rows; each row is a positional array whose cells follow `header` order.
          items:
            maxItems: 14
            minItems: 14
            prefixItems:
            - description: 'Rank; empty on the league-average row. (DE: R: Rang)'
              title: rank
              type: string
            - description: 'Player name, ''Last First''. No player id in season tables. (DE: Spieler:
                Spielername)'
              title: player
              type: string
            - description: 'Team cell {id, name, acronym, signed, type: ''team''}. On the league-average
                row it is only {name: ''Durchschnitt''} (the other keys are absent). (DE: Team: Teamname)'
              properties:
                acronym:
                  type: string
                id:
                  type: integer
                name:
                  type: string
                signed:
                  type: boolean
                type:
                  type: string
              title: team
              type: object
            - description: 'Games played. (DE: GP: Gespielte Spiele)'
              title: gamesPlayed
              type: string
            - description: 'Games started as goalkeeper (GPI). (DE: GPI: Spiele als 1. Torhüter)'
              title: firstKeeper
              type: string
            - description: 'Goals against. (DE: GA: Tore erhalten)'
              title: goalsAgainst
              type: string
            - description: 'Goals against per 60 minutes. (DE: GAA: Erhaltene Tore pro 60 Minuten)'
              title: goalsAgainstAverage
              type: string
            - description: 'Shots on goal against. (DE: SA: Erhaltene Schüsse aufs Tor)'
              title: shotsAgainst
              type: string
            - description: 'Saves. (DE: SVS: Schüsse gehalten)'
              title: saves
              type: string
            - description: 'Save percentage (0-100). (DE: SVS%: Schüsse gehalten in %)'
              title: savesPercentage
              type: string
            - description: 'Time played, mm:ss string (minutes may exceed 59), not seconds, despite the
                alias. (DE: MIP: Gespielte Minuten)'
              title: secondsPlayed
              type: string
            - description: 'Penalty minutes. (DE: PIM: Strafen in Minuten)'
              title: penaltyInMinutes
              type: string
            - description: 'Goals. (DE: G: Tore)'
              title: goals
              type: string
            - description: 'Assists. (DE: A: Assists)'
              title: assists
              type: string
            type: array
          type: array
        description:
          type: string
        filters:
          items:
            properties:
              alias:
                type: string
              entries:
                items:
                  properties:
                    alias:
                      type: string
                    name:
                      type: string
                  type: object
                type: array
              selected:
                type: string
              title:
                type: string
              type:
                type: string
            type: object
          type: array
        fixTableLeft:
          type: integer
        header:
          items:
            properties:
              alias:
                type: string
              align:
                type: string
              description:
                type: string
              isSortable:
                type: boolean
              name:
                type: string
              showTooltip:
                type: boolean
            type: object
          type: array
        highlightedPositions:
          items:
            properties:
              name:
                type:
                - 'null'
              rows:
                items:
                  type: integer
                type: array
              style:
                type: string
            type: object
          type: array
        isLive:
          type: boolean
        orderBy:
          type: string
        orderByDescending:
          type: boolean
        pages:
          type: integer
        rowIdentifier:
          type: integer
        secondaryMenu:
          items:
            properties:
              alias:
                type: string
              isOrderDescending:
                type: boolean
              name:
                type: string
              rowIdentifierKey:
                type: string
            type: object
          type: array
        selectedPage:
          type: integer
        title:
          type: string
        updateDateTime:
          type: string
      type: object
