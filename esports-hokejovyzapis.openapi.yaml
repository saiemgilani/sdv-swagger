info:
  description: Public, keyless, anonymously listable S3 buckets written by the eSports s.r.o. hockey scoring
    system and read by the leagues' own widgets. One key layout across four buckets; the bucket is a server
    variable and each path lists the buckets that serve it. Shapes from committed captures (2026-10-12,
    one completed 2026/27 game per bucket) in esports-hokejovyzapis/captures/. Season key = START year.
    Not official or supported.
  title: eSports hokejovyzapis S3 buckets (DEL, DEL2, ICEHL, EIHL, Metal Ligaen)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /:
    get:
      description: 'Buckets: `de.hokejovyzapis.cz`, `icehl.hokejovyzapis.cz`, `eihl.hokejovyzapis.cz`,
        `den.hokejovyzapis.cz`.'
      operationId: list_objects
      parameters:
      - description: Always 2 (ListObjectsV2).
        example: '2'
        in: query
        name: list-type
        required: true
        schema:
          type: string
      - description: Key prefix, e.g. `league-matches/` or `matches/4444/`.
        in: query
        name: prefix
        required: false
        schema:
          type: string
      - description: '`/` groups keys below the next slash into CommonPrefixes (folder view).'
        in: query
        name: delimiter
        required: false
        schema:
          type: string
      - description: Page size, at most 1000 (the default).
        in: query
        name: max-keys
        required: false
        schema:
          type: string
      - description: '`NextContinuationToken` of the previous page; pages until `IsTruncated` is false.'
        in: query
        name: continuation-token
        required: false
        schema:
          type: string
      - description: List keys after this key.
        in: query
        name: start-after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ListBucketResult'
          description: OK
        '404':
          description: 'S3 NoSuchKey (XML): the bucket has no such key (e.g. a game without that file).'
      summary: List keys (S3 ListObjectsV2 XML)
    servers:
    - url: https://s3.eu-west-1.amazonaws.com/{bucket}
      variables:
        bucket:
          default: de.hokejovyzapis.cz
          description: 'eSports hokejovyzapis bucket. `de.hokejovyzapis.cz` DEL + DEL2: 1 DEL regular
            season, 2 Test-Liga (preseason), 3 DEL playoffs, 4 MagentaSport Cup (2020 only), 5 NHL Global
            Series (2022 only), 6 DEL2 (2026 on) | `icehl.hokejovyzapis.cz` ICE Hockey League: 1 ICEHL
            (regular season and playoffs, split by league_part_name), 2 pre-season, 3 test games | `eihl.hokejovyzapis.cz`
            EIHL: 3 Elite League, 4 Challenge Cup, 5 EIHL playoffs, 6 test | `den.hokejovyzapis.cz` Denmark:
            1 Metal Ligaen (regular season and playoffs), 2 pre-season, 3 test, 4 Final-4 (cup)'
          enum:
          - de.hokejovyzapis.cz
          - icehl.hokejovyzapis.cz
          - eihl.hokejovyzapis.cz
          - den.hokejovyzapis.cz
  /league-matches/{season}/{league_id}.json:
    get:
      description: 'Buckets: `de.hokejovyzapis.cz`, `icehl.hokejovyzapis.cz`, `eihl.hokejovyzapis.cz`,
        `den.hokejovyzapis.cz`.'
      operationId: league_matches_season_league_id
      parameters:
      - description: 'Season START year (2026 = 2026/27). Examples: de 2026, icehl 2026, eihl 2026, den
          2026.'
        example: '2026'
        in: path
        name: season
        required: true
        schema:
          type: string
      - description: 'League id within the bucket; ids differ per bucket (see the bucket variable). Examples:
          de 1, icehl 1, eihl 3, den 1.'
        example: '1'
        in: path
        name: league_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueMatchesSeasonLeagueId'
          description: OK
        '404':
          description: 'S3 NoSuchKey (XML): the bucket has no such key (e.g. a game without that file).'
      summary: Schedule and results of one league in one season
    servers:
    - url: https://s3.eu-west-1.amazonaws.com/{bucket}
      variables:
        bucket:
          default: de.hokejovyzapis.cz
          description: 'eSports hokejovyzapis bucket. `de.hokejovyzapis.cz` DEL + DEL2: 1 DEL regular
            season, 2 Test-Liga (preseason), 3 DEL playoffs, 4 MagentaSport Cup (2020 only), 5 NHL Global
            Series (2022 only), 6 DEL2 (2026 on) | `icehl.hokejovyzapis.cz` ICE Hockey League: 1 ICEHL
            (regular season and playoffs, split by league_part_name), 2 pre-season, 3 test games | `eihl.hokejovyzapis.cz`
            EIHL: 3 Elite League, 4 Challenge Cup, 5 EIHL playoffs, 6 test | `den.hokejovyzapis.cz` Denmark:
            1 Metal Ligaen (regular season and playoffs), 2 pre-season, 3 test, 4 Final-4 (cup)'
