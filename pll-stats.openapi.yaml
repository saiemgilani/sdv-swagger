info:
  description: The REST routes behind stats.premierlacrosseleague.com (PLL schedule, box scores, play-by-play,
    standings, team and player stats, leaders; plus the Global Lacrosse Games and WLL schedule) and four
    of premierlacrosseleague.com's own read routes. The stats host is a proxy that answers only callers
    carrying the stats site's Referer (or Origin); no token is sent or needed, and the upstream key stays
    server-side. Seasons 2019-2026. Shapes from the committed captures in pll/captures/. Not official
    or supported.
  title: Premier Lacrosse League stats API (stats.premierlacrosseleague.com)
  version: '2026-11-25'
openapi: 3.1.0
paths:
  /api/glg/{glgLeague}/games:
    get:
      description: Global Lacrosse Games schedule and results (national teams). Wrapped in sdv-py as `pll_glg_schedule`.
      operationId: GlgGames
      parameters:
      - description: intlm men, intlw women.
        example: intlm
        in: path
        name: glgLeague
        required: true
        schema:
          enum:
          - intlm
          - intlw
          type: string
      - description: Edition year.
        example: 2026
        in: query
        name: year
        required: false
        schema:
          type: integer
      - $ref: '#/components/parameters/Referer'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlgGames'
          description: OK
        '400': &id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Refused. The stats proxy''s own refusals are {error: <text>} (Not found for a
            route it does not serve; Origin not allowed without the stats site''s Referer); the stats
            service''s are {error: {code, message}}. On the main-site routes a 403 is the same Origin
            not allowed body for that site''s Referer.'
        '403': *id001
        '404': *id001
      summary: Global Lacrosse Games schedule and results (national teams).
      x-rows: data.items
  /api/glg/{glgLeague}/standings:
    get:
      description: Global Lacrosse Games standings. Wrapped in sdv-py as `pll_glg_standings`.
      operationId: GlgStandings
