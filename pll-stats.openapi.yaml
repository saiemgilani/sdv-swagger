components:
  parameters:
    Referer:
      description: 'The stats site''s own origin. Without it (or with any other) the proxy answers 403
        {error: Origin not allowed}.'
      in: header
      name: Referer
      required: true
      schema:
        const: https://stats.premierlacrosseleague.com/
        type: string
    SiteReferer:
      description: The main site's origin. The /api/league routes answered without it in the capture;
        send it anyway (game-stats once refused a bare request with 403).
      in: header
      name: Referer
      required: false
      schema:
        const: https://premierlacrosseleague.com/
        type: string
  schemas:
    CareerLeaders:
      properties:
        data:
          description: Response envelope.
          properties:
            goals:
              description: Goals (1-point plus 2-point; goals = onePointGoals + twoPointGoals).
              items:
                properties:
                  avgPerSeason:
                    description: Career stat value per season played (statValue / seasonsPlayed).
                    type: number
                  firstName:
                    description: First name.
                    type: string
                  gamesPlayed:
                    description: Games played.
                    type: integer
                  lastName:
                    description: Last name.
                    type: string
                  officialId:
                    description: League id of the player (six digits, e.g. 003009) or team (three letters,
                      e.g. WAT).
                    type: string
                  profileUrl:
                    description: Headshot image URL.
                    type:
                    - string
                    - 'null'
                  seasonsPlayed:
                    description: PLL seasons played.
                    type: integer
                  slug:
                    description: URL slug of the player or team (the id the per-player and per-team routes
                      take).
                    type: string
                  statValue:
                    description: The leaderboard stat's value.
                    type: number
                  status:
                    description: Player status (current on a roster; active or retired on career leaderboards).
                    type: string
                  team:
                    description: Team the player is on.
                    properties:
                      fullName:
                        description: Team name (e.g. Waterdogs).
                        type: string
                      location:
                        description: Team city or region (e.g. Philadelphia), or the game's city.
                        type:
                        - string
                        - 'null'
                      locationCode:
                        description: Three-letter location code (e.g. PHI).
                        type:
                        - string
                        - 'null'
                      officialId:
                        description: League id of the player (six digits, e.g. 003009) or team (three
                          letters, e.g. WAT).
                        type: string
                      slug:
                        description: URL slug of the player or team (the id the per-player and per-team
                          routes take).
                        type: string
                      urlLogo:
                        description: Team logo URL.
                        type: string
                    type:
                    - object
                    - 'null'
                type: object
              type: array
            points:
              description: Points (onePointGoals + 2 x twoPointGoals + assists; checked on the captures).
              items:
                properties:
                  avgPerSeason:
                    description: Career stat value per season played (statValue / seasonsPlayed).
                    type: number
                  firstName:
                    description: First name.
                    type: string
                  gamesPlayed:
                    description: Games played.
                    type: integer
                  lastName:
                    description: Last name.
                    type: string
                  officialId:
                    description: League id of the player (six digits, e.g. 003009) or team (three letters,
                      e.g. WAT).
                    type: string
                  profileUrl:
                    description: Headshot image URL.
                    type:
                    - string
                    - 'null'
                  seasonsPlayed:
                    description: PLL seasons played.
                    type: integer
                  slug:
                    description: URL slug of the player or team (the id the per-player and per-team routes
                      take).
                    type: string
                  statValue:
                    description: The leaderboard stat's value.
                    type: number
                  status:
                    description: Player status (current on a roster; active or retired on career leaderboards).
                    type: string
                  team:
                    description: Team the player is on.
                    properties:
                      fullName:
                        description: Team name (e.g. Waterdogs).
                        type: string
                      location:
                        description: Team city or region (e.g. Philadelphia), or the game's city.
                        type:
                        - string
                        - 'null'
                      locationCode:
                        description: Three-letter location code (e.g. PHI).
                        type:
                        - string
                        - 'null'
                      officialId:
                        description: League id of the player (six digits, e.g. 003009) or team (three
                          letters, e.g. WAT).
                        type: string
                      slug:
                        description: URL slug of the player or team (the id the per-player and per-team
                          routes take).
                        type: string
                      urlLogo:
                        description: Team logo URL.
                        type: string
                    type:
                    - object
                    - 'null'
                type: object
              type: array
            saves:
              description: Saves.
              items:
                properties:
                  avgPerSeason:
                    description: Career stat value per season played (statValue / seasonsPlayed).
                    type: number
                  firstName:
                    description: First name.
                    type: string
                  gamesPlayed:
                    description: Games played.
                    type: integer
                  lastName:
                    description: Last name.
                    type: string
                  officialId:
                    description: League id of the player (six digits, e.g. 003009) or team (three letters,
                      e.g. WAT).
                    type: string
                  profileUrl:
                    description: Headshot image URL.
                    type:
                    - string
                    - 'null'
                  seasonsPlayed:
                    description: PLL seasons played.
                    type: integer
                  slug:
                    description: URL slug of the player or team (the id the per-player and per-team routes
                      take).
                    type: string
                  statValue:
                    description: The leaderboard stat's value.
                    type: number
                  status:
                    description: Player status (current on a roster; active or retired on career leaderboards).
                    type: string
                  team:
                    description: Team the player is on.
                    properties:
                      fullName:
                        description: Team name (e.g. Waterdogs).
                        type: string
                      location:
                        description: Team city or region (e.g. Philadelphia), or the game's city.
                        type:
                        - string
                        - 'null'
                      locationCode:
                        description: Three-letter location code (e.g. PHI).
                        type:
                        - string
                        - 'null'
                      officialId:
                        description: League id of the player (six digits, e.g. 003009) or team (three
                          letters, e.g. WAT).
                        type: string
                      slug:
                        description: URL slug of the player or team (the id the per-player and per-team
                          routes take).
                        type: string
                      urlLogo:
                        description: Team logo URL.
                        type: string
                    type:
                    - object
                    - 'null'
                type: object
              type: array
          type: object
      type: object
    Error:
      properties:
        error:
          oneOf:
          - type: string
          - properties:
              code:
                type: integer
              message:
                type: string
            required:
            - code
            - message
            type: object
      required:
      - error
      type: object
    Event:
      properties:
        data:
          description: Response envelope.
          properties:
            awayTeam:
              description: Away (visiting) team.
              properties:
                backgroundColor:
                  description: Team secondary colour, hex.
                  type: string
                conference:
                  description: Conference (eastern or western; null before conferences, 2019-2020).
                  type:
                  - string
                  - 'null'
                fullName:
                  description: Team name (e.g. Waterdogs).
                  type: string
                league:
                  description: League code (PLL, WLL, INTLM, INTLW).
                  type: string
                location:
                  description: Team city or region (e.g. Philadelphia), or the game's city.
                  type: string
                locationCode:
                  description: Three-letter location code (e.g. PHI).
                  type: string
                losses:
                  description: Losses.
                  type: integer
                officialId:
                  description: League id of the player (six digits, e.g. 003009) or team (three letters,
                    e.g. WAT).
                  type: string
                teamColor:
                  description: Team primary colour, hex.
                  type: string
                ties:
                  description: Ties.
                  type: integer
                urlLogo:
                  description: Team logo URL.
                  type: string
                wins:
                  description: Wins.
                  type: integer
                year:
                  description: Season.
                  type: integer
              type: object
            broadcaster:
              description: Broadcast and streaming outlets carrying the game.
              items:
                type: string
              type: array
            clockMinutes:
              description: Game clock minutes remaining in the period.
              type: integer
            clockSeconds:
              description: Game clock seconds remaining in the period.
              type: integer
            description:
              description: Text of the play (play-by-play), or the game's description (Championship Series
                round labels; null for most games).
              type:
              - string
              - 'null'
            eventId:
              description: League event id (e.g. 2026_game_1; LACROSSE_PLL_2019_... before 2021).
              type: string
            eventStatus:
              description: Game status code (3 on the final 2021-2026 games captured; the 2019 games all
                carry 2).
              type: integer
            gameStatus:
              description: Game status text (null in every capture).
              x-observed: null in every capture
            homePeriodScores:
              description: Home team points per period.
              items:
                type: integer
              type: array
            homeScore:
              description: Home team points.
              type: integer
            homeTeam:
              description: Home team.
              properties:
                backgroundColor:
                  description: Team secondary colour, hex.
                  type: string
                conference:
                  description: Conference (eastern or western; null before conferences, 2019-2020).
                  type:
                  - string
                  - 'null'
                fullName:
                  description: Team name (e.g. Waterdogs).
                  type: string
                league:
                  description: League code (PLL, WLL, INTLM, INTLW).
                  type: string
                location:
                  description: Team city or region (e.g. Philadelphia), or the game's city.
                  type: string
                locationCode:
                  description: Three-letter location code (e.g. PHI).
                  type: string
                losses:
                  description: Losses.
                  type: integer
                officialId:
                  description: League id of the player (six digits, e.g. 003009) or team (three letters,
                    e.g. WAT).
                  type: string
                teamColor:
                  description: Team primary colour, hex.
                  type: string
                ties:
                  description: Ties.
                  type: integer
                urlLogo:
                  description: Team logo URL.
                  type: string
                wins:
                  description: Wins.
                  type: integer
                year:
                  description: Season.
                  type: integer
              type: object
            id:
              description: Numeric id of the game (or the media item id on a feed item).
              type: integer
            league:
              description: League code (PLL, WLL, INTLM, INTLW).
              type: string
            location:
              description: Team city or region (e.g. Philadelphia), or the game's city.
              type: string
            period:
              description: Period (quarter; 5 and up are overtime).
              type: integer
            polymarketId:
              description: Prediction-market slug for the game.
              type: string
            pregameWinProbability:
              description: Pregame win probabilities.
              properties:
                awayWinProbability:
                  description: Away team's pregame win probability (0-1).
                  type: number
                homeWinProbability:
                  description: Home team's pregame win probability (0-1).
                  type: number
              type: object
            seasonSegment:
              description: Season segment (regular, post, champseries, allstar).
              type: string
            slugname:
              description: Game slug (the id the per-game routes take).
              type: string
            snl:
              description: true for a Saturday-night-lights (featured night) game.
              type: boolean
            startTime:
              description: Kick-off time, epoch seconds (a numeric string on games).
              type: string
            urlStreaming:
              description: Streaming link.
              type:
              - string
              - 'null'
            venue:
              description: Venue name.
              type: string
            venueLocation:
              description: Venue address (null in every capture).
              x-observed: null in every capture
            visitorPeriodScores:
              description: Away team points per period.
              items:
                type: integer
              type: array
            visitorScore:
              description: Away team points.
              type: integer
            week:
              description: Week of the season (0 for the Championship Series).
              type: integer
            year:
              description: Season.
              type: integer
          type: object
      type: object
    EventInsights:
      properties:
        data:
          description: Response envelope.
          properties:
            items:
              description: Rows of the answer.
              items:
                properties:
                  detail:
                    description: Insight text.
                    type: string
                  insightType:
                    description: Insight kind (save-streak, faceoff-streak, ...).
                    type: string
                  jerseyNumber:
                    description: Jersey number of the insight's player (null for a team insight).
                    type:
                    - integer
                    - 'null'
                  minutes:
                    description: Game clock minutes remaining in the period at the play.
                    type: integer
                  period:
                    description: Period (quarter; 5 and up are overtime).
                    type: integer
                  playerId:
                    description: Player id of the insight's player (null for a team insight).
                    type:
                    - string
                    - 'null'
                  position:
                    description: Position code (A attack, M midfield, SSDM defensive midfield, LSM long-stick
                      midfield, D defense, FO faceoff, G goalie).
                    type:
                    - string
                    - 'null'
                  primaryImageUrl:
                    description: Main image of the insight.
                    type: string
                  secondaryImageUrl:
                    description: Second image of the insight (null when none).
                    type:
                    - string
                    - 'null'
                  seconds:
                    description: Game clock seconds remaining in the period at the play.
                    type: integer
                  subject:
                    description: Player or team the insight is about.
                    type: string
                  teamId:
                    description: Team code (three letters, e.g. WAT).
                    type: string
                  title:
                    description: Title of the insight, media item or contest.
                    type: string
                type: object
              type: array
          type: object
      type: object
    EventPlayLogs:
      properties:
        data:
          description: Response envelope.
          properties:
            items:
              description: Rows of the answer.
              items:
                properties:
                  assistOpportunityPlayerId:
                    description: Player id (officialId) of the passer on a shot that was a potential assist.
                    type:
                    - string
                    - 'null'
                  awayTeamWinProbability:
                    description: Away team's win probability after this play (0-1).
                    type:
                    - number
                    - 'null'
                  causedTurnoverId:
                    description: Player id of the defender credited with causing the turnover.
                    type:
                    - string
                    - 'null'
                  closestDefenderId:
                    description: Player id of the closest defender on the shot.
                    type:
                    - string
                    - 'null'
                  commitedPenaltyId:
                    description: Player id of the player who committed the penalty.
                    type:
                    - string
                    - 'null'
                  commitedTurnoverId:
                    description: Player id of the player who committed the turnover.
                    type:
                    - string
                    - 'null'
                  description:
                    description: Text of the play (play-by-play), or the game's description (Championship
                      Series round labels; null for most games).
                    type:
                    - string
                    - 'null'
                  details:
                    description: Extra detail on a shot (on goal, saved, save type).
                    properties:
                      saveType:
                        description: Save kind (clean or messy).
                        type:
                        - string
                        - 'null'
                      shotOnGoal:
                        description: true when the shot was on goal.
                        type: boolean
                      shotSaved:
                        description: true when the shot was saved.
                        type: boolean
                    type: object
                  eventType:
                    description: Play type (faceoff, groundball, shot, goal, turnover, penalty, shotclockexpired,
                      pregame, gameEnd).
                    type: string
                  faceoffLoserId:
                    description: Player id of the faceoff loser.
                    type:
                    - string
                    - 'null'
                  faceoffWinnerId:
                    description: Player id of the faceoff winner.
                    type:
                    - string
                    - 'null'
                  gbPlayerId:
                    description: Player id of the player who picked up the ground ball.
                    type:
                    - string
                    - 'null'
                  goalieId:
                    description: Player id of the defending goalie.
                    type:
                    - string
                    - 'null'
                  homeScore:
                    description: Home team points.
                    type: integer
                  homeTeamWinProbability:
                    description: Home team's win probability after this play (0-1).
                    type:
                    - number
                    - 'null'
                  markerId:
                    description: Play marker id (<type>-<sequence>).
                    type: string
                  minutes:
                    description: Game clock minutes remaining in the period at the play.
                    type: integer
                  offenseGoalieId:
                    description: Player id of the offensive team's goalie.
                    type:
                    - string
                    - 'null'
                  penaltyDescription:
                    description: Penalty description.
                    type:
                    - string
                    - 'null'
                  penaltyLength:
                    description: Penalty length in seconds.
                    type:
                    - integer
                    - 'null'
                  period:
                    description: Period (quarter; 5 and up are overtime).
                    type: integer
                  seconds:
                    description: Game clock seconds remaining in the period at the play.
                    type: integer
                  secondsPassed:
                    description: Game seconds elapsed at the play, cumulative across periods (720 per
                      12-minute quarter in a regular or playoff game, so 2165 is 5 s into the fourth;
                      480 per 8-minute quarter in a Championship Series game).
                    type: integer
                  shooterId:
                    description: Player id of the shooter.
                    type:
                    - string
                    - 'null'
                  shotAssistId:
                    description: Player id of the assisting player on a goal.
                    type:
                    - string
                    - 'null'
                  shotType:
                    description: Shot value (1_PT, 2_PT; MU for a man-up goal note; empty when not a shot).
                    type:
                    - string
                    - 'null'
                  teamId:
                    description: Team code (three letters, e.g. WAT).
                    type: string
                  visitorScore:
                    description: Away team points.
                    type: integer
                type: object
              type: array
          type: object
      type: object
    EventPlayerStats:
      properties:
        data:
          description: Response envelope.
          properties:
            items:
              description: Rows of the answer.
              items:
                properties:
                  GAA:
                    description: Scores against per game played (scoresAgainst / gamesPlayed).
                    type: number
                  assistOpportunities:
                    description: Passes that led to a shot (a potential assist).
                    type: integer
                  assists:
                    description: Assists.
                    type: integer
                  causedTurnovers:
                    description: Caused turnovers (takeaways credited to a defender).
                    type: integer
                  cleanSavePct:
                    description: Clean saves per save (cleanSaves / saves).
                    type: number
                  cleanSaves:
                    description: Saves the goalie controlled cleanly (no rebound).
                    type: integer
                  faceoffPct:
                    description: Faceoffs won per faceoff taken (faceoffsWon / faceoffs).
                    type: number
                  faceoffs:
                    description: Faceoffs taken (faceoffPct = faceoffsWon / faceoffs; won + lost can fall
                      short of it, as in the captures).
                    type: integer
                  faceoffsLost:
                    description: Faceoffs lost.
                    type: integer
                  faceoffsWon:
                    description: Faceoffs won.
                    type: integer
                  firstName:
                    description: First name.
                    type: string
                  foRecord:
                    description: Faceoff record text (null in every capture).
                    type:
                    - string
                    - 'null'
                  gamesPlayed:
                    description: Games played.
                    type: integer
                  goals:
                    description: Goals (1-point plus 2-point; goals = onePointGoals + twoPointGoals).
                    type: integer
                  goalsAgainst:
                    description: Goals allowed.
                    type: integer
                  groundBalls:
                    description: Ground balls picked up.
                    type: integer
                  jerseyNum:
                    description: Jersey number.
                    type: integer
                  lastName:
                    description: Last name.
                    type: string
                  messySaves:
                    description: Saves that left a rebound.
                    type: integer
                  numPenalties:
                    description: Penalties committed.
                    type: integer
                  officialId:
                    description: League id of the player (six digits, e.g. 003009) or team (three letters,
                      e.g. WAT).
                    type: string
                  onePointGoals:
                    description: 1-point goals (inside the arc).
                    type: integer
                  pim:
                    description: Penalty minutes.
                    type: number
                  points:
                    description: Points (onePointGoals + 2 x twoPointGoals + assists; checked on the captures).
                    type: integer
                  position:
                    description: Position code (A attack, M midfield, SSDM defensive midfield, LSM long-stick
                      midfield, D defense, FO faceoff, G goalie).
                    type:
                    - string
                    - 'null'
                  positionName:
                    description: Position name (Attack, Midfield, ...).
                    type: string
                  profileUrl:
                    description: Headshot image URL.
                    type: string
                  saa:
                    description: Scores against per 48 minutes on the field (scoresAgainst / (tof / 2880);
                      checked on the captures).
                    type: number
                  savePct:
                    description: Saves per shot on goal faced (saves / (saves + goalsAgainst); checked
                      on the captures).
                    type: number
                  saves:
                    description: Saves.
                    type: integer
                  scoresAgainst:
                    description: Points allowed (a 2-point goal counts 2).
                    type: integer
                  shotPct:
                    description: Goals per shot (goals / shots).
                    type: number
                  shots:
                    description: Shots.
                    type: integer
                  shotsOnGoal:
                    description: Shots on goal.
                    type: integer
                  slug:
                    description: URL slug of the player or team (the id the per-player and per-team routes
                      take).
                    type: string
                  teamId:
                    description: Team code (three letters, e.g. WAT).
                    type: string
                  totalPasses:
                    description: Passes.
                    type: integer
                  touches:
                    description: Touches (possessions of the ball by the player).
                    type: integer
                  turnovers:
                    description: Turnovers committed.
                    type: integer
                  twoPointGoals:
                    description: 2-point goals (from beyond the arc).
                    type: integer
                  twoPointGoalsAgainst:
                    description: 2-point goals allowed.
                    type: integer
                  twoPointShots:
                    description: Shots from beyond the arc.
                    type: integer
                  twoPtGaa:
                    description: 2-point goals against per game played.
                    type: number
                type: object
              type: array
          type: object
      type: object
    EventTeamStats:
      properties:
        data:
          description: Response envelope.
          properties:
            items:
              description: Rows of the answer.
              items:
                properties:
                  assists:
                    description: Assists.
                    type: integer
                  causedTurnovers:
                    description: Caused turnovers (takeaways credited to a defender).
                    type: integer
                  cleanSavePct:
                    description: Clean saves per save (cleanSaves / saves).
                    type: number
                  cleanSaves:
                    description: Saves the goalie controlled cleanly (no rebound).
                    type: integer
                  clearAttempts:
                    description: Clearing attempts (moving the ball from the defensive to the offensive
