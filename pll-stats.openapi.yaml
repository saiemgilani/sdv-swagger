                    type: integer
                  clearPct:
                    description: Successful clears per attempt (clears / clearAttempts).
                    type: number
                  clears:
                    description: Successful clears.
                    type: integer
                  faceoffPct:
                    description: Faceoffs won per faceoff taken (faceoffsWon / faceoffs).
                    type: number
                  faceoffs:
                    description: Faceoffs taken (faceoffPct = faceoffsWon / faceoffs; won + lost can fall
                      short of it, as in the captures).
                    type: integer
                  faceoffsLost:
                    description: Faceoffs lost.
                    type: integer
                  faceoffsWon:
                    description: Faceoffs won.
                    type: integer
                  goals:
                    description: Goals (1-point plus 2-point; goals = onePointGoals + twoPointGoals).
                    type: integer
                  goalsAgainst:
                    description: Goals allowed.
                    type: integer
                  groundBalls:
                    description: Ground balls picked up.
                    type: integer
                  manDownPct:
                    description: Man-down (penalty kill) success rate.
                    type: number
                  messySaves:
                    description: Saves that left a rebound.
                    type: integer
                  numPenalties:
                    description: Penalties committed.
                    type: integer
                  officialId:
                    description: League id of the player (six digits, e.g. 003009) or team (three letters,
                      e.g. WAT).
                    type: string
                  onePointGoals:
                    description: 1-point goals (inside the arc).
                    type: integer
                  pim:
                    description: Penalty minutes.
                    type: number
                  powerPlayGoals:
                    description: Power-play goals.
                    type: integer
                  powerPlayGoalsAgainst:
                    description: Power-play goals allowed.
                    type: integer
                  powerPlayGoalsAgainstPct:
                    description: Power-play goals allowed per opponent man-up chance.
                    type: number
                  powerPlayPct:
                    description: Power-play goals per man-up chance.
                    type: number
                  powerPlayShots:
                    description: Power-play shots.
                    type: integer
                  rideAttempts:
                    description: Riding attempts (opponent clears contested).
                    type: integer
                  savePct:
                    description: Saves per shot on goal faced (saves / (saves + goalsAgainst); checked
                      on the captures).
                    type: number
                  saves:
                    description: Saves.
                    type: integer
                  scores:
                    description: Points scored (a 2-point goal counts 2).
                    type: integer
                  scoresAgainst:
                    description: Points allowed (a 2-point goal counts 2).
                    type: integer
                  shotClockExpirations:
                    description: Shot-clock violations.
                    type: integer
                  shotPct:
                    description: Goals per shot (goals / shots).
                    type: number
                  shots:
                    description: Shots.
                    type: integer
                  shotsOnGoal:
                    description: Shots on goal.
                    type: integer
                  shotsOnGoalPct:
                    description: Shots on goal per shot.
                    type: number
                  timeInPossesion:
                    description: Time in possession, seconds (the API's spelling).
                    type: integer
                  timeInPossesionPct:
                    description: Share of game time in possession (0-1).
                    type: number
                  timesManUp:
                    description: Man-up (power-play) chances.
                    type: integer
                  timesShortHanded:
                    description: Man-down (short-handed) spells.
                    type: integer
                  totalPasses:
