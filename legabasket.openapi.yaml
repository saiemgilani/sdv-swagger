components:
  schemas:
    GetChampionshipMatchesShotsById:
      description: 'Shooting per court zone per team, as made/attempted strings. Aggregates only: shot
        x/y is in the play-by-play.'
      properties:
        cache_key:
          description: Server cache key of this response (opaque, `<prefix>CK:<epoch>` parts); changes
            when the data is refreshed.
          type: string
        cdn_url:
          description: Media host (`https://lba-media.s3.eu-south-1.amazonaws.com`); image keys resolve
            under it.
          type: string
        match:
          description: Game header (empty `{}` without `info`).
          properties:
            additional_time:
              description: Overtime periods played (0 in every sample; reading inferred).
              type: integer
            championship_id:
              description: Championship id (season + phase) of the game.
              type: integer
            championships_day_id:
              description: 'Round id (`championships_day_id` key space: one round of one championship;
                joins `filters.days[].id` and standings `championships_day_id`; not the `d` param).'
              type: integer
            competition_name:
              description: Championship full name, e.g. `Regular Season 2026/27`.
              type: string
            competition_serie:
              description: Series name, `Serie A`.
              type: string
            competition_serie_id:
              description: Series id, 1 = Serie A.
              type: integer
            competition_type:
              description: 'Phase type name: `Regular Season` / `Play Off`.'
              type: string
            competition_type_code:
              description: 'Phase type code: `RS` / `PO`.'
              type: string
            competition_type_id:
              description: 'Phase type id: 4 = Regular Season, 2 = Play Off.'
              type: integer
            day_code:
              description: Round code (`1`, `2`, ...; string in game rows, integer in standings).
              type: string
            day_name:
              description: 'Round name, Italian: `1° Giornata` = matchday 1.'
              type: string
            day_phase_id:
              description: 'Phase id: 1 = `Andata` (first half of the season), 2 = `Ritorno` (second half).'
              type: integer
            day_serial:
              description: Round number (`event_serial`, the `d` param).
              type: integer
            game_status:
              description: 'Game status, number sent as a string: `0` scheduled, `1` live, `2` final (per
                the OSS client; only `2` sampled).'
              type: string
            h_team_enabled:
              description: Home team page enabled on the site.
              type: boolean
            h_team_id:
              description: Home team id (team-season).
              type: integer
            h_team_name:
              description: Home team name (sponsor name of that season).
              type: string
            has_streaming:
              description: 1 when a stream exists, else 0.
              type: integer
            home_coach_code:
              description: Home head coach code `SURNAME3-NAME3`.
              type: string
            home_coach_fullname:
              description: Home head coach, `Surname Name`.
              type: string
            home_coach_id:
              description: Home head coach id.
              type: integer
            home_final_score:
              description: Final points of the home team.
              type: integer
            home_logo_key:
              description: 'Image key: the image is `{cdn_url}/{key}`, resized copies `{cdn_url}/variants/{key}/thumb`
                or `/large` (the site''s getApiImageUrl).'
              type:
              - string
              - 'null'
            id:
              description: Game id (global).
              type: integer
            live_match_data:
              description: Null in every sample (meaning unverified).
              x-unobserved: true
            match_datetime:
              description: 'Tip-off, ISO-8601 with the Italian offset (1995-96: midnight, no time kept).'
              type: string
            match_hh:
              description: Tip-off hour, local time.
              type: integer
            match_hw:
              description: All-time head-to-head wins of the home club (inferred).
              type: integer
            match_mm:
              description: Tip-off minute, local time.
              type: integer
            match_serie:
              description: All-time head-to-head as `home wins-away wins` (`6-18`; inferred from `match_hw`
                / `match_vw`).
              type: string
            match_vw:
              description: All-time head-to-head wins of the away club (inferred).
              type: integer
            number:
              description: Round number of the game, equal to `day_serial` (the `d` echo the capture checks).
              type: integer
            ot_hs:
              description: Home overtime points (0 without overtime).
              type: integer
            ot_vs:
              description: Away overtime points.
              type: integer
            plant_id:
              description: Arena id (arena key space; joins nothing specced).
              type: integer
            plant_name:
              description: Arena name.
              type: string
            q1_hs:
              description: 'Home points in the 1st quarter (null in the 1995-96 sample: no period scores
                then).'
              type: integer
            q1_vs:
              description: Away points in the 1st quarter.
              type: integer
            q2_hs:
              description: Home points in the 2nd quarter.
              type: integer
            q2_vs:
              description: Away points in the 2nd quarter.
              type: integer
            q3_hs:
              description: 'Home points in the 3rd quarter (0 in the 1995-96 sample: a placeholder, not
                a score).'
              type: integer
            q3_vs:
              description: Away points in the 3rd quarter (0 placeholder in 1995-96).
              type: integer
            q4_hs:
              description: Home points in the 4th quarter (0 placeholder in 1995-96).
              type: integer
            q4_vs:
              description: Away points in the 4th quarter (0 placeholder in 1995-96).
              type: integer
            quarter:
              description: Last period played, number sent as a string (`4`; `5` = overtime).
              type: string
            spectators:
              description: Attendance.
              type: integer
            target_score:
              description: Null in every sample (meaning unverified).
              x-unobserved: true
            ticketing_url:
              description: Ticket shop URL (null for old games).
              type:
              - string
              - 'null'
            updated_at:
              description: Timestamp, ISO-8601 with the Italian offset. Last update of the game row.
              type: string
            v_logo_key:
              description: 'Image key: the image is `{cdn_url}/{key}`, resized copies `{cdn_url}/variants/{key}/thumb`
                or `/large` (the site''s getApiImageUrl).'
              type:
              - string
              - 'null'
            v_team_enabled:
              description: Away team page enabled on the site.
              type: boolean
            v_team_id:
              description: Away team id (team-season).
              type: integer
            v_team_name:
              description: Away team name.
              type: string
            visitor_coach_code:
              description: Away head coach code.
              type: string
            visitor_coach_fullname:
              description: Away head coach, `Surname Name`.
              type: string
            visitor_coach_id:
              description: Away head coach id.
              type: integer
            visitor_final_score:
              description: Final points of the away team.
              type: integer
            websocket_match_id:
              description: Live-feed game id, number sent as a string; separate from the game id.
              type: string
            year:
              description: Season START year (2026 = 2026-27); sdv END year = year + 1.
              type: integer
          type: object
        shots:
          description: Shooting per zone per team.
          properties:
            ht:
              additionalProperties:
                description: One zone (`1`-`10`; 2017-18 sends only `7`, see the notes).
                properties:
                  num:
                    description: Made/attempted as a string (`17/21`); zone `7` also counts free throws.
                    type: string
                  opacity:
                    description: 'Heat-map shading for the site: `perc` floored, minimum 5.'
                    type: integer
                  perc:
                    description: Made / attempted × 100.
                    type: number
                  precision:
                    description: Decimal places the site shows (1).
                    type: integer
                type: object
              description: Home team zones, keyed by zone code.
              type: object
            timestamp:
              description: Last update, Unix epoch seconds.
              type: integer
            vt:
              additionalProperties:
                description: One zone (`1`-`10`; 2017-18 sends only `7`).
                properties:
                  num:
                    description: Made/attempted as a string (`17/21`); zone `7` also counts free throws.
                    type: string
                  opacity:
                    description: 'Heat-map shading for the site: `perc` floored, minimum 5.'
                    type: integer
                  perc:
                    description: Made / attempted × 100.
                    type: number
                  precision:
                    description: Decimal places the site shows (1).
                    type: integer
                type: object
              description: Away team zones, keyed by zone code.
              type: object
          type: object
      type: object
    GetChampionshipRanking:
      description: Standings after a round, with each team's recent results (`teams_matches_series`).
      properties:
        cache_key:
          description: Server cache key of this response (opaque, `<prefix>CK:<epoch>` parts); changes
            when the data is refreshed.
          type: string
        cdn_url:
          description: Media host (`https://lba-media.s3.eu-south-1.amazonaws.com`); image keys resolve
            under it.
          type: string
        competition:
          description: The championship.
          properties:
            background_key:
              description: 'Image key: the image is `{cdn_url}/{key}`, resized copies `{cdn_url}/variants/{key}/thumb`
                or `/large` (the site''s getApiImageUrl).'
              x-unobserved: true
            championship_series_id:
              description: Series id, 1 = Serie A.
              type: integer
            championship_type_id:
              description: 'Phase type id: 4 = Regular Season, 2 = Play Off.'
              type: integer
            code:
              description: Slug, e.g. `2026_regular_season_serie_a`.
              type: string
            cover_key:
              description: 'Image key: the image is `{cdn_url}/{key}`, resized copies `{cdn_url}/variants/{key}/thumb`
                or `/large` (the site''s getApiImageUrl).'
              x-unobserved: true
            ctype_code:
              description: 'Phase type code: `RS` / `PO`.'
              type: string
            ctype_name:
              description: 'Phase type name, as sent in English: `Regular Season`, `Play Off`.'
              type: string
            focus_on:
              description: Highlighted on the site.
              type: boolean
            full_name:
              description: Name with the season, e.g. `Regular Season A 2017`.
              type: string
            homepage_calendar:
              description: Site display flag.
              type: boolean
            homepage_slider:
              description: Site display flag.
              type: boolean
            id:
              description: Championship id (one season and phase).
              type: integer
            logo_key:
              description: 'Image key: the image is `{cdn_url}/{key}`, resized copies `{cdn_url}/variants/{key}/thumb`
                or `/large` (the site''s getApiImageUrl).'
              type:
              - string
              - 'null'
            name:
              description: Championship name, e.g. `Regular Season A`, `Play Off A1`.
              type: string
            scoreboard_live:
              description: Site display flag (live scoreboard).
              type: boolean
            seo_meta_description:
              description: SEO description.
              type:
              - string
              - 'null'
            seo_meta_title:
              description: SEO title (null for old seasons).
              type:
              - string
              - 'null'
            serie_code:
              description: Series code, `A1` = Serie A.
              type: string
            serie_name:
              description: Series name.
              type: string
            show_cover_image_homepage:
              description: Site display flag.
              type: boolean
            show_detail_teams_logo:
              description: Site display flag.
              type: boolean
            status:
              description: 'Championship status: 1 = in progress, 2 = finished (inferred from the 2026-27
                and past samples).'
              type: integer
            year:
              description: Season START year (2026 = 2026-27); sdv END year = year + 1.
              type: integer
          type: object
        filters:
          description: Filter options the site's dropdowns use.
          properties:
            days:
              description: Rounds of the championship.
              items:
                description: One element of `filters.days`.
                properties:
                  code:
                    description: Round code, number sent as a string.
                    type: string
                  event_serial:
                    description: Round number (the `d` param).
                    type: integer
                  focus_on:
                    description: The current round.
                    type: boolean
                  id:
                    description: Round id (`championships_day_id` key space; not the `d` param, which
                      takes `event_serial`).
                    type: integer
                  name:
                    description: Round name, Italian (`1° Giornata` = matchday 1).
                    type: string
                type: object
              type: array
          type: object
        penalizations:
          description: Point deductions (empty in the samples).
          items:
            description: 'Element shape unobserved: `penalizations` is empty in every sample.'
            x-unobserved: true
          type: array
        standings:
          description: One row per team (null for a finished championship without `d`).
          items:
            description: One element of `standings`.
            properties:
              avg_points_made:
                description: Points scored per game.
                type: number
              avg_points_suffered:
                description: Points allowed per game.
                type: number
              away_avg_points_made:
                description: Points scored per away game.
                type: number
              away_avg_points_suffered:
                description: Points allowed per away game.
                type: number
              away_defeats:
                description: Away losses.
                type: integer
              away_game_played:
                description: Away games played.
                type: integer
              away_max_points_made:
                description: Most points scored in an away game.
                type:
                - integer
                - 'null'
              away_points_made:
                description: Points scored away.
                type: integer
              away_points_suffered:
                description: Points allowed away.
                type: integer
              away_ties:
                description: Away ties (null).
                type: integer
              away_wins:
                description: Away games won.
                type: integer
              away_wins_percent:
                description: Away win percentage, string with `%`.
                type:
                - string
                - 'null'
              championships_day_id:
                description: Round id the standings are after.
                type: integer
              club_code:
                description: Club code (`TVB`, `TS`); whether it is stable across seasons is unverified.
                type:
                - string
                - 'null'
              ctp:
                description: Classification marker; 0 or null in the samples (unverified).
                type: integer
              ctp_description:
                description: Null in every sample (meaning unverified).
                x-unobserved: true
              ctp_symbol:
                description: Null in every sample (meaning unverified).
                x-unobserved: true
              day_code:
                description: Round code the standings are after (integer).
                type: integer
              day_name:
                description: Round name, Italian (`4ª Giornata - 2° fase` = matchday 4 of the 2nd phase).
                type: string
              defeats:
                description: Losses.
                type: integer
              game_played:
                description: Games played.
                type: integer
              home_avg_points_made:
                description: Points scored per home game.
                type: number
              home_avg_points_suffered:
                description: Points allowed per home game.
                type: number
              home_defeats:
                description: Home losses.
                type: integer
              home_game_played:
                description: Home games played.
                type: integer
              home_max_points_made:
                description: Most points scored in a home game.
                type:
                - integer
                - 'null'
              home_points_made:
                description: Points scored at home.
                type: integer
              home_points_suffered:
                description: Points allowed at home.
                type: integer
              home_ties:
                description: Home ties (null).
                type: integer
              home_wins:
                description: Home games won.
                type: integer
              home_wins_percent:
                description: Home win percentage, string with `%`.
                type:
                - string
                - 'null'
              id:
                description: Standings row id (one team after one round; joins nothing else).
                type: integer
              logo_key:
                description: 'Image key: the image is `{cdn_url}/{key}`, resized copies `{cdn_url}/variants/{key}/thumb`
                  or `/large` (the site''s getApiImageUrl).'
                type:
                - string
                - 'null'
              lp:
                description: Null in every sample (meaning unverified).
                x-unobserved: true
              lpf:
                description: Null in every sample (meaning unverified).
                x-unobserved: true
              lps:
                description: Null in every sample (meaning unverified).
                x-unobserved: true
              lqp:
                description: Null in every sample (meaning unverified).
                x-unobserved: true
              lv:
                description: Null in every sample (meaning unverified).
                x-unobserved: true
              max_points_made:
                description: Most points scored in a game.
                type:
                - integer
                - 'null'
              movement:
                description: Position change since the previous round, signed string (`+2`, `-1`; null
                  for finished seasons).
                type:
                - string
                - 'null'
              penalty_points:
                description: Points deducted (0 or null).
                type: integer
              play_off_qualified:
                description: Clinched a play-off place (null in old seasons).
                type:
                - boolean
                - 'null'
              points:
                description: Standings points (2 per win).
                type: integer
              points_made:
                description: Points scored.
                type: integer
              points_suffered:
                description: Points allowed.
                type: integer
              position:
                description: Rank in the standings.
                type: integer
              qp:
                description: Tie-break quotient (`quoziente punti`?); 1 in the samples (unverified).
                type: integer
              relegation:
                description: Relegated (null in old seasons).
                type:
                - boolean
                - 'null'
              season:
                description: Season START year (2026 = 2026-27); sdv END year = year + 1.
                type: integer
              team_id:
                description: Team id (team-season).
                type: integer
              team_name:
                description: Team name in that season, with its sponsor (`Nutribullet Treviso Basket`);
                  changes with the sponsor.
                type: string
              ties:
                description: Ties (0 or null; basketball has none).
                type: integer
              updated_at:
                description: Timestamp, ISO-8601 with the Italian offset.
                type: string
              wins:
                description: Games won.
                type: integer
              wins_percent:
                description: Win percentage as a string with `%` (`100%`).
                type:
                - string
                - 'null'
              year:
                description: Season START year (2026 = 2026-27); sdv END year = year + 1.
                type: integer
            type: object
          type: array
        teams_matches_series:
          additionalProperties:
            description: That team's recent games, newest first.
            items:
              description: One element of `teams_matches_series.<team_id>`.
              properties:
                hs:
                  description: Home final score.
                  type: integer
                match_id:
                  description: Game id of a recent game of this team.
                  type: integer
                match_result:
                  description: 1 = the keyed team won, -1 = lost.
                  type: integer
                side:
                  description: '`h` = the keyed team was home, `v` = away.'
                  type: string
                vs:
                  description: Away final score.
                  type: integer
              type: object
            type: array
          description: Recent results of each team, keyed by team id (null without `d` for a finished
            championship).
          type: object
      type: object
    GetChampionships:
      description: 'One row per championship: a season has one per phase (Regular Season `RS`, Play Off
        `PO`, sometimes a relegation play-out). Serie A history starts with 1948 in the unfiltered list;
        `cs_id=1` lists 85 championships, 1974-2026.'
      properties:
        cache_key:
          description: Server cache key of this response (opaque, `<prefix>CK:<epoch>` parts); changes
            when the data is refreshed.
          type: string
        cdn_url:
          description: Media host (`https://lba-media.s3.eu-south-1.amazonaws.com`); image keys resolve
            under it.
          type: string
        competitions:
          description: Championships of the season, one per phase.
          items:
            description: One element of `competitions`.
            properties:
              championship_series_id:
                description: Series id, 1 = Serie A.
                type: integer
              championship_type_id:
                description: 'Phase type id: 4 = Regular Season, 2 = Play Off.'
                type: integer
              cserie_code:
                description: Series code, `A1` = Serie A.
                type: string
              cserie_name:
                description: Series name.
                type: string
              ctype_code:
                description: 'Phase type code: `RS` / `PO`.'
                type: string
              ctype_name:
                description: 'Phase type name, as sent in English: `Regular Season`, `Play Off`.'
                type: string
              focus_on:
                description: Highlighted on the site.
                type: boolean
              full_name:
                description: Name with the season, e.g. `Regular Season A 2017`.
                type: string
              id:
                description: Championship id (one season and phase).
                type: integer
              logo_key:
                description: 'Image key: the image is `{cdn_url}/{key}`, resized copies `{cdn_url}/variants/{key}/thumb`
                  or `/large` (the site''s getApiImageUrl).'
                type:
                - string
                - 'null'
              name:
                description: Championship name, e.g. `Regular Season A`, `Play Off A1`.
                type: string
              status:
                description: 'Championship status: 1 = in progress, 2 = finished (inferred from the 2026-27
                  and past samples).'
                type: integer
              year:
                description: Season START year (2026 = 2026-27); sdv END year = year + 1.
                type: integer
            type: object
          type: array
        pagination:
          description: Paging state.
          properties:
            count:
              description: Total rows over all pages.
              type: integer
            first_url:
              description: Backend URL of the first page (`/api/v1/...`; an internal path, not this host's).
              type: string
            from:
              description: 1-based index of the first row on this page.
              type: integer
            in:
              description: Rows on this page.
              type: integer
            items:
              description: Page size.
              type: integer
            last:
              description: Last page number.
              type: integer
            last_url:
              description: Backend URL of the last page.
              type: string
            next:
              description: Next page number, null on the last.
              x-unobserved: true
            next_url:
              description: Backend URL of the next page (ends in `page=` when there is none).
              type: string
            page:
              description: This page, 1-based.
              type: integer
            page_url:
              description: Backend URL of this page.
              type: string
            pages:
              description: Number of pages.
              type: integer
            prev:
              description: Previous page number, null on the first.
              x-unobserved: true
            prev_url:
              description: Backend URL of the previous page (ends in `page=` when there is none).
              type: string
            to:
              description: 1-based index of the last row on this page.
              type: integer
          type: object
      type: object
