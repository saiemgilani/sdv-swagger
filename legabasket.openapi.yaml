            focus_on:
              description: Highlighted on the site.
              type: boolean
            full_name:
              description: Name with the season, e.g. `Regular Season A 2017`.
              type: string
            homepage_calendar:
              description: Site display flag.
              type: boolean
            homepage_slider:
              description: Site display flag.
              type: boolean
            id:
              description: Championship id (one season and phase).
              type: integer
            logo_key:
              description: 'Image key: the image is `{cdn_url}/{key}`, resized copies `{cdn_url}/variants/{key}/thumb`
                or `/large` (the site''s getApiImageUrl).'
              type:
              - string
              - 'null'
            name:
