      summary: Season team leaderboards, offensive or defensive
  /teams/get-team-players-stats:
    get:
      description: 'One row per player of the team for the season (totals by default). Captured for: 2026-27,
        1995-96.'
      operationId: teams_get_team_players_stats
      parameters:
      - description: Team id (one season).
        example: '1764'
        in: query
        name: id
        required: true
        schema:
          type: integer
      - description: 'Season START year (2026 = 2026-27; sdv END year = s + 1). Probed: 2026, 2017 and
          1995 return different seasons.'
        example: '2026'
        in: query
        name: s
        required: false
        schema:
          type: integer
      - description: 'Championship series: 1 = Serie A (others seen in the site filters: 5 = Coppa Italia).
          Probed with 1.'
        example: '1'
        in: query
        name: cs_id
        required: false
        schema:
          type: integer
      - description: 'Stats type: `sum` (totals, the site default), `avg` or `max` (see `filters.stats_types`).
          From the site JS; not probed.'
        in: query
        name: st
        required: false
        schema:
          type: string
      - description: 'Championship type id: 4 = Regular Season, 2 = Play Off. From the site JS; not probed.'
        in: query
        name: ct_id
        required: false
        schema:
          type: integer
      - description: Games filter. From the site JS; not probed.
        in: query
        name: ms
        required: false
        schema:
          type: string
      - description: Result filter (wins / losses). From the site JS; not probed.
        in: query
        name: mr
        required: false
        schema:
          type: string
      - description: First round of a round range. From the site JS; not probed.
        in: query
        name: esf
        required: false
        schema:
          type: integer
      - description: Last round of a round range. From the site JS; not probed.
        in: query
        name: est
        required: false
        schema:
          type: integer
      - description: Order by a stat (see `filters.stats_orby`). From the site JS; not probed.
        in: query
        name: ob
        required: false
        schema:
          type: string
      - description: Phase id (1 = Andata / first half, 2 = Ritorno / second half). From the site JS;
          not probed.
        in: query
        name: ph_id
        required: false
        schema:
          type: integer
