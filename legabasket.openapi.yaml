                  type: integer
                mw:
                  type: integer
                points:
                  type: integer
                pos:
                  type: integer
              type: object
          type: object
        team:
          properties:
            club_code:
              type: string
            club_id:
              type: integer
            id:
              type: integer
            logo_key:
              type:
              - string
              - 'null'
            name:
              type: string
            updated_at:
              type: string
            year:
              type: integer
          type: object
      type: object
    GetTeams:
      properties:
        cache_key:
          type: string
        cdn_url:
          type: string
        pagination:
          properties:
            count:
              type: integer
            first_url:
              type: string
            from:
              type: integer
            in:
              type: integer
            items:
              type: integer
            last:
              type: integer
            last_url:
              type: string
            next:
              type:
              - 'null'
            next_url:
              type: string
            page:
              type: integer
            page_url:
              type: string
            pages:
              type: integer
            prev:
              type:
              - 'null'
            prev_url:
              type: string
            to:
              type: integer
          type: object
        teams:
          items:
            properties:
              club_code:
                type: string
              club_id:
                type: integer
              id:
                type: integer
              logo_key:
                type:
                - string
                - 'null'
              name:
                type: string
              updated_at:
                type: string
              year:
                type: integer
            type: object
          type: array
      type: object
    GetTeamsStatisticsByType:
      properties:
        cache_key:
          type: string
        cdn_url:
          type: string
        filters:
          properties:
            categories:
              items:
                properties:
                  code:
                    type: string
                  description:
                    type: string
                type: object
              type: array
            order_by:
              items:
                properties:
                  code:
                    type: string
                  description:
                    type: string
                type: object
              type: array
          type: object
        stats:
          items:
            properties:
              attempts:
                type: integer
              category:
                type: string
              logo_key:
                type:
                - string
                - 'null'
              minutes:
                type: number
              name:
                type: string
              score:
                type: number
              score_40_min:
                type: number
              short_name:
                type: string
              sponsor_name:
                type:
                - string
                - 'null'
              team_id:
                type: integer
              total_played_matches:
                type: integer
              total_points:
                type: integer
              tv_name:
                type: string
              year:
                type: integer
            type: object
          type: array
      type: object
info:
  description: 'The JSON routes behind legabasket.it (Lega Basket Serie A, Italy). Keyless; robots.txt
    asks for `Crawl-delay: 2`. Routes and query params come from the site''s JS; shapes from committed
    captures in legabasket/captures/ (2026-27, 2017-18, 1995-96). `year` / `s` are the season START year
    (2026 = 2026-27, sdv END year 2027). Championship ids are per season and phase (Regular Season and
    Play Off differ); game and player ids are global; team ids are re-issued every season. Every body
    carries `cache_key` and `cdn_url` (image keys resolve under `cdn_url`). The ToS forbid copying data
    without written consent. Not official or supported.'
  title: LBA Serie A site API (www.legabasket.it/api)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /championships/get-championship-ranking:
    get:
      description: 'Standings after a round, with each team''s recent results (`teams_matches_series`).
        Captured for: 2026-27, 2017-18, 1995-96.'
      operationId: championships_get_championship_ranking
      parameters:
      - description: Championship id (Regular Season ids carry standings).
        example: '602'
        in: query
        name: id
        required: true
        schema:
          type: integer
      - description: 'Standings after this round (`filters.days[].event_serial`). REQUIRED in practice
          for a finished championship: without it `standings` and `teams_matches_series` are null (probed
          for 1995-96, 2017-18 to 2023-24 and 2025-26); the current season answers without it.'
        example: '3'
        in: query
        name: d
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChampionshipRanking'
          description: OK
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'Unknown or missing id (or a missing required param): `Internal Server Error` as
            text/plain, not JSON.'
      summary: Standings of a championship after a round
  /championships/get-championships:
    get:
      description: 'One row per championship: a season has one per phase (Regular Season `RS`, Play Off
        `PO`, sometimes a relegation play-out). Serie A history starts with 1948 in the unfiltered list;
        `cs_id=1` lists 85 championships, 1974-2026. Captured for: 2026-27, 2017-18, 1995-96.'
      operationId: championships_get_championships
      parameters:
      - description: 'Season START year (2026 = 2026-27; sdv END year = s + 1). Probed: 2026, 2017 and
          1995 return different seasons. Without `s`, every season is listed (310 championships, paged).'
        example: '2026'
        in: query
        name: s
        required: false
        schema:
          type: integer
      - description: 'Championship series: 1 = Serie A (others seen in the site filters: 5 = Coppa Italia).
          Probed with 1. Without it, every series (A, A2, cups) is listed.'
        example: '1'
        in: query
        name: cs_id
        required: false
        schema:
          type: integer
      - description: Page size (default 25). 1000 returns any season in one page.
        example: '1000'
        in: query
        name: items
        required: false
        schema:
          type: integer
      - description: Page number, 1-based (see `pagination`).
        in: query
        name: page
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChampionships'
          description: OK
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'Unknown or missing id (or a missing required param): `Internal Server Error` as
            text/plain, not JSON.'
      summary: Championships (one per phase) of a season
  /championships/get-championships-calendar-by-id:
    get:
      description: 'One round of games with the round and phase filters. Box scores exist back to 1995-96
        at least. Captured for: 2026-27, 2017-18, 1995-96.'
      operationId: championships_get_championships_calendar_by_id
      parameters:
      - description: Championship id (one season and phase; from get-championships `competitions[].id`).
        example: '602'
        in: query
        name: id
        required: true
        schema:
          type: integer
      - description: 'Round (`filters.days[].event_serial`). Without it: the current round (the last played
          one for a finished championship). Probed.'
        example: '1'
        in: query
        name: d
        required: false
        schema:
          type: integer
      - description: 'Team id: only that team''s games. From the site JS; not probed.'
        in: query
        name: t_id
        required: false
        schema:
          type: integer
      - description: Phase id (`filters.phases[].id`). From the site JS; not probed.
        in: query
        name: ph_id
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChampionshipsCalendarById'
          description: OK
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'Unknown or missing id (or a missing required param): `Internal Server Error` as
            text/plain, not JSON.'
      summary: Games of one round of a championship
  /championships/get-championships-matches-by-id:
    get:
      description: 'The game page payload: header, referees, head-to-head, recent form, coaches and (with
        `sc=1`) the box score of the scores route. Captured for: 2026-27, 2017-18, 1995-96.'
      operationId: championships_get_championships_matches_by_id
      parameters:
      - description: Game id (global across seasons; from the calendar `matches[].id`).
        example: '25602'
        in: query
        name: id
        required: true
        schema:
          type: integer
      - description: '`1` adds the box score (`scores`) as the site does. Probed with 1 only.'
        example: '1'
        in: query
        name: sc
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChampionshipsMatchesById'
          description: OK
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'Unknown or missing id (or a missing required param): `Internal Server Error` as
            text/plain, not JSON.'
      summary: 'Game header: teams, venue, quarter scores, referees, box score'
  /championships/get-championships-matches-play-by-play:
    get:
      description: 'Actions with Italian event names, clock, score, player, team, court x/y, zone and
        qualifier codes, plus the `legend` code table. Empty (`actions: []`) before 2017-18 and for some
        2017-18 games; the shape changes by era (see the eras table). Captured for: 2026-27, 2017-18.'
      operationId: championships_get_championships_matches_play_by_play
      parameters:
      - description: Game id (global across seasons; from the calendar `matches[].id`).
        example: '25602'
        in: query
        name: id
        required: true
        schema:
          type: integer
      - description: '`true` fills `match` with the game header; without it `match` is `{}` (probed).'
        example: 'true'
        in: query
        name: info
        required: false
        schema:
          enum:
          - 'true'
          - 'false'
          type: string
      - description: '`asc` = chronological, `desc` = newest first (probed: the same actions reversed).'
        example: asc
        in: query
        name: sort
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChampionshipsMatchesPlayByPlay'
          description: OK
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'Unknown or missing id (or a missing required param): `Internal Server Error` as
            text/plain, not JSON.'
      summary: Play-by-play of a game, with x/y and the code legend
  /championships/get-championships-matches-scores-by-id:
    get:
      description: 'Box score in Italian abbreviations: one `rows[]` entry per player, a `team` row (team
        rebounds, team turnovers) and `totals`. Captured for: 2026-27, 2017-18, 1995-96.'
      operationId: championships_get_championships_matches_scores_by_id
      parameters:
      - description: Game id (global across seasons; from the calendar `matches[].id`).
        example: '25602'
        in: query
        name: id
        required: true
        schema:
          type: integer
      - description: '`true` fills `match` with the game header; without it `match` is `{}` (probed).'
        example: 'true'
        in: query
        name: info
        required: false
        schema:
          enum:
          - 'true'
          - 'false'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChampionshipsMatchesScoresById'
          description: OK
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'Unknown or missing id (or a missing required param): `Internal Server Error` as
            text/plain, not JSON.'
      summary: Box score of a game (players, team, totals)
  /matches/get-championship-matches-shots-by-id:
    get:
      description: 'Shooting per court zone per team, as made/attempted strings. Aggregates only: shot
        x/y is in the play-by-play. Captured for: 2026-27, 2017-18.'
      operationId: matches_get_championship_matches_shots_by_id
      parameters:
      - description: Game id (global across seasons; from the calendar `matches[].id`).
        example: '25602'
        in: query
        name: id
        required: true
        schema:
          type: integer
      - description: '`1` fills `match` with the game header.'
        example: '1'
        in: query
        name: info
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChampionshipMatchesShotsById'
          description: OK
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'Unknown or missing id (or a missing required param): `Internal Server Error` as
            text/plain, not JSON.'
      summary: Shooting by court zone per team (aggregates only)
  /players/get-player-by-id:
    get:
      description: 'Player bio; with `stats=1` the current regular season''s totals, highs and averages.
        Captured for: 2026-27.'
      operationId: players_get_player_by_id
      parameters:
      - description: 'Player id (global: one id for a whole career).'
        example: '969'
        in: query
        name: id
        required: true
        schema:
          type: integer
      - description: '`1` adds `stats` (current-season totals, highs and averages).'
        example: '1'
        in: query
        name: stats
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPlayerById'
          description: OK
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'Unknown or missing id (or a missing required param): `Internal Server Error` as
            text/plain, not JSON.'
      summary: Player bio plus current-season totals, highs and averages
  /players/get-player-matches:
    get:
      description: 'Game log of one season with season averages, highs and totals. Captured for: 2026-27,
        1995-96.'
      operationId: players_get_player_matches
      parameters:
      - description: Player id (global).
        example: '969'
        in: query
        name: id
        required: true
        schema:
          type: integer
      - description: 'Season START year (2026 = 2026-27; sdv END year = s + 1). Probed: 2026, 2017 and
          1995 return different seasons.'
        example: '2026'
        in: query
        name: s
        required: false
        schema:
          type: integer
      - description: 'Championship series: 1 = Serie A (others seen in the site filters: 5 = Coppa Italia).
          Probed with 1.'
        example: '1'
        in: query
        name: cs_id
        required: false
        schema:
          type: integer
      - description: 'Championship type id: 4 = Regular Season, 2 = Play Off. From the site JS; not probed.'
        in: query
        name: ct_id
        required: false
        schema:
          type: integer
      - description: Games filter. From the site JS; not probed.
        in: query
        name: ms
        required: false
        schema:
          type: string
      - description: Result filter (wins / losses). From the site JS; not probed.
        in: query
        name: mr
        required: false
        schema:
          type: string
      - description: First round of a round range. From the site JS; not probed.
        in: query
        name: esf
        required: false
        schema:
          type: integer
      - description: Last round of a round range. From the site JS; not probed.
        in: query
        name: est
        required: false
        schema:
          type: integer
      - description: Order by a stat (see `filters.stats_orby`). From the site JS; not probed.
        in: query
        name: ob
        required: false
        schema:
          type: string
      - description: Phase id (1 = Andata / first half, 2 = Ritorno / second half). From the site JS;
          not probed.
        in: query
        name: ph_id
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPlayerMatches'
          description: OK
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'Unknown or missing id (or a missing required param): `Internal Server Error` as
            text/plain, not JSON.'
      summary: Game log of a player in a season
  /players/get-player-stats:
    get:
      description: 'Career table: one row per season, competition and team, as per-game averages, single-game
        highs and totals. Captured for: 2026-27.'
      operationId: players_get_player_stats
      parameters:
      - description: Player id (global).
        example: '969'
        in: query
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPlayerStats'
          description: OK
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'Unknown or missing id (or a missing required param): `Internal Server Error` as
            text/plain, not JSON.'
      summary: Career stats of a player by championship (averages, highs, totals)
  /players/get-players:
    get:
      description: 'Players of a season, paged (`pagination`). Captured for: 2026-27, 1995-96.'
      operationId: players_get_players
      parameters:
      - description: 'Season START year (2026 = 2026-27; sdv END year = s + 1). Probed: 2026, 2017 and
          1995 return different seasons.'
        example: '2026'
        in: query
        name: year
        required: false
        schema:
          type: integer
      - description: Page size (default 50 on the site).
        example: '50'
        in: query
        name: items
        required: false
        schema:
          type: integer
      - description: Page number, 1-based (see `pagination`).
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: Name search. From the site JS; not probed.
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: '`1` = extended rows. From the site JS; not probed.'
        in: query
        name: full
        required: false
        schema:
          type: string
      - description: Role id. From the site JS; not probed.
        in: query
        name: r_id
        required: false
        schema:
          type: integer
      - description: Team id. From the site JS; not probed.
        in: query
        name: t_id
        required: false
        schema:
          type: integer
      - description: Sort column. From the site JS; not probed.
        in: query
        name: ob
        required: false
        schema:
          type: string
      - description: Sort direction. From the site JS; not probed.
        in: query
        name: sb
        required: false
        schema:
          type: string
      - description: Country code filter. From the site JS; not probed.
        in: query
        name: ic_id
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPlayers'
          description: OK
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'Unknown or missing id (or a missing required param): `Internal Server Error` as
            text/plain, not JSON.'
      summary: Players of a season (paged)
  /statistics/get-players-statistics:
    get:
      description: 'League leaderboard for one category (50 rows), with the value as total, average and
        per-40-minutes. Captured for: 2026-27, 2017-18, 1995-96.'
      operationId: statistics_get_players_statistics
      parameters:
      - description: 'Season START year (2026 = 2026-27; sdv END year = s + 1). Probed: 2026, 2017 and
          1995 return different seasons.'
        example: '2026'
        in: query
        name: s
        required: false
        schema:
          type: integer
      - description: 'Championship series: 1 = Serie A (others seen in the site filters: 5 = Coppa Italia).
          Probed with 1.'
        example: '1'
        in: query
        name: cs_id
        required: false
        schema:
          type: integer
      - description: Category, e.g. `points`, `rating_lega`, `total_rebound`, `assists`, `shots_3p_perc`
          (see `filters.categories`). Probed with `points`.
        example: points
        in: query
        name: cat
        required: false
        schema:
          type: string
      - description: First season of a season range (START year). From the site JS; not probed.
        in: query
        name: sf
        required: false
        schema:
          type: integer
      - description: Last season of a season range (START year). From the site JS; not probed.
        in: query
        name: st
        required: false
        schema:
          type: integer
      - description: Championship id (one phase). From the site JS; not probed.
        in: query
        name: c_id
        required: false
        schema:
          type: integer
      - description: 'Championship type id: 4 = Regular Season, 2 = Play Off. From the site JS; not probed.'
        in: query
        name: ct_id
        required: false
        schema:
          type: integer
      - description: Round (`event_serial`). From the site JS; not probed.
        in: query
        name: es
        required: false
        schema:
          type: integer
      - description: 'Order: `sum` (totals), `avg` (per game, the default) or `40_perc` (per 40 minutes
          / percentage); see `filters.order_by`. From the site JS; not probed.'
        in: query
        name: ob
        required: false
        schema:
          type: string
      - description: Games filter. From the site JS; not probed.
        in: query
        name: ms
        required: false
        schema:
          type: string
      - description: Result filter (wins / losses). From the site JS; not probed.
        in: query
        name: mr
        required: false
        schema:
          type: string
      - description: Phase filter (first / second half of the season). From the site JS; not probed.
        in: query
        name: turn
        required: false
        schema:
          type: string
      - description: Round filter. From the site JS; not probed.
        in: query
        name: round
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPlayersStatistics'
          description: OK
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'Unknown or missing id (or a missing required param): `Internal Server Error` as
            text/plain, not JSON.'
      summary: Season player leaderboard for one category
  /statistics/get-teams-statistics-by-type:
    get:
      description: 'Team leaderboards, offensive (`teams_offensive`) or allowed (`teams_defensive`), one
        row per category and team. Captured for: 2026-27, 2017-18, 1995-96.'
      operationId: statistics_get_teams_statistics_by_type
      parameters:
      - description: '`teams_offensive` or `teams_defensive` (probed both). Missing or other values answer
          HTTP 500.'
        example: teams_offensive
        in: query
        name: type
        required: true
        schema:
          enum:
          - teams_offensive
          - teams_defensive
          type: string
      - description: 'Season START year (2026 = 2026-27; sdv END year = s + 1). Probed: 2026, 2017 and
          1995 return different seasons.'
        example: '2026'
        in: query
        name: s
        required: false
        schema:
          type: integer
      - description: 'Championship series: 1 = Serie A (others seen in the site filters: 5 = Coppa Italia).
          Probed with 1.'
        example: '1'
        in: query
        name: cs_id
        required: false
        schema:
          type: integer
      - description: Category (see `filters.categories`); without it every category is returned (85 rows
          for 2026-27). From the site JS; not probed.
        in: query
        name: cat
        required: false
        schema:
          type: string
      - description: First season of a season range (START year). From the site JS; not probed.
        in: query
        name: sf
        required: false
        schema:
          type: integer
      - description: Last season of a season range (START year). From the site JS; not probed.
        in: query
        name: st
        required: false
        schema:
          type: integer
      - description: Championship id (one phase). From the site JS; not probed.
        in: query
        name: c_id
        required: false
        schema:
          type: integer
      - description: 'Championship type id: 4 = Regular Season, 2 = Play Off. From the site JS; not probed.'
        in: query
        name: ct_id
        required: false
        schema:
          type: integer
      - description: Round (`event_serial`). From the site JS; not probed.
        in: query
        name: es
        required: false
        schema:
          type: integer
      - description: 'Order: `sum` (totals), `avg` (per game, the default) or `40_perc` (per 40 minutes
          / percentage); see `filters.order_by`. From the site JS; not probed.'
        in: query
        name: ob
        required: false
        schema:
          type: string
      - description: Games filter. From the site JS; not probed.
        in: query
        name: ms
        required: false
        schema:
          type: string
      - description: Result filter (wins / losses). From the site JS; not probed.
        in: query
        name: mr
        required: false
        schema:
          type: string
      - description: Phase filter (first / second half of the season). From the site JS; not probed.
        in: query
        name: turn
        required: false
        schema:
          type: string
