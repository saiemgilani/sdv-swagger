info:
  description: 'ESPN headline feeds: cross-sport, per league, and one story by id. Routes probed live
    2026-10-06; shapes from committed captures in espn-content/captures/ (first page only, limit=3). Keyless.
    The list routes page with limit/offset (see x-pagination); team= and athlete= are ignored. Same headlines[]
    envelope as now.core.api.espn.com (espn/espn-now.openapi.yaml), scoped per league. Not official or
    supported.'
  title: ESPN content.core v1 (content.core.api.espn.com)
  version: '2026-10-06'
openapi: 3.1.0
paths:
  /sports/news:
    get:
      operationId: sports_news
      parameters:
      - description: Page size (default 10; the body echoes resultsLimit).
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: Page offset (body echoes resultsOffset).
        in: query
        name: offset
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsNews'
          description: OK
      summary: Cross-sport headlines (limit, offset)
      x-pagination:
        params:
        - limit
        - offset
        request: verified
        response:
        - resultsCount
        - resultsLimit
        - resultsOffset
        style: offset
  /sports/news/{id}:
    get:
      operationId: sports_news_id
      parameters:
      - description: Story id (headlines[].id; links.api.self.href points here).
        example: '49778940'
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsNewsId'
          description: OK
      summary: One story (same envelope, one headline)
  /sports/{sport}/{league}/news:
    get:
      operationId: sports_sport_league_news
      parameters:
      - description: ESPN sport slug (football, basketball, soccer, ...).
        example: football
        in: path
        name: sport
        required: true
        schema:
          type: string
      - description: ESPN league slug (nfl, college-football, nba, mens-college-basketball, eng.1, ...).
        example: nfl
        in: path
        name: league
        required: true
        schema:
          type: string
      - description: Page size (default 10; the body echoes resultsLimit).
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: Page offset (body echoes resultsOffset).
        in: query
        name: offset
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsSportLeagueNews'
          description: OK
      summary: Headlines for one league (limit, offset)
      x-pagination:
        params:
        - limit
        - offset
        request: verified
        response:
        - resultsCount
        - resultsLimit
        - resultsOffset
        style: offset
servers:
- url: https://content.core.api.espn.com/v1
