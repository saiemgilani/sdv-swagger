                description: Two-point field-goal attempts, made + missed (actions 201/207 + 202/208).
                  This game, team total.
                type: integer
              fgt:
                description: Field goals made, two- and three-point (fg + threep). This game, team total.
                type: integer
              fgtA:
                description: Field-goal attempts, two- and three-point (fgA + threepA). This game, team
                  total.
                type: integer
              foul:
                description: Personal fouls (wft + woft). This game, team total.
                type: integer
              foulout:
                description: Players fouled out (unverified). This game, team total.
                type: integer
              ft:
                description: Free throws made (action 203). This game, team total.
                type: integer
              ftA:
                description: Free-throw attempts, made + missed (203 + 204). This game, team total.
                type: integer
              gd:
                description: Good-defense plays (action 221). This game, team total.
                type: integer
              idf:
                description: Illegal-defense violations (action 219; an early-KBL rule, so non-zero only
                  in old seasons). This game, team total.
                type: integer
              inout:
                description: Times the player entered the game, the start included (checked on the 2025-26
                  sample game); a team row sums its players. This game, team total.
                type: integer
              inout1:
                description: Times the player was substituted out before the end (checked on the 2025-26
                  sample game); a team row sums its players. This game, team total.
                type: integer
              maxContiScoreCn:
                description: 'Longest scoring run: the most consecutive points without an opponent score.
                  This game, team total.'
                type: integer
              maxLeadScoreCn:
                description: Largest lead, in points. This game, team total.
                type: integer
              netrtg:
                description: 'Net rating: offrtg - defrtg. This game, team total.'
                type: number
              offr:
                description: Offensive rebounds (action 209). This game, team total.
                type: integer
              offrtg:
                description: 'Offensive rating: points scored per 100 possessions (estimated). This game,
                  team total.'
                type: number
              orebRt:
                description: Offensive-rebound percentage, 0-100. This game, team total.
                type: number
              pace:
                description: Possessions per 40 minutes (estimated; a player row covers his minutes on
                  court). This game, team total.
                type: number
              playMin:
                description: Minutes of playing time summed over the players (200 = 5 x 40 in regulation);
                  add playSec. This game, team total.
                type: integer
              playSec:
                description: Seconds part of the playing time (0-59), added to `playMin`. This game, team
                  total.
                type: integer
              poss:
                description: Possessions (estimated). This game, team total.
                type: number
              pp:
                description: Field goals made in the paint. This game, team total.
                type: integer
              ppA:
                description: Field-goal attempts in the paint. This game, team total.
                type: integer
              pscore:
                description: Points in the paint (2 * pp). This game, team total.
                type: integer
              rb:
                description: Total rebounds (offr + defr; team rebounds are `teamR`). This game, team
                  total.
                type: integer
              rebRt:
                description: Total-rebound percentage, 0-100. This game, team total.
                type: number
              sast:
                description: Screen assists (action 226; tracked in recent seasons only, 0 before). This
                  game, team total.
                type: integer
              score:
                description: Points. This game, team total.
                type: integer
              scoreHighTimeCn:
                description: Seconds the team led (the two teams' values sum to less than the 2,400-second
                  game when it was tied or level at times). This game, team total.
                type: integer
              secChanceScoreCn:
                description: Second-chance points. This game, team total.
                type: integer
              stl:
                description: Steals (action 212). This game, team total.
                type: integer
              teamR:
                description: Team rebounds (action 218). This game, team total.
                type: integer
              tf:
                description: Probably technical fouls (unverified; 0 in most rows). This game, team total.
                type: integer
              tfb:
                description: Team fast breaks (action 217). This game, team total.
                type: integer
              threep:
                description: Three-point field goals made (action 205). This game, team total.
                type: integer
              threepA:
                description: Three-point attempts, made + missed (205 + 206). This game, team total.
                type: integer
              to:
                description: Turnovers (action 214). This game, team total.
                type: integer
              tovRt:
                description: 'Turnover rate: turnovers per 100 possessions, 0-100. This game, team total.'
                type: number
              tsRt:
                description: True-shooting percentage, 0-100. This game, team total.
                type: number
              tto:
                description: Team turnovers (action 223). This game, team total.
                type: integer
              turnoverScoreCn:
                description: Points off turnovers. This game, team total.
                type: integer
              wft:
                description: Fouls that awarded free throws (action 215). This game, team total.
                type: integer
              woft:
                description: Fouls that awarded no free throws (action 216). This game, team total.
                type: integer
            type: object
          tcode:
            description: 'KBL team code (2-digit string, e.g. ''50'' = Changwon LG). Joins to /common/teamList
              `teamCode`, game `tcodeH`/`tcodeA`, `t` in text-cast. Not stable across ownership changes:
              the Anyang club is ''40'' (SBS) in 1997-98 and ''70'' today. D-League sides have their own
              codes (`teamCodeD`).'
            type: string
        type: object
      type: array
    MatchGmkeyTextCast:
      description: Play-by-play (text cast) for the requested quarters.
      items:
        properties:
          a:
            description: Action code (string, e.g. '201'); table in the returns md.
            type: string
          c:
            description: Substitution sub-type code on substitution-out (102) rows (e.g. '101_0'); table
              in the returns md.
            type: string
          e:
            description: Player name in English / romanized; absent on team and game events.
            type: string
          m:
            description: Minutes remaining in the period (10-minute quarters, 5-minute overtimes).
            type: integer
          n:
            description: Sequence number of the event in the game (1-based); 0 on every row of some games
              (e.g. S45G01N95), so order by array position.
            type: integer
          p:
            description: Player name in Korean; absent on team and game events.
            type: string
          q:
            description: 'Period: Q1-Q4; overtime is ''X1'', ''X2'', ... in text-cast but ''EQ1'', ''EQ2'',
              ... in match-chart and the request''s quarterList.'
            type: string
          s:
            description: Seconds part of the time remaining (0-59).
            type: integer
          t:
            description: Team code of the acting team (the KBL team code, as `tcodeH`/`tcodeA`); '' (or
              ' ' in 1997-98) on game events such as period start/end.
            type: string
        type: object
      type: array
    MatchList:
      description: Every game (all competitions) dated within fromDate..toDate.
      items:
        properties:
          artcSq:
            description: Id of the game's news article on kbl.or.kr; null when none.
            type:
            - integer
            - 'null'
          bookmarkFlag:
            description: 1 when the logged-in user bookmarked the game; always 0 for an anonymous request.
            type: integer
          challengeSq:
            description: Id of the game in KBL Challenge (the site's prediction game); null when none.
            type:
            - integer
            - 'null'
          gameCode:
            description: 'Competition type within the season (2-digit string; code table in the README
              and below): 01 regular season, 03 playoffs, 04 final, ...'
            type: string
          gameDate:
            description: Game date, YYYYMMDD (local, KST).
            type: string
          gameEnd:
            description: End time, HHMM (KST); '0000' or blanks when not recorded.
            type: string
          gameNo:
            description: Game number within the competition (glkey); the N part of the gmkey.
            type: integer
          gameStart:
            description: Tip-off time, HHMM (KST).
            type: string
          gameTime:
            description: 'Duration in minutes: an integer in the header, a numeric string in /match/list
              (e.g. ''142''); null on some list rows.'
            type: string
          glkey:
            description: 'Competition key `S{seasonCode}G{gameCode}` (e.g. S47G01 = 2025-26 regular season):
              the id of the /leagues and /league/rank routes.'
            type: string
          gmkey:
            description: 'Game key `S{seasonCode}G{gameCode}N{gameNo}` (e.g. S47G01N49): the id of every
              /match/{gmkey} route.'
            type: string
          isEnded:
            description: '1 when the game is over. Unreliable: 0 on every finished game through 2005-06
              and on some later ones (e.g. S45G01N95''s header); the capture treats a past-dated game
              with scores as final.'
            type: integer
          isStarted:
            description: 1 when the game has started. Unreliable for old games (0 on finished 1997-2006
              games in /match/list).
            type: integer
          logoA:
            description: CSS logo class of the away team (site styling).
            type: string
          logoH:
            description: CSS logo class of the home team (site styling).
            type: string
          playingQuarter:
            description: 'Period in progress: ''X'' when none (before or after the game), else e.g. ''Q4''
              or ''EQ1''. Can stay stale after the game (the overtime sample says ''EQ1'').'
            type: string
          replayUrl:
            description: 'Unobserved: null in every sample, so its type and meaning are unconfirmed.'
            x-unobserved: true
          scoreA:
            description: Away team points.
            type: integer
          scoreH:
            description: Home team points.
            type: integer
          seasonCategory:
            description: 'Category code of the competition: R regular season, PO playoffs, CP final, D1/D2
              D-League stages, AS All-Star, EG/CU cups, EA EASL, OM Open Match Day (table below).'
            type: string
          seasonCategoryName:
            description: 'Category name in Korean: ''정규시즌'' regular season, ''플레이오프'' playoffs, ''챔피언결정전''
              championship final, ''D리그 1차'' / ''D리그 2차'' D-League stage 1 / 2, ''올스타게임'' All-Star Game,
              ''컵대회'' cup, ''KBL컵대회'' KBL Cup, ''EASL'', ''OPEN MATCH DAY''.'
            type: string
          seasonCode:
            description: 'KBL season code: sequential over every season and D-League edition (2 = 1997-98,
              47 = 2025-26); the crosswalk to the sdv END year is in the README.'
            type: integer
          seasonGrade:
            description: 'Division: 1 = the KBL itself, 2 = the KBL D-League (reserve league).'
            type: integer
          seasonName1:
            description: 'Season label, as `seasonName` (e.g. ''2025-2026'', ''2010KBLWINTER'', ''2024
              KBL D리그'' = 2024 KBL D-League); an empty string on EASL rows. sdv END year: the README crosswalk.'
            type: string
          stadiumname:
            description: Venue short name (Korean).
            type: string
          stadiumnameEn:
            description: Venue name in English; an empty string, or the Korean name, for some old venues.
            type: string
          stadiumnameF:
            description: Venue full name (Korean).
            type: string
          tcodeA:
            description: 'Away team code. KBL team code (2-digit string, e.g. ''50'' = Changwon LG). Joins
              to /common/teamList `teamCode`, game `tcodeH`/`tcodeA`, `t` in text-cast. Not stable across
              ownership changes: the Anyang club is ''40'' (SBS) in 1997-98 and ''70'' today. D-League
              sides have their own codes (`teamCodeD`).'
            type: string
          tcodeH:
            description: 'Home team code. KBL team code (2-digit string, e.g. ''50'' = Changwon LG). Joins
              to /common/teamList `teamCode`, game `tcodeH`/`tcodeA`, `t` in text-cast. Not stable across
              ownership changes: the Anyang club is ''40'' (SBS) in 1997-98 and ''70'' today. D-League
              sides have their own codes (`teamCodeD`).'
            type: string
          tnameA:
            description: Away team short name (Korean).
            type: string
          tnameFA:
            description: Away team full name (Korean).
            type: string
          tnameFH:
            description: Home team full name (Korean).
            type: string
          tnameH:
            description: Home team short name (Korean).
            type: string
          tv:
            description: Broadcaster name(s), e.g. 'tvN SPORTS', 'SPOTV2 / SPOTV ON'.
            type:
            - string
            - 'null'
          tvCode:
            description: Broadcaster code(s), comma-separated (e.g. 'T24,T25'); the site uses it instead
              of `tv` from seasonCode 45.
            type:
            - string
            - 'null'
          weekDay:
            description: 'Day of the week in Korean: 월 Mon, 화 Tue, 수 Wed, 목 Thu, 금 Fri, 토 Sat, 일 Sun.'
            type: string
        type: object
      type: array
    Players:
      description: Every player in the site's player directory (current and former).
      items:
        properties:
          backNum:
            description: Jersey number (string).
            type: string
          ename:
            description: Player name in English / romanized (sometimes Hangul for former players, e.g.
              'CJ 레슬리').
            type: string
          img:
            description: URL of the player's head-shot photo (kbl.or.kr/files/kbl/players-photo/{pcode}.png).
            type: string
          pcode:
            description: KBL player code (6-digit string). Joins to `pcode` on every route and to `playerNo`
              in /league/round-mvp.
            type: string
          playerFlag:
            description: 'Player type (string): ''0'' domestic, ''1'' foreign import, ''2'' Asian-quota
              player.'
            type: string
          playerLastCareerIf:
            description: 'Meaning unverified: a season-code-like number, ''A'' or ''''.'
            type: string
          pname:
            description: Player name in Korean (foreign players in Hangul transliteration).
            type: string
          pos:
            description: 'Position code (string): C center, FD forward, GD guard, FC forward-center, GF
              guard-forward; table in the returns md.'
            type: string
          tcode:
            description: 'Team code of the player''s current or last team. KBL team code (2-digit string,
              e.g. ''50'' = Changwon LG). Joins to /common/teamList `teamCode`, game `tcodeH`/`tcodeA`,
              `t` in text-cast. Not stable across ownership changes: the Anyang club is ''40'' (SBS) in
              1997-98 and ''70'' today. D-League sides have their own codes (`teamCodeD`).'
            type: string
          teamLogoClass:
            description: CSS logo class of the player's current or last team (site styling).
            type: string
          tname:
            description: Short name (Korean) of the player's current or last team.
            type: string
          tnameEn:
            description: Current team short name in English (e.g. 'JUNG KWAN JANG').
            type: string
        type: object
      type: array
    SeasonList:
      description: Regular seasons (seasonCode, glkey, name, date range), newest first.
      items:
        properties:
          gameCode:
            description: 'Competition type within the season (2-digit string; code table in the README
              and below): 01 regular season, 03 playoffs, 04 final, ...'
            type: string
          gamedateEnd:
            description: Last date of the season, YYYYMMDD.
            type: string
          gamedateStart:
            description: First date of the season, YYYYMMDD.
            type: string
          glkey:
            description: 'Competition key `S{seasonCode}G{gameCode}` (e.g. S47G01 = 2025-26 regular season):
              the id of the /leagues and /league/rank routes.'
            type: string
          seasonCategory:
            description: 'Category code of the competition: R regular season, PO playoffs, CP final, D1/D2
              D-League stages, AS All-Star, EG/CU cups, EA EASL, OM Open Match Day (table below).'
            type: string
          seasonCode:
            description: 'KBL season code: sequential over every season and D-League edition (2 = 1997-98,
              47 = 2025-26); the crosswalk to the sdv END year is in the README.'
            type: integer
          seasonGrade:
            description: 'Division: 1 = the KBL itself, 2 = the KBL D-League (reserve league).'
            type: integer
          seasonName:
            description: 'Season label: ''YYYY-YYYY'' for a KBL season (e.g. ''2025-2026''), ''1997''
              for the 1997 inaugural season, or the D-League edition name (e.g. ''2010KBLWINTER'', ''2024
              KBL D리그'' = 2024 KBL D-League).'
            type: string
          seasonNameFull:
            description: 'Division label: ''1군시즌'' = first-team (top-division) season.'
            type: string
        type: object
      type: array
  securitySchemes:
    channel:
      description: 'Required header, not a secret: the site sends `WEB`. Any value but `APP` passes (APP
        asks for a further `device` header).'
      in: header
      name: Channel
      type: apiKey
    teamCode:
      description: 'Required header, not a secret: the site sends a team code or `XX`; any value, even
        empty, passes.'
      in: header
      name: TeamCode
      type: apiKey
info:
  description: 'The data API behind www.kbl.or.kr (stats by sports2i). Schedules of every competition
    (KBL, its D-League, cups, All-Star, EASL), game headers, play-by-play (text cast), box scores with
    advanced rates, shot charts with x/y, standings, playoff brackets, season player totals and leaders.
    Coverage: play-by-play and box scores from 1997 (seasonCode 1), shot x/y from 2006-07. Keys: gmkey
    `S{seasonCode}G{gameCode}N{gameNo}` and glkey `S{seasonCode}G{gameCode}`; seasonCode is sequential
    over every KBL season and D-League edition, and the README maps each to the sdv END year. No key,
    but every request must carry the `Channel` and `TeamCode` headers (values unchecked). Routes from
    the site bundle; shapes from committed captures in kbl/captures/ (captured 2026-10-12). Korean values
    are translated in the descriptions. x-unobserved = null in every sample. Not official or supported.'
  title: 'KBL (Korean Basketball League) API: api.kbl.or.kr'
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /common/teamList:
    get:
      description: 'Not scope-checked: no parameter; the current clubs.'
      operationId: common_teamList
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonTeamList'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'A required header (`Channel` or `TeamCode`) is missing: {"resultCode":"Fail","message":"필수
            헤더 정보가 누락되었습니다." (required header information is missing),"object":-1101,"errorCode":400}.'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Unknown or malformed id (e.g. /match/S99G01N1, /league/rank/47): {"resultCode":"Fail","message":"서버
            오류가 발생했습니다." (a server error occurred),"object":null,"errorCode":500}. Not retried by the
            capture.'
      summary: 'The current clubs: team code, names (Korean and English), logo class'
  /league/playoff/new/{glkey}:
    get:
      description: For seasonCode >= 45. With a playoff glkey (S45G03) it answers 200 with an empty body.
      operationId: league_playoff_new_glkey
      parameters:
      - description: 'Competition key `S{seasonCode}G{gameCode}` (e.g. S47G01 = 2025-26 regular season):
          the id of the /leagues and /league/rank routes.'
        example: S45G01
        in: path
        name: glkey
        required: true
        schema: &id001
          pattern: ^S\d+G\d{2}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaguePlayoffNewGlkey'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'A required header (`Channel` or `TeamCode`) is missing: {"resultCode":"Fail","message":"필수
            헤더 정보가 누락되었습니다." (required header information is missing),"object":-1101,"errorCode":400}.'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Unknown or malformed id (e.g. /match/S99G01N1, /league/rank/47): {"resultCode":"Fail","message":"서버
            오류가 발생했습니다." (a server error occurred),"object":null,"errorCode":500}. Not retried by the
            capture.'
      summary: Playoff bracket, format used from 2024-25 (seasonCode >= 45)
  /league/playoff/{glkey}:
    get:
      description: The site calls this route for seasonCode < 45 and /league/playoff/new for 45+. The
        glkey's gameCode is not used (S43G03 returns the same body as S43G01).
      operationId: league_playoff_glkey
      parameters:
      - description: 'Competition key `S{seasonCode}G{gameCode}` (e.g. S47G01 = 2025-26 regular season):
          the id of the /leagues and /league/rank routes.'
        example: S43G01
        in: path
        name: glkey
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaguePlayoffGlkey'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'A required header (`Channel` or `TeamCode`) is missing: {"resultCode":"Fail","message":"필수
            헤더 정보가 누락되었습니다." (required header information is missing),"object":-1101,"errorCode":400}.'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Unknown or malformed id (e.g. /match/S99G01N1, /league/rank/47): {"resultCode":"Fail","message":"서버
            오류가 발생했습니다." (a server error occurred),"object":null,"errorCode":500}. Not retried by the
            capture.'
      summary: Playoff bracket, format used through 2023-24 (seasonCode < 45)
  /league/rank/team:
    get:
      description: 'Not scope-checked: no parameter; the active season only.'
      operationId: league_rank_team
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueRankTeam'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'A required header (`Channel` or `TeamCode`) is missing: {"resultCode":"Fail","message":"필수
            헤더 정보가 누락되었습니다." (required header information is missing),"object":-1101,"errorCode":400}.'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Unknown or malformed id (e.g. /match/S99G01N1, /league/rank/47): {"resultCode":"Fail","message":"서버
            오류가 발생했습니다." (a server error occurred),"object":null,"errorCode":500}. Not retried by the
            capture.'
      summary: Current standings (the active season; no parameter)
  /league/rank/{glkey}:
    get:
      operationId: league_rank_glkey
      parameters:
      - description: 'Competition key `S{seasonCode}G{gameCode}` (e.g. S47G01 = 2025-26 regular season):
          the id of the /leagues and /league/rank routes.'
        example: S45G01
        in: path
        name: glkey
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueRankGlkey'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'A required header (`Channel` or `TeamCode`) is missing: {"resultCode":"Fail","message":"필수
            헤더 정보가 누락되었습니다." (required header information is missing),"object":-1101,"errorCode":400}.'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Unknown or malformed id (e.g. /match/S99G01N1, /league/rank/47): {"resultCode":"Fail","message":"서버
            오류가 발생했습니다." (a server error occurred),"object":null,"errorCode":500}. Not retried by the
            capture.'
      summary: Standings of one competition (glkey) with team season totals
  /league/rank/{glkey}/team-tracks:
    get:
      description: 'Not scope-checked: no season echo; `rounds` dates are checked against the season instead.'
      operationId: league_rank_glkey_team_tracks
      parameters:
      - description: 'Competition key `S{seasonCode}G{gameCode}` (e.g. S47G01 = 2025-26 regular season):
          the id of the /leagues and /league/rank routes.'
        example: S45G01
        in: path
        name: glkey
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueRankGlkeyTeamTracks'
