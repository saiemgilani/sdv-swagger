components:
  schemas:
    CommonTeamList:
      description: 'The current clubs: team code, names (Korean and English), logo class.'
      items:
        properties:
          teamCode:
            description: 'KBL team code (2-digit string, e.g. ''50'' = Changwon LG). Joins to /common/teamList
              `teamCode`, game `tcodeH`/`tcodeA`, `t` in text-cast. Not stable across ownership changes:
              the Anyang club is ''40'' (SBS) in 1997-98 and ''70'' today. D-League sides have their own
              codes (`teamCodeD`).'
            type: string
          teamCodeD:
            description: Team code of the club's D-League (reserve) side, in the same team-code space
              as `teamCode`.
            type: string
          teamLogoClass:
            description: CSS logo class of the team on www.kbl.or.kr (e.g. 'lg'; era variants such as
              'hd1997').
            type: string
          teamName:
            description: Team short name (Korean, no space, e.g. '창원LG').
            type: string
          teamNameEn:
            description: Team short name in English.
            type: string
          teamNameFull:
            description: Team full name (Korean).
            type: string
          teamNameFullEn:
            description: Team full name in English (e.g. 'CHANGWON LG SAKERS').
            type: string
        type: object
      type: array
    Error:
      description: KBL error envelope.
      properties:
        errorCode:
          description: The HTTP status repeated.
          type: integer
        message:
          description: Error message in Korean (translated in the response description).
          type: string
        object:
          description: An error number (e.g. -1101) or null.
        resultCode:
          description: '''Fail''.'
          type: string
      type: object
    LeaguePlayoffGlkey:
      description: Playoff bracket, format used through 2023-24 (seasonCode < 45).
      properties:
        defaultRank:
          description: Final regular-season standings that seed the playoffs (top six).
          items:
            properties:
              gameCode:
                description: 'Competition type of the standings: ''01'' regular season.'
                type: string
              rank:
                description: Final regular-season standing, i.e. the playoff seed (string).
                type: string
              seasonCode:
                description: 'KBL season code: sequential over every season and D-League edition (2 =
                  1997-98, 47 = 2025-26); the crosswalk to the sdv END year is in the README.'
                type: integer
              teamCode:
                description: 'KBL team code (2-digit string, e.g. ''50'' = Changwon LG). Joins to /common/teamList
                  `teamCode`, game `tcodeH`/`tcodeA`, `t` in text-cast. Not stable across ownership changes:
                  the Anyang club is ''40'' (SBS) in 1997-98 and ''70'' today. D-League sides have their
                  own codes (`teamCodeD`).'
                type: string
              teamLogoClass:
                description: CSS logo class of the team on www.kbl.or.kr (e.g. 'lg'; era variants such
                  as 'hd1997').
                type: string
              teamName1:
                description: Team short name (Korean).
                type: string
              teamName2:
                description: Team full name (Korean).
                type: string
            type: object
          type: array
        finalResult:
          description: 'Championship final: one row per team.'
          items:
            properties:
              gameCode:
                description: 'Competition type: ''03'' playoffs, ''04'' championship final.'
                type: string
              gameDate:
                description: Date of a game of the series, YYYYMMDD (which one is unverified).
                type: string
              gameHoi:
                description: 'Series number within the round (string): ''1'', ''2''.'
                type: string
              loss:
                description: Series losses of the team.
                type: integer
              seasonCode:
                description: 'KBL season code: sequential over every season and D-League edition (2 =
                  1997-98, 47 = 2025-26); the crosswalk to the sdv END year is in the README.'
