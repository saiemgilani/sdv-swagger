info:
  description: 'The keyless JSON API behind the Sportradar Connect widget (widget.eui.connect.sportradar.com)
    that league sites embed: LNB France (websiteId 12), LNBP Mexico (14), NBL1 (3), El Salvador (13),
    Panama (22), Austria (236), Montenegro (326). One host serves every site; `websiteId` picks the site
    config. eapi.web.prod.cloud.atriumsports.com/v1/embed/... 302-redirects here. Every id is a UUID v1
    shared across sites. Bodies are UI view models (labels in the site locale). Shapes from committed
    captures in atrium-embed/captures/ (truncated samples). Not official or supported.'
  title: Sportradar Atrium / Synergy embed API (embed-api.eui.connect.sportradar.com)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /{websiteId}/entities:
    get:
      description: Teams of a season.
      operationId: entities
      parameters:
      - description: 'Site config id: which league site''s widget this is (12 LNB France, 14 LNBP Mexico,
          3 NBL1, 13 El Salvador, 22 Panama, 236 Austria, 326 Montenegro; registry in the README). Not
          a league id: one site serves several competitions.'
        example: 12
        in: path
        name: websiteId
        required: true
        schema: &id001
          type: integer
      - description: Season id (UUID v1) from `data.seasons.seasons[].seasonId` of /fixtures. Omitted,
          the site's default season is served (the one its widget opens on).
        example: df310a05-51ad-11f0-bd89-c735508e1e09
        in: query
        name: seasonId
        required: false
        schema: &id002
          format: uuid
          type: string
      - description: UI language of every label and of the play-by-play `desc` text, e.g. `en-EN`, `fr-FR`,
          `es-ES`. Omitted = the site default (12 fr-FR, 14 es-ES, 236 de-AT, 3/326 en-EN). Ids and values
          are unaffected.
        in: query
        name: locale
        required: false
        schema: &id003
          type: string
      - description: 'The widget''s alternative to the plain params: base64url(zlib(JSON)) of {s: seasonId,
          l: locale, z: sub, f: fixtureId, e: entityId, p: personId, rn: roundNumber}, i.e. the part of
          a `link` after `~w=<prefix>~`. Send only the part after the prefix: `state=f~...` is a 400.
          When sent, the widget drops `sub`.'
        in: query
        name: state
        required: false
        schema: &id004
          type: string
      - description: Flag the widget adds when its element carries `data-cru`; accepted by every type,
          effect unverified.
        in: query
        name: cru
        required: false
        schema: &id005
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entities'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request (unknown or invalid param)
      summary: Teams of a season
  /{websiteId}/entity_detail:
    get:
      description: 'A team page (summary tab: last and next game, standings excerpt, a stat leader).'
      operationId: entity_detail
      parameters:
      - description: 'Site config id: which league site''s widget this is (12 LNB France, 14 LNBP Mexico,
          3 NBL1, 13 El Salvador, 22 Panama, 236 Austria, 326 Montenegro; registry in the README). Not
          a league id: one site serves several competitions.'
        example: 12
        in: path
        name: websiteId
        required: true
        schema: *id001
      - description: Entity (team) id, UUID v1, from `competitors[].entityId` or `data.teams[].entityId`.
        example: f43b1b0f-55bc-11f0-84d9-01499d2f0a07
        in: query
        name: entityId
        required: true
        schema: *id002
      - description: Season id (UUID v1) from `data.seasons.seasons[].seasonId` of /fixtures. Omitted,
          the site's default season is served (the one its widget opens on).
        example: df310a05-51ad-11f0-bd89-c735508e1e09
        in: query
        name: seasonId
        required: false
        schema: *id002
      - description: UI language of every label and of the play-by-play `desc` text, e.g. `en-EN`, `fr-FR`,
          `es-ES`. Omitted = the site default (12 fr-FR, 14 es-ES, 236 de-AT, 3/326 en-EN). Ids and values
          are unaffected.
        in: query
        name: locale
        required: false
        schema: *id003
      - description: 'The widget''s alternative to the plain params: base64url(zlib(JSON)) of {s: seasonId,
          l: locale, z: sub, f: fixtureId, e: entityId, p: personId, rn: roundNumber}, i.e. the part of
          a `link` after `~w=<prefix>~`. Send only the part after the prefix: `state=f~...` is a 400.
          When sent, the widget drops `sub`.'
        in: query
        name: state
        required: false
        schema: *id004
      - description: Flag the widget adds when its element carries `data-cru`; accepted by every type,
          effect unverified.
        in: query
        name: cru
        required: false
        schema: *id005
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityDetail'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request (unknown or invalid param)
      summary: 'A team page (summary tab: last and next game, standings excerpt, a stat leader)'
  /{websiteId}/fixture_detail:
    get:
      description: 'Variants by `sub`: `statistics` → FixtureDetailStatistics, `pbp` → FixtureDetailPbp,
        `shot_chart` → FixtureDetailShotChart.'
      operationId: fixture_detail
      parameters:
      - description: 'Site config id: which league site''s widget this is (12 LNB France, 14 LNBP Mexico,
          3 NBL1, 13 El Salvador, 22 Panama, 236 Austria, 326 Montenegro; registry in the README). Not
          a league id: one site serves several competitions.'
        example: 12
        in: path
        name: websiteId
        required: true
        schema: *id001
      - description: Fixture (game) id, UUID v1, from `data.fixtures[].fixtureId`. Required unless `state`
          carries it.
        example: 5423072b-6715-11f0-bd8b-9ffadebc148f
        in: query
        name: fixtureId
        required: true
        schema: *id002
      - description: 'Tab, which changes the body: `statistics` box score (also the default), `pbp` play-by-play,
          `shot_chart` shots with x/y. `preview`, `analysis` and `leaders` answered 200 on 2026-10-12
          but are not specced (not captured). An unknown value is not an error: it returns a summary body.'
        example: statistics
        in: query
        name: sub
        required: false
        schema:
          enum:
          - statistics
          - pbp
          - shot_chart
          - preview
          - analysis
          - leaders
          type: string
      - description: Season id (UUID v1) from `data.seasons.seasons[].seasonId` of /fixtures. Omitted,
          the site's default season is served (the one its widget opens on).
        in: query
        name: seasonId
        required: false
        schema: *id002
      - description: Competition id, UUID v1, from `data.seasons.seasons[].competitionId`. One id per
          competition edition (LNB has a new Betclic ÉLITE id every season).
        in: query
        name: competitionId
        required: false
        schema: *id002
      - description: UI language of every label and of the play-by-play `desc` text, e.g. `en-EN`, `fr-FR`,
          `es-ES`. Omitted = the site default (12 fr-FR, 14 es-ES, 236 de-AT, 3/326 en-EN). Ids and values
          are unaffected.
        in: query
        name: locale
        required: false
        schema: *id003
      - description: 'The widget''s alternative to the plain params: base64url(zlib(JSON)) of {s: seasonId,
          l: locale, z: sub, f: fixtureId, e: entityId, p: personId, rn: roundNumber}, i.e. the part of
          a `link` after `~w=<prefix>~`. Send only the part after the prefix: `state=f~...` is a 400.
          When sent, the widget drops `sub`.'
        in: query
        name: state
        required: false
        schema: *id004
      - description: Flag the widget adds when its element carries `data-cru`; accepted by every type,
          effect unverified.
        in: query
        name: cru
        required: false
        schema: *id005
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/FixtureDetailStatistics'
                - $ref: '#/components/schemas/FixtureDetailPbp'
                - $ref: '#/components/schemas/FixtureDetailShotChart'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request (unknown or invalid param)
      summary: 'One fixture: box score, play-by-play or shot chart, by `sub`'
  /{websiteId}/fixtures:
    get:
      description: Fixtures (schedule and results) of a season, plus the site's season list.
      operationId: fixtures
      parameters:
      - description: 'Site config id: which league site''s widget this is (12 LNB France, 14 LNBP Mexico,
          3 NBL1, 13 El Salvador, 22 Panama, 236 Austria, 326 Montenegro; registry in the README). Not
          a league id: one site serves several competitions.'
        example: 12
        in: path
        name: websiteId
        required: true
        schema: *id001
      - description: Season id (UUID v1) from `data.seasons.seasons[].seasonId` of /fixtures. Omitted,
          the site's default season is served (the one its widget opens on).
        example: df310a05-51ad-11f0-bd89-c735508e1e09
        in: query
        name: seasonId
        required: false
        schema: *id002
      - description: 'Tab: `FIXTURES` (upcoming) or `RESULTS` (played). Omitted = the site default tab.
          Any other value was accepted and ignored.'
        example: RESULTS
        in: query
        name: sub
        required: false
        schema:
          enum:
          - FIXTURES
          - RESULTS
          type: string
      - description: Entity (team) id, UUID v1, from `competitors[].entityId` or `data.teams[].entityId`.
        in: query
        name: entityId
        required: false
        schema: *id002
