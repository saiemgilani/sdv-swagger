          a `link` after `~w=<prefix>~`. Send only the part after the prefix: `state=f~...` is a 400.
          When sent, the widget drops `sub`.'
        in: query
        name: state
        required: false
        schema: *id004
      - description: Flag the widget adds when its element carries `data-cru`; accepted by every type,
          effect unverified.
        in: query
        name: cru
        required: false
        schema: *id005
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsPersons'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request (unknown or invalid param)
      summary: Player season statistics (averages and totals tables)
