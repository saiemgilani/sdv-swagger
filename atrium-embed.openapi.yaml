components:
  schemas:
    Entities:
      properties:
        data:
          properties:
            config:
              properties:
                currentPage:
                  description: Widget page config (current page, navigation, display toggles); not data
                  type: string
                labelPage:
                  description: Widget page config (current page, navigation, display toggles); not data
                  type: string
                navigation:
                  properties:
                    labels:
                      properties:
                        search:
                          description: Widget page config (current page, navigation, display toggles);
                            not data
                          type: string
                        searchResults:
                          description: Widget page config (current page, navigation, display toggles);
                            not data
                          type: string
                      type: object
                    main:
                      items:
                        properties:
                          label:
                            description: Widget page config (current page, navigation, display toggles);
                              not data
                            type: string
                          link:
                            description: Widget page config (current page, navigation, display toggles);
                              not data
                            type: string
                          value:
                            description: Widget page config (current page, navigation, display toggles);
                              not data
                            type: string
                        type: object
                      type: array
                  type: object
                showEntityLogo:
                  description: Widget page config (current page, navigation, display toggles); not data
                  type:
                  - 'null'
                sport:
                  description: Widget page config (current page, navigation, display toggles); not data
                  type: string
              type: object
            labels:
              properties:
                toBeConfirmed:
                  description: 'UI label text in the response locale (header-as-data: translated per site,
                    not data)'
                  type: string
                toBeConfirmedAbbreviation:
                  description: 'UI label text in the response locale (header-as-data: translated per site,
                    not data)'
                  type: string
              type: object
            locale:
              description: 'Locale of every label in the body (`fr-FR`, `es-ES`, `de-AT`, `en-EN`): the
                `locale` param or the site default'
              type: string
            seasonId:
              description: 'The season served: the `seasonId` param, or the site default when omitted.
                Season id, UUID v1 (one per competition per year). Joins `seasonId=` on /fixtures, /standings
                and the other season-scoped types.'
              type: string
            seasons:
              properties:
                competitions:
                  additionalProperties:
                    properties:
                      name:
                        description: 'Competition name, keyed by competitionId (header-as-data: one key
                          per competition)'
                        type: string
                    type: object
                  description: Map competitionId -> competition (name)
                  propertyNames:
                    format: uuid
                  type: object
                  x-key: competitionId
                seasons:
                  items:
                    properties:
                      abbreviationLocal:
                        description: 'Season abbreviation; unobserved: null, empty or absent in every
                          sampled row'
                        type:
                        - 'null'
                      competitionId:
                        description: Competition id, UUID v1. A new id per edition on some sites (LNB's
                          Betclic ÉLITE has a different id each season). Joins `competitionId=` and the
                          keys of `data.seasons.competitions`.
                        type: string
                      link:
                        description: Widget navigation link `&~w=<prefix>~<token>` (prefix f fixture,
                          fl fixtures list, e team, p person, stn standings, l leaders, fr ribbon). The
                          token after the second `~` is a valid `state=` param and decodes to JSON {s
                          seasonId, l locale, z tab, f/e/p ids, rn round}
                        type: string
                      nameLocal:
                        description: Season name in the site language (`Betclic ÉLITE 2025`, `LNBP FEMENIL
                          2026`, `CLAUSURA 2026`)
                        type: string
                      seasonId:
                        description: Season id, UUID v1 (one per competition per year). Joins `seasonId=`
                          on /fixtures, /standings and the other season-scoped types.
                        type: string
                      year:
                        description: 'Season year as the site keys it. LNB (12): the START year (2025
                          = 2025-26, verified: its games run Sep 2025 - May 2026), so the sdv END year
                          is year + 1. LNBP (14), NBL1 (3), El Salvador (13) and Panama (22) play inside
                          one calendar year, so year = END year'
                        type: integer
                    type: object
                  type: array
              type: object
            teams:
              items:
                properties:
                  entityId:
                    description: 'Entity (team) id, UUID v1: the key space of every `entityId` / `teamId`
                      / team `id` on this host, shared across websiteIds. Joins `/entity_detail?entityId=`.'
                    type: string
                  imageURL:
                    description: Team logo URL / display name
                    type: string
                  link:
                    properties:
                      fragment:
                        description: 'Link URL fragment; unobserved: null, empty or absent in every sampled
                          row'
                        type:
                        - 'null'
                      openInNewTab:
                        description: Link opens in a new tab
                        type: boolean
                      origin:
                        description: 'Link origin (absolute site URL); unobserved: null, empty or absent
                          in every sampled row'
                        type:
                        - 'null'
                      path:
                        description: 'Link path; unobserved: null, empty or absent in every sampled row'
                        type:
                        - 'null'
                      queryParams:
                        properties:
                          ~w:
                            description: Widget state token `<prefix>~<base64url(zlib(JSON))>` that opens
                              the linked page (prefix e team, p person, f fixture). The part after `~`
                              is a valid `state=` param; decode it for the ids (keys s seasonId, l locale,
                              z tab, f/e/p ids, rn round)
                            type: string
                        type: object
                    type: object
                  name:
                    description: Team logo URL / display name
                    type: string
                type: object
              type: array
          type: object
        links:
          properties:
            self:
              description: The request URL, echoed
              type: string
          type: object
        meta:
          properties:
            code:
              description: HTTP status, repeated (200)
              type: integer
            codeVersion:
              description: Git commit of the API build that answered
              type: string
            count:
              description: Item count of the page's main list (fixtures, rows); unverified for every type
              type: integer
            fromCache:
              description: Served from the API cache
              type: boolean
            generated:
              description: Body generation time, ISO 8601 UTC with a stray `Z` after `+00:00`
              type: string
            generationTime:
              description: Seconds the API took to build the body
              type: number
            limit:
              description: Paging limit; always 0 (no paging seen)
              type: integer
            offset:
              description: Paging offset; always 0
              type: integer
            time:
              description: Response time, ISO 8601 UTC with a stray `Z`
              type: string
            version:
              description: API version (1)
              type: integer
          type: object
      type: object
