      operationId: get_equipes
      parameters:
      - description: admin-ajax action (selects the operation).
        in: query
        name: action
        required: true
        schema:
          const: get_equipes
          type: string
      - description: 'Phase id from get_phases. Omitted: every team of every competition in the federation
          database (~680 KB) (probed 2026-10-12).'
        example: 714
        in: query
        name: phase_id
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
