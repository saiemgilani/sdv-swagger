components:
  schemas:
    GetClassementsphase:
      properties:
        data:
          description: 'Payload: the standings table plus back-office timing.'
          properties:
            data:
              description: 'Standings table: rows and table id.'
              properties:
                classement_id:
                  description: Standings table id.
                  type: integer
                positions:
                  description: Standings rows, one per team, in rank order.
                  items:
                    properties:
                      dernier_resultats:
                        description: 'Last games of the team (form guide): scores and winner.'
                        items:
                          properties:
                            match_nul:
                              description: Game ended tied.
                              type: boolean
                            participant_gagnant_id:
                              description: Team participant id of the winner (joins positions[].participant_id).
                              type: integer
                            scores:
                              description: 'Score rows, one per team: goals, team id, team participant
                                id.'
                              items:
                                properties:
                                  equipe_id:
                                    description: Team id.
                                    type: integer
                                  participant_id:
                                    description: 'Team participant id of the team score row: the team''s
                                      entry in one phase (its own key space, e.g. 9120-9131 for 2026-27
                                      phase 714; not a team id, not a player participant id). Joins score[].participant_id
                                      = positions[].participant_id = dernier_resultats[].participant_gagnant_id.'
                                    type: integer
                                  score:
                                    description: Goals scored by the team.
                                    type: integer
                                  sportif_rencontre_id:
                                    description: Game id.
                                    type: integer
                                type: object
                              type: array
                            sportif_rencontre_id:
                              description: Game id.
                              type: integer
                          type: object
                        type: array
                      equipe:
                        description: 'Team of the standings row: team id, labels, logo, club.'
                        properties:
                          abreviation:
                            description: Abbreviation of the team.
                            type: string
                          code:
                            description: Team code (EQ....).
                            type: string
                          id:
                            description: Team id of the team (stable across seasons; = get_equipes data[].id).
                            type: integer
                          logo:
                            description: Logo URL (or file name) of the team.
                            type: string
                          nom:
                            description: Name of the team.
                            type: string
                          nom_court:
                            description: Short name of the team.
                            type: string
                          proprietaire:
                            description: 'Owning club: its federation code.'
                            properties:
                              code:
                                description: Code of the owning club.
                                type: string
                            type: object
                        type: object
                      logo:
                        description: Team logo URL.
                        type: string
                      nombre_but_concede:
                        description: Goals against.
                        type: integer
                      nombre_but_marque:
                        description: Goals for.
                        type: integer
                      nombre_defaite:
                        description: Regulation losses.
                        type: integer
                      nombre_dprl:
                        description: Overtime/shootout losses (défaite en prolongation).
                        type: integer
                      nombre_nul:
                        description: Ties.
                        type: integer
                      nombre_penalites:
                        description: Penalty minutes.
                        type: integer
                      nombre_point:
                        description: Points.
                        type: integer
                      nombre_rencontres_joues:
                        description: Games played.
                        type: integer
                      nombre_victoire:
                        description: Regulation wins.
                        type: integer
                      nombre_vprl:
                        description: Overtime/shootout wins (victoire en prolongation).
                        type: integer
                      participant_id:
                        description: 'Team participant id of the standings row: the team''s entry in one
                          phase (its own key space, e.g. 9120-9131 for 2026-27 phase 714; not a team id,
                          not a player participant id). Joins score[].participant_id = positions[].participant_id
                          = dernier_resultats[].participant_gagnant_id.'
                        type: integer
                      position:
                        description: Rank in the standings (1 = first).
                        type: integer
                    type: object
                  type: array
              type: object
            time:
              description: Back-office query time ('0.0008 sec.').
              type: string
          type: object
        success:
          description: 'Envelope flag: true when the call succeeded (an error can still arrive with true;
            see the operation description).'
          type: boolean
      type: object
    GetCompetitionByType:
      properties:
        data:
          description: 'Payload: competition rows plus back-office timing.'
          properties:
            data:
              description: Competitions of the type, one per season.
              items:
                properties:
                  id:
                    description: Competition id, one per season (the competition_id request parameter).
                    type: integer
                  libelle:
                    description: Label (name) of the competition.
                    type: string
                  parametres:
                    description: Publication settings of the competition (streaming URL, published flag).
                    properties:
                      publier_sur_site:
                        description: Published on the public site.
                        type: boolean
                      url_externe:
                        description: External streaming / site URL.
                        type: string
                    type: object
                  saison:
                    description: Season key, END year (2027 = 2026-27).
                    type: integer
                  type:
                    description: 'Competition type: id, code, label.'
                    properties:
                      code:
                        description: Competition type code (NA in samples).
                        type: string
                      created_at:
                        description: Row creation time (YYYY-MM-DD HH:MM:SS, upstream database).
                        type: string
                      id:
                        description: 'Competition type id: 1 = Ligue Magnus, 2 = Division 1.'
                        type: integer
                      libelle:
                        description: Competition type name (Ligue Magnus, D1).
                        type: string
                      updated_at:
                        description: Row update time (YYYY-MM-DD HH:MM:SS, upstream database).
                        type: string
                    type: object
                type: object
              type: array
            time:
              description: Back-office query time ('0.0008 sec.').
              type: string
          type: object
        success:
          description: 'Envelope flag: true when the call succeeded (an error can still arrive with true;
            see the operation description).'
          type: boolean
      type: object
    GetEquipes:
      properties:
        data:
          description: 'Payload: team rows plus back-office timing.'
          properties:
            data:
              description: Teams of the phase.
              items:
                properties:
                  abreviation:
                    description: Abbreviation of the team.
                    type: string
                  id:
                    description: Team id, stable across seasons (the equipe_id request parameter of get_rencontres).
                    type: integer
                  id_compet:
                    description: Competition ids the team has entered (all seasons, all levels).
                    items:
                      type: integer
                    type: array
                  libelle:
                    description: Label (name) of the team.
                    type: string
                  libelle_complet:
                    description: Full display name of the team.
                    type: string
                  libelle_court:
                    description: Short label of the team.
                    type: string
                  logo:
                    description: Logo URL (or file name) of the team.
                    type: string
                  sexe:
                    description: 'Gender of the team: M (men; the only value in samples).'
                    type: string
                  structure:
                    description: 'Club (legal entity) behind the team: id, name, federation code, state.'
                    properties:
                      code:
                        description: Federation club code (e.g. 72001S).
                        type: string
                      etat:
                        description: Club state code (A in every sample).
                        type: string
                      id:
                        description: Id of the club (legal entity).
                        type: integer
                      logo:
                        description: Logo URL (or file name) of the club (legal entity).
                        type: string
                      nom:
                        description: Name of the club (legal entity).
                        type: string
                      nom_court:
                        description: Short name of the club (legal entity).
                        type: string
                      type:
                        description: Club legal-form code (SOC in samples).
                        type: string
                    type: object
                type: object
              type: array
            time:
              description: Back-office query time ('0.0008 sec.').
              type: string
          type: object
        success:
          description: 'Envelope flag: true when the call succeeded (an error can still arrive with true;
            see the operation description).'
          type: boolean
      type: object
    GetListeTours:
      properties:
        data:
          description: 'Payload: round rows plus back-office timing.'
          properties:
            data:
              description: Rounds of the phase.
              items:
                properties:
                  competition:
                    description: 'Competition (one per season) of the round: id, season key, name, type.'
                    properties:
                      id:
                        description: Id of the competition.
                        type: integer
                      libelle:
                        description: Competition name (e.g. Synerglace Ligue Magnus).
                        type: string
                      parametres:
                        description: Publication settings of the competition (streaming URL, published
                          flag).
                        properties:
                          publier_sur_site:
                            description: Published on the public site.
                            type: boolean
                          url_externe:
                            description: External streaming / site URL.
                            type: string
                        type: object
                      saison:
                        description: Season key, END year (2027 = 2026-27).
                        type: integer
                      type:
                        description: 'Competition type: id, code, label.'
                        properties:
                          code:
                            description: Competition type code (NA in samples).
                            type: string
                          created_at:
                            description: Row creation time (YYYY-MM-DD HH:MM:SS, upstream database).
                            type: string
                          id:
                            description: 'Competition type id: 1 = Ligue Magnus, 2 = Division 1.'
                            type: integer
                          libelle:
                            description: Competition type name (Ligue Magnus, D1).
                            type: string
                          updated_at:
                            description: Row update time (YYYY-MM-DD HH:MM:SS, upstream database).
                            type: string
                        type: object
                    type: object
                  date_debut:
                    description: Start date of the round.
                    type: string
                  date_fin:
                    description: End date of the round.
                    type: string
                  id:
                    description: Id of the round.
                    type: integer
                  libelle:
                    description: Unobserved in samples (null in every capture); type and meaning unverified.
                    x-unobserved: true
                  phase:
                    description: 'Phase of the round: id, name, phase type, format settings.'
                    properties:
                      competition_libelle:
                        description: Competition name.
                        type: string
                      id:
                        description: Id of the phase.
                        type: integer
                      libelle:
                        description: Phase name (e.g. Saison régulière = regular season).
                        type: string
                      parametrage:
                        description: Format settings of the phase (legs, groups, overtime, ...).
                        properties:
                          aller_retour:
                            description: Home-and-away legs flag (0/1).
                            type: integer
                          appuis:
                            description: Back-office seeding setting.
                            type: integer
                          avec_bascule_auto:
                            description: Automatic promotion to the next phase.
                            type: boolean
                          avec_classement_final:
                            description: Produces a final ranking.
                            type: boolean
                          extra_poule:
                            description: Cross-pool games flag.
                            type: boolean
                          grille_id:
                            description: Unobserved in samples (null in every capture); type and meaning
                              unverified.
                            x-unobserved: true
                          nombre_groupe:
                            description: Number of groups (pools).
                            type: integer
                          nombre_match_par_confrontation:
                            description: Games per pairing.
                            type: integer
                          nombre_participant:
                            description: Number of teams.
                            type: integer
                          nombre_plateaux:
                            description: Unobserved in samples (null in every capture); type and meaning
                              unverified.
                            x-unobserved: true
                          petite_finale:
                            description: Third-place game played.
                            type: boolean
                          phase_finale:
                            description: Final-phase flag.
                            type: boolean
                          prolongation:
                            description: Overtime played when tied.
                            type: boolean
                          score_cumule:
                            description: Aggregate score across legs.
                            type: boolean
                          type_assignation:
                            description: Fixture assignment mode (M = manual).
                            type: string
                        type: object
                      type_phase:
                        description: 'Phase type code: C (championnat, round robin), T (tableau, playoff
                          bracket).'
                        type: string
                      visible:
                        description: Shown on the public site.
                        type: boolean
                    type: object
                  phase_id:
                    description: Phase id.
                    type: integer
                  rencontres:
                    description: Unobserved in samples (null in every capture); type and meaning unverified.
                    x-unobserved: true
                  tour:
                    description: Round number (journee).
                    type: integer
                type: object
              type: array
            time:
              description: Back-office query time ('0.0008 sec.').
              type: string
          type: object
        success:
          description: 'Envelope flag: true when the call succeeded (an error can still arrive with true;
            see the operation description).'
          type: boolean
      type: object
    GetPhases:
      properties:
        data:
          description: 'Payload: phase rows plus back-office timing.'
          properties:
            data:
              description: Phases of the competition.
              items:
                properties:
                  competition_libelle:
                    description: Competition name.
                    type: string
                  id:
                    description: Phase id (the phase_id request parameter).
                    type: integer
                  libelle:
                    description: Label (name) of the phase.
                    type: string
                  parametrage:
                    description: Format settings of the phase (legs, groups, overtime, ...).
                    properties:
                      aller_retour:
                        description: Home-and-away legs flag (0/1).
                        type: integer
                      appuis:
                        description: Back-office seeding setting.
                        type: integer
                      avec_bascule_auto:
                        description: Automatic promotion to the next phase.
                        type: boolean
                      avec_classement_final:
                        description: Produces a final ranking.
                        type: boolean
                      extra_poule:
                        description: Cross-pool games flag.
                        type: boolean
                      grille_id:
                        description: Unobserved in samples (null in every capture); type and meaning unverified.
                        x-unobserved: true
                      nombre_groupe:
                        description: Number of groups (pools).
                        type: integer
                      nombre_match_par_confrontation:
                        description: Games per pairing.
                        type: integer
                      nombre_participant:
                        description: Number of teams.
                        type: integer
                      nombre_plateaux:
                        description: Unobserved in samples (null in every capture); type and meaning unverified.
                        x-unobserved: true
                      petite_finale:
                        description: Third-place game played.
                        type: boolean
                      phase_finale:
                        description: Final-phase flag.
                        type: boolean
                      prolongation:
                        description: Overtime played when tied.
                        type: boolean
                      score_cumule:
                        description: Aggregate score across legs.
                        type: boolean
                      type_assignation:
                        description: Fixture assignment mode (M = manual).
                        type: string
                    type: object
                  type_phase:
                    description: 'Phase type code: C (championnat, round robin), T (tableau, playoff bracket).'
                    type: string
                  visible:
                    description: Shown on the public site.
                    type: boolean
                type: object
              type: array
            time:
              description: Back-office query time ('0.0008 sec.').
              type: string
          type: object
        success:
          description: 'Envelope flag: true when the call succeeded (an error can still arrive with true;
            see the operation description).'
          type: boolean
      type: object
    GetRencontres:
      properties:
        data:
          description: 'Laravel page: data (game rows), links, meta.'
          properties:
            data:
              description: Games of the page (the whole season with par_page=700).
              items:
                properties:
                  calendrier:
                    description: 'Scheduled slot of the game: start and end date-time.'
                    properties:
                      date_debut:
                        description: Start date of the scheduled slot.
                        type: string
                      date_fin:
                        description: End date of the scheduled slot.
                        type: string
                    type: object
                  competition:
                    description: 'Competition (one per season) of the game: id, season key, name, type.'
                    properties:
                      id:
                        description: Id of the competition.
                        type: integer
                      libelle:
                        description: Competition name (e.g. Synerglace Ligue Magnus).
                        type: string
                      parametres:
                        description: Publication settings of the competition (streaming URL, published
                          flag).
                        properties:
                          publier_sur_site:
                            description: Published on the public site.
                            type: boolean
                          url_externe:
                            description: External streaming / site URL.
                            type: string
                        type: object
                      saison:
                        description: Season key, END year (2027 = 2026-27).
                        type: integer
                      type:
                        description: 'Competition type: id, code, label.'
                        properties:
                          code:
                            description: Competition type code (NA in samples).
                            type: string
                          created_at:
                            description: Row creation time (YYYY-MM-DD HH:MM:SS, upstream database).
                            type: string
                          id:
                            description: 'Competition type id: 1 = Ligue Magnus, 2 = Division 1.'
                            type: integer
                          libelle:
                            description: Competition type name (Ligue Magnus, D1).
                            type: string
                          updated_at:
                            description: Row update time (YYYY-MM-DD HH:MM:SS, upstream database).
                            type: string
                        type: object
                    type: object
                  date_rencontre:
                    description: Game date and time, local French time (Europe/Paris, no offset given;
                      YYYY-MM-DD HH:MM).
                    type: string
                  en_cours:
                    description: Game in progress.
                    type: boolean
                  etat:
                    description: 'Game state code: T (terminée, final); null before the game.'
                    type: string
                  id:
                    description: Game id (the {id} of /rencontre/{id}/).
                    type: integer
                  infos_complementaires:
                    description: Extra information text (empty string in samples).
                    type: string
                  lieu_de_pratique:
                    description: 'Rink (venue) of the game: id and name.'
                    properties:
                      id:
                        description: Id of the rink.
                        type: integer
                      nom:
                        description: Name of the rink.
                        type: string
                    type: object
                  lot:
                    description: Unobserved in samples (null in every capture); type and meaning unverified.
                    x-unobserved: true
                  phase:
                    description: 'Phase of the game: id, name, phase type, format settings.'
                    properties:
                      competition_libelle:
                        description: Competition name.
                        type: string
                      id:
                        description: Id of the phase.
                        type: integer
                      libelle:
                        description: Phase name (e.g. Saison régulière = regular season).
                        type: string
                      parametrage:
                        description: Format settings of the phase (legs, groups, overtime, ...).
                        properties:
                          aller_retour:
                            description: Home-and-away legs flag (0/1).
                            type: integer
                          appuis:
                            description: Back-office seeding setting.
                            type: integer
                          avec_bascule_auto:
                            description: Automatic promotion to the next phase.
                            type: boolean
                          avec_classement_final:
                            description: Produces a final ranking.
                            type: boolean
                          extra_poule:
                            description: Cross-pool games flag.
                            type: boolean
                          grille_id:
                            description: Unobserved in samples (null in every capture); type and meaning
                              unverified.
                            x-unobserved: true
                          nombre_groupe:
                            description: Number of groups (pools).
                            type: integer
                          nombre_match_par_confrontation:
                            description: Games per pairing.
                            type: integer
                          nombre_participant:
                            description: Number of teams.
                            type: integer
                          nombre_plateaux:
                            description: Unobserved in samples (null in every capture); type and meaning
                              unverified.
                            x-unobserved: true
                          petite_finale:
                            description: Third-place game played.
                            type: boolean
                          phase_finale:
                            description: Final-phase flag.
                            type: boolean
                          prolongation:
                            description: Overtime played when tied.
                            type: boolean
                          score_cumule:
                            description: Aggregate score across legs.
                            type: boolean
                          type_assignation:
                            description: Fixture assignment mode (M = manual).
                            type: string
                        type: object
                      type_phase:
                        description: 'Phase type code: C (championnat, round robin), T (tableau, playoff
                          bracket).'
                        type: string
                      visible:
                        description: Shown on the public site.
                        type: boolean
                    type: object
                  phase_id:
                    description: Phase id.
                    type: integer
                  receveur:
                    description: 'Home team of the game: team id, labels, logo, club.'
                    properties:
                      abreviation:
                        description: Abbreviation of the home team.
                        type: string
                      id:
                        description: Team id of the home team (stable across seasons; = get_equipes data[].id).
                        type: integer
                      id_compet:
                        description: Competition ids the team has entered (all seasons, all levels).
                        items:
                          type: integer
                        type: array
                      libelle:
                        description: Label (name) of the home team.
                        type: string
                      libelle_complet:
                        description: Full display name of the home team.
                        type: string
                      libelle_court:
                        description: Short label of the home team.
                        type: string
                      logo:
                        description: Logo URL (or file name) of the home team.
                        type: string
                      sexe:
                        description: 'Gender of the home team: M (men; the only value in samples).'
                        type: string
                      structure:
                        description: 'Club (legal entity) behind the home team: id, name, federation code,
                          state.'
                        properties:
                          code:
                            description: Federation club code (e.g. 72001S).
                            type: string
                          etat:
                            description: Club state code (A in every sample).
                            type: string
                          id:
                            description: Id of the club (legal entity).
                            type: integer
                          logo:
                            description: Logo URL (or file name) of the club (legal entity).
                            type: string
                          nom:
                            description: Name of the club (legal entity).
                            type: string
                          nom_court:
                            description: Short name of the club (legal entity).
                            type: string
                          type:
                            description: Club legal-form code (SOC in samples).
                            type: string
                        type: object
                    type: object
                  rencontre_libelle:
                    description: Game label 'HOME / AWAY'.
                    type: string
                  score:
                    description: 'Final score rows: one per team of the game (0-0 on unplayed games),
                      plus, on some finished games, 0-goal rows for teams that did not play in it; not
                      home-first. Match a row to a side by equipe_id.'
                    items:
                      properties:
                        equipe_id:
                          description: Team id.
                          type: integer
                        participant_id:
                          description: 'Team participant id of the team score row: the team''s entry in
                            one phase (its own key space, e.g. 9120-9131 for 2026-27 phase 714; not a
                            team id, not a player participant id). Joins score[].participant_id = positions[].participant_id
                            = dernier_resultats[].participant_gagnant_id.'
                          type: integer
                        score:
                          description: Goals scored by the team.
                          type: integer
                        sportif_rencontre_id:
                          description: Game id.
                          type: integer
                      type: object
                    type: array
                  tour:
                    description: Round number (journee).
                    type: integer
                  tour_libelle:
                    description: Unobserved in samples (null in every capture); type and meaning unverified.
                    x-unobserved: true
                  victoire_par:
                    description: 'How the game was won: S = regulation, PRL = overtime, TAB = shootout
                      (S also on unplayed games).'
                    type: string
                  visiteur:
                    description: 'Away team of the game: team id, labels, logo, club.'
                    properties:
                      abreviation:
                        description: Abbreviation of the away team.
                        type: string
                      id:
                        description: Team id of the away team (stable across seasons; = get_equipes data[].id).
                        type: integer
                      id_compet:
                        description: Competition ids the team has entered (all seasons, all levels).
                        items:
                          type: integer
                        type: array
                      libelle:
                        description: Label (name) of the away team.
                        type: string
                      libelle_complet:
                        description: Full display name of the away team.
                        type: string
                      libelle_court:
                        description: Short label of the away team.
                        type: string
                      logo:
                        description: Logo URL (or file name) of the away team.
                        type: string
                      sexe:
                        description: 'Gender of the away team: M (men; the only value in samples).'
                        type: string
                      structure:
                        description: 'Club (legal entity) behind the away team: id, name, federation code,
                          state.'
                        properties:
                          code:
                            description: Federation club code (e.g. 72001S).
                            type: string
                          etat:
                            description: Club state code (A in every sample).
                            type: string
                          id:
                            description: Id of the club (legal entity).
                            type: integer
                          logo:
                            description: Logo URL (or file name) of the club (legal entity).
                            type: string
                          nom:
                            description: Name of the club (legal entity).
                            type: string
                          nom_court:
                            description: Short name of the club (legal entity).
                            type: string
                          type:
                            description: Club legal-form code (SOC in samples).
                            type: string
                        type: object
                    type: object
                type: object
              type: array
            links:
              description: 'Laravel pager URLs: first, last, prev, next.'
              properties:
                first:
                  description: URL of the first page (upstream hockeynet.fr path).
                  type: string
                last:
                  description: URL of the last page.
                  type: string
                next:
                  description: Unobserved in samples (null in every capture); type and meaning unverified.
                  x-unobserved: true
                prev:
                  description: Unobserved in samples (null in every capture); type and meaning unverified.
                  x-unobserved: true
              type: object
            meta:
              description: 'Laravel paging metadata: page, size, totals.'
              properties:
                current_page:
                  description: Current page number.
                  type: integer
                from:
                  description: First row number on this page.
                  type: integer
                last_page:
                  description: Number of pages.
