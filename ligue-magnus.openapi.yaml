info:
  description: 'France''s Ligue Magnus. Keyless. The WordPress endpoint /wp-admin/admin-ajax.php is dispatched
    by the `action` query parameter; each action is modelled as a fragment-suffixed path (/wp-admin/admin-ajax.php#get_rencontres,
    the hockeytech precedent): the fragment is documentation-only and the wire path is always /wp-admin/admin-ajax.php.
    It proxies the FFHG back office (hockeynet.fr/api/v1, 401 without auth). Errors are HTTP 200 application/json:
    {success: false, data: ''Aucune donnée disponible''} (no data), {success: true, data: ''''} (a required
    parameter is missing) or {success: true, data: {<param>: [''Le champ ... est invalide.'']}} (a Laravel
    validation error). An unknown action answers HTTP 400 text/html ''0''. The game sheet (events, rosters,
    staff, MVPs, shootout) is JSON embedded in the text/html page /rencontre/{id}/ (see x-embedded-json).
    Coverage 2020-21 onward; competition_id is per season and season keys are END years. /statistiques-individuelles/
    is Cloudflare-blocked and not modelled. Shapes from captures of 2026-10-12. Not official or supported.'
  title: Ligue Magnus (liguemagnus.com) admin-ajax JSON + game sheets
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /rencontre/{id}/:
    get:
      description: 'text/html. The game sheet JSON is the value of the Vue `:data` attribute of `<live-rencontre-container>`,
        HTML-entity escaped (&quot; &amp; &#039; ...). Extract with the regex `:data="([^"]*)"`, then
        html.unescape, then json.loads. An unknown id still answers 200 text/html, with `:data` = {"message":
        ...}.'
      operationId: get_rencontre_page
      parameters:
      - description: 'Game id (get_rencontres data.data[].id). Example 77779 (2026-27, shootout + MVPs);
          also sampled: 68838.'
        example: '77779'
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
              x-embedded-json:
                attribute: :data
                element: live-rencontre-container
                encoding: HTML entities (&quot; &amp; &#039; ...)
                extract: :data="([^"]*)" -> html.unescape -> json.loads
                schema:
                  $ref: '#/components/schemas/RencontreGameSheet'
          description: Match page (HTML) with the game sheet embedded as JSON
      summary: Game sheet page (text/html); the game JSON is embedded in the :data attribute
  /wp-admin/admin-ajax.php#get_classementsphase:
    get:
      description: 'Wire request: GET /wp-admin/admin-ajax.php?action=get_classementsphase&... (the path
        fragment only names the operation). Errors are HTTP 200 application/json: {success: false, data:
        ''Aucune donnée disponible''} (no data), {success: true, data: ''''} (a required parameter is
        missing) or {success: true, data: {<param>: [''Le champ ... est invalide.'']}} (a Laravel validation
        error). An unknown action answers HTTP 400 text/html ''0''.'
      operationId: get_classementsphase
      parameters:
      - description: admin-ajax action (selects the operation).
        in: query
        name: action
        required: true
        schema:
          const: get_classementsphase
          type: string
      - description: 'Phase id from get_phases. Omitted: data='''' (probed 2026-10-12).'
        example: 714
        in: query
        name: phase_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetClassementsphase'
          description: '{success: true, data: ...}'
      summary: Standings of a phase
  /wp-admin/admin-ajax.php#get_competition_by_type:
    get:
      description: 'Wire request: GET /wp-admin/admin-ajax.php?action=get_competition_by_type&... (the
        path fragment only names the operation). Errors are HTTP 200 application/json: {success: false,
        data: ''Aucune donnée disponible''} (no data), {success: true, data: ''''} (a required parameter
        is missing) or {success: true, data: {<param>: [''Le champ ... est invalide.'']}} (a Laravel validation
        error). An unknown action answers HTTP 400 text/html ''0''.'
      operationId: get_competition_by_type
      parameters:
      - description: admin-ajax action (selects the operation).
        in: query
        name: action
        required: true
        schema:
          const: get_competition_by_type
          type: string
      - description: 'Competition type: 1 = Ligue Magnus, 2 = Division 1. Omitted: success=false ''Aucune
          donnée disponible'' (probed 2026-10-12).'
        example: 1
        in: query
        name: id_type
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCompetitionByType'
          description: '{success: true, data: ...}'
      summary: Competitions (one per season) of a competition type
  /wp-admin/admin-ajax.php#get_equipes:
    get:
      description: 'Wire request: GET /wp-admin/admin-ajax.php?action=get_equipes&... (the path fragment
        only names the operation). Errors are HTTP 200 application/json: {success: false, data: ''Aucune
        donnée disponible''} (no data), {success: true, data: ''''} (a required parameter is missing)
        or {success: true, data: {<param>: [''Le champ ... est invalide.'']}} (a Laravel validation error).
