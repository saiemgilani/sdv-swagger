info:
  description: 'France''s Ligue Magnus. Keyless. The WordPress endpoint /wp-admin/admin-ajax.php is dispatched
    by the `action` query parameter; each action is modelled as a fragment-suffixed path (/wp-admin/admin-ajax.php#get_rencontres,
    the hockeytech precedent): the fragment is documentation-only and the wire path is always /wp-admin/admin-ajax.php.
    It proxies the FFHG back office (hockeynet.fr/api/v1, 401 without auth). Errors are HTTP 200 application/json:
    {success: false, data: ''Aucune donnée disponible''} (no data), {success: true, data: ''''} (a required
    parameter is missing) or {success: true, data: {<param>: [''Le champ ... est invalide.'']}} (a Laravel
    validation error). An unknown action answers HTTP 400 text/html ''0''. The game sheet (events, rosters,
    staff, MVPs, shootout) is JSON embedded in the text/html page /rencontre/{id}/ (see x-embedded-json).
    Coverage 2020-21 onward; competition_id is per season and season keys are END years. /statistiques-individuelles/
    is Cloudflare-blocked and not modelled. Shapes from captures of 2026-10-12; a property with x-unobserved
    was null or empty in every sample, so no type is claimed. Not official or supported.'
  title: Ligue Magnus (liguemagnus.com) admin-ajax JSON + game sheets
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /rencontre/{id}/:
    get:
      description: 'text/html. The game sheet JSON is the value of the Vue `:data` attribute of `<live-rencontre-container>`,
        HTML-entity escaped (&quot; &amp; &#039; ...). Extract: regex <live-rencontre-container\b[^>]*?\s:data="([^"]*)"
        -> html.unescape -> json.loads -> first JSON object (see x-embedded-json). An unknown id still
        answers 200 text/html, with `:data` = {"message": ...}.'
      operationId: get_rencontre_page
      parameters:
      - description: 'Game id (get_rencontres data.data[].id). Example 77779 (2026-27, shootout + MVPs);
          also sampled: 68838, 865.'
        example: '77779'
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
              x-embedded-json:
                attribute: :data
                element: live-rencontre-container
                encoding: HTML entities (&quot; &amp; &#039; ...)
                extract: regex <live-rencontre-container\b[^>]*?\s:data="([^"]*)" -> html.unescape ->
                  json.loads -> first JSON object
                schema:
                  $ref: '#/components/schemas/RencontreGameSheet'
          description: Match page (HTML) with the game sheet embedded as JSON
      summary: Game sheet page (text/html); the game JSON is embedded in the :data attribute
  /wp-admin/admin-ajax.php#get_classementsphase:
    get:
      description: 'Wire request: GET /wp-admin/admin-ajax.php?action=get_classementsphase&... (the path
        fragment only names the operation). Errors are HTTP 200 application/json: {success: false, data:
        ''Aucune donnée disponible''} (no data), {success: true, data: ''''} (a required parameter is
        missing) or {success: true, data: {<param>: [''Le champ ... est invalide.'']}} (a Laravel validation
        error). An unknown action answers HTTP 400 text/html ''0''.'
      operationId: get_classementsphase
      parameters:
      - description: admin-ajax action (selects the operation).
        in: query
        name: action
        required: true
        schema:
          const: get_classementsphase
          type: string
      - description: 'Phase id from get_phases. Omitted: data='''' (probed 2026-10-12).'
        example: 714
        in: query
        name: phase_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetClassementsphase'
          description: '{success: true, data: ...}'
      summary: Standings of a phase
  /wp-admin/admin-ajax.php#get_competition_by_type:
    get:
      description: 'Wire request: GET /wp-admin/admin-ajax.php?action=get_competition_by_type&... (the
        path fragment only names the operation). Errors are HTTP 200 application/json: {success: false,
        data: ''Aucune donnée disponible''} (no data), {success: true, data: ''''} (a required parameter
        is missing) or {success: true, data: {<param>: [''Le champ ... est invalide.'']}} (a Laravel validation
        error). An unknown action answers HTTP 400 text/html ''0''.'
      operationId: get_competition_by_type
      parameters:
      - description: admin-ajax action (selects the operation).
        in: query
        name: action
        required: true
        schema:
          const: get_competition_by_type
          type: string
      - description: 'Competition type: 1 = Ligue Magnus, 2 = Division 1. Omitted: success=false ''Aucune
          donnée disponible'' (probed 2026-10-12).'
        example: 1
        in: query
        name: id_type
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCompetitionByType'
          description: '{success: true, data: ...}'
      summary: Competitions (one per season) of a competition type
  /wp-admin/admin-ajax.php#get_equipes:
    get:
      description: 'Wire request: GET /wp-admin/admin-ajax.php?action=get_equipes&... (the path fragment
        only names the operation). Errors are HTTP 200 application/json: {success: false, data: ''Aucune
        donnée disponible''} (no data), {success: true, data: ''''} (a required parameter is missing)
        or {success: true, data: {<param>: [''Le champ ... est invalide.'']}} (a Laravel validation error).
        An unknown action answers HTTP 400 text/html ''0''.'
      operationId: get_equipes
      parameters:
      - description: admin-ajax action (selects the operation).
        in: query
        name: action
        required: true
        schema:
          const: get_equipes
          type: string
      - description: 'Phase id from get_phases. Omitted: every team of every competition in the federation
          database (~680 KB) (probed 2026-10-12).'
        example: 714
        in: query
        name: phase_id
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEquipes'
          description: '{success: true, data: ...}'
      summary: Teams of a phase
  /wp-admin/admin-ajax.php#get_liste_tours:
    get:
      description: 'Wire request: GET /wp-admin/admin-ajax.php?action=get_liste_tours&... (the path fragment
        only names the operation). Errors are HTTP 200 application/json: {success: false, data: ''Aucune
        donnée disponible''} (no data), {success: true, data: ''''} (a required parameter is missing)
        or {success: true, data: {<param>: [''Le champ ... est invalide.'']}} (a Laravel validation error).
        An unknown action answers HTTP 400 text/html ''0''.'
      operationId: get_liste_tours
      parameters:
      - description: admin-ajax action (selects the operation).
        in: query
        name: action
        required: true
        schema:
          const: get_liste_tours
          type: string
      - description: 'Phase id from get_phases. Omitted: data='''' (probed 2026-10-12).'
        example: 714
        in: query
        name: phase_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetListeTours'
          description: '{success: true, data: ...}'
      summary: Rounds (journees) of a phase with their dates (games via get_rencontrestours)
  /wp-admin/admin-ajax.php#get_phases:
    get:
      description: 'Wire request: GET /wp-admin/admin-ajax.php?action=get_phases&... (the path fragment
        only names the operation). Errors are HTTP 200 application/json: {success: false, data: ''Aucune
        donnée disponible''} (no data), {success: true, data: ''''} (a required parameter is missing)
        or {success: true, data: {<param>: [''Le champ ... est invalide.'']}} (a Laravel validation error).
        An unknown action answers HTTP 400 text/html ''0''.'
      operationId: get_phases
      parameters:
      - description: admin-ajax action (selects the operation).
        in: query
        name: action
        required: true
        schema:
          const: get_phases
          type: string
      - description: 'Competition (season) id from get_competition_by_type: 1 = 2020-21 ... 240 = 2026-27.
          Omitted: data='''' (probed 2026-10-12).'
        example: 240
        in: query
        name: competition_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPhases'
          description: '{success: true, data: ...}'
      summary: Phases of a competition (regular season, playoffs, relegation)
  /wp-admin/admin-ajax.php#get_rencontres:
    get:
      description: 'Wire request: GET /wp-admin/admin-ajax.php?action=get_rencontres&... (the path fragment
        only names the operation). Errors are HTTP 200 application/json: {success: false, data: ''Aucune
        donnée disponible''} (no data), {success: true, data: ''''} (a required parameter is missing)
        or {success: true, data: {<param>: [''Le champ ... est invalide.'']}} (a Laravel validation error).
        An unknown action answers HTTP 400 text/html ''0''.'
      operationId: get_rencontres
      parameters:
      - description: admin-ajax action (selects the operation).
        in: query
        name: action
        required: true
        schema:
          const: get_rencontres
          type: string
      - description: Competition (season) id. Optional when phase_id is set (same 264 games without it,
          probed 2026-10-12).
        example: 240
        in: query
        name: competition_id
        required: false
        schema:
          type: integer
      - description: 'Phase id. Omitted: every phase of the competition (314 games for 2025-26 vs 264
          for its regular season, probed 2026-10-12).'
        example: 714
        in: query
        name: phase_id
        required: false
        schema:
          type: integer
      - description: Page size (default 20). 700 returns a whole season in one page.
        example: 700
        in: query
        name: par_page
        required: false
        schema:
          type: integer
      - description: 1-based page number (default 1).
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: 'Team id (get_equipes data[].id): that team''s games only (44 for 2025-26, probed
          2026-10-12). Non-numeric: a validation error.'
        in: query
        name: equipe_id
        required: false
        schema:
          type: integer
      - description: 'Earliest game date, YYYY-MM-DD (verified: 2025-10-01..2025-10-31 gave 44 games,
          probed 2026-10-12).'
        in: query
        name: date_min
        required: false
        schema:
          type: string
      - description: Latest game date, YYYY-MM-DD.
        in: query
        name: date_max
        required: false
        schema:
          type: string
      - description: 'Round number (tour): that round''s games only (6 per round, probed 2026-10-12).'
        example: 1
        in: query
        name: journee
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRencontres'
          description: '{success: true, data: ...}'
      summary: Games (schedule and results); Laravel-paginated, par_page=700 returns a full season
      x-pagination:
        params:
        - par_page
        - page
        request: 'verified: page=2&par_page=5 returns the next five games; par_page defaults to 20; par_page=700
          returns a full season (meta.last_page = 1) (probed 2026-10-12)'
        response:
        - data.links
        - data.meta
        style: page
  /wp-admin/admin-ajax.php#get_rencontrestours:
    get:
      description: 'Wire request: GET /wp-admin/admin-ajax.php?action=get_rencontrestours&... (the path
