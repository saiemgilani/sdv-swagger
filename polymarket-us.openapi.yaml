components:
  schemas:
    GatewayV1Markets:
      properties:
        markets:
          items:
            properties:
              active:
                type: boolean
              archived:
                type: boolean
              assetPriceTerms:
                description: Typed terms of an automated crypto price market. Null on every other market,
                  including the hand-listed year-end crypto markets.
                properties:
                  asset:
                    description: Identifies one priced asset. The canonical string form is class:symbol,
                      e.g. crypto:btc or commodity:gold.
                    properties:
                      assetClass:
                        description: AssetClass namespaces asset symbols.
                        enum:
                        - ASSET_CLASS_CRYPTO
                        - ASSET_CLASS_COMMODITY
                        type: string
                      symbol:
                        description: Lower-case symbol within the class, e.g. btc or gold. Matches [a-z0-9-],
                          at most 64 characters.
                        example: btc
                        type: string
                    type: object
                  assetName:
                    description: 'Display name of the asset, e.g. Gold. Empty when the asset has none:
                      show the symbol.'
                    type: string
                  direction:
                    description: ONE_TOUCH direction. ASSET_PRICE_DIRECTION_UNSPECIFIED is returned on
                      every market that is not a ONE_TOUCH.
                    enum:
                    - ASSET_PRICE_DIRECTION_UNSPECIFIED
                    - ASSET_PRICE_DIRECTION_UP
                    - ASSET_PRICE_DIRECTION_DOWN
                    type: string
                  horizon:
                    description: Supply-side horizon slug. Display and grouping only.
                    type: string
                  indexSymbol:
                    description: Reference index the market settles on, e.g. BRTI. Empty on commodity
                      (gold and silver) markets, which settle on a Chainlink spot stream.
                    type: string
                  marketType:
                    description: 'How the market settles. ASSET_PRICE_MARKET_TYPE_UNSPECIFIED is returned
                      for a market type newer than this schema: render the terms that are present.'
                    enum:
                    - ASSET_PRICE_MARKET_TYPE_UNSPECIFIED
                    - ASSET_PRICE_MARKET_TYPE_UP_DOWN
                    - ASSET_PRICE_MARKET_TYPE_ABOVE_BELOW
                    - ASSET_PRICE_MARKET_TYPE_RANGE
                    - ASSET_PRICE_MARKET_TYPE_ONE_TOUCH
                    - ASSET_PRICE_MARKET_TYPE_DATE
                    - ASSET_PRICE_MARKET_TYPE_FIRST_TO_HIT
                    type: string
                  nextWindowStart:
                    description: Start of the next window of this market's length that the asset's trading
                      hours allow. Equals windowEnd on crypto windows. On gold and silver it is later
                      than windowEnd when trading closes after this window (the daily break, the weekend
                      or a holiday). Null when unknown.
                    format: date-time
                    type:
                    - string
                    - 'null'
                  pendingPriceToBeat:
                    description: 'Display only. A pending open price on commodity (ASSET_CLASS_COMMODITY)
                      UP_DOWN markets: the Chainlink spot value for exactly windowStart, with the same
                      decimals as priceToBeat. Set only while priceToBeat is null: usually from 1 to 2
                      seconds after windowStart until priceToBeat is stamped, then null again. Stays null
                      when Chainlink has no report for exactly windowStart, on assets where a pending
                      price is not shown, on every crypto market and on every market that is not UP_DOWN.
                      In rare cases it differs from priceToBeat, and the market settles only on priceToBeat.
                      Show priceToBeat when it is set, else this value labelled as pending.'
                    properties:
                      currency:
                        description: The currency code
                        type: string
                      value:
                        description: The amount as a decimal string.
                        example: 123.45
                        format: decimal
                        type: string
                    required: &id001
                    - value
                    - currency
                    type:
                    - object
                    - 'null'
                  priceDecimals:
                    description: 'Decimal places every price of the market carries, e.g. 2 for BTC and
                      gold, 3 for silver. Always read this field: it can differ between assets, and between
                      market types of one asset, for example 4 for SOL Up/Down. Show prices at exactly
                      this many places.'
                    format: int32
                    type: integer
                  priceToBeat:
                    description: 'Null until stamped: a few seconds after windowStart on crypto, about
                      a minute after it on gold and silver. Null on every market that is not UP_DOWN.'
                    properties:
                      currency:
                        description: The currency code
                        type: string
                      value:
                        description: The amount as a decimal string.
                        example: 123.45
                        format: decimal
                        type: string
                    required: *id001
                    type:
                    - object
                    - 'null'
                  priceUnit:
                    description: Unit one price is quoted per, e.g. oz for gold and silver. Empty when
                      the asset needs no unit, as crypto.
                    type: string
                  rangeKind:
                    description: Which side of a RANGE market is open. ASSET_PRICE_RANGE_KIND_UNSPECIFIED
                      is returned on every market that is not a RANGE.
                    enum:
                    - ASSET_PRICE_RANGE_KIND_UNSPECIFIED
                    - ASSET_PRICE_RANGE_KIND_INTERIOR
                    - ASSET_PRICE_RANGE_KIND_BELOW
                    - ASSET_PRICE_RANGE_KIND_ABOVE
                    type: string
                  rangeLower:
                    description: Null on every market that is not a RANGE, and on the open side of a tail
                      range.
                    properties:
                      currency:
                        description: The currency code
                        type: string
                      value:
                        description: The amount as a decimal string.
                        example: 123.45
                        format: decimal
                        type: string
                    required: *id001
                    type:
                    - object
                    - 'null'
                  rangeUpper:
                    description: Null on every market that is not a RANGE, and on the open side of a tail
                      range.
                    properties:
                      currency:
                        description: The currency code
                        type: string
                      value:
                        description: The amount as a decimal string.
                        example: 123.45
                        format: decimal
                        type: string
                    required: *id001
                    type:
                    - object
                    - 'null'
                  settlementPrice:
                    description: 'Null until resolved, and stays null on a ONE_TOUCH market that resolved
                      No: no price was touched.'
                    properties:
                      currency:
                        description: The currency code
                        type: string
                      value:
                        description: The amount as a decimal string.
                        example: 123.45
                        format: decimal
                        type: string
                    required: *id001
                    type:
                    - object
                    - 'null'
                  strike:
                    description: Null on every market that is not ABOVE_BELOW or ONE_TOUCH.
                    properties:
                      currency:
                        description: The currency code
                        type: string
                      value:
                        description: The amount as a decimal string.
                        example: 123.45
                        format: decimal
                        type: string
                    required: *id001
                    type:
                    - object
                    - 'null'
                  windowEnd:
                    description: End of the measurement window and scheduled settlement instant. Set on
                      every automated crypto family, including ABOVE_BELOW and RANGE ladders. Use this
                      rather than endDate for the settlement time. ONE_TOUCH may settle Yes before this
                      instant.
                    format: date-time
                    type:
                    - string
                    - 'null'
                  windowStart:
                    description: Start of the settlement window. Always set for UP_DOWN. Null when the
                      market has no settlement window (ladders).
                    format: date-time
                    type:
                    - string
                    - 'null'
                type:
                - object
                - 'null'
                x-source: official/polymarket-us-markets-schema.json components.schemas.gateway.market.v1.Market.properties.assetPriceTerms
              bestAskQuote:
