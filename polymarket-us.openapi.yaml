info:
  description: 'Market list and best bid/offer of Polymarket US, the CFTC-regulated US exchange; the /v1
    read routes are keyless. Reverse-engineered from committed captures in polymarket/captures/ (2026-11-18).
    /v1/markets pages by limit/offset (envelope {markets: [...]}) and the capture holds the first page
    only (see x-pagination); /v1/markets/{slug}/bbo answers {marketData: {...}}. A game-winner market''s
    slug is "aec-" + the usId of a Gamma event (aec-nba-sa-sac-2026-11-06; observed, not captured: the
    bare usId answers 404); futures use other prefixes (tec-), as do a game''s other markets. Prices arrive
    as {value, currency} objects whose value is a decimal string. The schemas union an open and an expired/closed
    sample: an expired market answers bestBid/bestAsk null and omits longQuote/shortQuote. A field every
    capture answers null is untyped (x-observed-null-only) unless Polymarket US''s own published schema
    (official/) types it, as for assetPriceTerms. outcomes / outcomePrices are JSON arrays serialised
    inside a string. Not official or supported.'
  title: Polymarket US gateway API (gateway.polymarket.us) - public reads
  version: '2026-11-18'
openapi: 3.1.0
paths:
  /v1/markets:
    get:
      operationId: get_v1_markets
      parameters:
      - description: Page size.
        example: '3'
        in: query
        name: limit
        required: false
        schema:
          type: string
      - description: Filter closed markets/events (true/false).
        example: 'false'
        in: query
        name: closed
        required: false
        schema:
          type: string
      - description: Filter active markets (true/false).
        example: 'true'
        in: query
        name: active
        required: false
        schema:
          type: string
      - description: Row offset; offset=1 shifts the page (verified 2026-11-18).
        in: query
        name: offset
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayV1Markets'
          description: OK
      summary: gateway.polymarket.us/v1/markets
      x-pagination:
        parameters:
        - limit
        - offset
        request: 'verified: offset=1 shifts the page; the capture holds the first page only (probed 2026-11-18)'
  /v1/markets/{slug}/bbo:
    get:
      operationId: get_v1_markets_slug_bbo
      parameters:
      - description: 'Exact Polymarket US market slug: the slug field of a /v1/markets row. A game''s
          game-winner (moneyline) market is "aec-" + the Gamma event''s usId (aec-nba-sa-sac-2026-11-06);
          the game''s other markets (e.g. spreads) and futures (tec-mls-winner-2026-11-07-sea) have their
          own slugs, so pass the listing''s slug rather than building one.'
        example: tec-mls-winner-2026-11-07-sea
        in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayV1MarketsSlugBbo'
          description: OK
      summary: gateway.polymarket.us/v1/markets/{slug}/bbo
servers:
- url: https://gateway.polymarket.us
