info:
  description: 'Market list and best bid/offer of Polymarket US, the CFTC-regulated US exchange; the /v1
    read routes are keyless. Reverse-engineered from committed captures in polymarket/captures/ (2026-11-18).
    /v1/markets pages by limit/offset (envelope {markets: [...]}) and the capture holds the first page
    only (see x-pagination); /v1/markets/{slug}/bbo answers {marketData: {...}}. A game market''s slug
    is "aec-" + the usId of a Gamma event (aec-nba-sa-sac-2026-11-06; observed, not captured: the bare
    usId answers 404); futures use other prefixes (tec-). Prices arrive as {value, currency} objects whose
    value is a decimal string. The schemas union an open and an expired/closed sample: an expired market
    answers bestBid/bestAsk null and omits longQuote/shortQuote. outcomes / outcomePrices are JSON arrays
    serialised inside a string. Not official or supported.'
  title: Polymarket US gateway API (gateway.polymarket.us) - public reads
  version: '2026-11-18'
openapi: 3.1.0
paths:
  /v1/markets:
    get:
      operationId: get_v1_markets
      parameters:
      - description: Page size.
        example: '3'
        in: query
        name: limit
        required: false
        schema:
          type: string
      - description: Filter closed markets/events (true/false).
        example: 'false'
        in: query
        name: closed
        required: false
        schema:
          type: string
      - description: Filter active markets (true/false).
        example: 'true'
        in: query
        name: active
        required: false
        schema:
          type: string
      - description: Row offset; offset=1 shifts the page (verified 2026-11-18).
        in: query
        name: offset
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayV1Markets'
          description: OK
      summary: gateway.polymarket.us/v1/markets
      x-pagination:
        parameters:
        - limit
        - offset
        request: 'verified: offset=1 shifts the page; the capture holds the first page only (probed 2026-11-18)'
  /v1/markets/{slug}/bbo:
    get:
      operationId: get_v1_markets_slug_bbo
      parameters:
      - description: Polymarket US market slug (from /v1/markets). A game market's is "aec-" + a Gamma
          event's usId (aec-nba-sa-sac-2026-11-06); futures use other prefixes (tec-mls-winner-2026-11-07-sea).
        example: tec-mls-winner-2026-11-07-sea
        in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayV1MarketsSlugBbo'
          description: OK
      summary: gateway.polymarket.us/v1/markets/{slug}/bbo
servers:
- url: https://gateway.polymarket.us
