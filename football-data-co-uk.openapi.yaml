info:
  description: 'Files, not an API: one CSV per league-season (mmz4281/<season>/<div>.csv) for the main
    leagues, one CSV per country for the ''extra'' leagues (new/<country>.csv), the upcoming fixtures
    file, and notes.txt, the column glossary. Column types come from committed CSV heads (header + 3 rows)
    captured 2026-10-06, descriptions from the committed notes.txt; odds columns are bookmaker-prefixed
    (B365H, PSD, ...) as the glossary states. Keyless, no rate limit stated: stay at one request per second.
    Not official or supported.'
  title: Football-Data.co.uk CSV files (www.football-data.co.uk)
  version: csv
openapi: 3.1.0
