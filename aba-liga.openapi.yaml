components:
  schemas:
    AbaCalendar:
      description: 'Record parsed from /calendar/{sez}/{lea}/ (text/html): the season select and every
        game of every round of one season and league.'
      properties:
        games:
          description: Every game of the season, round by round in page order (each round is one accordion
            panel).
          items:
            properties:
              away_abbr:
                description: Away club's three-letter code.
                type: string
              away_score:
                description: Away final score; null like home_score for a game not played yet.
                type: integer
              away_team:
                description: Away club name; null like home_team while a pairing is not set (not in the
                  samples).
                type: string
              date:
                description: Game date, ISO 'YYYY-MM-DD' (the first date of a window). The parser sets
                  null for 'TBA' (2026-27 page; not in the samples).
                type: string
              date_to:
                description: 'Unobserved: null in every sample. When filled: Last date of a ''dd.mm.yyyy
                  - dd.mm.yyyy'' window; null otherwise (every sampled game is scheduled).'
                x-unobserved: true
              game_no:
                description: 'Game number (key space: per season AND league: it restarts at 1 for every
                  (sez, lea), so a game''s key is (game_no, sez, lea); ABA 2025-26 runs 1..251 with gaps
                  for unplayed playoff games). The {gameNo} of /match/ and the id= of the live-match helpers.'
                type: integer
              group:
                description: Group letter ('A', 'B') from the Group column, which exists only in seasons
                  with groups (ABA 2025-26). Null on the rounds after the groups (Top8, Play-out, playoffs);
                  ABSENT when the page has no Group column.
                type:
                - string
                - 'null'
                x-absent-in-some-rows: true
              home_abbr:
                description: Home club's three-letter code ('PAR', 'CZV'), from the mobile copy of the
                  cell.
                type: string
              home_score:
                description: Home final score. Never null in the samples (finished seasons); null for
                  a game not played yet (empty Result cell, 2026-27 page).
                type: integer
              home_team:
                description: 'Home club name as the site prints it now (see the match page''s game.home_team).
                  Never null in the samples (finished seasons); the parser sets null while a playoff pairing
                  is not set ('' : '', seen on the 2026-27 page).'
                type: string
              lea:
                description: 'League code: 1 = ABA League, 2 = ABA League 2 (also 3 = Supercup, 7 = U19,
                  8 = qualifiers; those are not sampled). From the game link; checked to equal the request.'
                type: integer
              local_place:
                description: City of local_time; null otherwise.
                type:
                - string
                - 'null'
              local_time:
                description: Arena-local tip-off 'hh:mm' for arenas outside Central Europe (Dubai, Cluj-Napoca);
                  null otherwise.
                type:
                - string
                - 'null'
              round:
                description: 'Round / phase label, the panel title (vocabulary in the notes below). ABA
                  2025-26: ''ROUND 1''..''ROUND 18'', ''Top8 - R1''..''R8'', ''Play-out - R1''..''R10'',
                  ''Play-in R1''/''R2'', ''Quarter-finals, Round 1''..3, ''Semi-finals, Round 1''..3,
                  ''Finals, Round 1''..4.'
                type: string
              sez:
                description: 'Season key: season START year - 2000 (25 = 2025-26, 8 = 2008-09). sdv season
                  (END year) = 2000 + sez + 1. From the game link; checked to equal the request.'
                type: integer
              time:
                description: Tip-off 'hh:mm' in time_zone. Null when only a date or 'TBA' is printed (2026-27
                  page; not in the samples).
                type: string
              time_zone:
                description: '''CET'' = Central European wall-clock time including summer time; ''local''
                  = arena local time (''Local time'', ABA League 2).'
                type: string
              when:
                description: 'Date and Time cell verbatim: ''Monday, 06.10.2025 18:00 CET'', with ''(19:00
                  Dubai local time)'' for arenas outside Central Europe, ''Local time'' on ABA League
                  2, a date window ''Friday, 25.12.2026 - Sunday, 27.12.2026'' or ''TBA'' before scheduling.'
                type: string
            type: object
          type: array
        season:
          description: The season the page was asked for, read back from select#season's selected option.
          properties:
            label:
              description: Selected option text, 'Season YYYY/YY'.
              type: string
            lea:
              description: 'League code: 1 = ABA League, 2 = ABA League 2 (also 3 = Supercup, 7 = U19,
                8 = qualifiers; those are not sampled).'
              type: integer
            sez:
              description: 'Season key: season START year - 2000 (25 = 2025-26, 8 = 2008-09). sdv season
                (END year) = 2000 + sez + 1.'
              type: integer
          type: object
        seasons:
          description: 'Every option of select#season: the seasons this league''s calendar offers (ABA:
            2001-02 onward, 26 options; ABA League 2 lists its own range).'
          items:
            properties:
              label:
                description: '''Season YYYY/YY''.'
                type: string
              lea:
                description: 'League code: 1 = ABA League, 2 = ABA League 2 (also 3 = Supercup, 7 = U19,
                  8 = qualifiers; those are not sampled).'
                type: integer
              sez:
                description: 'Season key: season START year - 2000 (25 = 2025-26, 8 = 2008-09). sdv season
                  (END year) = 2000 + sez + 1.'
                type: integer
            type: object
          type: array
      type: object
    AbaMatch:
      description: 'Record parsed from /match/{gameNo}/{sez}/{lea}/Overview (text/html): game header,
        period scores, officials, both box scores, team totals and the play-by-play in game order.'
      properties:
        game:
          description: The game header (#basic_match_info, the clubs table, the officials line).
          properties:
            attendance:
              description: Spectators (the users icon); null when the page prints none.
              type: integer
            away_city:
              description: Away club city (local spelling).
              type: string
            away_score:
              description: Away final score.
              type: integer
            away_team:
              description: Away club name as the site prints it now (see home_team).
              type: string
            away_team_id:
              description: 'ABA team id (key space: aba-liga.com clubs, the same id in every season and
                in both leagues, e.g. Partizan = 22 in 2008-09 and 2025-26, Krka = 10). The first number
                of /team/{id}/{sez}/{lea}/0/{slug}/ and of the logo images/club/{size}/{id}.png. Joins
                match game.*_team_id / players / teams / pbp, standings rows and the player page. Not
                a player id.'
              type: integer
            commissioner:
              description: Game commissioner's name ('Commissioner:' line); 2008-09 adds an IOC-style
                country code in parentheses ('(SRB)'). Null when not printed.
              type:
              - string
              - 'null'
            competition:
              description: 'Competition name as printed, sponsor included and applied to every season:
                ''AdmiralBet ABA League'' (2017-18 and 2025-26), ''Regional League'' (2008-09), ''2. ABA
                liga'' (ABA League 2).'
              type: string
            date:
              description: Game date, ISO 'YYYY-MM-DD', from the when line.
              type: string
            date_to:
              description: 'Unobserved: null in every sample. When filled: End of a date window (''dd.mm.yyyy
                - dd.mm.yyyy'', used before a game is scheduled); null on every played game.'
              x-unobserved: true
            game_no:
              description: 'Game number (key space: per season AND league: it restarts at 1 for every
                (sez, lea), so a game''s key is (game_no, sez, lea); ABA 2025-26 runs 1..251 with gaps
                for unplayed playoff games). The {gameNo} of /match/ and the id= of the live-match helpers.
                Read from the page''s hidden input #match_data_id and checked against the request.'
              type: integer
            group:
              description: Group letter of a two-group regular season ('A', 'B'). ABSENT when the season
                has no groups (2008-09, 2017-18 and ABA League 2 samples).
              type: string
              x-absent-in-some-rows: true
            home_city:
              description: 'Home club city (local spelling: ''Beograd'', ''Novo Mesto'').'
              type: string
            home_score:
              description: Home final score.
              type: integer
            home_team:
              description: 'Home club name as the site prints it NOW: a club''s current name is applied
                to every season (2008-09 shows ''Partizan Mozzart Bet''); a club that no longer plays
                keeps its last name (2008-09 ''Petrol Olimpija''). Join on the team id.'
              type: string
            home_team_id:
              description: 'ABA team id (key space: aba-liga.com clubs, the same id in every season and
                in both leagues, e.g. Partizan = 22 in 2008-09 and 2025-26, Krka = 10). The first number
                of /team/{id}/{sez}/{lea}/0/{slug}/ and of the logo images/club/{size}/{id}.png. Joins
                match game.*_team_id / players / teams / pbp, standings rows and the player page. Not
                a player id.'
              type: integer
            lea:
              description: 'League code: 1 = ABA League, 2 = ABA League 2 (also 3 = Supercup, 7 = U19,
                8 = qualifiers; those are not sampled). From #match_data_lea, checked against the request.'
              type: integer
            local_place:
              description: 'Unobserved: null in every sample. When filled: City of local_time (''Dubai'',
                ''Cluj-Napoca''); null otherwise.'
              x-unobserved: true
            local_time:
              description: 'Unobserved: null in every sample. When filled: Arena-local tip-off ''hh:mm''
                when the arena is outside Central Europe (''(19:00 Dubai local time)''); null otherwise.'
              x-unobserved: true
            referees:
              description: Referees' names in page order (crew chief first), from the 'Referees:' line;
                with country codes in 2008-09 ('Ademir Zurapović (BIH)', both 'BIH' and 'BiH' occur).
              items:
                description: One referee's name.
                type: string
              type: array
            round:
              description: 'Round / phase label as the page prints it: ''ROUND 1'', ''Top8 - R2'', ''Quarter-finals,
                Round 1'', ''Finals, Round 4'', ''Semifinal''. Same vocabulary as calendar games[].round.'
              type: string
            season:
              description: Season label 'YYYY/YY' (START/END years).
              type: string
            sez:
              description: 'Season key: season START year - 2000 (25 = 2025-26, 8 = 2008-09). sdv season
                (END year) = 2000 + sez + 1. From #match_data_sez, checked against the request.'
              type: integer
            time:
              description: Tip-off time 'hh:mm' in time_zone.
              type: string
            time_zone:
              description: '''CET'' = Central European wall-clock time INCLUDING summer time (the label
                never changes; the Dubai local times prove CEST in October/June, CET in winter); ''local''
                = the arena''s local time (ABA League 2 prints ''Local time'').'
              type: string
            venue:
              description: 'Arena name (''Venue: ...''). ABSENT on the 2008-09 sample (the page has no
                venue line).'
              type: string
              x-absent-in-some-rows: true
            when:
              description: Date-and-time line verbatim (English weekday, dd.mm.yyyy, hh:mm, time-zone
                label).
              type: string
          type: object
        pbp:
          description: 'Play-by-play in GAME order: the page lists each period newest first and the record
            reverses it. Parsed from the desktop table .match_table_play_by_play of tabs #q1..#q5 (q5
            = overtime). EMPTY ([]) before 2017-18: the page has no play-by-play tab (2008-09 sample).'
          items:
            properties:
              action:
                description: text without its parenthesised qualifier; see the action table below the
                  route. Null on team rows (they print only '(qualifier)') and bare-clock rows.
                type:
                - string
                - 'null'
              away_score:
                description: Away score after this event, as home_score.
                type:
                - integer
                - 'null'
              clock:
                description: Clock in the period, 'mm:ss' REMAINING (counts down from 10:00; overtime
                  from 05:00). Null on the starting-lineup rows and on game / period start and end markers.
                type:
                - string
                - 'null'
              home_score:
                description: 'Home score after this event: only set on scoring events (the page prints
                  the score only there); null otherwise. Carry it forward for a running score.'
                type:
                - integer
                - 'null'
              jersey:
                description: Jersey number printed before the name; the page omits it on some rows (all
                  starting-lineup rows and many home rows), so null there.
                type:
                - integer
                - 'null'
              period:
                description: '1-4 = quarters, 5 = overtime (the #q5 tab; every overtime of the game).'
                type: integer
              player_id:
                description: 'ABA player id (key space: aba-liga.com players, global: the same person
                  keeps one id across seasons and both leagues, e.g. Carlik Jones = 4807). The first number
                  of /player/{id}/{sez}/{lea}/{slug}/; equals the shot chart''s player_id, which is a
                  STRING there. Null on team, timeout and game/period rows.'
                type:
                - integer
                - 'null'
              player_name:
                description: 'Name as the play-by-play prints it: ''SURNAME I'' upper case (the trailing
                  ''.'' belongs to the event text on the page and is dropped).'
                type:
                - string
                - 'null'
              qualifier:
                description: The parenthesised part of text (shot type, rebound side, free-throw 'n of
                  m', foul or turnover type); see the qualifier table. Null when the text has none.
                type:
                - string
                - 'null'
              seq:
                description: 1-based position in game order across the whole game (after the reversal).
                type: integer
              side:
                description: 'Which column the event sits in: ''home'', ''away'', or null for game/period
                  markers and bare-clock rows. A timeout row gets the side of its team badge.'
                type:
                - string
                - 'null'
              team_id:
                description: 'ABA team id (key space: aba-liga.com clubs, the same id in every season
                  and in both leagues, e.g. Partizan = 22 in 2008-09 and 2025-26, Krka = 10). The first
                  number of /team/{id}/{sez}/{lea}/0/{slug}/ and of the logo images/club/{size}/{id}.png.
                  Joins match game.*_team_id / players / teams / pbp, standings rows and the player page.
                  Not a player id. Read from the row''s 50x50 club badge; null on team-less rows and on
                  team rows without a badge.'
                type:
                - integer
                - 'null'
              text:
                description: 'Event text in English after the player''s name: ''<action> (<qualifier>)'',
                  ''in starting lineup'', or the whole text of a team / game row (''(defensive)'', ''Timeout'',
                  ''start of 1. quarter''). Null on bare-clock rows (''10:00'' with nothing else, opening
                  some periods).'
                type:
                - string
                - 'null'
            type: object
          type: array
        periods:
          description: 'Score of each period from #match_cetrtine_rezultat (Slovenian ''četrtine'' = quarters);
            overtime periods follow Q4.'
          items:
            properties:
              away:
                description: Away points in the period (not cumulative).
                type: integer
              home:
                description: Home points in the period (not cumulative).
                type: integer
              period:
                description: '''Q1''..''Q4'', then ''OT1'', ''OT2'' ... for overtimes.'
                type: string
            type: object
          type: array
        players:
          description: Both box scores (home table, then away), one row per player in page order (by jersey
            number).
          items:
            properties:
              assists:
                description: Assists (Ass). Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
              blocks:
                description: Shots blocked by this player or team (Blck Fv, 'in favour'). Null on did-not-play
                  rows (played = false).
                type:
                - integer
                - 'null'
              blocks_against:
                description: Own shots blocked by an opponent (Blck Ag, 'against'). Null on did-not-play
                  rows (played = false).
                type:
                - integer
                - 'null'
              fg2_att:
                description: 2-point field goals attempted (FG2 A). Null on did-not-play rows (played
                  = false).
                type:
                - integer
                - 'null'
              fg2_made:
                description: 2-point field goals made (FG2 M). Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
              fg2_pct:
                description: 2-point percentage, 0-100 with one decimal; 0 when no attempt. Null on did-not-play
                  rows (played = false).
                type:
                - number
                - 'null'
              fg3_att:
                description: 3-point field goals attempted (FG3 A). Null on did-not-play rows (played
                  = false).
                type:
                - integer
                - 'null'
              fg3_made:
                description: 3-point field goals made (FG3 M). Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
              fg3_pct:
                description: 3-point percentage, 0-100 with one decimal; 0 when no attempt. Null on did-not-play
                  rows (played = false).
                type:
                - number
                - 'null'
              fg_pct:
                description: Field-goal percentage over 2- and 3-point attempts, 0-100 with one decimal
                  (FG2 + FG3 made / attempted); 0 when no attempt. Header 'overall %'. Null on did-not-play
                  rows (played = false).
                type:
                - number
                - 'null'
              fouls:
                description: Fouls committed (Foul Cm). Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
              fouls_drawn:
                description: Fouls drawn / received (Foul Rv). Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
              ft_att:
                description: Free throws attempted (FT A). Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
              ft_made:
                description: Free throws made (FT M). Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
              ft_pct:
                description: Free-throw percentage, 0-100 with one decimal; 0 when no attempt. Null on
                  did-not-play rows (played = false).
                type:
                - number
                - 'null'
              jersey:
                description: Jersey number.
                type: integer
              minutes:
                description: Minutes played, 'mm:ss' text. '00:00' on did-not-play rows.
                type: string
              on_court_at_end:
                description: 'On court at the final buzzer: the box prints the name in bold (matches the
                  substitutions in the play-by-play on every sample). Null for the whole game when no
                  name is bold (box-only seasons).'
                type:
                - boolean
                - 'null'
              played:
                description: False on a did-not-play row (minutes '00:00' and one empty cell across the
                  stat columns); its stat columns are null.
                type: boolean
              player_id:
                description: 'ABA player id (key space: aba-liga.com players, global: the same person
                  keeps one id across seasons and both leagues, e.g. Carlik Jones = 4807). The first number
                  of /player/{id}/{sez}/{lea}/{slug}/; equals the shot chart''s player_id, which is a
                  STRING there.'
                type: integer
              player_name:
                description: 'Name as the box prints it: ''Surname I.'' (diacritics kept).'
                type: string
              plus_minus:
                description: Plus/minus while on court (+/-). 0 on every row of the 2008-09 sample (not
                  tracked then). Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
              points:
                description: Points scored (overall Pts). Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
              pts_fast_break:
                description: Fast-break points (Points from FstBr). Absent on the 2008-09 sample, as pts_paint.
                  Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
                x-absent-in-some-rows: true
              pts_paint:
                description: Points in the paint (Points from Paint). ABSENT before the advanced columns
                  appear (absent on the 2008-09 sample, present on 2017-18). Null on did-not-play rows
                  (played = false).
                type:
                - integer
                - 'null'
                x-absent-in-some-rows: true
              pts_second_chance:
                description: Second-chance points (Points from 2ndCh). Absent on the 2008-09 sample, as
                  pts_paint. Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
                x-absent-in-some-rows: true
              reb_def:
                description: Defensive rebounds (Rebs D). Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
              reb_off:
                description: Offensive rebounds (Rebs O). Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
              reb_tot:
                description: Total rebounds (Rebs T). Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
              side:
                description: '''home'' or ''away'' (the home team is listed first everywhere on the site).'
                type: string
              starter:
                description: 'In the starting five: the box marks it with ''*'' (matches the play-by-play
                  ''in starting lineup'' rows on every sample). Null for the whole game when no row carries
                  a ''*'' (box-only seasons, 2008-09 sample).'
                type:
                - boolean
                - 'null'
              steals:
                description: Steals (St). Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
              team_id:
                description: 'ABA team id (key space: aba-liga.com clubs, the same id in every season
                  and in both leagues, e.g. Partizan = 22 in 2008-09 and 2025-26, Krka = 10). The first
                  number of /team/{id}/{sez}/{lea}/0/{slug}/ and of the logo images/club/{size}/{id}.png.
                  Joins match game.*_team_id / players / teams / pbp, standings rows and the player page.
                  Not a player id.'
                type: integer
              turnovers:
                description: Turnovers (To). Null on did-not-play rows (played = false).
                type:
                - integer
                - 'null'
              valuation:
                description: 'Valuation (Val, ''rank Value''): the efficiency rating (PIR-style index)
                  the site ranks players by. Null on did-not-play rows (played = false).'
                type:
                - integer
                - 'null'
            type: object
          type: array
        teams:
          description: 'Team totals from the ''Team Compare'' table: home row, then away.'
          items:
            properties:
              assists:
                description: Assists (Ass).
                type: integer
              blocks:
                description: Shots blocked by this player or team (Blck Fv, 'in favour').
                type: integer
              blocks_against:
                description: Own shots blocked by an opponent (Blck Ag, 'against').
                type: integer
              fg2_att:
                description: 2-point field goals attempted (FG2 A).
                type: integer
              fg2_made:
                description: 2-point field goals made (FG2 M).
                type: integer
              fg2_pct:
                description: 2-point percentage, 0-100 with one decimal; 0 when no attempt.
                type: number
              fg3_att:
                description: 3-point field goals attempted (FG3 A).
                type: integer
              fg3_made:
                description: 3-point field goals made (FG3 M).
                type: integer
              fg3_pct:
                description: 3-point percentage, 0-100 with one decimal; 0 when no attempt.
                type: number
              fg_pct:
                description: Field-goal percentage over 2- and 3-point attempts, 0-100 with one decimal
                  (FG2 + FG3 made / attempted); 0 when no attempt. Header 'overall %'.
                type: number
              fouls:
                description: Fouls committed (Foul Cm).
                type: integer
              fouls_drawn:
                description: Fouls drawn / received (Foul Rv).
                type: integer
              ft_att:
                description: Free throws attempted (FT A).
                type: integer
              ft_made:
                description: Free throws made (FT M).
                type: integer
              ft_pct:
                description: Free-throw percentage, 0-100 with one decimal; 0 when no attempt.
                type: number
              minutes:
                description: 'Minutes played, ''mm:ss'' text. Team rows sum the five on court: ''200:00'',
                  ''225:00'' with one overtime.'
                type: string
              plus_minus:
                description: 'Plus/minus while on court (+/-). 0 on every row of the 2008-09 sample (not
                  tracked then). Team rows: the final margin (0 on the 2008-09 sample).'
                type: integer
              points:
                description: Points scored (overall Pts).
                type: integer
              pts_fast_break:
                description: Fast-break points (Points from FstBr). Absent on the 2008-09 sample, as pts_paint.
                type: integer
                x-absent-in-some-rows: true
              pts_paint:
                description: Points in the paint (Points from Paint). ABSENT before the advanced columns
                  appear (absent on the 2008-09 sample, present on 2017-18).
                type: integer
                x-absent-in-some-rows: true
              pts_second_chance:
                description: Second-chance points (Points from 2ndCh). Absent on the 2008-09 sample, as
                  pts_paint.
                type: integer
                x-absent-in-some-rows: true
              reb_def:
                description: Defensive rebounds (Rebs D).
                type: integer
              reb_off:
                description: Offensive rebounds (Rebs O).
                type: integer
              reb_tot:
                description: Total rebounds (Rebs T). Team rows equal the players' sum on every sample
                  (team rebounds are not added).
                type: integer
              side:
                description: '''home'' or ''away'' (the home team is listed first everywhere on the site).'
                type: string
              steals:
                description: Steals (St).
                type: integer
              team_id:
                description: 'ABA team id (key space: aba-liga.com clubs, the same id in every season
                  and in both leagues, e.g. Partizan = 22 in 2008-09 and 2025-26, Krka = 10). The first
                  number of /team/{id}/{sez}/{lea}/0/{slug}/ and of the logo images/club/{size}/{id}.png.
                  Joins match game.*_team_id / players / teams / pbp, standings rows and the player page.
                  Not a player id.'
                type: integer
              team_name:
                description: Club name as the site prints it now (see game.home_team).
                type: string
              turnovers:
                description: Turnovers (To).
                type: integer
              valuation:
                description: 'Valuation (Val, ''rank Value''): the efficiency rating (PIR-style index)
                  the site ranks players by.'
                type: integer
            type: object
          type: array
      type: object
      x-code-tables:
        pbp.[].action:
          Timeout: Team timeout (middle column, with the team's badge).
          assist: Assist (no qualifier).
          block: Blocked shot by this player (no qualifier).
          end of 1. quarter: Period end marker.
          end of 2. quarter: Period end marker.
          end of 3. quarter: Period end marker.
          end of 4. quarter: Period end marker.
          end of OT1: Overtime end marker.
          foul: Foul committed; qualifier = type.
          foul on: 'Foul drawn: this player was fouled (no qualifier).'
          game finished: Game end marker (middle column); the capture requires it.
          game started: Game start marker (middle column).
          in starting lineup: Player is in the starting five (one row per starter, before 'game started';
            no clock).
          jumpball: Jump ball marker (middle column); the players' rows are 'jumpball (won)' / '(lost)'.
          made 2 points: Made 2-point field goal; qualifier = shot type.
          made 3 points: Made 3-point field goal; qualifier = shot type.
          made free throw: Made free throw; qualifier = 'n of m'.
          missed 2 points: Missed 2-point field goal; qualifier = shot type.
          missed 3 points: Missed 3-point field goal; qualifier = shot type.
          missed free throw: Missed free throw; qualifier = 'n of m'.
          rebound: Rebound; qualifier 'offensive' / 'defensive'.
          start of 1. quarter: Period start marker; '1.'..'4.' quarter.
          start of 2. quarter: Period start marker.
          start of 3. quarter: Period start marker.
          start of 4. quarter: Period start marker.
          start of OT1: Overtime start marker ('OT1', 'OT2', ...).
          steal: Steal (no qualifier).
          substitution: Substitution; qualifier 'in' / 'out'.
          timeout - officials: Officials' timeout (middle column, no team).
          turnover: Turnover; qualifier = type.
        pbp.[].qualifier:
          1 of 2: Free throw 1 of 2.
          1 of 3: Free throw 1 of 3.
          1of1: Free throw 1 of 1 (spelled without spaces).
          2 of 2: Free throw 2 of 2.
          2 of 3: Free throw 2 of 3.
          24sec: Shot-clock (24-second) violation, on a team row.
          3 of 3: Free throw 3 of 3.
          bad pass: 'Turnover: bad pass.'
          ballhandling: 'Turnover: ball-handling error.'
          defensive: Defensive rebound; on a team row '(defensive)' = team defensive rebound.
          doubledribble: 'Turnover: double dribble.'
          drivinglayup: Driving layup.
          dunk: Dunk.
          floatingjump shot: Floating jump shot (floater).
          freethrow: 'Team row ''(freethrow)'': unverified (a team free-throw event, e.g. a lane violation).'
          gameorshotclock: 'Team turnover: game- or shot-clock expired (team row).'
          heldball: Held ball (team row; alternating possession).
          in: 'Substitution: enters the game.'
          jump shot: Jump shot.
          layup: Layup.
          lost: Jump ball lost.
          offensive: Offensive (rebound, foul or turnover type); on a team row '(offensive)' = team offensive
            rebound.
          out: 'Substitution: leaves the game.'
          outofbounds: 'Turnover: out of bounds (team row: team turnover out of bounds).'
          personal: Personal foul.
          technical: Technical foul.
          tip inlayup: Tip-in (layup).
          travel: 'Turnover: travelling.'
          turnaroundjump shot: Turnaround jump shot (words run together as printed).
          unsportsmanlike: Unsportsmanlike foul.
          violence: 'Team row ''(violence)'': unverified (a team violation coded ''violence''; seen once,
            ABA League 2 2025-26 game 1).'
          won: Jump ball won.
    AbaPlayer:
      description: 'Record parsed from /player/{playerId}/{sez}/{lea}/ (text/html): the player''s info
        box, the free-text club history and the season''s game log.'
