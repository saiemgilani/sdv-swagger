        player_id:
          description: 'ABA player id (key space: aba-liga.com players, global: the same person keeps
            one id across seasons and both leagues, e.g. Carlik Jones = 4807). The first number of /player/{id}/{sez}/{lea}/{slug}/;
            equals the shot chart''s player_id, which is a STRING there. The request''s id, echoed by
