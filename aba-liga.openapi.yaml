    AbaScoreDifference:
      description: 'Body of create_scoredifference.php: identical to create_json.php for a played game
        (same rows, same types).'
      items:
        description: Score at one whole game minute.
        properties:
          domaci_rez:
            description: Home cumulative score at the end of that minute, a numeric STRING ('domaći' =
              home, 'rez' = rezultat, result). The last row equals the final score.
            type: string
          minuta:
            description: Elapsed game minute, an INTEGER 0..40 (0 = tip-off), then 41..45 per overtime
              ('minuta' = minute). Every minute is present once, in order.
            type: integer
          tuji_rez:
            description: Away cumulative score at the end of that minute, a numeric STRING (Slovenian
              'tuji' = foreign / guest).
            type: string
        type: object
      type: array
    AbaScoreFlow:
      description: 'Body of create_json.php: a JSON array served as text/html, the cumulative score at
        every whole game minute 0..40 (+5 per overtime). Keys are Slovenian/Serbo-Croatian (minuta = minute,
        domaci = home, tuji = away/guest, rez = result).'
      items:
        description: Score at one whole game minute.
        properties:
          domaci_rez:
            description: Home cumulative score at the end of that minute, a numeric STRING ('domaći' =
              home, 'rez' = rezultat, result). The last row equals the final score.
            type: string
          minuta:
            description: Elapsed game minute, an INTEGER 0..40 (0 = tip-off), then 41..45 per overtime
              ('minuta' = minute). Every minute is present once, in order.
            type: integer
          tuji_rez:
            description: Away cumulative score at the end of that minute, a numeric STRING (Slovenian
              'tuji' = foreign / guest).
            type: string
        type: object
      type: array
    AbaShotChart:
      description: 'Body of create_shooting_chart.php: a JSON array served as text/html, one object per
        field-goal attempt, in game order. Keys are Slovenian (ekipa = team, koordinata = coordinate,
        uspeh = success).'
      items:
        description: One field-goal attempt.
        properties:
          ekipa:
            description: 'Team, a STRING: ''1'' = home, ''2'' = away (Slovenian ''ekipa'' = team).'
            type: string
          koordinata_uspeh:
            description: 'Made flag, a STRING (''uspeh'' = success): ''1'' = made, ''0'' = missed.'
            type: string
          koordinata_x:
            description: 'Shot x (''koordinata'' = coordinate): 0-100 = PERCENT of the court LENGTH from
              the LEFT baseline of the 1000x535 px full-court image live-match/images/aba-basketball-markings-final.png
              (Chart.js bubble chart, axes 0-100). Each team is drawn at one end: home shots at x < 50
              (left basket at about x 5, y 50), away shots at x > 50. TYPE VARIES WITHIN ONE BODY: one
              contiguous run of rows (one half of the game) is a numeric string as stored, the other run
              is a JSON number the server computed as 100 - stored x (floats carry noise such as 15.760000000000005;
              whole values come out as integers). Cast to float.'
            type:
            - number
            - string
          koordinata_y:
            description: 'Shot y, a numeric STRING: 0-100 = PERCENT of the court WIDTH; Chart.js draws
              y upward, so 0 = the bottom edge of the image and 50 = the line through both baskets. Never
              mirrored (string in every row).'
            type: string
          player_id:
            description: 'Shooter: ABA player id (key space: aba-liga.com players, global: the same person
              keeps one id across seasons and both leagues, e.g. Carlik Jones = 4807). The first number
              of /player/{id}/{sez}/{lea}/{slug}/; equals the shot chart''s player_id, which is a STRING
              there. A STRING here; ''0'' (with player_name '' '') = shooter not recorded (seen once,
              ABA 2025-26 game 6).'
            type: string
          player_name:
            description: Shooter's full name, 'First Last' (the box prints 'Last F.'); ' ' when player_id
              is '0'.
            type: string
        type: object
      type: array
    AbaStandings:
      description: 'Record parsed from /standings/{sez}/{lea}/ (text/html): every standings table of one
        season and league, flattened to rows.'
      properties:
        rows:
          description: Every row of every standings table, in page order.
          items:
            properties:
              games:
                description: Games played (GP).
                type: integer
              group:
                description: Group heading under the phase ('Group A', 'Group B'); null when the table
                  has no group heading.
                type:
                - string
                - 'null'
              losses:
                description: Losses (L).
                type: integer
              point_diff:
                description: Point difference (Diff), points_for - points_against.
                type: integer
              points_against:
                description: Points allowed (right side of 'Overall').
                type: integer
              points_for:
                description: Points scored (left side of 'Overall' 'for:against').
                type: integer
              rank:
                description: Position in this table (#).
                type: integer
              standing_points:
                description: 'Standings points (Points): 2 per win and 1 per loss (FIBA), e.g. 21-3 =
                  45.'
                type: integer
              table:
                description: 'Title of the table''s phase heading (h2): ''Top 8 Season 2025/26'', ''Play-out
                  Season 2025/26'', ''Regular Season 2025/26''.'
                type: string
              team_id:
                description: 'ABA team id (key space: aba-liga.com clubs, the same id in every season
                  and in both leagues, e.g. Partizan = 22 in 2008-09 and 2025-26, Krka = 10). The first
                  number of /team/{id}/{sez}/{lea}/0/{slug}/ and of the logo images/club/{size}/{id}.png.
                  Joins match game.*_team_id / players / teams / pbp, standings rows and the player page.
                  Not a player id.'
                type: integer
              team_name:
                description: Club name as the site prints it now (see the match page's game.home_team).
                type: string
              wins:
                description: Wins (W).
                type: integer
            type: object
          type: array
        season:
          description: The season the page was asked for, read back from select#season's selected option.
          properties:
            label:
              description: Selected option text, 'Season YYYY/YY'.
              type: string
            lea:
              description: 'League code: 1 = ABA League, 2 = ABA League 2 (also 3 = Supercup, 7 = U19,
                8 = qualifiers; those are not sampled).'
              type: integer
            sez:
              description: 'Season key: season START year - 2000 (25 = 2025-26, 8 = 2008-09). sdv season
                (END year) = 2000 + sez + 1.'
              type: integer
          type: object
      type: object
info:
  description: 'Adriatic ABA League (lea=1) and ABA League 2 (lea=2) game data from the leagues'' own
    PHP sites. Keyless, no bot wall; robots.txt on www is ''User-agent: *'' with no Disallow line, druga
    has none (404). Match pages, calendars, standings and player pages are server-rendered HTML (x-parsed-schema
    gives the record capture.py parses); the shot chart and the minute-by-minute score are JSON served
    as text/html. Box scores from 2001-02, play-by-play and shots from 2017-18. Seasons are keyed by sez
    = START year - 2000 (sdv END year = 2000 + sez + 1); game numbers restart per (sez, lea); team and
    player ids are global. Shapes from captures of 2026-10-12; x-unobserved = null in every sample; x-absent-in-some-rows
    = the key is missing from some records. Not official or supported.'
  title: ABA League sites (aba-liga.com, druga.aba-liga.com)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /calendar/{sez}/{lea}/:
    get:
      description: 'One season''s full schedule and results of one league: every round and game. Server-rendered
        HTML, parsed by capture.py into the JSON record of x-parsed-schema (English keys). Keyless. Parsing
        rule: select#season (selected option = the request); each .panel: h4.panel-title (round) and table.league_calendar_table
        (Game | Result | Date and Time | Info [| Group]); the game link /match/{gameNo}/{sez}/{lea}/Overview/....'
      operationId: get_aba_calendar
      parameters:
      - description: 'Season key: season START year - 2000 (25 = 2025-26, 8 = 2008-09). sdv season (END
          year) = 2000 + sez + 1. Verified by diffing seasons: /calendar/25/1/ selects ''Season 2025/26''
          and /calendar/8/1/ ''Season 2008/09''; an unknown sez (99) serves a page with no selected season
          and no games (refused).'
        example: 25
        in: path
        name: sez
        required: true
        schema:
          type: integer
      - description: 'League code: 1 = ABA League, 2 = ABA League 2 (also 3 = Supercup, 7 = U19, 8 = qualifiers;
          those are not sampled). Either host serves either league (same database; verified on game 1
          of 2025-26 for lea 1 and 2 on both hosts); the capture uses www for 1 and druga for 2.'
        example: 1
        in: path
        name: lea
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
              x-parsed-schema:
                parser: aba-liga/tools/capture.py parse_calendar
                rule: 'select#season (selected option = the request); each .panel: h4.panel-title (round)
                  and table.league_calendar_table (Game | Result | Date and Time | Info [| Group]); the
                  game link /match/{gameNo}/{sez}/{lea}/Overview/...'
                schema:
                  $ref: '#/components/schemas/AbaCalendar'
          description: text/html; charset=UTF-8 (see x-parsed-schema / x-body-format)
      security: []
      summary: 'One season''s full schedule and results of one league: every round and game'
  /live-match/rezultati-1718/create_json.php:
    get:
      description: One game's score after every minute (the Result Graph; 2017-18 onward). JSON served
        as text/html (parse the body as JSON). Keyless. minuta is an integer while the scores are strings.
        An UNKNOWN id answers whitespace only (not JSON; refused), and 2016-17 and earlier the same.
      operationId: get_aba_flow
      parameters:
      - description: 'Game number, as {gameNo} of the match page. Game number (key space: per season AND
          league: it restarts at 1 for every (sez, lea), so a game''s key is (game_no, sez, lea); ABA
          2025-26 runs 1..251 with gaps for unplayed playoff games). The {gameNo} of /match/ and the id=
          of the live-match helpers.'
        example: 6
        in: query
        name: id
        required: true
        schema:
          type: integer
      - description: 'Season key: season START year - 2000 (25 = 2025-26, 8 = 2008-09). sdv season (END
          year) = 2000 + sez + 1. Verified by diffing seasons: /calendar/25/1/ selects ''Season 2025/26''
          and /calendar/8/1/ ''Season 2008/09''; an unknown sez (99) serves a page with no selected season
          and no games (refused).'
        example: 25
        in: query
        name: sez
        required: true
        schema:
          type: integer
      - description: 'League code: 1 = ABA League, 2 = ABA League 2 (also 3 = Supercup, 7 = U19, 8 = qualifiers;
          those are not sampled). Either host serves either league (same database; verified on game 1
          of 2025-26 for lea 1 and 2 on both hosts); the capture uses www for 1 and druga for 2.'
        example: 1
        in: query
        name: lea
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/AbaScoreFlow'
              x-body-format: json
              x-scope: Checked against the same game's parsed match page (minutes, final score).
          description: text/html; charset=UTF-8 (see x-parsed-schema / x-body-format)
      security: []
      summary: One game's score after every minute (the Result Graph; 2017-18 onward)
  /live-match/rezultati-1718/create_scoredifference.php:
    get:
      description: 'Same minute-by-minute score as create_json.php (the Score difference chart). JSON
        served as text/html (parse the body as JSON). Keyless. For a played game: the same rows as create_json.php.
        For an UNKNOWN or unplayed id it answers a 40-row placeholder (minutes 0..39, scores the INTEGER
        0) instead of nothing: the capture refuses it (minute count and final score).'
      operationId: get_aba_scorediff
      parameters:
      - description: 'Game number, as {gameNo} of the match page. Game number (key space: per season AND
          league: it restarts at 1 for every (sez, lea), so a game''s key is (game_no, sez, lea); ABA
          2025-26 runs 1..251 with gaps for unplayed playoff games). The {gameNo} of /match/ and the id=
          of the live-match helpers.'
        example: 6
        in: query
        name: id
        required: true
        schema:
          type: integer
      - description: 'Season key: season START year - 2000 (25 = 2025-26, 8 = 2008-09). sdv season (END
          year) = 2000 + sez + 1. Verified by diffing seasons: /calendar/25/1/ selects ''Season 2025/26''
          and /calendar/8/1/ ''Season 2008/09''; an unknown sez (99) serves a page with no selected season
          and no games (refused).'
        example: 25
        in: query
        name: sez
        required: true
        schema:
          type: integer
      - description: 'League code: 1 = ABA League, 2 = ABA League 2 (also 3 = Supercup, 7 = U19, 8 = qualifiers;
          those are not sampled). Either host serves either league (same database; verified on game 1
          of 2025-26 for lea 1 and 2 on both hosts); the capture uses www for 1 and druga for 2.'
        example: 1
        in: query
        name: lea
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/AbaScoreDifference'
              x-body-format: json
              x-scope: Checked against the same game's parsed match page (minutes, final score).
          description: text/html; charset=UTF-8 (see x-parsed-schema / x-body-format)
      security: []
      summary: Same minute-by-minute score as create_json.php (the Score difference chart)
  /live-match/rezultati-1718/create_shooting_chart.php:
    get:
      description: 'One game''s shot chart: every field-goal attempt with x/y (2017-18 onward). JSON served
        as text/html (parse the body as JSON). Keyless. 2016-17 and earlier answer `[]` plus blank lines
        (refused). An unknown id answers the same.'
      operationId: get_aba_shots
      parameters:
      - description: 'Game number, as {gameNo} of the match page. Game number (key space: per season AND
          league: it restarts at 1 for every (sez, lea), so a game''s key is (game_no, sez, lea); ABA
          2025-26 runs 1..251 with gaps for unplayed playoff games). The {gameNo} of /match/ and the id=
          of the live-match helpers.'
        example: 6
        in: query
        name: id
        required: true
        schema:
          type: integer
