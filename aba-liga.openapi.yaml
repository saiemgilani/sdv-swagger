          type: array
        sez:
          description: 'Season key: season START year - 2000 (25 = 2025-26, 8 = 2008-09). sdv season (END
            year) = 2000 + sez + 1. The request''s season, echoed by the selected season option.'
          type: integer
        team_id:
          description: 'ABA team id (key space: aba-liga.com clubs, the same id in every season and in
            both leagues, e.g. Partizan = 22 in 2008-09 and 2025-26, Krka = 10). The first number of /team/{id}/{sez}/{lea}/0/{slug}/
            and of the logo images/club/{size}/{id}.png. Joins match game.*_team_id / players / teams
