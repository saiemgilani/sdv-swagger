        birth_date:
          description: Date of birth, ISO 'YYYY-MM-DD' (public player bio).
          type: string
        birth_place:
          description: Place of birth as printed, 'City, COUNTRY' ('Cincinnati, USA').
          type: string
        career:
          description: 'The ''Clubs'' box, one free-text line per stint, oldest first: ''<seasons> - <club>''
