info:
  description: 'Reverse-engineered from committed captures in f1/captures/. Keyless. Rate limit: 4 req/s
    burst, 500 requests/hour sustained, unauthenticated. Data: CC BY-NC-SA 4.0 (non-commercial, share-alike)
    -- wrap-only, never republished as release assets. Not official or supported.'
  title: Jolpica F1 API (Ergast-compatible)
  version: '1'
openapi: 3.1.0
paths:
  /circuits.json:
    get:
      description: 'Ergast `MRData` envelope with `CircuitTable`; rows at `CircuitTable.Circuits[]`. The
        path is case-insensitive (the host lowercases it); `.json` may be replaced by `?format=json`.
        Rate limit: 4 req/s burst, 500 requests/hour sustained, unauthenticated. Data: CC BY-NC-SA 4.0
        (non-commercial, share-alike) -- wrap-only, never republished as release assets.'
      operationId: circuits
      parameters:
      - description: Page size. Default 30, maximum 100 (a larger value is clamped to 100 and echoed in
          `MRData.limit`).
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: Rows to skip (paging on the innermost rows counted by `MRData.total`). Default 0.
        in: query
        name: offset
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  MRData:
                    allOf:
                    - $ref: '#/components/schemas/MRData'
                    - properties:
                        CircuitTable:
                          $ref: '#/components/schemas/Circuits'
                      type: object
                required:
                - MRData
                type: object
          description: OK
      summary: All circuits
  /drivers/{driverId}.json:
    get:
      description: 'Ergast `MRData` envelope with `DriverTable`; rows at `DriverTable.Drivers[]`. The
        path is case-insensitive (the host lowercases it); `.json` may be replaced by `?format=json`.
        Rate limit: 4 req/s burst, 500 requests/hour sustained, unauthenticated. Data: CC BY-NC-SA 4.0
        (non-commercial, share-alike) -- wrap-only, never republished as release assets.'
      operationId: drivers_driverId
      parameters:
      - description: Ergast driver id, e.g. `max_verstappen`.
        in: path
        name: driverId
        required: true
        schema:
          type: string
      - description: Page size. Default 30, maximum 100 (a larger value is clamped to 100 and echoed in
          `MRData.limit`).
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: Rows to skip (paging on the innermost rows counted by `MRData.total`). Default 0.
        in: query
        name: offset
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  MRData:
                    allOf:
                    - $ref: '#/components/schemas/MRData'
                    - properties:
                        DriverTable:
                          $ref: '#/components/schemas/Driver'
                      type: object
                required:
                - MRData
                type: object
          description: OK
      summary: One driver by id
  /seasons.json:
    get:
      description: 'Ergast `MRData` envelope with `SeasonTable`; rows at `SeasonTable.Seasons[]`. The
        path is case-insensitive (the host lowercases it); `.json` may be replaced by `?format=json`.
        Rate limit: 4 req/s burst, 500 requests/hour sustained, unauthenticated. Data: CC BY-NC-SA 4.0
        (non-commercial, share-alike) -- wrap-only, never republished as release assets.'
      operationId: seasons
      parameters:
      - description: Page size. Default 30, maximum 100 (a larger value is clamped to 100 and echoed in
          `MRData.limit`).
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: Rows to skip (paging on the innermost rows counted by `MRData.total`). Default 0.
        in: query
        name: offset
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  MRData:
                    allOf:
                    - $ref: '#/components/schemas/MRData'
                    - properties:
                        SeasonTable:
                          $ref: '#/components/schemas/Seasons'
                      type: object
                required:
                - MRData
                type: object
          description: OK
      summary: All championship seasons
  /status.json:
    get:
      description: 'Ergast `MRData` envelope with `StatusTable`; rows at `StatusTable.Status[]`. The path
        is case-insensitive (the host lowercases it); `.json` may be replaced by `?format=json`. Rate
        limit: 4 req/s burst, 500 requests/hour sustained, unauthenticated. Data: CC BY-NC-SA 4.0 (non-commercial,
        share-alike) -- wrap-only, never republished as release assets.'
      operationId: status
      parameters:
      - description: Page size. Default 30, maximum 100 (a larger value is clamped to 100 and echoed in
