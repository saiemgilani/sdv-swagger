      summary: Finishing-status vocabulary with all-time counts
  /{season}.json:
    get:
      description: 'Ergast `MRData` envelope with `RaceTable`; rows at `RaceTable.Races[]`. The path is
        case-insensitive (the host lowercases it); `.json` may be replaced by `?format=json`. Rate limit:
