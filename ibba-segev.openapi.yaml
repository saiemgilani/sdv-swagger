                        Second_Chance_Pts:
                          description: 'Away team: Second-chance points (2026-27 key).'
                          type: string
                        Second_chance_points:
                          description: 'Away team: Second-chance points (2025-26 key).'
                          type: string
                        Time_Leading:
                          description: 'Away team: Time this team led, ''mm:ss''.'
                          type: string
                        Times_Tied:
                          description: 'Away team: Times tied (2026-27 key; ''0'' in the one sample, where
                            TimesTied is also 0).'
                          type: string
                        bench_points:
                          description: 'Away team: Points scored by the bench.'
                          type: string
                        starting_points:
                          description: 'Away team: Points scored by the starters.'
                          type: string
