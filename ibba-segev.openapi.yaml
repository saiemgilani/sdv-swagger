components:
  schemas:
    GetActionsResponse:
      properties:
        error:
          description: Null in every sample (all are successes). On failure an object {code, message}
            (e.g. '-32000' game not found, '-33000' method not found), which the capture refuses.
          x-unobserved: true
        id:
          description: 'JSON-RPC response id, not a data key space: ''42'' on every success (''1'' on
            errors).'
          type: string
        jsonrpc:
          description: JSON-RPC version, '2.0'.
          type: string
        result:
          description: The method's payload.
          properties:
            actions:
              description: Play-by-play actions in game order (each committed file holds one action type).
              items:
                properties:
                  id:
                    description: 'Action id (Segev action key space: integer, unique within the game and
                      increasing in game order: 500001... for game 50).'
                    type: integer
                  parameters:
                    description: Type-specific fields (which keys appear depends on `type`).
                    properties:
                      coordX:
                        description: 'Shot x: across the court, sideline to sideline, 0-1470, basket at
                          ~735. See the frame note; metric scale unverified.'
                        type: number
                      coordY:
                        description: 'Shot y: distance out from the baseline, rim at ~112-140, deepest
                          observed 1176. See the frame note; metric scale unverified.'
                        type: number
                      currentQuarter:
                        description: Period of the clock tick (clock actions).
                        type: integer
                      currentQuarterTime:
                        description: Game clock 'mm:ss' at the tick (clock actions).
                        type: string
                      fastBreak:
                        description: true when the shot or free throw came on a fast break.
                        type: boolean
                      fouledOn:
                        description: Jersey number (string) of the fouled player.
                        type:
                        - string
                        - 'null'
                      freeThrowNumber:
                        description: Which free throw of the set (1, 2, 3).
                        type: integer
                      freeThrows:
                        description: 'Free throws the foul awards: a STRING when non-zero (''1''), the
                          integer 0 otherwise.'
                        type:
                        - integer
                        - string
                      freeThrowsAwarded:
                        description: Free throws in the set.
                        type: integer
                      isCoachFoul:
                        description: 1 on a foul charged to the coach or bench (player null, playerId
                          0); absent otherwise.
                        type: integer
                      kind:
                        description: 'Foul kind: ''shooting'' or ''offensive''; absent on some fouls.
                          ''shooting'' also appears on technical and offensive-unsportsmanlike fouls,
                          so it does not prove a shooting foul.'
                        type: string
                      made:
                        description: 'Shot or free-throw result: ''made'', ''missed'' or ''blocked'' (shots
                          only).'
                        type: string
                      player:
                        description: Jersey number of the acting player as a string (not an id); null
                          when none (team rebound, timeout).
                        type:
                        - string
                        - 'null'
                      playerIn:
                        description: 'Substitution: jersey number (string) of the player coming in; null
                          when the row records the player going out.'
                        type:
                        - string
                        - 'null'
                      playerOut:
                        description: 'Substitution: jersey number (string) of the player going out; null
                          when the row records the player coming in.'
                        type:
                        - string
                        - 'null'
                      points:
                        description: 'Shot value: 2 or 3.'
                        type: integer
                      pointsFromTurnover:
                        description: true when the attempt came off an opponent turnover.
                        type: boolean
                      quarter:
                        description: Period that starts or ends (quarter actions).
                        type: integer
                      secondChancePoints:
                        description: true when the attempt was a second-chance attempt (after an offensive
                          rebound).
                        type: boolean
                      team:
                        description: '1 = home, 2 = away (verified: game 50''s team-1 shots equal its
                          home FGA); null on game, quarter and clock actions.'
                        type:
                        - integer
                        - 'null'
                      type:
                        description: 'Subtype; its vocabulary depends on `type` (code table in ibba-returns.md):
                          shot type, rebound side, turnover kind, foul type, start/end of game or quarter.'
                        type: string
                    type: object
                  parentActionId:
                    description: Id of the action this one follows from (rebound -> missed shot, steal
                      -> turnover, assist/block -> shot); 0 = none.
                    type: integer
                  playerId:
                    description: Segev player id (integer; 0 when no player).
                    type: integer
                  quarter:
                    description: Period of the action (1-4 in the samples).
                    type: integer
                  quarterTime:
                    description: Game clock remaining in the period, 'mm:ss', counting down from '10:00'.
                    type: string
                  score:
                    description: Running score 'away-home' after the action (game 50's first home basket
                      reads '0-2'). Present only on scoring actions (absent otherwise).
                    type: string
                  teamId:
                    description: Segev team id (integer; 0 when no team).
                    type: integer
                  totalPlayerPoints:
                    description: The scorer's running points, string. Present only on scoring actions.
                    type: string
                  type:
                    description: 'Action type (code table in ibba-returns.md): game, quarter, clock, substitution,
                      shot, freeThrow, rebound, assist, steal, turnover, block, deflection, foul, foul-drawn,
                      timeout.'
                    type: string
                  userTime:
                    description: 'Wall-clock time the scorer logged the action, ''HH:MM:SS'', UTC (inferred:
                      game 50 tipped at 18:40 Israel time = 15:40 UTC, its first clock tick is 15:42:04).'
                    type: string
                type: object
              type: array
            gameInfo:
              description: Game header.
              properties:
                apiId:
                  description: External game id; empty in every sample.
                  type: string
                awayTeam:
                  description: Away team.
                  properties:
                    Score:
                      description: 'Away team: Always 0 in every sample (not filled here: use getBoxScore
                        homeScore / awayScore).'
                      type: integer
                    apiId:
                      description: 'Away team: External team id: null in every sample, so its type is
                        unconfirmed.'
                      x-unobserved: true
                    id:
                      description: 'Away team: Segev team id as a string (Segev team key space, stable
                        across seasons and competitions: Maccabi Tel Aviv = 2 in 2025-26 and 2026-27).
                        Not an IBBA id. = getBoxScore homeTeamId / awayTeamId; actions carry it as `teamId`
                        (integer).'
                      type: string
                    name:
                      description: 'Away team: Team name, English, upper case; some women''s teams end
                        in '' (W)'' (not all: use competition.name).'
                      type: string
                    nameLocal:
                      description: 'Away team: Team name, Hebrew (Latin sponsor words kept).'
                      type: string
                    players:
                      description: 'Away team: The team''s game roster.'
                      items:
                        properties:
                          apiId:
                            description: 'Away team: External player id: either empty or equal to `id`
                              (both occur within one game); its source is unverified.'
                            type: string
                          firstName:
                            description: 'Away team: First name, English, upper case.'
                            type: string
                          firstNameLocal:
                            description: 'Away team: First name, Hebrew.'
                            type: string
                          id:
                            description: 'Away team: Segev player id as a string (Segev player key space,
                              stable across seasons: Jaylen Hoard = 1000 in games 50 and 419, the cross-season
                              player key IBBA lacks; = getBoxScore playerId; actions `playerId` as an
                              integer). Not an IBBA id.'
                            type: string
                          inRoster:
                            description: 'Away team: 0 or 2 in the samples; meaning unverified.'
                            type: integer
                          jerseyNumber:
                            description: 'Away team: Jersey number (integer).'
                            type: integer
                          lastName:
                            description: 'Away team: Last name, English, upper case.'
                            type: string
                          lastNameLocal:
                            description: 'Away team: Last name, Hebrew.'
                            type: string
                        type: object
                      type: array
                    shortName:
                      description: 'Away team: Short team name, English, upper case.'
                      type: string
                    shortNameLocal:
                      description: 'Away team: Short team name, Hebrew.'
                      type: string
                  type: object
                competition:
                  description: The competition.
                  properties:
                    name:
                      description: 'Competition name (''Winner League'', ''Women'', ...; code table in
                        ibba-returns.md). The reliable men''s/women''s discriminator: the Segev id space
                        mixes every competition.'
                      type: string
                  type: object
                currentQuarter:
                  description: Current period (the last one when finished).
                  type: integer
                currentQuarterTime:
                  description: Game clock remaining in the current period.
                  properties:
                    m:
                      description: Minutes remaining.
                      type: integer
                    s:
                      description: Seconds remaining.
                      type: integer
                  type: object
                gameFinished:
                  description: true once the game is final (the capture banks only finished games).
                  type: boolean
                gameId:
                  description: Segev game id as a string (= IBBA Games `ExternalID`; the `game_id` param).
                  type: string
                homeTeam:
                  description: Home team.
                  properties:
                    Score:
                      description: 'Home team: Always 0 in every sample (not filled here: use getBoxScore
                        homeScore / awayScore).'
                      type: integer
                    apiId:
                      description: 'Home team: External team id: null in every sample, so its type is
                        unconfirmed.'
                      x-unobserved: true
                    id:
                      description: 'Home team: Segev team id as a string (Segev team key space, stable
                        across seasons and competitions: Maccabi Tel Aviv = 2 in 2025-26 and 2026-27).
                        Not an IBBA id. = getBoxScore homeTeamId / awayTeamId; actions carry it as `teamId`
                        (integer).'
                      type: string
                    name:
                      description: 'Home team: Team name, English, upper case; some women''s teams end
                        in '' (W)'' (not all: use competition.name).'
                      type: string
                    nameLocal:
                      description: 'Home team: Team name, Hebrew (Latin sponsor words kept).'
                      type: string
                    players:
                      description: 'Home team: The team''s game roster.'
                      items:
                        properties:
                          apiId:
                            description: 'Home team: External player id: either empty or equal to `id`
                              (both occur within one game); its source is unverified.'
                            type: string
                          firstName:
                            description: 'Home team: First name, English, upper case.'
                            type: string
                          firstNameLocal:
                            description: 'Home team: First name, Hebrew.'
                            type: string
                          id:
                            description: 'Home team: Segev player id as a string (Segev player key space,
                              stable across seasons: Jaylen Hoard = 1000 in games 50 and 419, the cross-season
                              player key IBBA lacks; = getBoxScore playerId; actions `playerId` as an
                              integer). Not an IBBA id.'
                            type: string
                          inRoster:
                            description: 'Home team: 0 or 2 in the samples; meaning unverified.'
                            type: integer
                          jerseyNumber:
                            description: 'Home team: Jersey number (integer).'
                            type: integer
                          lastName:
                            description: 'Home team: Last name, English, upper case.'
                            type: string
                          lastNameLocal:
                            description: 'Home team: Last name, Hebrew.'
                            type: string
                        type: object
                      type: array
                    shortName:
                      description: 'Home team: Short team name, English, upper case.'
                      type: string
                    shortNameLocal:
                      description: 'Home team: Short team name, Hebrew.'
                      type: string
                  type: object
                id:
                  description: Segev game id as an integer.
                  type: integer
                numberOfQuarters:
                  description: Regulation periods (4).
                  type: integer
                time:
                  description: Scheduled tip-off, local Israel time, ISO 8601 without an offset ('2025-10-12T18:40:00').
                  type: string
              type: object
            success:
              description: true on success.
              type: boolean
          type: object
      type: object
    GetBoxScoreResponse:
      properties:
        error:
          description: Null in every sample (all are successes). On failure an object {code, message}
            (e.g. '-32000' game not found, '-33000' method not found), which the capture refuses.
          x-unobserved: true
        id:
          description: 'JSON-RPC response id, not a data key space: ''42'' on every success (''1'' on
            errors).'
          type: string
        jsonrpc:
          description: JSON-RPC version, '2.0'.
          type: string
        result:
          description: The method's payload.
          properties:
            boxscore:
              description: The box score.
              properties:
                awayTeam:
                  description: 'Away team: player lines, team-credited actions, team totals.'
                  properties:
                    players:
                      description: Away team player lines.
                      items:
                        properties:
                          and_one:
                            description: 'Player: And-one plays (a made basket plus a foul). Inferred.'
                            type: string
                          ast:
                            description: 'Player: Assists.'
                            type: string
                          blk:
                            description: 'Player: Shots blocked (blocks made).'
                            type: string
                          blk_against:
                            description: 'Player: Own shots that were blocked.'
                            type: string
                          dfl:
                            description: 'Player: Deflections (count of deflection actions).'
                            type: string
                          dunk:
                            description: 'Player: Dunks made.'
                            type: string
                          f:
                            description: 'Player: Fouls committed (= IBBA fouls_for).'
                            type: string
                          f_drawn:
                            description: 'Player: Fouls drawn (= IBBA fouls_against).'
                            type: string
                          fb:
                            description: 'Player: Fast-break points (the team total equals P of the same
                              side''s gameStats ''P of N'' fast-break stat: verified home and away in
                              games 50, 300, 419).'
                            type: string
                          fd_off:
                            description: 'Player: Offensive fouls drawn (charges taken). Inferred.'
                            type: string
                          fg_2m:
                            description: 'Player: 2-point field goals made.'
                            type: string
                          fg_2mis:
                            description: 'Player: 2-point field goals MISSED (not attempted: attempts
                              = fg_2m + fg_2mis, verified against IBBA p22).'
                            type: string
                          fg_3m:
                            description: 'Player: 3-point field goals made.'
                            type: string
                          fg_3mis:
                            description: 'Player: 3-point field goals MISSED.'
                            type: string
                          ft_m:
                            description: 'Player: Free throws made.'
                            type: string
                          ft_mis:
                            description: 'Player: Free throws MISSED.'
                            type: string
                          jerseyNumber:
                            description: 'Player: Jersey number as a string.'
                            type: string
                          minutes:
                            description: 'Player: Minutes played ''mm:ss''.'
                            type: string
                          onCourt:
                            description: 'Player: true when the player was on court when the box was last
                              updated (the final buzzer for a finished game). Inferred.'
                            type: boolean
                          playerId:
                            description: 'Player: Segev player id as a string (Segev player key space,
                              stable across seasons; = getGameInfo players[].id; actions carry it as an
                              integer).'
                            type: string
                          plusMinus:
                            description: 'Player: Plus-minus, string.'
                            type: string
                          points:
                            description: 'Player: Points.'
                            type: string
                          rate:
                            description: 'Player: Efficiency rating (= IBBA VAL).'
                            type: string
                          reb_d:
                            description: 'Player: Defensive rebounds.'
                            type: string
                          reb_o:
                            description: 'Player: Offensive rebounds.'
                            type: string
                          rec:
                            description: 'Player: Unverified; likely loose-ball recoveries.'
                            type: string
                          sc:
                            description: 'Player: Second-chance points (the team total equals the same
                              side''s gameStats second-chance stat: verified home and away in games 50,
                              300, 419).'
                            type: string
                          starter:
                            description: 'Player: true when the player started.'
                            type: boolean
                          stl:
                            description: 'Player: Steals.'
                            type: string
                          to:
                            description: 'Player: Turnovers.'
                            type: string
                          vps:
                            description: 'Player: A ratio with 2 decimals (''1.58''); its definition is
                              UNVERIFIED (it matches neither points per shot nor rate per minute).'
                            type: string
                        type: object
                      type: array
                    teamActions:
                      description: 'Away team: actions credited to the team, not a player (team rebounds,
                        team turnovers, bench technicals).'
                      properties:
                        and_one:
                          description: 'Team-credited: And-one plays (a made basket plus a foul). Inferred.'
                          type: string
                        ast:
                          description: 'Team-credited: Assists.'
                          type: string
                        blk:
                          description: 'Team-credited: Shots blocked (blocks made).'
                          type: string
                        blk_against:
                          description: 'Team-credited: Own shots that were blocked.'
                          type: string
                        dfl:
                          description: 'Team-credited: Deflections (count of deflection actions).'
                          type: string
                        dunk:
                          description: 'Team-credited: Dunks made.'
                          type: string
                        f:
                          description: 'Team-credited: Fouls committed (= IBBA fouls_for).'
                          type: string
                        f_drawn:
                          description: 'Team-credited: Fouls drawn (= IBBA fouls_against).'
                          type: string
                        fb:
                          description: 'Team-credited: Fast-break points (the team total equals P of the
                            same side''s gameStats ''P of N'' fast-break stat: verified home and away
                            in games 50, 300, 419).'
                          type: string
                        fd_off:
                          description: 'Team-credited: Offensive fouls drawn (charges taken). Inferred.'
                          type: string
                        fg_2m:
                          description: 'Team-credited: 2-point field goals made.'
                          type: string
                        fg_2mis:
                          description: 'Team-credited: 2-point field goals MISSED (not attempted: attempts
                            = fg_2m + fg_2mis, verified against IBBA p22).'
                          type: string
                        fg_3m:
                          description: 'Team-credited: 3-point field goals made.'
                          type: string
                        fg_3mis:
                          description: 'Team-credited: 3-point field goals MISSED.'
                          type: string
                        ft_m:
                          description: 'Team-credited: Free throws made.'
                          type: string
                        ft_mis:
                          description: 'Team-credited: Free throws MISSED.'
                          type: string
                        points:
                          description: 'Team-credited: Points.'
                          type: string
                        rate:
                          description: 'Team-credited: Efficiency rating (= IBBA VAL).'
                          type: string
                        reb_d:
                          description: 'Team-credited: Defensive rebounds.'
                          type: string
                        reb_o:
                          description: 'Team-credited: Offensive rebounds.'
                          type: string
                        rec:
                          description: 'Team-credited: Unverified; likely loose-ball recoveries.'
                          type: string
                        sc:
                          description: 'Team-credited: Second-chance points (the team total equals the
                            same side''s gameStats second-chance stat: verified home and away in games
                            50, 300, 419).'
                          type: string
                        stl:
                          description: 'Team-credited: Steals.'
                          type: string
                        to:
                          description: 'Team-credited: Turnovers.'
                          type: string
                        vps:
                          description: 'Team-credited: A ratio with 2 decimals (''1.58''); its definition
                            is UNVERIFIED (it matches neither points per shot nor rate per minute).'
                          type: string
                      type: object
                    teamActionsTotal:
                      description: Away team totals (players + teamActions) and lead/tie counters.
                      properties:
                        BLead:
                          description: Biggest lead in points.
                          type: string
                        LeadChange:
                          description: Lead changes (same value for both teams).
                          type: string
                        TimeLeading:
                          description: Time this team led, 'mm:ss'.
                          type: string
                        TimesTied:
                          description: Times the score was tied (same value for both teams).
                          type: string
                        and_one:
                          description: 'Team total: And-one plays (a made basket plus a foul). Inferred.'
                          type: string
                        ast:
                          description: 'Team total: Assists.'
                          type: string
                        blk:
                          description: 'Team total: Shots blocked (blocks made).'
