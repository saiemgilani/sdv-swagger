                          type: string
                        Pts_Of_Total_LS_Possessions:
                          description: 'Away team: ''P of N'': P points from N ''LS'' possessions (2026-27
                            key). LS is not expanded by the source; unverified.'
                          type: string
                        Pts_of_total_FBs:
                          description: 'Away team: ''P of N'': P fast-break points (= teamActionsTotal
