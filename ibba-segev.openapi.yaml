info:
  description: 'Reverse-engineered, unofficial; keyless. Live-stats vendor behind basket.co.il game pages
    from 2025-26: Winner League, Winner Cup, women''s league, Leumit, youth, school, pre-season. Segev
    shot frame (one half court; both teams'' shots are drawn toward the same basket): x runs across the
    court from one sideline to the other, 0 to 1470, basket at x ~= 735 (WHICH sideline is x = 0 is UNVERIFIED);
    y runs from the baseline out toward midcourt, the rim at y ~= 112-140 (every dunk in the samples sits
    at x 630-780, y 112-140), deepest observed y = 1176. Every value is a multiple of 15 (x) or 28 (y),
    i.e. grid steps of 15 and 28 units, as floats with rounding noise (134.99999999999994). The steps
    equal the court''s width (15 m) and length (28 m), so x/15 and y/28 may be percent of width and length
    (the rim at y 112-140 = 4-5% of 28 m = 1.1-1.4 m from the baseline; the real rim centre is 1.575 m):
    a hypothesis, the metric scale is UNVERIFIED. The same frame holds in 2025-26 (games 50, 300) and
    2026-27 (game 419).'
  title: Segev Stats real-time stats JSON-RPC (Israeli basketball)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /api/:
    get:
      description: 'JSON-RPC over GET. getGameInfo: Game header: time, competition, both rosters (Segev
        player ids, names in English and Hebrew) | getBoxScore: Box score: per-player and team lines,
        quarter scores and fouls, team game stats | getActions: Play-by-play actions with shot coordinates,
        plus the game header. `game_id` = IBBA Games `ExternalID` (2025-26 onward; the id space mixes
        every competition, men''s and women''s: read competition.name). Errors are HTTP 200 with an error
        envelope.'
      operationId: segevApi
      parameters:
      - description: The RPC method; the response schema follows it (x-response-by-method).
        example: getActions
        in: query
        name: method
        required: true
        schema:
          enum:
          - getGameInfo
          - getBoxScore
          - getActions
          type: string
      - description: Segev game id (= IBBA Games ExternalID).
        example: 50
        in: query
        name: game_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                oneOf:
                - $ref: '#/components/schemas/GetGameInfoResponse'
                - $ref: '#/components/schemas/GetBoxScoreResponse'
                - $ref: '#/components/schemas/GetActionsResponse'
                - $ref: '#/components/schemas/RpcError'
