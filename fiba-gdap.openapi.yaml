  /getgdapcompetitionsbyseasonsandcompetitionmarketingname:
    get:
      description: 'Samples: `gdap__getgdapcompetitionsbyseasonsandcompetitionmarketingname__world-cup-1950-2027.json`,
        `gdap__getgdapcompetitionsbyseasonsandcompetitionmarketingname__bcl-2025.json`.'
      operationId: getgdapcompetitionsbyseasonsandcompetitionmarketingname
      parameters:
      - description: 'Competition family id (competitionMarketingName.competitionMarketingNameId): 201
          = World Cup, 112 = BCL tier 1, 211 = EuroLeague Women. Also the <histId> of /en/history/ pages'
        example: 201
