info:
  description: 'Azure API Management front of FIBA''s GDAP data platform, as called by the fiba.basketball
    and championsleague.basketball Next.js sites. GET only, JSON. Every call needs the `Ocp-Apim-Subscription-Key`
    header; the key is public, shipped in every page as NEXT_CLIENT_APIM_SUBSCRIPTION_KEY (`898cd5e7389140028ecb42943c47eb74`
    on 2026-10-12; read it from the page at run time). No Referer/Origin gate, no rate limit seen at 1
    request/s. Covers every FIBA national-team event back to 1950 and FIBA''s club competitions (BCL,
    FIBA Europe Cup, BCL Americas/Asia, EuroLeague Women, EuroCup Women). Box scores and play-by-play
    are not here: see fiba-gamepage.openapi.yaml. Shapes from committed captures in fiba/captures/; contact
    fields are redacted there. Terms: see fiba/README.md (owner ruling 2026-10-12). Not official or supported.'
  title: FIBA digital API (GDAP, digital-api.fiba.basketball/hapi)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /getGdapCompetitionById:
    get:
      description: 'Samples: `gdap__getGdapCompetitionById__wc2023.json`, `gdap__getGdapCompetitionById__wc1994.json`.'
      operationId: getGdapCompetitionById
      parameters:
      - description: 'FIBA competition id (GDAP key space): competition.competitionId of any game row,
          e.g. 208182 = World Cup 2023'
        example: 208182
        in: query
        name: gdapCompetitionId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGdapCompetitionById'
          description: OK. An unknown id answers 200 with {} or [] (never banked).
        '401':
          description: 'Missing or wrong subscription key: {statusCode, message}'
        '500':
          description: A required parameter is missing (empty body)
      summary: 'One competition: season, dates, hosts, zone, category, marketing-name family'
  /getcustomgateway:
    get:
      description: 'Samples: `gdap__getcustomgateway__federationRanking-men-world.json`, `gdap__getcustomgateway__competitionIdsBetweenTwoDates-2025-01-14.json`.'
      operationId: getcustomgateway
      parameters:
      - description: 'Gateway function: federationRanking or competitionIdsBetweenTwoDates (the two the
          site calls)'
        example: federationRanking
        in: query
        name: fibaFunction
        required: true
        schema:
          enum:
          - competitionIdsBetweenTwoDates
          - federationRanking
          type: string
      - description: 'federationRanking: men or women (= gdapCategory)'
        example: men
        in: query
        name: gender
        required: false
        schema:
          type: string
      - description: 'federationRanking: ranking zone id (= zoneRankingId)'
        example: 1
        in: query
        name: zoneId
        required: false
        schema:
          type: integer
      - description: 'Ranking as of this date, ISO 8601: the latest ranking published on or before it
          (2026-03-10 answers the 2026-03-03 ranking). Omitted = the latest ranking'
        example: '2025-09-15'
        in: query
        name: asOfDate
        required: false
        schema:
          type: string
      - description: 'competitionIdsBetweenTwoDates: window start, ISO 8601'
        example: '2025-01-14T00:00:00.000Z'
        in: query
        name: startDate
        required: false
        schema:
          type: string
      - description: 'competitionIdsBetweenTwoDates: window end, ISO 8601'
        example: '2025-01-16T00:00:00.000Z'
        in: query
        name: endDate
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/GetcustomgatewayFederationRanking'
                - $ref: '#/components/schemas/GetcustomgatewayCompetitionIdsBetweenTwoDates'
          description: OK. An unknown id answers 200 with {} or [] (never banked).
        '401':
          description: 'Missing or wrong subscription key: {statusCode, message}'
        '500':
          description: A required parameter is missing (empty body)
      summary: Server-side gateway functions (federationRanking with climbers/fallers; competitionIdsBetweenTwoDates)
  /getgdapcompetitionawardsbyid:
    get:
      description: 'Samples: `gdap__getgdapcompetitionawardsbyid__wc2023.json`.'
      operationId: getgdapcompetitionawardsbyid
      parameters:
      - description: 'FIBA competition id (GDAP key space): competition.competitionId of any game row,
          e.g. 208182 = World Cup 2023'
        example: 208182
        in: query
        name: gdapCompetitionId
        required: true
        schema:
          type: integer
      - description: Optional; the site passes its discipline format. 5x5 answers the same as omitting
          it (verified on awards and rosters)
        in: query
        name: disciplineFormat
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Getgdapcompetitionawardsbyid'
          description: OK. An unknown id answers 200 with {} or [] (never banked).
        '401':
          description: 'Missing or wrong subscription key: {statusCode, message}'
        '500':
          description: A required parameter is missing (empty body)
      summary: Awards (MVP, All-Star Five, ...)
  /getgdapcompetitionfinalstandingbycompetitionid:
    get:
      description: 'Samples: `gdap__getgdapcompetitionfinalstandingbycompetitionid__wc2023.json`.'
      operationId: getgdapcompetitionfinalstandingbycompetitionid
      parameters:
      - description: 'FIBA competition id (GDAP key space): competition.competitionId of any game row,
          e.g. 208182 = World Cup 2023'
        example: 208182
        in: query
        name: gdapCompetitionId
        required: true
