components:
  schemas:
    GetGdapCompetitionById:
      properties:
        ageCategory:
          description: Age category (Senior, Under 16...)
          type: string
        competitionCategory:
          description: Category of the competition
          properties:
            ageType:
              description: 'Age type code: S senior, U16...'
              type: string
            code:
              description: Category code (WC World Cup, OLY Olympic Tournament, CCC-1 continental club
                tier 1)
              type: string
            isLeague:
              description: True for league-format club competitions
              type: boolean
            name:
              description: Category name
              type: string
          type: object
        competitionCode:
          description: Competition code (WMM men's World Cup, WOLYM, BCL, ELW...)
          type: string
        competitionId:
          description: 'FIBA competition id (GDAP key space): one per edition (2023 World Cup = 208182,
            BCL 2024-25 = 208850); gdapCompetitionId'
          type: integer
        competitionMarketingName:
          description: Competition family (marketing name), shared by every edition
          properties:
            code:
              description: Family code; null in every sample
              x-unobserved: true
            competitionMarketingNameId:
              description: Competition family id (201 = World Cup, 112 = BCL tier 1, 211 = EuroLeague
                Women); the <histId> of /en/history/ pages
              type: integer
            marketingName:
              description: Competition family name; slugified it is the <histSlug> of /en/history/ pages
              type: string
          type: object
        competitionType:
          description: National Teams or Clubs
          type: string
        discipline:
          description: Discipline (Basketball; 3x3 is a separate platform)
          type: string
        end:
          description: Last day, YYYY-MM-DD
          type: string
        fibaZone:
          description: FIBA zone the competition belongs to (World, Europe, Americas...)
          type: string
        gender:
          description: Men or Women
          type: string
        hosts:
          description: Host countries with their cities
          items:
            properties:
              cities:
                description: Host cities
                items:
                  type: string
                type: array
              countryCode:
                description: Host country FIBA code
                type: string
              countryName:
                description: Host country name
                type: string
            type: object
          type: array
        official:
          description: Official-status label
          type: string
        officialFlagItemCode:
          description: 'Official-status code: O = official'
          type: string
        officialFlagItemName:
          description: Official-status label
          type: string
        officialName:
          description: Edition title (FIBA Basketball World Cup; Paris 2024 Men's Olympic Basketball Tournament)
          type: string
        season:
          description: 'Season key, three rules: the END year for club competitions (BCL 2024-25 = 2025)
            and the event year for national-team events (World Cup 2023 = 2023), both equal to the sdv
            season key; qualifiers carry the TARGET tournament year, not the year played (World Cup 2027
            qualifiers played in 2025 = 2027, EuroBasket 2029 pre-qualifiers = 2029), whose sdv mapping
            is an open Phase B decision'
          type: integer
        start:
          description: First day, YYYY-MM-DD
          type: string
        status:
          description: 'Competition status: In Progress, Completed, Closed'
          type: string
        zoneInformation:
          description: FIBA zone of the competition
          properties:
            topZoneCode:
              description: Parent zone code; always null in the samples, values unverified
              x-unobserved: true
            topZoneId:
              description: Parent zone id; null for top zones
              x-unobserved: true
            topZoneOfficialName:
              description: Parent zone name; always null in the samples, values unverified
              x-unobserved: true
            zoneCode:
              description: Zone code (W, E, AF, AM, AS, OC)
              type: string
            zoneId:
              description: FIBA zone id (1 = World, 23 = Europe; zone table key space)
              type: integer
            zoneOfficialName:
              description: Zone name
              type: string
          type: object
      type: object
    GetcustomgatewayCompetitionIdsBetweenTwoDates:
      properties:
        competitionIds:
          description: Ids of the competitions with a game in the window, as strings
          items:
            type: string
            x-numeric-string: true
          type: array
      type: object
    GetcustomgatewayFederationRanking:
      properties:
        asOfDate:
          description: Date of the ranking release, local ISO date-time
          type: string
        climbers:
          description: Teams that rose the most since the previous release
          items:
            properties:
              comments:
                description: Ranking note; null in every sample
                x-unobserved: true
              countryName:
                description: Country name in English
                type: string
              currentPoints:
                description: Ranking points (one decimal)
                type: number
              fibaCode:
                description: FIBA three-letter country code (GER, USA; historic URS, YUG)
                type: string
              iocCode:
                description: IOC country code
                type: string
              organisationId:
                description: 'Organisation id, stable across competitions and seasons: the national federation
                  for a national team (64 = Germany), the club for a club team (396 = Filou Oostende).
                  Same key space as nationalFederationId, clubId, play-by-play oId and the game page''s
                  T_<id>'
                type: integer
              organisationStatusCode:
                description: 'Organisation status: ACT active'
                type: string
              worldRank:
                description: Position in the FIBA world ranking (1 = best)
                type: integer
              worldRankVariation:
                description: Change in world rank since the previous release (positive = up)
                type: integer
              zoneRank:
                description: Rank within the zone
                type: integer
            type: object
          type: array
        fallers:
          description: Teams that fell the most since the previous release
          items:
            properties:
              comments:
                description: Ranking note; null in every sample
                x-unobserved: true
              countryName:
                description: Country name in English
