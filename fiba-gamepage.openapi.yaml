info:
  description: 'Box score, play-by-play (with shot x/y) and lineups of FIBA games are only server-rendered:
    GET the game page with the header `RSC: 1` and parse the `text/x-component` flight payload. GamePage
    documents the objects extracted from it (game header, playByPlay, gameDetails box, playersTeamA/B)
    after resolving flight tokens ($undefined -> null, $<chunk>:props:<key>:<path> back-references ->
    the referenced value). The payload format can change with any site deploy. Keyless; robots.txt disallows
    only auth routes. Terms: see fiba/README.md. Not official or supported.'
  title: FIBA game pages (fiba.basketball / championsleague.basketball RSC payload)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /en/events/{eventSlug}/games/{gameId}-{teamACode}-{teamBCode}:
    get:
      description: 'Samples: `page__events__paris2024-final.json`, `page__events__elw2025.json`. The body
        is a Next.js flight payload (`<hex id>:<JSON or text>` rows). The `x-sdv-extracted` schema documents
        the JSON objects fiba/tools/capture.py cuts out of it. **A wrong slug, wrong team-code order or
        wrong history slug still answers 200** with a 120-150 KB not-found shell that has no `game` header:
        check the header''s gameId.'
      operationId: gamePage_events
      parameters:
      - description: Ask Next.js for the React Server Components flight payload instead of HTML
        in: header
        name: RSC
        required: true
        schema:
          enum:
          - '1'
          type: string
      - description: Event slug from /en/events-sitemap_index.xml, or from the Location of the 307 that
          /en/history/<histId>-<histSlug>/<competitionId> answers when the competition has an event page
        example: mens-olympic-basketball-tournament-paris-2024
        in: path
        name: eventSlug
        required: true
        schema:
          type: string
      - description: FIBA game id (global GDAP key space)
        example: 122608
        in: path
        name: gameId
        required: true
        schema:
          type: integer
      - description: teamA.code of the game row (upper case, teamA first)
        example: FRA
        in: path
        name: teamACode
        required: true
        schema:
          type: string
      - description: teamB.code of the game row
        example: USA
        in: path
        name: teamBCode
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            text/x-component:
              schema:
                type: string
          description: Flight payload (text/x-component)
          x-sdv-extracted:
            $ref: '#/components/schemas/GamePage'
      summary: Game page of a competition that has an event page (most from 2024, plus every competition
        whose history URL 307s to /en/events/)
    servers:
    - url: https://www.fiba.basketball
  /en/games/{gameId}-{teamACode}-{teamBCode}:
    get:
      description: 'Samples: `page__bcl__bcl2027-current.json`. The body is a Next.js flight payload (`<hex
        id>:<JSON or text>` rows). The `x-sdv-extracted` schema documents the JSON objects fiba/tools/capture.py
        cuts out of it. **A wrong slug, wrong team-code order or wrong history slug still answers 200**
        with a 120-150 KB not-found shell that has no `game` header: check the header''s gameId.'
