              pdoPenaltyKill:
                type: number
              pdoPowerplay:
                type: number
              penaltyKillGoals:
                type: integer
              penaltyKillGoalsAgainst:
                type: integer
              powerplayGoals:
                type: integer
              powerplayGoalsAgainst:
                type: integer
              previousGameDayGoals:
                type: integer
              previousGameDayRanking:
                type: integer
              previousGameDayShots:
                type: integer
              previousGameDayShotsPercentage:
                type: number
              ranking:
                type: integer
              savePercentage:
                type: number
              savePercentageEvenStrength:
                type: number
              savePercentagePenaltyKill:
                type: number
              savePercentagePowerplay:
                type: number
              shots:
                type: integer
              shotsAgainst:
                type: integer
              shotsAgainstEvenStrength:
                type: integer
              shotsAgainstPenaltyKill:
                type: integer
              shotsAgainstPowerplay:
                type: integer
              shotsDifference:
                type: integer
              shotsDifferenceEvenStrength:
                type: integer
              shotsDifferencePenaltyKill:
                type: integer
              shotsDifferencePowerplay:
                type: integer
              shotsEvenStrength:
                type: integer
              shotsForShotsAgainstPercentage:
                type: number
              shotsForShotsAgainstPercentageEvenStrength:
                type: number
              shotsForShotsAgainstPercentagePenaltyKill:
                type: number
              shotsForShotsAgainstPercentagePowerplay:
                type: number
              shotsPenaltyKill:
                type: integer
              shotsPercentage:
                type: number
              shotsPercentageEvenStrength:
                type: number
              shotsPercentagePenaltyKill:
                type: number
              shotsPercentagePowerplay:
                type: number
              shotsPowerplay:
                type: integer
              shotsSaved:
                type: integer
              sortDesc:
                type: boolean
              teamId:
                type: integer
              teamLogos:
                properties:
                  darkBg:
                    type: string
                  darkBgOriginal:
                    type:
                    - 'null'
                  lightBg:
                    type: string
                  lightBgOriginal:
                    type:
                    - 'null'
                type: object
              teamName:
                type: string
              teamShortName:
                type: string
            type: object
          type: array
      type: object
    Tournament:
      properties:
        cachebust:
          type: boolean
        gameWeek:
          type: integer
        maxGameWeek:
          type: integer
      type: object
info:
  description: 'Finland''s Liiga: games, schedule, game events and lineups, box scores, shot maps, standings,
    team and player tables. Routes per the liiga.fi site bundle; shapes from committed captures in liiga/captures/
    (captured 2026-10-12, game 1 of season 2026 = HPK-TPS 2025-09-09). Season keys are END years (2026
    = 2025-26); game ids are unique only within a season; the team id is the string `<num>:<slug>` in
    games, schedule and lineups but a bare integer in shotmap and teamStats (see liiga-returns.md, Divergence
    notes). Keyless, GET only, no pagination (whole season per response, up to ~4 MB). Shot maps from
    2016; /games/stats tracking (topSpeed, hardestShot) from at least 2021. Not official or supported.'
  title: Liiga API v2 (liiga.fi/api/v2)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /games:
    get:
      operationId: games
      parameters:
      - description: 'Tournament; omitted = every tournament, practice games included (probe: 605 rows
          for 2026).'
        example: runkosarja
        in: query
        name: tournament
        required: false
        schema: &id002
          enum: &id003
          - runkosarja
          - playoffs
          - playout
          - qualifications
          - valmistavat_ottelut
          - chl
          type: string
      - description: 'Season END year: 2026 = 2025-26. Omitted = the season in progress.'
        example: 2026
        in: query
        name: season
        required: false
        schema: &id001
          type: integer
      - description: One day, YYYY-MM-DD, instead of season (discovery report; not captured).
        in: query
        name: date
        required: false
        schema:
          type: string
      - description: Game week, with season (discovery report; not captured).
        in: query
        name: week
        required: false
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Games'
          description: OK
      summary: All games of a season-tournament with goal events, periods, xG and rink
  /games/stats/{season}/{id}:
    get:
      operationId: games_stats_season_id
      parameters:
      - description: 'Season END year: 2026 = 2025-26. Game ids repeat across seasons, so a game is keyed
          by (season, id).'
        example: '2026'
        in: path
        name: season
        required: true
        schema:
          type: string
      - description: Game id (`id` in /games or /schedule), e.g. 1; unique only within a season.
        example: '1'
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesStatsSeasonId'
          description: OK
      summary: 'Box score: per-period team and player stats, top speed, hardest shot, puck possession'
  /games/{season}/{id}:
    get:
      operationId: games_season_id
      parameters:
      - description: 'Season END year: 2026 = 2025-26. Game ids repeat across seasons, so a game is keyed
          by (season, id).'
        example: '2026'
        in: path
        name: season
        required: true
        schema:
          type: string
      - description: Game id (`id` in /games or /schedule), e.g. 1; unique only within a season.
        example: '1'
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: '`playersWithStats` adds allTimeStats/seasonStats/seasonStatsInTeam to every lineup
          row.'
        in: query
        name: dataType
        required: false
        schema:
          enum:
          - playersWithStats
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GamesSeasonId'
                - $ref: '#/components/schemas/GamesSeasonIdPlayersWithStats'
          description: OK
      summary: 'One game: goal/penalty/goalkeeper/shootout events, awards and both lineups'
  /gameweeks:
    get:
      operationId: gameweeks
      parameters:
      - description: 'Season END year: 2026 = 2025-26.'
        example: 2026
        in: query
        name: season
        required: false
        schema: *id001
      - description: 'Tournament (probe: omitted = 400 ''unsupported parameter'').'
        example: runkosarja
        in: query
        name: tournament
        required: true
        schema: *id002
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gameweeks'
          description: OK
      summary: Number of game weeks of a season-tournament
  /players/info:
    get:
      operationId: players_info
      parameters:
      - description: 'Tournament (probe: omitted = 502).'
        example: runkosarja
        in: query
        name: tournament
        required: true
        schema: *id002
      - description: First season (END year).
        example: 2026
        in: query
        name: fromSeason
        required: false
        schema: *id001
      - description: Last season (END year).
        example: 2026
        in: query
        name: toSeason
        required: false
        schema: *id001
      - description: Nationality filter, e.g. FIN (discovery report).
        in: query
        name: nationality
        required: false
        schema:
          type: string
      - description: Team as `<num>:<slug>` (discovery report).
        in: query
        name: team
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersInfo'
          description: OK
      summary: Roster and bio rows of every player in a season range
  /players/info/{playerId}:
    get:
      operationId: players_info_playerId
      parameters:
      - description: Player id (lineup `id`, `playerId`; equals `fihaId`), e.g. 21870028.
        example: '21870028'
        in: path
        name: playerId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersInfoPlayerId'
          description: OK
      summary: One player's profile and career by tournament
  /players/info/{playerId}/games/{season}:
    get:
      operationId: players_info_playerId_games_season
      parameters:
      - description: Player id (lineup `id`, `playerId`; equals `fihaId`), e.g. 21870028.
        example: '21870028'
        in: path
        name: playerId
        required: true
        schema:
          type: string
      - description: 'Season END year: 2026 = 2025-26. Game ids repeat across seasons, so a game is keyed
          by (season, id).'
        example: '2026'
        in: path
        name: season
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersInfoPlayerIdGamesSeason'
          description: OK
      summary: One player's game log for a season, keyed by tournament
  /players/stats/summed/{from}/{to}/{tournament}/{bool}:
    get:
      operationId: players_stats_summed_from_to_tournament_bool
      parameters:
      - description: First season (END year) of the range, e.g. 2026.
        example: '2026'
        in: path
        name: from
        required: true
        schema:
          type: string
      - description: Last season (END year) of the range, e.g. 2026.
        example: '2026'
        in: path
        name: to
        required: true
        schema:
          type: string
      - description: Tournament code (lowercase; responses echo it uppercase in `serie`/`tournament`).
        example: runkosarja
        in: path
        name: tournament
        required: true
        schema:
          enum: *id003
          type: string
      - description: '`true`: the whole league, no filters (what the site''s stat tables request; captured).
          `false`: honours the team/splitTeams/gameWeek/opposingTeam/result/homeAway/lastGames/nationality
          query filters (site bundle; not captured).'
        example: 'true'
        in: path
        name: bool
        required: true
        schema:
          enum:
          - 'true'
          - 'false'
          type: string
      - description: 'Stat table. Omitted = a default table (probe: 573 rows, more than basicStats'' 531).'
        example: basicStats
        in: query
        name: dataType
        required: false
        schema:
          enum:
          - basicStats
          - basicStatsGk
          - advancedStats
          - goalStats
          - shotStats
          - skatingStats
          - faceOffStats
          - penaltyStats
          - powerplayPenaltykillStats
          - passes
          - winningShotComp
          - winningShotCompGk
          - gameTime
          type: string
      - description: Team as `<num>:<slug>` (site bundle).
        in: query
        name: team
        required: false
        schema:
          type: string
      - description: '`true` splits a traded player''s rows by team (site bundle).'
        in: query
        name: splitTeams
        required: false
        schema:
          type: string
      - description: Game week filter (site bundle).
        in: query
        name: gameWeek
        required: false
        schema: *id001
      - description: Opponent team filter (site bundle).
        in: query
        name: opposingTeam
        required: false
        schema:
          type: string
      - description: Game result filter (site bundle).
        in: query
        name: result
        required: false
        schema:
          type: string
      - description: Home/away filter (site bundle).
        in: query
        name: homeAway
        required: false
        schema:
          type: string
      - description: Last N games filter (site bundle).
        in: query
        name: lastGames
        required: false
        schema: *id001
      - description: Nationality filter, e.g. FIN (site bundle).
        in: query
        name: nationality
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PlayersStatsSummedFromToTournamentBoolBasicStats'
                - $ref: '#/components/schemas/PlayersStatsSummedFromToTournamentBoolBasicStatsGk'
                - $ref: '#/components/schemas/PlayersStatsSummedFromToTournamentBoolAdvancedStats'
                - $ref: '#/components/schemas/PlayersStatsSummedFromToTournamentBoolGoalStats'
                - $ref: '#/components/schemas/PlayersStatsSummedFromToTournamentBoolShotStats'
                - $ref: '#/components/schemas/PlayersStatsSummedFromToTournamentBoolSkatingStats'
                - $ref: '#/components/schemas/PlayersStatsSummedFromToTournamentBoolFaceOffStats'
                - $ref: '#/components/schemas/PlayersStatsSummedFromToTournamentBoolPenaltyStats'
                - $ref: '#/components/schemas/PlayersStatsSummedFromToTournamentBoolPowerplayPenaltykillStats'
                - $ref: '#/components/schemas/PlayersStatsSummedFromToTournamentBoolPasses'
                - $ref: '#/components/schemas/PlayersStatsSummedFromToTournamentBoolWinningShotComp'
                - $ref: '#/components/schemas/PlayersStatsSummedFromToTournamentBoolWinningShotCompGk'
                - $ref: '#/components/schemas/PlayersStatsSummedFromToTournamentBoolGameTime'
          description: OK
      summary: Player stat table summed over a season range
  /schedule:
    get:
      operationId: schedule
      parameters:
      - description: 'Tournament; omitted = runkosarja (probe: same 480 rows).'
        example: runkosarja
        in: query
        name: tournament
        required: false
        schema: *id002
      - description: 'Season END year: 2026 = 2025-26. Omitted = the season in progress (probe: 2027).'
        example: 2026
        in: query
        name: season
        required: false
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
          description: OK
      summary: 'Flat schedule rows of a season-tournament: ids, teams, goals, xG, start'
  /shotmap/{season}/{id}:
    get:
      operationId: shotmap_season_id
      parameters:
      - description: 'Season END year: 2026 = 2025-26. Game ids repeat across seasons, so a game is keyed
          by (season, id).'
        example: '2026'
        in: path
        name: season
        required: true
        schema:
          type: string
      - description: Game id (`id` in /games or /schedule), e.g. 1; unique only within a season.
        example: '1'
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShotmapSeasonId'
          description: OK
      summary: Every shot of a game with rink coordinates, shooter, blocker and skaters on ice
  /standings/:
    get:
      operationId: standings
      parameters:
      - description: 'Season END year: 2026 = 2025-26. Omitted = the season in progress.'
        example: 2026
        in: query
        name: season
        required: false
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Standings'
          description: OK
      summary: 'Standings of a season: regular season, playoffs, preseason, playout, qualifications'
  /teams/info:
    get:
      operationId: teams_info
      parameters:
      - description: 'Team as `<num>:<slug>`, e.g. 55786244:hpk. Omitted = every team: `{teams, logos}`
          (a different shape; captured as the `all` variant).'
        example: 55786244:hpk
        in: query
        name: team
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/TeamsInfo'
                - $ref: '#/components/schemas/TeamsInfoAll'
          description: OK
      summary: All-time season rows of one team (team given) or every team's logos and rows (team omitted)
  /teams/stats:
    get:
      operationId: teams_stats
      parameters:
      - description: 'First season (END year). Season END year: 2026 = 2025-26.'
        example: 2026
        in: query
        name: seasonFrom
        required: false
        schema: *id001
      - description: Last season (END year).
        example: 2026
        in: query
        name: seasonTo
        required: false
        schema: *id001
      - description: 'Tournament (probe: omitted = 500 ''Remote server error'').'
        example: runkosarja
        in: query
        name: tournament
        required: true
        schema: *id002
      - description: 'Stat table (discovery: omitted = 502; basicStats = 500).'
        example: shots
        in: query
        name: dataType
        required: true
        schema:
          enum:
          - shots
          - passes
          - faceoffs
          - penalties
          - powerplay
          - penalty_kill
          - even_strength
          type: string
      - description: Home/away filter (site bundle).
        in: query
        name: homeAway
        required: false
        schema:
          type: string
      - description: Game result filter (site bundle).
        in: query
        name: result
        required: false
        schema:
          type: string
      - description: Last N games filter (site bundle).
        in: query
        name: lastGames
        required: false
        schema: *id001
      - description: Game week filter (site bundle).
        in: query
        name: gameWeek
        required: false
        schema: *id001
      - description: Include the game in progress (site bundle).
        in: query
        name: live
        required: false
        schema:
          type: string
      - description: Opponent team filter (site bundle).
        in: query
        name: opposingTeam
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/TeamsStatsShots'
                - $ref: '#/components/schemas/TeamsStatsPasses'
                - $ref: '#/components/schemas/TeamsStatsFaceoffs'
                - $ref: '#/components/schemas/TeamsStatsPenalties'
                - $ref: '#/components/schemas/TeamsStatsPowerplay'
                - $ref: '#/components/schemas/TeamsStatsPenaltyKill'
                - $ref: '#/components/schemas/TeamsStatsEvenStrength'
          description: OK
      summary: Team stat table for a season range
  /tournament:
    get:
      operationId: tournament
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
          description: OK
      summary: 'Current state: game week of the season in progress and its last game week'
servers:
- url: https://liiga.fi/api/v2
