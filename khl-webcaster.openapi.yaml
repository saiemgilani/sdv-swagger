      summary: Teams of a stage
servers:
- url: https://khl.api.webcaster.pro/api/{base}
  variables:
    base:
      default: khl_mobile
      description: khl_mobile = KHL; mhl_mobile = MHL juniors (data.json 200 on 2026-10-12). whl_mobile
        (women's league) answered 404 for data.json and events_v2.json on 2026-10-12; vhl_mobile is 404
        too.
      enum:
      - khl_mobile
      - mhl_mobile
