info:
  description: 'The KHL TV app''s backend: GET, keyless, add locale=en. Webcaster ids (event, team, player,
    stage) are a separate id space from khl.ru: join on the khl_id fields only (stage.khl_id = tournament,
    event.khl_id = game id, team.khl_id = club id, player.khl_id = player id). Direct transfers stall
    after about 16 KB on some networks, so fetch large bodies (tables_v2, event_v2, players_v2 without
    ids) through a proxy. Betting-affiliate fields (event.bets) are stripped from the committed samples.
    Shapes from khl/captures/webcaster/ (captured 2026-10-12). Russian league operator: a published data
    release or mirror needs owner sign-off. Not official or supported.'
  title: KHL webcaster mobile API (khl.api.webcaster.pro)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /data.json:
    get:
      description: remote_ip (the caller's IP) is stripped from the committed sample.
      operationId: data
      parameters:
      - description: en or ru.
        example: en
        in: query
        name: locale
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Data'
          description: OK. A missing required id answers 200 {"error":{"code":404,...}}.
      summary: 'App bootstrap: all stages (stages_v2, webcaster id <-> khl_id), teams, current stage'
  /event_v2.json:
    get:
      description: Direct transfers of large events can stall after ~16 KB; fetch through a proxy. text_events[]
        are summary text only.
      operationId: event_v2
      parameters:
      - description: en or ru.
        example: en
        in: query
        name: locale
        required: false
        schema:
          type: string
      - description: Webcaster event id (events_v2[].event.id), not the khl.ru game id (that is event.khl_id).
        example: '2786714'
        in: query
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventV2'
          description: OK. A missing required id answers 200 {"error":{"code":404,...}}.
      summary: 'One game: officials, team totals, per-player match_stats, goals, penalties'
  /events_v2.json:
    get:
      operationId: events_v2
      parameters:
      - description: en or ru.
        example: en
        in: query
        name: locale
        required: false
        schema:
          type: string
      - description: 'Webcaster stage id (370 = 2025/26 regular season; khl_id 1369). From data.json stages_v2[].id.
          Omitted: the current stage.'
        example: '370'
        in: query
        name: stage_id
        required: false
        schema:
          type: string
      - description: 1-based page; 16 events per page, `per_page` is ignored. An empty array ends the
          stage.
        example: '1'
        in: query
        name: page
        required: false
        schema:
          type: string
      - description: 'Webcaster team id, repeatable: games of these teams.'
        example:
        - '18'
        explode: true
        in: query
        name: q[team_a_or_team_b_in][]
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Games starting after this unix time (seconds). Needs stage_id, else [].
        example: '1759276800'
        in: query
        name: q[start_at_gt_time_from_unixtime]
        required: false
        schema:
          type: string
      - description: Games starting before this unix time (seconds). Needs stage_id, else [].
        example: '1759363200'
        in: query
        name: q[start_at_lt_time_from_unixtime]
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsV2'
          description: OK. A missing required id answers 200 {"error":{"code":404,...}}.
      summary: Games of a stage, 16 per page
      x-pagination:
        page_size: 16
        params:
        - page
        request: 'verified 2026-10-12: page=2 differs from page=1, stage 370 page 48 returns []; per_page=3
          still returns 16'
        style: page
  /leaders_v2.json:
    get:
      operationId: leaders_v2
      parameters:
      - description: en or ru.
        example: en
        in: query
        name: locale
        required: false
        schema:
          type: string
      - description: 'Webcaster stage id (370 = 2025/26 regular season; khl_id 1369). From data.json stages_v2[].id.
          Omitted: the current stage.'
        example: '370'
        in: query
        name: stage_id
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadersV2'
          description: OK. A missing required id answers 200 {"error":{"code":404,...}}.
      summary: Stat leaders of a stage (14 categories)
  /players_v2.json:
    get:
      operationId: players_v2
      parameters:
      - description: en or ru.
        example: en
        in: query
        name: locale
        required: false
        schema:
          type: string
      - description: 'Webcaster stage id (370 = 2025/26 regular season; khl_id 1369). From data.json stages_v2[].id.
          Omitted: the current stage.'
        example: '370'
        in: query
        name: stage_id
        required: false
        schema:
          type: string
      - description: 'Webcaster player id, repeatable. Omitted: every player of the stage (a large body).'
        example:
        - '33405'
        - '1144'
        explode: true
        in: query
        name: q[id_in][]
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersV2'
          description: OK. A missing required id answers 200 {"error":{"code":404,...}}.
      summary: Players by webcaster id with stage-scoped stats
  /players_v2_light.json:
    get:
      operationId: players_v2_light
      parameters:
      - description: en or ru.
        example: en
        in: query
        name: locale
        required: false
        schema:
          type: string
      responses:
