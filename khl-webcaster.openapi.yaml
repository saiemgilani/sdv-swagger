  /tables_v2.json:
    get:
      description: '1.2 MB for every season. stages[].regular repeats the CURRENT season under every season:
        read tables.championship (and tables.west/east/divisions) instead. Direct transfers stall; fetch
        through a proxy.'
      operationId: tables_v2
      parameters:
      - description: en or ru.
        example: en
        in: query
        name: locale
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TablesV2'
          description: OK. A missing required id answers 200 {"error":{"code":404,...}}.
      summary: Standings for every season (use tables.championship)
  /team_v2.json:
    get:
      operationId: team_v2
      parameters:
      - description: en or ru.
        example: en
        in: query
        name: locale
        required: false
        schema:
          type: string
      - description: Webcaster team id (teams_v2[].team.id); the khl.ru club id is team.khl_id.
        example: '18'
        in: query
        name: id
        required: true
        schema:
          type: string
      - description: 'Webcaster stage id (370 = 2025/26 regular season; khl_id 1369). From data.json stages_v2[].id.
          Omitted: the current stage.'
        example: '370'
        in: query
        name: stage_id
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamV2'
          description: OK. A missing required id answers 200 {"error":{"code":404,...}}.
      summary: One team with roster, stats and feed
  /teams_v2.json:
    get:
