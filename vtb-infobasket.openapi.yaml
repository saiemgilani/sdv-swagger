              ParamGroup:
                description: Category group; 0 in the samples.
                type: integer
              ParamID:
                description: Leader-category id (the `param` of the parameter lists).
                type: integer
              ParamName:
                description: Category name.
                type: string
              ShortName:
                description: Category short name.
                type: string
              StatsParameter:
                description: Internal stat code of the category (0 points, 1 rebounds, 2 assists in the
                  samples).
                type: integer
              StatsParameter1:
                description: 'Unobserved: null in every sample, so its type and meaning are unconfirmed.'
                x-unobserved: true
            type: object
          Results:
            description: The team's games in this stage.
