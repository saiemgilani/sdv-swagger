info:
  description: 'The Russian basketball federation''s stats platform behind the VTB site''s widgets (routes
    from assets/rfb/widgets.bundle.min.js): seasons per competition tag, calendars, box scores and play-by-play
    with shot x/y (2022-23 on; box scores back to 2009-10), stage trees, standings, cross tables, playoff
    brackets, leaders, team and player stats and profiles. Keyless. Errors arrive as HTTP 200 bodies:
    {MessageType, Header, Message}, the string "BadRequest", or []. Shapes from committed captures in
    vtb/captures/ib/ (2026-10-12); officials'' and coaches'' birth data and everyone''s contact fields
    are nulled in the captures. x-unobserved = null in every sample. Season key: END year (2026 = 2025-26),
    the sdv key, on both backends. Owner flag: Russian league operator (VTB United League) and Russian
    federation platform (Infobasket). Wrappers that fetch on the user''s machine are fine; any published
    data release, hosted mirror or redistribution needs owner (sanctions/legal) sign-off first. Not official
    or supported.'
  title: Infobasket stats platform (org.infobasket.su) for the VTB United League
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /Comp/GetBestPlayers/{compId}:
    get:
      description: 'Sampled: compId=50714&count=5&lang=en. The body echoes nothing to scope-check against
        the request.'
      operationId: Comp_GetBestPlayers_compId
      parameters:
      - description: 'Infobasket CompID: a season-level id from /Comp/GetSeasonsForTag (50714 = 2025-26)
          or a stage id from /Widget/CompIssue.'
        example: 50714
        in: path
        name: compId
        required: true
        schema: &id001
          type: integer
      - description: Leader categories to return (the widget asks 5).
        example: 5
        in: query
        name: count
        required: false
        schema: *id001
      - description: Label language. Most bodies carry both Russian and English fields regardless (GetOnline
          is byte-identical for en and ru).
        example: en
        in: query
        name: lang
        required: false
        schema: &id002
          enum:
          - en
          - ru
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompGetBestPlayersCompId'
          description: OK
      summary: Player leaders for the first `count` leader categories
  /Comp/GetBestTeams/{compId}:
    get:
      description: 'Sampled: compId=50714&count=5&lang=en. The body echoes nothing to scope-check against
        the request.'
      operationId: Comp_GetBestTeams_compId
      parameters:
      - description: 'Infobasket CompID: a season-level id from /Comp/GetSeasonsForTag (50714 = 2025-26)
          or a stage id from /Widget/CompIssue.'
        example: 50714
        in: path
        name: compId
        required: true
        schema: *id001
      - description: Leader categories to return (the widget asks 5).
        example: 5
        in: query
        name: count
        required: false
        schema: *id001
      - description: Label language. Most bodies carry both Russian and English fields regardless (GetOnline
          is byte-identical for en and ru).
        example: en
        in: query
        name: lang
        required: false
        schema: *id002
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompGetBestTeamsCompId'
          description: OK
      summary: Team leaders for the first `count` leader categories
  /Comp/GetCalendar/:
    get:
      description: 'Sampled: comps=50714&format=json; comps=39799&format=json; comps=9113&format=json.
        No competition id in the rows; the capture checks every GameDate falls in the season.'
      operationId: Comp_GetCalendar
      parameters:
      - description: One or more CompIDs, comma separated (the widget passes one). An unknown id answers
          [].
        example: '50714'
        in: query
        name: comps
        required: true
        schema: &id003
          type: string
      - description: Response format. JSON is the default without it (verified on GetOnline and GetSeasonsForTag).
        example: json
        in: query
        name: format
        required: false
        schema: &id004
          enum:
          - json
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompGetCalendar'
          description: OK
      summary: Game list of one or more competitions
  /Comp/GetSeasonsForTag:
    get:
      description: 'Sampled: tag=vtb&format=json. The body echoes nothing to scope-check against the request.'
      operationId: Comp_GetSeasonsForTag
      parameters:
      - description: 'Competition tag: vtb (VTB United League, 2009-10 on), vtbyouth (2013-14 on), wbc
          (WINLINE Basket Cup, 2025-26 on), wpremier (Russian women''s Premier League, 2010-11 on), rfb
          (Russian federation competitions, 1994-95 on). An unknown tag answers []'
        example: vtb
        in: query
        name: tag
        required: true
        schema: *id003
      - description: Response format. JSON is the default without it (verified on GetOnline and GetSeasonsForTag).
        example: json
        in: query
        name: format
        required: false
        schema: *id004
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompGetSeasonsForTag'
          description: OK
      summary: Season year -> competition id for a competition tag
  /Comp/GetTeamStats/{compId}:
    get:
      description: 'Sampled: compId=50714&page=0. Paged: Count, Page (0-based), Pages. The capture refuses
        a body unless Pages is 1 and Stats holds Count rows. The body echoes nothing to scope-check against
        the request.'
      operationId: Comp_GetTeamStats_compId
      parameters:
      - description: 'Infobasket CompID: a season-level id from /Comp/GetSeasonsForTag (50714 = 2025-26)
          or a stage id from /Widget/CompIssue.'
        example: 50714
        in: path
        name: compId
        required: true
        schema: *id001
      - description: 0-based page; the site's widget loops until `Count` rows are read. One page held
          all 11 VTB teams.
        example: 0
        in: query
        name: page
        required: false
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompGetTeamStatsCompId'
          description: OK
      summary: Season totals of every team, with players and coaches
  /Comp/GetTeamStatsForPreview/{gameId}:
    get:
      description: 'Sampled: gameId=921391&compId=50714.'
