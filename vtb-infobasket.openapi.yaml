    CompGetCalendar:
      description: Game list of one or more competitions.
      items:
        properties:
          ArenaEn:
            description: Arena name, English.
            type: string
          ArenaId:
            description: Infobasket arena id; equals the v2 API `venueId` (11687 = SK Basket-Hall, Krasnodar).
            type: integer
          ArenaRu:
            description: Arena, Russian ('СК' = sports complex).
            type: string
          CompNameEn:
            description: Stage name (e.g. 'Regular Season'), English.
            type: string
          CompNameRu:
            description: Stage name, Russian ('Регулярный чемпионат' = 'Regular Season', 'Группа А' =
              'Group A').
            type: string
          CompTeamNameAen:
            description: Team name as registered in the competition of team A (home), English.
            type: string
          CompTeamNameAru:
            description: Team name as registered in the competition of team A (home), Russian.
            type: string
          CompTeamNameBen:
            description: Team name as registered in the competition of team B (away), English.
            type: string
          CompTeamNameBru:
            description: Team name as registered in the competition of team B (away), Russian.
            type: string
          DaysFromToday:
            description: Days between the game date and the day the body was served (positive = in the
              past); changes every day.
            type: integer
          DisplayDateTimeLocal:
            description: Display string of the local date and time, in Russian ('Вс, 28 сен. 14:00' =
              'Sun, 28 Sep. 14:00').
            type: string
          DisplayDateTimeLocalEn:
            description: Display string of the local date and time, in English.
            type: string
          DisplayDateTimeMsk:
            description: Display string of the Moscow date and time, in Russian ('мск' = Moscow time).
            type: string
          DisplayDateTimeMskEn:
            description: Display string of the Moscow date and time, in English ('msk' = Moscow time).
            type: string
          GameAttendance:
            description: Spectators.
            type: integer
          GameDate:
            description: Game date as 'DD.MM.YYYY'.
            type: string
          GameDateInt:
            description: Game date as days since 2000-01-01 (9402 = 2025-09-28).
            type: integer
          GameDateTime:
            description: Tip-off instant as a .NET JSON date '/Date(<ms since 1970-01-01 UTC>)/'.
            type: string
          GameDateTimeMoscow:
            description: Tip-off instant as a .NET JSON date '/Date(<ms since 1970-01-01 UTC>)/'; equal
              to GameDateTime in every sample.
            type: string
          GameID:
            description: Infobasket game id (GameID); equals the v2 API `matchId`. Joins to /Widget/GetOnline/{gameId}
              and /Widget/GamePage/{gameId}.
            type: integer
          GameLocalDate:
            description: Game date at local midnight (Moscow, UTC+3) as a .NET JSON date '/Date(<ms since
              1970-01-01 UTC>)/'.
            type: string
          GameNumber:
            description: Game number within the competition, e.g. 'RS-002' (RS = regular season); playoff
              games use the series code.
            type: string
          GameStatus:
            description: 'Game status: 0 planned, 1 completed, 2 live (the site''s widget code). Samples
              are completed games.'
            type: integer
          GameTime:
            description: Tip-off local time, 'HH:MM'.
            type: string
          GameTimeMsk:
            description: Tip-off time in Moscow time ('HH:MM' on calendar rows, 'HH.MM' in GetOnline).
            type: string
          Gender:
            description: 'Competition gender: 0 on every VTB sample (men). Other values unverified.'
            type: integer
          HasTime:
            description: True when a tip-off time is set.
            type: boolean
          HasVideo:
            description: True when a video embed is attached.
            type: boolean
          IsToday:
            description: True when the game is on the day the body was served.
            type: boolean
          LeagueNameEn:
            description: League name, English.
            type: string
          LeagueNameRu:
            description: League name, Russian ('Единая лига ВТБ' / 'Чемпионат Единой лиги ВТБ' = 'VTB
              United League' / 'VTB United League Championship').
            type: string
          LeagueShortNameEn:
            description: League short name, English.
            type: string
          LeagueShortNameRu:
            description: League short name, Russian ('ВТБ' = 'VTB').
            type: string
          LiveID:
            description: 'Broadcast note as free text, in Russian when set (''ТВ: Матч ТВ, VK Видео''
              = ''TV: Match TV, VK Video''); empty or null otherwise.'
            type: string
          Periods:
            description: 0 on every calendar row (not the number of periods played).
            type: integer
          RegionEn:
            description: City, English.
            type: string
          RegionId:
            description: Infobasket region (city) id; 0 on calendar rows.
            type: integer
          RegionRu:
            description: City, Russian.
            type: string
          RegionTeamNameAen:
            description: Team's city or region of team A (home), English.
            type: string
          RegionTeamNameAru:
            description: Team's city or region of team A (home), Russian.
            type: string
          RegionTeamNameBen:
            description: Team's city or region of team B (away), English.
            type: string
          RegionTeamNameBru:
            description: Team's city or region of team B (away), Russian.
            type: string
          ScoreA:
            description: Final score of team A (home).
            type: integer
          ScoreB:
            description: Final score of team B (away).
            type: integer
          ShortTeamNameAen:
            description: Team short name of team A (home), English.
            type: string
          ShortTeamNameAru:
            description: Team short name of team A (home), Russian.
            type: string
          ShortTeamNameBen:
            description: Team short name of team B (away), English.
            type: string
          ShortTeamNameBru:
            description: Team short name of team B (away), Russian.
            type: string
          TeamAid:
            description: 'Team A (home) TeamID. Infobasket team id (TeamID): one club''s entry in a competition
              family (Lokomotiv Kuban = 2650). Joins to /Widget/Team*/{teamId} and equals the v2 API `teamId`.'
            type: integer
          TeamBid:
            description: 'Team B (away) TeamID. Infobasket team id (TeamID): one club''s entry in a competition
              family (Lokomotiv Kuban = 2650). Joins to /Widget/Team*/{teamId} and equals the v2 API `teamId`.'
            type: integer
          TeamLogoA:
            description: Logo image URL of team A (home).
            type: string
          TeamLogoB:
            description: Logo image URL of team B (away).
            type: string
          TeamNameAen:
            description: Team name with city in brackets of team A (home), English.
            type: string
          TeamNameAru:
            description: Team name with city in brackets of team A (home), Russian.
            type: string
          TeamNameBen:
            description: Team name with city in brackets of team B (away), English.
            type: string
          TeamNameBru:
            description: Team name with city in brackets of team B (away), Russian.
            type: string
          TvEn:
            description: TV channels, in English.
            type: string
          TvRu:
            description: TV channels, in Russian.
            type: string
          VideoID:
            description: HTML <iframe> embed of the game video (VK Video), or null.
            type:
            - string
            - 'null'
        type: object
      type: array
    CompGetSeasonsForTag:
      description: Season year -> competition id for a competition tag.
      items:
        properties:
          CompID:
            description: Season-level CompID of that season (50714 = VTB 2025-26). Pass it as `comps`
              to /Comp/GetCalendar/.
            type: integer
          Db:
            description: Infobasket database the competition lives in ('org').
            type: string
          NameEn:
            description: Season name in English.
            type: string
          NameRu:
            description: Season name in Russian ('Сезон 2025/2026' = 'Season 2025/2026').
            type: string
          SeasonYear:
            description: Season END year (2026 = 2025-26); the sdv season key.
            type: integer
        type: object
      type: array
    CompGetTeamStatsCompId:
      description: Season totals of every team, with players and coaches.
      properties:
        Count:
          description: Total rows across all pages.
          type: integer
        Page:
          description: Page index (0-based).
          type: integer
        Pages:
          description: Number of pages.
          type: integer
        Stats:
          description: One row per team.
          items:
            properties:
              Assist:
                description: 'Assists. Null means zero: Infobasket sends null instead of 0 for counting
                  stats.'
                type: integer
              AvgAssist:
                description: 'Per-game average of: assists; a string with a comma decimal separator (''68,2'');
                  empty when there were no attempts.'
                type: string
              AvgBlocks:
                description: 'Per-game average of: blocked shots; a string with a comma decimal separator
                  (''68,2''); empty when there were no attempts.'
                type: string
              AvgDefRebound:
                description: 'Per-game average of: defensive rebounds; a string with a comma decimal separator
                  (''68,2''); empty when there were no attempts.'
                type: string
              AvgFoul:
                description: 'Per-game average of: personal fouls committed; a string with a comma decimal
                  separator (''68,2''); empty when there were no attempts.'
                type: string
              AvgOffRebound:
                description: 'Per-game average of: offensive rebounds; a string with a comma decimal separator
                  (''68,2''); empty when there were no attempts.'
                type: string
              AvgOpponentFoul:
                description: 'Per-game average of: fouls drawn; a string with a comma decimal separator
                  (''68,2''); empty when there were no attempts.'
                type: string
              AvgPlayedTime:
                description: Average playing time per game as 'minutes:seconds'.
                type: string
              AvgPlusMinus:
                description: 'Per-game average of: plus-minus: point differential while on the court;
                  a string with a comma decimal separator (''68,2''); empty when there were no attempts.'
