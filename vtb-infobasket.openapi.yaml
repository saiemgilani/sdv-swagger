      parameters:
      - description: Infobasket GameID (= v2 `matchId`).
        example: 921391
        in: path
        name: gameId
        required: true
        schema: *id001
      - description: Season-level CompID of the game.
        example: 50714
        in: query
        name: compId
        required: false
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompGetTeamStatsForPreviewGameId'
          description: OK
      summary: Season totals of a game's two teams (pre-game preview)
