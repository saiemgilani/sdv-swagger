info:
  description: Reverse-engineered from committed captures in fotmob/captures/. Keyless as of the capture
    date; FotMob has required an x-mas signature header before. Not official or supported.
  title: FotMob (unofficial, www.fotmob.com/api/data)
  version: '2026-10-05'
openapi: 3.1.0
paths:
  /allLeagues:
    get:
      operationId: allLeagues
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allleagues'
          description: OK
      summary: allLeagues
  /api/trendingnews:
    get:
      operationId: trendingnews
      parameters:
      - description: Language code.
        example: en
        in: query
        name: lang
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trendingnews'
          description: OK
      summary: api/trendingnews
    servers:
    - url: https://www.fotmob.com
  /audio-matches:
    get:
      operationId: audio_matches
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioMatches'
          description: OK
      summary: audio-matches
  /leagues:
    get:
      operationId: leagues
      parameters:
      - description: League, team or player id (numeric string).
        example: '47'
        in: query
        name: id
        required: true
        schema:
          type: string
      - description: Page tab, e.g. overview, table, fixtures, stats.
        example: overview
        in: query
        name: tab
        required: true
        schema:
          type: string
      - description: league or team.
        example: league
        in: query
        name: type
        required: true
        schema:
          type: string
      - description: IANA zone for kickoff times.
        example: UTC
        in: query
        name: timeZone
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leagues'
          description: OK
      summary: leagues
  /matchDetails:
    get:
      operationId: matchDetails
      parameters:
      - description: Match id (from /matches).
        example: '4813647'
        in: query
        name: matchId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matchdetails'
          description: OK
      summary: matchDetails
  /matches:
    get:
      operationId: matches
      parameters:
      - description: YYYYMMDD.
        example: '20260301'
        in: query
        name: date
        required: true
        schema:
          type: string
      - description: IANA zone.
        example: UTC
        in: query
        name: timezone
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matches'
          description: OK
      summary: matches
  /playerData:
    get:
      operationId: playerData
      parameters:
      - description: League, team or player id (numeric string).
        example: '1077894'
        in: query
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playerdata'
          description: OK
      summary: playerData
  /search/suggest:
    get:
      operationId: search_suggest
      parameters:
      - description: Search text.
        example: haaland
        in: query
        name: term
        required: true
        schema:
          type: string
      - description: Language code.
        example: en
        in: query
        name: lang
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSuggest'
          description: OK
      summary: search/suggest
  /table:
    get:
      operationId: table
      parameters:
      - description: The data.fotmob.com table file to return, e.g. http://data.fotmob.com/tables.ext.47.fot.gz.
        example: http://data.fotmob.com/tables.ext.47.fot.gz
        in: query
        name: url
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
          description: OK
      summary: table
  /team-of-the-week/rounds:
    get:
      operationId: team_of_the_week_rounds
      parameters:
      - description: League id.
        example: '47'
        in: query
        name: leagueId
        required: true
        schema:
          type: string
      - description: e.g. 2025/2026.
        example: 2025/2026
        in: query
        name: season
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamOfTheWeekRounds'
          description: OK
      summary: team-of-the-week/rounds
  /teams:
    get:
      operationId: teams
      parameters:
      - description: League, team or player id (numeric string).
        example: '8650'
        in: query
        name: id
        required: true
        schema:
          type: string
      - description: Page tab, e.g. overview, table, fixtures, stats.
        example: overview
        in: query
        name: tab
        required: true
        schema:
          type: string
      - description: league or team.
        example: team
        in: query
        name: type
        required: true
        schema:
          type: string
      - description: IANA zone for kickoff times.
        example: UTC
        in: query
        name: timeZone
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams'
          description: OK
      summary: teams
  /tlnews:
    get:
      operationId: tlnews
      parameters:
      - description: League, team or player id (numeric string).
        example: '47'
        in: query
        name: id
        required: true
        schema:
          type: string
      - description: league or team.
        example: league
        in: query
        name: type
        required: true
        schema:
          type: string
      - description: Paging offset for the news timeline.
        example: '0'
        in: query
        name: startIndex
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tlnews'
          description: OK
      summary: tlnews
  /top-transfers:
    get:
      operationId: top_transfers
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopTransfers'
          description: OK
      summary: top-transfers
  /tvlistings:
    get:
      operationId: tvlistings
      parameters:
      - description: ISO country for TV listings.
        example: GB
        in: query
        name: countryCode
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tvlistings'
          description: OK
      summary: tvlistings
servers:
- url: https://www.fotmob.com/api/data
