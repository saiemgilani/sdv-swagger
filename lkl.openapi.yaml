        gameStatistics:
          additionalProperties:
            description: Totals of the team whose id is the key.
            properties:
              assists:
                description: Team assists in the game (count).
                type: integer
              bench_points:
                description: Points by players who did not start.
                type: integer
              biggest_lead:
                description: This team's biggest lead in points (0 when it never led).
                type: integer
              biggest_scoring_run:
                description: This team's longest unanswered scoring run, in points.
                type: integer
              blocks:
                description: Blocks made.
                type: integer
              blocks_received:
                description: Shots of this team that were blocked.
                type: integer
              created_at:
                description: When this stats row was created, ISO 8601 UTC with microseconds ('2026-08-11T13:00:26.000000Z');
                  the row exists from schedule time.
                type: string
              defensive_rebounds:
                description: Team defensive rebounds in the game (count).
                type: integer
              efficiency:
                description: 'Team efficiency rating (Efektyvumas), a PIR-style index (points + rebounds
                  + assists + steals + blocks + fouls drawn - missed shots - turnovers - shots blocked
                  - fouls). The exact formula is unverified: game 11590 home gives 121 where that formula
                  gives 122.'
                type: integer
              fast_break_points:
                description: Fast-break points; 0 on the 2007-08 sample.
                type: integer
              field_goals_2pt_percentage:
                description: Two-point percentage, 0-100, string with two decimals.
                type: string
              field_goals_3pt_percentage:
                description: Three-point percentage, 0-100, string with two decimals.
                type: string
              field_goals_attempted_2pt:
                description: Two-point field goals attempted.
                type: integer
              field_goals_attempted_3pt:
                description: Three-point field goals attempted.
                type: integer
              field_goals_attempted_total:
                description: Field goals attempted, 2PT + 3PT.
                type: integer
              field_goals_made_2pt:
                description: Two-point field goals made.
                type: integer
              field_goals_made_3pt:
                description: Three-point field goals made.
                type: integer
              field_goals_made_total:
                description: Field goals made, 2PT + 3PT.
                type: integer
              field_goals_percentage:
                description: Field-goal percentage, 0-100, as a STRING with two decimals ('51.47').
                type: string
              fouls:
                description: Fouls committed.
                type: integer
