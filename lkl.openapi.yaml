                x-keyed-by: '{period}'
              second_chance_points:
                description: Second-chance points (after an offensive rebound); 0 on the 2007-08 sample.
                type: integer
              seconds_played:
                description: Summed playing time of all the team's players in SECONDS (12000 = 5 x 40:00;
                  13500 with one overtime).
                type: integer
              steals:
                description: Team steals in the game (count).
                type: integer
              team_id:
                description: 'Team id (key space: lkl.lt clubs, STABLE across seasons and renamings: 6
                  = Rytas, also ''Lietuvos Rytas'' in 2007-08; 3 = Žalgiris; 60 = Gargždai). The value=
                  of the /rezultatai team filter; joins gameStatistics keys and the game page teams_info.*.id.
