    LklPlayByPlay:
      description: 'Body of /play-by-play/{gameId}: every event, newest first, regulation periods keyed
        by period number, overtime as one flat list.'
      properties:
        quarters:
          description: Events by period.
          properties:
            overtime:
              description: 'Every overtime event in ONE flat list, newest first (no per-overtime split:
                separate multiple overtimes by the period start/end lines); the game-end line is here
                when there was overtime. Empty when none.'
              items:
                properties:
                  clock:
                    description: Game clock REMAINING in the period, 'mm:ss' (counts down from 10:00,
                      05:00 in overtime).
                    type: string
                  description:
                    description: 'Event text in LITHUANIAN, one fixed phrase per type/subtype: ''N taškų
                      metimas pataikytas / nepataikytas'' = N-point shot made / missed; ''Baudų metimas
                      N iš M pataikytas / pramestas'' = free throw N of M made / missed; ''Atkovotas kamuolys
                      gynyboje / puolime'' = defensive / offensive rebound; ''Rezultatyvus perdavimas''
                      = assist; ''Perimtas kamuolys'' = steal; ''Blokas'' = block; ''Asmeninė pražanga''
                      = personal foul; ''Pražanga puolime'' = offensive foul; ''Techninė pražanga (suoleliui)''
                      = technical foul (on the bench); ''Išprovokuota pražanga'' = foul drawn; ''Blogas
                      perdavimas'' = bad pass; ''Kamuolio valdymo klaida'' = ball-handling error; ''Puolimo
                      klaida'' = offensive turnover; ''Kamuolys už aikštelės ribų'' = ball out of bounds;
                      ''Žingsniai'' = travelling; ''N sekundžių pažeidimas'' = N-second violation; ''Įeina
                      į aikštelę / Išeina iš aikštelės'' = substitution in / out; ''Pilna minutės pertraukėlė''
                      = full timeout; ''Minutės pertraukėlė'' = official timeout; ''Ginčo kamuolys kėlinio
                      pradžioje / laimėtas / pralaimėtas'' = jump ball at the period start / won / lost;
                      ''Trenerio iššūkis – pražanga (atmestas)'' = coach''s challenge on a foul (rejected;
                      ''priimtas'' = accepted); ''Kėlinys prasidėjo / baigėsi'' = period started / ended;
                      ''Rungtynės prasidėjo / baigėsi'' = game started / ended.'
                    type: string
                  is_home:
                    description: True = the home team's event (teams_info.home), false = away. Also false
                      on game-level lines (game end).
                    type: boolean
                  is_points_info:
                    description: True on lines that changed the score (made shots and free throws).
                    type: boolean
                  player:
                    description: The acting player; all three fields null on team / period / game lines.
                    properties:
                      image:
                        description: Player photo URL (http://lkl.lt/media/players/responsive_width_600px/{hash}.png;
                          http, not https). Null on team lines.
                        type:
                        - string
                        - 'null'
                      name:
                        description: Full player name; null on team / period / game lines.
                        type:
                        - string
                        - 'null'
                      slug:
                        description: 'Player slug (key space: lkl.lt persons; the {slug} of https://lkl.lt/zaidejai/{slug};
                          stable across seasons). Join key to the game page players.*[].slug (and through
                          it to the player id). Null on team lines.'
                        type:
                        - string
                        - 'null'
                    type: object
                  score:
                    description: Score AFTER the event (on every line, not only scoring lines).
                    properties:
                      away:
                        description: Away points after the event (integer).
                        type: integer
                      home:
                        description: Home points after the event (integer).
                        type: integer
                    type: object
                  subtype:
                    description: 'Event subtype (English code; '''' when none). 2pt/3pt: shot kind (jumpshot,
                      layup, drivinglayup, reverselayup, dunk, alleyoop, alleyoopdunk, tipinlayup, tipindunk,
                      hookshot, fadeaway, floatingjumpshot, pullupjumpshot, stepbackjumpshot, turnaroundjumpshot,
                      eurostep). freethrow: ''NofM'' (1of2 = first of two). rebound: offensive / defensive.
                      foul: personal, offensive, technical, benchTechnical. turnover: badpass, ballhandling,
                      offensive, outofbounds, travel, 3sec, 24sec. substitution: in / out. timeout: full
                      (team), officials. jumpball: startperiod, won, lost. headcoachchallenge: the challenged
                      call (foul, outofbounds). period / game: start, end.'
                    type: string
                  success:
                    description: 'Shots and free throws: true = made. Every other type: always true.'
                    type: boolean
                  type:
                    description: 'Event type (English code): 2pt / 3pt (field-goal attempt), freethrow,
                      rebound, assist, steal, block, turnover, foul, foulon (foul drawn), substitution,
                      timeout, jumpball, headcoachchallenge, period, game.'
                    type: string
                type: object
              type: array
