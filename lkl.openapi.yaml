info:
  description: 'Lietuvos krepšinio lyga (LKL) game data from lkl.lt. The keyless JSON routes under /api/livestream
    serve, per game: box score, summary, leaders, team comparison and lead chart, score line (every season
    back to 1993-94), and play-by-play plus a shot chart with x/y (2024-25 onward). Three server-rendered
    HTML routes are documented by the JSON record their capture parses: the game page (team and player
    ids, date, status), the paged results list of a season and the standings. Text is Lithuanian (glossaries
    in the descriptions). Seasons: the results list keys by an opaque season id (= the Genius LiveStats
    competitionId from 2016-17), the standings by a separate small id; the sdv season is the END year
    of the ''YYYY-YYYY'' label. robots.txt allows everything. Shapes from captures of 2026-10-12; x-unobserved
    = null in every sample. Not official or supported.'
  title: LKL (Lithuanian Basketball League) livestream API + lkl.lt game, results and standings pages
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /boxscore/{gameId}:
    get:
      description: 'Box score: per-player rows and team totals of both sides, plus team game totals. Sides:
        boxscore.home / .away are the game page''s teams_info.home / .away; gameStatistics is keyed by
        team id with no side marker.'
      operationId: get_lkl_boxscore
      parameters:
      - description: 'Game id (the {id} of https://lkl.lt/rungtynes/{id}; see the README id table). Box
          score, summary, leaders, game-stats and game-score answer for every LKL game back to 1993-94;
          play-by-play and shot chart are filled from 2024-25 (first game 11116) and are {"regular": [],
          "overtime": []} before. Unknown ids (6000, 9000) answer HTTP 404 text/html.'
        example: 11590
        in: path
        name: gameId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LklBoxScore'
          description: JSON body
        '404':
          description: 'Unknown game id: an HTML 404 page (text/html), not JSON.'
      security: []
      summary: 'Box score: per-player rows and team totals of both sides, plus team game totals'
  /game-score/{gameId}:
    get:
      description: 'Score and clock line. The clock line is not a state flag: old games keep ''1 KĖLINYS
        - 10:00'' after the final.'
      operationId: get_lkl_game_score
      parameters:
      - description: 'Game id (the {id} of https://lkl.lt/rungtynes/{id}; see the README id table). Box
          score, summary, leaders, game-stats and game-score answer for every LKL game back to 1993-94;
          play-by-play and shot chart are filled from 2024-25 (first game 11116) and are {"regular": [],
          "overtime": []} before. Unknown ids (6000, 9000) answer HTTP 404 text/html.'
        example: 11590
        in: path
        name: gameId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LklGameScore'
          description: JSON body
        '404':
          description: 'Unknown game id: an HTML 404 page (text/html), not JSON.'
      security: []
      summary: Score and clock line
  /game-stats/{gameId}:
    get:
      description: 'Statistics tab: team comparison bars and the lead chart per period. 2007-08 (game
        2000) carries 4 main rows, zero lead statistics and a flat lead chart (no event data then).'
      operationId: get_lkl_game_stats
      parameters:
      - description: 'Game id (the {id} of https://lkl.lt/rungtynes/{id}; see the README id table). Box
          score, summary, leaders, game-stats and game-score answer for every LKL game back to 1993-94;
          play-by-play and shot chart are filled from 2024-25 (first game 11116) and are {"regular": [],
          "overtime": []} before. Unknown ids (6000, 9000) answer HTTP 404 text/html.'
        example: 11590
        in: path
        name: gameId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LklGameStats'
          description: JSON body
        '404':
          description: 'Unknown game id: an HTML 404 page (text/html), not JSON.'
      security: []
      summary: 'Statistics tab: team comparison bars and the lead chart per period'
  /leaders/{gameId}:
    get:
      description: 'Leaders tab: top players of each side in six categories. Players are identified by
        slug and full name, no id.'
      operationId: get_lkl_leaders
      parameters:
      - description: 'Game id (the {id} of https://lkl.lt/rungtynes/{id}; see the README id table). Box
          score, summary, leaders, game-stats and game-score answer for every LKL game back to 1993-94;
          play-by-play and shot chart are filled from 2024-25 (first game 11116) and are {"regular": [],
          "overtime": []} before. Unknown ids (6000, 9000) answer HTTP 404 text/html.'
        example: 11590
        in: path
        name: gameId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LklLeaders'
          description: JSON body
        '404':
          description: 'Unknown game id: an HTML 404 page (text/html), not JSON.'
      security: []
      summary: 'Leaders tab: top players of each side in six categories'
  /loadResults:
    get:
      description: 'text/html, parsed by capture.py into the JSON record of x-parsed-schema (English keys).
        Keyless. Parsing rule: div.font-semibold.text-2xl day headers (''YYYY m. <month> D d. (<weekday>)'')
        then div.result-item: div.location (time, ''arena , city''), a[href*=/komandos/] x2 (strong =
        code, img alt = name), a[href*=/rungtynes/] (id, ''H - A'', the winner in <strong>); page links
        loadResults?page=N. Season scoping verified 2026-10-12 by diffing 49436, 39252 and 3090 (disjoint
        game ids; every date inside its season window). The capture refuses a list whose dates leave the
        season, whose pages are short, or whose games repeat across pages.'
      operationId: get_lkl_results
      parameters:
      - description: 'Results season id = the value of the /rezultatai select (key space: lkl.lt championships;
          49436 = 2026-27, 41936 = 2025-26, 39252 = 2024-25, 3090 = 2007-08; KMT cup seasons share it:
          49437 = KMT 2026-27). From 2016-17 (9225) it is the Genius LiveStats competitionId (leagueId
          110). An unknown id answers 200 with ''Informacija ruošiama'' and no games.'
        example: 49436
        in: query
        name: season
        required: true
        schema:
          type: integer
      - description: 'Page number, 1-based; 10 games a page, newest first. Past the last page: 200 with
          no games. Page size is fixed (per_page / perPage / limit are ignored).'
        example: 1
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: 'Team filter: a team id or ''-'' (all). The capture sends ''-''.'
        example: '-'
        in: query
        name: team
        required: false
        schema:
          type: string
      - description: 'Opponent filter: a team id or ''-'' (all). The capture sends ''-''.'
        example: '-'
        in: query
        name: opponent
        required: false
        schema:
          type: string
      - description: Month filter or '-' (all). The capture sends '-'.
        example: '-'
        in: query
        name: month
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
              x-parsed-schema:
                parser: lkl/tools/capture.py results_record
                rule: 'div.font-semibold.text-2xl day headers (''YYYY m. <month> D d. (<weekday>)'') then
                  div.result-item: div.location (time, ''arena , city''), a[href*=/komandos/] x2 (strong
                  = code, img alt = name), a[href*=/rungtynes/] (id, ''H - A'', the winner in <strong>);
                  page links loadResults?page=N'
                schema:
                  $ref: '#/components/schemas/LklResults'
          description: Server-rendered HTML (a full page for /rungtynes, a fragment for /loadResults and
            /loadStandings)
        '404':
          description: Unknown game / standings season id (HTML 404 page).
      security: []
      summary: Every played game of one season (all pages of the results list, merged)
    servers:
    - url: https://lkl.lt
  /loadStandings/{seasonId}:
    get:
      description: 'text/html, parsed by capture.py into the JSON record of x-parsed-schema (English keys).
        Keyless. Parsing rule: div.tab-c-ins[data-id=full|home|away|final] tables: th headers checked,
        td cells: Poz. | Komanda (a[href*=/komandos/]) | Rng. | Per. | Pr. | [Laim.% | Serija] | Tšk.
        vid. (two span.num) | Paskutinės 5 (span.bg-green / bg-red). UNSCOPED: the fragment carries no
        season echo; it is banked on the URL alone (capture.UNSCOPED).'
      operationId: get_lkl_standings
      parameters:
      - description: Standings season id = the value of the /turnyrine-lentele select (35 = 2026-27 ...
          24 = 1993-94; NOT the results season id). An unknown id answers HTTP 404.
        example: 35
        in: path
        name: seasonId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
              x-parsed-schema:
                parser: lkl/tools/capture.py parse_standings
                rule: 'div.tab-c-ins[data-id=full|home|away|final] tables: th headers checked, td cells:
                  Poz. | Komanda (a[href*=/komandos/]) | Rng. | Per. | Pr. | [Laim.% | Serija] | Tšk.
                  vid. (two span.num) | Paskutinės 5 (span.bg-green / bg-red)'
                schema:
                  $ref: '#/components/schemas/LklStandings'
          description: Server-rendered HTML (a full page for /rungtynes, a fragment for /loadResults and
            /loadStandings)
        '404':
          description: Unknown game / standings season id (HTML 404 page).
      security: []
      summary: Standings tables of one season (overall, home, away, final ranking)
    servers:
    - url: https://lkl.lt
  /play-by-play/{gameId}:
    get:
      description: 'Play-by-play (2024-25 onward), newest first, per period. ERA SPLIT: filled from 2024-25
        (first game 11116, 2024-09-21; the last 2023-24 game 11114 is empty). Before that the body is
        {"regular": [], "overtime": []} (regular is then an ARRAY, not an object) and the capture does
        not request it. Genius LiveStats data.json holds pbp for 2016-17 onward (README).'
      operationId: get_lkl_play_by_play
      parameters:
      - description: 'Game id (the {id} of https://lkl.lt/rungtynes/{id}; see the README id table). Box
          score, summary, leaders, game-stats and game-score answer for every LKL game back to 1993-94;
          play-by-play and shot chart are filled from 2024-25 (first game 11116) and are {"regular": [],
          "overtime": []} before. Unknown ids (6000, 9000) answer HTTP 404 text/html.'
        example: 11590
        in: path
        name: gameId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LklPlayByPlay'
          description: JSON body
        '404':
          description: 'Unknown game id: an HTML 404 page (text/html), not JSON.'
      security: []
      summary: Play-by-play (2024-25 onward), newest first, per period
  /rungtynes/{gameId}:
    get:
      description: 'text/html, parsed by capture.py into the JSON record of x-parsed-schema (English keys).
        Keyless. Parsing rule: <game-info-component> attributes: plain ones as strings, '':''-prefixed
        ones as JSON (HTML-unescaped); players-stats-columns / main-tabs / leaders-tabs dropped. The page
        renders this component only for played games: an unplayed game''s page has none and is refused.'
      operationId: get_lkl_game
      parameters:
      - description: 'Game id (the {id} of https://lkl.lt/rungtynes/{id}; see the README id table). Box
          score, summary, leaders, game-stats and game-score answer for every LKL game back to 1993-94;
          play-by-play and shot chart are filled from 2024-25 (first game 11116) and are {"regular": [],
          "overtime": []} before. Unknown ids (6000, 9000) answer HTTP 404 text/html.'
        example: 11590
        in: path
        name: gameId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
              x-parsed-schema:
                parser: lkl/tools/capture.py parse_game
                rule: '<game-info-component> attributes: plain ones as strings, '':''-prefixed ones as
                  JSON (HTML-unescaped); players-stats-columns / main-tabs / leaders-tabs dropped'
                schema:
                  $ref: '#/components/schemas/LklGamePage'
          description: Server-rendered HTML (a full page for /rungtynes, a fragment for /loadResults and
            /loadStandings)
        '404':
          description: Unknown game / standings season id (HTML 404 page).
      security: []
      summary: 'Game page: the game-info-component props (teams with ids, players with ids, date, venue,
        status)'
    servers:
    - url: https://lkl.lt
  /shot-chart/{gameId}:
    get:
      description: 'Shot chart (2024-25 onward): every field-goal attempt with x/y. ERA SPLIT as play-by-play:
        2024-25 onward. Free throws are not charted.'
      operationId: get_lkl_shot_chart
      parameters:
      - description: 'Game id (the {id} of https://lkl.lt/rungtynes/{id}; see the README id table). Box
          score, summary, leaders, game-stats and game-score answer for every LKL game back to 1993-94;
          play-by-play and shot chart are filled from 2024-25 (first game 11116) and are {"regular": [],
          "overtime": []} before. Unknown ids (6000, 9000) answer HTTP 404 text/html.'
        example: 11590
        in: path
        name: gameId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LklShotChart'
          description: JSON body
        '404':
          description: 'Unknown game id: an HTML 404 page (text/html), not JSON.'
      security: []
      summary: 'Shot chart (2024-25 onward): every field-goal attempt with x/y'
  /summary/{gameId}:
    get:
      description: 'Summary tab: team game totals, a team comparison, game leaders and broadcasts. gameStatistics
        is identical to /boxscore''s. comparison here is one flat 14-row list; /game-stats splits it into
        shooting / main / all.'
      operationId: get_lkl_summary
      parameters:
      - description: 'Game id (the {id} of https://lkl.lt/rungtynes/{id}; see the README id table). Box
          score, summary, leaders, game-stats and game-score answer for every LKL game back to 1993-94;
          play-by-play and shot chart are filled from 2024-25 (first game 11116) and are {"regular": [],
