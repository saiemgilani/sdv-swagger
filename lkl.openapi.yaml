components:
  schemas:
    LklBoxScore:
      description: 'Body of /boxscore/{gameId}: gameStatistics (team game totals keyed by team id) and
        boxscore (per-player and team rows of each side as {value[, percentage]} cells).'
      properties:
        boxscore:
          description: Box score of both sides.
          properties:
            away:
              description: 'The AWAY team''s box score (side by the game page: away = teams_info.away).'
              properties:
                players:
                  description: One row per away player who was on the team sheet, in the site's display
                    order (starters first); 9-17 rows.
                  items:
                    properties:
                      assists:
                        description: 'Cell: Assists (RP, Rezultatyvūs perdavimai).'
                        properties:
                          value:
                            description: The value (integer unless noted in the cell).
                            type: integer
                        type: object
                      blocks:
                        description: 'Cell: Blocks made (BL, Blokai).'
                        properties:
                          value:
                            description: The value (integer unless noted in the cell).
                            type: integer
                        type: object
                      blocks_received:
                        description: 'Cell: Shots of this player/team that were blocked (GB, Gauti blokai).'
                        properties:
                          value:
                            description: The value (integer unless noted in the cell).
                            type: integer
                        type: object
                      defensive_rebounds:
                        description: 'Cell: Defensive rebounds (AKG, Atkovoti kamuoliai gynyboje).'
                        properties:
                          value:
                            description: The value (integer unless noted in the cell).
                            type: integer
                        type: object
                      efficiency:
                        description: 'Cell: Efficiency rating (EF, Efektyvumas; see gameStatistics efficiency).'
                        properties:
                          value:
                            description: The value (integer unless noted in the cell).
                            type: integer
                        type: object
                      fg:
                        description: 'Cell: Field goals 2PT + 3PT (MŽ, Metimai iš žaidimo).'
                        properties:
                          percentage:
                            description: Percentage 0-100 as a string with ONE decimal ('63.6'); '0.0'
                              when there were no attempts.
                            type: string
                          value:
                            description: '''made/attempted'' as a string (''3/6'').'
                            type: string
                        type: object
                      fg2:
                        description: 'Cell: Two-point field goals (2TŠK, Dvitaškiai metimai).'
                        properties:
                          percentage:
                            description: Percentage 0-100 as a string with ONE decimal ('63.6'); '0.0'
                              when there were no attempts.
                            type: string
                          value:
                            description: '''made/attempted'' as a string.'
                            type: string
                        type: object
                      fg3:
                        description: 'Cell: Three-point field goals (3TŠK, Tritaškiai metimai).'
                        properties:
                          percentage:
                            description: Percentage 0-100 as a string with ONE decimal ('63.6'); '0.0'
                              when there were no attempts.
                            type: string
                          value:
                            description: '''made/attempted'' as a string.'
                            type: string
                        type: object
                      fouls:
                        description: 'Cell: Personal fouls committed (AP, Asmeninės pražangos).'
                        properties:
                          value:
                            description: The value (integer unless noted in the cell).
                            type: integer
                        type: object
                      fouls_on:
                        description: 'Cell: Fouls drawn (IP, Išprovokuotos pražangos).'
                        properties:
                          value:
                            description: The value (integer unless noted in the cell).
                            type: integer
                        type: object
                      ft:
                        description: 'Cell: Free throws (BM, Baudų metimai).'
                        properties:
                          percentage:
                            description: Percentage 0-100 as a string with ONE decimal ('63.6'); '0.0'
                              when there were no attempts.
                            type: string
                          value:
                            description: '''made/attempted'' as a string; ''0/0'' when none.'
                            type: string
                        type: object
                      is_active:
                        description: False in every sample, finished games included; by name the player
                          is on court right now (live games), unverified.
                        type: boolean
                      is_captain:
                        description: True for the team captain.
                        type: boolean
                      is_starter:
                        description: True for the five starters.
                        type: boolean
                      jersey:
                        description: 'Cell: Shirt number, a STRING (''77''); page column # (Marškinėlių
                          numeris).'
                        properties:
                          value:
                            description: 'Shirt number, a STRING (''77''); page column # (Marškinėlių
                              numeris).'
                            type: string
                        type: object
                      name:
                        description: 'Cell: Short name ''I. Surname'' (''M. Paliukėnas''); page column
                          Žaidėjas (player).'
                        properties:
                          value:
                            description: Short name 'I. Surname' ('M. Paliukėnas'); page column Žaidėjas
                              (player).
                            type: string
                        type: object
                      offensive_rebounds:
                        description: 'Cell: Offensive rebounds (AKP, Atkovoti kamuoliai puolime).'
                        properties:
                          value:
                            description: The value (integer unless noted in the cell).
                            type: integer
                        type: object
                      plus_minus:
                        description: 'Cell: Plus/minus while on court (+/- rodiklis), signed integer;
                          null on the team row.'
                        properties:
                          value:
                            description: The value (integer unless noted in the cell).
                            type: integer
                        type: object
                      points:
                        description: 'Cell: Points (TŠK, Taškai).'
                        properties:
                          value:
                            description: The value (integer unless noted in the cell).
                            type: integer
                        type: object
                      slug:
                        description: 'Player slug (key space: lkl.lt persons; the {slug} of https://lkl.lt/zaidejai/{slug};
                          stable across seasons). Join key to the game page players.*[].slug (and through
                          it to the player id).'
                        type: string
                      steals:
                        description: 'Cell: Steals (PK, Perimti kamuoliai).'
                        properties:
                          value:
                            description: The value (integer unless noted in the cell).
                            type: integer
                        type: object
                      time:
                        description: 'Cell: Time played ''mm:ss'' (MIN, Minutės); the team row sums all
                          players, so minutes exceed 59 (''200:00'').'
                        properties:
                          value:
                            description: Time played 'mm:ss' (MIN, Minutės); the team row sums all players,
                              so minutes exceed 59 ('200:00').
                            type: string
                        type: object
                      total_rebounds:
                        description: 'Cell: Total rebounds (AK, Atkovoti kamuoliai).'
                        properties:
                          value:
                            description: The value (integer unless noted in the cell).
                            type: integer
                        type: object
                      turnovers:
                        description: 'Cell: Turnovers (KL, Klaidos).'
                        properties:
                          value:
                            description: The value (integer unless noted in the cell).
                            type: integer
                        type: object
                    type: object
                  type: array
