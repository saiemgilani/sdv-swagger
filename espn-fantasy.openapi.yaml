info:
  description: 'Public, unauthenticated reads of ESPN''s fantasy platform: games, seasons, pro-team schedules,
    the player universe, ESPN''s public-league directory and default settings, public leagues by id (teams,
    rosters, matchups, box scores, scoring settings, draft, transactions, player pool) and player news.
    Private leagues need the owner''s espn_s2/SWID cookies and are out of scope. Shapes come from committed,
    redacted captures in espn-fantasy/captures/ (member account ids and team names replaced). Not official
    or supported.'
  title: ESPN Fantasy read API (lm-api-reads.fantasy.espn.com)
  version: '2026-11-26'
  x-espn-schema-source: captured-bodies
openapi: 3.1.0
paths:
  /games:
    get:
      operationId: games
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Games'
          description: OK
        '400':
          description: Bad view/filter (body {messages, details}).
        '401':
          description: Private league (needs the owner's cookies; out of scope).
        '404':
          description: Unknown game, season or id.
      summary: Every fantasy game with its current season.
      x-captured:
        games:
        - all
  /games/{game}/news/players:
    get:
      operationId: games_game_news_players
      parameters:
      - description: 'Fantasy game: ffl (football), fba (men''s basketball), flb (baseball), fhl (hockey),
          wfba (women''s basketball).'
        example: fba
        in: path
        name: game
        required: true
        schema:
          enum:
          - ffl
          - fba
          - flb
          - fhl
          - wfba
          type: string
      - description: Player id.
        example: 4066261
        in: query
        name: playerId
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesGameNewsPlayers'
          description: OK
        '400':
          description: Bad view/filter (body {messages, details}).
        '401':
          description: Private league (needs the owner's cookies; out of scope).
        '404':
          description: Unknown game, season or id.
      summary: Fantasy news feed for one player (site.api.espn.com).
      x-captured:
        player_news:
        - fba
        - ffl
        - fhl
        - flb
        - wfba
    servers:
    - url: https://site.api.espn.com/apis/fantasy/v3
  /games/{game}/seasons:
    get:
      operationId: games_game_seasons
      parameters:
      - description: 'Fantasy game: ffl (football), fba (men''s basketball), flb (baseball), fhl (hockey),
          wfba (women''s basketball).'
        example: fba
        in: path
        name: game
        required: true
        schema:
          enum:
          - ffl
          - fba
          - flb
          - fhl
          - wfba
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesGameSeasons'
          description: OK
        '400':
          description: Bad view/filter (body {messages, details}).
        '401':
          description: Private league (needs the owner's cookies; out of scope).
        '404':
          description: Unknown game, season or id.
      summary: Seasons of one fantasy game.
      x-captured:
        seasons:
        - fba
        - ffl
        - fhl
        - flb
        - wfba
  /games/{game}/seasons/{season}:
    get:
      operationId: games_game_seasons_season
      parameters:
      - description: 'Fantasy game: ffl (football), fba (men''s basketball), flb (baseball), fhl (hockey),
          wfba (women''s basketball).'
        example: fba
        in: path
        name: game
        required: true
        schema:
          enum:
          - ffl
          - fba
          - flb
          - fhl
          - wfba
          type: string
      - description: 'ESPN''s season id: take it from /games/{game}/seasons (id) or /games (currentSeasonId).
          It is the start year for ffl (2026 = fall 2026) and the end year for fba/fhl (2026-27 = 2027);
          flb and wfba use that one year (2026). Do not derive it from startDate or endDate: those are
          ESPN''s platform windows, not the sport''s season.'
        example: 2027
        in: path
        name: season
        required: true
        schema:
          type: integer
      - description: Named projection of the resource; repeat the key for several views.
        explode: true
        in: query
        name: view
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesGameSeasonsSeason'
          description: OK
        '400':
          description: Bad view/filter (body {messages, details}).
        '401':
          description: Private league (needs the owner's cookies; out of scope).
        '404':
          description: Unknown game, season or id.
      summary: One season of a game; with view=proTeamSchedules_wl the pro teams, byes and pro-game schedule.
      x-captured:
        pro_team_schedules:
        - fba
        - ffl
        - fhl
        - flb
        - wfba
      x-view-keys:
        proTeamSchedules_wl:
        - display
        - settings
      x-views:
      - proTeamSchedules_wl
      - kona_game_state
  /games/{game}/seasons/{season}/leaguedirectory/{league_sub_type}:
    get:
      operationId: games_game_seasons_season_leaguedirectory_league_sub_type
      parameters:
      - description: 'Fantasy game: ffl (football), fba (men''s basketball), flb (baseball), fhl (hockey),
          wfba (women''s basketball).'
        example: fba
        in: path
        name: game
        required: true
        schema:
          enum:
          - ffl
          - fba
          - flb
          - fhl
          - wfba
          type: string
      - description: 'ESPN''s season id: take it from /games/{game}/seasons (id) or /games (currentSeasonId).
          It is the start year for ffl (2026 = fall 2026) and the end year for fba/fhl (2026-27 = 2027);
          flb and wfba use that one year (2026). Do not derive it from startDate or endDate: those are
          ESPN''s platform windows, not the sport''s season.'
        example: 2027
        in: path
        name: season
        required: true
        schema:
          type: integer
      - description: 'Directory to list: DRAFT_LOBBY (ESPN-run public leagues with an upcoming or running
          draft), MOCKDRAFT_LOBBY (mock-draft rooms).'
        example: DRAFT_LOBBY
        in: path
        name: league_sub_type
        required: true
        schema:
          enum:
          - DRAFT_LOBBY
          - MOCKDRAFT_LOBBY
          - CUSTOM_MOCK
          - NONE
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesGameSeasonsSeasonLeaguedirectoryLeagueSubType'
          description: OK
        '400':
          description: Bad view/filter (body {messages, details}).
        '401':
          description: Private league (needs the owner's cookies; out of scope).
        '404':
          description: Unknown game, season or id.
      summary: ESPN's public-league directory (the public draft lobby).
      x-captured:
        league_directory:
        - fba
        - ffl
        - fhl
        - flb
        - wfba
  /games/{game}/seasons/{season}/players:
    get:
      operationId: games_game_seasons_season_players
      parameters:
      - description: 'Fantasy game: ffl (football), fba (men''s basketball), flb (baseball), fhl (hockey),
          wfba (women''s basketball).'
        example: fba
        in: path
        name: game
        required: true
        schema:
          enum:
