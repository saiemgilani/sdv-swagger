          type: string
      - description: 'ESPN''s season id: take it from /games/{game}/seasons (id) or /games (currentSeasonId).
          It is the start year for ffl (2026 = fall 2026) and the end year for fba/fhl (2026-27 = 2027);
          flb and wfba use that one year (2026). Do not derive it from startDate or endDate: those are
          ESPN''s platform windows, not the sport''s season.'
        example: 2027
        in: path
        name: season
        required: true
        schema:
          type: integer
      - description: Named projection of the resource; repeat the key for several views.
        explode: true
        in: query
        name: view
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: JSON object sent as the X-Fantasy-Filter request header. It narrows list members
          of the body, e.g. {"players":{"limit":25,"sortPercOwned":{"sortPriority":1,"sortAsc":false}}}.
          A "limit" must be accompanied by a sort or the host answers 400 FILTER_LIMIT_MISSING_SORT.
        in: header
        name: X-Fantasy-Filter
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesGameSeasonsSeasonPlayers'
          description: OK
        '400':
          description: Bad view/filter (body {messages, details}).
        '401':
          description: Private league (needs the owner's cookies; out of scope).
        '404':
          description: Unknown game, season or id.
      summary: Player universe for a season (view=players_wl); filter filterActive for active players
        only.
      x-captured:
        players:
        - fba
        - ffl
        - fhl
        - flb
        - wfba
      x-view-keys:
        players_wl: []
      x-views:
      - players_wl
