                type: string
              year_id:
                description: Season END year as a string (2026 = 2025-26); echoes `cYear`.
                type: string
            type: object
          type: array
      type: object
    PlayerStatsByIdResponse:
      properties:
        player:
          description: 'One row: the player''s season totals, or per-game averages when isAverages=true.'
