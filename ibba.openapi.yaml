      description: 'Body: {"games": [rows]}. team1 = home, team2 = away. ExternalID is the Segev game
        id from 2025-26 (empty before). The 2004-05 rows lack venue, time and referees.'
      operationId: Games
      parameters:
      - description: 'Board (competition) id: 5 league, 10 cup, ... (code table in ibba-returns.md); 0
          = all boards.'
