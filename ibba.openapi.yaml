components:
  schemas:
    BoardsExResponse:
      properties:
        boards-ex:
          description: External competitions the club played in (European cups, national team, pre-season).
          items:
            properties:
              ig_board:
                description: External board id (1001+; a separate key space from the domestic BOARD_ID;
                  code table in ibba-returns.md). = GamesEx `BOARD_ID`.
                type: string
              o_comp_name:
                description: Competition name, Hebrew, HTML-entity encoded (&quot; &#39; &amp;) ('יורוליג'
                  = EuroLeague).
                type: string
            type: object
          type: array
      type: object
    BoardsResponse:
      properties:
        boards:
          description: Domestic boards (competitions) of the season.
          items:
            properties:
              BOARD_ID:
                description: 'Board id (code table in ibba-returns.md: 5 league, 10 cup, 16/26/17 playoff
                  rounds, 33 play-in, 34 Supercup, 11 = 2004-05 semifinal group).'
                type: string
              category_name:
                description: 'Board format, Hebrew: ''טבלה'' = table (standings), ''נוק אאוט'' = knockout,
                  ''סדרה'' = best-of series.'
                type: string
              h_type:
                description: Board group name, Hebrew ('ליגת העל' = Premier League; 'גביע הליגה' = League
                  Cup); translations in ibba-returns.md.
                type: string
              type:
                description: Board display name with sponsor, Hebrew ('ליגת Winner סל' = Winner League).
                type: string
              year_id:
                description: Season END year as a string (2026 = 2025-26); echoes `cYear`.
                type: string
            type: object
          type: array
      type: object
    BoxscoreResponse:
      properties:
        boxscore:
          description: 'Box-score rows: per team a ''_TEAM'' row (team rebounds/turnovers credited to
            no player), the player rows, then a ''TOTAL'' row.'
          items:
            properties:
              VAL:
                description: 'Efficiency rating (verified: = Segev `rate` for game 26392 / Segev 50);
                  ''-1'' on 2004-05 _TEAM rows.'
                type: string
              assists:
                description: Assists.
                type: string
              block_against:
                description: Own shots that were blocked.
                type: string
              blocks_for:
                description: Shots this player or team blocked.
                type: string
              board:
                description: Board id of the game (5 = league).
                type: string
              defensive_reb:
                description: Defensive rebounds.
                type: string
              dunk:
                description: Dunks made.
                type: string
              fouls_against:
                description: 'Fouls DRAWN: fouls opponents committed against this player or team (verified:
                  = Segev f_drawn, game 26392 / Segev 50).'
                type: string
              fouls_for:
                description: 'Fouls COMMITTED by this player or team (verified: = Segev f, game 26392
                  / Segev 50).'
                type: string
              game_id:
                description: IBBA game id (basket.co.il game key space). Joins Games `game_id` to Boxscore
                  `game_id`; the `game_id` param.
                type: string
              jersy:
                description: Jersey number as a string, zero-padded ('02'; sic 'jersy'); '_TEAM' and 'TOTAL'
                  on the two non-player rows.
                type: string
              minutes:
                description: Minutes played, whole minutes; the TOTAL row has the team's player-minutes
                  (200 in regulation, 25 more per overtime).
                type: string
              offensive_reb:
                description: Offensive rebounds.
                type: string
              p1:
                description: Free-throw percentage, 0-100.
                type: string
              p11:
                description: Free throws made.
                type: string
              p12:
                description: Free throws attempted.
                type: string
              p2:
                description: 2-point field-goal percentage, 0-100 (integer in a box score, 2 decimals
                  in season stats).
                type: string
              p21:
                description: 2-point field goals made.
                type: string
              p22:
                description: '2-point field goals attempted (verified: = Segev fg_2m + fg_2mis for game
                  26392 / Segev 50).'
                type: string
              p3:
                description: 3-point field-goal percentage, 0-100.
                type: string
              p31:
                description: 3-point field goals made.
                type: string
              p32:
                description: 3-point field goals attempted.
                type: string
              player_year_id:
                description: Player-season id (IBBA player-season key space). Joins Players/PlayerById
                  `player_id` to Boxscore `player_year_id` (every box player of game 26392 is on the Players
                  roster). '0' on the _TEAM and TOTAL rows.
                type: string
              plusminus:
                description: Plus-minus; '0' on every row of the 2004-05 sample (not recorded then, inferred).
                type: string
              pts:
                description: Points.
                type: string
              round:
                description: Round (game number) within the board.
                type: string
              starter:
                description: '''1'' if the player started, else ''0''.'
                type: string
              steals:
                description: Steals.
                type: string
              team_id:
                description: 'Team-season id (IBBA team-season key space: a new id every season for the
                  same club, e.g. Maccabi Tel Aviv = 1109 in 2025-26 and 2111 in 2026-27). Joins to Teams
                  `team_year_id`; the `team_id` param.'
                type: string
              total_reb:
                description: Total rebounds.
                type: string
              tournovers:
                description: Turnovers (sic 'tournovers').
                type: string
              year_id:
                description: Season END year as a string (2026 = 2025-26); echoes `cYear`.
                type: string
            type: object
          type: array
      type: object
    CoachesResponse:
      properties:
        coaches:
          description: Coaching staff of the team-season.
          items:
            properties:
              birth_date:
                description: 'Coach''s date of birth: REDACTED in the committed samples (personal data).'
                type: string
              cType:
                description: 'Role: ''1'' head coach, ''2'' assistant coach (observed).'
                type: string
              coach_id:
                description: Coach id (IBBA coach key space).
                type: string
              isReplaced:
                description: '''True'' when the person left the team during the season (replaced), else
                  ''False''.'
                type: string
              mOrder:
                description: Display order ('1' on every sample row).
                type: string
              name:
                description: Name, Hebrew, HTML-entity encoded (&quot; &#39; &amp;).
                type: string
              name_eng:
                description: Name, English, HTML-entity encoded (&quot; &#39; &amp;).
                type: string
              pic:
                description: Photo, path relative to https://www.basket.co.il; empty when none.
                type: string
              team_id:
                description: 'Team-season id (IBBA team-season key space: a new id every season for the
                  same club, e.g. Maccabi Tel Aviv = 1109 in 2025-26 and 2111 in 2026-27). Joins to Teams
                  `team_year_id`; the `team_id` param.'
                type: string
              year_id:
                description: Season END year as a string (2026 = 2025-26); echoes `cYear`.
                type: string
            type: object
          type: array
      type: object
    ConfigurationResponse:
      properties:
        settings:
          description: One settings row.
          items:
            properties:
              ActiveComp:
                description: Board id the site treats as the active competition (17 = final series for
                  2025-26, 5 = league for 2004-05). Inferred.
                type: string
              Current_Year:
                description: Season END year the settings are for (echoes `cYear`).
                type: string
              Current_Year_Full:
                description: Season label 'YYYY-YY' ('2025-26').
                type: string
              TotalGN:
                description: Rounds in the regular season (32 in 2025-26, 22 in 2004-05). Inferred.
                type: string
              nextGN:
                description: Next round (game number) to be played. Inferred.
                type: string
              red_line:
                description: Standings position the site draws its cut line under (12 in 2025-26, 10 in
                  2004-05). Meaning inferred, unverified.
                type: string
            type: object
          type: array
      type: object
    GamesByTeamResponse:
      properties:
        games:
          description: 'Every game of the club in the season: domestic boards and external boards (1001+).'
          items:
            properties:
              BOARD_ID:
                description: 'Board (competition) id: the domestic table (5 league, 10 cup, ...) or an
                  external board (1001+); code tables in ibba-returns.md.'
                type: string
              ExternalID:
                description: Segev Stats game id (the Segev `game_id`, a string) for league games from
                  2025-26; empty before. For pre-season games (board 1005) a news URL instead.
                type: string
              PlaceOfGameHeb:
                description: Venue, Hebrew, HTML-entity encoded (&quot; &#39; &amp;).
                type: string
              TimeOfGame:
                description: 'Tip-off ''HH:MM'', local Israel time; empty in 2004-05. Can disagree with
                  Segev `time` (game 26646: 20:15 here, 19:30 in Segev 419).'
                type: string
              board_name:
                description: Board name, Hebrew, HTML-entity encoded (&quot; &#39; &amp;) ('ליגת Winner
                  סל' = Winner League).
                type: string
              gameNumber:
                description: Round number within the board; empty for external games.
                type: string
              game_date_txt:
                description: Game date 'dd/mm/yyyy' (local Israel date).
                type: string
              game_id:
                description: IBBA game id (basket.co.il game key space). Joins Games `game_id` to Boxscore
                  `game_id`; the `game_id` param.
                type: string
              overtime:
                description: '''True'' when the game went to overtime, else ''False''.'
                type: string
              score_team1:
                description: Home final score; '0' before the game is played.
                type: string
              score_team2:
                description: Away final score; '0' before the game is played.
                type: string
              team1:
                description: 'Home team-season id (team1 = home: verified against Segev homeTeam for games
                  26392 and 26646). In GamesByTeam rows of external boards (1001+) an external-team id
                  instead (see GamesEx `ig_team_1`).'
                type: string
              team1_logo:
                description: Home team logo, absolute URL.
                type: string
              team1_name:
                description: Home team name, Hebrew, HTML-entity encoded (&quot; &#39; &amp;).
                type: string
              team2:
                description: Away team-season id. In GamesByTeam rows of external boards an external-team
                  id.
                type: string
              team2_logo:
                description: Away team logo, absolute URL.
                type: string
              team2_name:
                description: Away team name, Hebrew, HTML-entity encoded (&quot; &#39; &amp;).
                type: string
              tickets_url:
                description: Ticketing URL; empty when none.
                type: string
              total_ot:
                description: Number of overtime periods.
                type: string
              year_id:
                description: Season END year as a string (2026 = 2025-26); echoes `cYear`.
                type: string
            type: object
          type: array
      type: object
    GamesExResponse:
      properties:
        games_ex:
          description: The club's games in external competitions.
          items:
            properties:
              BOARD_ID:
                description: External board id (= BoardsEx `ig_board`).
                type: string
              board_name:
                description: External competition name, Hebrew, HTML-entity encoded (&quot; &#39; &amp;).
                type: string
              game_id:
                description: External-game id (IBBA external-game key space, shared with GamesByTeam rows
                  of boards 1001+, e.g. 8888; not a Boxscore key).
                type: string
              ig_date:
                description: Game date 'dd/mm/yyyy'.
                type: string
              ig_gn:
                description: Game number; empty when none.
                type: string
              ig_place:
                description: Venue, Hebrew, HTML-entity encoded (&quot; &#39; &amp;).
                type: string
              ig_score_team_1:
                description: Home score.
                type: string
              ig_score_team_2:
                description: Away score.
                type: string
              ig_team_1:
                description: Home external-team id (external-team key space, e.g. 120 = Maccabi Tel Aviv;
                  not a team-season id).
                type: string
              ig_team_2:
                description: Away external-team id.
                type: string
              ig_time:
                description: Tip-off 'HH:MM', local time.
                type: string
              team1_logo:
                description: Home team logo, absolute URL.
                type: string
              team1_name:
                description: Home team name, Hebrew, HTML-entity encoded (&quot; &#39; &amp;).
                type: string
              team2_logo:
                description: Away team logo, absolute URL.
                type: string
              team2_name:
                description: Away team name, Hebrew, HTML-entity encoded (&quot; &#39; &amp;).
                type: string
              year_id:
                description: Season END year as a string (2026 = 2025-26); echoes `cYear`.
                type: string
            type: object
          type: array
      type: object
    GamesResponse:
      properties:
        games:
          description: Games matching every non-zero filter (0 = any).
          items:
            properties:
              BOARD_ID:
                description: 'Board (competition) id: the domestic table (5 league, 10 cup, ...) or an
