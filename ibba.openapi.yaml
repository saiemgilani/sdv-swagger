        in: query
        name: board_round
        required: true
        schema:
          format: int32
          type: integer
      - description: Team-season id (Teams `team_year_id`); 0 = all teams.
        example: 0
        in: query
        name: team_id
        required: true
        schema:
          format: int32
          type: integer
      - description: Club id (Teams `TeamUID`); 0 = all clubs. Not echoed in the body.
        example: 0
        in: query
