info:
  description: 'Reverse-engineered, unofficial. ASP.NET web service (HttpGet binding) behind basket.co.il;
    keyless. Every WSDL parameter is required. `cYear` = season END year. Strings everywhere, Hebrew HTML-entity
    encoded. Segev Stats play-by-play for the same games: ibba-segev.openapi.yaml (game_id = Games.ExternalID).'
  title: Israel Basketball Association (basket.co.il) ASMX JSON API
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /Boards:
    get:
      description: 'Body: {"boards": [rows]}. Board ids recur across seasons with the same meaning (5
        = league in 2004-05 and 2025-26); the set differs by season (11 exists only in the 2004-05 format;
        33 play-in and 34 Supercup are recent).'
      operationId: Boards
      parameters:
      - description: Season END year (2026 = 2025-26; 2005 = 2004-05, the earliest verified). Required
          on every op that takes it.
        example: 2026
        in: query
        name: cYear
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardsResponse'
          description: The rows (an unknown id answers 200 with an EMPTY body, not JSON).
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'A missing or unparsable parameter: a text/plain .NET stack trace (''Missing parameter:
            cYear.''). Deterministic; do not retry.'
      summary: 'Competitions (boards) of a season: league, cup, playoff rounds, play-in, Supercup'
  /BoardsEx:
    get:
      description: 'Body: {"boards-ex": [rows]}. The body echoes neither `team_uid` nor `cYear`: the sample
        cannot be scope-checked (README).'
      operationId: BoardsEx
      parameters:
      - description: Club id (Teams `TeamUID`); 0 = all clubs. Not echoed in the body.
        example: 10
        in: query
        name: team_uid
        required: true
        schema:
          format: int32
          type: integer
      - description: Season END year (2026 = 2025-26; 2005 = 2004-05, the earliest verified). Required
          on every op that takes it.
        example: 2026
        in: query
        name: cYear
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardsExResponse'
          description: The rows (an unknown id answers 200 with an EMPTY body, not JSON).
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'A missing or unparsable parameter: a text/plain .NET stack trace (''Missing parameter:
            cYear.''). Deterministic; do not retry.'
      summary: External competitions (European cups, national team, pre-season)
      x-unscoped-params:
      - team_uid
      - cYear
  /Boxscore:
    get:
      description: 'Body: {"boxscore": [rows]}. No player names: join `player_year_id` to Players `player_id`.
        Every number is a string. 2004-05 rows carry plusminus ''0'' and dunk ''0'' throughout (not recorded
        then, inferred). An unknown game_id answers HTTP 200 with an EMPTY body.'
      operationId: Boxscore
      parameters:
      - description: IBBA game id; 0 = all games.
        example: 26392
        in: query
        name: game_id
        required: true
        schema:
          format: int32
          type: integer
      - description: Season END year (2026 = 2025-26; 2005 = 2004-05, the earliest verified). Required
          on every op that takes it.
        example: 2026
        in: query
        name: cYear
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoxscoreResponse'
          description: The rows (an unknown id answers 200 with an EMPTY body, not JSON).
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'A missing or unparsable parameter: a text/plain .NET stack trace (''Missing parameter:
            cYear.''). Deterministic; do not retry.'
      summary: 'Box score of a game: player rows plus _TEAM and TOTAL rows per team'
  /Coaches:
    get:
      description: 'Body: {"coaches": [rows]}. Dates of birth are redacted in the committed samples.'
      operationId: Coaches
      parameters:
      - description: Team-season id (Teams `team_year_id`); 0 = all teams.
        example: 1109
        in: query
        name: team_id
        required: true
        schema:
          format: int32
          type: integer
      - description: Club id (Teams `TeamUID`); 0 = all clubs. Not echoed in the body.
        example: 10
        in: query
        name: team_uid
        required: true
        schema:
          format: int32
          type: integer
      - description: Season END year (2026 = 2025-26; 2005 = 2004-05, the earliest verified). Required
          on every op that takes it.
        example: 2026
        in: query
        name: cYear
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
