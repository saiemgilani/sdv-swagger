      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesResponse'
          description: The rows (an unknown id answers 200 with an EMPTY body, not JSON).
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'A missing or unparsable parameter: a text/plain .NET stack trace (''Missing parameter:
            cYear.''). Deterministic; do not retry.'
      summary: Games (schedule and results) filtered by board, round, team, game
      x-unscoped-params:
      - board_round
      - team_uid
  /GamesByTeam:
    get:
      description: 'Body: {"games": [rows]}. Mixes domestic boards (team-season ids) and external boards
        1001+ (external-team ids; ExternalID can be a news URL).'
      operationId: GamesByTeam
      parameters:
      - description: Club id (Teams `TeamUID`); 0 = all clubs. Not echoed in the body.
        example: 10
        in: query
        name: team_uid
        required: true
