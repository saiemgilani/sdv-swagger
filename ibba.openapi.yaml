          description: 'A missing or unparsable parameter: a text/plain .NET stack trace (''Missing parameter:
            cYear.''). Deterministic; do not retry.'
      summary: Every game of a club in a season, domestic and external
      x-unscoped-params:
      - team_uid
  /GamesEx:
    get:
      description: 'Body: {"games_ex": [rows]}. Team ids here are external-team ids (120 = Maccabi Tel
        Aviv), not team-season ids.'
      operationId: GamesEx
      parameters:
      - description: 'Board (competition) id: 5 league, 10 cup, ... (code table in ibba-returns.md); 0
