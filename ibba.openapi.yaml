                type: string
              PlaceOfGame:
                description: Venue, English, HTML-entity encoded (&quot; &#39; &amp;).
                type: string
              PlaceOfGameHeb:
                description: Venue, Hebrew, HTML-entity encoded (&quot; &#39; &amp;).
                type: string
              Ref:
                description: Referees' names, Hebrew, comma-separated (', , ' when unknown).
                type: string
              TimeOfGame:
                description: 'Tip-off ''HH:MM'', local Israel time; empty in 2004-05. Can disagree with
                  Segev `time` (game 26646: 20:15 here, 19:30 in Segev 419).'
                type: string
              board_name:
                description: Board name, Hebrew, HTML-entity encoded (&quot; &#39; &amp;) ('ליגת Winner
                  סל' = Winner League).
                type: string
              board_name_eng:
                description: Board name, English ('Winner League').
                type: string
              gameNumber:
                description: Round number within the board; empty for external games.
                type: string
              game_date_txt:
                description: Game date 'dd/mm/yyyy' (local Israel date).
                type: string
              game_id:
                description: IBBA game id (basket.co.il game key space). Joins Games `game_id` to Boxscore
                  `game_id`; the `game_id` param.
                type: string
              overtime:
                description: '''True'' when the game went to overtime, else ''False''.'
                type: string
              score_by_q_1:
                description: Home points per quarter, pipe-separated ('18|23|30|21').
                type: string
              score_by_q_2:
                description: Away points per quarter, pipe-separated.
                type: string
              score_team1:
                description: Home final score; '0' before the game is played.
                type: string
              score_team2:
                description: Away final score; '0' before the game is played.
                type: string
              team1:
                description: 'Home team-season id (team1 = home: verified against Segev homeTeam for games
                  26392 and 26646). In GamesByTeam rows of external boards (1001+) an external-team id
                  instead (see GamesEx `ig_team_1`).'
                type: string
              team1_logo:
                description: Home team logo, absolute URL.
                type: string
              team1_name:
                description: Home team name, Hebrew, HTML-entity encoded (&quot; &#39; &amp;).
                type: string
              team1_name_eng:
                description: Home team name, English.
                type: string
              team2:
                description: Away team-season id. In GamesByTeam rows of external boards an external-team
                  id.
                type: string
              team2_logo:
                description: Away team logo, absolute URL.
                type: string
              team2_name:
                description: Away team name, Hebrew, HTML-entity encoded (&quot; &#39; &amp;).
                type: string
              team2_name_eng:
                description: Away team name, English.
                type: string
              tickets_url:
                description: Ticketing URL; empty when none.
                type: string
              total_ot:
                description: Number of overtime periods.
                type: string
              total_viewers:
                description: Attendance; '0' when unknown.
                type: string
              year_id:
                description: Season END year as a string (2026 = 2025-26); echoes `cYear`.
                type: string
            type: object
          type: array
      type: object
    LeaderByTypeResponse:
      properties:
        leaders:
          description: Top five players in the category.
          items:
            properties:
              DATA:
                description: The category value, per game with 2 decimals for counting stats ('22.33').
                type: string
              GP:
                description: 'Games played. The 2025-26 sample''s GP values (6, 6, 3, 17, 2) do not match
                  a full season: the games it ranks over are unverified.'
                type: string
              Year:
                description: Season END year as a string (2026 = 2025-26); echoes `cYear`.
                type: string
              pic:
                description: Photo, path relative to https://www.basket.co.il (URL-encoded); empty when
                  none.
                type: string
              player_name:
                description: Player name, Hebrew, HTML-entity encoded (&quot; &#39; &amp;).
                type: string
              player_number:
                description: Jersey number, zero-padded string.
                type: string
              player_year_id:
                description: Player-season id (IBBA player-season key space). Joins Players/PlayerById
                  `player_id` to Boxscore `player_year_id` (every box player of game 26392 is on the Players
                  roster).
                type: string
              team_id:
                description: 'Team-season id (IBBA team-season key space: a new id every season for the
                  same club, e.g. Maccabi Tel Aviv = 1109 in 2025-26 and 2111 in 2026-27). Joins to Teams
                  `team_year_id`; the `team_id` param.'
                type: string
            type: object
          type: array
      type: object
    PlayerByIdResponse:
      properties:
        player:
          description: One player-season row.
          items:
            properties:
              isLocal:
                description: '''True'' for Israeli (local) players, ''False'' for foreign players.'
                type: string
              isReplaced:
                description: '''True'' when the person left the team during the season (replaced), else
                  ''False''.'
                type: string
              jersy:
                description: Jersey number as a string, zero-padded ('02'; sic 'jersy').
