                $ref: '#/components/schemas/CoachesResponse'
          description: The rows (an unknown id answers 200 with an EMPTY body, not JSON).
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: 'A missing or unparsable parameter: a text/plain .NET stack trace (''Missing parameter:
            cYear.''). Deterministic; do not retry.'
      summary: Coaching staff of a team-season
      x-unscoped-params:
      - team_uid
  /Configuration:
    get:
      description: 'Body: {"settings": [rows]}. Echoes `cYear` in Current_Year; the other fields'' meanings
        are inferred.'
      operationId: Configuration
      parameters:
      - description: Season END year (2026 = 2025-26; 2005 = 2004-05, the earliest verified). Required
          on every op that takes it.
        example: 2026
        in: query
        name: cYear
        required: true
        schema:
          format: int32
