              year_id:
                description: Season END year as a string (2026 = 2025-26); echoes `cYear`.
                type: string
            type: object
          type: array
      type: object
    StatsTypesResponse:
      properties:
        statsTypes:
          description: Stat categories LeaderByType accepts.
          items:
            properties:
              stat_type_field:
                description: Code to send as LeaderByType `stat_type` (bracketed codes such as '[OR]'
                  are sent with the brackets).
                type: string
              stat_type_name:
                description: 'Category name, Hebrew (translations in ibba-returns.md: ''נקודות'' = points).'
                type: string
            type: object
          type: array
      type: object
    TeamByIdResponse:
      properties:
        team:
          description: One team-season.
          items:
            properties:
              TeamUID:
