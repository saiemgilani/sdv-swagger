    PlayersResponse:
      properties:
        players:
          description: Roster of the team-season, ordered by jersey.
          items:
            properties:
              Height:
                description: Height in metres as a string ('1.93').
                type: string
              birth_date:
                description: Date of birth 'dd/mm/yyyy' (public player bio).
                type: string
              isLocal:
                description: '''True'' for Israeli (local) players, ''False'' for foreign players.'
