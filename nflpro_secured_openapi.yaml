openapi: 3.1.0
info:
  title: NFL Pro secured API (pro.nfl.com) — unofficial
  version: 0.1.0-rev2026.09
  summary: Reverse-engineered spec for the Next Gen Stats data behind pro.nfl.com's NFL+ Premium paywall.
  description: 'Unofficial OpenAPI description of the **`pro.nfl.com/api/secured/*`** surface -- the Next
    Gen Stats data that `nextgenstats.nfl.com` stopped serving (see sdv-internal-refs'' nfl/nextgenstats/
    for that dead host''s history). NGS moved behind an NFL+ Premium subscription.


    **Auth.** A client-credentials token is NOT sufficient -- it mints successfully but is not user-bound,
    and every `/api/secured/*` call 401s. A user-bound token is obtained only by completing the real `id.nfl.com`
    login (a 3-step flow: email, a passkey-sign-in *offer* at `/account/sign-in-biometric` with no password
    field, then password at `/account/sign-in-password`) and confirming the resulting token''s `plans`
    claim carries an ACTIVE `NFL_PLUS_*` entry -- an anonymous token has claims byte-identical to a UID-minted
    one otherwise. There is no token-mint endpoint modeled here since the login is a browser flow, not
    a REST operation.


    **Gotchas verified by measurement:** an unsupported query param returns HTTP 200 with an EMPTY body
    (no error envelope) rather than a 400; `week`/`game` are PATH scopes, not query params; responses
    truncate silently at the page `limit` with the envelope''s own `total` as the only truncation signal.


    Field-level descriptions are intentionally omitted -- see sdv-internal-refs'' nfl/nflpro/catalogs/nfl_pro_secured_returns.md
    for why, and the identified `load_nfl_nextgen_stats` cross-walk that could recover some of them.'
  x-nfl-schema-source: live-captured-2026-09-03 (NFL+ Premium account, season 2024 REG)
  contact:
    name: sdv-internal-refs
  license:
    name: Reference only
servers:
- url: https://pro.nfl.com
  description: NFL Pro data host
tags:
- name: secured
  description: /api/secured/* Next Gen Stats resources (NFL+ Premium).
security:
- bearerAuth: []
paths:
  /api/secured/stats/players-offense/passing/season:
    get:
      operationId: getPlayersOffensePassingSeason
      summary: Quarterback passing for the season, incl. Next Gen time-to-throw, aggressiveness and CPOE.
      tags:
      - secured
      security:
      - bearerAuth: []
      parameters:
      - &id001
        name: season
        in: query
        required: false
        schema:
          type: integer
          default: 2024
        description: Season, as the STARTING year (2024 = the 2024-25 NFL season).
      - &id002
        name: seasonType
        in: query
        required: false
        schema:
          type: string
          enum:
          - PRE
          - REG
          - POST
          default: REG
        description: 'Season type code (string): PRE, REG, or POST -- not ESPN''s numeric 1/2/3.'
      - &id003
        name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 500
        description: Page size. Responses truncate silently at this many rows with no error and no indication
          in the body -- the envelope's own `total` is the only signal a caller has that more rows exist.
          Page with `offset` until the accumulated row count reaches `total`.
      - &id004
        name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Zero-based row offset for pagination.
      - &id005
        name: sortKey
        in: query
        required: false
        schema:
          type: string
        description: Field name to sort by, e.g. `epa`.
      - &id006
        name: sortValue
        in: query
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
        description: Sort direction.
      - name: qualifiedPasser
        in: query
        required: false
        schema:
          type: boolean
        description: Restrict to players meeting the league qualifying threshold.
      responses:
        '200':
          description: Envelope with the requested params echoed back plus the record collection.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total matching rows, independent of what this page returned -- the free
                      truncation detector.
                  passers:
                    type: array
                    items:
                      type: object
                      description: Column descriptions are deliberately omitted -- no authoritative label
                        source was reachable for these Next Gen Stats field names. See sdv-internal-refs'
                        nfl/nflpro/catalogs/nfl_pro_secured_returns.md for the full provenance note. Do
                        not fill these in by inference.
                      properties:
                        att:
                          type: integer
                          example: 92
                        attPG:
                          type: number
                          example: 30.66667
                        avgSep:
                          type: number
                          example: 3.22274
                        avgTTP:
                          type: number
                          example: 2.32121
                        avgTTS:
                          type: number
                          example: 5.2332
                        avgTTT:
                          type: number
                          example: 2.38815
                        ay:
                          type: number
                          example: 259.8
                        ayAtt:
                          type: number
                          example: 7.44533
                        blitzR:
                          type: number
                          example: 0.24742
                        cmp:
                          type: integer
                          example: 58
                        cmpPG:
                          type: number
                          example: 19.33333
                        cmpPct:
                          type: number
                          example: 0.63043
                        cpoe:
                          type: number
                          example: -0.0106
                        db:
                          type: integer
                          example: 97
                        dbPG:
                          type: number
                          example: 32.33333
                        deepAttPct:
                          type: number
                          example: 0.08696
                        displayName:
                          type: string
                          example: Philip Rivers
                        drop:
                          type: integer
                          example: 1
                        dropPG:
                          type: number
                          example: 0.33333
                        dropR:
                          type: number
                          example: 0.01087
                        epa:
                          type: number
                          example: -14.0985
                        epaDb:
                          type: number
                          example: -0.14535
                        epaPG:
                          type: number
                          example: -4.6995
                        gp:
                          type: integer
                          example: 3
                        gs:
                          type: integer
                          example: 3
                        headshot:
                          type: string
                          example: https://static.www.nfl.com/image/privat
                        int:
                          type: integer
                          example: 3
                        intPG:
                          type: number
                          example: 1.0
                        jerseyNumber:
                          type: integer
                          example: 17
                        nflId:
                          type: string
                          example: '28956'
                        ngsPosition:
                          type: string
                          example: QB
                        ngsPositionGroup:
                          type: string
                          example: QB
                        paDbPct:
                          type: number
                          example: 0.15464
                        position:
                          type: string
                          example: QB
                        positionGroup:
                          type: string
                          example: QB
                        qbp:
                          type: integer
                          example: 33
                        qbpPG:
                          type: number
                          example: 11.0
                        qbpR:
                          type: number
                          example: 0.34021
                        qp:
                          type: boolean
                          example: false
                        rating:
                          type: number
                          example: 80.16304
                        sack:
                          type: integer
                          example: 5
                        sackPG:
                          type: number
                          example: 1.66667
                        shortName:
                          type: string
                          example: P.Rivers
                        td:
                          type: integer
                          example: 4
                        tdPG:
                          type: number
                          example: 1.33333
                        teamId:
                          type: string
                          example: '2200'
                        tg:
                          type: integer
                          example: 3
                        totalTg:
                          type: integer
                          example: 17
                        twAttPG:
                          type: number
                          example: 6.33333
                        twAttPct:
                          type: number
                          example: 0.20652
                        xCmp:
                          type: number
                          example: 0.64104
                        xYac:
                          type: number
                          example: 279.7439
                        yac:
                          type: number
                          example: 291.97
                        yacPct:
                          type: number
                          example: 0.53671
                        yds:
                          type: integer
                          example: 544
                        ydsPG:
                          type: number
                          example: 181.33333
                        ypa:
                          type: number
                          example: 5.91304
        '401':
          description: Token expired, not user-bound, or lacks an active NFL_PLUS_* plan.
        '403':
          description: Same as 401 -- both surface the auth failure on this host.
        '500':
          description: Frequently a missing required parameter (see `fantasy/game`'s `positionGroup`)
            -- the body's `statusText` usually names the failed request.
