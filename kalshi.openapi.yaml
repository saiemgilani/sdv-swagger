info:
  description: The keyless market-data routes of Kalshi's Trade API v2; shapes from committed captures
    in kalshi/captures/ (2026-10-06). /events, /markets and /markets/trades page by an opaque `cursor`
    echoed in the body (see x-pagination); captures hold the first page only. /series ignores limit/cursor
    and returns a whole category at once. Order placement and portfolio routes need KALSHI-ACCESS-KEY
    plus an RSA signature and are out of scope. Not official or supported.
  title: Kalshi Trade API v2 (api.elections.kalshi.com) — public market data
  version: '2026-10-06'
openapi: 3.1.0
paths:
  /events:
    get:
      operationId: events
      parameters:
      - description: Rows per page (max 1000 on /markets, 200 on /events; default 100).
        example: '3'
        in: query
        name: limit
        required: false
        schema:
          type: string
      - description: 'Lifecycle filter: open, closed, settled (events also accept unopened).'
        example: open
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: Series ticker, e.g. KXNFLGAME (from /series).
        example: KXNFLGAME
        in: query
        name: series_ticker
        required: false
        schema:
          type: string
      - description: Opaque page cursor returned in the previous page's `cursor` field (verified 2026-10-06).
        in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Events'
          description: OK
      summary: Events, filterable by series and status; cursor-paged
      x-pagination:
        params:
        - cursor
        - limit
        request: 'verified 2026-10-06: passing the returned cursor back gives a page whose first row differs'
        response_field: cursor
        style: cursor
  /events/{event_ticker}:
    get:
      operationId: events_event_ticker
      parameters:
      - description: Event ticker, e.g. KXNFLGAME-26OCT08TBDAL (from /events).
        example: KXNFLGAME-26OCT08TBDAL
        in: path
        name: event_ticker
        required: true
        schema:
          type: string
      - description: true nests the event's markets under event.markets.
        example: 'true'
        in: query
        name: with_nested_markets
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsEventTicker'
          description: OK
      summary: One event, optionally with its markets nested
  /exchange/status:
    get:
      operationId: exchange_status
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeStatus'
          description: OK
      summary: Exchange and trading status
  /markets:
    get:
      operationId: markets
      parameters:
      - description: Rows per page (max 1000 on /markets, 200 on /events; default 100).
        example: '3'
        in: query
        name: limit
        required: false
        schema:
          type: string
      - description: Event ticker, e.g. KXNFLGAME-26OCT08TBDAL (from /events).
        example: KXNFLGAME-26OCT08TBDAL
        in: query
        name: event_ticker
        required: false
        schema:
          type: string
      - description: Opaque page cursor returned in the previous page's `cursor` field (verified 2026-10-06).
        in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Markets'
          description: OK
      summary: Markets, filterable by event/series/status; cursor-paged
      x-pagination:
        params:
        - cursor
        - limit
        request: 'verified 2026-10-06: passing the returned cursor back gives a page whose first row differs'
        response_field: cursor
        style: cursor
  /markets/trades:
    get:
      operationId: markets_trades
      parameters:
      - description: Rows per page (max 1000 on /markets, 200 on /events; default 100).
        example: '3'
        in: query
        name: limit
        required: false
        schema:
          type: string
      - description: Market ticker, e.g. KXNFLGAME-26OCT08TBDAL-DAL (from /markets).
        example: KXNFLGAME-26OCT08TBDAL-DAL
        in: query
        name: ticker
        required: false
        schema:
          type: string
      - description: Opaque page cursor returned in the previous page's `cursor` field (verified 2026-10-06).
        in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsTrades'
          description: OK
      summary: Public trades, filterable by market; cursor-paged
      x-pagination:
        params:
        - cursor
        - limit
        request: 'verified 2026-10-06: passing the returned cursor back gives a page whose first row differs'
        response_field: cursor
        style: cursor
  /markets/{ticker}:
    get:
      operationId: markets_ticker
      parameters:
      - description: Market ticker, e.g. KXNFLGAME-26OCT08TBDAL-DAL (from /markets).
        example: KXNFLGAME-26OCT08TBDAL-DAL
        in: path
        name: ticker
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsTicker'
          description: OK
      summary: One market
  /markets/{ticker}/orderbook:
    get:
      operationId: markets_ticker_orderbook
      parameters:
      - description: Market ticker, e.g. KXNFLGAME-26OCT08TBDAL-DAL (from /markets).
        example: KXNFLGAME-26OCT08TBDAL-DAL
        in: path
        name: ticker
        required: true
        schema:
          type: string
      - description: Price levels per side (omit for the full book).
        example: '3'
        in: query
        name: depth
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsTickerOrderbook'
          description: OK
      summary: Order book of a market (fixed-point dollar levels)
  /series:
    get:
      operationId: series
      parameters:
      - description: Series category, e.g. Sports.
        example: Sports
        in: query
        name: category
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
          description: OK
      summary: Series (market families) in a category; the whole category in one body
      x-pagination:
        params: []
        request: 'unverified: limit and cursor are ignored (probed 2026-10-06: 3,982 Sports series with
          limit=3 and with cursor=abc); the whole category comes back in one 6.3 MB body and the capture
          keeps three rows'
        style: none
  /series/{series_ticker}:
    get:
      operationId: series_series_ticker
      parameters:
      - description: Series ticker, e.g. KXNFLGAME (from /series).
        example: KXNFLGAME
        in: path
        name: series_ticker
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesSeriesTicker'
          description: OK
      summary: One series
servers:
- url: https://api.elections.kalshi.com/trade-api/v2
