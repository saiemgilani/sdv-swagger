info:
  description: Reverse-engineered from committed captures in uefa/captures/. Keyless; each path carries
    its own host. Not official or supported.
  title: UEFA front-end APIs (comp / match / standings / matchstats .uefa.com)
  version: '2026-10-05'
openapi: 3.1.0
paths:
  /v1/standings:
    get:
      operationId: standings_v1_standings
      parameters:
      - description: 1 = Champions League, 3 = Europa League, 2019 = Conference League (see /v2/competitions).
        example: '1'
        in: query
        name: competitionId
        required: true
        schema:
          type: string
      - description: The season's end year (2026 = 2025-26).
        example: '2026'
        in: query
        name: seasonYear
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingsV1Standings'
          description: OK
      summary: standings.uefa.com/v1/standings
    servers:
    - url: https://standings.uefa.com
  /v1/team-statistics/{matchId}:
    get:
      operationId: matchstats_v1_team_statistics_matchId
      parameters:
      - description: Match id (from /v5/matches).
        in: path
        name: matchId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchstatsV1TeamStatistics'
          description: OK
      summary: matchstats.uefa.com/v1/team-statistics/{matchId}
    servers:
    - url: https://matchstats.uefa.com
  /v2/competitions:
    get:
      operationId: comp_v2_competitions
      parameters:
      - description: Comma-separated competition ids.
        example: 1,3,2019
        in: query
        name: competitionIds
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompV2Competitions'
          description: OK
      summary: comp.uefa.com/v2/competitions
    servers:
    - url: https://comp.uefa.com
  /v2/players:
    get:
      operationId: comp_v2_players
      parameters:
      - description: 1 = Champions League, 3 = Europa League, 2019 = Conference League (see /v2/competitions).
        example: '1'
        in: query
        name: competitionId
        required: true
        schema:
          type: string
      - description: The season's end year (2026 = 2025-26).
        example: '2026'
        in: query
        name: seasonYear
        required: false
        schema:
          type: string
      - description: Page size.
        example: '3'
        in: query
        name: limit
        required: false
        schema:
          type: string
      - description: Page offset.
        example: '0'
        in: query
        name: offset
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
