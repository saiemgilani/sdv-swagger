  /sports-v2/athlete-details/{athlete_uuid}:
    get:
      description: 'All ids of one player: athleteData.playerExtIds[] lists isa, ramses_legacy, ramses_generic_legacy
        and ramses_merged. For a whole season, stats-info players{} maps isa -> athlete uuid in one call.'
      operationId: sports_v2_athlete_details_athlete_uuid
      parameters:
      - description: Athlete uuid (stats-info stats[].info.uuid, roster rows, or athlete-details).
