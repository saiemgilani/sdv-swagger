              schema:
                $ref: '#/components/schemas/GamedayPlayerStatsGameUuid'
          description: OK
      summary: Extended skater and goalie game stats per team (2023/24 on)
  /gameday/post-game-data/team-stats/{game_uuid}:
    get:
      description: Coverage 2023/24 on; older games answer 200 with an empty body. Player keys are isa
        (StatNet) ids.
      operationId: gameday_post_game_data_team_stats_game_uuid
      parameters:
      - description: Game uuid (gameInfo[].uuid from /sports-v2/game-schedule). gameday/* has data from
          2023/24 on; older games answer 200 with an empty body.
        example: bdhvuc5tex
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      - description: ssgt uuid.
        example: iuzqg7dqk9
        in: query
        name: ssgtUuid
        required: true
        schema:
          type: string
      - description: Home team uuid; without it the home side comes back blank.
        example: 087a-087aTQv9u
        in: query
        name: homeTeamUuid
        required: true
        schema:
          type: string
      - description: Away team uuid; without it the away side comes back blank.
        example: 41c4-41c4BiYZU
        in: query
        name: awayTeamUuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamedayPostGameDataTeamStatsGameUuid'
          description: OK
      summary: Post-game team comparison
  /gameday/team-standings/{ssgt_uuid}:
    get:
      operationId: gameday_team_standings_ssgt_uuid
      parameters:
      - description: 'ssgt uuid: one season + series + game type (e.g. 2025/2026 SHL regular season).
          Directory: /statistics-v2/layout-info seasonSeriesGameTypeTeams[].ssgtUuid.'
        example: iuzqg7dqk9
        in: path
        name: ssgt_uuid
        required: true
        schema:
