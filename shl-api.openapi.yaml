components:
  schemas:
    GamedayBoxscoreGameUuid:
      properties:
        dataColumns:
          description: Column definitions of the table (name, type, group, highlighted); stats[] rows
            are keyed by name.
          items:
            properties:
              group:
                description: Column group label. Empty string in every sample (placeholder).
                type: string
              highlighted:
                description: Whether the column is highlighted.
                type: boolean
              name:
                description: Column name; the key of that value in the stats rows (e.g. NR, Player).
                type: string
              type:
                description: Value type of the column (integer, string, ...).
                type: string
            type: object
          type: array
        gkDataColumns:
          description: Goalie column definitions.
          items:
            properties:
              group:
                description: Column group label. Empty string in every sample (placeholder).
                type: string
              highlighted:
                description: Whether the column is highlighted.
                type: boolean
              name:
                description: Column name; the key of that value in the goalie rows.
                type: string
              type:
                description: Value type of the column (integer, string, ...).
                type: string
            type: object
          type: array
        gkStats:
          description: 'Goalie stat rows per side: homeTeamValue / awayTeamValue arrays.'
          properties:
            awayTeamValue:
              description: Away goalie stat rows (keys = gkDataColumns names; info.playerId = isa id).
              items:
                properties:
                  GA:
                    description: Goals against.
                    type: integer
                  LINE:
                    description: Line number.
                    type: integer
                  NR:
                    description: Jersey number.
                    type: integer
                  POS:
                    description: Position code in this game (e.g. CE, LW, RW, D, GK).
                    type: string
                  SOGA:
                    description: Shots on goal against.
                    type: integer
                  SPGA:
                    description: Unverified goalie column (box score).
                    type: integer
                  SVS:
                    description: Saves.
                    type: integer
                  SVS%:
                    description: Save percentage of the game as a FRACTION 0-1 (e.g. '0.9655...'); integer
                      0 for a goalie without shots. Numeric, but sent as a string in some rows and as
                      a number in others.
                    type:
                    - integer
                    - string
                  info:
                    description: Athlete or team record of the row.
                    properties:
                      period:
                        description: Period (1-3, 4 = overtime, 5 = shootout).
                        type: integer
                      playerId:
                        description: 'isa (StatNet) player id as an INTEGER. Join trap: play-by-play sends
                          the same id as a STRING (player.playerId, pop/nep, assists) and map keys are
                          strings; cast before joining.'
                        type: integer
                      team:
                        description: 'Side of the player in this game: home or away.'
                        type: string
                      teamId:
                        description: Team code (e.g. FHC) in gameday and standings payloads; not the team
                          uuid.
                        type: string
                    type: object
                type: object
              type: array
            homeTeamValue:
              description: Home goalie stat rows (keys = gkDataColumns names; info.playerId = isa id).
              items:
                properties:
                  GA:
                    description: Goals against.
                    type: integer
                  LINE:
                    description: Line number.
                    type: integer
                  NR:
                    description: Jersey number.
                    type: integer
                  POS:
                    description: Position code in this game (e.g. CE, LW, RW, D, GK).
                    type: string
                  SOGA:
                    description: Shots on goal against.
                    type: integer
                  SPGA:
                    description: Unverified goalie column (box score).
                    type: integer
                  SVS:
                    description: Saves.
                    type: integer
                  SVS%:
                    description: Save percentage of the game as a FRACTION 0-1 (e.g. '0.9655...'); integer
                      0 for a goalie without shots. Numeric, but sent as a string in some rows and as
                      a number in others.
                    type:
                    - integer
                    - string
                  info:
                    description: Athlete or team record of the row.
                    properties:
                      period:
                        description: Period (1-3, 4 = overtime, 5 = shootout).
                        type: integer
                      playerId:
                        description: 'isa (StatNet) player id as an INTEGER. Join trap: play-by-play sends
                          the same id as a STRING (player.playerId, pop/nep, assists) and map keys are
                          strings; cast before joining.'
                        type: integer
                      team:
                        description: 'Side of the player in this game: home or away.'
                        type: string
                      teamId:
                        description: Team code (e.g. FHC) in gameday and standings payloads; not the team
                          uuid.
                        type: string
                    type: object
                type: object
              type: array
          type: object
        goalkeepers:
          description: 'Goalie name records per side: homeTeamValue / awayTeamValue maps keyed by isa
            id.'
          properties:
            awayTeamValue:
              additionalProperties:
                properties:
                  extIds:
                    description: External ids of the record.
                    items:
                      properties:
                        extId:
                          description: isa (StatNet) player id as an integer; equals the map key.
                          type: integer
                      type: object
                    type: array
                  firstName:
                    description: Given name.
                    type: string
                  fullName:
                    description: Given name and surname.
                    type: string
                  lastName:
                    description: Surname.
                    type: string
                type: object
              description: Away goalie name records keyed by isa id.
              type: object
            homeTeamValue:
              additionalProperties:
                properties:
                  extIds:
                    description: External ids of the record.
                    items:
                      properties:
                        extId:
                          description: isa (StatNet) player id as an integer; equals the map key.
                          type: integer
                      type: object
                    type: array
                  firstName:
                    description: Given name.
                    type: string
                  fullName:
                    description: Given name and surname.
                    type: string
                  lastName:
                    description: Surname.
                    type: string
                type: object
              description: Home goalie name records keyed by isa id.
              type: object
          type: object
        players:
          description: 'Skater name records per side: homeTeamValue / awayTeamValue maps keyed by isa
            id.'
          properties:
            awayTeamValue:
              additionalProperties:
                properties:
                  extIds:
                    description: External ids of the record.
                    items:
                      properties:
                        extId:
                          description: isa (StatNet) player id as an integer; equals the map key.
                          type: integer
                      type: object
                    type: array
                  firstName:
                    description: Given name.
                    type: string
                  fullName:
                    description: Given name and surname.
                    type: string
                  lastName:
                    description: Surname.
                    type: string
                type: object
              description: Away skater name records keyed by isa id.
              type: object
            homeTeamValue:
              additionalProperties:
                properties:
                  extIds:
                    description: External ids of the record.
                    items:
                      properties:
                        extId:
                          description: isa (StatNet) player id as an integer; equals the map key.
                          type: integer
                      type: object
                    type: array
                  firstName:
                    description: Given name.
                    type: string
                  fullName:
                    description: Given name and surname.
                    type: string
                  lastName:
                    description: Surname.
                    type: string
                type: object
              description: Home skater name records keyed by isa id.
              type: object
          type: object
        provider:
          description: Stats provider of the data (statnet seen).
          type: string
        stats:
          description: 'Skater stat rows per side: homeTeamValue / awayTeamValue arrays.'
          properties:
            awayTeamValue:
              description: Away skater stat rows (keys = dataColumns names; info.playerId = isa id).
              items:
                properties:
                  +/-:
                    description: Plus/minus in the game.
                    type: integer
                  A:
                    description: Assists.
                    type: integer
                  FOL:
                    description: Face-offs lost.
                    type: integer
                  FOPerc:
                    description: Face-off win %.
                    type: integer
                  FOW:
                    description: Face-offs won.
                    type: integer
                  G:
                    description: Goals.
                    type: integer
                  Hits:
                    description: Body checks delivered.
                    type: integer
                  LINE:
                    description: Line number.
                    type: integer
                  NR:
                    description: Jersey number.
                    type: integer
                  PIM:
                    description: Penalty minutes.
                    type: integer
                  POS:
                    description: Position code in this game (e.g. CE, LW, RW, D, GK).
                    type: string
                  PPG:
                    description: Power-play goals.
                    type: integer
                  PPSOG:
                    description: Power-play shots on goal.
                    type: integer
                  SOG:
                    description: Shots on goal.
                    type: integer
                  SW:
                    description: Shots wide.
                    type: integer
                  TOI:
                    description: Time on ice (mm:ss). Clock/duration as an mm:ss string.
                    type: string
                  info:
                    description: Athlete or team record of the row.
                    properties:
                      period:
                        description: Period (1-3, 4 = overtime, 5 = shootout).
                        type: integer
                      playerId:
                        description: 'isa (StatNet) player id as an INTEGER. Join trap: play-by-play sends
                          the same id as a STRING (player.playerId, pop/nep, assists) and map keys are
                          strings; cast before joining.'
                        type: integer
                      team:
                        description: 'Side of the player in this game: home or away.'
                        type: string
                      teamId:
                        description: Team code (e.g. FHC) in gameday and standings payloads; not the team
                          uuid.
                        type: string
                    type: object
                type: object
              type: array
            homeTeamValue:
              description: Home skater stat rows (keys = dataColumns names; info.playerId = isa id).
              items:
                properties:
                  +/-:
                    description: Plus/minus in the game.
                    type: integer
                  A:
                    description: Assists.
                    type: integer
                  FOL:
                    description: Face-offs lost.
                    type: integer
                  FOPerc:
                    description: Face-off win %.
                    type: integer
                  FOW:
                    description: Face-offs won.
                    type: integer
                  G:
                    description: Goals.
                    type: integer
                  Hits:
                    description: Body checks delivered.
                    type: integer
                  LINE:
                    description: Line number.
                    type: integer
                  NR:
                    description: Jersey number.
                    type: integer
                  PIM:
                    description: Penalty minutes.
                    type: integer
                  POS:
                    description: Position code in this game (e.g. CE, LW, RW, D, GK).
                    type: string
                  PPG:
                    description: Power-play goals.
                    type: integer
                  PPSOG:
                    description: Power-play shots on goal.
                    type: integer
                  SOG:
                    description: Shots on goal.
                    type: integer
                  SW:
                    description: Shots wide.
                    type: integer
                  TOI:
                    description: Time on ice (mm:ss). Clock/duration as an mm:ss string.
                    type: string
                  info:
                    description: Athlete or team record of the row.
                    properties:
                      period:
                        description: Period (1-3, 4 = overtime, 5 = shootout).
                        type: integer
                      playerId:
                        description: 'isa (StatNet) player id as an INTEGER. Join trap: play-by-play sends
                          the same id as a STRING (player.playerId, pop/nep, assists) and map keys are
                          strings; cast before joining.'
                        type: integer
                      team:
                        description: 'Side of the player in this game: home or away.'
                        type: string
                      teamId:
                        description: Team code (e.g. FHC) in gameday and standings payloads; not the team
                          uuid.
                        type: string
                    type: object
                type: object
              type: array
          type: object
      type: object
    GamedayGameInfoGameUuid:
      properties:
        bestScorers:
          description: Top scorers of the game.
          items:
            properties:
              fullName:
                description: Given name and surname.
                type: string
              media:
                description: Media URL or string.
                type: string
              teamCode:
                description: Team code (FHC, LHC, ...).
                type: string
              totalPoints:
                description: Points (goals + assists) of the scorer in this game.
                type: integer
              uuid:
                description: Athlete uuid (platform key space; qQ9-... or 10-char form); joins to the
                  athlete routes and stats-info stats[].info.uuid. Not the isa or ramses_legacy id.
                type: string
            type: object
          type: array
        statisticsProvider:
          description: Stats provider of the data (statnet seen).
          type: string
        teamHead2Head:
          description: Previous meetings of the two teams.
          items:
            properties:
              awayTeam:
                description: 'Away side: team name/code, score or comparison values.'
                properties:
                  center:
                    description: Face-off circle block (team stats).
                    properties:
                      type:
                        description: Stat code compared in the middle (e.g. SEff, PPPerc).
                        type: string
                      value:
                        description: Value (string-encoded). Numeric, but sent as a string in some rows
                          and as a number in others.
                        type:
                        - integer
                        - string
                    type: object
                  left:
                    description: Left face-off circle block.
                    properties:
                      type:
                        description: Stat code compared on the left (e.g. G, PPG).
                        type: string
                      value:
                        description: Value (string-encoded).
                        type: integer
                    type: object
                  right:
                    description: Right face-off circle block.
                    properties:
                      type:
                        description: Stat code compared on the right (e.g. SOG, PPOpp).
                        type: string
                      value:
                        description: Value (string-encoded).
                        type: integer
                    type: object
                  sideTranslateKey:
                    description: Translation key of the side.
                    type: string
                type: object
              homeTeam:
                description: 'Home side: team name/code, score or comparison values.'
                properties:
                  center:
                    description: Face-off circle block (team stats).
                    properties:
                      type:
                        description: Stat code compared in the middle (e.g. SEff, PPPerc).
                        type: string
                      value:
                        description: Value (string-encoded). Numeric, but sent as a string in some rows
                          and as a number in others.
                        type:
                        - integer
                        - string
                    type: object
                  left:
                    description: Left face-off circle block.
                    properties:
                      type:
                        description: Stat code compared on the left (e.g. G, PPG).
                        type: string
                      value:
                        description: Value (string-encoded).
                        type: integer
                    type: object
                  right:
                    description: Right face-off circle block.
                    properties:
                      type:
                        description: Stat code compared on the right (e.g. SOG, PPOpp).
                        type: string
                      value:
                        description: Value (string-encoded).
                        type: integer
                    type: object
                  sideTranslateKey:
                    description: Translation key of the side.
                    type: string
                type: object
            type: object
          type: array
        teamPeriod:
          description: Team stats per period.
          properties:
            caption:
              description: Image caption.
              type: string
            overtime:
              description: Whether the game went to overtime.
              type: boolean
            shootout:
              description: Whether the game went to a shootout.
              type: boolean
            stats:
              description: 'Team stats per period: rows with home and away values.'
              items:
                properties:
                  awayTeamValue:
                    description: Away team's value for this stat in the period.
                    type: integer
                  homeTeamValue:
                    description: Home team's value for this stat in the period.
                    type: integer
                  periodName:
                    description: Period number of the row (1-3 in a game decided in regulation).
                    type: integer
                type: object
              type: array
          type: object
      type: object
    GamedayGameOverviewGameUuid:
      properties:
        awayGoals:
          description: Away goals after this event (running score).
          type: integer
        awayTeam:
          description: 'Away side: team name/code, score or comparison values.'
          properties:
            gameId:
              description: StatNet game number (StatNet key space, e.g. 22003); keys stats-info games{}
                and equals sports-v2 game-info extId. Not the game uuid.
              type: integer
            gameSourceId:
              description: StatNet game key, date-HOME-AWAY (e.g. 20250913-FHC-LHC); the same game as
                gameId.
              type: string
            gameUuid:
              description: Game uuid (platform key space, e.g. bdhvuc5tex); joins to schedule gameInfo[].uuid
                and every gameday/{game_uuid} route. The StatNet number of the same game is gameId.
              type: string
            place:
              description: home or away.
              enum:
              - away
              type: string
            score:
              description: Goals scored by the team in the game.
              type: integer
            teamCode:
              description: Team code (FHC, LHC, ...).
              type: string
            teamId:
              description: Team code (e.g. FHC) in gameday and standings payloads; not the team uuid.
              type: string
            teamName:
              description: Team display name (e.g. Frölunda HC).
              type: string
          type: object
        gameUuid:
          description: Game uuid (platform key space, e.g. bdhvuc5tex); joins to schedule gameInfo[].uuid
            and every gameday/{game_uuid} route. The StatNet number of the same game is gameId.
          type: string
        homeGoals:
          description: Home goals after this event (running score).
          type: integer
        homeTeam:
          description: 'Home side: team name/code, score or comparison values.'
          properties:
            gameId:
              description: StatNet game number (StatNet key space, e.g. 22003); keys stats-info games{}
                and equals sports-v2 game-info extId. Not the game uuid.
              type: integer
            gameSourceId:
              description: StatNet game key, date-HOME-AWAY (e.g. 20250913-FHC-LHC); the same game as
                gameId.
              type: string
            gameUuid:
              description: Game uuid (platform key space, e.g. bdhvuc5tex); joins to schedule gameInfo[].uuid
                and every gameday/{game_uuid} route. The StatNet number of the same game is gameId.
              type: string
            place:
              description: home or away.
              enum:
              - home
              type: string
            score:
              description: Goals scored by the team in the game.
              type: integer
            teamCode:
              description: Team code (FHC, LHC, ...).
              type: string
            teamId:
              description: Team code (e.g. FHC) in gameday and standings payloads; not the team uuid.
              type: string
            teamName:
              description: Team display name (e.g. Frölunda HC).
              type: string
          type: object
        state:
          description: StatNet game state (GameEnded seen).
          type: string
        time:
          description: Game clock in the period (MM:SS, counting up from 00:00).
          properties:
            period:
              description: Period (1-3, 4 = overtime, 5 = shootout).
              type: integer
            periodTime:
              description: Time in period (MM:SS). Clock/duration as an mm:ss string.
              type: string
          type: object
      type: object
    GamedayPlayByPlayGameUuid:
      items:
        properties:
          arena:
            description: Name of the arena hosting the game.
            type: string
          assists:
            description: Goal assists (first / second).
            properties:
              first:
                description: First assist.
                properties:
                  familyName:
                    description: Surname.
                    type: string
                  firstName:
                    description: Given name.
                    type: string
                  jerseyToday:
                    description: Jersey number in this game. Numeric value sent as a string.
                    type: string
                  playerId:
                    description: 'isa (StatNet) player id as a STRING (play-by-play only). Join trap:
                      box score, stats-info and the game logs send it as an integer (info.playerId); cast
                      before joining. Numeric value sent as a string.'
                    type: string
                  statistics:
                    description: Stat key/value pairs.
                    items:
                      properties:
                        key:
                          description: Stat code (e.g. G, A).
                          type: string
                        value:
                          description: Value (string-encoded). Numeric value sent as a string.
                          type: string
                      type: object
                    type: array
                type: object
              second:
                description: Second assist.
                properties:
                  familyName:
                    description: Surname.
                    type: string
                  firstName:
                    description: Given name.
                    type: string
                  jerseyToday:
                    description: Jersey number in this game. Numeric value sent as a string.
                    type: string
                  playerId:
                    description: 'isa (StatNet) player id as a STRING (play-by-play only). Join trap:
                      box score, stats-info and the game logs send it as an integer (info.playerId); cast
                      before joining. Numeric value sent as a string.'
                    type: string
                  statistics:
                    description: Stat key/value pairs.
                    items:
                      properties:
                        key:
                          description: Stat code (e.g. G, A).
                          type: string
                        value:
                          description: Value (string-encoded). Numeric value sent as a string.
                          type: string
                      type: object
                    type: array
                type: object
            type: object
          attendance:
            description: Spectators at the game.
            type: integer
          awayGoals:
            description: Away goals after this event (running score).
            type: integer
          awayTeam:
            description: 'Away side: team name/code, score or comparison values.'
            properties:
              score:
                description: Goals scored by the team in the game.
                type: integer
              teamCode:
                description: Team code (FHC, LHC, ...).
                type: string
              teamId:
                description: Team code (e.g. FHC) in gameday and standings payloads; not the team uuid.
                type: string
              teamName:
                description: Team display name (e.g. Frölunda HC).
                type: string
            type: object
          didRenderInPenaltyShot:
            description: Whether the penalty led to a penalty shot.
            type: boolean
          eventId:
            description: StatNet event sequence number; unique within one game only (pair it with gameId
              or gameUuid).
            type: integer
          eventTeam:
            description: Team the event belongs to (teamId, place home/away, teamCode, teamName).
            properties:
              place:
                description: home or away.
                enum:
                - home
                - away
                type: string
              teamCode:
                description: Team code (FHC, LHC, ...).
                type: string
              teamId:
                description: Team code (e.g. FHC) in gameday and standings payloads; not the team uuid.
                type: string
              teamName:
                description: Team display name (e.g. Frölunda HC).
                type: string
            type: object
          eventUuid:
            description: Event uuid (platform key space), unique across games. eventId is the StatNet
              per-game sequence number.
            type: string
          finished:
            description: Whether the period is finished.
            type: boolean
          finishedAt:
            description: Period end time (ISO 8601 UTC).
            type: string
          gameId:
            description: StatNet game number (StatNet key space, e.g. 22003); keys stats-info games{}
              and equals sports-v2 game-info extId. Not the game uuid.
            type: integer
          gameSourceId:
            description: StatNet game key, date-HOME-AWAY (e.g. 20250913-FHC-LHC); the same game as gameId.
            type: string
          gameState:
            description: Game state (e.g. GameEnded).
            type: string
          gameType:
            description: 'StatNet league label: Elitserien (SHL''s name until 2013).'
            type: string
          gameUuid:
            description: Game uuid (platform key space, e.g. bdhvuc5tex); joins to schedule gameInfo[].uuid
              and every gameday/{game_uuid} route. The StatNet number of the same game is gameId.
            type: string
          goalSection:
            description: Goal-mouth section of the shot/goal (-3 lines up with blocked shots; unverified).
            type: integer
          goalStatus:
            description: Goal strength (e.g. EQ, PP1, SH1).
            type: string
          homeGoals:
            description: Home goals after this event (running score).
            type: integer
          homeTeam:
            description: 'Home side: team name/code, score or comparison values.'
            properties:
              score:
                description: Goals scored by the team in the game.
                type: integer
              teamCode:
                description: Team code (FHC, LHC, ...).
                type: string
              teamId:
                description: Team code (e.g. FHC) in gameday and standings payloads; not the team uuid.
                type: string
              teamName:
                description: Team display name (e.g. Frölunda HC).
                type: string
            type: object
          isEmptyNetGoal:
            description: Whether the goal went into an empty net.
            type: boolean
          isEntering:
            description: Goalie event, true when the goalie enters the ice and false when leaving.
            type: boolean
          isPenaltyShot:
            description: Whether the shot/goal was a penalty shot.
            type: boolean
          locationX:
            description: Shot x coordinate. Units, origin and orientation unverified; range -29..481 over
              the 118 located events of game bdhvuc5tex (discovery download, 2026-10-12).
            type: integer
          locationY:
            description: Shot y coordinate. Units, origin and orientation unverified; range -140..129
              over the 118 located events of game bdhvuc5tex (discovery download, 2026-10-12).
            type: integer
          nep:
            description: Players of the conceding team on ice at the goal (isa ids).
            items:
              properties:
                familyName:
                  description: Surname.
                  type: string
                firstName:
                  description: Given name.
                  type: string
                jerseyToday:
                  description: Jersey number in this game. Numeric value sent as a string.
                  type: string
                playerId:
                  description: 'isa (StatNet) player id as a STRING (play-by-play only). Join trap: box
                    score, stats-info and the game logs send it as an integer (info.playerId); cast before
                    joining. Numeric value sent as a string.'
                  type: string
              type: object
            type: array
          offence:
            description: Penalty offence code (e.g. CROSS, HOOK, TRIP).
            type: string
          period:
            description: Period (1-3, 4 = overtime, 5 = shootout).
            type: integer
          player:
            description: Player of the event (playerId = isa id, firstName, familyName, jerseyToday).
            properties:
              familyName:
                description: Surname.
                type: string
              firstName:
                description: Given name.
                type: string
              jerseyToday:
                description: Jersey number in this game. Numeric value sent as a string.
                type: string
              playerId:
