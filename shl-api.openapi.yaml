info:
  description: 'The JSON API behind www.shl.se (Sportality platform; stats by StatNet), in three families:
    sports-v2 (schedule, teams, rosters, athletes), gameday (per-game play-by-play, box score, team stats;
    2023/24 on) and statistics-v2 (stats tables back to 1975/76, athlete profiles). Keyless GET; no robots.txt.
    Almost every route keys on an ssgt uuid (one season + series + game type); /statistics-v2/layout-info
    maps each ssgt uuid to its season label. Three player id systems: isa (StatNet: play-by-play, box
    score, stats-info players{}), athlete uuid (rosters, athlete routes, stats[].info), ramses_legacy
    (athlete-details playerExtIds only). stats-info truncates to 50 rows unless count=1000. Shapes from
    committed captures in shl/captures/ (2026-10-12). Not official or supported.'
  title: SHL site API (www.shl.se/api)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /gameday/boxscore/{game_uuid}:
    get:
      description: Coverage 2023/24 on; older games answer 200 with an empty body. Player keys are isa
        (StatNet) ids.
      operationId: gameday_boxscore_game_uuid
      parameters:
      - description: Game uuid (gameInfo[].uuid from /sports-v2/game-schedule). gameday/* has data from
          2023/24 on; older games answer 200 with an empty body.
        example: bdhvuc5tex
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamedayBoxscoreGameUuid'
          description: OK
      summary: Skater and goalie box score per team (2023/24 on)
  /gameday/game-info/{game_uuid}:
    get:
      description: Coverage 2023/24 on; older games answer 200 with an empty body. Player keys are isa
        (StatNet) ids.
      operationId: gameday_game_info_game_uuid
      parameters:
      - description: Game uuid (gameInfo[].uuid from /sports-v2/game-schedule). gameday/* has data from
          2023/24 on; older games answer 200 with an empty body.
        example: bdhvuc5tex
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamedayGameInfoGameUuid'
          description: OK
      summary: Goals by period, head-to-head summary, best scorers
  /gameday/game-overview/{game_uuid}:
    get:
      description: Coverage 2023/24 on; older games answer 200 with an empty body. Player keys are isa
        (StatNet) ids.
      operationId: gameday_game_overview_game_uuid
      parameters:
      - description: Game uuid (gameInfo[].uuid from /sports-v2/game-schedule). gameday/* has data from
          2023/24 on; older games answer 200 with an empty body.
        example: bdhvuc5tex
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamedayGameOverviewGameUuid'
          description: OK
      summary: Score, state, clock, StatNet gameId and gameSourceId
  /gameday/play-by-play/{game_uuid}:
    get:
      description: Coverage 2023/24 on; older games answer 200 with an empty body. One list of events,
        newest first; type is goal, shot, penalty, goalkeeper, period or timeout. player.playerId is the
        isa (StatNet) id. The committed sample keeps one event per type.
      operationId: gameday_play_by_play_game_uuid
      parameters:
      - description: Game uuid (gameInfo[].uuid from /sports-v2/game-schedule). gameday/* has data from
          2023/24 on; older games answer 200 with an empty body.
        example: bdhvuc5tex
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamedayPlayByPlayGameUuid'
          description: OK
      summary: Play-by-play events with shot coordinates (2023/24 on)
  /gameday/player-stats/{game_uuid}:
    get:
      description: Coverage 2023/24 on; older games answer 200 with an empty body. Player keys are isa
        (StatNet) ids.
      operationId: gameday_player_stats_game_uuid
      parameters:
      - description: Game uuid (gameInfo[].uuid from /sports-v2/game-schedule). gameday/* has data from
          2023/24 on; older games answer 200 with an empty body.
        example: bdhvuc5tex
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
