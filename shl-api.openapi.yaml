      description: 'Answers for the CURRENT season: effectiveSsgtUuid / effectiveSeasonLabel came back
        as 2026/2027 for a 2025/2026 ssgt in the path.'
      operationId: statistics_v2_player_h2h_v2_ssgt_uuid_home_team_uuid_away_team_uuid
      parameters:
      - description: 'ssgt uuid: one season + series + game type (e.g. 2025/2026 SHL regular season).
