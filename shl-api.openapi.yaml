info:
  description: 'The JSON API behind www.shl.se (Sportality platform; stats by StatNet), in three families:
    sports-v2 (schedule, teams, rosters, athletes), gameday (per-game play-by-play, box score, team stats;
    2023/24 on) and statistics-v2 (stats tables back to 1975/76, athlete profiles). Keyless GET; no robots.txt.
    Almost every route keys on an ssgt uuid (one season + series + game type); /statistics-v2/layout-info
    maps each ssgt uuid to its season label. Three player id systems: isa (StatNet: play-by-play, box
    score, stats-info players{}), athlete uuid (rosters, athlete routes, stats[].info), ramses_legacy
    (athlete-details playerExtIds only). stats-info truncates to 50 rows unless count=1000. Shapes from
    committed captures in shl/captures/ (2026-10-12). Not official or supported.'
  title: SHL site API (www.shl.se/api)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /gameday/boxscore/{game_uuid}:
    get:
      description: Coverage 2023/24 on; older games answer 200 with an empty body. Player keys are isa
        (StatNet) ids.
      operationId: gameday_boxscore_game_uuid
      parameters:
      - description: Game uuid (gameInfo[].uuid from /sports-v2/game-schedule). gameday/* has data from
          2023/24 on; older games answer 200 with an empty body.
        example: bdhvuc5tex
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamedayBoxscoreGameUuid'
          description: OK
      summary: Skater and goalie box score per team (2023/24 on)
  /gameday/game-info/{game_uuid}:
    get:
      description: Coverage 2023/24 on; older games answer 200 with an empty body. Player keys are isa
        (StatNet) ids.
      operationId: gameday_game_info_game_uuid
      parameters:
      - description: Game uuid (gameInfo[].uuid from /sports-v2/game-schedule). gameday/* has data from
          2023/24 on; older games answer 200 with an empty body.
        example: bdhvuc5tex
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamedayGameInfoGameUuid'
          description: OK
      summary: Goals by period, head-to-head summary, best scorers
  /gameday/game-overview/{game_uuid}:
    get:
      description: Coverage 2023/24 on; older games answer 200 with an empty body. Player keys are isa
        (StatNet) ids.
      operationId: gameday_game_overview_game_uuid
      parameters:
      - description: Game uuid (gameInfo[].uuid from /sports-v2/game-schedule). gameday/* has data from
          2023/24 on; older games answer 200 with an empty body.
        example: bdhvuc5tex
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamedayGameOverviewGameUuid'
          description: OK
      summary: Score, state, clock, StatNet gameId and gameSourceId
  /gameday/play-by-play/{game_uuid}:
    get:
      description: Coverage 2023/24 on; older games answer 200 with an empty body. One list of events,
        newest first; type is goal, shot, penalty, goalkeeper, period or timeout. player.playerId is the
        isa (StatNet) id. The committed sample keeps one event per type.
      operationId: gameday_play_by_play_game_uuid
      parameters:
      - description: Game uuid (gameInfo[].uuid from /sports-v2/game-schedule). gameday/* has data from
          2023/24 on; older games answer 200 with an empty body.
        example: bdhvuc5tex
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamedayPlayByPlayGameUuid'
          description: OK
      summary: Play-by-play events with shot coordinates (2023/24 on)
  /gameday/player-stats/{game_uuid}:
    get:
      description: Coverage 2023/24 on; older games answer 200 with an empty body. Player keys are isa
        (StatNet) ids.
      operationId: gameday_player_stats_game_uuid
      parameters:
      - description: Game uuid (gameInfo[].uuid from /sports-v2/game-schedule). gameday/* has data from
          2023/24 on; older games answer 200 with an empty body.
        example: bdhvuc5tex
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamedayPlayerStatsGameUuid'
          description: OK
      summary: Extended skater and goalie game stats per team (2023/24 on)
  /gameday/post-game-data/team-stats/{game_uuid}:
    get:
      description: Coverage 2023/24 on; older games answer 200 with an empty body. Player keys are isa
        (StatNet) ids.
      operationId: gameday_post_game_data_team_stats_game_uuid
      parameters:
      - description: Game uuid (gameInfo[].uuid from /sports-v2/game-schedule). gameday/* has data from
          2023/24 on; older games answer 200 with an empty body.
        example: bdhvuc5tex
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      - description: ssgt uuid.
        example: iuzqg7dqk9
        in: query
        name: ssgtUuid
        required: true
        schema:
          type: string
      - description: Home team uuid; without it the home side comes back blank.
        example: 087a-087aTQv9u
        in: query
        name: homeTeamUuid
        required: true
        schema:
          type: string
      - description: Away team uuid; without it the away side comes back blank.
        example: 41c4-41c4BiYZU
        in: query
        name: awayTeamUuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamedayPostGameDataTeamStatsGameUuid'
          description: OK
      summary: Post-game team comparison
  /gameday/team-standings/{ssgt_uuid}:
    get:
      operationId: gameday_team_standings_ssgt_uuid
      parameters:
      - description: 'ssgt uuid: one season + series + game type (e.g. 2025/2026 SHL regular season).
          Directory: /statistics-v2/layout-info seasonSeriesGameTypeTeams[].ssgtUuid.'
        example: iuzqg7dqk9
        in: path
        name: ssgt_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamedayTeamStandingsSsgtUuid'
          description: OK
      summary: Standings of an ssgt (gameday widget)
  /gameday/team-stats/{game_uuid}:
    get:
      description: Coverage 2023/24 on; older games answer 200 with an empty body. Player keys are isa
        (StatNet) ids.
      operationId: gameday_team_stats_game_uuid
      parameters:
      - description: Game uuid (gameInfo[].uuid from /sports-v2/game-schedule). gameday/* has data from
          2023/24 on; older games answer 200 with an empty body.
        example: bdhvuc5tex
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamedayTeamStatsGameUuid'
          description: OK
      summary: Team stats per period and total (2023/24 on)
  /sports-v2/all-sites/{ssgt_uuid}:
    get:
      operationId: sports_v2_all_sites_ssgt_uuid
      parameters:
      - description: 'ssgt uuid: one season + series + game type (e.g. 2025/2026 SHL regular season).
          Directory: /statistics-v2/layout-info seasonSeriesGameTypeTeams[].ssgtUuid.'
        example: iuzqg7dqk9
        in: path
        name: ssgt_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsV2AllSitesSsgtUuid'
          description: OK
      summary: Teams (sites) taking part in an ssgt
  /sports-v2/athlete-details/{athlete_uuid}:
    get:
      description: 'All ids of one player: athleteData.playerExtIds[] lists isa, ramses_legacy, ramses_generic_legacy
        and ramses_merged. For a whole season, stats-info players{} maps isa -> athlete uuid in one call.'
      operationId: sports_v2_athlete_details_athlete_uuid
      parameters:
      - description: Athlete uuid (stats-info stats[].info.uuid, roster rows, or athlete-details).
        example: qQ9-349c7WDv6
        in: path
        name: athlete_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsV2AthleteDetailsAthleteUuid'
          description: OK
      summary: Player bio plus playerExtIds (isa, ramses_legacy, ...)
  /sports-v2/athletes/by-team-uuid/{team_uuid}:
    get:
      description: Current roster only; there is no season parameter.
      operationId: sports_v2_athletes_by_team_uuid_team_uuid
      parameters:
      - description: Team uuid (homeTeamInfo.uuid / awayTeamInfo.uuid in the schedule, or teamList[].uuid).
        example: 087a-087aTQv9u
        in: path
        name: team_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsV2AthletesByTeamUuidTeamUuid'
          description: OK
      summary: Current roster of a team, grouped by position
  /sports-v2/game-info/{game_uuid}:
    get:
      operationId: sports_v2_game_info_game_uuid
      parameters:
      - description: Game uuid (gameInfo[].uuid from /sports-v2/game-schedule). gameday/* has data from
          2023/24 on; older games answer 200 with an empty body.
        example: bdhvuc5tex
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsV2GameInfoGameUuid'
          description: OK
      summary: 'Game header: StatNet extId, arena, state, teams, scores'
  /sports-v2/game-schedule:
    get:
      description: 'All three uuids are required (400 otherwise). Season 2025/2026 regular season: 364
        games. Pre-2004 start times read 00:00.'
      operationId: sports_v2_game_schedule
      parameters:
      - description: Season uuid (season[].uuid from the filter endpoint; code 2025 = 2025/2026).
        example: xs4m9qupsi
        in: query
        name: seasonUuid
        required: true
        schema:
          type: string
      - description: Series uuid (SHL qQ9-bb0bzEWUk).
        example: qQ9-bb0bzEWUk
        in: query
        name: seriesUuid
        required: true
        schema:
          type: string
      - description: Game type uuid (regular qQ9-af37Ti40B, playoff qQ9-7debq38kX, qualdown qRf-347BaDIOc).
        example: qQ9-af37Ti40B
        in: query
        name: gameTypeUuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsV2GameSchedule'
          description: OK
      summary: Schedule and results of one season + series + game type
  /sports-v2/last-game-day:
    get:
      operationId: sports_v2_last_game_day
      parameters:
      - description: ssgt uuid.
        example: qa98unlbd6
        in: query
        name: seasonSeriesGameType
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsV2LastGameDay'
          description: OK
      summary: Games of the last played match day of an ssgt
  /sports-v2/next-game-day:
    get:
      operationId: sports_v2_next_game_day
      parameters:
      - description: ssgt uuid.
        example: qa98unlbd6
        in: query
        name: seasonSeriesGameType
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsV2NextGameDay'
          description: OK
      summary: Games of the next match day of an ssgt
  /sports-v2/played-games/{team_uuid}:
    get:
      operationId: sports_v2_played_games_team_uuid
      parameters:
      - description: Team uuid (homeTeamInfo.uuid / awayTeamInfo.uuid in the schedule, or teamList[].uuid).
        example: 087a-087aTQv9u
        in: path
        name: team_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsV2PlayedGamesTeamUuid'
          description: OK
      summary: A team's recent games
  /sports-v2/season-series-game-types-filter:
    get:
      operationId: sports_v2_season_series_game_types_filter
      parameters:
      - description: Series uuid (SHL qQ9-bb0bzEWUk, CHL qQ9-9397drVEh). No effect on the body in the
          drop-one probe.
        example: qQ9-bb0bzEWUk
        in: query
        name: series
        required: false
        schema:
          type: string
      - description: Season uuid; picks the default ssgt returned for that season (omit for the current
          season).
        example: xs4m9qupsi
        in: query
        name: season
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsV2SeasonSeriesGameTypesFilter'
          description: OK
      summary: Series, seasons (1975/76 on) and game types with their uuids, plus the default ssgt
  /sports-v2/ssgt/{ssgt_uuid}/provider:
    get:
      description: Plain word in a text/html response, not JSON.
      operationId: sports_v2_ssgt_ssgt_uuid_provider
      parameters:
      - description: 'ssgt uuid: one season + series + game type (e.g. 2025/2026 SHL regular season).
          Directory: /statistics-v2/layout-info seasonSeriesGameTypeTeams[].ssgtUuid.'
        example: iuzqg7dqk9
        in: path
        name: ssgt_uuid
        required: true
