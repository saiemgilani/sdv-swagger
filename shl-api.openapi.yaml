  /statistics-v2/player-h2h-v2/{ssgt_uuid}/{home_team_uuid}/{away_team_uuid}:
    get:
      description: 'Answers for the CURRENT season: effectiveSsgtUuid / effectiveSeasonLabel came back
        as 2026/2027 for a 2025/2026 ssgt in the path.'
      operationId: statistics_v2_player_h2h_v2_ssgt_uuid_home_team_uuid_away_team_uuid
      parameters:
      - description: 'ssgt uuid: one season + series + game type (e.g. 2025/2026 SHL regular season).
          Directory: /statistics-v2/layout-info seasonSeriesGameTypeTeams[].ssgtUuid.'
        example: iuzqg7dqk9
        in: path
        name: ssgt_uuid
        required: true
        schema:
          type: string
      - description: Home team uuid of the game.
        example: 087a-087aTQv9u
        in: path
        name: home_team_uuid
        required: true
        schema:
          type: string
      - description: Away team uuid of the game.
        example: 41c4-41c4BiYZU
        in: path
        name: away_team_uuid
        required: true
        schema:
          type: string
      - description: Game uuid; narrows the head-to-head to that game's line-ups.
        example: bdhvuc5tex
        in: query
        name: gameUuid
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsV2PlayerH2hV2SsgtUuidHomeTeamUuidAwayTeamUuid'
          description: OK
      summary: Player head-to-head for a matchup
  /statistics-v2/stats-info/{module}:
    get:
      description: 'TRUNCATION TRAP: without count=1000 the table stops at 50 rows and totalCount reports
        50, so the cut is invisible. The body is a one-item list; stats[] rows are keyed by dataColumns[].name,
        players{} is keyed by the isa (StatNet) player id and teams{} by team uuid. Data back to 1975/76.'
      operationId: statistics_v2_stats_info_module
      parameters:
      - description: 'Stats module: <group>_<table>. Every name under layout-info [].filters.<group>.modules.'
        example: players_summary
        in: path
        name: module
        required: true
        schema:
          enum:
          - players_summary
          - players_point
          - players_strength
          - players_goal
          - players_timeOnIce
          - players_powerplay
          - players_penaltykilling
          - players_equalStrength
          - players_penalty
          - players_plusMinus
          - players_faceoff
          - players_shot
          - players_defensive
          - players_penaltyShot
          - players_extendedMetrics
          - teams_result
          - teams_goal
          - teams_powerplay
          - teams_penaltyKilling
          - teams_attendance
          - teams_penalty
          - teams_shotsForward
          - teams_shotsAgainst
          - teams_faceoff
          - teams_penaltyShot
          - teams_extendedMetrics
          - teams_stoppage
          - goalkeepers_summary
          - goalkeepers_shotAgainst
          - goalkeepers_result
          - goalkeepers_strength
          - goalkeepers_penaltyShot
          - games_games
          - standings_standings
          type: string
      - description: ssgt uuid.
        example: iuzqg7dqk9
        in: query
        name: ssgtUuid
        required: true
        schema:
          type: string
      - description: 'Rows to return. Pass 1000: the default is 50 and totalCount echoes the cut, so a
          short page looks complete.'
        example: '1000'
        in: query
        name: count
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsV2StatsInfoModule'
          description: OK
      summary: Stats table of one module for an ssgt (standings, players, goalies, teams, games)
