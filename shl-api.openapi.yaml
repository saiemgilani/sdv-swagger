  /statistics-v2/stats-info/{module}:
    get:
      description: 'TRUNCATION TRAP: without count=1000 the table stops at 50 rows and totalCount reports
        50, so the cut is invisible. The body is a one-item list; stats[] rows are keyed by dataColumns[].name,
        players{} (player and goalie modules) is keyed by the isa (StatNet) player id; teams{} by team
        uuid in players_* and goalkeepers_* modules but by team CODE in teams_*, games_games and standings_standings;
        games{} (games_games only) by StatNet gameId. Data back to 1975/76.'
      operationId: statistics_v2_stats_info_module
      parameters:
      - description: 'Stats module: <group>_<table>. Every name under layout-info [].filters.<group>.modules.'
        example: players_summary
        in: path
        name: module
        required: true
        schema:
          enum:
          - players_summary
          - players_point
          - players_strength
          - players_goal
          - players_timeOnIce
          - players_powerplay
          - players_penaltykilling
          - players_equalStrength
          - players_penalty
          - players_plusMinus
          - players_faceoff
          - players_shot
          - players_defensive
          - players_penaltyShot
          - players_extendedMetrics
          - teams_result
          - teams_goal
          - teams_powerplay
          - teams_penaltyKilling
          - teams_attendance
          - teams_penalty
          - teams_shotsForward
          - teams_shotsAgainst
          - teams_faceoff
          - teams_penaltyShot
          - teams_extendedMetrics
          - teams_stoppage
          - goalkeepers_summary
          - goalkeepers_shotAgainst
          - goalkeepers_result
          - goalkeepers_strength
          - goalkeepers_penaltyShot
          - games_games
          - standings_standings
          type: string
      - description: ssgt uuid.
        example: iuzqg7dqk9
        in: query
        name: ssgtUuid
        required: true
        schema:
          type: string
      - description: 'Rows to return. Pass 1000: the default is 50 and totalCount echoes the cut, so a
          short page looks complete.'
        example: '1000'
        in: query
        name: count
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsV2StatsInfoModule'
          description: OK
      summary: Stats table of one module for an ssgt (standings, players, goalies, teams, games)
