components:
  schemas:
    VhlCalendar:
      properties:
        games:
          description: Every game of the tournament, latest day first (992 for tn 1374).
          items:
            properties:
              away_club_id:
                description: 'Away club id. Club id (khl/ terminology): stable across seasons (Toros =
                  192 in both 1374 and 1430); the {id} of the img.khl.ru logo path /teams/ru/{tn}/{id}/60.png.
                  Not the team page id (*_team_page_id) and not a team-season id.'
                type: integer
              away_score:
                description: Away goals including the shootout winner goal; null before the game.
                type: integer
              away_team:
                description: Away team name (Latin, FULL form, like home_team).
                type: string
              city:
                description: City of the home team's arena (English).
                type: string
              date:
                description: Day header in English, day and month only ('18 March'); the page prints no
                  year and no start time.
                type: string
              decision:
                description: 'How the game ended beyond regulation: OT (overtime) or SO (shootout); null
                  for regulation or unplayed games.'
                type: string
              game_id:
                description: 'Game id: idgame of /en/report/{tn}/?idgame= and the {idgame} of online.vhlru.ru/online/{idgame}.html.
                  Shares the khl.ru game id sequence.'
                type: integer
              game_number:
                description: Official game number within the tournament (from '№986').
                type: integer
              home_club_id:
                description: 'Home club id. Club id (khl/ terminology): stable across seasons (Toros =
                  192 in both 1374 and 1430); the {id} of the img.khl.ru logo path /teams/ru/{tn}/{id}/60.png.
                  Not the team page id (*_team_page_id) and not a team-season id.'
                type: integer
              home_score:
                description: Home goals including the shootout winner goal; null before the game.
                type: integer
              home_team:
                description: 'Home team name (Latin, FULL form: ''Kristall S''; standings, stats and the
                  team page use the short ''Kristall'').'
                type: string
              online_url:
                description: Text-broadcast URL (online.vhlru.ru/online/{game_id}.html).
                type: string
              score:
                description: Final score 'home:away'; '-:-' before the game.
                type: string
              status:
                description: Unobserved in samples (null in every capture); type and meaning unverified.
                x-unobserved: true
              weekday:
                description: Weekday of the day header (English).
                type: string
              winner:
                description: 'Winning side from the win-home / win-visitor class: home or away; null before
                  the game.'
                type: string
            type: object
          type: array
        team_seasons:
          description: Teams of this tournament with their team-season ids (the club filter <select name=club>).
          items:
            properties:
              name:
                description: 'Team name (Latin, SHORT form: ''Kristall'') as the calendar''s club filter
                  lists it.'
                type: string
              team_season_id:
                description: 'Team-season id (khl/ terminology): one id per team per tournament, from
                  the KHL''s sequence (khl/: Spartak = 14934 in 1369; here Metallurg = 15017 in 1374).
                  The {id} of /calendar/{tn}/0/{id}/ and /stats/players/{tn}/all/{id}/. Not the stable
                  club id (*_club_id) and not the team page id.'
                type: integer
            type: object
          type: array
        tournament:
          description: The page's own tournament (the selected option of <select name=tournament>); equals
            the requested tn or the capture refuses.
          properties:
            label:
              description: 'Tournament label as the select shows it: ''<season> | <stage>'' (''25/26 |
                Regular Season'').'
              type: string
            season:
              description: Season label, two-digit START/END years ('25/26' = 2025-26).
              type: string
            stage:
              description: 'Season stage label: ''Regular Season'' or ''Playoffs''.'
              type: string
            tn:
              description: Tournament id (season stage; the {tn} path parameter).
              type: integer
          type: object
        tournaments:
          description: Every tournament (season stage) the select offers, newest first; 33 on 2026-10-12,
            2010/11 (189/190) to 2026/27 (1430).
          items:
            properties:
              label:
                description: 'Tournament label as the select shows it: ''<season> | <stage>'' (''25/26
                  | Regular Season'').'
                type: string
              tn:
                description: Tournament id of one season stage (all 33 in the select; the sample keeps
                  3).
                type: integer
            type: object
          type: array
      type: object
    VhlGameReport:
      properties:
        game:
          description: Header block (section.match-card).
          properties:
            attendance:
              description: Attendance (from '910 sp').
              type: integer
            away_city:
              description: Away team city.
              type: string
            away_coach:
              description: Away head coach, 'Surname Given'.
              type: string
            away_score:
              description: Away final goals.
              type: integer
            away_short:
              description: 'Away team short name: the header of the goals table''s away on-ice column.'
              type: string
            away_team:
              description: Away team name (Latin, FULL form).
              type: string
            away_team_page_id:
              description: 'Away team page id. Team page id (vhlru.ru only): the {team_id} of /en/teams/{team_id}/
                (Toros = 390). Neither a club id nor a team-season id; it joins nothing else (bridge:
                the calendar row of the same game_id).'
              type: integer
            date:
              description: Game date, ISO 'YYYY-MM-DD', parsed from date_text.
              type: string
            date_text:
              description: Date line verbatim; RUSSIAN month and weekday even on /en/ ('18 Март 2026,
                Среда, 17:00'). The <time datetime> attribute is a constant placeholder (2020-01-23 18:00)
                and is ignored.
              type: string
            decision:
              description: OT or SO when the game went past regulation; null otherwise.
              type: string
            game_number:
              description: Official game number (from '№984'); checked against the request.
              type: integer
            home_city:
              description: Home team city.
              type: string
            home_coach:
              description: Home head coach, 'Surname Given'.
              type: string
            home_score:
              description: Home final goals.
              type: integer
            home_short:
              description: 'Home team short name: the header of the goals table''s home on-ice column;
                used to assign team_side.'
              type: string
            home_team:
              description: 'Home team name (Latin, FULL form: ''Kristall S''; the report''s tables use
                the short ''Kristall'').'
              type: string
            home_team_page_id:
              description: 'Home team page id. Team page id (vhlru.ru only): the {team_id} of /en/teams/{team_id}/
                (Toros = 390). Neither a club id nor a team-season id; it joins nothing else (bridge:
                the calendar row of the same game_id).'
              type: integer
            linesmen:
              description: 'Linesmen: sweater number and name.'
              items:
                properties:
                  name:
                    description: Linesman name, 'Surname Given'.
                    type: string
                  number:
                    description: Official's sweater number.
                    type: integer
                type: object
              type: array
            local_time:
              description: Start time 'HH:MM' from date_text; local time zone unverified (likely Moscow).
              type: string
            period_scores:
              description: 'Score of each period ''home:away'', overtime and shootout included (SO game:
                ''0:2'',''0:0'',''2:0'',''0:0'',''0:1'').'
              items:
                type: string
              type: array
            referees:
              description: 'Referees: sweater number and name.'
              items:
                properties:
                  name:
                    description: Referee name, 'Surname Given'.
                    type: string
                  number:
                    description: Official's sweater number.
                    type: integer
                type: object
              type: array
            score:
              description: Final score 'home:away' (the shootout counts as one goal).
              type: string
            season:
              description: Season, four-digit years 'YYYY/YYYY' (from 'Season 2025/2026'); checked against
                the request.
              type: string
            stage:
              description: 'Season stage label: ''Regular Season'' or ''Playoffs''; checked against the
                request.'
              type: string
          type: object
        goalies:
          description: Goalie lines of both teams for this game (Players summary > Goaltenders); GP 0
            = dressed but did not play.
          items:
            properties:
              assists:
                description: Assists (A).
                type: integer
              captaincy:
                description: Unobserved in samples (null in every capture); type and meaning unverified.
                x-unobserved: true
              gaa:
                description: Goals-against average (GAA) = 60 x GA / TOI minutes; null when the page shows
                  '-'.
                type: number
              games_played:
                description: Games played (GP).
                type: integer
              goals_against:
                description: Goals allowed (GA).
                type: integer
              jersey:
                description: Jersey number (integer).
                type: integer
              losses:
                description: Goalie losses (L).
                type: integer
              penalty_minutes:
                description: Penalty minutes (PIM).
                type: integer
              player:
                description: Player name, 'Surname Given' (Latin on /en/ pages).
                type: string
              player_id:
                description: 'Player id: the {player_id} of /en/players/{player_id}/, stable across seasons
                  and teams; also the photo id on img.khl.ru. Same numeric sequence as khl.ru player ids;
                  whether it equals the same person''s khl.ru id is unverified.'
                type: integer
              save_pct:
                description: Save percentage (%Sv); 0-100 scale (93.8 = 93.8 %); null when the page shows
                  '-'.
                type: number
              saves:
                description: Saves (Sv).
                type: integer
              shootouts_played:
                description: Shootouts played (SOP).
                type: integer
              shots_against:
                description: Shots on goal faced (the SOG column of goalie tables).
                type: integer
              shutouts:
                description: Shutouts (SO).
                type: integer
              team_side:
                description: 'Which side of the game the row belongs to: home or away (from the section''s
                  team heading).'
                type: string
              toi:
                description: Time on ice in this game, 'mm:ss'; null for a dressed goalie who did not
                  play ('-').
                type: string
              wins:
                description: Goalie wins (W).
                type: integer
            type: object
          type: array
        goals:
          description: Scoring summary, one row per goal in order (the shootout winner is the last row).
          items:
            properties:
              assist1:
                description: First assist name; null when unassisted.
                type: string
              assist1_id:
                description: Player id of the first assist; null when unassisted.
                type: integer
              assist1_jersey:
                description: First assist jersey number.
                type: integer
              assist1_season_total:
                description: The first assist's season assist count after this goal (the '(14)' suffix).
                type: integer
              assist2:
                description: Second assist name; null when none.
                type:
                - string
                - 'null'
              assist2_id:
                description: Player id of the second assist; null when none.
                type:
                - integer
                - 'null'
              assist2_jersey:
                description: Second assist jersey number.
                type:
                - integer
                - 'null'
              assist2_season_total:
                description: The second assist's season assist count after this goal.
                type:
                - integer
                - 'null'
              away_on_ice:
                description: Jersey numbers of the away players on ice at the goal (goalie included);
                  the column header is the away team's short name. Empty on the shootout row.
                items:
                  type: integer
                type: array
              goal_number:
                description: Goal number in the game (G).
                type: integer
              home_on_ice:
                description: 'Jersey numbers of the home players on ice at the goal (goalie included);
                  the column header is the home team''s short name. Shootout row: the goalie only.'
                items:
                  type: integer
                type: array
              period:
                description: 'Period (Per) as printed: ''1'', ''2'', ''3'', overtime unverified, ''РБ''
                  (Cyrillic even on /en/: shootout, решающий бросок).'
                type: string
              score:
                description: Score after the goal 'home:away' (Score).
                type: string
              scorer:
                description: Scorer name.
                type: string
              scorer_id:
                description: 'Player id of the scorer: the {player_id} of /en/players/{player_id}/, stable
                  across seasons and teams; also the photo id on img.khl.ru. Same numeric sequence as
                  khl.ru player ids; whether it equals the same person''s khl.ru id is unverified.'
                type: integer
              scorer_jersey:
                description: Scorer jersey number.
                type: integer
              scorer_season_total:
                description: The scorer's season goal count after this goal (the '(13)' suffix); null
                  on the shootout row.
                type: integer
              strength:
                description: 'Goal strength code (PMG): eq (even), ppg (power play), shg (shorthanded);
                  null on the shootout row.'
                type: string
              time:
                description: Elapsed game time 'mm:ss' from the opening faceoff (Time); the shootout row
                  says '65:00'.
                type: string
            type: object
          type: array
        penalties:
          description: Penalties of both teams (PENALTY SUMMARY); per-period total rows (colspan 2) are
            dropped.
          items:
            properties:
              infraction:
                description: Infraction in English ('hooking'); null when the site leaves it blank.
                type:
                - string
                - 'null'
              minutes:
                description: Penalty length in minutes (the unlabelled third column).
                type: integer
              player:
                description: Penalised player name; null for a bench (team) penalty.
                type: string
              player_id:
                description: Player id of the penalised player; null for a bench (team) penalty.
                type: integer
              player_jersey:
                description: Penalised player's jersey number.
                type: integer
              team_side:
                description: 'Which side of the game the row belongs to: home or away (from the section''s
                  team heading).'
                type: string
              time:
                description: Elapsed game time of the penalty 'mm:ss'.
                type: string
            type: object
          type: array
        shootout:
          description: Shootout rounds (SHOOTOUTS SUMMARY); empty when the game had no shootout.
          items:
            properties:
              away_goalie:
                description: Away goalie name.
                type: string
              away_goalie_id:
                description: Player id of the away goalie facing the home shooter.
                type: integer
              away_shooter:
                description: Away shooter name.
                type: string
              away_shooter_id:
                description: Player id of the away shooter.
                type: integer
              away_shooter_jersey:
                description: Away shooter jersey number.
                type: integer
              home_goalie:
                description: Home goalie name.
                type: string
              home_goalie_id:
                description: Player id of the home goalie facing the away shooter.
                type: integer
              home_shooter:
                description: Home shooter name.
                type: string
              home_shooter_id:
                description: Player id of the home shooter.
                type: integer
              home_shooter_jersey:
                description: Home shooter jersey number.
                type: integer
              round:
                description: Shootout round, 1-based (each round is a pair of table rows).
                type: integer
              score_after:
                description: Shootout score 'home:away' after the round (rowspan cell).
                type: string
            type: object
          type: array
        shots_by_period:
          description: Goals and shots on goal by period for both teams (SHOTS); the last row is the game
            total.
          items:
            properties:
              away_goals:
                description: Away goals in the period (G, right half).
                type: integer
              away_shot_pct:
                description: Away goals / shots on goal x 100 (%SOG, right half); 0-100; null for '-'.
                type: number
              away_shots_on_goal:
                description: Away shots on goal in the period (SOG, right half).
                type: integer
              home_goals:
                description: Home goals in the period (G, left half).
                type: integer
              home_shot_pct:
                description: Home goals / shots on goal x 100 (%SOG, left half); 0-100; null for '-'.
                type: number
              home_shots_on_goal:
                description: Home shots on goal in the period (SOG, left half).
                type: integer
              period:
                description: Period label as printed ('1-st period', '2-d period', '3-d period', 'Overtime');
                  null on the totals row.
                type:
                - string
                - 'null'
            type: object
          type: array
        skaters:
          description: Skater lines of both teams for this game (Players summary > Defensmen, Forwards).
          items:
            properties:
              assists:
                description: Assists (A).
                type: integer
              blocked_shots:
                description: Blocked shots (BLS).
                type: integer
              captaincy:
                description: 'Captaincy marker from the name suffix: C (captain), A (alternate); null
                  otherwise.'
                type: string
              even_strength_goals:
                description: Even-strength goals (ESG).
                type: integer
              faceoff_pct:
                description: Faceoff win percentage (%FO); 0-100 scale; null when the page shows '-' (no
                  faceoffs taken).
                type:
                - number
                - 'null'
              faceoffs:
                description: Faceoffs taken (FO).
                type: integer
              faceoffs_won:
                description: Faceoffs won (FOW).
                type: integer
              game_winning_goals:
                description: Game-winning goals (GWG).
                type: integer
              games_played:
                description: Games played (GP).
                type: integer
              goals:
                description: Goals (G).
                type: integer
              hits:
                description: Body checks delivered (Hits).
                type: integer
              jersey:
                description: Jersey number (integer).
                type: integer
              overtime_goals:
                description: Overtime goals (OTG).
                type: integer
              penalty_minutes:
                description: Penalty minutes (PIM).
                type: integer
              player:
                description: Player name, 'Surname Given' (Latin on /en/ pages).
                type: string
              player_id:
                description: 'Player id: the {player_id} of /en/players/{player_id}/, stable across seasons
                  and teams; also the photo id on img.khl.ru. Same numeric sequence as khl.ru player ids;
                  whether it equals the same person''s khl.ru id is unverified.'
                type: integer
              plus_minus:
                description: Plus/minus (+/-).
                type: integer
              points:
                description: Points, goals + assists (PTS).
                type: integer
              position_group:
                description: 'Position group of the source table: defense (Defensmen) or forward (Forwards).'
                type: string
              power_play_goals:
                description: Power-play goals (PPG).
                type: integer
              shifts_per_game:
                description: Shifts in this game (Sft/G with GP 1).
                type: integer
              shootout_deciding_goals:
                description: Shootout-deciding goals (SDS; the legend says 'Shootouts deciding shots').
                type: integer
              shorthanded_goals:
                description: Shorthanded goals (SHG).
                type: integer
              shot_pct:
                description: Shooting percentage, goals / shots on goal x 100 (%SOG); 0-100 scale; null
                  when the page shows '-'.
                type: number
              shots_on_goal:
                description: Shots on goal (SOG).
                type: integer
              team_side:
                description: 'Which side of the game the row belongs to: home or away (from the section''s
                  team heading).'
                type: string
              toi_per_game:
                description: Time on ice in this game (TOI/G with GP 1), 'mm:ss'.
                type: string
            type: object
          type: array
        team_goals_against:
          description: Goals AGAINST per team by manpower (Teams summary > GOALS AGAINST).
          items:
            properties:
              empty_net:
                description: Empty-net goals conceded (EN).
                type: integer
              g_3v3:
                description: Goals conceded while the row's team had 3 skaters and the opponent 3 (the
                  '3 x 3' column; the row team's own count comes first in both tables, so 4 x 5 here =
                  a power-play goal against).
                type: integer
              g_3v4:
                description: Goals conceded while the row's team had 3 skaters and the opponent 4 (the
                  '3 x 4' column; the row team's own count comes first in both tables, so 4 x 5 here =
                  a power-play goal against).
                type: integer
              g_3v5:
                description: Goals conceded while the row's team had 3 skaters and the opponent 5 (the
                  '3 x 5' column; the row team's own count comes first in both tables, so 4 x 5 here =
                  a power-play goal against).
                type: integer
              g_4v3:
                description: Goals conceded while the row's team had 4 skaters and the opponent 3 (the
                  '4 x 3' column; the row team's own count comes first in both tables, so 4 x 5 here =
                  a power-play goal against).
                type: integer
              g_4v4:
                description: Goals conceded while the row's team had 4 skaters and the opponent 4 (the
                  '4 x 4' column; the row team's own count comes first in both tables, so 4 x 5 here =
                  a power-play goal against).
                type: integer
              g_4v5:
                description: Goals conceded while the row's team had 4 skaters and the opponent 5 (the
                  '4 x 5' column; the row team's own count comes first in both tables, so 4 x 5 here =
                  a power-play goal against).
                type: integer
              g_5v3:
                description: Goals conceded while the row's team had 5 skaters and the opponent 3 (the
                  '5 x 3' column; the row team's own count comes first in both tables, so 4 x 5 here =
                  a power-play goal against).
                type: integer
              g_5v4:
                description: Goals conceded while the row's team had 5 skaters and the opponent 4 (the
                  '5 x 4' column; the row team's own count comes first in both tables, so 4 x 5 here =
                  a power-play goal against).
                type: integer
              g_5v5:
                description: Goals conceded while the row's team had 5 skaters and the opponent 5 (the
                  '5 x 5' column; the row team's own count comes first in both tables, so 4 x 5 here =
                  a power-play goal against).
                type: integer
              games_played:
                description: Games played (GP).
                type: integer
              penalty_shot:
                description: Penalty-shot goals conceded (PS; the shootout winner counts here).
                type: integer
              team:
                description: Team short name (Latin), as the table prints it.
                type: string
              total:
                description: Total goals conceded (the unlabelled last column).
                type: integer
            type: object
          type: array
        team_goals_for:
          description: Goals FOR per team by manpower (Teams summary > GOALS FOR).
          items:
            properties:
              empty_net:
                description: Empty-net goals scored (EN).
                type: integer
              g_3v3:
                description: Goals scored while the row's team had 3 skaters and the opponent 3 (the '3
                  x 3' column; the row team's own count comes first, so 5 x 4 = a power-play goal).
                type: integer
              g_3v4:
                description: Goals scored while the row's team had 3 skaters and the opponent 4 (the '3
                  x 4' column; the row team's own count comes first, so 5 x 4 = a power-play goal).
                type: integer
              g_3v5:
                description: Goals scored while the row's team had 3 skaters and the opponent 5 (the '3
                  x 5' column; the row team's own count comes first, so 5 x 4 = a power-play goal).
                type: integer
              g_4v3:
                description: Goals scored while the row's team had 4 skaters and the opponent 3 (the '4
                  x 3' column; the row team's own count comes first, so 5 x 4 = a power-play goal).
                type: integer
              g_4v4:
                description: Goals scored while the row's team had 4 skaters and the opponent 4 (the '4
                  x 4' column; the row team's own count comes first, so 5 x 4 = a power-play goal).
                type: integer
              g_4v5:
                description: Goals scored while the row's team had 4 skaters and the opponent 5 (the '4
                  x 5' column; the row team's own count comes first, so 5 x 4 = a power-play goal).
                type: integer
              g_5v3:
                description: Goals scored while the row's team had 5 skaters and the opponent 3 (the '5
                  x 3' column; the row team's own count comes first, so 5 x 4 = a power-play goal).
                type: integer
              g_5v4:
                description: Goals scored while the row's team had 5 skaters and the opponent 4 (the '5
                  x 4' column; the row team's own count comes first, so 5 x 4 = a power-play goal).
                type: integer
              g_5v5:
                description: Goals scored while the row's team had 5 skaters and the opponent 5 (the '5
                  x 5' column; the row team's own count comes first, so 5 x 4 = a power-play goal).
                type: integer
              games_played:
                description: Games played (GP).
                type: integer
              penalty_shot:
                description: Penalty-shot goals scored (PS; the shootout winner counts here).
                type: integer
              team:
                description: Team short name (Latin), as the table prints it.
                type: string
              total:
                description: Total goals scored (the unlabelled last column).
                type: integer
            type: object
          type: array
        team_powerplay:
          description: Special teams per team (Teams summary > Powerplays).
          items:
            properties:
              games_played:
                description: Games played (GP).
                type: integer
              penalty_kill_pct:
                description: Penalty-kill % (%PK); 0-100.
                type: number
              power_play_goals:
                description: Power-play goals for (GF).
                type: integer
              power_play_goals_against:
                description: Power-play goals against (PPGA).
                type: integer
              power_play_pct:
                description: Power-play conversion % (%PP); 0-100.
                type: number
              power_plays:
                description: Power-play opportunities (PP).
                type: integer
              shorthanded_goals:
                description: Shorthanded goals for (SHG).
                type: integer
              shorthanded_goals_against:
                description: Shorthanded goals against (SHGA).
                type: integer
              team:
                description: Team short name (Latin), as the table prints it.
                type: string
              times_shorthanded:
                description: Times shorthanded (TS).
