              description: 'Tournament label as the select shows it: ''<season> | <stage>'' (''25/26 |
                Regular Season'').'
              type: string
            season:
              description: Season label, two-digit START/END years ('25/26' = 2025-26).
              type: string
            stage:
              description: 'Season stage label: ''Regular Season'' or ''Playoffs''.'
              type: string
            tn:
              description: Tournament id (season stage; the {tn} path parameter).
              type: integer
          type: object
      type: object
    VhlStandings:
      properties:
        rows:
          description: Standings rows in rank order (32 teams in 1374).
          items:
            properties:
              games_played:
                description: Games played (GP).
                type: integer
              goals_against:
                description: Goals against (right side of the G column).
                type: integer
              goals_for:
                description: Goals for (left side of the G column '226-131').
                type: integer
              losses:
                description: Regulation losses (L).
                type: integer
              ot_losses:
                description: Overtime losses (OTL).
                type: integer
              ot_wins:
                description: Overtime wins (OTW).
                type: integer
              points:
                description: 'Points (PTS): 2 per win of any kind, 1 per OT or SO loss.'
                type: integer
              rank:
                description: Rank (unlabelled first column).
                type: integer
              so_losses:
                description: Shootout losses (SOL).
                type: integer
              so_wins:
                description: Shootout wins (SOW).
                type: integer
              team:
                description: 'Team name (Latin, SHORT form: ''Kristall'').'
                type: string
              team_season_id:
                description: 'Team-season id (khl/ terminology): one id per team per tournament, from
                  the KHL''s sequence (khl/: Spartak = 14934 in 1369; here Metallurg = 15017 in 1374).
                  The {id} of /calendar/{tn}/0/{id}/ and /stats/players/{tn}/all/{id}/. Not the stable
                  club id (*_club_id) and not the team page id.'
                type: integer
              wins:
                description: Regulation wins (W).
                type: integer
            type: object
          type: array
        tournament:
          description: The page's own tournament (selected option of <select name=team>); equals the requested
            tn or the capture refuses.
          properties:
            label:
              description: 'Tournament label as the select shows it: ''<season> | <stage>'' (''25/26 |
                Regular Season'').'
              type: string
            season:
              description: Season label, two-digit START/END years ('25/26' = 2025-26).
              type: string
            stage:
              description: 'Season stage label: ''Regular Season'' or ''Playoffs''.'
              type: string
            tn:
              description: Tournament id (season stage; the {tn} path parameter).
              type: integer
          type: object
      type: object
    VhlTeam:
      properties:
        address:
          description: Postal address (English).
          type: string
        arena_capacity:
          description: Arena capacity (seats), from the Arena tab.
          type: integer
        calendar_team_season_id:
          description: Team-season id of the club in the CURRENT tournament (calendar_tn), from the 'To
            the calendar' link /calendar/{tn}/0/{id}/. With calendar_tn, the only bridge from a team page
            id to a team-season id, and for the current tn only.
          type: integer
        calendar_tn:
          description: 'Tournament id of the ''To the calendar'' link: the CURRENT tournament, whatever
            season you came from.'
          type: integer
        city:
          description: City (English).
          type: string
        founded:
          description: Year of foundation.
          type: integer
        full_name:
          description: 'Name before the comma of the h2 ''Name , City | Year of foundation: N''. Despite
            the key, the SHORT form here too (''Kristall'').'
          type: string
        honours:
          description: Club honours, one class-less <h3> each, verbatim in RUSSIAN ('Победитель Первенства
            СССР среди команд первой лиги 1974, 1976' = winner of the USSR first-league championship);
            empty for clubs without any (Toros).
          items:
            type: string
          type: array
        name:
          description: 'Team name (Latin, SHORT form: ''Kristall''; the calendar and report header say
            ''Kristall S''), from the h1; checked against the expected name.'
          type: string
        officials:
          description: 'Club officials, one per ''<p>Role:<b>Name</b></p>'' line, every role kept (Toros
            and Kristall: Director, Head Coach).'
          items:
            properties:
              name:
                description: Official's name, 'Given Surname' order on this page.
                type: string
              role:
                description: 'Role label as printed (English): Director and Head Coach in the samples;
                  President and General Manager also occur.'
                type: string
            type: object
          type: array
        phone:
          description: Phone number(s) as printed (comma-separated when several).
          type:
          - string
          - 'null'
        roster:
          description: Current roster (the page's first table).
          items:
            properties:
              born:
                description: 'Birth date ''DD.MM.YYYY''. REDACTED: masked to the literal ''DD.MM.YYYY''
                  in the samples (x-redacted).'
                type: string
                x-redacted: true
              country:
                description: Citizenship (English).
                type: string
              jersey:
                description: Jersey number (integer).
                type: integer
              player:
                description: Player name, 'Surname Given' — in CYRILLIC even on the /en/ page.
                type: string
              player_id:
                description: 'Player id: the {player_id} of /en/players/{player_id}/, stable across seasons
                  and teams; also the photo id on img.khl.ru. Same numeric sequence as khl.ru player ids;
                  whether it equals the same person''s khl.ru id is unverified.'
                type: integer
              position:
                description: 'Position in English, lower case: goaltender, defense, forward.'
                type: string
            type: object
          type: array
        roster_as_of:
          description: 'Date the roster reflects (''As of 12.10.2026'' -> ''12.10.2026'', DD.MM.YYYY):
            the capture date, i.e. the CURRENT roster.'
          type: string
        site:
          description: Club website URL.
          type: string
      type: object
info:
  description: 'Russia''s VHL (Supreme Hockey League, ВХЛ). Keyless, no JSON API: every operation returns
    text/html, and x-parsed-schema on the response gives the parser, the selector rule and the schema
    of the parsed record (English snake_case keys; /en/ mirrors where they exist, online.vhlru.ru is Russian
    only). www.vhlru.ru has two A records; pin 188.128.49.29 (curl RESOLVE): 185.210.57.37 stalls after
    ~16 KB. Errors are HTTP 200 HTML: an empty shell (unknown game / team) or ANOTHER season (unknown
    tn on calendar, standings and stats; /standings/regular/{tn}/ always serves the current season). Coverage
    2010/11 (tn 189) onward. Shapes from captures of 2026-10-12; x-unobserved = null in every sample,
    no type claimed. Russian league operator: a published data release or mirror needs owner sign-off.
    Not official or supported.'
  title: VHL (vhlru.ru) server-rendered pages, parsed
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /en/calendar/{tn}/0/:
    get:
      description: 'text/html, parsed by capture.py into the JSON record of x-parsed-schema (English keys).
        Parsing rule: select[name=tournament] option[selected] (must be the requested tn) + all its options;
        select[name=club] options; each .calendar-page__day (.calendar-page__day-date, -week) -> each
        .calendar-page__match (detail link /report/{tn}/?idgame=, .calendar-page__match-num, two .calendar-page__match-team
        with logo img + -team-name, -city, -score_total, -score_type, -status, win-home/win-visitor class,
        online.vhlru.ru link). Errors arrive as HTTP 200 HTML (empty shells or another season); see the
        divergence notes.'
      operationId: get_vhl_calendar
      parameters:
      - description: 'Tournament id: one season stage (regular season or playoffs), from the calendar''s
          <select name=tournament> (tournaments[].tn): 2010/11 = 189 regular / 190 playoffs ... 2025/26
          = 1374 / 1375, 2026/27 = 1430. Shares the khl.ru numeric sequence. An unknown tn silently serves
          the CURRENT season (99999 -> 1430, probed 2026-10-12); the capture checks the selected option.'
        example: 1374
        in: path
        name: tn
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
              x-parsed-schema:
                parser: vhl/tools/capture.py parse_calendar
                rule: select[name=tournament] option[selected] (must be the requested tn) + all its options;
                  select[name=club] options; each .calendar-page__day (.calendar-page__day-date, -week)
                  -> each .calendar-page__match (detail link /report/{tn}/?idgame=, .calendar-page__match-num,
                  two .calendar-page__match-team with logo img + -team-name, -city, -score_total, -score_type,
                  -status, win-home/win-visitor class, online.vhlru.ru link)
                schema:
                  $ref: '#/components/schemas/VhlCalendar'
          description: Server-rendered HTML page
      summary: Full-season schedule and results of one tournament (season stage)
  /en/players/{player_id}/:
    get:
      description: 'text/html, parsed by capture.py into the JSON record of x-parsed-schema (English keys).
        Parsing rule: the /players/{id}/games/ tab link (must be the requested id); h1 (name + .player-card__number);
        h2.player-card__subtitle; .player-card__item / .player-card__property pairs; img.player-card__img;
        table 1 = career by season (label rows ''25/26 | Regular Season'' precede that season''s team
        rows), table 2 = totals. Errors arrive as HTTP 200 HTML (empty shells or another season); see
        the divergence notes.'
      operationId: get_vhl_player
      parameters:
      - description: 'Player id (any *_player_id / player_id / scorer_id column). Unknown: 404 via /404.php
          (probed 2026-10-12).'
        example: 34526
        in: path
        name: player_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
              x-parsed-schema:
                parser: vhl/tools/capture.py parse_player
                rule: the /players/{id}/games/ tab link (must be the requested id); h1 (name + .player-card__number);
                  h2.player-card__subtitle; .player-card__item / .player-card__property pairs; img.player-card__img;
                  table 1 = career by season (label rows '25/26 | Regular Season' precede that season's
                  team rows), table 2 = totals
                schema:
                  $ref: '#/components/schemas/VhlPlayer'
          description: Server-rendered HTML page
      summary: Player profile with career stats by season and team
  /en/report/{tn}/:
    get:
      description: 'text/html, parsed by capture.py into the JSON record of x-parsed-schema (English keys).
        Parsing rule: section.match-card (league-name, season, number, date, spectators-count, two .match-card__team
        with /teams/{id}/ link, -score, -period-score, -referee); then .match-centr-protocol walked in
        order: h3 .match-centr-protocol__title, h4 .table-wrap__team-name, h5 .table-wrap__table-desc
        give each <table> its section, team and kind; header rows are checked against capture.REPORT_*
        column specs. Errors arrive as HTTP 200 HTML (empty shells or another season); see the divergence
        notes.'
      operationId: get_vhl_report
      parameters:
      - description: 'Tournament id: one season stage (regular season or playoffs), from the calendar''s
          <select name=tournament> (tournaments[].tn): 2010/11 = 189 regular / 190 playoffs ... 2025/26
          = 1374 / 1375, 2026/27 = 1430. Shares the khl.ru numeric sequence. Must be the game''s own tournament:
          /en/report/1430/?idgame=899223 is an empty 157 KB shell (probed 2026-10-12).'
        example: 1374
        in: path
        name: tn
        required: true
        schema:
          type: integer
      - description: 'Game id (calendar games[].game_id). Missing or unknown: the same empty shell, HTTP
          200 (probed 2026-10-12).'
        example: 899223
        in: query
        name: idgame
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
              x-parsed-schema:
                parser: vhl/tools/capture.py parse_report
                rule: 'section.match-card (league-name, season, number, date, spectators-count, two .match-card__team
                  with /teams/{id}/ link, -score, -period-score, -referee); then .match-centr-protocol
                  walked in order: h3 .match-centr-protocol__title, h4 .table-wrap__team-name, h5 .table-wrap__table-desc
                  give each <table> its section, team and kind; header rows are checked against capture.REPORT_*
                  column specs'
                schema:
                  $ref: '#/components/schemas/VhlGameReport'
          description: Server-rendered HTML page
      summary: 'Game report: header, goals with on-ice jerseys, shootout, penalties, player and team tables'
  /en/standings/league/{tn}/:
    get:
      description: 'text/html, parsed by capture.py into the JSON record of x-parsed-schema (English keys).
        Parsing rule: select[name=team] option[selected] (the tn); the page''s only <table> (thead header;
        Team cell links /stats/players/{tn}/all/{team_season_id}/, which must carry the requested tn).
        Errors arrive as HTTP 200 HTML (empty shells or another season); see the divergence notes.'
      operationId: get_vhl_standings
      parameters:
      - description: 'Tournament id: one season stage (regular season or playoffs), from the calendar''s
          <select name=tournament> (tournaments[].tn): 2010/11 = 189 regular / 190 playoffs ... 2025/26
          = 1374 / 1375, 2026/27 = 1430. Shares the khl.ru numeric sequence. An unknown tn serves the
          current season (probed 2026-10-12).'
        example: 1374
        in: path
        name: tn
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
              x-parsed-schema:
                parser: vhl/tools/capture.py parse_standings
                rule: select[name=team] option[selected] (the tn); the page's only <table> (thead header;
                  Team cell links /stats/players/{tn}/all/{team_season_id}/, which must carry the requested
                  tn)
                schema:
                  $ref: '#/components/schemas/VhlStandings'
          description: Server-rendered HTML page
      summary: League standings of one tournament
  /en/stats/players/{tn}/:
    get:
      description: 'text/html, parsed by capture.py into the JSON record of x-parsed-schema (English keys).
        Parsing rule: select[name=tournament] option[selected] (the tn); each .table__wrapper whose <h2>
        is Goaltenders / Defensemen / Forwards and its <table>. Errors arrive as HTTP 200 HTML (empty
        shells or another season); see the divergence notes.'
      operationId: get_vhl_stats_players
      parameters:
      - description: 'Tournament id: one season stage (regular season or playoffs), from the calendar''s
          <select name=tournament> (tournaments[].tn): 2010/11 = 189 regular / 190 playoffs ... 2025/26
          = 1374 / 1375, 2026/27 = 1430. Shares the khl.ru numeric sequence. An unknown tn serves the
          current season (probed 2026-10-12).'
        example: 1374
        in: path
        name: tn
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
              x-parsed-schema:
                parser: vhl/tools/capture.py parse_stats_players
                rule: select[name=tournament] option[selected] (the tn); each .table__wrapper whose <h2>
                  is Goaltenders / Defensemen / Forwards and its <table>
                schema:
                  $ref: '#/components/schemas/VhlPlayerStats'
          description: Server-rendered HTML page
      summary: Season stats of every goalie, defenseman and forward on one page
  /en/teams/{team_id}/:
    get:
      description: 'text/html, parsed by capture.py into the JSON record of x-parsed-schema (English keys).
        Parsing rule: h1.title (must equal the expected name); .team__content (h2 ''Name , City | Year
        of foundation: N'', .team__contacts-item, <p>Label:<b>name</b></p>, <address>); .right_team (''As
        of''); ''Capacity:'' <p>; the first <table> (roster); class-less <h3> honours. Errors arrive as
        HTTP 200 HTML (empty shells or another season); see the divergence notes.'
      operationId: get_vhl_team
      parameters:
      - description: 'Team page id (report game.home_team_page_id / away_team_page_id). Unknown: an empty
          158 KB shell, HTTP 200 (probed 2026-10-12).'
        example: 390
        in: path
        name: team_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
              x-parsed-schema:
                parser: vhl/tools/capture.py parse_team
                rule: 'h1.title (must equal the expected name); .team__content (h2 ''Name , City | Year
                  of foundation: N'', .team__contacts-item, <p>Label:<b>name</b></p>, <address>); .right_team
                  (''As of''); ''Capacity:'' <p>; the first <table> (roster); class-less <h3> honours'
                schema:
                  $ref: '#/components/schemas/VhlTeam'
          description: Server-rendered HTML page
      summary: 'Club page: contacts, officials, arena and the CURRENT roster'
  /online/{idgame}.html:
    get:
      description: 'text/html, parsed by capture.py into the JSON record of x-parsed-schema (English keys).
        Parsing rule: <title> (stage, ''Игра номер N'', date); .game__team-name x2; each .game-event-item
        (kind from its --xx modifier, .game-event-item__time, -score-re__num, -score-status, -right text
        + /players/{id}/ links); tables inside .game__content_tabs__item[data-tab=stat-teams|stat-teamA|stat-teamB]
        > [data-tab=stats-teams-match|stats-teams-period-N]. Errors arrive as HTTP 200 HTML (empty shells
        or another season); see the divergence notes.'
      operationId: get_vhl_online
      parameters:
      - description: 'Game id (calendar games[].game_id). Unknown: 302 to the online.vhlru.ru index (probed
          2026-10-12).'
        example: 899223
        in: path
        name: idgame
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
              x-parsed-schema:
                parser: vhl/tools/capture.py parse_online
                rule: <title> (stage, 'Игра номер N', date); .game__team-name x2; each .game-event-item
                  (kind from its --xx modifier, .game-event-item__time, -score-re__num, -score-status,
                  -right text + /players/{id}/ links); tables inside .game__content_tabs__item[data-tab=stat-teams|stat-teamA|stat-teamB]
                  > [data-tab=stats-teams-match|stats-teams-period-N]
                schema:
                  $ref: '#/components/schemas/VhlOnlineBroadcast'
          description: Server-rendered HTML page
      summary: 'Text broadcast (online.vhlru.ru, Russian only): events and per-period team/player stats'
    servers:
    - url: https://online.vhlru.ru
servers:
- url: https://www.vhlru.ru
