            description: 'GoHoops game id (key space: GoHoops games; 1242 for TPBL game 6). Not the TPBL
              game id.'
            type: integer
          home_team:
            description: The home team, with its final score once played. The home side is always listed
              here, never inferred from the venue.
            properties:
              gohoops_event_id:
                description: 'GoHoops event id (key space: GoHoops events, one per TPBL season; 319 =
                  2024-25, 490 = 2025-26, 613 = 2026-27). Not the TPBL season id and not the GoHoops season
                  id.'
                type: integer
              gohoops_id:
                description: 'GoHoops team id (key space: GoHoops franchises, 940-946; stable across seasons;
                  = the TPBL team id + 938 for all seven). Not the squad id.'
                type: integer
              gohoops_season_id:
                description: 'GoHoops season id (key space: GoHoops seasons, the id system the API echoes
                  beside its own; 101 = 2024-25, 213 = 2025-26, 275 = 2026-27): the gohoops_id of the
                  /seasons row. Not the TPBL season id.'
                type: integer
              gohoops_squad_id:
                description: 'GoHoops squad id (key space: GoHoops squads = one team in one season: 8209-8215
                  in 2024-25, 11931-11937 in 2025-26, 15536-15542 in 2026-27; it changes every season).'
                type: integer
              id:
                description: 'Team id (key space: TPBL teams = franchises, 2-8 so far; stable across seasons):
                  the {team_id} of /divisions/{division_id}/teams/{team_id}/*. Not the GoHoops franchise
                  id and not the squad id.'
                type: integer
              is_league:
                description: True for the league's own pseudo-team, false for every real team (false in
                  all samples).
                type: boolean
              lost_score:
                description: Points this team conceded in the game (the opponent's final score). Absent
                  before tip-off.
                type: integer
                x-absent-in-some-rows: true
              meta:
                description: Team presentation fields.
                properties:
                  alt_name:
                    description: 'Lowercase English slug of the team: aquas, dreamers, lioneers, leopards,
                      dea, kings, mars.'
                    type: string
                  logo:
                    description: URL of the team logo (webp) on assets.tpbl.basketball.
                    type: string
                type: object
              name:
                description: 'Team name (Traditional Chinese, sponsor included: 高雄全家海神 = Kaohsiung Aquas,
                  福爾摩沙夢想家 = Formosa Dreamers, 新竹御嵿攻城獅 = Hsinchu Lioneers, 桃園台啤永豐雲豹 = Taoyuan Leopards,
                  新北中信特攻 = New Taipei CTBC DEA, 新北國王 = New Taipei Kings, 臺北台新戰神 = Taipei Mars).'
                type: string
              status:
                description: Team status; 'ACTIVE' in every sample.
                type: string
              won_score:
                description: Points this team scored in the game (the final score). Absent before tip-off.
                type: integer
                x-absent-in-some-rows: true
            type: object
          id:
            description: 'Game id (key space: TPBL games on api.tpbl.basketball): the {game_id} of /games/{game_id}
              and /games/{game_id}/stats. Not sequential by date (2024-25 = 1-1367, 2025-26 = 1371-8641,
              2026-27 = 27535-27667). Not the GoHoops game id.'
            type: integer
          is_live:
            description: True while the game is being played; false for finished and scheduled games.
            type: boolean
          meta:
            description: Links and attendance of the game. In the game list some rows lack the keys that
              /games/{game_id} always carries.
            properties:
              judgement_report:
                description: URL of the referees' judgement report (a Google Drive file); absent on most
                  rows.
                type:
                - string
                - 'null'
                x-absent-in-some-rows: true
              live_stream_url:
                description: YouTube live-stream URL of the game; absent on some rows.
                type: string
                x-absent-in-some-rows: true
              recap:
                description: YouTube recap URL; null or absent when none is posted.
                type:
                - string
                - 'null'
                x-absent-in-some-rows: true
              ticket_url:
                description: URL of the ticket page; null when none is listed.
                type:
                - string
                - 'null'
              visitors:
                description: Attendance as a string (e.g. '5659'); null before it is entered.
                type:
                - string
                - 'null'
                x-absent-in-some-rows: true
            type: object
          round:
            description: 'Number of quarters played: 4 for a regulation game, 5 for one overtime, 6 for
              two (equals the number of quarter keys in /games/{game_id}/stats); 0 before tip-off.'
            type: integer
          status:
            description: 'Game status. Observed: COMPLETED (finished) and NOT_STARTED (scheduled). A game
              in progress has is_live true.'
            type: string
          venue:
            description: 'Venue name in Traditional Chinese: 新莊體育館 = Xinzhuang Gymnasium, 和平籃球館 = Heping
              Basketball Gymnasium, 臺中洲際迷你蛋 = Taichung Intercontinental Mini Dome, 新竹縣體育館 = Hsinchu County
              Gymnasium, 高雄巨蛋 = Kaohsiung Arena, 桃園巨蛋 = Taoyuan Arena, 中壢國民運動中心 = Zhongli Citizens Sports
              Center, 屏東縣立體育館 = Pingtung County Gymnasium. '''' on 10 games of the 2024-25 list and one
              name has a leading space; free text, not a venue id.'
            type: string
        type: object
      type: array
    TpblSeasons:
      description: 'Body of /seasons: one row per TPBL season (3 so far), with the GoHoops season id,
        name, status and date window.'
      items:
        properties:
          ended_at:
            description: Season end, 'YYYY-MM-DD 00:00:00' (planned end for a season in progress).
            type: string
          gohoops_id:
            description: 'GoHoops season id (key space: GoHoops seasons, the id system the API echoes
              beside its own; 101 = 2024-25, 213 = 2025-26, 275 = 2026-27): the gohoops_id of the /seasons
              row. Not the TPBL season id.'
            type: integer
          id:
            description: 'Season id (key space: TPBL seasons on api.tpbl.basketball; 1 = 2024-25, 2 =
              2025-26, 3 = 2026-27): the {season_id} of /seasons/{season_id}/games and, equal to it, the
              {event_id} of /events/{event_id}/*. Not the GoHoops season id.'
            type: integer
          name:
            description: 'Season name in Traditional Chinese: ''2024-2025 賽季'' = ''season 2024-2025''.
              The sdv season is the END year of the label (2024-2025 -> 2025).'
            type: string
          started_at:
            description: Season start, 'YYYY-MM-DD 00:00:00'. Preseason games can be played before it
              (the 2026-27 start is 2026-10-17, its first games were played 2026-10-09).
            type: string
          status:
            description: 'Season status: COMPLETED or IN_PROGRESS.'
            type: string
        type: object
      type: array
    TpblStandings:
      description: 'Body of /divisions/{division_id}/games/standings: one row per team, ranked, with the
        head-to-head record against every other team.'
      items:
        properties:
          against_result:
            description: Head-to-head record against each of the other teams.
            items:
              properties:
                score_draw_matches:
                  description: Games drawn against this opponent (always 0).
                  type: integer
                score_lost_matches:
                  description: Games the ranked team lost against this opponent.
                  type: integer
                score_won_matches:
                  description: Games the ranked team won against this opponent.
                  type: integer
                team:
                  description: The opponent (full team object).
                  properties:
                    gohoops_event_id:
                      description: 'GoHoops event id (key space: GoHoops events, one per TPBL season;
                        319 = 2024-25, 490 = 2025-26, 613 = 2026-27). Not the TPBL season id and not the
                        GoHoops season id.'
                      type: integer
                    gohoops_id:
                      description: 'GoHoops team id (key space: GoHoops franchises, 940-946; stable across
                        seasons; = the TPBL team id + 938 for all seven). Not the squad id.'
                      type: integer
                    gohoops_season_id:
                      description: 'GoHoops season id (key space: GoHoops seasons, the id system the API
                        echoes beside its own; 101 = 2024-25, 213 = 2025-26, 275 = 2026-27): the gohoops_id
                        of the /seasons row. Not the TPBL season id.'
                      type: integer
                    gohoops_squad_id:
                      description: 'GoHoops squad id (key space: GoHoops squads = one team in one season:
                        8209-8215 in 2024-25, 11931-11937 in 2025-26, 15536-15542 in 2026-27; it changes
                        every season).'
                      type: integer
                    id:
                      description: 'Team id (key space: TPBL teams = franchises, 2-8 so far; stable across
                        seasons): the {team_id} of /divisions/{division_id}/teams/{team_id}/*. Not the
                        GoHoops franchise id and not the squad id.'
                      type: integer
                    is_league:
                      description: True for the league's own pseudo-team, false for every real team (false
                        in all samples).
                      type: boolean
                    meta:
                      description: Team presentation fields.
                      properties:
                        alt_name:
                          description: 'Lowercase English slug of the team: aquas, dreamers, lioneers,
                            leopards, dea, kings, mars.'
                          type: string
                        logo:
                          description: URL of the team logo (webp) on assets.tpbl.basketball.
                          type: string
                      type: object
                    name:
                      description: 'Team name (Traditional Chinese, sponsor included: 高雄全家海神 = Kaohsiung
                        Aquas, 福爾摩沙夢想家 = Formosa Dreamers, 新竹御嵿攻城獅 = Hsinchu Lioneers, 桃園台啤永豐雲豹 = Taoyuan
                        Leopards, 新北中信特攻 = New Taipei CTBC DEA, 新北國王 = New Taipei Kings, 臺北台新戰神 = Taipei
                        Mars).'
                      type: string
                    status:
                      description: Team status; 'ACTIVE' in every sample.
                      type: string
                  type: object
              type: object
            type: array
          games_behind:
            description: Games behind the leader (0 for the leader); a whole number in every sample.
            type: integer
          rank:
            description: Rank in the division, 1-based.
            type: integer
          score_draw_matches:
            description: Games drawn (always 0 in basketball).
            type: integer
          score_lost_matches:
            description: Games lost.
            type: integer
          score_won_matches:
            description: Games won in the division so far.
            type: integer
          streaks:
            description: 'Current streak: ''W'' + count for wins, ''L'' + count for losses (W2 = two straight
              wins).'
            type: string
          team:
            description: The ranked team (id, name and logo only).
            properties:
              gohoops_id:
                description: 'GoHoops team id (key space: GoHoops franchises, 940-946; stable across seasons;
                  = the TPBL team id + 938 for all seven). Not the squad id.'
                type: integer
              gohoops_squad_id:
                description: 'GoHoops squad id (key space: GoHoops squads = one team in one season: 8209-8215
                  in 2024-25, 11931-11937 in 2025-26, 15536-15542 in 2026-27; it changes every season).'
                type: integer
              id:
                description: 'Team id (key space: TPBL teams = franchises, 2-8 so far; stable across seasons):
                  the {team_id} of /divisions/{division_id}/teams/{team_id}/*. Not the GoHoops franchise
                  id and not the squad id.'
                type: integer
              meta:
                description: Team presentation fields.
                properties:
                  alt_name:
                    description: 'Lowercase English slug of the team: aquas, dreamers, lioneers, leopards,
                      dea, kings, mars.'
                    type: string
                  logo:
                    description: URL of the team logo (webp) on assets.tpbl.basketball.
                    type: string
                type: object
              name:
                description: 'Team name (Traditional Chinese, sponsor included: 高雄全家海神 = Kaohsiung Aquas,
                  福爾摩沙夢想家 = Formosa Dreamers, 新竹御嵿攻城獅 = Hsinchu Lioneers, 桃園台啤永豐雲豹 = Taoyuan Leopards,
                  新北中信特攻 = New Taipei CTBC DEA, 新北國王 = New Taipei Kings, 臺北台新戰神 = Taipei Mars).'
                type: string
            type: object
        type: object
      type: array
    TpblTeamShots:
      description: 'Body of /divisions/{division_id}/teams/{team_id}/shooting-spots: every field-goal
        attempt of one team in one division (both outcomes), as court coordinates.'
      items:
        properties:
          is_made:
            description: True when the shot went in.
            type: boolean
          offense_basket:
            description: 'Basket the team attacked: 0 = the hoop at x = 1575, 1 = the hoop at x = 26425.'
            type: integer
          point_x:
            description: Shot position along the court length in MILLIMETRES, 0-28000 (a 28 m court).
              Hoops sit at x = 1575 (offense_basket 0) and 26425 (offense_basket 1), the FIBA 1.575 m;
              verified on 2,971 shots (the made rate within 1.2 m of the hoop is 62-71 %). Which baseline
              is x = 0 is unverified.
            type: integer
          point_y:
            description: Shot position across the court in MILLIMETRES, 0-15000 (a 15 m court); the hoops
              are at y = 7500. The direction of y is unverified.
            type: integer
        type: object
      type: array
info:
  description: 'Keyless JSON behind tpbl.basketball (the Laravel API its Nuxt app calls): seasons, divisions,
    teams, the season game list, game detail (referees, venue), the per-quarter box score of every game
    (players keyed by GoHoops roster id), standings, rosters, shot locations and a player game log. There
    is no play-by-play route. Ids are TPBL''s own plus GoHoops (the data vendor) ids named gohoops_*.
    A season is named ''2024-2025 賽季'' and keyed by an opaque id 1/2/3; the sdv season is the END year.
    Text is Traditional Chinese (glossed in the descriptions). The host''s robots.txt is 404 and tpbl.basketball/robots.txt
    is 200 with an empty body. Shapes from captures of 2026-10-12; x-unobserved = null in every sample.
    Not official or supported.'
  title: TPBL (Taiwan Professional Basketball League) site API, api.tpbl.basketball
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /divisions/{division_id}/games/standings:
    get:
      description: Standings of one division, with head-to-head records. Standings of a division in progress
        count only the games played. A completed division's matches are checked against the season's game
        list on every capture. (scope-checked by capture.py.)
      operationId: get_tpbl_standings
      parameters:
      - description: 'TPBL division id (key space: divisions; see /events/{event_id}/divisions). Unknown
          ids answer HTTP 404 text/html.'
        example: 2
        in: path
        name: division_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TpblStandings'
          description: JSON body
        '404':
          description: 'Unknown id: the Laravel HTML 404 page (text/html), not JSON.'
      security: []
      summary: Standings of one division, with head-to-head records
  /divisions/{division_id}/players/{player_id}/shooting-spots:
    get:
      description: 'Every shot location of one player in one division. UNSCOPED: the body names no player
        or division, so the capture banks it on the URL alone. (UNSCOPED (README).)'
      operationId: get_tpbl_player_shots
      parameters:
      - description: 'TPBL division id (key space: divisions; see /events/{event_id}/divisions). Unknown
          ids answer HTTP 404 text/html.'
        example: 2
        in: path
        name: division_id
        required: true
        schema:
          type: integer
      - description: 'TPBL player id (key space: players).'
        example: 10
        in: path
        name: player_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TpblPlayerShots'
          description: JSON body
        '404':
          description: 'Unknown id: the Laravel HTML 404 page (text/html), not JSON.'
      security: []
      summary: Every shot location of one player in one division
  /divisions/{division_id}/teams/{team_id}/players:
    get:
      description: The roster of one team in one division. Roster rows of a division, with the bio fields
        of each player (birthday, height and weight are public bio fields and are kept). (scope-checked
        by capture.py.)
      operationId: get_tpbl_team_players
      parameters:
      - description: 'TPBL division id (key space: divisions; see /events/{event_id}/divisions). Unknown
          ids answer HTTP 404 text/html.'
        example: 2
        in: path
        name: division_id
        required: true
        schema:
          type: integer
      - description: 'TPBL team id (key space: teams, 2-8). On /seasons/{season_id}/games it is an optional
          query filter (the games of that team only; verified 38 games for team 4 in 2026-27).'
        example: 4
        in: path
        name: team_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TpblRoster'
          description: JSON body
        '404':
          description: 'Unknown id: the Laravel HTML 404 page (text/html), not JSON.'
      security: []
      summary: The roster of one team in one division
  /divisions/{division_id}/teams/{team_id}/shooting-spots:
    get:
      description: 'Every shot location of one team in one division (optionally per quarter). UNSCOPED:
        the body names no team or division, so the capture banks it on the URL alone. The count was verified
        once: 2,971 shots, 1,222 made, equal to the field-goal attempts and makes in the 36 games Hsinchu
        (team 4) played in division 2. (UNSCOPED (README).)'
      operationId: get_tpbl_team_shots
      parameters:
      - description: 'TPBL division id (key space: divisions; see /events/{event_id}/divisions). Unknown
          ids answer HTTP 404 text/html.'
        example: 2
        in: path
        name: division_id
        required: true
        schema:
          type: integer
      - description: 'TPBL team id (key space: teams, 2-8). On /seasons/{season_id}/games it is an optional
          query filter (the games of that team only; verified 38 games for team 4 in 2026-27).'
        example: 4
        in: path
        name: team_id
        required: true
        schema:
          type: integer
      - description: 'Optional quarter filter, repeatable: rounds[]=1 keeps only the shots of quarter
          1 (777 of 2,971 for team 4 in 2024-25, equal to that team''s quarter-1 field-goal attempts).'
        example: 1
        explode: true
        in: query
        name: rounds[]
        required: false
        schema:
          items:
            type: integer
          type: array
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TpblTeamShots'
          description: JSON body
        '404':
          description: 'Unknown id: the Laravel HTML 404 page (text/html), not JSON.'
      security: []
      summary: Every shot location of one team in one division (optionally per quarter)
  /events/{event_id}/divisions:
    get:
      description: The divisions (preseason, regular season, playoffs ...) of one season. Event id = season
        id. Every row names one gohoops_event_id (319 / 490 / 613), and the season's game list is checked
        against these divisions on every capture. (scope-checked by capture.py.)
      operationId: get_tpbl_event_divisions
      parameters:
      - description: Event id = the TPBL season id (1, 2, 3; checked against the season's games on every
          capture). Unknown ids answer HTTP 404 text/html.
        example: 1
        in: path
        name: event_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TpblDivisions'
          description: JSON body
        '404':
          description: 'Unknown id: the Laravel HTML 404 page (text/html), not JSON.'
      security: []
      summary: The divisions (preseason, regular season, playoffs ...) of one season
  /events/{event_id}/teams:
    get:
      description: 'The teams of one season. The 2025-26 list (9 rows) adds two bracket placeholders with
        is_real_team false: 67 ''高順位隊伍'' = ''higher-seed team'' and 68 ''低順位隊伍'' = ''lower-seed team''
        (GoHoops ids 2054, 2055). The 3-row samples do not show them; the full-body presence record types
        is_real_team boolean. Seasons 1 and 3 list the 7 clubs. (scope-checked by capture.py.)'
      operationId: get_tpbl_event_teams
      parameters:
      - description: Event id = the TPBL season id (1, 2, 3; checked against the season's games on every
          capture). Unknown ids answer HTTP 404 text/html.
        example: 1
        in: path
        name: event_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TpblEventTeams'
          description: JSON body
        '404':
          description: 'Unknown id: the Laravel HTML 404 page (text/html), not JSON.'
      security: []
      summary: The teams of one season
  /games/{game_id}:
    get:
      description: 'One game: teams with scores, referees, venue, status, links. referees lists the crew
        with role enums; the capture redacts contact and birth fields under referees and coaches (none
        exist today). (scope-checked by capture.py.)'
      operationId: get_tpbl_game
      parameters:
      - description: 'TPBL game id (key space: games). Unknown ids answer HTTP 404 text/html.'
        example: 69
        in: path
        name: game_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TpblGame'
          description: JSON body
        '404':
          description: 'Unknown id: the Laravel HTML 404 page (text/html), not JSON.'
      security: []
      summary: 'One game: teams with scores, referees, venue, status, links'
  /games/{game_id}/stats:
    get:
      description: 'Box score of one game: team and player stats per quarter and in total. Quarter keys
        ''1''-''4'' (overtimes ''5'', ''6''): game 69 (two overtimes) has six, game 27535 five. The game
        list''s `round` equals the key count. (scope-checked by capture.py.)'
      operationId: get_tpbl_game_stats
      parameters:
      - description: 'TPBL game id (key space: games). Unknown ids answer HTTP 404 text/html.'
        example: 69
        in: path
        name: game_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TpblGameStats'
          description: JSON body
        '404':
          description: 'Unknown id: the Laravel HTML 404 page (text/html), not JSON.'
      security: []
      summary: 'Box score of one game: team and player stats per quarter and in total'
  /players/{player_id}/games/stats:
    get:
      description: A player's game log in one division, one row per game played. The division_id query
        parameter is required (HTTP 422 without it). Rows are one game each; `rounds` is empty in every
        sample. (scope-checked by capture.py.)
      operationId: get_tpbl_player_games
      parameters:
      - description: 'TPBL player id (key space: players).'
        example: 10
        in: path
        name: player_id
        required: true
        schema:
          type: integer
      - description: 'TPBL division id (key space: divisions). Required: without it the route answers
          HTTP 422 text/html.'
        example: 2
        in: query
        name: division_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TpblPlayerGames'
          description: JSON body
        '404':
          description: 'Unknown id: the Laravel HTML 404 page (text/html), not JSON.'
        '422':
          description: 'division_id missing: an HTML error page (text/html).'
      security: []
      summary: A player's game log in one division, one row per game played
  /seasons:
    get:
      description: 'All seasons: TPBL season id, GoHoops season id, name, status and date window. Season
        name ''2024-2025 賽季'' means season 2024-2025; the sdv season is the END year (2025). Seasons are
        1, 2, 3 = sdv 2025, 2026, 2027. (scope-checked by capture.py.)'
      operationId: get_tpbl_seasons
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TpblSeasons'
          description: JSON body
        '404':
          description: 'Unknown id: the Laravel HTML 404 page (text/html), not JSON.'
      security: []
      summary: 'All seasons: TPBL season id, GoHoops season id, name, status and date window'
  /seasons/{season_id}/games:
    get:
      description: 'Every game of one season (all divisions) with teams, venue, status and score. Not
        paged: ?page= and ?limit= are ignored (152, 150 and 133 rows for seasons 1-3). The capture refuses
        a list whose completed games of a division differ from the matches counted by that division''s
        standings. (scope-checked by capture.py.)'
