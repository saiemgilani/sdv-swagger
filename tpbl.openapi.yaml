components:
  schemas:
    TpblDivisions:
      description: 'Body of /events/{event_id}/divisions: the divisions (competition phases) of one season.'
      items:
        properties:
          gohoops_event_id:
            description: 'GoHoops event id (key space: GoHoops events, one per TPBL season; 319 = 2024-25,
              490 = 2025-26, 613 = 2026-27). Not the TPBL season id and not the GoHoops season id.'
            type: integer
          gohoops_id:
            description: 'GoHoops division id (key space: GoHoops divisions; e.g. 64 = the 2024-25 preseason,
              65 = the 2024-25 regular season). Not the TPBL division id.'
            type: integer
          id:
            description: 'Division id (key space: TPBL divisions, one competition phase of one season;
              1, 2, 5, 6, 7 = 2024-25, 8, 9, 11, 12, 35 = 2025-26, 655, 656 = 2026-27): the {division_id}
              of every /divisions/{division_id}/* route. Not the GoHoops division id.'
            type: integer
          name:
            description: 'Division name (Traditional Chinese: ''熱身賽'' = preseason (warm-up games), ''例行賽''
              = regular season, ''季後挑戰賽'' = postseason challenge (play-in round), ''季後賽'' = playoffs,
              ''冠軍賽'' = finals).'
            type: string
          status:
            description: 'Division status: COMPLETED or IN_PROGRESS.'
            type: string
        type: object
      type: array
    TpblEventTeams:
      description: 'Body of /events/{event_id}/teams: the teams of one season.'
      items:
        properties:
          gohoops_id:
            description: 'GoHoops team id (key space: GoHoops franchises, 940-946; stable across seasons;
              = the TPBL team id + 938 for all seven). Not the squad id.'
            type: integer
          id:
            description: 'Team id (key space: TPBL teams = franchises, 2-8 so far; stable across seasons):
              the {team_id} of /divisions/{division_id}/teams/{team_id}/*. Not the GoHoops franchise id
              and not the squad id.'
            type: integer
          is_real_team:
            description: True for a real club; false for a bracket placeholder (67 '高順位隊伍' = higher-seed
              team, 68 '低順位隊伍' = lower-seed team in 2025-26).
            type: boolean
          name:
            description: 'Team name (Traditional Chinese, sponsor included: 高雄全家海神 = Kaohsiung Aquas,
              福爾摩沙夢想家 = Formosa Dreamers, 新竹御嵿攻城獅 = Hsinchu Lioneers, 桃園台啤永豐雲豹 = Taoyuan Leopards, 新北中信特攻
              = New Taipei CTBC DEA, 新北國王 = New Taipei Kings, 臺北台新戰神 = Taipei Mars).'
            type: string
          status:
            description: Team status; 'ACTIVE' in every sample.
            type: string
          ticket_url:
            description: 'Unobserved: null in every sample, so no type and no meaning is claimed.'
            x-unobserved: true
        type: object
      type: array
    TpblGame:
      description: 'Body of /games/{game_id}: the game-list row plus the referees and the video / attendance
        links.'
      properties:
        away_team:
          description: The away team, with its final score once played.
          properties:
            gohoops_event_id:
              description: 'GoHoops event id (key space: GoHoops events, one per TPBL season; 319 = 2024-25,
                490 = 2025-26, 613 = 2026-27). Not the TPBL season id and not the GoHoops season id.'
              type: integer
            gohoops_id:
              description: 'GoHoops team id (key space: GoHoops franchises, 940-946; stable across seasons;
                = the TPBL team id + 938 for all seven). Not the squad id.'
              type: integer
            gohoops_season_id:
              description: 'GoHoops season id (key space: GoHoops seasons, the id system the API echoes
                beside its own; 101 = 2024-25, 213 = 2025-26, 275 = 2026-27): the gohoops_id of the /seasons
                row. Not the TPBL season id.'
              type: integer
            gohoops_squad_id:
              description: 'GoHoops squad id (key space: GoHoops squads = one team in one season: 8209-8215
                in 2024-25, 11931-11937 in 2025-26, 15536-15542 in 2026-27; it changes every season).'
              type: integer
            id:
              description: 'Team id (key space: TPBL teams = franchises, 2-8 so far; stable across seasons):
                the {team_id} of /divisions/{division_id}/teams/{team_id}/*. Not the GoHoops franchise
                id and not the squad id.'
              type: integer
            is_league:
              description: True for the league's own pseudo-team, false for every real team (false in
                all samples).
              type: boolean
            lost_score:
              description: Points this team conceded in the game (the opponent's final score). Absent
                before tip-off.
              type: integer
            meta:
              description: Team presentation fields.
              properties:
                alt_name:
                  description: 'Lowercase English slug of the team: aquas, dreamers, lioneers, leopards,
                    dea, kings, mars.'
                  type: string
                logo:
                  description: URL of the team logo (webp) on assets.tpbl.basketball.
                  type: string
              type: object
            name:
              description: 'Team name (Traditional Chinese, sponsor included: 高雄全家海神 = Kaohsiung Aquas,
                福爾摩沙夢想家 = Formosa Dreamers, 新竹御嵿攻城獅 = Hsinchu Lioneers, 桃園台啤永豐雲豹 = Taoyuan Leopards, 新北中信特攻
                = New Taipei CTBC DEA, 新北國王 = New Taipei Kings, 臺北台新戰神 = Taipei Mars).'
              type: string
            status:
              description: Team status; 'ACTIVE' in every sample.
              type: string
            won_score:
              description: Points this team scored in the game (the final score). Absent before tip-off.
              type: integer
          type: object
        code:
          description: 'Game code inside the division: the game number as text in the regular season (''1''
            ... ''42'' ...), a series label in the playoffs (''AG1'' = series A game 1, ''G7'' = finals
            game 7), '''' for preseason games.'
          type: string
        division_id:
          description: 'Division id (key space: TPBL divisions, one competition phase of one season; 1,
            2, 5, 6, 7 = 2024-25, 8, 9, 11, 12, 35 = 2025-26, 655, 656 = 2026-27): the {division_id} of
            every /divisions/{division_id}/* route. Not the GoHoops division id.'
          type: integer
        game_date:
          description: Game date, YYYY-MM-DD (Taiwan local date).
          type: string
        game_day_of_week:
          description: 'Traditional Chinese weekday in parentheses: (一) Mon, (二) Tue, (三) Wed, (四) Thu,
            (五) Fri, (六) Sat, (日) Sun.'
          type: string
        game_time:
          description: Scheduled tip-off, HH:MM:SS (Taiwan local time (UTC+8) by every tip-off seen; the
            API sends no zone).
          type: string
        gamed_at:
          description: Scheduled tip-off, 'YYYY-MM-DD HH:MM:SS' (Taiwan local time (UTC+8) by every tip-off
            seen; the API sends no zone).
          type: string
        gohoops_division_id:
          description: 'GoHoops division id (key space: GoHoops divisions; e.g. 64 = the 2024-25 preseason,
            65 = the 2024-25 regular season). Not the TPBL division id.'
          type: integer
        gohoops_id:
          description: 'GoHoops game id (key space: GoHoops games; 1242 for TPBL game 6). Not the TPBL
            game id.'
          type: integer
        home_team:
          description: The home team, with its final score once played. The home side is always listed
            here, never inferred from the venue.
          properties:
            gohoops_event_id:
              description: 'GoHoops event id (key space: GoHoops events, one per TPBL season; 319 = 2024-25,
                490 = 2025-26, 613 = 2026-27). Not the TPBL season id and not the GoHoops season id.'
              type: integer
            gohoops_id:
              description: 'GoHoops team id (key space: GoHoops franchises, 940-946; stable across seasons;
                = the TPBL team id + 938 for all seven). Not the squad id.'
              type: integer
            gohoops_season_id:
              description: 'GoHoops season id (key space: GoHoops seasons, the id system the API echoes
                beside its own; 101 = 2024-25, 213 = 2025-26, 275 = 2026-27): the gohoops_id of the /seasons
                row. Not the TPBL season id.'
              type: integer
            gohoops_squad_id:
              description: 'GoHoops squad id (key space: GoHoops squads = one team in one season: 8209-8215
                in 2024-25, 11931-11937 in 2025-26, 15536-15542 in 2026-27; it changes every season).'
              type: integer
            id:
              description: 'Team id (key space: TPBL teams = franchises, 2-8 so far; stable across seasons):
                the {team_id} of /divisions/{division_id}/teams/{team_id}/*. Not the GoHoops franchise
                id and not the squad id.'
              type: integer
            is_league:
              description: True for the league's own pseudo-team, false for every real team (false in
                all samples).
              type: boolean
            lost_score:
              description: Points this team conceded in the game (the opponent's final score). Absent
                before tip-off.
              type: integer
            meta:
              description: Team presentation fields.
              properties:
                alt_name:
                  description: 'Lowercase English slug of the team: aquas, dreamers, lioneers, leopards,
                    dea, kings, mars.'
                  type: string
                logo:
                  description: URL of the team logo (webp) on assets.tpbl.basketball.
                  type: string
              type: object
            name:
              description: 'Team name (Traditional Chinese, sponsor included: 高雄全家海神 = Kaohsiung Aquas,
                福爾摩沙夢想家 = Formosa Dreamers, 新竹御嵿攻城獅 = Hsinchu Lioneers, 桃園台啤永豐雲豹 = Taoyuan Leopards, 新北中信特攻
                = New Taipei CTBC DEA, 新北國王 = New Taipei Kings, 臺北台新戰神 = Taipei Mars).'
              type: string
            status:
              description: Team status; 'ACTIVE' in every sample.
              type: string
            won_score:
              description: Points this team scored in the game (the final score). Absent before tip-off.
              type: integer
          type: object
        id:
          description: 'Game id (key space: TPBL games on api.tpbl.basketball): the {game_id} of /games/{game_id}
            and /games/{game_id}/stats. Not sequential by date (2024-25 = 1-1367, 2025-26 = 1371-8641,
            2026-27 = 27535-27667). Not the GoHoops game id.'
          type: integer
        is_live:
          description: True while the game is being played; false for finished and scheduled games.
          type: boolean
        meta:
          description: Links and attendance of the game. In the game list some rows lack the keys that
            /games/{game_id} always carries.
          properties:
            judgement_report:
              description: URL of the referees' judgement report (a Google Drive file); absent on most
                rows.
              type: string
            live_stream_url:
              description: YouTube live-stream URL of the game; absent on some rows.
              type: string
            recap:
              description: YouTube recap URL; null or absent when none is posted.
              type: string
            ticket_url:
              description: URL of the ticket page; null when none is listed.
              type:
              - string
              - 'null'
            visitors:
              description: Attendance as a string (e.g. '5659'); null before it is entered.
              type:
              - string
              - 'null'
          type: object
        referees:
          description: 'The officiating crew, chief referee first. Names only: no contact or birth fields
            exist (redacted by the capture if they ever appear).'
          items:
            properties:
              gohoops_id:
                description: 'GoHoops referee id (key space: GoHoops referees). Not the TPBL referee id.'
                type: integer
              id:
                description: 'Referee id (key space: TPBL referees on api.tpbl.basketball). Not the GoHoops
                  referee id.'
                type: integer
              name:
                description: Referee name (Traditional Chinese).
                type: string
              type:
                description: 'Crew role: BASKETBALL_CHIEF_REFEREE = crew chief, BASKETBALL_FIRST_ASSISTANT_REFEREE
                  = first assistant (umpire 1), BASKETBALL_SECOND_ASSISTANT_REFEREE = second assistant
                  (umpire 2).'
                type: string
            type: object
          type: array
        round:
          description: 'Number of quarters played: 4 for a regulation game, 5 for one overtime, 6 for
            two (equals the number of quarter keys in /games/{game_id}/stats); 0 before tip-off.'
          type: integer
        status:
          description: 'Game status. Observed: COMPLETED (finished) and NOT_STARTED (scheduled). A game
            in progress has is_live true.'
          type: string
        venue:
          description: 'Venue name in Traditional Chinese: 新莊體育館 = Xinzhuang Gymnasium, 和平籃球館 = Heping
            Basketball Gymnasium, 臺中洲際迷你蛋 = Taichung Intercontinental Mini Dome, 新竹縣體育館 = Hsinchu County
            Gymnasium, 高雄巨蛋 = Kaohsiung Arena, 桃園巨蛋 = Taoyuan Arena, 中壢國民運動中心 = Zhongli Citizens Sports
            Center, 屏東縣立體育館 = Pingtung County Gymnasium. '''' on 10 games of the 2024-25 list and one
            name has a leading space; free text, not a venue id.'
          type: string
      type: object
    TpblGameStats:
      description: 'Body of /games/{game_id}/stats: for each side, team stats per quarter and in total,
        and player stats per quarter and in total keyed by GoHoops roster id.'
      properties:
        away_team:
          description: 'The away side: its team and player stats.'
          properties:
            gohoops_squad_id:
              description: 'GoHoops squad id (key space: GoHoops squads = one team in one season: 8209-8215
                in 2024-25, 11931-11937 in 2025-26, 15536-15542 in 2026-27; it changes every season).'
              type: integer
            id:
              description: 'Team id (key space: TPBL teams = franchises, 2-8 so far; stable across seasons):
                the {team_id} of /divisions/{division_id}/teams/{team_id}/*. Not the GoHoops franchise
                id and not the squad id.'
              type: integer
            name:
              description: 'Team name (Traditional Chinese, sponsor included: 高雄全家海神 = Kaohsiung Aquas,
                福爾摩沙夢想家 = Formosa Dreamers, 新竹御嵿攻城獅 = Hsinchu Lioneers, 桃園台啤永豐雲豹 = Taoyuan Leopards, 新北中信特攻
                = New Taipei CTBC DEA, 新北國王 = New Taipei Kings, 臺北台新戰神 = Taipei Mars).'
              type: string
            players:
              description: Player stats.
              properties:
                rounds:
                  additionalProperties:
                    additionalProperties:
                      description: One player's quarter line (identity keys always; stat keys only if
                        he was on court that quarter).
                      properties:
                        assists:
                          description: Assists by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        back_court_turnovers:
                          description: Turnovers of type 'back-court violation' by the player in this
                            quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        bad_pass_turnovers:
                          description: Turnovers of type 'bad pass' by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        ball_handling_turnovers:
                          description: Turnovers of type 'ball-handling error' by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        blocks:
                          description: Blocked shots by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        carry_turnovers:
                          description: Turnovers of type 'carrying' by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        defensive_fouls:
                          description: Fouls committed on defense by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        defensive_rebounds:
                          description: Defensive rebounds by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        disqualifying_fouls:
                          description: Disqualifying fouls by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        double_dribble_turnovers:
                          description: Turnovers of type 'double dribble' by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        efg:
                          description: 'Effective field-goal percentage by the player in this quarter,
                            0-100 as a string with one decimal rounded half up: (FGM + 0.5 x 3PM) / FGA;
                            ''0.0'' without attempts.'
                          type: string
                          x-absent-in-some-rows: true
                        fast_break_points:
                          description: Points scored on the fast break by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        field_goals:
                          description: Field goals by the player in this quarter as 'made/attempted' text
                            (e.g. '12/21').
                          type: string
                          x-absent-in-some-rows: true
                        field_goals_attempted:
                          description: Field goals attempted by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        field_goals_attempted_in_the_paint:
                          description: Field goals attempted in the paint by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        field_goals_attempted_on_fast_break:
                          description: Field goals attempted on the fast break by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        field_goals_attempted_on_second_chance:
                          description: Field goals attempted on a second chance (after an offensive rebound)
                            by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        field_goals_made:
                          description: Field goals made by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        field_goals_made_in_the_paint:
                          description: Field goals made in the paint by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        field_goals_made_on_fast_break:
                          description: Field goals made on the fast break by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        field_goals_made_on_second_chance:
                          description: Field goals made on a second chance (after an offensive rebound)
                            by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        field_goals_missed:
                          description: Field goals missed by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        field_goals_missed_in_the_paint:
                          description: Field goals missed in the paint by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        field_goals_missed_on_fast_break:
                          description: Field goals missed on the fast break by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        field_goals_missed_on_second_chance:
                          description: Field goals missed on a second chance (after an offensive rebound)
                            by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        field_goals_percentage:
                          description: Field goals percentage by the player in this quarter, 0-100 as
                            a string with one decimal ('57.1'); '0.0' without attempts.
                          type: string
                          x-absent-in-some-rows: true
                        five_seconds_turnovers:
                          description: Turnovers of type 'five-second violation' by the player in this
                            quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        fouls:
                          description: 'Fouls charged by the player in this quarter: personal + technical
                            + unsportsmanlike + disqualifying; equals defensive_fouls + offensive_fouls
                            (checked on 4,237 played player lines of 189 games).'
                          type: integer
                          x-absent-in-some-rows: true
                        free_throws:
                          description: Free throws by the player in this quarter as 'made/attempted' text
                            (e.g. '12/21').
                          type: string
                          x-absent-in-some-rows: true
                        free_throws_attempted:
                          description: Free throws attempted by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        free_throws_made:
                          description: Free throws made by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        free_throws_missed:
                          description: Free throws missed by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        free_throws_percentage:
                          description: Free throws percentage by the player in this quarter, 0-100 as
                            a string with one decimal ('57.1'); '0.0' without attempts.
                          type: string
                          x-absent-in-some-rows: true
                        gohoops_id:
                          description: 'GoHoops person id (key space: GoHoops persons; one per human,
                            e.g. 70829). Not the TPBL player id and not the roster id.'
                          type: integer
                        gohoops_roster_id:
                          description: 'GoHoops roster id (key space: GoHoops rosters = one player registered
                            with one squad in one season; it changes when the player changes season or
                            team). Not the TPBL player id and not the person id.'
                          type: integer
                        id:
                          description: 'Player id (key space: TPBL players on api.tpbl.basketball; one
                            per person across seasons and teams): the {player_id} of /players/{player_id}/*
                            and /divisions/{division_id}/players/{player_id}/*. Not the GoHoops person
                            id and not the roster id.'
                          type: integer
                        injury_status:
                          description: 'Unobserved: null in every sample, so no type and no meaning is
                            claimed.'
                          x-unobserved: true
                        injury_status_label:
                          description: 'Unobserved: null in every sample, so no type and no meaning is
                            claimed.'
                          x-unobserved: true
                        is_starting:
                          description: True when the player was in the starting five.
                          type: boolean
                        name:
                          description: Player name (Traditional Chinese, or a transliteration for foreign
                            players).
                          type: string
                        number:
                          description: Jersey number as text.
                          type: string
                        offensive_foul_turnovers:
                          description: Turnovers of type 'offensive foul' by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        offensive_fouls:
                          description: Fouls committed on offense by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        offensive_goal_tending_turnovers:
                          description: Turnovers of type 'offensive goaltending' by the player in this
                            quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        offensive_rebounds:
                          description: Offensive rebounds by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        other_turnovers:
                          description: Turnovers of type 'other' by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        out_of_bounds_turnovers:
                          description: Turnovers of type 'out of bounds' by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        personal_fouls:
                          description: Personal fouls by the player in this quarter (excludes technical,
                            unsportsmanlike and disqualifying fouls).
                          type: integer
                          x-absent-in-some-rows: true
                        pir:
                          description: 'Performance Index Rating by the player in this quarter: efficiency
                            - fouls (verified on all 4,237 played player lines of 189 games).'
                          type: integer
                          x-absent-in-some-rows: true
                        plus_minus:
                          description: 'Plus/minus: the team''s point differential while the player was
                            on court (standard definition; not independently checked).'
                          type: integer
                          x-absent-in-some-rows: true
                        points_in_paint:
                          description: Points scored in the paint by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        points_off_turnovers:
                          description: Points scored off opponent turnovers by the player in this quarter.
                          type: integer
                          x-absent-in-some-rows: true
                        positions:
                          description: 'Playing position as a PascalCase enum: PointGuard, ShootingGuard,
                            SmallForward, PowerForward, Center, and the combinations PointGuardAndShootingGuard,
                            ShootingGuardAndSmallForward, SmallForwardAndPowerForward and PowerForwardAndCenter;
                            '''' when unset (empty on 27 of the 5,130 player lines of 189 games).'
                          type: string
                        rebounds:
                          description: Total rebounds by the player in this quarter (offensive + defensive).
                          type: integer
                          x-absent-in-some-rows: true
                        roster_status:
                          description: 'Roster registration status as an upper-case enum: ''OFFICIAL''
                            in the 2026-27 preseason game (27535); null in the 2024-25 and 2025-26 box
                            scores (an era difference in the feed). No other value seen.'
                          type:
                          - string
                          - 'null'
                        round:
                          description: Quarter number of this row (1-4 regulation, 5 = first overtime,
                            6 = second).
