      description: 'Bearer JWT read at RUN TIME from any baloncestoenvivo.feb.es page: the hidden input
        `#contentToken > input` (name `_ctl0:token`) of `https://baloncestoenvivo.feb.es/Partido.aspx?p={gameId}`
        (the same token is on calendario/resultados pages). It is an RS256 JWT issued by https://intrafeb.feb.es/identity.api
        for client_id `baloncestoenvivoapp`, scope `livestats.api`, roles OverView / TeamStats / ShotChart
        / Ranking / KeyFacts / BoxScore, valid 24 h (exp - nbf = 86400 s). Send it as `Authorization:
        Bearer <JWT>`. A missing, malformed or expired token answers 401 with an empty body and `WWW-Authenticate:
        Bearer`. Never commit or log the token; captures redact any JWT-shaped string.'
      scheme: bearer
      type: http
info:
  description: Spanish Basketball Federation (FEB) game data for Primera FEB (CompID 115), Liga Femenina
    Endesa (210), Segunda FEB (118) and the other FEB competitions. The JSON API serves per-game box score,
    play-by-play (KeyFacts), shot chart with x/y, team stats and leaders, from 2020-21 onward (404 before);
    every route returns the same 10-block envelope (HEADER, SCOREBOARD, TEAMSTATS, TICKER, OVERVIEW, PLAYBYPLAY,
    BANNER, BOXSCORE, SHOTCHART, RANKING) with only the route's blocks filled. Bearer JWT required (see
    securitySchemes.febBearer). Schedules are server-rendered HTML on baloncestoenvivo.feb.es (keyless;
    x-parsed-schema gives the parsed record). Seasons are keyed by START year (t=2026 = 2026-27; sdv END
    year = t + 1). Numbers are mostly strings, percentages use a decimal comma. Shapes from captures of
    2026-10-12; x-unobserved = null in every sample. Not official or supported.
  title: FEB LiveStats API (intrafeb.feb.es) + baloncestoenvivo.feb.es schedule pages
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /BoxScore/{gameId}:
    get:
      description: 'Box score: per-player and team totals. Fills the envelope blocks HEADER, TICKER, BOXSCORE;
        the others are null. Numbers arrive as STRINGS (ids, counts, seconds) and percentages as strings
        with a DECIMAL COMMA (''83,3''); cast at the boundary.'
      operationId: get_feb_boxscore
      parameters:
      - description: 'Game id (the p= of Partido.aspx and of the calendar''s game links). The API serves
          2020-21 onward: LF Endesa from its first 2020-21 game, Primera FEB from 2021-03-12 (2020-21
          second phase, round 9); older games and earlier 2020-21 Primera FEB games answer 404 application/problem+json.'
        example: 2535725
        in: path
        name: gameId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FebBoxScore'
          description: 'LiveStats envelope; filled blocks: HEADER, TICKER, BOXSCORE (the rest null).'
        '401':
          description: 'Missing, malformed or expired bearer token: empty body, `WWW-Authenticate: Bearer`.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unknown game, or a game outside the API's coverage (before 2020-21).
      security:
      - febBearer: []
      summary: 'Box score: per-player and team totals'
  /KeyFacts/{gameId}:
    get:
      description: Play-by-play (KeyFacts) plus scoreboard and team totals. Fills the envelope blocks
        HEADER, SCOREBOARD, TEAMSTATS, TICKER, PLAYBYPLAY, BANNER; the others are null. Lines are NEWEST
        FIRST; num counts up from 1 at tip-off.
      operationId: get_feb_keyfacts
      parameters:
      - description: 'Game id (the p= of Partido.aspx and of the calendar''s game links). The API serves
          2020-21 onward: LF Endesa from its first 2020-21 game, Primera FEB from 2021-03-12 (2020-21
          second phase, round 9); older games and earlier 2020-21 Primera FEB games answer 404 application/problem+json.'
        example: 2535725
        in: path
        name: gameId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FebKeyFacts'
          description: 'LiveStats envelope; filled blocks: HEADER, SCOREBOARD, TEAMSTATS, TICKER, PLAYBYPLAY,
            BANNER (the rest null).'
        '401':
          description: 'Missing, malformed or expired bearer token: empty body, `WWW-Authenticate: Bearer`.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unknown game, or a game outside the API's coverage (before 2020-21).
      security:
      - febBearer: []
      summary: Play-by-play (KeyFacts) plus scoreboard and team totals
  /Ranking/{gameId}:
    get:
      description: Per-team game leaders (points, rebounds, assists, fouls). Fills the envelope blocks
        HEADER, TICKER, RANKING; the others are null. Each category list holds the team's top players
        for that stat only; the other stat fields of a leader row are null.
      operationId: get_feb_ranking
      parameters:
      - description: 'Game id (the p= of Partido.aspx and of the calendar''s game links). The API serves
          2020-21 onward: LF Endesa from its first 2020-21 game, Primera FEB from 2021-03-12 (2020-21
          second phase, round 9); older games and earlier 2020-21 Primera FEB games answer 404 application/problem+json.'
        example: 2535725
        in: path
        name: gameId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FebRanking'
          description: 'LiveStats envelope; filled blocks: HEADER, TICKER, RANKING (the rest null).'
        '401':
          description: 'Missing, malformed or expired bearer token: empty body, `WWW-Authenticate: Bearer`.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unknown game, or a game outside the API's coverage (before 2020-21).
      security:
      - febBearer: []
      summary: Per-team game leaders (points, rebounds, assists, fouls)
  /ShotChart/{gameId}:
    get:
      description: 'Shot chart: every field-goal attempt with x/y. Fills the envelope blocks HEADER, TICKER,
        SHOTCHART; the others are null. x / y are percentages of a horizontal full-court image (origin
        top-left), decimal strings with a POINT (''63.47''), unlike the box score''s decimal-comma percentages.
        Sample 63.47, 21.30 = 63 % of the length from the left baseline, 21 % of the width from the top
        sideline. Verified from the site''s ShotChart.js (CSS left:x%, top:y%) and from the distribution
        (baskets near x 5 / 95, y 50).'
      operationId: get_feb_shotchart
      parameters:
      - description: 'Game id (the p= of Partido.aspx and of the calendar''s game links). The API serves
          2020-21 onward: LF Endesa from its first 2020-21 game, Primera FEB from 2021-03-12 (2020-21
          second phase, round 9); older games and earlier 2020-21 Primera FEB games answer 404 application/problem+json.'
        example: 2535725
        in: path
        name: gameId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FebShotChart'
          description: 'LiveStats envelope; filled blocks: HEADER, TICKER, SHOTCHART (the rest null).'
        '401':
          description: 'Missing, malformed or expired bearer token: empty body, `WWW-Authenticate: Bearer`.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unknown game, or a game outside the API's coverage (before 2020-21).
      security:
      - febBearer: []
      summary: 'Shot chart: every field-goal attempt with x/y'
  /TeamStats/{gameId}:
    get:
      description: Team totals of both teams. Fills the envelope blocks HEADER, TICKER, TEAMSTATS; the
        others are null. The same TEAMSTATS rows also come with /KeyFacts; this route returns them alone.
      operationId: get_feb_teamstats
      parameters:
      - description: 'Game id (the p= of Partido.aspx and of the calendar''s game links). The API serves
          2020-21 onward: LF Endesa from its first 2020-21 game, Primera FEB from 2021-03-12 (2020-21
          second phase, round 9); older games and earlier 2020-21 Primera FEB games answer 404 application/problem+json.'
