                      properties:
                        assist:
                          description: Assists (asistencias; integer as a string).
                          type: string
                        bs:
                          description: Blocks made (tapones a favor, page column TF; integer as a string).
                          type: string
                        captain:
                          description: 'Captain flag: ''1'' = team captain, ''0'' = not; string. Null
                            on the 2020-21 samples.'
                          type:
                          - string
                          - 'null'
                        fga:
                          description: Field goals attempted, 2PT + 3PT (integer as a string).
                          type: string
                        fgm:
                          description: Field goals made, 2PT + 3PT (tiros de campo; integer as a string).
                          type: string
                        fgp:
                          description: Field-goal percentage, 0-100, string with a decimal comma ('51,7').
                          type: string
                        id:
                          description: 'Player id = idPlayer (key space: FEB persons; STABLE across seasons
                            and clubs: A. Jorda Rodriguez = 1676991 in 2025-26 at HLA Alicante and in
                            2026-27 at Palencia). The c= of the foto.aspx photo URL; joins PLAYBYPLAY
                            LINES[].idPlayer. Not the licence id (idLicense).'
                          type: string
                        ind:
                          description: 'Unobserved: null in every sample, so no type and no meaning is
                            claimed.'
                          x-unobserved: true
                        inn:
                          description: 'Starter flag (cinco inicial, the page''s I column): ''1'' = started,
                            ''0'' = bench; string.'
                          type: string
                        logo:
                          description: Player photo URL (imagenes.feb.es/foto.aspx?c={player id}).
                          type: string
                        min:
                          description: 'Seconds played (integer as a string: ''1106'' = 18:26). On a team
                            TOTAL row it is the summed seconds of all players (''12000'' = 5 x 40:00).'
                          type: string
                        minFormatted:
                          description: 'Time played as ''mm:ss'' (minutes may exceed 59 on team rows:
                            ''200:00'').'
                          type: string
                        mt:
                          description: Dunks (mates, page column MT; integer as a string).
                          type: string
                        name:
                          description: Player name as 'I. SURNAME(S)', uppercase ('U. MENDICOTE RUBIO').
                          type: string
                        'no':
                          description: Shirt number (dorsal), a string. The SHOTCHART SHOTS[].player of
                            this team's shots is this value.
                          type: string
                        p1a:
                          description: Free throws attempted (integer as a string).
                          type: string
                        p1m:
                          description: Free throws made (tiros libres; integer as a string).
                          type: string
                        p1p:
                          description: Free-throw percentage, 0-100, as a string with a DECIMAL COMMA
                            ('77,3'); '0,0' when no attempts.
                          type: string
                        p2a:
                          description: Two-point field goals attempted (integer as a string).
                          type: string
                        p2m:
                          description: Two-point field goals made (integer as a string).
                          type: string
                        p2p:
                          description: Two-point percentage, 0-100, string with a decimal comma ('54,1').
                          type: string
                        p3a:
                          description: Three-point field goals attempted (integer as a string).
                          type: string
                        p3m:
                          description: Three-point field goals made (integer as a string).
                          type: string
                        p3p:
                          description: Three-point percentage, 0-100, string with a decimal comma ('47,6').
                          type: string
                        pf:
                          description: Personal fouls committed (faltas cometidas, page column FC; integer
