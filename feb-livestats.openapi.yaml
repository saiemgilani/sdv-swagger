                          type: string
                        pts:
                          description: Points (integer as a string).
                          type: string
                        rd:
                          description: Defensive rebounds (rebotes defensivos; integer as a string).
                          type: string
                        reb:
                          description: Total rebounds (same count as rt; integer as a string).
                          type: string
                        rf:
