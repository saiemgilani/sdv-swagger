components:
  schemas:
    PleagueBox:
      description: 'Body of /api/boxscore.preciser.php (JSON, although served as text/html): the final
        score by quarter, one row per rostered player per side and a team totals row. The era split is
        2020-21/2021-22 (A) vs 2022-23 onward (B).'
      properties:
        data:
          description: The box payload.
          properties:
            adv_flag:
              description: '1 = the game has the advanced columns (ORTG, DRTG, pace, ...): present, always
                1, on every 2022-23+ body; absent on 2020-21 and 2021-22 bodies.'
              type: integer
              x-absent-in-some-rows: true
            away:
              description: Away players, one row per rostered player including 'DNP' rows.
              items:
                properties:
                  AST_RATIO:
                    description: 'Assist ratio, 0-100 (B era): assists per 100 of the player''s own plays.
                      The common formula AST / (FGA + 0.5 x FTA + AST + TOV) x 100 reproduces it on 919
                      of 1,174 rows, so the exact formula is unverified.'
                    type:
                    - number
                    - string
                    x-absent-in-some-rows: true
                  DRTG:
                    description: 'Defensive rating (B era): the opponent''s points scored per 100 of its
                      possessions while the player was on court (lower is better).'
                    type:
                    - number
                    - string
                    x-absent-in-some-rows: true
                  NETRTG:
                    description: 'Net rating (B era): ORTG - DRTG, exact on 1,060 of 1,060 rows.'
                    type:
                    - number
                    - string
                    x-absent-in-some-rows: true
                  ORTG:
                    description: 'Offensive rating (B era): the team''s points scored per 100 offensive
                      possessions while the player was on court.'
                    type:
                    - number
                    - string
                    x-absent-in-some-rows: true
                  TO_RATIO:
                    description: 'Turnover ratio, 0-100 (B era): turnovers per 100 of the player''s own
                      plays; same formula family as AST_RATIO (917 of 1,174 rows).'
                    type:
                    - number
                    - string
                    x-absent-in-some-rows: true
                  ast:
                    description: Assists.
                    type:
                    - integer
                    - string
                  blk:
                    description: Blocks made.
                    type:
                    - integer
                    - string
                  eff:
                    description: 'Efficiency: points + rebounds + assists + steals + blocks - missed field
                      goals - missed free throws - turnovers (verified on all 3,932 A-era rows).'
                    type:
                    - integer
                    - string
                  efgp:
                    description: 'Effective field-goal percentage, 0-100: (FGM + 0.5 x 3PM) / FGA x 100
                      (verified on 3,696 of 3,696 A-era rows with attempts). A-era only; a number or a
                      string ('''' on DNP rows).'
                    type: number
                    x-absent-in-some-rows: true
                  ft:
                    description: Free throws ATTEMPTED (the second number of ft_m_ft).
                    type:
                    - integer
                    - string
                  ft_a:
                    description: 'Free throws MISSED (A era): ft = ft_m + ft_a on all 3,932 rows. The
                      name suggests ''attempted'' but it is the misses; read ft_m_ft (''made-attempted'')
                      to check.'
                    type: integer
                    x-absent-in-some-rows: true
                  ft_m:
                    description: Free throws MADE (A era; paired with ft_a).
                    type: integer
                    x-absent-in-some-rows: true
                  ft_m_ft:
                    description: Free throws 'made-attempted' as a string ('0-0').
                    type: string
                  ftp:
                    description: Free-throw percentage, 0-100 (a number or a string).
                    type:
                    - number
                    - string
                  jersey:
                    description: Shirt number as a string ('0', '00' and '10' differ).
                    type: string
                  mins:
                    description: 'Minutes played ''mm:ss''; ''DNP'' = did not play. Team totals: ''240:00''
                      for a 4-quarter game (5 players x 48 min), more with overtime.'
                    type: string
                  name:
                    description: Player name field; equal to name_alt on B-era rows, null or '' on most
                      A-era rows.
                    type:
                    - string
                    - 'null'
                  name_alt:
                    description: Player name as shown in the box table (Traditional Chinese or a transliteration).
                    type: string
                  offensive_possession:
                    description: The team's offensive possessions while the player was on court (B era);
                      the base of ORTG.
                    type:
                    - integer
                    - string
                    x-absent-in-some-rows: true
                  opp_offensive_possession:
                    description: The opponent's offensive possessions while the player was on court (B
                      era); the base of DRTG.
                    type:
                    - integer
                    - string
                    x-absent-in-some-rows: true
                  opp_points_from_2nd_chance:
                    description: Opponent second-chance points while the player was on court (B era).
                    type:
                    - integer
                    - string
                    x-absent-in-some-rows: true
                  opp_points_from_fastbreak:
                    description: Opponent fast-break points while the player was on court (B era).
                    type:
                    - integer
                    - string
                    x-absent-in-some-rows: true
                  opp_points_from_turnover:
                    description: Opponent points off turnovers while the player was on court (B era).
                    type:
                    - integer
                    - string
                    x-absent-in-some-rows: true
                  opp_points_in_the_paint:
                    description: Opponent points in the paint while the player was on court (B era).
                    type:
                    - integer
                    - string
                    x-absent-in-some-rows: true
                  pace:
                    description: 'Pace (B era): 48 x offensive_possession / minutes on court, i.e. the
                      team''s possessions per 48 minutes with this player on court (verified on 1,124
                      of 1,149 rows; game 194 differs).'
                    type:
                    - number
                    - string
                    x-absent-in-some-rows: true
                  personId:
                    description: 'personId (key space: Preciser persons, a uuid; the same value as players[].id
                      in api.preciser.io /v1/chart-data and the join key between the box and the shot
                      list). 2022-23 onward only; ABSENT on 2020-21 and 2021-22 rows and on a few later
                      games (2025-26 finals gid 716).'
                    type: string
                    x-absent-in-some-rows: true
                  pfoul:
                    description: Personal fouls committed.
                    type:
                    - integer
                    - string
                  player_id:
                    description: 'player_id (key space: P. LEAGUE+ player-team memberships on the site;
                      equals the member id the player page passes to trackPlayer(), e.g. 40 = Lai Ting-En).
                      A STRING of digits in the box. Not the 8-character page id (random_id) and not the
                      Preciser personId uuid.'
                    type: string
                  points:
                    description: 'Points scored. A-era DNP rows: '''' (empty string).'
                    type:
                    - integer
                    - string
                  position:
                    description: 'Unobserved: null in every sample. When filled: Position code (''G''
                      guard, ''F'' forward, ''C'' centre) on some A-era rows; null or '''' on the rest;
                      absent from every B-era row.'
                    x-absent-in-some-rows: true
                    x-unobserved: true
                  positive:
                    description: 'Plus/minus: the team''s points minus the opponent''s while the player
                      was on court (signed integer). Reproduced to within 1 point on 826 of 1,060 B-era
                      player rows by ORTG x offensive_possession / 100 - DRTG x opp_offensive_possession
                      / 100. Absent on team-total rows of the B era; present on A-era totals rows.'
                    type:
                    - integer
                    - string
                  profile_picture:
                    description: 'Unobserved: null in every sample. When filled: Profile picture reference
                      (A era): null on most rows, a string on some.'
                    x-absent-in-some-rows: true
                    x-unobserved: true
                  random_id:
                    description: 'random_id (key space: the 8-character page id of /player/{random_id}).
                      On 2022-23 and later rows it is the player''s page (gid 197: ''1JbPozLB'' = Lai
                      Ting-En, ''1BEtRhwN'' = Kao Kuo-Hao). On 2020-21 and 2021-22 rows it is NOT reliable
                      as a join: gid 13 gives Lai Ting-En (player_id 40) ''1BEtRhwN'', which the live
                      site resolves to Kao Kuo-Hao (player_id 84). Join on player_id, never on random_id,
                      across eras. Null on part of the older rows.'
                    type: string
                  reb:
                    description: Total rebounds (reb_o + reb_d on every checked player row; team totals
                      also include team rebounds).
                    type:
                    - integer
                    - string
                  reb_d:
                    description: Defensive rebounds.
                    type:
                    - integer
                    - string
                  reb_o:
                    description: Offensive rebounds.
                    type:
                    - integer
                    - string
                  seconds:
                    description: 'Playing time in whole seconds (A era only: absent from every 2022-23+
                      row); '''' on DNP rows. Equals mins as mm:ss x 60 on all 3,932 A-era rows with minutes.'
                    type: integer
                    x-absent-in-some-rows: true
                  starter:
                    description: 'Starter flag: ''〇'' (a Japanese-style circle) = started, '''' = bench.'
                    type: string
                  stl:
                    description: Steals.
                    type:
                    - integer
                    - string
                  trey:
                    description: 3-point field goals ATTEMPTED (the second number of trey_m_trey).
                    type:
                    - integer
                    - string
                  trey_a:
                    description: '3-point field goals MISSED (A era): trey = trey_m + trey_a.'
                    type: integer
                    x-absent-in-some-rows: true
                  trey_m:
                    description: 3-point field goals MADE (A era).
                    type: integer
                    x-absent-in-some-rows: true
                  trey_m_trey:
                    description: 3-point field goals 'made-attempted' as a string ('1-5').
                    type: string
                  treyp:
                    description: 3-point field-goal percentage, 0-100 (a number or a string).
                    type:
                    - number
                    - string
                  tsp:
                    description: 'True-shooting percentage, 0-100: PTS / (2 x (FGA + 0.44 x FTA)) x 100
                      (verified on 3,721 of 3,721 A-era rows). A-era only.'
                    type: number
                    x-absent-in-some-rows: true
                  turnover:
                    description: Turnovers committed.
                    type:
                    - integer
                    - string
                  two:
                    description: '2-point field goals ATTEMPTED (verified: equals the second number of
                      two_m_two on all rows).'
                    type:
                    - integer
                    - string
                  two_a:
                    description: '2-point field goals MISSED (A era): two = two_m + two_a.'
                    type: integer
                    x-absent-in-some-rows: true
                  two_m:
                    description: 2-point field goals MADE (A era).
                    type: integer
                    x-absent-in-some-rows: true
                  two_m_two:
                    description: 2-point field goals 'made-attempted' as a string ('1-3').
                    type: string
                  twop:
                    description: 2-point field-goal percentage, 0-100 (a number, or '' / a string on rows
                      without attempts).
                    type:
                    - number
                    - string
                  ugp:
                    description: Usage percentage as the site prints it (A era only). The standard usage
                      formula reproduces it on only 685 of 3,932 rows, so the exact formula is unverified.
                    type: number
                    x-absent-in-some-rows: true
                type: object
              type: array
            away_total:
              description: Away team totals row.
              properties:
                ast:
                  description: Team assists.
                  type: integer
                blk:
                  description: Team blocks.
                  type: integer
                ft:
                  description: Team free-throw attempts.
                  type: integer
                ft_m:
                  description: Team free-throw makes.
                  type: integer
                ftp:
