                description: Points (total in season_totals, per game in season_averages).
                type: number
              reb:
                description: Rebounds (total / per game).
                type: number
              season:
                description: Season slug ('2025-26'), or 'career' for the final totals / averages row.
                type: string
              stl:
                description: Steals (total / per game).
                type: number
              tov:
                description: Turnovers (total / per game).
                type: number
            type: object
          type: array
        status_zh:
          description: 'Player status (身份): 洋將 = import (foreign player), 本土 = local (Taiwanese) player;
            other values may exist.'
          type: string
        team_en:
          description: Current team's English name.
          type: string
        team_zh:
          description: Current team's short name in Traditional Chinese.
          type: string
        tenure:
          description: Years of service (年資) as the page prints it ('0‘', with a prime character).
          type: string
        weight_kg:
          description: Weight in kilograms (體重).
          type: number
      type: object
    PleagueSchedule:
      description: 'Record parsed from /schedule-{stage}/{season} (text/html): every game of the season
        and stage, one row per game, away team first as the page lists it.'
      properties:
        game_count:
          description: Number of games on the page (equals the length of games; the page has no pager,
            and the capture checks that every month button has rows).
          type: integer
        games:
          description: Every game of the season and stage, ascending gid.
          items:
            properties:
              attendance:
                description: 'Spectators: the first number of the page''s ''N / M'' seat cell. 0 on future
                  games.'
                type: integer
              away_logo:
                description: Team logo URL as printed by the page. Protocol-relative ('//d36fypkbmmogz6.cloudfront.net/upload/p_team/logo_<team>_<epoch>.png');
                  some game-page logos are malformed ('https:////d36...'). The trailing number is the
                  logo upload time, so it changes when a club re-uploads.
                type: string
              away_name_en:
                description: Away team's English name on that date; renames change it (Hsinchu Jko Lioneers
                  -> Hsinchu Toplus Lioneers, Taoyuan Pauian Pilots -> Taoyuan Pilots, Formosa Taishin
                  Dreamers -> Formosa Dreamers).
                type: string
              away_name_zh:
                description: Away team's short name on that date (勇士 = Braves, 領航猿 = Pilots, 攻城獅 = Lioneers,
                  夢想家 = Dreamers, 鋼鐵人 = Steelers, 國王 = Kings, 獵鷹 = Ghosthawks, 洋基工程 = Yankey Ark); some
                  seasons print the long form (臺北富邦勇士).
                type: string
              away_score:
                description: Away team's final points; 0 on a future game.
                type: integer
              away_team_id:
                description: 'team_id (key space: P. LEAGUE+ clubs on the site, stable across seasons
                  AND club renames: 1 = Taipei Fubon Braves, 2 = Taoyuan Pauian Pilots, 3 = Hsinchu Jko
                  / Toplus Lioneers, 4 = Formosa Taishin Dreamers, 5 = Kaohsiung 17LIVE Steelers, 6 =
                  New Taipei Kings, 7 = TSG Ghosthawks, 8 = Yankey Ark). The /team/{team_id} page id.
                  NOT a Preciser team uuid (the uuid sits in the logo URL: photonew.preciser.io/plg/teams/<uuid>.png)
                  and not a player id. Away side, read from the row classes (team-<away> team-<home> team-home-<home>).'
                type: integer
              capacity:
                description: 'Seats: the second number of the ''N / M'' cell (7,000 / 7,000 on a sold-out
                  finals game); the venue capacity as the site records it. 0 on future games.'
                type: integer
              date:
                description: Game date, Asia/Taipei (UTC+8) local, built from the page's 'MM/DD' and the
                  row's month class (d-YYYY-MM).
                type: string
              game_label:
                description: 'Game label as printed: ''G01'' = game 1 of the stage (regular season and
                  pre-season), ''PLAYOFFS Game1'' / ''PLAYOFFS A G1'' / ''PLAYOFFS B G1'' = playoff game
                  (series A / B), ''FINALS G1'' / ''FINALS Game1'' / ''Final Game1'' = finals game, ''第一站G1''
                  / ''第二站G1'' / ''第三站G1'' = game 1 of the first / second / third ''stop'' (站, a round-robin
                  hub weekend; 2020-21), ''GNGN'' = two numbers run together (a site typo). Free text:
                  the label forms are not an enum.'
                type: string
              gid:
                description: 'gid (key space: P. LEAGUE+ games, ONE global integer sequence across every
                  stage and season, with gaps: 1-12 = the 2020-21 pre-season, 13 = the 2020-21 regular-season
                  opener, 197 = the 2022-23 opener, 662 = the 2025-26 opener, 722+ = 2026-27 (scheduled);
                  the site''s row id, not a count of games). The {gid} of /game/{gid}, the id= of boxscore.preciser.php
                  and the schedule rows'' /game/ link.'
                type: integer
              home_logo:
                description: Team logo URL as printed by the page. Protocol-relative ('//d36fypkbmmogz6.cloudfront.net/upload/p_team/logo_<team>_<epoch>.png');
                  some game-page logos are malformed ('https:////d36...'). The trailing number is the
                  logo upload time, so it changes when a club re-uploads.
                type: string
              home_name_en:
                description: Home team's English name on that date; see away_name_en.
                type: string
              home_name_zh:
                description: Home team's short name on that date; see away_name_zh.
                type: string
              home_score:
                description: Home team's final points; 0 on a future game.
                type: integer
              home_team_id:
                description: 'team_id (key space: P. LEAGUE+ clubs on the site, stable across seasons
                  AND club renames: 1 = Taipei Fubon Braves, 2 = Taoyuan Pauian Pilots, 3 = Hsinchu Jko
                  / Toplus Lioneers, 4 = Formosa Taishin Dreamers, 5 = Kaohsiung 17LIVE Steelers, 6 =
                  New Taipei Kings, 7 = TSG Ghosthawks, 8 = Yankey Ark). The /team/{team_id} page id.
                  NOT a Preciser team uuid (the uuid sits in the logo URL: photonew.preciser.io/plg/teams/<uuid>.png)
                  and not a player id. Home side.'
                type: integer
              phase:
                description: 'Row state from the page''s own CSS class: ''before_today'' = the date is
                  before the day the page was served (the score is the result); ''is_future'' = not yet
                  played (both scores are 0); an ''is-today'' class exists in the site CSS but was never
                  seen.'
                type: string
              starred:
                description: True when the date cell carries the site's star icon (a highlighted game;
                  seen on the 2020-21 finals game of 05/18).
                type: boolean
              time:
                description: Scheduled tip-off 'HH:MM', Asia/Taipei (UTC+8) local time.
                type: string
              venue_zh:
                description: Venue (arena) name in Traditional Chinese.
                type: string
              weekday_zh:
                description: 'Weekday as one Chinese character in the page''s ''(日)'': 日 Sun, 一 Mon, 二
                  Tue, 三 Wed, 四 Thu, 五 Fri, 六 Sat.'
                type: string
            type: object
          type: array
        season:
          description: 'Season slug, e.g. ''2024-25'' (START year, then the END year''s last two digits).
            The sdv season key is the END year: ''2024-25'' -> 2025 (see season_sdv). Echo of the request;
            the capture checks it against the page title.'
          type: string
        season_sdv:
          description: 'sdv season key: the END year of the season slug (''2024-25'' -> 2025). Derived
            by the capture, not sent by the site.'
          type: integer
        stage:
          description: 'URL slug of the stage: ''pre-season'' (熱身賽, exhibition games before the season),
            ''regular-season'' (例行賽), ''playoffs'' (季後賽), ''finals'' (總冠軍賽, the championship series).
            The page title echoes it and the capture checks it.'
          type: string
        stage_zh:
          description: 'Stage word as it appears in the page title: 熱身賽 pre-season, 例行賽 regular season,
            季後賽 playoffs, 總冠軍賽 finals.'
          type: string
      type: object
    PleagueStandings:
      description: 'Record parsed from /standings/{season} (text/html): the regular-season table, one
        row per team.'
      properties:
        last_n:
          description: Games in the 'last games' column (近10場比賽 = last 10), read from the header.
          type: integer
        season:
          description: 'Season slug, e.g. ''2024-25'' (START year, then the END year''s last two digits).
            The sdv season key is the END year: ''2024-25'' -> 2025 (see season_sdv). Echo of the request;
            the capture checks it against the page title.'
          type: string
        season_sdv:
          description: 'sdv season key: the END year of the season slug (''2024-25'' -> 2025). Derived
            by the capture, not sent by the site.'
          type: integer
        team_count:
          description: Rows in the table.
          type: integer
        teams:
          description: Standings rows, in the page's rank order.
          items:
            properties:
              away_record:
                description: Away record 'W-L' (客場).
                type: string
              games_behind:
                description: Games behind the leader (勝差), a number.
                type: number
              games_played:
                description: Games played (已賽 GP).
                type: integer
              home_record:
                description: Home record 'W-L' (主場).
                type: string
              last_n_record:
                description: Record 'W-L' over the last last_n games (近N場比賽).
                type: string
              losses:
                description: Losses (敗 L).
                type: integer
              point_diff_avg:
                description: Average point margin (平均分差).
                type: number
              points_against_avg:
                description: Points allowed per game (平均失分).
                type: number
              points_for_avg:
                description: Points scored per game (平均得分).
                type: number
              rank:
                description: Rank on the page (1 = best); ties are not shared.
                type: integer
              streak:
                description: 'Current streak: W<n> wins or L<n> losses (連勝連敗).'
                type: string
              team_id:
                description: 'team_id (key space: P. LEAGUE+ clubs on the site, stable across seasons
                  AND club renames: 1 = Taipei Fubon Braves, 2 = Taoyuan Pauian Pilots, 3 = Hsinchu Jko
                  / Toplus Lioneers, 4 = Formosa Taishin Dreamers, 5 = Kaohsiung 17LIVE Steelers, 6 =
                  New Taipei Kings, 7 = TSG Ghosthawks, 8 = Yankey Ark). The /team/{team_id} page id.
                  NOT a Preciser team uuid (the uuid sits in the logo URL: photonew.preciser.io/plg/teams/<uuid>.png)
                  and not a player id.'
                type: integer
              team_logo:
                description: 'Team logo URL (photonew.preciser.io/plg/teams/<team uuid>.png): the file
                  name is the Preciser team uuid, the link between team_id and the vendor''s home_id /
                  away_id.'
                type: string
              team_zh:
                description: Team short name in Traditional Chinese.
                type: string
              win_pct:
                description: Win percentage 0-100 as a whole percent ('68%' -> 68.0).
                type: number
              wins:
                description: Wins (勝 W).
                type: integer
            type: object
          type: array
      type: object
    PleagueStatPlayer:
      description: 'Record parsed from /stat-player/{season}/{stage_sn} (text/html): one row per player
        of the season and stage, with the per-game average and the season total of each counting stat.'
      properties:
        player_count:
          description: Rows in the table.
          type: integer
        players:
          description: One row per player of the season and stage.
          items:
            properties:
              ast_avg:
                description: Per-game average of assists (助攻).
                type: number
              ast_total:
                description: Season total of assists (助攻).
                type: integer
              blk_avg:
                description: Per-game average of blocks (阻攻).
                type: number
              blk_total:
                description: Season total of blocks (阻攻).
                type: integer
              fg2_att_avg:
                description: Per-game average of 2-point attempts (兩分出手).
                type: number
              fg2_att_total:
                description: Season total of 2-point attempts (兩分出手).
                type: integer
              fg2_made_avg:
                description: Per-game average of 2-point makes (兩分命中).
                type: number
              fg2_made_total:
                description: Season total of 2-point makes (兩分命中).
                type: integer
              fg2_pct:
                description: 2-point percentage 0-100 (the cell holds the same value as average and total).
                type: number
              fg3_att_avg:
                description: Per-game average of 3-point attempts (三分出手).
                type: number
              fg3_att_total:
                description: Season total of 3-point attempts (三分出手).
                type: integer
              fg3_made_avg:
                description: Per-game average of 3-point makes (三分命中).
                type: number
              fg3_made_total:
                description: Season total of 3-point makes (三分命中).
                type: integer
              fg3_pct:
                description: 3-point percentage 0-100 (same cell for average and total).
                type: number
              ft_att_avg:
                description: Per-game average of free-throw attempts (罰球出手).
                type: number
              ft_att_total:
                description: Season total of free-throw attempts (罰球出手).
                type: integer
              ft_made_avg:
                description: Per-game average of free-throw makes (罰球命中).
                type: number
              ft_made_total:
                description: Season total of free-throw makes (罰球命中).
                type: integer
              ft_pct:
                description: Free-throw percentage 0-100 (same cell for average and total).
                type: number
              games:
                description: Games played (出賽).
                type: integer
              jersey:
                description: Shirt number as a string (the player's number in the latest game).
                type: string
              minutes_avg:
                description: Minutes per game 'mm:ss'.
                type: string
              minutes_total:
                description: Total minutes 'mmm:ss'.
                type: string
              name_zh:
                description: Player name (Traditional Chinese or a transliteration).
                type: string
              pf_avg:
                description: Per-game average of personal fouls (犯規).
                type: number
              pf_total:
                description: Season total of personal fouls (犯規).
                type: integer
              player_page_id:
                description: Player page id (the 8-character id of /player/{id}); the same space as the
                  box's random_id on 2022-23+ rows. Not the box player_id.
                type: string
              points_avg:
                description: Per-game average of points (得分).
                type: number
              points_total:
                description: Season total of points (得分).
                type: integer
              reb_avg:
                description: Per-game average of total rebounds (籃板).
                type: number
              reb_def_avg:
                description: Per-game average of defensive rebounds (防板).
                type: number
              reb_def_total:
                description: Season total of defensive rebounds (防板).
                type: integer
              reb_off_avg:
                description: Per-game average of offensive rebounds (攻板).
                type: number
              reb_off_total:
                description: Season total of offensive rebounds (攻板).
                type: integer
              reb_total:
                description: Season total of total rebounds (籃板).
                type: integer
              stl_avg:
                description: Per-game average of steals (抄截).
                type: number
              stl_total:
                description: Season total of steals (抄截).
                type: integer
              team_zh:
                description: Team name as the table prints it (full name, Traditional Chinese); a player
                  traded mid-season shows the current team.
                type: string
              tov_avg:
                description: Per-game average of turnovers (失誤).
                type: number
              tov_total:
                description: Season total of turnovers (失誤).
                type: integer
            type: object
          type: array
        season:
          description: 'Season slug, e.g. ''2024-25'' (START year, then the END year''s last two digits).
            The sdv season key is the END year: ''2024-25'' -> 2025 (see season_sdv). Echo of the request;
            the capture checks the page title and the selected option.'
          type: string
        season_sdv:
          description: 'sdv season key: the END year of the season slug (''2024-25'' -> 2025). Derived
            by the capture, not sent by the site.'
          type: integer
        stage:
          description: URL slug of the stage matching stage_sn.
          type: string
        stage_sn:
          description: 'Stage select value: 2 = regular season, 3 = playoffs, 4 = finals. Echo of the
            request, checked against the page''s selected option. Other values redirect (302) to stage
            2.'
          type: integer
      type: object
info:
  description: 'Taiwan''s P. LEAGUE+ (PLG). Server-rendered pages (schedules per stage, game header, standings,
    player tables, player page; x-parsed-schema gives the parsed record) plus two PHP JSON routes the
    game page calls: /api/boxscore.preciser.php (box, 2020-21 onward) and /api/playbyplay.php (HTML table
    in JSON, 2022-23 onward; needs the game uuid from the game page). Keyless. The page''s analytics widgets
    (shot chart, win probability, rotation) call the vendor host api.preciser.io, documented in pleague-preciser.openapi.yaml.
    Seasons are slugs (''2024-25''); the sdv key is the END year (2025). Field names and texts are Traditional
    Chinese; descriptions translate them. Shapes from captures of 2026-10-12; x-unobserved = null in every
    sample. Not official or supported.'
  title: 'P. LEAGUE+ (pleagueofficial.com): schedules, game page, box score, play-by-play, standings,
    players'
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /api/boxscore.preciser.php:
    get:
      description: 'Served as text/html but the body is JSON. Two eras. A = 2020-21 and 2021-22 (gid 13-188):
        ''two_m''/''two_a'', ''trey_m''/''trey_a'', ''ft_m''/''ft_a'' (made / missed), ''seconds'', ''efgp'',
        ''tsp'', ''ugp'', ''position'', ''profile_picture''; no personId or advanced rating. B = 2022-23
        onward: ''personId'', ORTG, DRTG, NETRTG, pace, AST_RATIO, TO_RATIO, the possession and opponent-points
        columns; the made/missed pairs and seconds are gone, and ''adv_flag'' = 1 appears. ''two'', ''trey''
        and ''ft'' are ATTEMPTS in both eras; the made-attempted strings ''two_m_two'', ''trey_m_trey'',
        ''ft_m_ft'' are the only B-era source of makes at player level. Types drift by row: numbers become
        '''' on DNP rows, percentages are numbers or strings, scores are digit strings on A-era bodies
        and numbers on B-era bodies. The presence sidecars record every type seen.'
      operationId: get_pleague_api_boxscore_preciser_php
      parameters:
      - description: 'Game id. gid (key space: P. LEAGUE+ games, ONE global integer sequence across every
          stage and season, with gaps: 1-12 = the 2020-21 pre-season, 13 = the 2020-21 regular-season
          opener, 197 = the 2022-23 opener, 662 = the 2025-26 opener, 722+ = 2026-27 (scheduled); the
          site''s row id, not a count of games). The {gid} of /game/{gid}, the id= of boxscore.preciser.php
          and the schedule rows'' /game/ link. An unknown or non-numeric id answers 200 with EMPTY rosters
          and null scores (`id=abc` is coerced to 0): the capture refuses it. The body echoes NO id, so
          identity is checked against the game page''s scores and quarter scores.'
        example: 197
        in: query
        name: id
        required: true
        schema:
          type: integer
      - description: 'Period filter for the away table: ''total'' (the whole game; the only value banked),
          ''q1'', ''q2'', ''q3'', ''q4'', ''1st half'', ''2nd half'' (lower case: ''Q1'' or ''TOTAL''
          return blank player rows). There is no overtime tab (''ot1'' returns an empty roster). Verified
          on gid 197: player points sum to the period score. An unknown value answers 200 with blank cells.
          Scoped: the capture only sends ''total'' and checks the sum of points against the final.'
        example: total
        in: query
        name: away_tab
        required: false
        schema:
          default: total
          enum:
          - total
          - q1
          - q2
          - q3
          - q4
          - 1st half
          - 2nd half
          type: string
      - description: Period filter for the home table; same values as away_tab and independent of it.
        example: total
        in: query
        name: home_tab
        required: false
        schema:
          default: total
          enum:
          - total
          - q1
          - q2
          - q3
          - q4
          - 1st half
          - 2nd half
          type: string
      responses:
        '200':
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/PleagueBox'
              x-body-format: json
          description: 'Box score of one game: player rows and team totals (JSON)'
      security: []
      summary: 'Box score of one game: player rows and team totals (JSON)'
  /api/playbyplay.php:
    get:
      description: 'Served as text/html but the body is JSON whose `data` is an HTML table. The route
        returns {error, data: ''<table class="... pbplay">...''}; the capture parses the table into events
        and banks the parsed record, never the HTML (about 0.5 MB). Available from 2022-23 (gid 191 onward,
        including the pre-season). It needs the game uuid from the game page; an empty uuid answers 500.'
      operationId: get_pleague_api_playbyplay_php
      parameters:
      - description: 'Game uuid. Game uuid (key space: the analytics vendor Preciser''s games; a version-1
          uuid). Embedded in the game page as getPlayByPlay(''<uuid>''); keys /api/playbyplay.php?uuid=
          and the api.preciser.io game routes. Empty on 2020-21 and 2021-22 pages. An empty uuid answers
          500; an unknown uuid answers 200 with an empty table.'
        example: e6f98675-3e5b-11ed-949e-5d17350689cf
        in: query
        name: uuid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            text/html:
              schema:
                properties:
                  data:
                    description: HTML table.pbplay; parsed by capture.py
                    type: string
                  error:
                    type: string
                type: object
              x-body-format: json
              x-parsed-schema:
                parser: pleague/tools/pleague_parse.py parse_pbp
                rule: 'table.pbplay rows: period header rows (Qn-tr / OTn-tr + quater-tr), event rows
                  (bar_away / bar_home cell), the closing ''Final'' row'
                schema:
                  $ref: '#/components/schemas/PleaguePlayByPlay'
          description: Play-by-play of one game (JSON whose data is an HTML table), parsed into an event
            list
      security: []
      summary: Play-by-play of one game (JSON whose data is an HTML table), parsed into an event list
  /game/{gid}:
    get:
      description: 'text/html (server-rendered), parsed by capture.py into the JSON record of x-parsed-schema
        (English keys, Traditional Chinese values kept as *_zh). Keyless. Parsing rule: header card (date,
        venue, label), the 客隊/主隊 blocks (name, English name, logo, score), the q?_away / q?_home cells
        and the officials line; uuid from getPlayByPlay(''...''). Parsed from the game page''s header
        only. The box, play-by-play and shot chart are loaded by script from /api/boxscore.preciser.php,
        /api/playbyplay.php and api.preciser.io. To get the play-by-play uuid: GET /game/{gid} and read
        the argument of getPlayByPlay(''<uuid>'') (the same value is passed to fetchChartData / fetchData).
        It is '''' for 2020-21 and 2021-22 games, which have a box but no play-by-play, shot chart or
        win-probability data.'
      operationId: get_pleague_game_gid
      parameters:
      - description: 'Game id. gid (key space: P. LEAGUE+ games, ONE global integer sequence across every
          stage and season, with gaps: 1-12 = the 2020-21 pre-season, 13 = the 2020-21 regular-season
          opener, 197 = the 2022-23 opener, 662 = the 2025-26 opener, 722+ = 2026-27 (scheduled); the
          site''s row id, not a count of games). The {gid} of /game/{gid}, the id= of boxscore.preciser.php
          and the schedule rows'' /game/ link.'
        example: 197
        in: path
        name: gid
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
              x-parsed-schema:
                parser: pleague/tools/pleague_parse.py parse_game
                rule: header card (date, venue, label), the 客隊/主隊 blocks (name, English name, logo, score),
                  the q?_away / q?_home cells and the officials line; uuid from getPlayByPlay('...')
                schema:
                  $ref: '#/components/schemas/PleagueGame'
          description: Game page header (teams, scores, venue, officials) and the game uuid, parsed
      security: []
      summary: Game page header (teams, scores, venue, officials) and the game uuid, parsed
  /player/{player_page_id}:
    get:
      description: 'text/html (server-rendered), parsed by capture.py into the JSON record of x-parsed-schema
        (English keys, Traditional Chinese values kept as *_zh). Keyless. Parsing rule: section#section_player
        (profile) and the two season tables (header checked). The per-game log (''GAMELOG & BOXSCORE'')
        and the career-vs-season widgets load by script from /api/player.preciser.php; they are not captured.
        The page holds the league''s tables (totals then averages) and, for a player with EASL games,
        a second block with the same two tables; the capture tells the blocks apart by the game-log tbody
