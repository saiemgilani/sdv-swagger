    PleaguePlayByPlay:
      description: 'Record parsed from /api/playbyplay.php (JSON whose `data` is an HTML table): the periods,
        the closing score and one event per play, in game order.'
      properties:
        event_count:
          description: Events in the fragment (the capture refuses an empty fragment).
          type: integer
        events:
          description: Plays in game order (period header rows and the closing row excluded).
          items:
            properties:
              action:
                description: 'Action code from the phrase after the player in the site''s text. The full
                  table is in the returns md and the README (`action_zh` is the original phrase). Families:
                  fg2_*/fg3_*/fg_* = field goal attempts (made | missed), ft_made/ft_missed = free throws,
                  reb_off/reb_def, ast, stl, blk, tov_* = turnovers, foul_* = fouls, timeout, sub_in/sub_out,
                  jump_ball_won/lost, ''unlabelled'' = a row with a player and shot coordinates but no
                  action text.'
                type: string
              action_zh:
                description: The action phrase as printed, Traditional Chinese (e.g. 灌籃得分 = dunk, made);
                  '' on an 'unlabelled' row.
                type: string
              clock:
                description: Game clock REMAINING in the period, 'mm:ss' (counts down from 12:00 in regulation;
                  overtime periods start at 05:00).
                type: string
              ft_awarded:
                description: Free throws awarded in the trip (1, 2 or 3), from '得到一次罰球 / 得到兩次罰球 / 得到三次罰球';
                  set only on the FIRST free throw's row (later rows say '第二罰 ...'), null otherwise.
                type:
                - integer
                - 'null'
              ft_number:
                description: Which free throw of the trip this is (1, 2 or 3), from '第一罰 / 第二罰 / 第三罰';
                  null on every other row.
                type:
                - integer
                - 'null'
              jersey:
                description: Shirt number of the acting player as printed ('35'; a string because the
                  site prints '00' and '0' apart); null on team rows and on rows where the name is printed
                  without a number.
                type:
                - string
                - 'null'
              nice_play:
                description: True when the site stars the play (the row carries a nice_play_home / nice_play_away
                  class and the clip is starred).
                type: boolean
              period:
                description: 'Period: Q1-Q4, OT1, OT2 (the fragment''s period header rows; overtime beyond
                  OT2 not seen).'
                type: string
              player_zh:
                description: Acting player's name as printed (Traditional Chinese or a transliteration);
                  null on team rows (a team rebound, timeout or shot-clock violation).
                type:
                - string
                - 'null'
              points:
                description: Points scored by the event from the '+2' / '+3' / '+1' tag; null when the
                  tag is a bare '+' (no points).
                type:
                - integer
                - 'null'
              score_away:
                description: Away score after the event, from the 'A - H' cell (away FIRST, unlike the
                  box's home-first keys); null on rows that print no score (substitutions, jump balls).
                type:
                - integer
                - 'null'
              score_home:
                description: Home score after the event, from the 'A - H' cell; null when the row prints
                  no score.
                type:
                - integer
                - 'null'
              seq:
                description: Position of the event in game order, 1-based (the HTML lists events oldest
                  first within the fragment; the site's own JS flips the display).
                type: integer
              side:
                description: 'Side of the acting team: ''away'' or ''home'' (the fragment places the event
                  in the away or home column).'
                type: string
              text_zh:
                description: The whole printed text of the event, e.g. '#35 辛巴 灌籃得分' = '#35 <player> dunk,
                  made'.
                type: string
              video:
                description: 'Video-clip reference decoded from the row''s data-tryspot attribute (a base64
                  JSON blob); null on rows without a clip (about 3 in 4). The clip URLs are NOT banked:
                  they carry a vendor access key.'
                properties:
                  created_at:
                    description: When the clip was created, UTC ISO 8601 with milliseconds.
                    type: string
                  stat_category:
                    description: 'The clip''s own stat label (ast, blk, ft_made, ft_miss, pfoul, reb_d,
                      reb_o, stl, three_made, three_miss, timeout, turnover, two_made, two_miss): names
                      the PLAY the clip shows, which is not always this row''s action (a rebound row carries
                      the missed shot''s clip).'
                    type: string
                  synergy_play_id:
                    description: 'Synergy play uuid (key space: Synergy Sports plays); the site links
                      Synergy. Null when the clip has no Synergy play.'
                    type: string
                  tryspot_player_id:
                    description: Player id in the clip vendor's key space (integer, e.g. 59476); NOT the
                      box player_id.
                    type:
                    - integer
                    - 'null'
                  video_uuid:
                    description: 'Clip uuid (key space: the clip vendor, tryspot).'
                    type: string
                type:
                - object
                - 'null'
              x:
                description: 'Shot/event x: PERCENT (0-100) of the court LENGTH, in the PHYSICAL court
                  frame (not normalised per team): the baskets sit near x = 5 and x = 95 and teams swap
                  ends at half-time, so the same team''s shots flip from x > 50 to x < 50 (game 197: home
                  attacks x < 50 in periods 1-2, x > 50 in 3-4). Which end the home team starts at varies
                  by game. The vendor shot list (api.preciser.io) uses another frame: home always attacks
                  x > 50; x_vendor = 100 - x in halves where the home team attacks x < 50. Empty string
                  on the page (null here) for rows without a location (substitutions, rebounds, assists).'
                type:
                - number
                - 'null'
              y:
                description: 'Shot/event y: PERCENT (0-100) of the court WIDTH; the baskets are at y =
                  50. Which sideline is y = 0 is unverified. Null where x is null.'
                type:
                - number
                - 'null'
            type: object
          type: array
        final_score_away:
          description: 'Away final score, from the fragment''s closing ''Final'' row (''94 - 102'': away
            FIRST).'
          type: integer
        final_score_home:
          description: Home final score, from the closing 'Final' row.
          type: integer
        period_count:
          description: 'Periods played: 4 plus one per overtime.'
          type: integer
        periods:
          description: Period labels in order (Q1-Q4, OT1, OT2).
          items:
            type: string
          type: array
      type: object
