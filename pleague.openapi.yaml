                  type: integer
                  x-absent-in-some-rows: true
                reb:
                  description: Team total rebounds, including team rebounds that no player row carries.
                  type: integer
                reb_d:
                  description: Team defensive rebounds.
                  type: integer
                reb_o:
                  description: Team offensive rebounds.
                  type: integer
                seconds:
                  description: Team seconds (A era only; 14400 = 240 min).
                  type: integer
                  x-absent-in-some-rows: true
                stl:
                  description: Team steals.
                  type: integer
                trey:
                  description: Team 3-point attempts.
                  type: integer
                trey_m:
                  description: Team 3-point makes.
                  type: integer
                treyp:
                  description: Team 3-point percentage, 0-100.
                  type: number
                turnover:
                  description: Team turnovers.
                  type: integer
                two:
