info:
  description: 'The JSON proxy behind nbl.com.au for the NBL, WNBL and NBL1: seasons, matches, a match''s
    box score and play-by-play with shot x/y, standings, rosters, game logs, season stats. Results 1979+
    (NBL) / 1981+ (WNBL), play-by-play 2011-12+ (NBL) / about 2014-15+ (WNBL). Gated on the Origin and
    Referer headers (no key). Every body is the envelope {type, fetched, ttlRemaining, count, source,
    data}. `year` is the season START year for NBL/WNBL from 1998-99 (2025 = 2025-26) and the calendar
    year for NBL/WNBL 1979-1997 and NBL1 (see README → Season key). Routes from the site bundles, shapes
    from committed captures in nbl-rosetta/captures/. Not official or supported.'
  title: NBL Rosetta proxy (prod.rosetta.nbl.com.au)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /match/outcomes/for/{org}/teams/in/season/{year}/{type}:
    get:
      description: 'Captured variants: nbl_2025, wnbl_2025, nbl1_2025.'
      operationId: match_outcomes_for_org_teams_in_season_year_type
      parameters:
      - description: 'Organisation shortcode: `nbl` (men), `wnbl` (women), `nbl1` (the second tier, men''s
          and women''s conferences). An unknown value answers 200 with `data: []`.'
        example: nbl1
        in: path
        name: org
        required: true
        schema: &id002
          enum:
          - nbl
          - wnbl
          - nbl1
          type: string
      - description: 'Rosetta season year = the season''s START year: 2025 is NBL26 / WNBL26 (2025-26),
          so sdv END year = year + 1. NBL and WNBL 1979-1997 were winter seasons in one calendar year
          (END = year); year 1998 holds both the calendar 1998 season and 1998-99. NBL1 seasons are calendar
          years (END = year).'
        example: 2025
        in: path
        name: year
        required: true
        schema: &id003
          type: integer
      - description: 'Season type: `all` or one `season_type` (`regular` includes the finals). An unknown
          value answers 200 with `data: []`.'
        example: regular
        in: path
        name: type
        required: true
        schema: &id004
          enum:
          - all
          - regular
          - preseason
          - in_season
          type: string
      - description: Required gate header (403 MISSING_API_KEY without it).
        in: header
        name: Origin
        required: true
        schema:
          enum:
          - https://www.nbl.com.au
          type: string
      - description: Required gate header (403 MISSING_API_KEY without it).
        in: header
        name: Referer
        required: true
        schema:
          enum:
          - https://www.nbl.com.au/
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchOutcomesForOrgTeamsInSeasonYearType'
          description: 'OK. Unknown ids, types or orgs also answer 200, with `data: []`.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
          description: 'Gate headers missing: `{error: "Access Denied", code: "MISSING_API_KEY", timestamp,
            request_id, client_ip, user_agent}`.'
      summary: Win-loss record and form per team, keyed by team name
  /match/{match_id}:
    get:
      description: 'Captured variants: nbl_2025.'
      operationId: match_match_id
      parameters:
      - description: 'Match id: the DataCore fixture id (UUID v1), `id` and `external_id` of a match row.
          An unknown id answers 200 with `data: []` and `count: 1`.'
        example: b217a699-4bef-11f0-bc08-933162362355
        in: path
        name: match_id
        required: true
        schema: &id001
