components:
  schemas:
    AccessDenied:
      description: 'The 403 body when the gate headers are missing. An error envelope: never bank it.'
      properties:
        client_ip:
          description: The caller's IP address
          type: string
        code:
          description: Always "MISSING_API_KEY" (the Origin/Referer gate, not a real key)
          type: string
        error:
          description: Always "Access Denied"
          type: string
        request_id:
          description: Request id; "unknown" observed
          type: string
        timestamp:
          description: Server time of the refusal, ISO 8601 UTC
          type: string
        user_agent:
          description: The caller's User-Agent
          type: string
      type: object
    MatchMatchId:
      properties:
        count:
          description: Row count. The string "object" when data is a map (outcomes); 1 on an empty live
            answer
          type: integer
        data:
          description: The rows (documented per route below); a team-name-keyed map on the outcomes route
          items:
            properties:
              attendance:
                description: Attendance, a STRING; null when not recorded
                type:
                - string
                - 'null'
              away_score:
                description: Away final score, a STRING; null before tip-off
                type: string
              away_team:
                description: Away team (ids, codes, logos, colours)
                properties:
                  color_primary:
                    description: Team primary colour, hex
                    type:
                    - string
                    - 'null'
                  color_secondary:
                    description: Team secondary colour, hex
                    type:
                    - string
                    - 'null'
                  external_id:
                    description: DataCore team id (UUID v1); stable across seasons
                    type: string
                  external_team_logo:
                    description: Team logo URL on the Sportradar DataCore image CDN
                    type:
                    - string
                    - 'null'
                  external_team_logo_blurhash:
                    description: BlurHash placeholder of the image
                    type: string
                  external_team_name:
                    description: Team name as DataCore spells it
                    type: string
                  id:
                    description: DataCore team id (UUID v1, = external_id). In this route only; elsewhere
                      team.id is the Rosetta id
                    type: string
                  marquee_players:
                    description: Featured players shown on the match page
                    items:
                      properties:
                        games:
                          description: Games played
                          type: integer
                        is_manual_override:
                          description: Marquee pick was set by hand
                          type: boolean
                        player:
                          description: Player the row belongs to (ids, name, photo)
                          properties:
                            external_id:
                              description: DataCore person id (UUID v1); joins pbp personId and the live
                                box score's player.id
                              type: string
                            external_player_image:
                              description: Player photo URL on the Sportradar DataCore image CDN
                              type:
                              - string
                              - 'null'
                            external_player_image_blurhash:
                              description: BlurHash placeholder of the image
                              type: string
                            first_name:
                              description: Given name
                              type: string
                            id:
                              description: Rosetta player id (UUID v4); accepted as {player_id}
                              type: string
                            image:
                              description: Unobserved in samples (null in every capture); type and meaning
                                unverified.
                              x-unobserved: true
                            jersey_number:
                              description: Jersey number, a STRING
                              type:
                              - string
                              - 'null'
                            last_name:
                              description: Family name
                              type: string
                            playing_position:
                              description: Playing position code (G, F, C, PG, SF, FC, ...); null when
                                not recorded
                              type:
                              - string
                              - 'null'
                          type: object
                        player_match_stats:
                          description: The marquee player's line in this match
                          properties:
                            assists:
                              description: Assists in the match, or in the period on period rows; 0 where
                                the era did not record it (results-only seasons before pbp)
                              type: integer
                            points:
                              description: Points in the match, or in the period on period rows; 0 where
                                the era did not record it (results-only seasons before pbp)
                              type: integer
                            rebounds:
                              description: Total rebounds in the match, or in the period on period rows;
                                0 where the era did not record it (results-only seasons before pbp)
                              type: integer
                          type: object
                        player_season_stats:
                          description: The marquee player's season averages
                          properties:
                            assists_average:
                              description: Assists per game
                              type: number
                            points_average:
                              description: Points per game
                              type: number
                            rebounds_average:
                              description: Total rebounds per game
                              type: number
                          type: object
                      type: object
                    type: array
                  name:
                    description: Display name of the team
                    type: string
                  team_code:
                    description: Team code, e.g. PER (the {team_code} path value)
                    type: string
                  team_logo:
                    description: Team logo URL
                    type:
                    - string
                    - 'null'
                  team_logo_blurhash:
                    description: BlurHash placeholder of the image
                    type: string
                  team_logo_transparent:
