                    description: BlurHash placeholder of the image
                    type: string
                  team_nickname:
                    description: Short team code used in graphics (usually equals team_code)
                    type: string
                  ticket_url:
                    description: Ticketing URL
                    type:
                    - string
                    - 'null'
                type: object
              boxscore_field_mapping:
