info:
  description: 'Sweden''s second tier (HockeyAllsvenskan, sdv prefix ha). Keyless Next.js API routes of
    hockeyallsvenskan.se (www. 301s to the apex), backed by a Strapi CMS and StatNet; not the SHL API.
    GET /api/game and the text/html /pages/matcher (game list embedded as JSON, see x-embedded-json);
    every stats and play-by-play route is POST with a JSON body (see requestBody). Season keys are START
    years (2025 = 2025/26; CMS season_2026 = 2026/27). Coverage: stats and standings 2005/06 onward; game
    records and play-by-play 2025/26 onward. phase: HA regular season, HAPlayoff playoffs, HAkval playout.
    No shot coordinates, no on-ice players; the stats tables carry names, not player ids, except player-leaderboard
    (playerStatNetId). Wrong or missing `categories` answers 200 with zero rows. Shapes from captures
    of 2026-10-12. Not official or supported.'
  title: HockeyAllsvenskan (hockeyallsvenskan.se) site API
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /api/all-players:
    post:
      description: 'Errors are application/json {"error": "<message>"}; observed 400s: Missing required
        fields.'
      operationId: api_all_players
      requestBody:
        content:
          application/json:
            example:
              leagueShortName: HA
              orderBy: familyName
              page: 1
              pageSize: 100
              scope: league
              searchQuery: ''
              teamShortName: AIK
            schema:
              properties:
                leagueShortName:
                  description: League short name.
                  enum:
                  - HA
                  type: string
                orderBy:
                  description: 'Sort: familyName (default), firstName. Other values (id, slug, jerseyNumber,
                    bogus) fall back to familyName.'
                  type: string
                page:
                  description: 1-based page number.
                  type: integer
                pageSize:
                  description: Rows per page, capped at 100 (500 returns 100 rows).
                  type: integer
                scope:
                  description: 'Directory scope: league (the site also sends team on club pages).'
                  type: string
                searchQuery:
                  description: Free-text name search; empty = everyone.
                  type: string
                teamShortName:
                  description: CMS team shortName (AIK, MORA, ÖIK, ...); null = every team. Filters whatever
                    the scope.
                  type:
                  - string
                  - 'null'
              required:
              - scope
              - orderBy
              - page
              - pageSize
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAllPlayers'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing required fields
      summary: Player directory (CMS) with headshots, one team per call (league-wide paging is unstable)
      x-pagination:
        params:
        - page
        - pageSize
        request: 'verified: pageSize is capped at 100. Page edges overlap and skip (unstable familyName
          order): two walks of the 386-player league gave 389 rows (386 unique) and 384 unique. Filter
          by teamShortName for complete single pages (drop-one probed 2026-10-12)'
        response:
        - pagination
        style: page
  /api/all-time-games-stats:
    post:
      description: 'Errors are application/json {"error": "<message>"}.'
      operationId: api_all_time_games_stats
      requestBody:
        content:
          application/json:
            example:
              against_team: all
              all_results: all
              categories: all
              decided_in: all
              game_status: all
              league: HA
              page: 1
              page_size: 1000
              phase: HA
              season: '2025'
              team: all
              team_side: all
            schema:
              properties:
                against_team:
                  description: 'Opponent filter: all, or one team (values not probed).'
                  type: string
                all_results:
                  description: 'Game result filter: W win, T tie, L loss.'
                  enum: &id001
                  - all
                  - W
                  - T
                  - L
                  type: string
                categories:
                  description: Ignored by this route (same 364 games with or without it); the site sends
                    all.
                  type: string
                decided_in:
                  description: 'How the game was decided: ft full time, ot overtime, so shootout, wo walkover.'
                  enum: &id002
                  - all
                  - ft
                  - ot
                  - so
                  - wo
                  type: string
                game_status:
                  description: Game status filter.
                  enum: &id003
                  - all
                  - played
                  type: string
                is_last_games:
                  description: true = the last N games (lastGames) instead of a season. Sent by the site's
                    JS; not drop-probed.
                  type: boolean
                lastGames:
                  description: N for is_last_games. Sent by the site's JS; not drop-probed.
                  type: integer
                league:
                  description: League code (the site offers HA only).
                  enum: &id004
                  - HA
                  type: string
                page:
                  description: 1-based page number.
                  type: integer
                page_size:
                  description: Rows per page; 1000 returns a whole season in one page (total_pages = 1).
                  type: integer
                phase:
                  description: 'Game type: HA = regular season, HAPlayoff = playoffs, HAkval = playout
                    (relegation series).'
                  enum: &id005
                  - HA
                  - HAPlayoff
                  - HAkval
                  type: string
                season:
                  description: 'Season START year as a string: 2025 = 2025/26. Earliest 2005 (2004 answers
                    zero rows).'
                  type: string
                sort_by:
                  description: 'Sort column; valid values are the response''s sort_by_options. Sent by
                    the site''s JS; not drop-probed. Captured options for the sampled category: Attendance,
                    AwayTeam, Date, HomeTeam.'
                  type: string
                sort_direction:
                  description: Sort direction. Sent by the site's JS; not drop-probed.
                  enum: &id006
                  - asc
                  - desc
                  type: string
                team:
                  description: 'Team filter: all, or one team from the site''s league-teams filter list
                    (values not probed).'
                  type: string
                team_side:
                  description: Home / away split.
                  enum: &id007
                  - all
                  - home
                  - away
                  type: string
              required: []
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAllTimeGamesStats'
          description: OK
      summary: 'Game results of a season: score, periods, arena, attendance, team shots/power play'
      x-pagination:
        params:
        - page
        - page_size
        request: 'verified: page=2&page_size=3 returns the next three games; page_size=1000 returns a
          whole season (total_pages = 1) (drop-one probed 2026-10-12)'
        response:
        - count
        - page
        - page_size
        - total_pages
        style: page
