  /pages/matcher:
    get:
      description: Server-rendered text/html (~1.8 MB). The current season's game list (slug, statNetGameNumber,
        StatNet team ids) is embedded in the React Server Components flight data; extract it per x-embedded-json.
      operationId: pages_matcher
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
              x-embedded-json:
                element: games.game-calendar-<n>-<m> (the props object of that RSC element)
                extract: re.findall(r'self\.__next_f\.push\(\[1,("(?:[^"\\]|\\.)*")\]\)') -> json.loads
                  each literal -> concatenate in document order -> re.search(r'"(games\.game-calendar-[^"]*)",')
                  -> json.JSONDecoder().raw_decode(text, match.end()) -> props; props.games is the list
                schema:
                  $ref: '#/components/schemas/PagesMatcher'
                source: 'React Server Components flight data: the JSON-encoded string argument of every
                  self.__next_f.push([1, "..."]) script call'
          description: Schedule page (HTML) with the game list embedded in the RSC flight data
      summary: Schedule page (text/html); the current-season game list is embedded in the RSC flight data
servers:
- url: https://hockeyallsvenskan.se
