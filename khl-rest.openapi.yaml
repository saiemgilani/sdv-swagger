        penalty, goal, goalkeeper, timeout), tab_shotsmap.shots[] {period, time, shotType, x, y, teamAB,
        jn}. Play-by-play reaches back to 2008/09; shot x/y only from 2024/25. PBP `time` is a string
        in 2013 and an int in 2025.
