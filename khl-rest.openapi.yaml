info:
  description: 'Bitrix front-end blocks of khl.ru, every one a form-encoded POST to /rest/<a>/<b>/. Session:
    GET / with a cookie jar, following redirects (the first answer is a 307 that sets the ServicePipe
    spid/spsc cookies); scrape sessid; POST with X-Requested-With: XMLHttpRequest and Origin/Referer https://www.khl.ru/.
    A POST answering 307 means the WAF cookie rotated: re-prime once and retry. Bad parameters answer
    200 {"status":"error"}. Never use a headless browser here: ServicePipe serves it an anti-bot 403.
    No proxy is needed. Shapes from khl/captures/rest/ (tournament 1369, game 898236, captured 2026-10-12);
    the full 112-block route map is in khl/ENDPOINTS.md. Russian league operator: a published data release
    or mirror needs owner sign-off. Not official or supported.'
  title: KHL site REST (www.khl.ru/rest)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /calendar/list/:
    post:
      operationId: calendar_list
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                sessid:
                  description: 'Bitrix CSRF token, 32 hex chars, scraped from any page of the same host
                    (regex `sessid":"([a-f0-9]{32})`) after GET / with a cookie jar. Missing or stale:
                    200 {"status":"error","errors":[{"code":"invalid_csrf"}]}.'
                  pattern: ^[a-f0-9]{32}$
                  type: string
                values[tournament]:
                  description: 'Tournament (stage) id: 1369 = 2025/26 regular season, the playoff is regular
                    + 1 (1370). List: /filters/statplayers/ or webcaster data.json stages_v2[].khl_id.
                    Omitted: the current season.'
                  example: '1369'
                  type: string
              required:
              - sessid
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarList'
          description: 'OK. Bad parameters ALSO answer 200, with {"status":"error","data":null,"errors":[{"message":...}]}:
            check status == "success".'
        '307':
          description: 'The ServicePipe WAF cookie rotated: GET / with the cookie jar, re-read sessid,
            retry once.'
      summary: Full-season schedule and results for one tournament, one call (data.GAMES)
      x-pagination:
        params: []
        request: 'verified 2026-10-12: one call returns the whole tournament (752 games for 1369)'
        style: none
