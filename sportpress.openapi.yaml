    ApiKeyAuth:
      description: 'Public key hard-coded in the site bundle (https://bnxtleague.com/js/app.<hash>.js,
        the assignment `headers["X-Authorization"]="..."`). Value on 2026-10-12: BWSyE7sgg9QAurh2JX9cpjzjGc652BWLuNUS.
        The same key also opens the sibling tenants sopron.sportpress.info and beac.sportpress.info. A
        401 means the key rotated.'
      in: header
      name: X-Authorization
      type: apiKey
info:
  description: 'JSON backend of the bnxtleague.com web app, hosted on the Sportpress CMS (vendor: Webpont,
    Hungary). One league, 2020-21 to date: schedule with scores by period, standings, box scores (2021-22,
    2024-25 onward and a few 2022-23 games), play-by-play with court x/y (''film'', 2021-22 and 2026-27
    only), rosters, per-player and per-team averages, rankings. Every route needs the public header X-Authorization
    (read from the site''s app.<hash>.js bundle). Season key = the END year (/phase/season/2026 = 2025-26);
    the competition id (24 = 2025-26) keys the rest. `genius_id` (game-slider) joins Genius LiveStats.
    Text is English; the Dutch and French fields (UI labels, news, awards) are documented in the README.
    robots.txt allows everything. Shapes from captures of 2026-10-12; x-unobserved = null in every sample.
    Not official or supported.'
  title: BNXT League (Belgium and the Netherlands) on Sportpress
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /boxscore/game/{competitionId}/{gameId}:
    get:
      description: 'Box score of one game: both teams, player lines and totals. Present for 2021-22, 2024-25,
        2025-26 and 2026-27; almost absent for 2022-23 (10 of 118 sampled games) and absent for 2023-24
        (0 of 113): those answer `{"data": []}`.'
      operationId: get_sportpress_game_box
      parameters:
      - $ref: '#/components/parameters/Localization'
      - description: 'Competition id (key space: sportpress competitions; ONE season of the league: 1
          = 2021-22, 2 = 2020-21, 3 = 2022-23, 12 = 2023-24, 22 = 2024-25, 24 = 2025-26, 25 = 2026-27).
          The {competitionId} of the standings, ranking, slider and box routes. Not the season number
          (see `season`).'
        example: 24
        in: path
        name: competitionId
        required: true
        schema:
          type: integer
      - description: 'Game id (key space: sportpress schedule entries, unique across all BNXT seasons:
          1-377 = 2021-22, 378-3601 = 2022-23, 3611-7072 = 2023-24, 7081-10567 = 2024-25, 10569-11269
          = 2025-26, 11271+ = 2026-27). The {gameId} of /schedule/find, /schedule/overview, /boxscore/game
          and /film/game. Not the Genius matchId (that is `genius_id`).'
        example: 10569
        in: path
        name: gameId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportpressGameBox'
          description: JSON body
        '401':
          description: 'Missing or wrong X-Authorization key: {"errors": [{"code": "401", "message": "Unauthorized"}]}
            (key rotated? re-read it from the bundle).'
        '404':
          description: 'An unknown roster id answers 404 {"data": [], "error": "Roster player not found."};
