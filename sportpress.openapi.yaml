          1-12 = that calendar month (October 2025: 39 regular-season games). A non-number is a 422.'
        example: -1
        in: query
        name: month
        required: false
        schema:
          type: integer
      - description: 'Restrict to one phase (verified on the schedule: 179 = Belgian playoffs, 22 games;
          on the rankings: 78 of 179 players).'
        example: 169
        in: query
        name: phase_id
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportpressScheduleClub'
          description: JSON body
        '401':
          description: 'Missing or wrong X-Authorization key: {"errors": [{"code": "401", "message": "Unauthorized"}]}
            (key rotated? re-read it from the bundle).'
        '404':
          description: 'An unknown roster id answers 404 {"data": [], "error": "Roster player not found."};
            other unknown ids answer 200 with an empty `data`.'
        '422':
          description: 'A missing or malformed query parameter (clubs, month): {"message": ..., "errors":
            {...}}.'
      security:
      - ApiKeyAuth: []
      summary: Every game of a season (END year) for the given clubs; month=-1 = the whole season
