components:
  parameters:
    Localization:
      description: Content language. Changes only the site-content text (articles, awards, menus, UI tables)
        and the display names of standings teams; sports payloads are identical. The ?lang= query is ignored.
      in: header
      name: X-Localization
      required: false
      schema:
        default: en
        enum:
        - en
        - fr
        - nl
        type: string
  schemas:
    SportpressClubSeasons:
      description: 'Body of /competition-team/club/seasons: Seasons (END year) in which the given clubs
        (countries) have teams.'
      properties:
        data:
          description: 'Response envelope: the rows are in `data`. An unknown id answers HTTP 200 with
            `{"data": []}` (or a 404 with an `error` text), never a body of another object.'
          items:
            properties:
              season:
                description: Season key = the END year of the season (2026 = 2025-26, 2027 = 2026-27),
                  the sdv convention. The {season} of /phase/season, /schedule/club and /roster/season-players.
                type: integer
            type: object
          type: array
      type: object
    SportpressCompetitionTeams:
      description: 'Body of /competition-team/all: Every competition team of one competition, with staff.'
      properties:
        data:
          description: 'Response envelope: the rows are in `data`. An unknown id answers HTTP 200 with
            `{"data": []}` (or a 404 with an `error` text), never a body of another object.'
          items:
            properties:
              club:
                description: Club = country of the team.
                properties:
                  id:
                    description: 'Club id = the country (key space: sportpress clubs): 1 = Belgium, 2
                      = Netherlands. The clubs[] filter value.'
                    type: integer
                  name:
                    description: 'Country name in English: Belgium or Netherlands.'
                    type: string
                type:
                - object
                - 'null'
              competition:
                description: The competition (one season of the league) the object belongs to.
                properties:
                  created_at:
                    description: Date the record was created in the CMS (YYYY-MM-DD); not a sporting date.
                    type: string
                  id:
                    description: 'Competition id (key space: sportpress competitions; ONE season of the
                      league: 1 = 2021-22, 2 = 2020-21, 3 = 2022-23, 12 = 2023-24, 22 = 2024-25, 24 =
                      2025-26, 25 = 2026-27). The {competitionId} of the standings, ranking, slider and
                      box routes. Not the season number (see `season`).'
                    type: integer
                  logo:
                    description: 'Unobserved: null in every sample. When filled: Competition logo.'
                    x-unobserved: true
                  name:
                    description: Competition name, 'BNXT League 2025-2026'.
                    type: string
                  season:
                    description: Season key = the END year of the season (2026 = 2025-26, 2027 = 2026-27),
                      the sdv convention. The {season} of /phase/season, /schedule/club and /roster/season-players.
                    type: integer
                  simple_team_view:
                    description: CMS display flag for a simplified team page (false on every sampled row);
                      meaning unverified.
                    type: boolean
                  standings_visible:
                    description: Whether the competition shows standings; true on every sampled row.
                    type: boolean
                  summer_season:
                    description: CMS flag for a summer competition; false on every sampled row.
                    type: boolean
                  ticket_url:
                    description: 'Unobserved: null in every sample. When filled: Ticket shop URL for the
                      competition.'
                    x-unobserved: true
                  video_url:
                    description: 'Unobserved: null in every sample. When filled: Streaming URL (https://www.bnxt.tv/browse)
                      on 2022-23 only; null elsewhere.'
                    x-unobserved: true
                  visible:
                    description: Whether the competition is shown on the site; true on every sampled row.
                    type: boolean
                type: object
              competition_id:
                description: 'Competition id (key space: sportpress competitions; ONE season of the league:
                  1 = 2021-22, 2 = 2020-21, 3 = 2022-23, 12 = 2023-24, 22 = 2024-25, 24 = 2025-26, 25
                  = 2026-27). The {competitionId} of the standings, ranking, slider and box routes. Not
                  the season number (see `season`).'
                type: integer
              created_at:
                description: Date the competition-team record was created (YYYY-MM-DD), normally the start
                  of its season.
                type: string
              id:
                description: 'Competition-team id (key space: sportpress competition teams): a team in
                  ONE competition, so the same club has a new id every season (Antwerp = 3 in 2021-22,
                  506 in 2025-26, 541 in 2026-27). Joins competitors, rosters, box scores, film and standings.
                  The stable club key across seasons is `uu_team_id`.'
                type: integer
              name:
                description: 'Display name incl. the sponsor. Teams of the playoff phases carry a '' playoff''
                  suffix (2025-26), and standings names vary with X-Localization (''Partena Professional
                  Okapi Aalst Playoff'' (en) vs ''Okapi Aalst Playoff'' (nl, fr)): never join on it.'
                type: string
              short_name:
                description: Three-letter club code (CHA, OOS, ANT, MON, LIM, ...), stable across seasons
                  in the samples.
                type: string
              staffs:
                description: Team staff assignments (head coach, assistant coaches) of the competition
                  team.
                items:
                  properties:
                    competition_team_id:
                      description: 'Competition-team id (key space: sportpress competition teams): a team
                        in ONE competition, so the same club has a new id every season (Antwerp = 3 in
                        2021-22, 506 in 2025-26, 541 in 2026-27). Joins competitors, rosters, box scores,
                        film and standings. The stable club key across seasons is `uu_team_id`.'
                      type: integer
                    created_at:
                      description: Date the record was created in the CMS (YYYY-MM-DD); not a sporting
                        date.
                      type: string
                    id:
                      description: 'Staff assignment id (key space: sportpress team staff rows).'
                      type: integer
                    staff:
                      description: The staff member.
                      properties:
                        created_at:
                          description: Date the record was created in the CMS (YYYY-MM-DD); not a sporting
                            date.
                          type: string
                        id:
                          description: 'Staff member id (key space: sportpress staff; stable across seasons).'
                          type: integer
                        name:
                          description: Full name, 'First Last' for coaches and 'LAST First' for referees
                            (free text).
                          type: string
                        profile_image:
                          description: Profile photo (CMS media record); null when there is none.
                          properties:
                            alt:
                              description: 'Unobserved: null in every sample. When filled: CMS image alt
                                text.'
                              x-unobserved: true
                            description:
                              description: 'Unobserved: null in every sample. When filled: CMS image description.'
                              x-unobserved: true
                            keywords:
                              description: 'Unobserved: null in every sample. When filled: CMS image keywords.'
                              x-unobserved: true
                            name:
                              description: Media name entered in the CMS (usually the club or person name;
                                free text).
                              type: string
                            public_url:
                              description: Full-size PNG/JPG URL on bnxt.sportpress.info/storage/.
                              type: string
                            thumbnails:
                              description: Resized copies of the image.
                              properties:
                                medium:
                                  description: URL of the medium copy (file name prefixed 'medium-').
                                  type: string
                                small:
                                  description: URL of the small copy (file name prefixed 'small-').
                                  type: string
                              type: object
                          type:
                          - object
                          - 'null'
                        title:
                          description: Staff title (head coach, assistant coach or referee).
                          properties:
                            created_at:
                              description: Date the record was created in the CMS (YYYY-MM-DD); not a
                                sporting date.
                              type: string
                            id:
                              description: 'Staff title id (key space: sportpress staff titles): 1 = Head
                                coach, 2 = Referee; Assistant coach has its own id.'
                              type: integer
                            name:
                              description: 'Title in English: Head coach, Assistant coach or Referee.'
                              type: string
                            priority:
                              description: Sort priority among the titles (1 = first).
                              type: integer
                          type:
                          - object
                          - 'null'
                      type: object
                    title:
                      description: Staff title (head coach, assistant coach or referee).
                      properties:
                        created_at:
                          description: Date the record was created in the CMS (YYYY-MM-DD); not a sporting
                            date.
                          type: string
                        id:
                          description: 'Staff title id (key space: sportpress staff titles): 1 = Head
                            coach, 2 = Referee; Assistant coach has its own id.'
                          type: integer
                        name:
                          description: 'Title in English: Head coach, Assistant coach or Referee.'
                          type: string
                        priority:
                          description: Sort priority among the titles (1 = first).
                          type: integer
                      type: object
                  type: object
                type: array
              statistics:
                description: 'Season averages of the team: an object {average_score_for, average_score_against,
                  field_goal_percent} when filled, an empty array when the team has no statistics yet.'
                items:
                  x-unobserved: true
                type: array
              team_image:
                description: 'Unobserved: null in every sample. When filled: Team photo.'
                x-unobserved: true
              team_logo:
                description: Team logo image (CMS media record).
                properties:
                  alt:
                    description: 'Unobserved: null in every sample. When filled: CMS image alt text.'
                    x-unobserved: true
                  description:
                    description: 'Unobserved: null in every sample. When filled: CMS image description.'
                    x-unobserved: true
                  keywords:
                    description: 'Unobserved: null in every sample. When filled: CMS image keywords.'
                    x-unobserved: true
                  name:
                    description: Media name entered in the CMS (usually the club or person name; free
                      text).
                    type: string
                  public_url:
                    description: Full-size PNG/JPG URL on bnxt.sportpress.info/storage/.
                    type: string
                  thumbnails:
                    description: Resized copies of the image.
                    properties:
                      medium:
                        description: URL of the medium copy (file name prefixed 'medium-').
                        type: string
                      small:
                        description: URL of the small copy (file name prefixed 'small-').
                        type: string
                    type: object
                type:
                - object
                - 'null'
              ticket_url:
                description: Ticket shop URL of the club.
                type:
                - string
                - 'null'
              uu_team_id:
                description: 'Club (franchise) id, stable across seasons (key space: sportpress teams;
                  1 = Spirou, 2 = Oostende, 3 = Antwerp, 4 = Mons, 5 = Limburg in every season). Join
                  key between seasons; `id` is the per-season competition-team id.'
                type: integer
            type: object
          type: array
      type: object
    SportpressGameBox:
      description: 'Body of /boxscore/game/{competitionId}/{gameId}: Box score of one game: both teams,
        player lines and totals.'
      properties:
        data:
          description: One entry per side (two); the order varies, use `is_home`.
          items:
            properties:
              is_home:
                description: 'True for the home side. Values in the full bodies: False, True.'
                type: boolean
              players:
                description: Player lines of the side, in roster order, including players who did not
                  play (minute 0) and a few lines with a null player.
                items:
                  properties:
                    assist:
                      description: Assists in the game.
                      type: integer
                    block:
                      description: Shots blocked in the game.
                      type: integer
                    block_against:
                      description: Own shots blocked by opponents in the game (the team total equals the
                        opponent's `block` in 1,241 of 1,246 team-games).
                      type: integer
                    competition_team_id:
                      description: 'Competition-team id (key space: sportpress competition teams): a team
                        in ONE competition, so the same club has a new id every season (Antwerp = 3 in
                        2021-22, 506 in 2025-26, 541 in 2026-27). Joins competitors, rosters, box scores,
                        film and standings. The stable club key across seasons is `uu_team_id`.'
                      type: integer
                    defensive_foul:
                      description: 'Fouls DRAWN (suffered) in the game, despite the name: a team total
                        is at most the opponent''s `foul` in 1,235 of 1,246 team rows (0-3 below it; 11
                        rows are 1-4 above) and equals the film events 1006 in 55 of 56 team-games.'
                      type: integer
                    defensive_rebound:
                      description: Defensive rebounds in the game.
                      type: integer
                    dunk_all:
                      description: Dunks attempted in the game.
                      type: integer
                    dunk_made:
                      description: Dunks made in the game.
                      type: integer
                    dunk_percent:
                      description: Dunk percentage 0-100, 0 when none attempted.
                      type: integer
                    foul:
                      description: Personal fouls committed in the game.
                      type: integer
                    free_throw_all:
                      description: Free throws attempted in the game.
                      type: integer
                    free_throw_made:
                      description: Free throws made in the game.
                      type: integer
                    free_throw_percent:
                      description: Free-throw percentage 0-100; rounded to 1 decimal in game lines, 2
                        in season means.
                      type: number
                    jersey:
                      description: Shirt number worn in the game (integer in game lines, a string in career
                        averages).
                      type: integer
                    minute:
                      description: Minutes played, whole minutes.
                      type: integer
                    offensive_rebound:
                      description: Offensive rebounds in the game.
                      type: integer
                    player:
                      description: The player (public bio fields).
                      properties:
                        birthdate:
                          description: Date of birth YYYY-MM-DD as shown on the public player page; null
                            when unknown.
                          type:
                          - string
                          - 'null'
                        created_at:
                          description: Date the record was created in the CMS (YYYY-MM-DD); not a sporting
                            date.
                          type: string
                        facebook:
                          description: 'Unobserved: null in every sample. When filled: Facebook handle.'
                          x-unobserved: true
                        first_name:
                          description: Given name.
                          type: string
                        id:
                          description: 'Player id (key space: sportpress persons): stable across seasons
                            and teams, distinct from `roster_id`. Not a Genius or FIBA person id.'
                          type: integer
                        instagram:
                          description: 'Unobserved: null in every sample. When filled: Instagram handle.'
                          x-unobserved: true
                        last_name:
                          description: Family name.
                          type: string
                        nationality_code:
                          description: 'Nationality code in FIBA style (USA, BEL, NED, ...): mostly upper
                            case, but lower-case variants (usa, bel, srb), ''/''-joined dual nationalities
                            (USA/BEL), the empty string and ''HOL'' (Netherlands, 2021-22) occur; normalise
                            before joining.'
                          type: string
                        profile_image:
                          description: Profile photo (CMS media record); null when there is none.
                          properties:
                            alt:
                              description: 'Unobserved: null in every sample. When filled: CMS image alt
                                text.'
                              x-unobserved: true
                            description:
                              description: 'Unobserved: null in every sample. When filled: CMS image description.'
                              x-unobserved: true
                            keywords:
                              description: 'Unobserved: null in every sample. When filled: CMS image keywords.'
                              x-unobserved: true
                            name:
                              description: Media name entered in the CMS (usually the club or person name;
                                free text).
                              type: string
                            public_url:
                              description: Full-size PNG/JPG URL on bnxt.sportpress.info/storage/.
                              type: string
                            thumbnails:
                              description: Resized copies of the image.
                              properties:
                                medium:
                                  description: URL of the medium copy (file name prefixed 'medium-').
                                  type: string
                                small:
                                  description: URL of the small copy (file name prefixed 'small-').
                                  type: string
                              type: object
                          type:
                          - object
                          - 'null'
                        twitter:
                          description: 'Unobserved: null in every sample. When filled: Twitter / X handle.'
                          x-unobserved: true
                      type: object
                    plusminus:
                      description: 'Plus-minus. Player lines: the team''s point difference while he was
                        on court. Team totals: equals own minus opponent points in 1,151 of 1,246 sampled
                        team-games (92%), otherwise different and sometimes fractional (1.6, 9.4), so
                        the type is number.'
                      type: integer
                    points:
                      description: Points in the game (2 x two_point_made + 3 x three_point_made + free_throw_made
                        on all 14,142 box lines of a one-off survey of 623 box scores).
                      type: integer
                    position:
                      description: Playing position of the player on this team.
                      properties:
                        id:
                          description: 'Position id (key space: sportpress positions; 3 = small_forward).'
                          type: integer
                        name:
                          description: 'Position code: point_guard, shooting_guard, small_forward, power_forward,
                            center, and the hybrids point_guard-shooting_guard, shooting_guard-small_forward,
                            small_forward-power_forward, power_forward-center.'
                          type: string
                      type: object
                    roster_id:
                      description: 'Roster id (key space: sportpress roster entries): one player''s entry
                        on one competition team in one season, so a player has a new roster_id for every
                        team and season. Joins box lines, averages and rankings. The person key is `player.id`.
                        Null on a few lines without a player.'
                      type: integer
                    starter:
                      description: True when the player started the game.
                      type: boolean
                    steal:
                      description: Steals in the game.
                      type: integer
                    three_point_all:
                      description: Three-point field goals attempted in the game.
                      type: integer
                    three_point_made:
                      description: Three-point field goals made in the game.
                      type: integer
                    three_point_percent:
                      description: Three-point percentage 0-100; rounded to 1 decimal in game lines, 2
                        in season means.
                      type: number
                    throw_all:
                      description: All field goals (two- plus three-pointers; the provider calls them
                        'throw') attempted in the game (= two_point_all + three_point_all on all 14,142
                        box lines of a one-off survey of 623 box scores).
                      type: integer
                    throw_made:
                      description: All field goals (two- plus three-pointers; the provider calls them
                        'throw') made in the game (= two_point_made + three_point_made on all 14,142 box
                        lines of a one-off survey of 623 box scores).
                      type: integer
                    throw_percent:
                      description: Field-goal percentage 0-100, rounded to 2 decimals.
                      type: number
                    total_rebound:
                      description: Total rebounds in the game (= offensive + defensive on all 14,142 box
                        lines of a one-off survey of 623 box scores).
                      type: integer
                    turnover:
                      description: Turnovers in the game.
                      type: integer
                    two_point_all:
                      description: Two-point field goals attempted in the game.
                      type: integer
                    two_point_made:
                      description: Two-point field goals made in the game.
                      type: integer
                    two_point_percent:
                      description: Two-point percentage 0-100; rounded to 1 decimal in game lines, 2 in
                        season means.
                      type: number
                    value:
                      description: 'Efficiency rating in the game: points + total_rebound + assist + steal
                        + block + defensive_foul (fouls drawn) - missed field goals - missed free throws
                        - turnover, exact on all 14,142 player lines of a one-off survey of 623 box scores
                        (not repeatable with capture.py); block_against and foul do not enter it.'
                      type: integer
                  type: object
                type: array
              team:
                description: The competition team (see `id`).
                properties:
                  club:
                    description: Club = country of the team.
                    properties:
                      id:
                        description: 'Club id = the country (key space: sportpress clubs): 1 = Belgium,
                          2 = Netherlands. The clubs[] filter value.'
                        type: integer
                      name:
                        description: 'Country name in English: Belgium or Netherlands.'
                        type: string
                    type: object
                  created_at:
                    description: Date the competition-team record was created (YYYY-MM-DD), normally the
                      start of its season.
                    type: string
                  id:
                    description: 'Competition-team id (key space: sportpress competition teams): a team
                      in ONE competition, so the same club has a new id every season (Antwerp = 3 in 2021-22,
                      506 in 2025-26, 541 in 2026-27). Joins competitors, rosters, box scores, film and
                      standings. The stable club key across seasons is `uu_team_id`.'
                    type: integer
                  name:
                    description: 'Display name incl. the sponsor. Teams of the playoff phases carry a
                      '' playoff'' suffix (2025-26), and standings names vary with X-Localization (''Partena
                      Professional Okapi Aalst Playoff'' (en) vs ''Okapi Aalst Playoff'' (nl, fr)): never
                      join on it.'
                    type: string
                  short_name:
                    description: Three-letter club code (CHA, OOS, ANT, MON, LIM, ...), stable across
                      seasons in the samples.
                    type: string
                  team_logo:
                    description: Team logo image (CMS media record).
                    properties:
                      alt:
                        description: 'Unobserved: null in every sample. When filled: CMS image alt text.'
                        x-unobserved: true
                      description:
                        description: 'Unobserved: null in every sample. When filled: CMS image description.'
                        x-unobserved: true
                      keywords:
                        description: 'Unobserved: null in every sample. When filled: CMS image keywords.'
                        x-unobserved: true
                      name:
                        description: Media name entered in the CMS (usually the club or person name; free
                          text).
                        type: string
                      public_url:
                        description: Full-size PNG/JPG URL on bnxt.sportpress.info/storage/.
                        type: string
                      thumbnails:
                        description: Resized copies of the image.
                        properties:
                          medium:
                            description: URL of the medium copy (file name prefixed 'medium-').
                            type: string
                          small:
                            description: URL of the small copy (file name prefixed 'small-').
                            type: string
                        type: object
                    type: object
                  ticket_url:
                    description: Ticket shop URL of the club.
                    type: string
                type: object
              total:
                description: Team totals of the side in the game.
                properties:
                  assist:
                    description: Assists by the team in the game.
                    type: integer
                  block:
                    description: Shots blocked by the team in the game.
                    type: integer
                  block_against:
                    description: Own shots blocked by opponents by the team in the game (the team total
                      equals the opponent's `block` in 1,241 of 1,246 team-games).
                    type: integer
                  defensive_foul:
                    description: 'Fouls DRAWN (suffered) by the team in the game, despite the name: a
                      team total is at most the opponent''s `foul` in 1,235 of 1,246 team rows (0-3 below
                      it; 11 rows are 1-4 above) and equals the film events 1006 in 55 of 56 team-games.'
                    type: integer
                  defensive_rebound:
                    description: Defensive rebounds by the team in the game.
                    type: integer
                  dunk_all:
                    description: Dunks attempted by the team in the game.
                    type: integer
                  dunk_made:
                    description: Dunks made by the team in the game.
                    type: integer
                  dunk_percent:
                    description: Dunk percentage 0-100, 0 when none attempted.
                    type: integer
                  foul:
                    description: Personal fouls committed by the team in the game.
                    type: integer
                  free_throw_all:
                    description: Free throws attempted by the team in the game.
                    type: integer
                  free_throw_made:
                    description: Free throws made by the team in the game.
                    type: integer
                  free_throw_percent:
                    description: Free-throw percentage 0-100; rounded to 1 decimal in game lines, 2 in
                      season means.
                    type: number
                  minute:
                    description: 'Team minutes: the sum of the players'' minutes (200 for a regulation
                      game, five players x 40).'
                    type: integer
                  offensive_rebound:
                    description: Offensive rebounds by the team in the game.
                    type: integer
                  plusminus:
                    description: 'Plus-minus. Player lines: the team''s point difference while he was
                      on court. Team totals: equals own minus opponent points in 1,151 of 1,246 sampled
                      team-games (92%), otherwise different and sometimes fractional (1.6, 9.4), so the
                      type is number.'
                    type: integer
                  points:
                    description: Points by the team in the game (2 x two_point_made + 3 x three_point_made
                      + free_throw_made on all 14,142 box lines of a one-off survey of 623 box scores).
                    type: integer
                  starter:
                    description: Number of starters in the box score (5) or true in the per-team game
                      list; the type differs by route.
                    type: integer
                  steal:
                    description: Steals by the team in the game.
                    type: integer
                  three_point_all:
                    description: Three-point field goals attempted by the team in the game.
                    type: integer
                  three_point_made:
                    description: Three-point field goals made by the team in the game.
                    type: integer
                  three_point_percent:
                    description: Three-point percentage 0-100; rounded to 1 decimal in game lines, 2 in
                      season means.
                    type: number
                  throw_all:
                    description: All field goals (two- plus three-pointers; the provider calls them 'throw')
                      attempted by the team in the game (= two_point_all + three_point_all on all 14,142
                      box lines of a one-off survey of 623 box scores).
                    type: integer
                  throw_made:
                    description: All field goals (two- plus three-pointers; the provider calls them 'throw')
                      made by the team in the game (= two_point_made + three_point_made on all 14,142
                      box lines of a one-off survey of 623 box scores).
                    type: integer
                  throw_percent:
                    description: Field-goal percentage 0-100, rounded to 2 decimals.
                    type: number
                  total_rebound:
                    description: Total rebounds by the team in the game (= offensive + defensive on all
                      14,142 box lines of a one-off survey of 623 box scores).
                    type: integer
                  turnover:
                    description: Turnovers by the team in the game.
                    type: integer
                  two_point_all:
                    description: Two-point field goals attempted by the team in the game.
                    type: integer
                  two_point_made:
                    description: Two-point field goals made by the team in the game.
                    type: integer
                  two_point_percent:
                    description: Two-point percentage 0-100; rounded to 1 decimal in game lines, 2 in
                      season means.
                    type: number
                  value:
                    description: 'Efficiency rating by the team in the game: points + total_rebound +
                      assist + steal + block + defensive_foul (fouls drawn) - missed field goals - missed
                      free throws - turnover, exact on all 14,142 player lines of a one-off survey of
                      623 box scores (not repeatable with capture.py); block_against and foul do not enter
                      it.'
                    type: integer
                type: object
            type: object
          type: array
      type: object
    SportpressGameFilm:
      description: 'Body of /film/game/{competitionId}/{gameId}: Play-by-play (''film'') of one game with
        court x/y (2021-22 and 2026-27 only).'
