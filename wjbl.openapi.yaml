    WjblDetail:
      description: 'Game header: both teams with result and score by period.'
      properties:
        away:
          description: Away team (アウェイ) and its score by period.
          properties:
            free_text:
              description: Free-text team label used when the slot has no team (e.g. 'winner of game X');
                empty string in every sample.
              type: string
            score:
              description: Final points.
              type: integer
            score_ot1:
              description: Points scored in the 1st overtime (5 min); null when there was none.
              type:
              - integer
              - 'null'
            score_ot2:
              description: 'Unobserved: null in every sample. When filled: Points in the 2nd overtime;
                null when none.'
              x-unobserved: true
            score_ot3:
              description: 'Unobserved: null in every sample. When filled: Points in the 3rd overtime;
                null when none.'
              x-unobserved: true
            score_ot4:
              description: 'Unobserved: null in every sample. When filled: Points in the 4th overtime;
                null when none. There is no score_ot5+: overtimes 5-10 appear only as play-by-play period
                9-14 and in the /pbp/team-stats and /pbp/player-stats periods maps.'
              x-unobserved: true
            score_p1:
              description: Points scored IN the 1st quarter (not cumulative).
              type: integer
            score_p2:
              description: Points scored in the 2nd quarter.
              type: integer
            score_p3:
              description: Points scored in the 3rd quarter.
              type: integer
            score_p4:
              description: Points scored in the 4th quarter.
              type: integer
            season_team_area:
              description: 'Unobserved: null in every sample, so no type and no meaning is claimed. (By
                the site''s standings JS: 0 = East, 1 = West conference when season_league_flg = 2.)'
