components:
  schemas:
    WjblBoxscore:
      description: 'Box score: per side, the player rows, the team line, the totals line and shooting
        percentages.'
      properties:
        away:
          description: Away side box score.
          properties:
            percentage:
              description: Shooting percentages of the side's total line.
              properties:
                fgp:
                  description: Field-goal percentage (2PT + 3PT), 0-100, one decimal, as a string ('39.3').
                  type: string
                ftp:
                  description: Free-throw percentage, 0-100, one decimal, as a string ('75.0').
                  type: string
                p2p:
                  description: Two-point percentage of the side's TOTAL line, 0-100 with one decimal,
                    as a STRING ('39.5').
                  type: string
                p3p:
                  description: Three-point percentage, 0-100, one decimal, as a string ('39.1').
                  type: string
              type: object
            players:
              description: One row per player who dressed (12 max), in shirt-number order; the sample
                keeps 3.
              items:
                properties:
                  ast:
                    description: Assists. Integer.
                    type: integer
                  blk:
                    description: Blocked shots (made by this player / team). Integer.
                    type: integer
                  def:
                    description: Defensive rebounds. Integer.
                    type: integer
                  f:
                    description: Personal fouls committed. Integer.
                    type: integer
                  fta:
                    description: Free throws attempted. Integer.
                    type: integer
                  ftm:
                    description: Free throws made. Integer.
                    type: integer
                  gs:
                    description: 'Game started: 1 = starter, 0 = bench (integer).'
                    type: integer
                  min:
                    description: Minutes played 'mm:ss' ('22:19'), a string.
                    type: string
                  'off':
                    description: Offensive rebounds. Integer.
                    type: integer
                  p2a:
                    description: Two-point field goals attempted. Integer.
                    type: integer
                  p2m:
                    description: Two-point field goals made. Integer.
                    type: integer
                  p3a:
                    description: Three-point field goals attempted. Integer.
                    type: integer
                  p3m:
                    description: Three-point field goals made. Integer.
                    type: integer
                  player_id:
                    description: 'Player id player_id (key space: W League persons, STABLE across seasons
                      and teams). The player_id of /player and the pi= of the site''s /player/detail?pi=;
                      joins the play-by-play player_id1 / player_id2.'
                    type: integer
                  player_name:
                    description: Player name in Japanese, 'SURNAME GIVEN' with a space (foreign players
                      in katakana).
                    type: string
                  player_number:
                    description: Shirt number, a string.
                    type: string
                  pts:
                    description: Points. Integer.
                    type: integer
                  stl:
                    description: Steals. Integer.
                    type: integer
                  to:
                    description: Turnovers. Integer.
                    type: integer
                  tot:
                    description: Total rebounds (off + def). Integer.
                    type: integer
                type: object
              type: array
            season_team_name:
              description: 'Away team name: Team name as registered for the season, in Japanese (company
                + nickname: ''トヨタ自動車 アンテロープス'' = Toyota Antelopes).'
              type: string
            season_team_short_name:
              description: 'Away team short name: Short team name for that season, Japanese (''トヨタ自動車''
                = Toyota).'
              type: string
            team:
              description: 'Team line (チーム): stats credited to the team, not a player (team rebounds,
                team turnovers); pts and shooting are 0.'
              properties:
                ast:
                  description: Assists. Integer.
                  type: integer
                blk:
                  description: Blocked shots (made by this player / team). Integer.
                  type: integer
                def:
                  description: Defensive rebounds. Integer.
                  type: integer
                f:
                  description: Personal fouls committed. Integer.
                  type: integer
                fta:
                  description: Free throws attempted. Integer.
                  type: integer
                ftm:
                  description: Free throws made. Integer.
                  type: integer
                min:
                  description: Always '00:00' on the team line.
                  type: string
                'off':
                  description: Offensive rebounds. Integer.
                  type: integer
                p2a:
                  description: Two-point field goals attempted. Integer.
                  type: integer
                p2m:
                  description: Two-point field goals made. Integer.
                  type: integer
                p3a:
                  description: Three-point field goals attempted. Integer.
                  type: integer
                p3m:
                  description: Three-point field goals made. Integer.
                  type: integer
                player_id:
                  description: 'Unobserved: null in every sample, so no type and no meaning is claimed.
                    (Null on a team line.)'
                  x-unobserved: true
                pts:
                  description: Points. Integer.
                  type: integer
                stl:
                  description: Steals. Integer.
                  type: integer
                to:
                  description: Turnovers. Integer.
                  type: integer
                tot:
                  description: Total rebounds (off + def). Integer.
                  type: integer
              type: object
            team_id:
              description: 'Away team: Franchise id team_id (key space: W League franchises, STABLE across
                seasons and sponsor renames: 13 = Toyota Antelopes, 12 = Denso Iris, 8 = ENEOS Sunflowers;
                all-star sides have their own ids, e.g. 591). The team_id of /team/roster and of the site''s
                /team/roster/?team_id=. Not season_team_id.'
              type: integer
            team_logo_image:
              description: 'Away team logo: Team logo path, relative to https://www.wjbl.org (''/static/images/base_team/...png''
                or ''/assets/img/team/...png'').'
              type: string
            total:
              description: Side totals (合計) = players + team line.
              properties:
                ast:
                  description: Assists. Integer.
                  type: integer
                blk:
                  description: Blocked shots (made by this player / team). Integer.
                  type: integer
                def:
                  description: Defensive rebounds. Integer.
                  type: integer
                f:
                  description: Personal fouls committed. Integer.
                  type: integer
                fta:
                  description: Free throws attempted. Integer.
                  type: integer
                ftm:
                  description: Free throws made. Integer.
                  type: integer
                min:
                  description: Summed minutes 'mmm:ss' ('200:00' = 5 x 40:00; '225:00' with one 5-minute
                    overtime).
                  type: string
                'off':
                  description: Offensive rebounds. Integer.
                  type: integer
                p2a:
                  description: Two-point field goals attempted. Integer.
                  type: integer
                p2m:
                  description: Two-point field goals made. Integer.
                  type: integer
                p3a:
                  description: Three-point field goals attempted. Integer.
                  type: integer
                p3m:
                  description: Three-point field goals made. Integer.
                  type: integer
                player_id:
                  description: 'Unobserved: null in every sample, so no type and no meaning is claimed.
                    (Null on the totals line.)'
                  x-unobserved: true
                pts:
                  description: Points. Integer.
                  type: integer
                stl:
                  description: Steals. Integer.
                  type: integer
                to:
                  description: Turnovers. Integer.
                  type: integer
                tot:
                  description: Total rebounds (off + def). Integer.
                  type: integer
              type: object
          type: object
        game_status:
          description: 'Game state: ''fixed'' = final (confirmed result), ''scheduled'' = not played yet
            (seen on 26-27 games); the site''s JS also handles ''live'', ''canceled'' and ''delayed''.
            The capture banks only ''fixed'' games.'
          type: string
        home:
