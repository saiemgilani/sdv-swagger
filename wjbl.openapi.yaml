          team_id:
            description: 'Franchise id team_id (key space: W League franchises, STABLE across seasons
              and sponsor renames: 13 = Toyota Antelopes, 12 = Denso Iris, 8 = ENEOS Sunflowers; all-star
              sides have their own ids, e.g. 591). The team_id of /team/roster and of the site''s /team/roster/?team_id=.
              Not season_team_id.'
            type: integer
          team_name:
            description: Franchise name, Japanese or English ('富士通レッドウェーブ' = Fujitsu Red Wave; 'TEAM シリウス'
              = all-star side Team Sirius).
            type: string
        type: object
      type: array
    WjblTeamstats:
      description: Team stat summary of one game by period category.
      properties:
        away_team_id:
          description: 'Away team: Franchise id team_id (key space: W League franchises, STABLE across
            seasons and sponsor renames: 13 = Toyota Antelopes, 12 = Denso Iris, 8 = ENEOS Sunflowers;
            all-star sides have their own ids, e.g. 591). The team_id of /team/roster and of the site''s
            /team/roster/?team_id=. Not season_team_id.'
          type: integer
        away_team_name:
          description: Away team name, Japanese (the play-by-play spelling).
          type: string
        current_period:
          description: 'Last period played (integer): 4 for a regulation game, 5 after one overtime.'
          type: integer
        home_team_id:
          description: 'Home team: Franchise id team_id (key space: W League franchises, STABLE across
            seasons and sponsor renames: 13 = Toyota Antelopes, 12 = Denso Iris, 8 = ENEOS Sunflowers;
            all-star sides have their own ids, e.g. 591). The team_id of /team/roster and of the site''s
            /team/roster/?team_id=. Not season_team_id.'
          type: integer
        home_team_name:
          description: Home team name, Japanese (the play-by-play spelling).
          type: string
        max_period:
          description: 'Regulation periods (integer): 4 on every sample, overtime games included.'
          type: integer
        periods:
          additionalProperties:
            description: One period category (map key = the category as a string).
            properties:
              away_assist:
                description: Away assists (integer).
                type: integer
              away_ftr:
                description: Away free-throw percentage, 0-100, number (0 when no attempts).
                type: number
              away_max_difference:
                description: Away team's largest lead in the period, points (integer).
                type: integer
              away_pt2r:
                description: Away two-point percentage, 0-100, number.
                type: number
              away_pt3r:
                description: Away three-point percentage, 0-100, number.
                type: number
              away_ptr:
                description: Away field-goal percentage (2PT + 3PT) in the period, 0-100, a NUMBER with
                  up to one decimal (61.5; whole values come as integers).
                type: number
              away_rebound:
                description: Away rebounds 'offensive-defensive-total' ('3-4-7'), a string.
                type: string
              away_trun_over:
                description: Away turnovers with the Japanese counter 本 ('6本' = 6), a string. Key name
                  sic ('trun').
                type: string
              home_assist:
                description: Home assists (integer).
                type: integer
              home_ftr:
                description: Home free-throw percentage, 0-100, number (0 when no attempts).
                type: number
              home_max_differenct:
                description: Home team's largest lead in the period, points (integer). Key name sic ('differenct';
                  the away key is spelled correctly).
                type: integer
              home_pt2r:
                description: Home two-point percentage, 0-100, number.
                type: number
              home_pt3r:
                description: Home three-point percentage, 0-100, number.
                type: number
              home_ptr:
                description: Home field-goal percentage (2PT + 3PT) in the period, 0-100, a NUMBER with
                  up to one decimal (61.5; whole values come as integers).
                type: number
              home_rebound:
                description: Home rebounds 'offensive-defensive-total' ('3-4-7'), a string.
                type: string
              home_trun_over:
                description: Home turnovers with the Japanese counter 本 ('6本' = 6), a string. Key name
                  sic ('trun').
                type: string
              lead_count:
                description: Lead changes with the counter 回 ('0回' = 0 times), a string.
                type: string
              period_category:
                description: The period category again, as an integer (see periods).
                type: integer
              tie_count:
                description: Times the score was tied, with the counter 回 ('4回'), a string.
                type: string
            type: object
          description: 'Stats by period, an object keyed by period category (string keys): ''1''-''4''
            = quarters, ''5''-''14'' = overtime 1-10, ''15'' = first half, ''16'' = second half, ''17''
            = all overtime, ''18'' = whole game (15/16/18 verified by summing the quarters on 7987; 17
            equals period 5 on the one-overtime game 7360). Kept whole in the samples.'
          type: object
        play_schedule_id:
          description: 'Game id play_schedule_id (key space: W League games, ONE global sequence across
            every league_id and season, e.g. 4243 = 2013-14 final, 7987 = 2025-26 final). The play_schedule_id
            parameter of every game route and of the site''s /schedule_result/detail/*?play_schedule_id=
            pages.'
          type: integer
      type: object
info:
  description: JSON backend of www.wjbl.org, the Women's Japan Basketball League (Wリーグ). Keyless, no headers.
    Schedules by competition edition (league_id) and month, game header, box score (2013-14 onward at
    least), Japanese play-by-play and period summaries (2018-19 onward), standings grids and tables, rosters
    and player profiles. Seasons are keyed by league_id with a title such as '25-26 Wリーグ' (sdv END year
    2026). Every answer is HTTP 200, errors included. Texts are Japanese (translated in the descriptions).
    Site terms (/kiyaku/) forbid reproducing site content without permission (copyright). Shapes from
    captures of 2026-10-12; x-unobserved = null in every sample. Not official or supported.
  title: W League (Japan women's basketball) API (api.wjbl.01core.app)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /boxscore:
    get:
      description: 'Box score: per-player, team and total lines plus shooting percentages per side. Each
        side has players[], a team line (team rebounds/turnovers) and total = players + team. Percentages
        are strings; counts are integers; min is ''mm:ss''. Served back to 2013-14 at least (game 4243).'
      operationId: get_wjbl_boxscore
      parameters:
      - description: 'Game id play_schedule_id (key space: W League games, ONE global sequence across
          every league_id and season, e.g. 4243 = 2013-14 final, 7987 = 2025-26 final). The play_schedule_id
          parameter of every game route and of the site''s /schedule_result/detail/*?play_schedule_id=
          pages. Unknown id -> 200 with []; missing -> 200 {error: {error_code: E003}}.'
        example: 7987
        in: query
        name: play_schedule_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WjblBoxscore'
          description: 'Data. Errors are ALSO HTTP 200: an unknown id answers [] and a bad or missing
            parameter answers WjblError ({error: {error_code, error_message}}).'
          x-error-schema:
            $ref: '#/components/schemas/WjblError'
      security: []
      summary: 'Box score: per-player, team and total lines plus shooting percentages per side'
  /leagues:
    get:
      description: 'Competitions (league_id) with a schedule: every W League season, all-star game, cup
        and camp. No echo of target, so the body cannot be scope-checked (UNSCOPED). league_title strings:
        ''25-26 Wリーグ'' -> sdv END year 2026; non-league editions (all-star, cup, camp) carry no season
        key.'
      operationId: get_wjbl_leagues
      parameters:
      - description: Purpose filter. 'play_schedule' = competitions with a schedule (all 37); the site's
          leaders page uses official_flg=1&target=player_ranking (league seasons only).
        example: play_schedule
        in: query
        name: target
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WjblLeagues'
          description: 'Data. Errors are ALSO HTTP 200: an unknown id answers [] and a bad or missing
            parameter answers WjblError ({error: {error_code, error_message}}).'
          x-error-schema:
            $ref: '#/components/schemas/WjblError'
      security: []
      summary: 'Competitions (league_id) with a schedule: every W League season, all-star game, cup and
        camp'
  /pbp/play-by-play:
    get:
      description: 'Play-by-play (2018-19 onward), chronological, Japanese action vocabulary. 2018-19
        onward; earlier games answer [] (pbp_flg 0). All text is Japanese; see action1 for the glossary.
        No shot coordinates. Substitution rows carry two players: player_id1 out, player_id2 in.'
      operationId: get_wjbl_pbp
      parameters:
      - description: 'Game id play_schedule_id (key space: W League games, ONE global sequence across
          every league_id and season, e.g. 4243 = 2013-14 final, 7987 = 2025-26 final). The play_schedule_id
          parameter of every game route and of the site''s /schedule_result/detail/*?play_schedule_id=
          pages. Unknown id -> 200 with []; missing -> 200 {error: {error_code: E003}}.'
        example: 7987
        in: query
        name: play_schedule_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WjblPbp'
          description: 'Data. Errors are ALSO HTTP 200: an unknown id answers [] and a bad or missing
            parameter answers WjblError ({error: {error_code, error_message}}).'
          x-error-schema:
            $ref: '#/components/schemas/WjblError'
      security: []
      summary: Play-by-play (2018-19 onward), chronological, Japanese action vocabulary
  /pbp/player-stats:
    get:
      description: Per-team leaders (points, assists, rebounds) per period, half and game (2018-19 onward).
        Leaders are display strings '#NUMBER NAME' with values '5点' / '2本' / 'o-d-t'; ties are ' , '-joined.
        The category key is periodCategory here, period_category on /pbp/team-stats.
      operationId: get_wjbl_playerstats
      parameters:
      - description: 'Game id play_schedule_id (key space: W League games, ONE global sequence across
          every league_id and season, e.g. 4243 = 2013-14 final, 7987 = 2025-26 final). The play_schedule_id
          parameter of every game route and of the site''s /schedule_result/detail/*?play_schedule_id=
          pages. Unknown id -> 200 with []; missing -> 200 {error: {error_code: E003}}.'
        example: 7987
        in: query
        name: play_schedule_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WjblPlayerstats'
          description: 'Data. Errors are ALSO HTTP 200: an unknown id answers [] and a bad or missing
            parameter answers WjblError ({error: {error_code, error_message}}).'
          x-error-schema:
            $ref: '#/components/schemas/WjblError'
      security: []
      summary: Per-team leaders (points, assists, rebounds) per period, half and game (2018-19 onward)
  /pbp/team-stats:
    get:
      description: 'Team stat summary per period, half and game (2018-19 onward). periods is keyed by
        category: 1-4 quarters, 5-14 OT, 15/16 halves, 17 all OT, 18 game. Percentages are numbers, counts
        carry Japanese counters (本, 回) as strings; two key names are misspelt (trun_over, max_differenct).'
      operationId: get_wjbl_teamstats
      parameters:
      - description: 'Game id play_schedule_id (key space: W League games, ONE global sequence across
          every league_id and season, e.g. 4243 = 2013-14 final, 7987 = 2025-26 final). The play_schedule_id
          parameter of every game route and of the site''s /schedule_result/detail/*?play_schedule_id=
          pages. Unknown id -> 200 with []; missing -> 200 {error: {error_code: E003}}.'
        example: 7987
        in: query
        name: play_schedule_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WjblTeamstats'
          description: 'Data. Errors are ALSO HTTP 200: an unknown id answers [] and a bad or missing
            parameter answers WjblError ({error: {error_code, error_message}}).'
          x-error-schema:
            $ref: '#/components/schemas/WjblError'
      security: []
      summary: Team stat summary per period, half and game (2018-19 onward)
  /play-schedule:
    get:
      description: 'Game information: venue, times, referees, broadcast links, Japanese game report. Free-text
        fields carry HTML and CRLF; the officials sit in referee_name / sub_referee_name1/2 from the late
        2010s and only in comment before. contact is redacted in the samples.'
      operationId: get_wjbl_game
      parameters:
      - description: 'Game id play_schedule_id (key space: W League games, ONE global sequence across
          every league_id and season, e.g. 4243 = 2013-14 final, 7987 = 2025-26 final). The play_schedule_id
          parameter of every game route and of the site''s /schedule_result/detail/*?play_schedule_id=
          pages. Unknown id -> 200 with []; missing -> 200 {error: {error_code: E003}}.'
        example: 7987
        in: query
        name: play_schedule_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WjblGame'
          description: 'Data. Errors are ALSO HTTP 200: an unknown id answers [] and a bad or missing
            parameter answers WjblError ({error: {error_code, error_message}}).'
          x-error-schema:
            $ref: '#/components/schemas/WjblError'
      security: []
      summary: 'Game information: venue, times, referees, broadcast links, Japanese game report'
  /play-schedule-months:
    get:
      description: 'Months (game_month) that have games in a league_id. league_id is echoed as a STRING
        here and as an integer everywhere else. An unknown league_id answers {league_id, game_months:
        []} (refused).'
      operationId: get_wjbl_months
      parameters:
      - description: 'Competition edition: Competition-edition id league_id (key space: W League competitions;
          sequential, ONE id per season of the league AND per all-star game, cup or camp: 45 = ''25-26
          Wリーグ'', 47 = ''26-27'', 20 = ''13-14'', 46 = All-Star 2025-26). The league_id parameter of /play-schedules
          and /play-schedule-months; enumerate with /leagues. The sdv season is the END year of league_title
          (END = 2000 + the second YY: ''25-26'' -> 2026, ''99-00'' -> 2000). Not a number -> error E003.
          Omitted on /play-schedules: the newest league_id.'
        example: 45
        in: query
        name: league_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WjblMonths'
          description: 'Data. Errors are ALSO HTTP 200: an unknown id answers [] and a bad or missing
            parameter answers WjblError ({error: {error_code, error_message}}).'
          x-error-schema:
            $ref: '#/components/schemas/WjblError'
      security: []
      summary: Months (game_month) that have games in a league_id
  /play-schedule/detail:
    get:
      description: 'Game header: both teams and the score by period. score_p1..p4 are per-quarter, not
        cumulative; score_ot1-4 null when unused. Only four overtimes have score columns; overtimes 5+
        are only in the /pbp/* routes (period 9-14 and the periods maps).'
      operationId: get_wjbl_detail
      parameters:
      - description: 'Game id play_schedule_id (key space: W League games, ONE global sequence across
          every league_id and season, e.g. 4243 = 2013-14 final, 7987 = 2025-26 final). The play_schedule_id
          parameter of every game route and of the site''s /schedule_result/detail/*?play_schedule_id=
          pages. Unknown id -> 200 with []; missing -> 200 {error: {error_code: E003}}.'
        example: 7987
        in: query
        name: play_schedule_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WjblDetail'
          description: 'Data. Errors are ALSO HTTP 200: an unknown id answers [] and a bad or missing
            parameter answers WjblError ({error: {error_code, error_message}}).'
          x-error-schema:
            $ref: '#/components/schemas/WjblError'
      security: []
      summary: 'Game header: both teams and the score by period'
  /play-schedules:
    get:
      description: 'Games of a league_id in ONE month (game_month; default = the league''s latest month).
        ONE month per request: without game_month only the latest month comes back. Enumerate months with
        /play-schedule-months. Games are grouped under seasons keyed by season_id; a month can span two
        phases (regular season Premier + Future). Dates are split: game_year ''YYYY'' + game_date ''MM.DD'';
        times are JST strings. box_flg is 1 even on unplayed games; pbp_flg is 1 from 2018-19.'
      operationId: get_wjbl_schedules
      parameters:
      - description: 'Competition edition: Competition-edition id league_id (key space: W League competitions;
          sequential, ONE id per season of the league AND per all-star game, cup or camp: 45 = ''25-26
          Wリーグ'', 47 = ''26-27'', 20 = ''13-14'', 46 = All-Star 2025-26). The league_id parameter of /play-schedules
          and /play-schedule-months; enumerate with /leagues. The sdv season is the END year of league_title
          (END = 2000 + the second YY: ''25-26'' -> 2026, ''99-00'' -> 2000). Not a number -> error E003.
          Omitted on /play-schedules: the newest league_id.'
        example: 45
        in: query
        name: league_id
        required: false
        schema:
          type: integer
      - description: 'Month ''YYYY-MM'' from /play-schedule-months. OMITTED = the league''s LATEST month
          only (not the whole season): page through every month to get all games.'
        example: 2026-04
        in: query
        name: game_month
        required: false
        schema:
          type: string
      - description: 'Only games involving this team (home or away): Franchise id team_id (key space:
          W League franchises, STABLE across seasons and sponsor renames: 13 = Toyota Antelopes, 12 =
          Denso Iris, 8 = ENEOS Sunflowers; all-star sides have their own ids, e.g. 591). The team_id
          of /team/roster and of the site''s /team/roster/?team_id=. Not season_team_id.'
        example: 13
        in: query
        name: team_id
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WjblSchedules'
          description: 'Data. Errors are ALSO HTTP 200: an unknown id answers [] and a bad or missing
            parameter answers WjblError ({error: {error_code, error_message}}).'
          x-error-schema:
            $ref: '#/components/schemas/WjblError'
      security: []
      summary: Games of a league_id in ONE month (game_month; default = the league's latest month)
  /player:
    get:
      description: Player profile (current team, bio, career notes). player_blood is redacted in the sample;
        player_birthday is the public bio date.
      operationId: get_wjbl_player
      parameters:
      - description: 'Player id player_id (key space: W League persons, STABLE across seasons and teams).
          The player_id of /player and the pi= of the site''s /player/detail?pi=; joins the play-by-play
          player_id1 / player_id2. Unknown id -> 200 with [].'
        example: 9799
        in: query
        name: player_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WjblPlayer'
          description: 'Data. Errors are ALSO HTTP 200: an unknown id answers [] and a bad or missing
            parameter answers WjblError ({error: {error_code, error_message}}).'
          x-error-schema:
            $ref: '#/components/schemas/WjblError'
      security: []
      summary: Player profile (current team, bio, career notes)
  /seasons/standings:
    get:
      description: Every season phase (season_id) with its standings flags. No parameters and no echo
        (UNSCOPED). 70 groups back to 1999-2000.
      operationId: get_wjbl_standings_seasons
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WjblStandingsSeasons'
          description: 'Data. Errors are ALSO HTTP 200: an unknown id answers [] and a bad or missing
            parameter answers WjblError ({error: {error_code, error_message}}).'
          x-error-schema:
            $ref: '#/components/schemas/WjblError'
      security: []
      summary: Every season phase (season_id) with its standings flags
  /team-ranking:
    get:
      description: League table with team averages of one or more season_ids. Averages are strings; fg
        has a '%' sign, winning_rate is a 0-1 fraction, gpd a season total.
      operationId: get_wjbl_ranking
      parameters:
      - description: Comma-separated season_ids (kept unencoded). Omitted = the current phases (26-27
          on 2026-10-12).
        example: 169,170
        in: query
        name: season_ids
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WjblRanking'
          description: 'Data. Errors are ALSO HTTP 200: an unknown id answers [] and a bad or missing
            parameter answers WjblError ({error: {error_code, error_message}}).'
          x-error-schema:
            $ref: '#/components/schemas/WjblError'
      security: []
      summary: League table with team averages of one or more season_ids
  /team-standings:
    get:
      description: 'Head-to-head results grid (hoshitori-hyo) of one or more season_ids. Maps keyed by
        rank, not team: re-key on team_id. scores win/losg are the row team''s and the opponent''s points,
        strings.'
      operationId: get_wjbl_standings
      parameters:
      - description: Comma-separated season_ids (kept unencoded). Omitted = the current phases (26-27
          on 2026-10-12).
        example: 169,170
        in: query
        name: season_ids
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WjblStandings'
          description: 'Data. Errors are ALSO HTTP 200: an unknown id answers [] and a bad or missing
            parameter answers WjblError ({error: {error_code, error_message}}).'
          x-error-schema:
            $ref: '#/components/schemas/WjblError'
      security: []
      summary: Head-to-head results grid (hoshitori-hyo) of one or more season_ids
  /team/roster:
    get:
      description: 'Roster of a team in a season phase: players, head coach, staff. Head coach is in coach_*;
        staffs[] holds the rest (names and roles only).'
      operationId: get_wjbl_roster
      parameters:
      - description: 'Team: Franchise id team_id (key space: W League franchises, STABLE across seasons
          and sponsor renames: 13 = Toyota Antelopes, 12 = Denso Iris, 8 = ENEOS Sunflowers; all-star
          sides have their own ids, e.g. 591). The team_id of /team/roster and of the site''s /team/roster/?team_id=.
          Not season_team_id.'
        example: 13
        in: query
        name: team_id
        required: true
        schema:
          type: integer
      - description: 'Season phase: Season-phase id season_id (key space: phases WITHIN a league_id, e.g.
          169 = 25-26 regular season Premier, 170 = 25-26 regular season Future, 176 = 25-26 playoff final).
          Not a year: one league_id has several season_ids. The season_ids parameter of /team-standings
          and /team-ranking and the season_id of /team/roster. Omitted = the team''s current phase.'
        example: 169
        in: query
        name: season_id
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WjblRoster'
          description: 'Data. Errors are ALSO HTTP 200: an unknown id answers [] and a bad or missing
            parameter answers WjblError ({error: {error_code, error_message}}).'
          x-error-schema:
            $ref: '#/components/schemas/WjblError'
      security: []
      summary: 'Roster of a team in a season phase: players, head coach, staff'
  /teams/base:
    get:
      description: Every franchise (team_id) the site knows, all-star sides included. No parameters and
        no echo (UNSCOPED); all 69 rows in one answer (no paging).
      operationId: get_wjbl_teams
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WjblTeams'
          description: 'Data. Errors are ALSO HTTP 200: an unknown id answers [] and a bad or missing
            parameter answers WjblError ({error: {error_code, error_message}}).'
          x-error-schema:
            $ref: '#/components/schemas/WjblError'
      security: []
      summary: Every franchise (team_id) the site knows, all-star sides included
servers:
- url: https://api.wjbl.01core.app/api
