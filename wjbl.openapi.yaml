                + nickname: ''トヨタ自動車 アンテロープス'' = Toyota Antelopes).'
              type: string
            season_team_short_name:
              description: 'Away team short name: Short team name for that season, Japanese (''トヨタ自動車''
                = Toyota).'
              type: string
            team_entry_flg:
              description: 'Official-league participant flag (公式戦参加フラグ): 1 = a W League member team (the
                site links its roster), 0 = not (guest or all-star side). Integer.'
              type: integer
            team_id:
              description: 'Away team: Franchise id team_id (key space: W League franchises, STABLE across
