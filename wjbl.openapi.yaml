              type: string
          type: object
        box_flg:
          description: Box-score flag (integer). 1 on every sampled game, scheduled ones included, so
            it does NOT prove a box score exists.
          type: integer
        bs_url:
          description: Satellite-TV (BS) broadcast URL; empty string in every sample.
          type: string
        cancel_flg:
          description: 'Cancelled flag: 1 = cancelled, 0 = not.'
          type: integer
        comment:
          description: 'Officials block, Japanese free text: ''クルーチーフ：'' crew chief, ''ファーストアンパイア：'' first
            umpire, ''セカンドアンパイア：'' second umpire, 2013-14 ''主審'' referee / ''副審'' umpires / ''コミッショナー''
            commissioner; CRLF or <br> separated.'
          type: string
        contact:
          description: Organiser contact (phone numbers, e-mail, ticket outlets; Japanese, may hold HTML).
            REDACTED by the capture to '[redacted]'.
          type: string
        contact_url:
          description: Contact URL; empty string in every sample (the capture redacts any filled key naming
            a contact).
          type: string
        cs_url:
          description: Cable/satellite (CS) broadcast URL; empty string in every sample.
          type: string
        delay_flg:
          description: 'Postponed flag: 1 = postponed, 0 = not.'
          type: integer
        event_info:
          description: Event-day information (gate times, food, shoes, tip-off), Japanese free text with
            CRLF line breaks.
          type: string
        game_date:
          description: Game date in Japanese, 'YYYY年M月D日(曜)' ('2026年4月4日(土)' = Saturday 4 April 2026).
          type: string
        game_icon:
          description: 'Icon code shown next to the game: 0 = none, 1 = home-game icon (home.svg), 2 =
            neutral-site icon (neutral.svg).'
          type: integer
        game_start_time:
          description: Scheduled tip-off 'HH:MM', Japan time (JST, UTC+9).
          type: string
        game_status:
          description: 'Game state: ''fixed'' = final (confirmed result), ''scheduled'' = not played yet
            (seen on 26-27 games); the site''s JS also handles ''live'', ''canceled'' and ''delayed''.
            The capture banks only ''fixed'' games.'
          type: string
        ground_url:
          description: Terrestrial-TV broadcast URL; empty string in every sample.
          type: string
        home:
