    WjblPbp:
      description: Play-by-play of one game, chronological.
      properties:
        current_period:
          description: 'Last period played (integer): 4 for a regulation game, 5 after one overtime.'
          type: integer
        game_status:
          description: 'Game state: ''fixed'' = final (confirmed result), ''scheduled'' = not played yet
            (seen on 26-27 games); the site''s JS also handles ''live'', ''canceled'' and ''delayed''.
            The capture banks only ''fixed'' games.'
          type: string
        max_period:
          description: 'Regulation periods (integer): 4 on every sample, overtime games included.'
          type: integer
        play_by_plays:
          description: Every play, CHRONOLOGICAL (no ascending); 400-450 per game. The sample keeps 3.
          items:
            properties:
              action1:
                description: 'Action in Japanese (vocabulary of 8 full games, 2018-19 to 2025-26): ''プレイヤーイン''
                  = player in (the starting five at the start of the game), ''プレイヤーインアウト'' = substitution
                  (player_id1 OUT, player_id2 IN), ''2Pシュート アウトサイドペイント○'' / ''×'' = two-point shot outside
                  the paint made / missed (''インサイドペイント'' inside-the-paint is not in the sample games),
                  ''3Pシュート○'' / ''×'' = three-point shot made / missed, ''フリースロー○'' / ''×'' = free throw
                  made / missed, ''アシスト'' = assist, ''オフェンスリバウンド'' = offensive rebound, ''ディフェンスリバウンド''
                  = defensive rebound, ''チームオフェンスリバウンド'' / ''チームディフェンスリバウンド'' = team offensive / defensive
                  rebound, ''スティール'' = steal, ''ブロックショット'' = blocked shot, ''ターンオーバー'' = turnover, ''チームターンオーバー''
                  = team turnover, ''パーソナルファウル'' = personal foul, ''オフェンスファウル'' = offensive foul, ''アンスポーツマンファウル''
                  = unsportsmanlike foul, ''タイムアウト'' = timeout, ''クォーターエンド'' = end of period (quarter
                  or overtime), ''試合終了'' = end of game. ○ = made, × = missed.'
                type: string
              action2:
                description: 'Sub-action in Japanese: ''ジャンプショット'' = jump shot (on field-goal attempts),
                  ''フリースローオンファウルN'' = free throws awarded on this foul, N = 0-3; '''' otherwise.'
                type: string
              action3:
                description: 'Second qualifier in Japanese: ''シュートファウル'' = shooting foul; '''' otherwise.'
                type: string
              end_game_flg:
                description: 'End-of-game flag: 1 on the final ''試合終了'' line only (the site skips that
                  row), else 0.'
                type: integer
              end_period_flg:
                description: End-of-period flag (integer); 0 on every observed row, the period end is
                  the 'クォーターエンド' action instead.
                type: integer
              home_away:
                description: 'Side of the acting team: 1 = home, 2 = away; null on period/game-end lines.'
                type:
                - integer
                - 'null'
              'no':
                description: 'Play sequence number, ascending, 1 = first; numbers can skip (deleted plays:
                  443 numbers for 439 rows on 7987).'
                type: integer
              period:
                description: 'Period: 1-4 = quarters, 5-14 = overtime 1-10 (the site''s tab map). Integer.'
                type: integer
              play_text:
                description: 'Display text in Japanese: ''#11 岡本 2Pシュート○(2点)''. Bracketed running counts:
                  shots ''(N点)'' = the player''s points so far, assists/steals/blocks/turnovers ''(N本)''
                  = count so far, rebounds ''(o-d-t)'' = the player''s offensive-defensive-total so far,
                  fouls ''(a-b:c)'' = a the player''s personal fouls, b the team''s fouls in the period,
                  c free throws awarded (verified on 7987), substitution ''#15 A → #7 B'' = A out, B in.
                  Empty on period and game-end lines.'
                type: string
              player_id1:
                description: 'First actor (the player going OUT on a substitution): Player id (key space:
                  W League persons, STABLE across seasons and teams). Joins /boxscore home/away.players[].player_id
                  and the player_id of /player (the pi= of the site''s /player/detail?pi=). Null on team
                  and period lines.'
                type:
                - integer
                - 'null'
              player_id2:
                description: 'Second actor, filled on substitutions only (the player coming IN; verified
                  89/89 on game 7987): Player id (key space: W League persons, STABLE across seasons and
                  teams). Joins /boxscore home/away.players[].player_id and the player_id of /player (the
                  pi= of the site''s /player/detail?pi=). Null otherwise.'
                type:
                - integer
                - 'null'
              player_name1:
                description: Name of the first actor, Japanese; '' on team and period lines.
                type: string
              player_name2:
                description: Name of the second actor (substitution in), Japanese; '' otherwise.
                type: string
              player_number1:
                description: Shirt number of the first actor (the player going OUT on a substitution),
                  a string; '' on team and period lines.
                type: string
              player_number2:
                description: Shirt number of the second actor (the player coming IN on a substitution),
                  a string; '' otherwise.
                type: string
              rest_time:
                description: Game clock REMAINING in the period, 'm:ss' without a leading zero ('9:38';
                  '10:00' at the start, 5:00 in overtime).
                type: string
              score:
                description: Score 'HOME-AWAY' after the play ('4-3'); filled on scoring plays and period/game-end
                  lines, '' otherwise.
                type: string
              team_id:
                description: 'Acting team: Franchise id team_id (key space: W League franchises, STABLE
                  across seasons and sponsor renames: 13 = Toyota Antelopes, 12 = Denso Iris, 8 = ENEOS
                  Sunflowers; all-star sides have their own ids, e.g. 591). The team_id of /team/roster
                  and of the site''s /team/roster/?team_id=. Not season_team_id. Null on period/game-end
                  lines.'
                type:
                - integer
                - 'null'
              team_name:
                description: Acting team name, Japanese (may contain a full-width space and differ from
                  the box score's spelling); empty on period/game-end lines.
                type: string
            type: object
          type: array
        play_schedule_id:
          description: 'Game id play_schedule_id (key space: W League games, ONE global sequence across
            every league_id and season, e.g. 4243 = 2013-14 final, 7987 = 2025-26 final). The play_schedule_id
            parameter of every game route and of the site''s /schedule_result/detail/*?play_schedule_id=
            pages.'
          type: integer
      type: object
