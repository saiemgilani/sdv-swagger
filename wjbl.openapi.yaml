    WjblError:
      description: Body of a bad or missing parameter, still HTTP 200.
      properties:
        error:
          description: Error object.
          properties:
            error_code:
              description: Error code ('E003' = invalid parameter).
              type: string
            error_message:
              description: 'Message in Japanese, ''パラメータに誤りがあります。：<param>'' = ''the parameter is invalid:
                <param>''.'
              type: string
          type: object
      type: object
    WjblGame:
      description: 'Game information: competition, venue, times, referees, broadcast links, Japanese free
        text.'
      properties:
        allow_shoes_on:
          description: 'Outdoor shoes allowed in the arena (土足): 1 = not stated, 2 = yes (◯), 3 or 4 =
            no (×). Integer.'
          type: integer
        allow_shoes_on_others:
          description: Extra note on outdoor shoes; empty string in every sample.
          type: string
