info:
  description: 'Routes per thesportsdb.com/documentation; shapes from committed captures in thesportsdb/captures/
    taken 2026-10-06 with the free test key 3 (30 requests per minute, watermarked artwork; a Patreon
    key lifts the limits and unlocks more routes). Every parameter is a query parameter; a bad or missing
    id answers 200 with {"<key>": null} or a message string. Not official or supported.'
  title: TheSportsDB API v1 (www.thesportsdb.com)
  version: v1
openapi: 3.1.0
paths:
  /all_leagues.php:
    get:
      operationId: all_leagues
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllLeagues'
          description: OK
      summary: All leagues
  /all_sports.php:
    get:
      operationId: all_sports
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllSports'
          description: OK
      summary: All sports
  /eventsnextleague.php:
    get:
      operationId: eventsnextleague
      parameters:
      - description: League id (idLeague from /all_leagues.php).
        example: '4328'
        in: query
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eventsnextleague'
          description: OK
      summary: Next 15 events of a league
  /eventsseason.php:
    get:
      operationId: eventsseason
      parameters:
      - description: League id (idLeague from /all_leagues.php).
        example: '4328'
        in: query
        name: id
        required: true
        schema:
