      - description: 'hokej.cz game id (scoreboard `hokejcz_id`), not the onlajny game id (`onlajny_id`).
          The bucket also holds other competitions'' games, so an id alone does not tell the league. Examples:
          2928321 (2026-27), 2508598 (2016-17).'
