info:
  description: 'Keyless JSON behind hokej.cz for the Czech Tipsport Extraliga (ELH): the public, listable
    S3 bucket `hokej.cz` (play-by-play, shots with coordinates, per-minute shot counts) and the json.esports.cz
    scoreboard (the hokejcz_id <-> onlajny_id map). ID TRAP: play-by-play uses onlajny ids (player `id`
    and `global_id` differ), shots use hokej.cz ids; see hokejcz-returns.md. Shapes from committed captures
    (2026-10-12; one completed 2026-27 game, one 2016-17 game) in hokejcz/captures/. Season key = START
    year. Not official or supported.'
  title: hokej.cz S3 bucket + eSports Media scoreboard (Czech Tipsport Extraliga)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /:
    get:
      description: 'Whole bucket; this sample is one page. Captured for: 2026-27.'
      operationId: list_objects
      parameters:
      - description: Key prefix, e.g. `match/2026/full/` or `visualization/shots/`.
        example: match/2026/full/
        in: query
        name: prefix
        required: false
        schema:
          type: string
      - description: '`/` groups keys below the next slash into CommonPrefixes (folder view).'
        in: query
        name: delimiter
        required: false
        schema:
          type: string
      - description: 'ListObjects V1 paging: the last `Key` of the previous page; repeat until `IsTruncated`
          is false (V1 sends `NextMarker` only with a delimiter).'
        in: query
        name: marker
        required: false
        schema:
          type: string
      - description: Page size, at most 1000 (the default).
        example: '3'
        in: query
        name: max-keys
        required: false
        schema:
          type: string
      - description: '`2` switches to ListObjectsV2 (`KeyCount`, `NextContinuationToken`); omitted = V1
          as documented here.'
        in: query
        name: list-type
        required: false
        schema:
          type: string
      - description: 'V2 only (`list-type=2`): `NextContinuationToken` of the previous page.'
        in: query
        name: continuation-token
        required: false
        schema:
          type: string
      - description: 'V2 only (`list-type=2`): list keys after this key.'
        in: query
        name: start-after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ListBucketResult'
          description: OK
        '404':
          description: S3 error XML.
      summary: List keys (S3 ListObjects V1 XML)
      x-pagination:
        request: marker = the last Contents[].Key of the previous page (V1); at most 1000 keys per page.
          The capture holds the first page only (max-keys=3).
        response:
        - IsTruncated
        - Contents[].Key
    servers:
    - description: Public, anonymously listable S3 bucket behind hokej.cz (eSports Media data).
      url: https://s3-eu-west-1.amazonaws.com/hokej.cz
  /match/{season}/full/{match_id}.json:
    get:
      description: 'Coverage: 2014-15 on (`match/2013/` holds one stray object). Captured for: 2026-27,
        2016-17.'
      operationId: match_season_full_match_id
      parameters:
      - description: 'Season folder = START year (2026 = 2026-27). Folders 2013-2026; `match/2013/` holds
          one stray object, so play-by-play starts in 2014-15. Examples: 2026 (2026-27), 2016 (2016-17).'
        example: '2026'
        in: path
        name: season
        required: true
        schema:
          type: string
      - description: 'hokej.cz game id (scoreboard `hokejcz_id`), not the onlajny game id (`onlajny_id`).
          The bucket also holds other competitions'' games, so an id alone does not tell the league. Examples:
          2928321 (2026-27), 2508598 (2016-17).'
        example: '2928321'
        in: path
        name: match_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchSeasonFullMatchId'
          description: OK
        '404':
          description: 'S3 NoSuchKey XML: no such key (a game without that file).'
      summary: Play-by-play commentary, every entry (goal/penalty details, on-ice players)
    servers:
    - description: Public, anonymously listable S3 bucket behind hokej.cz (eSports Media data).
      url: https://s3-eu-west-1.amazonaws.com/hokej.cz
  /match/{season}/mobile/{match_id}.json:
    get:
      description: 'Coverage: 2014-15 on (first written 2014-10). Captured for: 2026-27, 2016-17.'
      operationId: match_season_mobile_match_id
      parameters:
      - description: 'Season folder = START year (2026 = 2026-27). Folders 2013-2026; `match/2013/` holds
          one stray object, so play-by-play starts in 2014-15. Examples: 2026 (2026-27), 2016 (2016-17).'
        example: '2026'
        in: path
        name: season
        required: true
        schema:
          type: string
      - description: 'hokej.cz game id (scoreboard `hokejcz_id`), not the onlajny game id (`onlajny_id`).
          The bucket also holds other competitions'' games, so an id alone does not tell the league. Examples:
          2928321 (2026-27), 2508598 (2016-17).'
        example: '2928321'
        in: path
        name: match_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchSeasonMobileMatchId'
          description: OK
        '404':
          description: 'S3 NoSuchKey XML: no such key (a game without that file).'
      summary: Play-by-play commentary, flat mobile form (no structured details)
    servers:
    - description: Public, anonymously listable S3 bucket behind hokej.cz (eSports Media data).
      url: https://s3-eu-west-1.amazonaws.com/hokej.cz
