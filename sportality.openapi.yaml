components:
  schemas:
    SportalityAllSites:
      description: Clubs of an ssgt.
      items:
        properties:
          icon:
            description: Team logo URL (SVG on sportality.cdn.s8y.se).
            type: string
          id:
            description: Site instance id of the club (platform key space; the same as instanceId).
            type: string
          instanceId:
            description: Site instance id of the club or league (platform key space, '<code><n>_<code>'
              such as hol2_hol; the league itself is dbl1_dbl).
            type: string
          name:
            description: Display name.
            type: string
          publicUrl:
            description: The club's own website.
            type: string
        type: object
      type: array
    SportalityAthlete:
      description: Player bio from sports-v2.
      properties:
        athleteData:
          description: The athlete's bio and external ids.
          properties:
            contactInfo:
              description: 'Unobserved: null in every sample and every full body. When filled: Contact
                record (null on every athlete seen; personal data is redacted if present).'
              x-unobserved: true
            createdAt:
              description: Creation timestamp.
              type: string
            createdBy:
              description: Creating site instance.
              type: string
            creatorSite:
              description: 'Unobserved: null in every sample and every full body. When filled: Creating
                site (null).'
              x-unobserved: true
            dateOfBirth:
              description: Date of birth, redacted in the captures.
              type: string
            deleted:
              description: Soft-delete flag.
              type: boolean
            firstName:
              description: Given name(s).
              type: string
            gender:
              description: Gender (male).
              type: string
            height:
              description: Height in cm.
              type: integer
            lastModified:
              description: Last-modified timestamp.
              type: string
            lastName:
              description: Family name.
              type: string
            metadata:
              description: Free metadata (always empty).
              items:
                x-unobserved: true
              type: array
            nationality:
              description: ISO 3166-1 alpha-2 country code.
              type: string
            playerExtIds:
              description: External ids of the player; the genius-basketball one is the Genius person
                id.
              items:
                properties:
                  extId:
                    description: External id as a string; for extIdType genius-basketball this is the
                      Genius person id (Genius key space; = pbp / box score playerId).
                    type: string
                  extIdType:
                    description: Kind of external id (genius-basketball = Genius Sports).
                    properties:
                      code:
                        description: External-id type code (genius-basketball).
                        type: string
                      createdAt:
                        description: 'Unobserved: null in every sample and every full body. When filled:
                          Creation timestamp.'
                        x-unobserved: true
                      createdBy:
                        description: Creating site instance.
                        type: string
                      deleted:
                        description: Soft-delete flag.
                        type: boolean
                      lastModified:
                        description: 'Unobserved: null in every sample and every full body. When filled:
                          Last-modified timestamp.'
                        x-unobserved: true
                      names:
                        description: Names of the external-id type by language.
                        items:
                          properties:
                            language:
                              description: 'Language of the translation: da = Danish, sv = Swedish (the
                                platform default, so season names carry only sv), display = the display
                                name.'
                              type: string
                            translation:
                              description: Name in that language.
                              type: string
                          type: object
                        type: array
                      uuid:
                        description: External-id type uuid (platform key space).
                        type: string
                      visible:
                        description: Whether the external-id type is shown on the site.
                        type: boolean
                    type: object
                  id:
                    description: Row id of the external-id record (platform key space, integer; not the
                      Genius id).
                    type: integer
                  locked:
                    description: Whether the external id is locked against edits.
                    type: boolean
                type: object
              type: array
            shoots:
              description: Shooting hand ('').
              type: string
            uuid:
              description: Athlete uuid (platform key space); joins the athlete routes and stats-info
                stats[].info.uuid.
              type: string
            weight:
              description: Weight in kg.
              type: integer
          type: object
      type: object
    SportalityBoxscore:
      description: Box score of one game.
      properties:
        dataColumns:
          description: Column definitions (name, type, group) of the table; the rows are keyed by `name`.
          items:
            properties:
              group:
                description: Column group ('' for every column seen).
                type: string
              highlighted:
                description: Whether the site highlights the column.
                type: boolean
              name:
                description: Column key in the rows of `stats`.
                type: string
              type:
                description: Column type (integer, string, ...).
                type: string
            type: object
          type: array
        players:
          description: 'Player names by side: homeTeamValue and awayTeamValue, each a map keyed by Genius
            person id.'
          properties:
            awayTeamValue:
              additionalProperties:
                description: One away player (names and the Genius id again).
                properties:
                  extIds:
                    description: External ids (the Genius person id).
                    items:
                      properties:
                        extId:
                          description: External id as an integer here; the Genius person id (Genius key
                            space).
                          type: integer
                      type: object
                    type: array
                  firstName:
                    description: Given name(s).
                    type: string
                  fullName:
                    description: Player name.
                    type: string
                  lastName:
                    description: Family name.
                    type: string
                type: object
              description: Away players by Genius person id.
              type: object
              x-keyed-by: '{player_id}'
            homeTeamValue:
              additionalProperties:
                description: One home player (names and the Genius id again).
                properties:
                  extIds:
                    description: External ids (the Genius person id).
                    items:
                      properties:
                        extId:
                          description: External id as an integer here; the Genius person id (Genius key
                            space).
                          type: integer
                      type: object
                    type: array
                  firstName:
                    description: Given name(s).
                    type: string
                  fullName:
                    description: Player name.
                    type: string
                  lastName:
                    description: Family name.
                    type: string
                type: object
              description: Home players by Genius person id (the key space of the box score rows' info.playerId).
              type: object
              x-keyed-by: '{player_id}'
          type: object
        provider:
          description: Stats provider of the data (genius-basketball = Genius Sports LiveStats).
          type: string
        stats:
          description: 'Box score lines by side: homeTeamValue and awayTeamValue, each a list.'
          properties:
            awayTeamValue:
              description: 'Away lines: one per player, then the team_coach and team_totals rows.'
              items:
                properties:
                  +/-:
                    description: Plus/minus while on court.
                    type:
                    - integer
                    - string
                    x-absent-in-some-rows: true
                  2P:
                    description: Two-pointers as 'made-attempted'.
                    type: string
                    x-absent-in-some-rows: true
                  2P%:
                    description: Two-point percentage, 0-100.
                    type:
                    - number
                    - string
                    x-absent-in-some-rows: true
                  3P:
                    description: Three-pointers as 'made-attempted'.
                    type: string
                    x-absent-in-some-rows: true
                  3P%:
                    description: Three-point percentage, 0-100.
