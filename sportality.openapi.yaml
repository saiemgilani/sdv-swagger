                    - number
                    - string
                    x-absent-in-some-rows: true
                  AST:
                    description: Assists.
                    type:
                    - integer
                    - string
                    x-absent-in-some-rows: true
                  BLK:
                    description: Blocks.
                    type:
                    - integer
                    - string
                    x-absent-in-some-rows: true
                  BLKR:
                    description: Blocks received (shots of the player that were blocked).
