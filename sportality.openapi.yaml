info:
  description: 'Basketligaen (the Danish men''s basketball league) site API at www.basketligaen.dk/api.
    The site runs on the Sportality

    platform (the same vendor and route families as www.shl.se/api, see shl/); the stats provider is `genius-basketball`,

    a relay of Genius Sports LiveStats: play-by-play, box scores and shot coordinates carry the Genius
    match, team and person

    ids. Keyless GET JSON; routes are grouped as sports-v2 (schedule, teams, athletes), gameday (one game)
    and statistics-v2

    (season tables). An ssgt (season + series + game type) keys most of it. The season key is the START
    year (code 2026 =

    2026/2027; sdv END year = code + 1); schedules and season tables reach back to 2002/03, gameday data
    starts with 2023/24

    (older games answer 200 with an empty body). Only the men''s league (series DBL) is on this host.
    No robots.txt (it answers

    the SPA shell), terms not read: unverified. Shapes from captures of 2026-10-12 plus the full-body
    observations banked

    beside them; x-unobserved = null in every body seen. Not official or supported.'
  title: Basketligaen (Denmark) site API (Sportality platform, Genius basketball stats)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /gameday/boxscore/{game_uuid}:
    get:
      description: Player box score and team rows of both sides (2023/24 on). stats.homeTeamValue / awayTeamValue
        are LISTS (one line per player, then a team_coach row and a team_totals row), players.homeTeamValue
        / awayTeamValue are MAPS keyed by Genius person id.
      operationId: get_sportality_boxscore
      parameters:
      - description: 'Game uuid: `gameInfo[].uuid` of the schedule (10 lowercase letters and digits).
          Key space: platform game uuids; the Genius match id is `extId` / `gameSourceId` in the body.'
        example: c4hh5nig6t
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportalityBoxscore'
          description: JSON body; 200 with an EMPTY body (no content) for games before 2023/24
        '500':
          description: 'Unknown uuid on the routes keyed by team, athlete, ssgt or season: HTTP 500 application/json
            {"message": "Internal Server Error", "statusCode": 500}.'
      security: []
      summary: Player box score and team rows of both sides (2023/24 on)
  /gameday/game-info/{game_uuid}:
    get:
      description: Points per period, team comparison and best scorers (2023/24 on). teamPeriod.stats
        lists points per period (overtime periods as further rows); teamHead2Head and the post-game comparison
        share the left/center/right row shape.
      operationId: get_sportality_gd_game
      parameters:
      - description: 'Game uuid: `gameInfo[].uuid` of the schedule (10 lowercase letters and digits).
          Key space: platform game uuids; the Genius match id is `extId` / `gameSourceId` in the body.'
        example: c4hh5nig6t
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportalityGdGame'
          description: JSON body; 200 with an EMPTY body (no content) for games before 2023/24
        '500':
          description: 'Unknown uuid on the routes keyed by team, athlete, ssgt or season: HTTP 500 application/json
            {"message": "Internal Server Error", "statusCode": 500}.'
      security: []
      summary: Points per period, team comparison and best scorers (2023/24 on)
  /gameday/game-overview/{game_uuid}:
    get:
      description: 'Score, state, clock and the Genius ids of one game (2023/24 on). time differs by era:
        recent games carry period/periodTime/liveState; the 2023/24 game also numbered period keys (''0'',
        ...). state is GameEnded once over.'
      operationId: get_sportality_overview
      parameters:
      - description: 'Game uuid: `gameInfo[].uuid` of the schedule (10 lowercase letters and digits).
          Key space: platform game uuids; the Genius match id is `extId` / `gameSourceId` in the body.'
        example: c4hh5nig6t
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportalityOverview'
          description: JSON body; 200 with an EMPTY body (no content) for games before 2023/24
        '500':
          description: 'Unknown uuid on the routes keyed by team, athlete, ssgt or season: HTTP 500 application/json
            {"message": "Internal Server Error", "statusCode": 500}.'
      security: []
      summary: Score, state, clock and the Genius ids of one game (2023/24 on)
  /gameday/play-by-play/{game_uuid}:
    get:
      description: 'Play-by-play events with shot coordinates and the Genius ids (2023/24 on). Newest
        first. 804 events in the 84-100 game (about 0.9 MB); the sample keeps three. Every action is one
        line: shots are `2pt` / `3pt` / `freethrow` (the shooter), then separate `assist`, `block`, `foulon`,
        `steal` lines for the other players involved, `rebound`, `turnover`, `foul`, `substitution`, `timeout`,
        `jumpball`, `clock` start/stop lines, `period` and `game` boundary lines.'
      operationId: get_sportality_pbp
      parameters:
      - description: 'Game uuid: `gameInfo[].uuid` of the schedule (10 lowercase letters and digits).
          Key space: platform game uuids; the Genius match id is `extId` / `gameSourceId` in the body.'
        example: c4hh5nig6t
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportalityPbp'
          description: JSON list of events, newest first; 200 with an EMPTY body (no content) for games
            before 2023/24
        '500':
          description: 'Unknown uuid on the routes keyed by team, athlete, ssgt or season: HTTP 500 application/json
            {"message": "Internal Server Error", "statusCode": 500}.'
      security: []
      summary: Play-by-play events with shot coordinates and the Genius ids (2023/24 on)
  /gameday/player-stats/{game_uuid}:
    get:
      description: Box score with jersey and Genius shirt numbers (2023/24 on). Same lines as the box
        score plus teamNumber and pno (Genius shirt-table numbers); the team rows carry no info.teamId.
      operationId: get_sportality_player_stats
      parameters:
      - description: 'Game uuid: `gameInfo[].uuid` of the schedule (10 lowercase letters and digits).
          Key space: platform game uuids; the Genius match id is `extId` / `gameSourceId` in the body.'
        example: c4hh5nig6t
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportalityPlayerStats'
          description: JSON body; 200 with an EMPTY body (no content) for games before 2023/24
        '500':
          description: 'Unknown uuid on the routes keyed by team, athlete, ssgt or season: HTTP 500 application/json
            {"message": "Internal Server Error", "statusCode": 500}.'
      security: []
      summary: Box score with jersey and Genius shirt numbers (2023/24 on)
  /gameday/post-game-data/team-stats/{game_uuid}:
    get:
      description: Post-game team comparison (2023/24 on). ssgtUuid, homeTeamUuid and awayTeamUuid are
        required, else that part of the body comes back blank. The comparison rows share the shape of
        gameday game-info teamHead2Head.
      operationId: get_sportality_postgame
      parameters:
      - description: 'Game uuid: `gameInfo[].uuid` of the schedule (10 lowercase letters and digits).
          Key space: platform game uuids; the Genius match id is `extId` / `gameSourceId` in the body.'
        example: c4hh5nig6t
        in: path
        name: game_uuid
        required: true
        schema:
          type: string
      - description: ssgt uuid. Without it the answer is an empty 200 body.
        example: xs07bd3fmp
        in: query
        name: ssgtUuid
        required: true
        schema:
          type: string
      - description: Home team uuid; without it the home side comes back blank.
        example: rfo82vr830
        in: query
        name: homeTeamUuid
        required: true
        schema:
          type: string
      - description: Away team uuid; without it the away side comes back blank.
        example: gvvuxe9ysw
        in: query
        name: awayTeamUuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportalityPostgame'
          description: JSON body; 200 with a blank or empty body for games before 2023/24
        '500':
