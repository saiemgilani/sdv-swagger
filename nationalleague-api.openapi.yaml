                      description: Image width, pixels
                      type: integer
                  type: object
                id:
                  description: Umbraco CMS media id; not a team id
                  type: integer
                name:
                  description: Media title
                  type: string
                type:
                  description: CMS node kind ('Media')
                  type: string
                url:
                  description: Site path of the image
                  type: string
                urlSegment:
                  description: 'URL slug; unobserved: null or empty in every sampled row'
                  x-unobserved: true
              type: object
            overridenName:
              description: Display-name override (sic); empty string in the sample
              type: string
            players:
              description: Roster override; empty string in the sample
              type: string
            teamID:
              description: 'SIHF team id, a digit string (e.g. `101151` = HC Davos): the same key space
                as the sihf/ table team cell `id` (an integer there). Joins every teamId / homeTeamId
                / awayTeamId in this API. The join from this CMS record to the stats routes'
              type: string
            ticketUrl:
              description: Club ticket-shop URL
              type: string
            website:
              description: Club website URL
              type: string
          type: object
        id:
          description: 'Umbraco CMS content-node id (e.g. 1627); NOT a team id: fields.teamID is'
          type: integer
        name:
          description: Club name
          type: string
        type:
          description: CMS node kind ('Content')
          type: string
        url:
          description: Site path of the club page
          type: string
        urlSegment:
          description: URL slug of the club page
          type: string
      type: object
info:
  description: 'Keyless JSON API behind the National League app (Expo/React; also SignalR at /hubs/game
    for live updates, not documented here). Routes from the app bundle, all 12 verified 200 on 2026-10-12;
    shapes from committed captures in nationalleague/captures/. The only source of NL shot coordinates
    and xG, and of season player tables keyed by SIHF licence number. robots.txt disallows /api: the owner
    approved building on it on 2026-10-12; crawl incrementally and politely (>=1 s between requests).
    No pagination. Not official or supported.'
  title: National League app API (www.nationalleague.ch/api)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /games:
    get:
      operationId: games
      parameters:
      - description: 'Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes every list, and
          /player/{playerId} gp (51 vs 7), so it scopes. Lists are served for 2019-2027 (the app''s season
          picker, /api/content/metadata `seasons`) and patchily before: 2012 and 2017 answered, 2010/2014/2015/2016/2018
          answered `[]` (probed 2026-10-12).'
        example: 2026
        in: query
        name: season
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Games'
          description: OK (application/json; charset=utf-8)
      summary: 'Schedule and results for one season: NL plus exhibitions'
  /games/current:
    get:
      operationId: games_current
      parameters:
      - description: 'The running season''s END year (2027 on 2026-10-12). Season END year: `2026` = 2025/26.
          Diffing 2026 vs 2027 changes every list, and /player/{playerId} gp (51 vs 7), so it scopes.
          Lists are served for 2019-2027 (the app''s season picker, /api/content/metadata `seasons`) and
          patchily before: 2012 and 2017 answered, 2010/2014/2015/2016/2018 answered `[]` (probed 2026-10-12).'
        example: 2027
        in: query
        name: season
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesCurrent'
          description: OK (application/json; charset=utf-8)
      summary: The current or next game day
  /games/playoffs:
    get:
      operationId: games_playoffs
      parameters:
      - description: 'Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes every list, and
          /player/{playerId} gp (51 vs 7), so it scopes. Lists are served for 2019-2027 (the app''s season
          picker, /api/content/metadata `seasons`) and patchily before: 2012 and 2017 answered, 2010/2014/2015/2016/2018
          answered `[]` (probed 2026-10-12).'
        example: 2026
        in: query
        name: season
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesPlayoffs'
          description: OK (application/json; charset=utf-8)
      summary: Playoff and play-in series, by round
  /games/playouts:
    get:
      operationId: games_playouts
      parameters:
      - description: 'Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes every list, and
          /player/{playerId} gp (51 vs 7), so it scopes. Lists are served for 2019-2027 (the app''s season
          picker, /api/content/metadata `seasons`) and patchily before: 2012 and 2017 answered, 2010/2014/2015/2016/2018
          answered `[]` (probed 2026-10-12).'
        example: 2026
        in: query
        name: season
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesPlayouts'
          description: OK (application/json; charset=utf-8)
      summary: Playout and league-qualification series, by round
  /games/team/{teamId}:
    get:
      operationId: games_team_teamId
      parameters:
      - description: 'SIHF team id, a digit string (e.g. `101151` = HC Davos): the same key space as the
          sihf/ table team cell `id` (an integer there). Joins every teamId / homeTeamId / awayTeamId
          in this API.'
        example: '101144'
        in: path
        name: teamId
        required: true
        schema:
          type: string
      - description: 'Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes every list, and
          /player/{playerId} gp (51 vs 7), so it scopes. Lists are served for 2019-2027 (the app''s season
          picker, /api/content/metadata `seasons`) and patchily before: 2012 and 2017 answered, 2010/2014/2015/2016/2018
          answered `[]` (probed 2026-10-12).'
        example: 2026
        in: query
        name: season
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesTeamTeamId'
          description: OK (application/json; charset=utf-8)
      summary: One team's games for one season
  /games/{gameId}:
    get:
      operationId: games_gameId
      parameters:
      - description: 'SIHF game id, 14 digits `<season(4)><competition code(4)><sequence(6)>` (e.g. `20261105000325`):
          the same key space as data.sihf.ch `gameoverview?searchQuery=` (sihf/). Competition codes seen:
          `1105` NL, `1115` Swiss League, `0009`, `6105`, `6115`, `6005`, `6606` exhibitions.'
        example: '20261105000325'
        in: path
        name: gameId
        required: true
        schema:
          type: string
      - description: 'Optional and has no effect: the game id already fixes the season, and dropping `season`
          served the same game. Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes every
          list, and /player/{playerId} gp (51 vs 7), so it scopes. Lists are served for 2019-2027 (the
          app''s season picker, /api/content/metadata `seasons`) and patchily before: 2012 and 2017 answered,
          2010/2014/2015/2016/2018 answered `[]` (probed 2026-10-12).'
        example: 2026
        in: query
        name: season
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesGameId'
          description: OK (application/json; charset=utf-8)
      summary: 'One game: overview, period scores, play-by-play, lineups, player and team stats, shots
        with xG'
  /player:
    get:
      operationId: player
      parameters:
      - description: 'Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes every list, and
          /player/{playerId} gp (51 vs 7), so it scopes. Lists are served for 2019-2027 (the app''s season
          picker, /api/content/metadata `seasons`) and patchily before: 2012 and 2017 answered, 2010/2014/2015/2016/2018
          answered `[]` (probed 2026-10-12).'
        example: 2026
        in: query
        name: season
        required: false
        schema:
          type: integer
      - description: 'SIHF phase id (see x-phase-ids). Omitted = the regular season: `/player?season=2026`
          and `phase=4940` answer byte-identical bodies, `phase=5297` (playoffs) a different one (max
          gp 19 vs 52). Phase ids change every season; whether the metadata ids apply to 2027 is unverified.'
        example: 4940
        in: query
        name: phase
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
          description: OK (application/json; charset=utf-8)
      summary: Season stats for every player, with playerId
  /player/team/{teamId}:
    get:
      operationId: player_team_teamId
      parameters:
      - description: 'SIHF team id, a digit string (e.g. `101151` = HC Davos): the same key space as the
          sihf/ table team cell `id` (an integer there). Joins every teamId / homeTeamId / awayTeamId
          in this API.'
        example: '101144'
        in: path
        name: teamId
        required: true
        schema:
          type: string
      - description: 'Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes every list, and
          /player/{playerId} gp (51 vs 7), so it scopes. Lists are served for 2019-2027 (the app''s season
          picker, /api/content/metadata `seasons`) and patchily before: 2012 and 2017 answered, 2010/2014/2015/2016/2018
          answered `[]` (probed 2026-10-12).'
        example: 2026
        in: query
        name: season
        required: false
        schema:
          type: integer
      - description: SIHF phase id (see x-phase-ids). On /player, omitting it served the regular season
          (byte-identical to phase=4940); that default is assumed but unverified on this route. Phase
          ids change every season; whether the metadata ids apply to 2027 is unverified.
        example: 4940
        in: query
        name: phase
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerTeamTeamId'
          description: OK (application/json; charset=utf-8)
      summary: Season stats for one team's players
  /player/topscorer:
    get:
      operationId: player_topscorer
      parameters:
      - description: Number of rows (take=3 answered 3).
        example: 3
        in: query
        name: take
        required: false
        schema:
          type: integer
      - description: 'Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes every list, and
          /player/{playerId} gp (51 vs 7), so it scopes. Lists are served for 2019-2027 (the app''s season
          picker, /api/content/metadata `seasons`) and patchily before: 2012 and 2017 answered, 2010/2014/2015/2016/2018
          answered `[]` (probed 2026-10-12).'
        example: 2026
        in: query
        name: season
        required: false
        schema:
          type: integer
      - description: SIHF phase id (see x-phase-ids). On /player, omitting it served the regular season
          (byte-identical to phase=4940); that default is assumed but unverified on this route. Phase
          ids change every season; whether the metadata ids apply to 2027 is unverified.
        example: 4940
        in: query
        name: phase
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerTopscorer'
          description: OK (application/json; charset=utf-8)
      summary: Top scorers (same row shape as /player)
  /player/{playerId}:
    get:
      operationId: player_playerId
      parameters:
      - description: 'SIHF licence number, a digit string: the player id of this API and the sihf/ licence
          number (`players[].id`, every `*LicenceNr`; 305519 = Tobias Geisser in both).'
        example: '305519'
        in: path
        name: playerId
        required: true
        schema:
          type: string
      - description: 'Omitted = the current season: /player/305519 without it answered 2027 (gp 7; 51
          for season=2026). Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes every list,
          and /player/{playerId} gp (51 vs 7), so it scopes. Lists are served for 2019-2027 (the app''s
          season picker, /api/content/metadata `seasons`) and patchily before: 2012 and 2017 answered,
          2010/2014/2015/2016/2018 answered `[]` (probed 2026-10-12).'
        example: 2026
        in: query
        name: season
        required: false
        schema:
          type: integer
      - description: SIHF phase id (see x-phase-ids). On /player, omitting it served the regular season
          (byte-identical to phase=4940); that default is assumed but unverified on this route. Phase
          ids change every season; whether the metadata ids apply to 2027 is unverified.
        example: 4940
        in: query
        name: phase
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerPlayerId'
          description: OK (application/json; charset=utf-8)
      summary: One player's season stats
  /teams:
    get:
      operationId: teams
      parameters:
      - description: 'Season END year: `2026` = 2025/26. Diffing 2026 vs 2027 changes every list, and
          /player/{playerId} gp (51 vs 7), so it scopes. Lists are served for 2019-2027 (the app''s season
          picker, /api/content/metadata `seasons`) and patchily before: 2012 and 2017 answered, 2010/2014/2015/2016/2018
          answered `[]` (probed 2026-10-12).'
        example: 2026
        in: query
        name: season
        required: false
        schema:
          type: integer
      - description: SIHF phase id (see x-phase-ids). On /player, omitting it served the regular season
          (byte-identical to phase=4940); that default is assumed but unverified on this route. Phase
          ids change every season; whether the metadata ids apply to 2027 is unverified.
        example: 4940
        in: query
        name: phase
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams'
          description: OK (application/json; charset=utf-8)
      summary: Standings with team season stats
  /teams/{teamId}/info:
    get:
      operationId: teams_teamId_info
      parameters:
      - description: 'SIHF team id, a digit string (e.g. `101151` = HC Davos): the same key space as the
          sihf/ table team cell `id` (an integer there). Joins every teamId / homeTeamId / awayTeamId
          in this API.'
        example: '101144'
        in: path
        name: teamId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamsTeamIdInfo'
          description: OK (application/json; charset=utf-8)
      summary: 'Club CMS record: names, logo, website, ticket links'
servers:
- url: https://www.nationalleague.ch/api
x-competition-codes:
  '0009': Exhibition (2027 list)
  '1105': National League (NL)
  '1115': Swiss League (SL); served by /games/{gameId} but with 0 shots
  '6005': Exhibition (2017 list)
  '6105': Exhibition (2017 and 2026 lists)
  '6115': Exhibition (2027 list)
  '6606': Exhibition (2026 list)
x-phase-ids:
  '4135': Pre-Playoffs
  '4181': League Qualification
  '4940': Regular Season
  '5294': Playout Final
  '5296': Play-In
  '5297': Playoffs
