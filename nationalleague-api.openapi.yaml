    GamesGameId:
      properties:
        actions:
          description: 'Play-by-play grouped by period: goals, penalties, goaltender changes, revoked
            goals'
          items:
            properties:
              actions:
                description: Events of this period in time order
                items:
                  properties:
                    action:
                      description: 'Event type: goal, foul (penalty), in / out (goaltender enters / leaves),
                        revokedGoal'
                      type: string
                      x-observed-values:
                      - goal
                      - foul
                      - in
                      - out
                      - revokedGoal
                    assist1FirstName:
                      description: 'First assist: first name'
                      type:
                      - string
                      - 'null'
                    assist1LastName:
                      description: 'First assist: last name'
                      type:
                      - string
                      - 'null'
                    assist1Number:
                      description: 'First assist: sweater number, a string'
                      type:
                      - string
                      - 'null'
                    assist1Total:
                      description: First assister's assists this season including this one
                      type: integer
                    assist2FirstName:
                      description: 'Second assist: first name'
                      type:
                      - string
                      - 'null'
                    assist2LastName:
                      description: 'Second assist: last name'
                      type:
                      - string
                      - 'null'
                    assist2Number:
                      description: 'Second assist: sweater number, a string'
                      type:
                      - string
                      - 'null'
                    assist2Total:
                      description: Second assister's assists this season including this one
                      type: integer
                    awayTeamResult:
                      description: Away score after the event
                      type: integer
                    foulMinutes:
                      description: Penalty minutes; 0 on non-penalty events
                      type: integer
                    foulType:
                      description: SIHF penalty code (116-125 in the sample); 0 on non-penalty events
                      type: integer
                    goalSituation:
                      description: Goal kind; 'normal' on every sampled event
                      type: string
                    homeTeam:
                      description: Event belongs to the home team
                      type: boolean
                    homeTeamResult:
                      description: Home score after the event
                      type: integer
                    overtime:
                      description: Overtime period number; 0 in regulation
                      type: integer
                    playerFirstName:
                      description: 'Scorer, penalised player or goaltender: first name'
                      type: string
                    playerLastName:
                      description: 'Scorer, penalised player or goaltender: last name'
                      type: string
                    playerNumber:
                      description: Sweater number of that player, a string
                      type: string
                    playerTotal:
                      description: Scorer's goals this season including this one; 0 on non-goal events
                      type: integer
                    reviewGoalCounts:
                      description: Goal stood after review
                      type: boolean
                    reviewSuccessful:
                      description: 'Video-review outcome; unobserved: null or empty in every sampled row'
                      x-unobserved: true
                    revokedGoalSubType:
                      description: Revoked-goal reason code (1 on the revoked goal, 0 elsewhere)
                      type: integer
                    revokedGoalType:
                      description: Revoked-goal category code (1 on every sampled event)
                      type: integer
                    situation:
                      description: 'Goal tags, comma-separated: EQ (even strength), PP1 (power play),
                        GWG (game-winning goal); null on non-goals'
                      type:
                      - string
                      - 'null'
                    teamId:
                      description: 'Team of the event, an INTEGER here (string elsewhere). SIHF team id,
                        a digit string (e.g. `101151` = HC Davos): the same key space as the sihf/ table
                        team cell `id` (an integer there). Joins every teamId / homeTeamId / awayTeamId
                        in this API.'
                      type: integer
                    third:
                      description: Period number, an integer (the parent `third` is a string)
                      type: integer
                    time:
                      description: Game clock elapsed as an MMSS string without separator ('822' = 8:22,
                        '5954' = 59:54)
                      type: string
                    videoTime:
                      description: Seconds into the game video; 0 when there is no clip
                      type: integer
                    videoVimeoId:
                      description: Vimeo id of the event clip
                      type:
                      - string
                      - 'null'
                  type: object
                type: array
              third:
                description: Period number as a string ('1'-'3'; overtime periods follow)
                type: string
            type: object
          type: array
        informations:
          description: Extra game information
          properties:
            arena:
              description: Arena name
              type: string
          type: object
        lineupAway:
          description: Away lineup, one entry per line
          items:
            properties:
              line:
                description: 'Line label: ''goalkeeper'' or ''1''-''4'''
                type: string
                x-observed-values: &id001
                - goalkeeper
                - '1'
                - '2'
                - '3'
                - '4'
              players:
                description: Players on the line
                items:
                  properties:
                    firstGoalkeeper:
                      description: Starting goaltender
                      type: boolean
                    firstName:
                      description: First name
                      type: string
                    isCaptain:
                      description: Team captain
                      type: boolean
                    isTopscorer:
                      description: Wears the team's PostFinance Top Scorer jersey
                      type: boolean
                    lastName:
                      description: Last name
                      type: string
                    line:
                      description: Line number, an integer (goalkeepers 1-2 = first / backup)
                      type: integer
                      x-observed-values: &id002
                      - 1
                      - 2
                      - 3
                      - 4
                      - 5
                    number:
                      description: Sweater number, a string
                      type: string
                    playerId:
                      description: 'SIHF licence number, a digit string: the player id of this API and
                        the sihf/ licence number (`players[].id`, every `*LicenceNr`; 305519 = Tobias
                        Geisser in both).'
                      type: string
                    position:
                      description: goalkeeper, defender or forwarder (sic)
                      type: string
                      x-observed-values: &id003
                      - goalkeeper
                      - defender
                      - forwarder
                  type: object
                type: array
            type: object
          type: array
        lineupHome:
          description: Home lineup, one entry per line (goalkeepers, then lines 1-4)
          items:
            properties:
              line:
                description: 'Line label: ''goalkeeper'' or ''1''-''4'''
                type: string
                x-observed-values: *id001
