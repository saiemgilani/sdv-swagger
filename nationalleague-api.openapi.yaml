components:
  schemas:
    Games:
      items:
        properties:
          arena:
            description: Arena name
            type: string
          awayTeamCoach:
            description: 'Away head coach name; filled in a game''s `overview`, null in the season lists;
              unobserved: null, absent or empty in every sampled row'
            x-unobserved: true
          awayTeamId:
            description: 'Away team. SIHF team id, a digit string (e.g. `101151` = HC Davos): the same
              key space as the sihf/ table team cell `id` (an integer there). Joins every teamId / homeTeamId
              / awayTeamId in this API.'
            type: string
          awayTeamName:
            description: Away team display name
            type: string
          awayTeamResult:
            description: Away team goals (final or current score; 0 before the game)
            type: integer
          awayTeamShortName:
            description: Away team abbreviation
            type: string
          baseStatus:
            description: Coarse game state; equal to status in every sampled game
            type: string
          date:
            description: Scheduled start, ISO 8601 with UTC offset
            type: string
          gameId:
            description: 'SIHF game id, 14 digits `<season(4)><competition code(4)><sequence(6)>` (e.g.
              `20261105000325`): the same key space as data.sihf.ch `gameoverview?searchQuery=` (sihf/).
              Competition codes seen: `1105` NL, `1115` Swiss League, `0009`, `6105`, `6115`, `6005`,
              `6606` exhibitions.'
            type: string
          gameTime:
            description: Elapsed game minutes; 0 on every game in the season lists, 60 in a finished game's
              overview
            type: integer
          hasHighlight:
            description: A highlight video exists
            type: boolean
          hasMySports:
            description: Broadcast on MySports
            type: boolean
          highlightVimeoVideoId:
            description: 'Vimeo id of the highlight video; unobserved: null, absent or empty in every
              sampled row'
            x-unobserved: true
          homeTeamCoach:
            description: 'Home head coach name; filled in a game''s `overview`, null in the season lists;
              unobserved: null, absent or empty in every sampled row'
            x-unobserved: true
          homeTeamId:
            description: 'Home team. SIHF team id, a digit string (e.g. `101151` = HC Davos): the same
              key space as the sihf/ table team cell `id` (an integer there). Joins every teamId / homeTeamId
              / awayTeamId in this API.'
            type: string
          homeTeamName:
            description: Home team display name
            type: string
          homeTeamResult:
            description: Home team goals (final or current score; 0 before the game)
            type: integer
          homeTeamShortName:
            description: Home team abbreviation (e.g. HCD)
            type: string
          isCurrent:
            description: Game belongs to the current game day
            type: boolean
          isCurrentForTeam:
            description: Game is the team's current game (team-scoped views)
            type: boolean
          isExhibition:
            description: Exhibition game, not NL competition (competition code other than 1105)
            type: boolean
          isOvertime:
            description: Game went to overtime
            type: boolean
          isShootout:
            description: Game went to a shootout
            type: boolean
          referees:
            description: Officials as '#<number> <name>' strings (referees and linesmen; one entry in
              some games)
            items:
              type: string
            type: array
          showGameTime:
            description: 'App flag: show gameTime'
            type: boolean
          spectators:
            description: Attendance, a number sent as a string; null before the game
            type: string
          status:
            description: 'Game state: finished, canceled, beforeStartOfPlay (others appear live)'
            type: string
          tvPartner:
            description: 'Broadcaster logo image URLs; unobserved: null, absent or empty in every sampled
              row'
            items:
              x-unobserved: true
            type: array
          vimeoVideoId:
            description: 'Vimeo id of the full-game video, a digit string; unobserved: null, absent or
              empty in every sampled row'
            x-unobserved: true
        type: object
      type: array
    GamesCurrent:
