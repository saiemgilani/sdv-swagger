info:
  description: 'Reverse-engineered from committed captures in euroleague/captures/. Keyless; JSON only
    with Accept: application/json. Not official or supported.'
  title: EuroLeague Competition Engine API (api-live.euroleague.net v2)
  version: '2'
openapi: 3.1.0
paths:
  /competitions:
    get:
      operationId: competitions
      parameters:
      - &id001
        description: Without it the API answers XML.
        in: header
        name: Accept
        required: true
        schema:
          enum:
          - application/json
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competitions'
          description: OK
      summary: Competitions (EuroLeague E, EuroCup U, ...)
  /competitions/{competitionCode}/seasons:
    get:
      operationId: competitions_E_seasons
      parameters:
      - *id001
      - description: E = EuroLeague, U = EuroCup (see /competitions).
        in: path
        name: competitionCode
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionsSeasons'
          description: OK
      summary: Seasons of a competition
  /competitions/{competitionCode}/seasons/{seasonCode}/clubs:
    get:
      operationId: competitions_E_seasons_E2025_clubs
      parameters:
      - *id001
      - description: E = EuroLeague, U = EuroCup (see /competitions).
        in: path
        name: competitionCode
        required: true
        schema:
          type: string
      - description: Competition code + start year, e.g. E2025 for 2025-26.
        in: path
        name: seasonCode
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionsSeasonsClubs'
          description: OK
      summary: Clubs in a season
  /competitions/{competitionCode}/seasons/{seasonCode}/games:
    get:
      operationId: competitions_E_seasons_E2025_games
      parameters:
      - *id001
      - description: E = EuroLeague, U = EuroCup (see /competitions).
        in: path
        name: competitionCode
        required: true
        schema:
          type: string
      - description: Competition code + start year, e.g. E2025 for 2025-26.
        in: path
        name: seasonCode
        required: true
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionsSeasonsGames'
          description: OK
      summary: Games of a season
  /competitions/{competitionCode}/seasons/{seasonCode}/games/{gameCode}/stats:
    get:
      operationId: competitions_E_seasons_E2025_games_1_stats
      parameters:
      - *id001
      - description: E = EuroLeague, U = EuroCup (see /competitions).
        in: path
        name: competitionCode
        required: true
