info:
  description: 'Reverse-engineered from committed captures in euroleague/captures/. Keyless; api-live
    answers JSON only with Accept: application/json. Routes with their own `servers` entry live on api-live
    v3 (standings, season stats, game report) or on the legacy live.euroleague.net/api (shots, play-by-play,
    box score, header). Not official or supported.'
  title: EuroLeague Competition Engine API (api-live.euroleague.net v2 + v3, live.euroleague.net/api)
  version: '2'
openapi: 3.1.0
paths:
  /Boxscore:
    get:
      description: Keyless JSON by default (no Accept header needed). An EMPTY 200 body means no such
        game.
      operationId: Boxscore
      parameters:
      - description: Game number within the season (1-based).
        in: query
        name: gamecode
        required: true
        schema:
          type: integer
      - description: 'Competition code + start year: E2025 (EuroLeague 2025-26), U2025 (EuroCup).'
        in: query
        name: seasoncode
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBoxscore'
          description: OK
      summary: 'Box score of one game: per-player and team totals per side, by-quarter scores, referees,
        attendance'
    servers:
    - url: https://live.euroleague.net/api
  /Header:
    get:
      description: Keyless JSON by default (no Accept header needed). An EMPTY 200 body means no such
        game.
      operationId: Header
      parameters:
      - description: Game number within the season (1-based).
        in: query
        name: gamecode
        required: true
        schema:
          type: integer
      - description: 'Competition code + start year: E2025 (EuroLeague 2025-26), U2025 (EuroCup).'
        in: query
        name: seasoncode
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHeader'
          description: OK
      summary: 'Game header: teams, codes, coaches, score by quarter, venue, referees'
    servers:
    - url: https://live.euroleague.net/api
  /PlayByPlay:
    get:
      description: Keyless JSON by default (no Accept header needed). An EMPTY 200 body means no such
        game.
      operationId: PlayByPlay
      parameters:
      - description: Game number within the season (1-based).
        in: query
        name: gamecode
        required: true
        schema:
          type: integer
      - description: 'Competition code + start year: E2025 (EuroLeague 2025-26), U2025 (EuroCup).'
        in: query
        name: seasoncode
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPlaybyplay'
          description: OK
      summary: Play-by-play of one game, one array per quarter (FirstQuarter ... ForthQuarter, ExtraTime)
    servers:
    - url: https://live.euroleague.net/api
  /Points:
    get:
      description: Keyless JSON by default (no Accept header needed). An EMPTY 200 body means no such
        game.
      operationId: Points
      parameters:
      - description: Game number within the season (1-based).
        in: query
        name: gamecode
        required: true
        schema:
          type: integer
      - description: 'Competition code + start year: E2025 (EuroLeague 2025-26), U2025 (EuroCup).'
        in: query
        name: seasoncode
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPoints'
          description: OK
      summary: 'Shot chart of one game: one row per made/missed FG and made FT, with COORD_X/COORD_Y in
        cm from the hoop (the shot-chart source)'
    servers:
    - url: https://live.euroleague.net/api
  /competitions:
    get:
      description: 'Send `Accept: application/json`; without it the API answers XML.'
      operationId: competitions
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competitions'
          description: OK
