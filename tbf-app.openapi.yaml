    TbfCups:
      description: 'Response of /Kupalar/maclar-filtreler: Filter lists (seasons, teams, cities) of one
        cup competition. Scope check: full: the request''s ids are echoed and compared.'
      properties:
        data:
          description: The payload (see the data.* rows).
          properties:
            evSahibiTakimlar:
              description: Teams that hosted a cup game (ev sahibi takımlar = home teams), for the filter.
              items:
                properties:
                  takimAdi:
                    description: Team name, uppercase.
                    type: string
                  takimId:
                    description: 'Club id (takım = team; key space: TBF clubs, STABLE across seasons and
                      leagues: Tofaş = 13, Anadolu Efes = 2, Beşiktaş = 1). Equals takimID of the player
                      list and takimKodu of team-detail-main. Not a team-season id. JSON number: the same
                      id arrives as 22214 or 22214.0 depending on route and season; cast to an integer.'
                    type: number
                  teamProcessId:
                    description: 'Team-season id (teamProcessId = takimIslemId, ''team registration'';
                      key space: TBF team registrations, a NEW id per club per league-season: Tofaş =
                      265995 in BSL 2026-27). The TeamProcessId parameter of the /Team/ routes. Not the
                      club id (takimID / teamId of the team lists). JSON number: the same id arrives as
                      22214 or 22214.0 depending on route and season; cast to an integer.'
                    type: number
                type: object
              type: array
            haftalar:
              description: Empty array in every sample; element shape unobserved. (haftalar = weeks.)
              items:
                x-unobserved: true
              type: array
            misafirTakimlar:
              description: Teams that played a cup game away (misafir takımlar = visiting teams).
              items:
                properties:
                  takimAdi:
                    description: Team name, uppercase.
                    type: string
                  takimId:
                    description: 'Club id (takım = team; key space: TBF clubs, STABLE across seasons and
                      leagues: Tofaş = 13, Anadolu Efes = 2, Beşiktaş = 1). Equals takimID of the player
                      list and takimKodu of team-detail-main. Not a team-season id. JSON number: the same
                      id arrives as 22214 or 22214.0 depending on route and season; cast to an integer.'
                    type: number
                  teamProcessId:
                    description: 'Team-season id (teamProcessId = takimIslemId, ''team registration'';
                      key space: TBF team registrations, a NEW id per club per league-season: Tofaş =
                      265995 in BSL 2026-27). The TeamProcessId parameter of the /Team/ routes. Not the
                      club id (takimID / teamId of the team lists). JSON number: the same id arrives as
                      22214 or 22214.0 depending on route and season; cast to an integer.'
                    type: number
                type: object
              type: array
            sehirler:
              description: Host cities (şehirler).
              items:
                properties:
                  sehir:
                    description: City name, uppercase Turkish.
                    type: string
                  sehirId:
                    description: 'City id = Turkish licence-plate province code (6 = Ankara, 34 = İstanbul,
                      27 = Gaziantep) JSON number: the same id arrives as 22214 or 22214.0 depending on
                      route and season; cast to an integer.'
                    type: number
                type: object
              type: array
            sezonlar:
              description: Every season of the cup (sezonlar = seasons), oldest first; one must be the
                asked faaliyetId (checked).
              items:
                properties:
                  activityId:
                    description: 'Activity id (faaliyet = activity; key space: TBF league-SEASONS, a new
                      id per league per season: BSL 2026-27 = 22214, BSL 2025-26 = 20728, BSL 2019-20
                      = 13310, BSL 2006-07 = 4547, TBL 2026-27 = 22215, KBSL 2026-27 = 22209). The same
                      value as activityId = faaliyetId = faaliyet_ID and the leagueId / LeagueId / ActivityId
                      parameters. Not a season id and not a constant league id. JSON number: the same
                      id arrives as 22214 or 22214.0 depending on route and season; cast to an integer.
                      (here: the cup''s activity per season.)'
                    type: number
                  sezon:
                    description: Season label 'YYYY-YYYY'.
                    type: string
                  sezonId:
                    description: 'TBF season id (sezon = season; key space: TBF seasons, global across
                      leagues: 174 = 2026-2027, 172 = 2025-2026, 160 = 2019-2020, 24 = 2006-2007; the
                      odd ids 175, 173, ... are the international ''UA-'' seasons). Internal: the sdv
                      season key is the END year of the ''YYYY-YYYY'' label (174 -> 2027). JSON number:
                      the same id arrives as 22214 or 22214.0 depending on route and season; cast to an
                      integer.'
                    type: number
                type: object
              type: array
          type: object
        isSuccess:
          description: true on every banked sample; false with problemDetails on a 404 (the capture refuses
            anything else).
          type: boolean
        message:
          description: '''Success'' on success ('''' on errors).'
          type: string
        problemDetails:
          description: 'Unobserved: null in every sample. When filled: null on success; on errors an object
            {type, title, status, detail, instance} (Turkish detail: ''Maç bulunamadı.'' = game not found).
            Never banked.'
          x-unobserved: true
      type: object
    TbfDaily:
      description: 'Response of /Match/get-daily-matches: Every TBF game on one date, grouped (optionally
        one league-season). Scope check: full: the request''s ids are echoed and compared.'
      properties:
        data:
          description: The payload (see the data.* rows).
          items:
            properties:
              groupName:
                description: Group label in Turkish ('Lig Maçları' = league games).
                type: string
              matches:
                description: The group's games of that date.
                items:
                  properties:
                    activityCode:
                      description: League prefix, lowercase ('bsl', 'tbl', 'kbsl'); 'bsl' also on 2006-07
                        (when the top flight was named TBL).
                      type: string
                    activityDisplayName:
                      description: League sponsor name ('Türkiye Sigorta Basketbol Süper Ligi'); '' on
                        old seasons.
                      type: string
                    activityId:
                      description: 'Activity id (faaliyet = activity; key space: TBF league-SEASONS, a
                        new id per league per season: BSL 2026-27 = 22214, BSL 2025-26 = 20728, BSL 2019-20
                        = 13310, BSL 2006-07 = 4547, TBL 2026-27 = 22215, KBSL 2026-27 = 22209). The same
                        value as activityId = faaliyetId = faaliyet_ID and the leagueId / LeagueId / ActivityId
                        parameters. Not a season id and not a constant league id. JSON number: the same
                        id arrives as 22214 or 22214.0 depending on route and season; cast to an integer.'
                      type: number
                    activityName:
                      description: Activity name ('BSL 2026-2027').
                      type: string
                    awayTeam:
                      description: Away team.
                      properties:
                        hexCode1:
                          description: Team primary colour, '#rrggbb'.
                          type: string
                        hexCode2:
                          description: Team secondary colour, '#rrggbb'.
                          type: string
                        id:
                          description: 'Team-season id (teamProcessId = takimIslemId, ''team registration'';
                            key space: TBF team registrations, a NEW id per club per league-season: Tofaş
                            = 265995 in BSL 2026-27). The TeamProcessId parameter of the /Team/ routes.
                            Not the club id (takimID / teamId of the team lists).'
                          type: number
                        isHome:
                          description: true on homeTeam, false on awayTeam.
                          type: boolean
                        logoUrl:
                          description: Team logo URL.
                          type: string
                        name:
                          description: Team name, uppercase.
                          type: string
                        score:
                          description: Points as a STRING ('90'); '' before the game.
                          type: string
                      type: object
                    broadcastChannel:
                      description: Broadcaster ('beINSports', 'HT SPOR', 'Youtube / TBF TV'), or ''.
                      type: string
                    cinsiyet:
                      description: Gender in Turkish ('Erkek' = men, 'Kadın' = women); '' on get-daily-matches.
                      type: string
                    genuisId:
                      description: 'Genius Sports LiveStats match id, spelt genuisId by TBF (key space:
                        Genius matches, unique across every Genius org). String; '''' when TBF stored
                        none. Joins https://fibalivestats.dcd.shared.geniussports.com/data/{genuisId}/data.json
                        (provider genius-livestats/): 200 for 2018-19 to 2020-21 and 2025-26+, S3 AccessDenied
                        403 for 2017-18 and 2021-22, '''' for 2016-17 and 2022-23 to 2024-25 (README coverage
                        matrix).'
                      type: string
                    halfValue:
                      description: Phase code as a string ('1' = first half of the regular season); see
                        get-league-weeks devre_ID.
                      type: string
                    hasUzatma:
                      description: Overtime flag (uzatma = overtime). false on every one of 64 BSL 2025-26
                        games checked; reliability unverified.
                      type: boolean
                    homeTeam:
                      description: Home team.
                      properties:
                        hexCode1:
                          description: Team primary colour, '#rrggbb'.
                          type: string
                        hexCode2:
                          description: Team secondary colour, '#rrggbb'.
                          type: string
                        id:
                          description: 'Team-season id (teamProcessId = takimIslemId, ''team registration'';
                            key space: TBF team registrations, a NEW id per club per league-season: Tofaş
                            = 265995 in BSL 2026-27). The TeamProcessId parameter of the /Team/ routes.
                            Not the club id (takimID / teamId of the team lists).'
                          type: number
                        isHome:
                          description: true on homeTeam, false on awayTeam.
                          type: boolean
                        logoUrl:
                          description: Team logo URL.
                          type: string
                        name:
                          description: Team name, uppercase.
                          type: string
                        score:
                          description: Points as a STRING ('90'); '' before the game.
                          type: string
                      type: object
                    isDirectActivityId:
                      description: false in every sample; an app routing flag.
                      type: boolean
                    isFavorite:
                      description: 'Constant placeholder in every sample (false): the app user''s favourite
                        flag (per deviceId).'
                      type: boolean
                    matchCode:
                      description: TBF short game code ('1EA4917'); unique per game, meaning of the letters
                        unverified.
                      type: string
                    matchDate:
                      description: Tip-off, Turkey local time (Europe/Istanbul, UTC+3), ISO 8601 without
                        zone ('2026-09-25T19:00:00').
                      type: string
                    matchDateOnly:
                      description: Tip-off date 'YYYY-MM-DD'; equals the MatchDate parameter (checked).
                      type: string
                    matchId:
                      description: 'TBF game id (key space: TBF games, ONE global sequence across leagues
                        and seasons: 62552 in 2006-07, 87026 in 2019-20, 346279 in 2026-27). The matchId
                        parameter of every /Match/ game route. JSON number: the same id arrives as 22214
                        or 22214.0 depending on route and season; cast to an integer.'
                      type: number
                    matchStatus:
                      description: Status label in Turkish ('Oynandı' = played).
                      type: string
                    matchStatusId:
                      description: 'Game status code: 1 = played (Oynandı), 4 = not played (Oynanmadı),
                        19 = fixture without date and time (Fikstür / Tarih ve Saat Atanmadı). JSON number:
                        the same id arrives as 22214 or 22214.0 depending on route and season; cast to
                        an integer.'
                      type: number
                    matchTime:
                      description: Tip-off time 'HH:MM' (Turkey local).
                      type: string
                    season:
                      description: Season label 'YYYY-YYYY'.
                      type: string
                    seasonId:
                      description: 'TBF season id (sezon = season; key space: TBF seasons, global across
                        leagues: 174 = 2026-2027, 172 = 2025-2026, 160 = 2019-2020, 24 = 2006-2007; the
                        odd ids 175, 173, ... are the international ''UA-'' seasons). Internal: the sdv
                        season key is the END year of the ''YYYY-YYYY'' label (174 -> 2027). JSON number:
                        the same id arrives as 22214 or 22214.0 depending on route and season; cast to
                        an integer.'
                      type: number
                    venueName:
                      description: Venue (salon) name.
                      type: string
                    week:
                      description: 'Week label: ''N. Hafta'' (week N) or the playoff round (''Playoff
                        Final''); checked against the asked week.'
                      type: string
                    youtubeLink:
                      description: YouTube broadcast URL, or ''.
                      type: string
                  type: object
                type: array
              totalCount:
                description: Games in the group; the capture refuses a group whose matches list is shorter.
                type: integer
            type: object
          type: array
        isSuccess:
          description: true on every banked sample; false with problemDetails on a 404 (the capture refuses
            anything else).
          type: boolean
        message:
          description: '''Success'' on success ('''' on errors).'
          type: string
        problemDetails:
          description: 'Unobserved: null in every sample. When filled: null on success; on errors an object
            {type, title, status, detail, instance} (Turkish detail: ''Maç bulunamadı.'' = game not found).
            Never banked.'
          x-unobserved: true
      type: object
    TbfFlow:
      description: 'Response of /Match/game-flow: Play-by-play (Turkish action names), in game order.
        Scope check: full: the request''s ids are echoed and compared.'
      properties:
        data:
          description: The payload (see the data.* rows).
          properties:
            events:
              description: Every play, in GAME ORDER (actionNumber ascending; numbering has gaps). 520-640
                events per game in the samples; EMPTY for seasons without TBF play-by-play (before 2025-26;
                see the README).
              items:
                properties:
                  action:
                    description: Action in TURKISH; the full vocabulary with an English gloss is in the
                      divergence notes below and in the README.
                    type: string
                  actionNumber:
                    description: Play sequence number (integer), ascending; gaps are deleted / hidden
                      actions.
                    type: integer
                  caption:
                    description: Constant placeholder in every sample (false). By name the captain flag
                      (kaptan); not filled.
                    type: boolean
                  image:
                    description: Constant placeholder in every sample ('').
                    type: string
                  isActive:
                    description: Constant placeholder in every sample (false). A UI flag of the app; ignore.
                    type: boolean
                  isHome:
                    description: 'Side of the acting team: true = home, false = away, null on game events
                      (game and period start / end, timeouts ''Mola'').'
                    type: boolean
                  isStarter:
                    description: Constant placeholder in every sample (false).
                    type: boolean
                  jerseyNumber:
                    description: Acting player's shirt number as a string; '' on team and game events.
                    type: string
                  periodType:
                    description: 'Period type: 1 = regulation quarter, 2 = overtime (from the app code;
                      2 unobserved in the samples).'
                    type: integer
                  playerId:
                    description: 'Constant placeholder in every sample (0): play-by-play carries NO player
                      id; identify the player by playerName + jerseyNumber + isHome.'
                    type: integer
                  playerName:
                    description: Acting player 'First Last'; '' on team and game events.
                    type: string
                  pno:
                    description: Constant placeholder in every sample (0). By name the Genius LiveStats
                      in-game player number; not filled here.
                    type: integer
                  quarterNumber:
                    description: Period number (1-4; overtime numbering unverified).
                    type: integer
                  score:
                    description: Running score AFTER the play as 'home-away' ('90-89'); on every event.
