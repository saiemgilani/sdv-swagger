        isSuccess:
          description: true on every banked sample; false with problemDetails on a 404 (the capture refuses
            anything else).
          type: boolean
        message:
          description: '''Success'' on success ('''' on errors).'
          type: string
        problemDetails:
          description: 'Unobserved: null in every sample. When filled: null on success; on errors an object
            {type, title, status, detail, instance} (Turkish detail: ''Maç bulunamadı.'' = game not found).
            Never banked.'
          x-unobserved: true
      type: object
    TbfTeams:
      description: 'Response of /Team/get-teams-by-leauge: Every team of one league-season (the route
        name is misspelt: leauge). Scope check: no league id is echoed: every row''s seasonId must equal
        the league''s season.'
      properties:
        data:
          description: The payload (see the data.* rows).
          items:
            properties:
              hexRenkKodu1:
                description: Team primary colour (renk kodu = colour code), '#rrggbb'.
                type: string
              hexRenkKodu2:
                description: Team secondary colour, '#rrggbb'.
                type: string
              season:
                description: Season label 'YYYY-YYYY'.
                type: string
              seasonId:
                description: 'TBF season id (sezon = season; key space: TBF seasons, global across leagues:
                  174 = 2026-2027, 172 = 2025-2026, 160 = 2019-2020, 24 = 2006-2007; the odd ids 175,
                  173, ... are the international ''UA-'' seasons). Internal: the sdv season key is the
                  END year of the ''YYYY-YYYY'' label (174 -> 2027). JSON number: the same id arrives
                  as 22214 or 22214.0 depending on route and season; cast to an integer. Checked against
                  the league''s season.'
                type: number
              teamCityName:
                description: City, uppercase Turkish ('İSTANBUL').
                type: string
              teamCode:
                description: Three-letter team abbreviation ('EFS' = Anadolu Efes).
                type: string
              teamId:
                description: 'Club id (takım = team; key space: TBF clubs, STABLE across seasons and leagues:
                  Tofaş = 13, Anadolu Efes = 2, Beşiktaş = 1). Equals takimID of the player list and takimKodu
                  of team-detail-main. Not a team-season id. JSON number: the same id arrives as 22214
                  or 22214.0 depending on route and season; cast to an integer.'
                type: number
              teamLogoUrl:
                description: Team logo URL.
                type: string
              teamName:
                description: Team name, uppercase.
                type: string
              teamProcessId:
                description: 'Team-season id (teamProcessId = takimIslemId, ''team registration''; key
                  space: TBF team registrations, a NEW id per club per league-season: Tofaş = 265995 in
                  BSL 2026-27). The TeamProcessId parameter of the /Team/ routes. Not the club id (takimID
                  / teamId of the team lists). JSON number: the same id arrives as 22214 or 22214.0 depending
                  on route and season; cast to an integer.'
                type: number
            type: object
          type: array
        isSuccess:
          description: true on every banked sample; false with problemDetails on a 404 (the capture refuses
            anything else).
          type: boolean
        message:
          description: '''Success'' on success ('''' on errors).'
          type: string
        problemDetails:
          description: 'Unobserved: null in every sample. When filled: null on success; on errors an object
            {type, title, status, detail, instance} (Turkish detail: ''Maç bulunamadı.'' = game not found).
            Never banked.'
          x-unobserved: true
      type: object
    TbfWeeks:
      description: 'Response of /League/get-league-weeks: The weeks (rounds) of one league-season, playoff
        rounds included. Scope check: nothing is echoed: only a non-empty week list is required.'
      properties:
        data:
          description: The payload (see the data.* rows).
          items:
            properties:
              devre_Deger:
                description: Phase name in Turkish on playoff weeks ('Playoff Çeyrek Final' = quarter-final,
                  'Playoff Yarı Final' = semi-final, 'Playoff Final' = final); null on regular-season
                  weeks.
                type:
                - string
                - 'null'
              devre_ID:
                description: 'Phase code (devre = half / phase), a number: 1 = first half of the regular
                  season, 2 = second half, 3 = playoff quarter-final, 4 = semi-final, 5 = final (BSL 2025-26).'
                type: number
              display_Text:
                description: 'Week label: ''Hafta N'' (week N) or the playoff round name.'
                type: string
              isCurrentWeek:
                description: true on the current (or last played) week; exactly one row.
                type: boolean
              sezon_Hafta:
                description: Week number as a string ('1'..'30'; '31'-'33' = BSL playoff rounds). The
                  WeekFilter / hafta parameter value.
                type: string
            type: object
          type: array
        isSuccess:
          description: true on every banked sample; false with problemDetails on a 404 (the capture refuses
            anything else).
          type: boolean
        message:
          description: '''Success'' on success ('''' on errors).'
          type: string
        problemDetails:
          description: 'Unobserved: null in every sample. When filled: null on success; on errors an object
            {type, title, status, detail, instance} (Turkish detail: ''Maç bulunamadı.'' = game not found).
            Never banked.'
          x-unobserved: true
      type: object
info:
  description: 'The Turkish Basketball Federation''s official mobile-app backend: every TBF league (BSL,
    TBL, KBSL women, TKBL, TB2L, BGL, ...). Seasons, leagues, weeks, standings, schedules, per-game header,
    box score (2006-07+), play-by-play and shot chart (2025-26+), players, teams, leaders and cups. Plain
    GET, no key, no cookie; robots.txt is 404. Every body is {data, isSuccess, message | count/page fields,
    problemDetails}; field names are Turkish or English, values partly Turkish (glossed in each description).
    Seasons are ''YYYY-YYYY'' with an internal seasonId (174 = 2026-2027); sdv keys a season by its END
    year (2027). Ids may arrive as floats (22214.0). Shapes from captures of 2026-10-12; x-unobserved
    = null in every sample. The vendor origin hosts (*.nikayazilim.com) are NOT documented: they bypass
    TBF''s Cloudflare. Not official or supported.'
  title: TBF app API (miniappapi.tbf.org.tr) - Turkish Basketball Federation
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /Kupalar/maclar-filtreler:
    get:
      description: 'Filter lists (seasons, teams, cities) of one cup competition. Scope check: full: the
        request''s ids are echoed and compared. The activity id must be one season of the cup; another
        season''s id of the same cup returned empty lists (22098 / 20808 probed).'
      operationId: get_tbf_cups
      parameters:
      - description: 'The cup''s activity id of one season (faaliyet_ID of the prefix list: 23538 = men''s
          President''s Cup 2026-27).'
        example: 23538
        in: query
        name: faaliyetId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbfCups'
          description: TBF envelope {data, isSuccess, ...}. Unknown ids often answer 200 with empty or
            zeroed data (refused by the capture).
      summary: Filter lists (seasons, teams, cities) of one cup competition
  /League/get-league-weeks:
    get:
      description: 'The weeks (rounds) of one league-season, playoff rounds included. Scope check: nothing
        is echoed: only a non-empty week list is required. Not scoped: nothing echoes the season or league
        (README list). BSL 2026-27 has 30 weeks, 2025-26 has 33 (31-33 = playoff rounds).'
      operationId: get_tbf_weeks
      parameters:
      - description: TBF season id (174 = 2026-2027; see Season/get-seasons).
        example: 174
        in: query
        name: seasonId
        required: true
        schema:
          type: integer
      - description: Activity id = league-season (22214 = BSL 2026-27; see League/get-leagues-and-seasons-by-prefix
          faaliyet_ID).
        example: 22214
        in: query
        name: leagueId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbfWeeks'
          description: TBF envelope {data, isSuccess, ...}. Unknown ids often answer 200 with empty or
            zeroed data (refused by the capture).
      summary: The weeks (rounds) of one league-season, playoff rounds included
  /League/get-leagues-and-seasons-by-prefix:
    get:
      description: 'Every season of one league (activity per season). Scope check: full: the request''s
        ids are echoed and compared. BSL lists 61 seasons back to 1966-67; TBL and KBSL start in 2015-16.'
      operationId: get_tbf_prefix
      parameters:
      - description: 'League prefix, lowercase: bsl, tbl, kbsl, tkbl, tb2l, bgl, bglk, kbbl, cbek (men''s
          President''s Cup); an unknown prefix returns an empty list.'
        example: bsl
        in: query
        name: prefix
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbfPrefix'
          description: TBF envelope {data, isSuccess, ...}. Unknown ids often answer 200 with empty or
            zeroed data (refused by the capture).
      summary: Every season of one league (activity per season)
  /League/get-leagues-for-filter:
    get:
      description: 'The featured leagues (league-season activities) of one season. Scope check: full:
        the request''s ids are echoed and compared. Lists the 8 featured leagues of the season, not every
        TBF competition (cups and youth leagues are absent).'
      operationId: get_tbf_leagues
      parameters:
      - description: TBF season id (174 = 2026-2027; see Season/get-seasons).
        example: 174
        in: query
        name: seasonId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbfLeagues'
          description: TBF envelope {data, isSuccess, ...}. Unknown ids often answer 200 with empty or
            zeroed data (refused by the capture).
      summary: The featured leagues (league-season activities) of one season
  /League/get-standings-table:
    get:
      description: 'League table of one league-season (latest week, or a given week). Scope check: full:
        the request''s ids are echoed and compared. Numbers as strings in icP / icA / toA / homePoint;
        ids are numbers that may arrive as 266030.0.'
      operationId: get_tbf_standings
      parameters:
      - description: TBF season id (174 = 2026-2027; see Season/get-seasons).
        example: 174
        in: query
        name: seasonId
        required: true
        schema:
          type: integer
      - description: Activity id = league-season (22214 = BSL 2026-27; see League/get-leagues-and-seasons-by-prefix
          faaliyet_ID).
        example: 22214
        in: query
        name: leagueId
        required: true
        schema:
          type: integer
      - description: Week (hafta) to compute the table after; default = the latest week.
        in: query
        name: hafta
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbfStandings'
          description: TBF envelope {data, isSuccess, ...}. Unknown ids often answer 200 with empty or
            zeroed data (refused by the capture).
      summary: League table of one league-season (latest week, or a given week)
  /Match/box-score:
    get:
      description: 'Short box score: starters and bench per side, team totals. Scope check: matchId is
        always null: the team totals'' points must equal the game''s final score. Partly scoped (README
        list): no id is echoed (matchId null), so the team totals must equal the final score.'
      operationId: get_tbf_box
      parameters:
      - description: TBF game id (matchId of the schedule routes).
        example: 346279
        in: query
        name: matchId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbfBox'
          description: TBF envelope {data, isSuccess, ...}. Unknown ids often answer 200 with empty or
            zeroed data (refused by the capture).
      summary: 'Short box score: starters and bench per side, team totals'
  /Match/game-flow:
    get:
      description: 'Play-by-play (Turkish action names), in game order. Scope check: full: the request''s
        ids are echoed and compared. Play-by-play exists in TBF for 2025-26 onward only; older seasons
        return an empty events list (the capture does not ask for them).'
      operationId: get_tbf_flow
      parameters:
      - description: TBF game id (matchId of the schedule routes).
        example: 346279
        in: query
        name: matchId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbfFlow'
          description: TBF envelope {data, isSuccess, ...}. Unknown ids often answer 200 with empty or
            zeroed data (refused by the capture).
      summary: Play-by-play (Turkish action names), in game order
  /Match/get-all-matches-for-filter:
    get:
      description: 'Every game of one league-season week (schedule and results). Scope check: full: the
        request''s ids are echoed and compared. Ids and status codes may arrive as floats (22214.0, 1.0)
        on some seasons and as integers on others: cast.'
      operationId: get_tbf_matches
      parameters:
      - description: Activity id = league-season (22214 = BSL 2026-27; see League/get-leagues-and-seasons-by-prefix
          faaliyet_ID).
        example: 22214
        in: query
        name: ActivityId
        required: true
        schema:
          type: integer
      - description: Week number (sezon_Hafta of get-league-weeks). Without it the route returns only
          the current or last week.
        example: 1
        in: query
        name: WeekFilter
        required: true
        schema:
          type: integer
      - description: Page number, 1-based.
        example: 1
        in: query
        name: Page
        required: true
        schema:
          type: integer
      - description: Rows per page; -1 = all (the capture uses -1 and refuses a partial page).
        example: -1
        in: query
        name: PageSize
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbfMatches'
          description: TBF envelope {data, isSuccess, ...}. Unknown ids often answer 200 with empty or
            zeroed data (refused by the capture).
      summary: Every game of one league-season week (schedule and results)
  /Match/get-daily-matches:
    get:
      description: 'Every TBF game on one date, grouped (optionally one league-season). Scope check: full:
        the request''s ids are echoed and compared. Mixes every TBF competition of the date unless ActivityId
        is given; date-sensitive sample.'
      operationId: get_tbf_daily
      parameters:
      - description: Date 'YYYY-MM-DD' (Turkey local).
        example: '2026-10-11'
        in: query
        name: MatchDate
        required: true
        schema:
          type: string
      - description: true groups the games ('Lig Maçları' = league games).
        example: 'true'
        in: query
        name: GroupByActivity
        required: true
        schema:
          type: boolean
      - description: Activity id = league-season (22214 = BSL 2026-27; see League/get-leagues-and-seasons-by-prefix
          faaliyet_ID).
        in: query
        name: ActivityId
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbfDaily'
          description: TBF envelope {data, isSuccess, ...}. Unknown ids often answer 200 with empty or
            zeroed data (refused by the capture).
      summary: Every TBF game on one date, grouped (optionally one league-season)
  /Match/get-match-report-with-players:
    get:
      description: 'Team comparison report with the best player per stat. Scope check: no id is echoed:
        sY_A / sY_B (points) must equal the game''s final score, macSayisi_A / _B = 1. Partly scoped:
        the points must equal the final score and macSayisi = 1.'
      operationId: get_tbf_report
      parameters:
      - description: TBF game id (matchId of the schedule routes).
        example: 346279
        in: query
        name: matchId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbfReport'
          description: TBF envelope {data, isSuccess, ...}. Unknown ids often answer 200 with empty or
            zeroed data (refused by the capture).
      summary: Team comparison report with the best player per stat
  /Match/mac-header:
    get:
      description: 'Game header: teams, coaches, score, officials, status, Genius id. Scope check: full:
        the request''s ids are echoed and compared. The banked game must be final (matchStatusId 1); its
        activity, team-season ids, tip-off and genuisId are checked.'
      operationId: get_tbf_header
      parameters:
      - description: TBF game id (matchId of the schedule routes).
        example: 346279
        in: query
        name: matchId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbfHeader'
          description: TBF envelope {data, isSuccess, ...}. Unknown ids often answer 200 with empty or
            zeroed data (refused by the capture).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbfProblem'
          description: 'Unknown id: the error envelope with problemDetails (application/json).'
      summary: 'Game header: teams, coaches, score, officials, status, Genius id'
  /Match/mac-istatistik:
    get:
      description: 'Full box score: every player''s shooting, rebounds, assists, +/-, efficiency. Scope
        check: matchId is always null: the team totals'' points must equal the game''s final score. Partly
        scoped like box-score. twoPointShots / threePointShots / freeThrows are MADE counts.'
      operationId: get_tbf_stats
      parameters:
      - description: TBF game id (matchId of the schedule routes).
        example: 346279
        in: query
        name: matchId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbfStats'
          description: TBF envelope {data, isSuccess, ...}. Unknown ids often answer 200 with empty or
            zeroed data (refused by the capture).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbfProblem'
          description: 'Unknown id: the error envelope with problemDetails (application/json).'
      summary: 'Full box score: every player''s shooting, rebounds, assists, +/-, efficiency'
  /Match/mac-leader:
    get:
      description: 'Game leaders per stat category (top 5 per category). Scope check: full: the request''s
        ids are echoed and compared. Top 5 of both teams together per category; value is a number.'
      operationId: get_tbf_leaders
      parameters:
      - description: TBF game id (matchId of the schedule routes).
        example: 346279
        in: query
        name: matchId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbfLeaders'
          description: TBF envelope {data, isSuccess, ...}. Unknown ids often answer 200 with empty or
            zeroed data (refused by the capture).
      summary: Game leaders per stat category (top 5 per category)
  /Match/mac-ozet:
    get:
      description: 'Game summary: period scores, top performers, team comparison. Scope check: full: the
        request''s ids are echoed and compared. Period scores are per period, not cumulative; their sum
        equals the final score (checked).'
      operationId: get_tbf_summary
      parameters:
      - description: TBF game id (matchId of the schedule routes).
        example: 346279
        in: query
        name: matchId
        required: true
