                    STRING ('56').
                  type: string
                faulToplam:
                  description: Season total of personal fouls, an integer as a STRING ('56').
                  type: string
                hrToplam:
                  description: Season total of offensive rebounds (hücum ribaundu), an integer as a STRING
                    ('56').
                  type: string
                ikilikYuzde:
