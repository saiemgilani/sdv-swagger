                puan30Toplam:
                  description: Season total of three-point field goals made, an integer as a STRING ('56').
                  type: string
                puan31Toplam:
                  description: Season total of three-point field goals attempted, an integer as a STRING
                    ('56').
                  type: string
                sA0Toplam:
                  description: Season total of free throws made, an integer as a STRING ('56').
                  type: string
                sA1Toplam:
                  description: Season total of free throws attempted, an integer as a STRING ('56').
                  type: string
                sAyuzde:
