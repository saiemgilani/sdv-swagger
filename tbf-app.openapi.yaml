    TbfReport:
      description: 'Response of /Match/get-match-report-with-players: Team comparison report with the
        best player per stat. Scope check: no id is echoed: sY_A / sY_B (points) must equal the game''s
        final score, macSayisi_A / _B = 1.'
      properties:
        data:
          description: The payload (see the data.* rows).
          properties:
            aHexCode1:
              description: 'Unobserved: null in every sample, so no type and no meaning is claimed. (by
                name: the home team (A) colour 1.)'
              x-unobserved: true
            aHexCode2:
              description: 'Unobserved: null in every sample, so no type and no meaning is claimed. (by
                name: the home team (A) colour 2.)'
              x-unobserved: true
            aS_A:
              description: Total assists (AS, asist) of the home team (A) in the game (integer).
              type: integer
            aS_A_Bar:
              description: 'Bar value of the home team (A)''s assists (AS, asist): the same count as the
                plain field (integer).'
              type: integer
            aS_A_Bar_RENK:
              description: 'Highlight flag (renk = colour) of the home team (A)''s assists (AS, asist):
                1 = this side''s value is the HIGHER of the two (also for fouls and turnovers), 0 = not;
                ties unverified.'
              type: integer
            aS_A_Player:
              description: The home team (A)'s best player in assists (AS, asist).
              properties:
                oyuncuAdi:
                  description: The player's name (oyuncu adı).
                  type: string
                oyuncuKodu:
                  description: 'TBF person id (kişi = person; key space: TBF persons, STABLE across seasons
                    and clubs: Yiğitcan Saybir = 196413). Equals kisiID of the player list, playerId of
                    the box scores and the {playerId} of the profile route. JSON number: the same id arrives
                    as 22214 or 22214.0 depending on route and season; cast to an integer.'
