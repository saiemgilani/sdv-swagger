    TbfBox:
      description: 'Response of /Match/box-score: Short box score: starters and bench per side, team totals.
        Scope check: matchId is always null: the team totals'' points must equal the game''s final score.'
      properties:
        data:
          description: The payload (see the data.* rows).
          properties:
            awayBenchPlayers:
              description: Away bench players.
              items:
                properties:
                  assists:
                    description: Assists (asist).
                    type: integer
                  caption:
                    description: Constant placeholder in every sample (false). By name the captain flag
                      (kaptan); not filled.
                    type: boolean
                  efficiency:
                    description: 'Efficiency rating (verimlilik puanı, PIR: points + rebounds + assists
                      + steals + blocks + fouls drawn - missed shots - turnovers - fouls). Integer on
                      players, number on team totals (92.0).'
                    type: integer
                  image:
                    description: Player photo URL (tbf.org.tr/res/...).
                    type: string
                  isActive:
                    description: Constant placeholder in every sample (false). A UI flag of the app; ignore.
                    type: boolean
                  isHome:
                    description: 'Constant placeholder in every sample (true) on EVERY row of this route,
                      away rows included: use the block name (home*/away*) for the side.'
                    type: boolean
                  isStarter:
                    description: true on the *TopFive rows, false on bench rows.
                    type: boolean
                  jerseyNumber:
                    description: Shirt number (forma no) as a string.
                    type: string
                  minutesPlayed:
                    description: 'Time played ''mm:ss'' (team totals: summed, ''200:00'' = 5 x 40:00,
                      minutes exceed 59).'
                    type: string
                  playerId:
                    description: 'TBF person id (kişi = person; key space: TBF persons, STABLE across
                      seasons and clubs: Yiğitcan Saybir = 196413). Equals kisiID of the player list,
                      playerId of the box scores and the {playerId} of the profile route.'
                    type: integer
                  playerName:
                    description: Player name as 'First Last' ('Yiğitcan Saybir'), mixed case.
                    type: string
                  pno:
                    description: Constant placeholder in every sample (0). By name the Genius LiveStats
                      in-game player number; not filled here.
                    type: integer
                  points:
                    description: Points (sayı).
                    type: integer
                  teamName:
                    description: Constant placeholder in every sample (''). Use the header's team names.
                    type: string
                  totalRebounds:
                    description: Total rebounds (toplam ribaund).
                    type: integer
                type: object
              type: array
            awayTeamTotal:
              description: Away team totals.
              properties:
                assists:
                  description: Assists (asist).
                  type: integer
                efficiency:
