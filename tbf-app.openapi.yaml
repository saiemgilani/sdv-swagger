                    when there were no attempts.
                  type: string
                sayiToplam:
                  description: Season total of points (sayı), an integer as a STRING ('56').
                  type: string
                topCalmaToplam:
                  description: Season total of steals (top çalma), an integer as a STRING ('56').
                  type: string
                topKaybiToplam:
                  description: Season total of turnovers (top kaybı), an integer as a STRING ('56').
                  type: string
                trToplam:
                  description: Season total of total rebounds, an integer as a STRING ('56').
                  type: string
                uclukYuzde:
                  description: Three-point percentage 0-100, a STRING with two decimals ('47.62'); 'NaN'
                    when there were no attempts.
