info:
  description: 'The public read API of the Košarkarska zveza Slovenije competition system (FMS, built
    by OnixWeb), as the kzs.si site calls it. Seasons, every federation competition (men''s Liga OTP banka,
    women''s 1. Ž SKL, lower leagues, cups, youth, 3x3, national teams), matches with their Genius LiveStats
    ids, match headers, box scores, Genius play-by-play with shot x/y, standings, teams, rosters, players
    and leaderboards. No key. Every answer is {status, data}. Season ids are OPAQUE (27 = 2026/2027);
    competition ids are per season; sdv season = the END year of the season name. List pages default to
    150 rows with no truncation signal: send a large limit. Shapes from committed captures in kzs/captures/
    (2026-10-12; personal contact data redacted). x-unobserved = null or [] in every sample. Not official
    or supported.'
  title: KZS FMS public API (Basketball Federation of Slovenia, api.kzs.si)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /competitions/:
    get:
      description: 'Sampled: limit=10000. The default page is 150 of 627 competitions (2026-10-12): send
        limit=10000.'
      operationId: competitions
      parameters:
      - description: 'Rows to return. The default is 150 and the answer does not say it was cut: always
          send a limit larger than the list and treat len(items) == limit as truncated.'
        example: 10000
        in: query
        name: limit
        required: false
        schema: &id001
          type: integer
      - description: 'Season id: OPAQUE, not a year (1 = 2000/2001 ... 27 = 2026/2027, 31 = 1991/1992).
          The season `name` is ''START/END''; the sdv season is the END year (the second half of `name`).'
        in: query
        name: seasonId
        required: false
        schema: *id001
      - description: 'Filter: MALE or FEMALE (site bundle; not diffed).'
        in: query
        name: genders
        required: false
        schema: &id002
          type: string
      - description: 'Filter: category code (site bundle; not diffed).'
        in: query
        name: categories
        required: false
        schema: *id002
      - description: 'Filter: tier code (site bundle; not diffed).'
        in: query
        name: ranks
        required: false
        schema: *id002
      - description: 'Filter: competition type (site bundle; not diffed).'
        in: query
        name: types
        required: false
        schema: *id002
      - description: Sort column (the site sends 'name').
        in: query
        name: sortBy
        required: false
        schema: *id002
      - description: ASC or DESC.
        in: query
        name: sort
        required: false
        schema: *id002
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competitions'
          description: OK envelope
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown id (INVALID_REQUEST) or a bad / missing param (VALIDATION_ERROR).
      summary: Every competition of every season (men, women, youth, 3x3, cups, national teams)
  /competitions/{competitionId}:
    get:
      description: 'Sampled: competitionId=579; competitionId=30; competitionId=9; competitionId=1.'
      operationId: competitions_competitionId
      parameters:
      - description: 'Competition id: one per competition per season (men''s top league 2025-26 = 579,
          2026-27 = 608). Joins to /competitions/{competitionId} and the `competitionId` query params.'
        example: 579
        in: path
        name: competitionId
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionsCompetitionId'
          description: OK envelope
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown id (INVALID_REQUEST) or a bad / missing param (VALIDATION_ERROR).
      summary: 'One competition: season, gender, category, rank and its phases'
  /competitions/{competitionId}/playerStats:
    get:
      description: 'Sampled: competitionId=579&statsCategory=PTS&orderType=AVERAGE&sortBy=avg&sort=DESC&limit=1000.'
      operationId: competitions_competitionId_playerStats
      parameters:
      - description: 'Competition id: one per competition per season (men''s top league 2025-26 = 579,
          2026-27 = 608). Joins to /competitions/{competitionId} and the `competitionId` query params.'
        example: 579
        in: path
        name: competitionId
        required: true
        schema: *id001
      - description: 'Stat to rank by. Required (omitted: 400 VALIDATION_ERROR ''must not be null'').
          PTS points; M_2 / A_2 / PERC_2 two-pointers made / attempted / percentage; M_3 / A_3 / PERC_3
          three-pointers; M_FG / A_FG / PERC_FG field goals; M_FT / A_FT / PERC_FT free throws; R rebounds;
          R_D defensive rebounds; R_O offensive rebounds; ASS assists; ST steals; TOV turnovers; PF_CM
          fouls committed; PF_RV fouls received; ASS_TOV assist-to-turnover ratio; ST_TOV steal-to-turnover
          ratio. Competitions without live stats offer only PTS, M_2, M_3, M_FT, A_FT, PERC_FT (site bundle).'
        example: PTS
        in: query
        name: statsCategory
        required: true
        schema: &id003
          enum:
          - PTS
          - M_2
          - A_2
          - PERC_2
          - M_3
          - A_3
          - PERC_3
          - M_FG
          - A_FG
          - PERC_FG
          - M_FT
          - A_FT
          - PERC_FT
          - R
          - R_D
          - R_O
          - ASS
          - ST
          - TOV
          - PF_CM
          - PF_RV
          - ASS_TOV
          - ST_TOV
          type: string
      - description: 'Ranking mode: AVERAGE (Povprečje, per game), SUM (Seštevek, totals), BEST_PERFORMANCE
          (Rekordi, single-game bests).'
        example: AVERAGE
        in: query
        name: orderType
        required: false
        schema: &id004
          enum:
          - AVERAGE
          - SUM
          - BEST_PERFORMANCE
          type: string
      - description: Column to sort on; the site pairs avg/AVERAGE, sum/SUM, max/BEST_PERFORMANCE.
        example: avg
        in: query
        name: sortBy
        required: false
        schema: &id005
          enum:
          - avg
          - sum
          - max
          type: string
      - description: Sort direction.
        example: DESC
        in: query
        name: sort
        required: false
        schema: &id006
          enum:
          - ASC
          - DESC
          type: string
      - description: 'Rows to return. The default is 150 and the answer does not say it was cut: always
          send a limit larger than the list and treat len(items) == limit as truncated.'
        example: 1000
        in: query
        name: limit
        required: false
        schema: *id001
      - description: Rows to skip (the site pages with limit/offset).
        in: query
        name: offset
        required: false
        schema: *id001
      - description: FETCH (default) returns rows; COUNT returns only `count` (with `items` []).
        in: query
        name: requestType
        required: false
        schema: &id007
          enum:
          - FETCH
          - COUNT
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionsCompetitionIdPlayerStats'
          description: OK envelope
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown id (INVALID_REQUEST) or a bad / missing param (VALIDATION_ERROR).
      summary: Player leaderboard for one stat category
  /competitions/{competitionId}/rounds:
    get:
      description: 'Sampled: competitionId=579.'
      operationId: competitions_competitionId_rounds
      parameters:
      - description: 'Competition id: one per competition per season (men''s top league 2025-26 = 579,
          2026-27 = 608). Joins to /competitions/{competitionId} and the `competitionId` query params.'
        example: 579
        in: path
        name: competitionId
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionsCompetitionIdRounds'
          description: OK envelope
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown id (INVALID_REQUEST) or a bad / missing param (VALIDATION_ERROR).
      summary: Number of rounds per phase of a competition
  /competitions/{competitionId}/teamStats:
    get:
      description: 'Sampled: competitionId=579&statsCategory=PTS&orderType=AVERAGE&sortBy=avg&sort=DESC&limit=1000.'
      operationId: competitions_competitionId_teamStats
      parameters:
      - description: 'Competition id: one per competition per season (men''s top league 2025-26 = 579,
          2026-27 = 608). Joins to /competitions/{competitionId} and the `competitionId` query params.'
        example: 579
        in: path
        name: competitionId
        required: true
        schema: *id001
      - description: 'Stat to rank by. Required (omitted: 400 VALIDATION_ERROR ''must not be null'').
          PTS points; M_2 / A_2 / PERC_2 two-pointers made / attempted / percentage; M_3 / A_3 / PERC_3
          three-pointers; M_FG / A_FG / PERC_FG field goals; M_FT / A_FT / PERC_FT free throws; R rebounds;
          R_D defensive rebounds; R_O offensive rebounds; ASS assists; ST steals; TOV turnovers; PF_CM
          fouls committed; PF_RV fouls received; ASS_TOV assist-to-turnover ratio; ST_TOV steal-to-turnover
          ratio. Competitions without live stats offer only PTS, M_2, M_3, M_FT, A_FT, PERC_FT (site bundle).'
        example: PTS
        in: query
        name: statsCategory
        required: true
        schema: *id003
      - description: 'Ranking mode: AVERAGE (Povprečje, per game), SUM (Seštevek, totals), BEST_PERFORMANCE
          (Rekordi, single-game bests).'
        example: AVERAGE
        in: query
        name: orderType
        required: false
        schema: *id004
      - description: Column to sort on; the site pairs avg/AVERAGE, sum/SUM, max/BEST_PERFORMANCE.
        example: avg
        in: query
        name: sortBy
        required: false
        schema: *id005
      - description: Sort direction.
        example: DESC
        in: query
        name: sort
        required: false
        schema: *id006
      - description: 'Rows to return. The default is 150 and the answer does not say it was cut: always
          send a limit larger than the list and treat len(items) == limit as truncated.'
        example: 1000
        in: query
        name: limit
        required: false
        schema: *id001
      - description: Rows to skip (the site pages with limit/offset).
        in: query
        name: offset
        required: false
        schema: *id001
      - description: FETCH (default) returns rows; COUNT returns only `count` (with `items` []).
        in: query
        name: requestType
        required: false
        schema: *id007
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionsCompetitionIdTeamStats'
          description: OK envelope
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown id (INVALID_REQUEST) or a bad / missing param (VALIDATION_ERROR).
      summary: Team leaderboard for one stat category
  /matches/:
    get:
      description: 'Sampled: competitionId=579&from=2025-10-01T00:00:00.000Z&to=2025-10-31T23:59:59.000Z&limit=1000;
        competitionId=30&limit=1000; competitionId=9&limit=1000; competitionId=1&limit=1000. The default
        page is 150 rows (2025-26 men''s league has 152 matches): send a large limit. Matches carry heavy
        administrative sub-objects (officials, move requests, federation decisions).'
      operationId: matches
      parameters:
      - description: 'Competition id: one per competition per season (men''s top league 2025-26 = 579,
          2026-27 = 608). Joins to /competitions/{competitionId} and the `competitionId` query params.
          Every returned match carries it in `competitions[].competitionId`.'
        example: 579
        in: query
        name: competitionId
        required: false
        schema: *id001
      - description: 'Earliest tip-off, an ISO 8601 instant (''2025-10-01T00:00:00.000Z''). A bare date
          is refused (400 VALIDATION_ERROR: not an Instant).'
        example: '2025-10-01T00:00:00.000Z'
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
      - description: Latest tip-off, an ISO 8601 instant.
        example: '2025-10-31T23:59:59.000Z'
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
      - description: Competition-phase id. Joins to `competitions[].competitionPhaseId` on matches and
          `/competitions/{competitionId}` `phases[].id`. (site bundle; not diffed)
        in: query
        name: competitionPhaseId
        required: false
        schema: *id001
      - description: 'Team id: one club team in one season (Ilirija 2025-26 = 17551). Joins to /teams/{teamId},
          standings `teamId`, box-score `teamId` and the `teamId` query params. (site bundle; not diffed)'
        in: query
        name: teamId
        required: false
        schema: *id001
      - description: Filter by match status, e.g. FINISHED (site bundle; not diffed).
        in: query
        name: status
        required: false
        schema: *id002
