components:
  schemas:
    Competitions:
      description: Every competition of every season (men, women, youth, 3x3, cups, national teams).
      properties:
        data:
          description: Payload.
          properties:
            count:
              description: Always 0 on a FETCH page; the row count only with requestType=COUNT (with `items`
                []).
              type: integer
            items:
              description: 'Rows of this list (the whole list: samples ask for a large `limit`).'
              items:
                properties:
                  category:
                    description: 'Age category: ABSOLUTE (senior) or U8-U23 / ANY (code table in kzs-returns.md).'
                    type: string
                  gender:
                    description: MALE or FEMALE.
                    type: string
                  id:
                    description: 'Competition id: one per competition per season (men''s top league 2025-26
                      = 579, 2026-27 = 608). Joins to /competitions/{competitionId} and the `competitionId`
                      query params.'
                    type: integer
                  name:
                    description: 'Seasons: ''START/END''. Competitions: the Slovenian name (glossary in
                      kzs-returns.md).'
                    type: string
                  rank:
                    description: 'Tier: FIRST-FOURTH or TOURNAMENT (code table).'
                    type: string
                  season:
                    description: The competition's season.
                    properties:
                      active:
                        description: Same as `isActive`.
                        type: boolean
                      id:
                        description: 'Season id: OPAQUE, not a year (1 = 2000/2001 ... 27 = 2026/2027,
                          31 = 1991/1992). The season `name` is ''START/END''; the sdv season is the END
                          year (the second half of `name`).'
                        type: integer
                      isActive:
                        description: True for the current season only (2026/2027 on 2026-10-12).
                        type: boolean
                      name:
                        description: Season, 'START/END' (2025/2026); sdv season = the END year.
                        type: string
                    type: object
                  type:
                    description: Competition type (code table); absent on 2 competitions.
                    type: string
                type: object
              type: array
            limit:
              description: Always 0 (not the page size that was asked).
              type: integer
            offset:
              description: Always 0 (not the paging state).
              type: integer
          type: object
        status:
          description: 'Envelope status: ''OK'' on success (errors answer HTTP 400 with INVALID_REQUEST
            or VALIDATION_ERROR and no `data`).'
          type: string
      type: object
    CompetitionsCompetitionId:
      description: 'One competition: season, gender, category, rank and its phases.'
      properties:
        data:
          description: Payload.
          properties:
            category:
              description: 'Age category: ABSOLUTE (senior) or U8-U23 / ANY (code table in kzs-returns.md).'
              type: string
            gender:
              description: MALE or FEMALE.
              type: string
            id:
              description: 'Competition id: one per competition per season (men''s top league 2025-26
                = 579, 2026-27 = 608). Joins to /competitions/{competitionId} and the `competitionId`
                query params.'
              type: integer
            name:
              description: Competition name, Slovenian (glossary in kzs-returns.md).
              type: string
            phases:
              description: 'Per phase: the phase and its table.'
              items:
                properties:
                  endDate:
                    description: Phase end date (UTC midnight).
                    type: string
                  groups:
                    description: Groups of the phase (empty when the phase has one table).
                    items:
                      properties:
                        id:
                          description: Group id within a phase (e.g. the championship and relegation groups
                            of a split season).
                          type: integer
                        name:
                          description: 'Group name, Slovenian: ''Liga za prvaka'' = championship group,
                            ''Liga za obstanek'' = relegation group.'
                          type: string
                      type: object
                    type: array
                  id:
                    description: Competition-phase id. Joins to `competitions[].competitionPhaseId` on
                      matches and `/competitions/{competitionId}` `phases[].id`.
                    type: integer
                  name:
                    description: 'Phase name, Slovenian: ''Redni del'' = regular season, ''Četrtfinale''
                      = quarterfinal, ''Polfinale'' = semifinal, ''Finale'' = final, ''1. del'' / ''2.
                      del'' = first / second stage.'
                    type: string
                  startDate:
                    description: Phase start date (UTC midnight).
                    type: string
                  type:
                    description: Phase format (code table).
                    type: string
                  winsNeeded:
                    description: Wins needed to take a best-of series.
                    type: integer
                type: object
              type: array
            rank:
              description: 'Tier: FIRST-FOURTH or TOURNAMENT (code table).'
              type: string
            season:
              description: The season.
              properties:
                active:
                  description: Same as `isActive`.
                  type: boolean
                id:
                  description: 'Season id: OPAQUE, not a year (1 = 2000/2001 ... 27 = 2026/2027, 31 =
                    1991/1992). The season `name` is ''START/END''; the sdv season is the END year (the
                    second half of `name`).'
                  type: integer
                isActive:
                  description: True for the current season only (2026/2027 on 2026-10-12).
                  type: boolean
                name:
                  description: Season, 'START/END' (2025/2026); sdv season = the END year.
                  type: string
              type: object
            socialMedias:
              description: 'Unobserved: null, or an empty array, in every sample, so its type and meaning
                are unconfirmed.'
              x-unobserved: true
            type:
              description: Competition type (code table).
              type: string
          type: object
        status:
          description: 'Envelope status: ''OK'' on success (errors answer HTTP 400 with INVALID_REQUEST
            or VALIDATION_ERROR and no `data`).'
          type: string
      type: object
    CompetitionsCompetitionIdPlayerStats:
      description: Player leaderboard for one stat category.
      properties:
        data:
          description: Payload.
          properties:
            count:
              description: Always 0 on a FETCH page; the row count only with requestType=COUNT (with `items`
                []).
              type: integer
            items:
              description: 'Rows of this list (the whole list: samples ask for a large `limit`).'
              items:
                properties:
                  average:
                    description: Per-game average of the statsCategory.
                    type: number
                  clubCode:
                    description: Club 3-letter code.
                    type: string
                  clubFullname:
                    description: Club's full legal name.
                    type: string
                  clubId:
                    description: 'Club id: the club across seasons and categories (Ilirija = 16). No captured
                      route is keyed by it.'
                    type: integer
                  clubLogoUuid:
                    description: Club logo file id.
                    type: string
                  gamesPlayed:
                    description: Games the player / team played in the competition.
                    type: integer
                  max:
                    description: Single-game best of the statsCategory.
                    type: number
                  photoUuid:
                    description: Player photo file id.
                    type: string
                  playerFirstname:
                    description: Player first name.
                    type: string
                  playerId:
                    description: Player id (KZS player registry). Joins to /players/{playerId}, box-score
                      and play-by-play `playerId`.
                    type: integer
                  playerLastname:
                    description: Player last name.
                    type: string
                  sum:
                    description: Season total of the requested statsCategory.
                    type: number
                  teamId:
                    description: 'Team id: one club team in one season (Ilirija 2025-26 = 17551). Joins
                      to /teams/{teamId}, standings `teamId`, box-score `teamId` and the `teamId` query
                      params.'
                    type: integer
                  teamName:
                    description: Team name.
                    type: string
                type: object
              type: array
            limit:
              description: Always 0 (not the page size that was asked).
              type: integer
            offset:
              description: Always 0 (not the paging state).
              type: integer
          type: object
        status:
          description: 'Envelope status: ''OK'' on success (errors answer HTTP 400 with INVALID_REQUEST
            or VALIDATION_ERROR and no `data`).'
          type: string
      type: object
    CompetitionsCompetitionIdRounds:
      description: Number of rounds per phase of a competition.
      properties:
        data:
          description: Payload.
          properties:
            phases:
              description: 'Per phase: the phase and its table.'
              items:
                properties:
                  id:
                    description: Competition-phase id. Joins to `competitions[].competitionPhaseId` on
                      matches and `/competitions/{competitionId}` `phases[].id`.
                    type: integer
                  rounds:
                    description: Number of rounds in the phase.
                    type: integer
                type: object
              type: array
          type: object
        status:
          description: 'Envelope status: ''OK'' on success (errors answer HTTP 400 with INVALID_REQUEST
            or VALIDATION_ERROR and no `data`).'
          type: string
      type: object
    CompetitionsCompetitionIdTeamStats:
      description: Team leaderboard for one stat category.
      properties:
        data:
          description: Payload.
          properties:
            count:
              description: Always 0 on a FETCH page; the row count only with requestType=COUNT (with `items`
                []).
              type: integer
            items:
              description: 'Rows of this list (the whole list: samples ask for a large `limit`).'
              items:
                properties:
                  average:
                    description: Per-game average of the statsCategory.
                    type: number
                  clubCode:
                    description: Club 3-letter code.
                    type: string
                  clubFullname:
                    description: Club's full legal name.
                    type: string
                  clubId:
                    description: 'Club id: the club across seasons and categories (Ilirija = 16). No captured
                      route is keyed by it.'
                    type: integer
                  clubLogoUuid:
                    description: Club logo file id.
                    type: string
                  gamesPlayed:
                    description: Games the player / team played in the competition.
                    type: integer
                  max:
                    description: Single-game best of the statsCategory.
                    type: number
                  sum:
                    description: Season total of the requested statsCategory.
                    type: number
                  teamId:
                    description: 'Team id: one club team in one season (Ilirija 2025-26 = 17551). Joins
                      to /teams/{teamId}, standings `teamId`, box-score `teamId` and the `teamId` query
                      params.'
                    type: integer
                  teamName:
                    description: Team name.
                    type: string
                type: object
              type: array
            limit:
              description: Always 0 (not the page size that was asked).
              type: integer
            offset:
              description: Always 0 (not the paging state).
              type: integer
          type: object
        status:
          description: 'Envelope status: ''OK'' on success (errors answer HTTP 400 with INVALID_REQUEST
            or VALIDATION_ERROR and no `data`).'
          type: string
      type: object
    Error:
      properties:
        errorMessage:
          description: English message, e.g. 'Match with id 99999999 does not exist'.
          type: string
        status:
          description: INVALID_REQUEST (unknown id) or VALIDATION_ERROR (bad or missing param).
          type: string
        validationErrorDetails:
          description: 'VALIDATION_ERROR only: `fieldErrors` maps each bad param to a message.'
          type: object
      type: object
    Matches:
      description: Matches of a competition (optionally in a from/to window), with the Genius LiveStats
        link.
      properties:
        data:
          description: Payload.
          properties:
            count:
              description: Always 0 on a FETCH page; the row count only with requestType=COUNT (with `items`
                []).
              type: integer
            items:
              description: 'Rows of this list (the whole list: samples ask for a large `limit`).'
              items:
                properties:
                  attendance:
                    description: Spectators (0 when not recorded).
                    type: integer
                  commissioner:
                    description: Match commissioner (technical delegate).
                    properties:
                      id:
                        description: Official id (referee/commissioner registry); a different key space
                          from `person.id`. /referees/ and /commissioners/ are in the site bundle but
                          not captured.
                        type: integer
                      person:
                        description: The person record.
                        properties:
                          addressesPostOfficeName:
                            description: 'Home town(s): REDACTED in the captures (personal data; README).'
                            items:
                              type: string
                            type: array
                          firstName:
                            description: First name.
                            type: string
                          gender:
                            description: MALE or FEMALE.
                            type: string
                          id:
                            description: 'Person id: the federation''s person record behind a player,
                              coach or official; a different key space from player, coach and official
                              ids.'
                            type: integer
                          lastName:
                            description: Last name.
                            type: string
                        type: object
                      ranks:
                        description: 'Unobserved: null, or an empty array, in every sample, so its type
                          and meaning are unconfirmed.'
                        x-unobserved: true
                    type: object
                  competitions:
                    description: Competitions the match belongs to (one row per competition).
                    items:
                      properties:
                        competitionId:
                          description: 'Competition id: one per competition per season (men''s top league
                            2025-26 = 579, 2026-27 = 608). Joins to /competitions/{competitionId} and
                            the `competitionId` query params.'
                          type: integer
                        competitionName:
                          description: 'Competition name (Slovenian; the sponsor name changes: Liga Telemach
                            2007-15, NovaKBM 2015-24, OTP banka 2024-).'
                          type: string
                        competitionPhaseId:
                          description: Competition-phase id. Joins to `competitions[].competitionPhaseId`
                            on matches and `/competitions/{competitionId}` `phases[].id`.
                          type: integer
                        competitionPhaseName:
                          description: Phase name, Slovenian ('Redni del' = regular season, '1. del' =
                            first stage).
                          type: string
                        competitionType:
                          description: Competition type (code table).
                          type: string
                        id:
                          description: Match-competition link id (this match in this competition); NOT
                            the competition id (that is `competitionId`).
                          type: integer
                        seasonId:
                          description: 'Season id: OPAQUE, not a year (1 = 2000/2001 ... 27 = 2026/2027,
                            31 = 1991/1992). The season `name` is ''START/END''; the sdv season is the
                            END year (the second half of `name`).'
                          type: integer
                        transferred:
                          description: True when the match was carried over from an earlier phase (results
                            transferred).
                          type: boolean
                      type: object
                    type: array
                  conclusions:
                    description: Federation decisions attached to the match (warnings, fines), Slovenian
                      HTML.
                    items:
                      properties:
                        club:
                          description: The club.
                          properties:
                            absoluteTeams:
                              description: 'Unobserved: null, or an empty array, in every sample, so its
                                type and meaning are unconfirmed.'
                              x-unobserved: true
                            addresses:
                              description: Club addresses.
                              items:
                                properties:
                                  houseNumber:
                                    description: 'House number (a string: ''6 A'').'
                                    type: string
                                  id:
                                    description: Address id.
                                    type: integer
                                  postOffice:
                                    description: Post office (town) of the address.
                                    properties:
                                      country:
                                        description: Country, ISO 3166-1 alpha-2 (SI).
                                        type: string
                                      id:
                                        description: Post-office id (FMS internal).
                                        type: integer
                                      municipality:
                                        description: Municipality, upper case.
                                        type: string
                                      name:
                                        description: Post-office town.
                                        type: string
                                      zipCode:
                                        description: Postal code.
                                        type: string
                                    type: object
                                  street:
                                    description: Street name of the address.
                                    type: string
                                  type:
                                    description: 'Address kind: PRIMARY.'
                                    type: string
                                type: object
                              type: array
                            bankAccounts:
                              description: Club bank accounts.
                              items:
                                properties:
                                  bankName:
                                    description: Bank name.
                                    type: string
                                  iban:
                                    description: 'Club IBAN: REDACTED in the captures.'
                                    type: string
                                  id:
                                    description: Bank-account id.
                                    type: integer
                                  isSepa:
                                    description: True for a SEPA account.
                                    type: boolean
                                  swiftCode:
                                    description: 'Bank SWIFT/BIC: REDACTED in the captures.'
                                    type: string
                                  type:
                                    description: 'Account kind: PRIMARY.'
                                    type: string
                                type: object
                              type: array
                            code:
                              description: Club 3-letter code.
                              type: string
                            email:
                              description: 'Contact email: REDACTED in the captures.'
                              type: string
                            fullName:
                              description: Club's full legal name.
                              type: string
                            guestJerseyColor:
                              description: Away jersey colour, hex.
                              type: string
                            homeJerseyColor:
                              description: Home jersey colour, hex '#RRGGBB'.
                              type: string
                            id:
                              description: 'Club id: the club across seasons and categories (Ilirija =
                                16). No captured route is keyed by it.'
                              type: integer
                            identificationNumber:
                              description: Club company registration number (matična številka), a public
                                business-register id.
                              type: string
                            logoUuid:
                              description: Club logo file id.
                              type: string
                            member:
                              description: True when the club is a KZS member (false on nested copies
                                that omit it).
                              type: boolean
                            personnel:
                              description: 'Unobserved: null, or an empty array, in every sample, so its
                                type and meaning are unconfirmed.'
                              x-unobserved: true
                            phone:
                              description: 'Contact phone: REDACTED in the captures ('''' when none).'
                              type: string
                            scoresheetEmail:
                              description: 'Email(s) the scoresheet goes to: REDACTED in the captures.'
                              type: string
                            shortName:
                              description: Club short name.
                              type: string
                            socialMedias:
                              description: Social-media links (empty in every competition sample).
                              items:
                                properties:
                                  active:
                                    description: True when the link is shown.
                                    type: boolean
                                  id:
                                    description: Social-media link id.
                                    type: integer
                                  socialMediaType:
                                    description: 'Network: FACEBOOK, INSTAGRAM, ...'
                                    type: string
                                  url:
                                    description: Link.
                                    type: string
                                type: object
                              type: array
                            sportHalls:
                              description: 'Unobserved: null, or an empty array, in every sample, so its
                                type and meaning are unconfirmed.'
                              x-unobserved: true
                            status:
                              description: 'Club status: ACTIVE, ...'
                              type: string
                            taxLiable:
                              description: True when the club is VAT-registered.
                              type: boolean
                            taxNumber:
                              description: 'Club VAT number: REDACTED in the captures.'
                              type: string
                            type:
                              description: 'Organisation kind: CLUB.'
                              type: string
                          type: object
                        id:
                          description: Decision id.
                          type: integer
                        index:
                          description: Order of the decision on the match.
                          type: integer
                        originalText:
                          description: Decision template with the `$club` placeholder unfilled.
                          type: string
                        penaltyAmountEur:
                          description: Fine, euros (0.0 for a warning).
                          type: number
                        text:
                          description: Decision text, Slovenian HTML (e.g. 'se zadolži, da ...' = 'is
                            obliged to ...').
                          type: string
                        type:
                          description: 'Decision kind: WARNING, OTHER, ...'
                          type: string
                      type: object
                    type: array
                  dateTime:
                    description: Tip-off, UTC (ISO 8601 'Z').
                    type: string
                  delegated:
                    description: True once officials are assigned to the match.
                    type: boolean
                  delegationChanges:
                    description: History of official assignments.
                    items:
                      properties:
                        id:
                          description: Assignment-change id.
                          type: integer
                        newOfficial:
                          description: The official assigned.
                          properties:
                            id:
                              description: Official id (referee/commissioner registry); a different key
                                space from `person.id`. /referees/ and /commissioners/ are in the site
                                bundle but not captured.
                              type: integer
                            person:
                              description: The person record.
                              properties:
                                addressesPostOfficeName:
                                  description: 'Unobserved: null, or an empty array, in every sample,
                                    so its type and meaning are unconfirmed.'
                                  x-unobserved: true
                                anonymized:
                                  description: True when the person record is anonymised (GDPR).
                                  type: boolean
                                firstName:
                                  description: First name.
                                  type: string
                                fullName:
                                  description: Full name.
                                  type: string
                                gender:
                                  description: MALE or FEMALE.
                                  type: string
                                id:
                                  description: 'Person id: the federation''s person record behind a player,
                                    coach or official; a different key space from player, coach and official
                                    ids.'
                                  type: integer
                                lastName:
                                  description: Last name.
                                  type: string
                              type: object
                          type: object
                        reason:
                          description: 'Why the official was (re)assigned: INITIAL (first assignment),
                            ...'
                          type: string
                        timestamp:
                          description: When the change was recorded, UTC with microseconds.
                          type: string
                        type:
                          description: 'Role assigned: REFEREE1, REFEREE2, REFEREE3, COMMISSIONER, ...'
                          type: string
                      type: object
                    type: array
                  fibaLiveStatsUrl:
                    description: Genius Sports LiveStats URL 'https://fibalivestats.dcd.shared.geniussports.com/u/KZS/{geniusMatchId}/';
                      the number is the Genius match id that keys genius-livestats/ data.json. Absent
                      before 2015-16 (no live stats).
                    type: string
                  firstTeamCode:
                    description: First team 3-letter code (club code).
                    type: string
                  firstTeamId:
                    description: 'Match-team id: this team''s entry in this one match (unique per match
                      and side). Joins to play-by-play `matchTeamId`; NOT a team id. First (home) side.'
                    type: integer
                  firstTeamLogoUuid:
                    description: First team logo file id (served from the FMS storage host api.kzs.si).
                    type: string
                  firstTeamName:
                    description: First (home) team name.
                    type: string
                  firstTeamScore:
                    description: First (home) team final score.
                    type: integer
                  firstTeamShortName:
                    description: First team short name ('' when none).
                    type: string
                  firstTeamTeamId:
                    description: 'Team id: one club team in one season (Ilirija 2025-26 = 17551). Joins
                      to /teams/{teamId}, standings `teamId`, box-score `teamId` and the `teamId` query
