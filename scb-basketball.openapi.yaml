components:
  schemas:
    Games:
      description: Games of a season, paged.
      properties:
        currentPage:
          description: Page number of this answer (1-based).
          type: integer
        items:
          description: Rows of this page.
          items:
            properties:
              bettingOdds:
                description: Betting odds; [] in every sample.
                items: {}
                type: array
              coachComments:
                description: Post-game coach quotes.
                items:
                  properties:
                    content:
                      description: Quote text, German or English free text (not translated by the API).
                      type: string
                    seasonCoach:
                      description: The quoted coach.
                      properties:
                        firstName:
                          description: Coach's given name.
                          type: string
                        id:
                          description: Coach id (coach key space; no captured route is keyed by it).
                          type: string
                        imageUrl:
                          description: Coach portrait URL.
                          type: string
                        isHeadCoach:
                          description: True for the head coach.
                          type: boolean
                        lastName:
                          description: Coach's family name.
                          type: string
                        seasonTeam:
                          description: The team.
                          properties:
                            id:
                              description: Club id; equal to `seasonTeamId` in every sample. Joins to
                                /teams/{teamId}.
                              type: string
                            logoUrl:
                              description: Logo image URL (per season).
                              type: string
                            name:
                              description: Team name as listed that season (sponsor names included, e.g.
                                'EWE Baskets Oldenburg').
                              type: string
                          type: object
                      type: object
                  type: object
                type: array
              commissioner:
                description: Game commissioner (Kommissar); null when not assigned.
                properties:
                  birthDate:
                    description: Date of birth, YYYY-MM-DD.
                    type: string
                  firstName:
                    description: Official's given name.
                    type: string
                  imageUrl:
                    description: Official portrait URL.
                    type: string
                  lastName:
                    description: Official's family name.
                    type: string
                  officialFunction:
                    description: REFEREE or COMMISSIONER.
                    type: string
                  participations:
                    description: League games officiated.
                    type: integer
                  profession:
                    description: Civil profession, German free text (e.g. Arzt = physician, Gymnasiallehrer
                      = secondary-school teacher).
                    type: string
                  refId:
                    description: 'Official id; joins to /referees `refId` (= its `id`). /referees lists
                      only the current officials (44), so older games'' officials can be missing there:
                      all 40 of 2026-27''s matched, 6 of 10 of 2008-09''s.'
                    type: string
                  salutation:
                    description: Salutation (German Herr = Mr, Frau = Ms); empty in every sample.
                    type: string
                  yearJoinedBBL:
                    description: Year the official joined the league, sent as a string; can be the placeholder
                      'TODO_YEARJOINEDBBL'.
                    type: string
                type:
                - object
                - 'null'
              competition:
                description: 'Competition: BBL, BBL_CUP (Pokal), ALLSTAR, CHAMPIONS_CUP on the BBL host;
                  DBBL, DBBL_CUP on the DBBL host.'
                type: string
              gameTime:
                description: 'Game clock as HH:MM:SS: in an action, the time LEFT in the period (00:10:00
                  at the start of a 10-minute quarter); in a game header, 00:00:00 in every sample.'
                type: string
              guestTeam:
                description: Guest team.
                properties:
                  foreignLink:
                    description: Link to the team or player on the 2. Basketball Bundesliga site when
                      the side is not a BBL club; empty or null otherwise.
                    type: string
                  isForeign:
                    description: The team is not in this league (cup opponents from the ProA / ProB).
                    type: boolean
                  last10Losses:
                    description: Losses in the last 10 games.
                    type: integer
                  last10Outcomes:
                    description: 'Results of the last games, newest first: W or L.'
                    items:
                      type: string
                    type: array
                  last10Victories:
                    description: Wins in the last 10 games.
                    type: integer
                  logoUrl:
                    description: Logo image URL (per season).
                    type: string
                  magentaSportId:
                    description: MagentaSport id; the placeholder 'TODO_MAGENTASPORTID' in every sample.
                    type: string
                  name:
                    description: Team name as listed that season (sponsor names included, e.g. 'EWE Baskets
                      Oldenburg').
                    type: string
                  rank:
                    description: The team's current table position.
                    type: integer
                  seasonTeamId:
                    description: Season-team id; equal to the club `teamId` in every sample (BBL 2005-2026,
                      DBBL 2024-2026).
                    type: string
                  streak:
                    description: 'Current streak: W or L; empty when none.'
                    type: string
                  streakCount:
                    description: Length of the current streak.
                    type: integer
                  teamId:
                    description: Club id; equal to `seasonTeamId` in every sample. Joins to /teams/{teamId}.
                    type: string
                  ticketPhone:
                    description: Ticket hotline, free text (sometimes with a URL appended).
                    type:
                    - string
                    - 'null'
                  ticketUrl:
                    description: Ticket shop URL.
                    type:
                    - string
                    - 'null'
                  tlc:
                    description: Three-letter club code.
                    type: string
                  totalGames:
                    description: Games played. An integer sent as a string (e.g. '0').
                    type: string
                type: object
              homeTeam:
                description: Home team.
                properties:
                  foreignLink:
                    description: Link to the team or player on the 2. Basketball Bundesliga site when
                      the side is not a BBL club; empty or null otherwise.
                    type: string
                  isForeign:
                    description: The team is not in this league (cup opponents from the ProA / ProB).
