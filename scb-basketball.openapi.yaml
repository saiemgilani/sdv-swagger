                - string
              tvType:
                description: TV coverage type; empty or null in every sample.
                type: string
              venue:
                description: Arena.
                properties:
                  address:
                    description: Postal address, German.
                    type: string
                  capacity:
                    description: Arena capacity, spectators.
                    type: integer
                  id:
                    description: Arena id, stable across seasons (Uber Arena = 2 in both 2025-26 and 2026-27);
                      a different key space from /teams `seasonVenues.id`, and no captured route is keyed
                      by it. A string in /games and /games/{gameId}, an integer in /games/recent.
                    type: string
                  isMain:
                    description: The club's main arena.
                    type: boolean
                  name:
                    description: Arena name.
                    type: string
                type:
                - object
                - 'null'
              videos:
                description: Highlight and preview videos.
                items:
                  properties:
                    height:
                      description: Video height, pixels.
                      type: number
                    hlsManifestUrl:
                      description: HLS (m3u8) manifest URL of the video.
                      type: string
                    imageURL:
                      description: Video poster image URL.
                      type: string
                    type:
                      description: 'Video kind: GAME_HIGHLIGHTS, GAME_PREVIEW.'
                      type: string
                    width:
                      description: Video width, pixels.
                      type: integer
                  type: object
                type: array
            type: object
          type: array
        pageSize:
          description: Rows per page, as asked.
          type: integer
        totalPages:
          description: Pages available at this pageSize.
          type: integer
      type: object
