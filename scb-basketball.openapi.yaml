    GamesGameIdStats:
      description: Box score, play-by-play actions (shot x/y) and PDF report links.
      properties:
        actions:
          description: Play-by-play actions in game order (empty before 2008-09).
          items:
            properties:
              actionIdentifier:
                description: Provider action key `<n>:<seq>` (opaque; the first part is not the period).
                type: string
              assistingSeasonPlayerId:
                description: Season-player id of the assisting player; only on assisted made shots. Joins
                  to box-score `seasonPlayer.id` and action `seasonPlayerId`.
                type: string
              coordinates:
                description: 'Shot location on the site''s half-court chart, in SVG units, not metres.
                  Both teams are drawn toward the same basket: x runs across the court from one sideline
                  (0) to the other (about 280; centre 140); y runs along the court from behind the baseline
                  toward midcourt. The rim sits near (140, 45), the top of the 3-point arc near y 147,
                  the corner-3 lines near x 20 and 260. Scale inferred from shot clusters, so roughly
                  18.7 units per metre across and 15 per metre along: unverified. Only field-goal attempts
                  carry a location; every other action, and shots on games without tracking (most before
                  2011), are (0, 0). The site plots home shots on the left half (screen x = y, screen
                  y = 285 - x) and guest shots on the right (screen x = 460 - y, screen y = x) of a 460
                  x 280 overlay.'
                properties:
                  x:
                    description: 'Shot x, across the court: 0 and ~280 are the sidelines, 140 the centre
                      line through the rim. See `coordinates`.'
                    type: integer
                  y:
                    description: 'Shot y, along the court away from the basket: the rim is near 45, the
                      top of the arc near 147. See `coordinates`.'
                    type: integer
                type: object
              gameTime:
                description: 'Game clock as HH:MM:SS: in an action, the time LEFT in the period (00:10:00
                  at the start of a 10-minute quarter); in a game header, 00:00:00 in every sample.'
                type: string
              guestTeamPoints:
                description: Guest score after this action; only on scoring actions.
                type: integer
              homeTeamPoints:
                description: Home score after this action; only on scoring actions.
                type: integer
              id:
                description: Action id, unique across games.
                type: integer
              isSuccessful:
                description: Made / successful (shots, free throws); for other types see the action-type
                  table.
                type: boolean
              orderId:
                description: Chronological sequence of the action within the game.
                type: integer
              period:
                description: 'Period: 1-4 quarters, 5+ overtimes.'
                type: integer
              qualifiers:
                description: Action qualifiers (shot kind, rebound side, foul kind, turnover kind); see
                  the qualifier table.
                items:
                  type: string
                type: array
              realTime:
                description: 'Wall-clock time of the action, ISO 8601 UTC. Pre-2011 games carry a placeholder:
                  local midnight of the game day (23:00 UTC the day before) on every row.'
                type: string
              seasonPlayerId:
                description: 'Season-player id: one player''s engagement with one club (kept across seasons
