                description: 'Stage: MAIN_ROUND (Hauptrunde, regular season), PLAYINS, FIRST_ROUND, SECOND_ROUND,
                  ROUND_OF_16 (Achtelfinale), ROUND_OF_8 (Viertelfinale), SEMI_FINALS, FINALS, THIRD_PLACE_GAME,
                  QUALIFICATION, GROUP_STAGE.'
                type: string
              status:
                description: 'Game status: PRE (scheduled), LIVE, POST (ended, not yet official), OFFICIAL
                  (final).'
                type: string
              topScore:
                description: Points of the game's top scorer; null before the game.
                type:
                - integer
                - 'null'
              topScorer:
                description: The game's top scorer (player profile).
                properties:
                  birthDate:
                    description: Date of birth, YYYY-MM-DD.
                    type: string
                  firstName:
                    description: Player's given name.
                    type: string
                  height:
                    description: 'Height in metres (float32 noise: 1.77 arrives as 1.7699999809265137).'
                    type: number
                  id:
                    description: 'BBL: the season-player id (a string, equal to `playerId`). DBBL: a third
                      key space (e.g. 350, 4832) that matches no other captured id; use `playerId` there.'
                    type: string
                  imageUrl:
                    description: Player portrait URL (per season).
                    type: string
                  isActive:
                    description: Player-profile flag; meaning unverified (not the season's `isActive`).
                    type: boolean
                  isAllStar:
                    description: All-Star selection flag.
                    type: boolean
                  isVisible:
                    description: Shown on the site.
                    type: boolean
                  isYoung:
                    description: Young-player flag (German-trained youth rule; inferred).
                    type: boolean
                  lastName:
                    description: Player's family name.
                    type: string
                  nationalities:
                    description: Nationalities, ISO 3166-1 alpha-2 codes.
                    items:
                      type:
                      - string
                      - 'null'
                    type: array
                  playerId:
                    description: 'Season-player id. BBL: a string equal to `id`. DBBL: an INTEGER that
                      matches /seasons/{seasonId} `seasonPlayerId` (5 of 5 rows checked, 2026-27). Joins
                      to /season-players/{seasonPlayerId}.'
                    type:
                    - integer
                    - string
                  playerSourceId:
                    description: Provider source id of the person; equal to `realPlayerId` in every sample.
                    type: integer
                  position:
                    description: 'Position: POINT_GUARD, SHOOTING_GUARD, SMALL_FORWARD, POWER_FORWARD,
                      CENTER.'
                    type:
                    - string
                    - 'null'
                  previousTeams:
                    description: Former clubs, free text (German names).
                    items: {}
                    type: array
                  realPlayerId:
                    description: 'Global person id: the same across clubs and seasons. Joins to `realPlayerId`
                      everywhere.'
                    type: integer
                  seasonId:
                    description: Season, START year (2026 = 2026-27).
                    type: integer
                  seasonTeamId:
                    description: Season-team id; equal to the club `teamId` in every sample (BBL 2005-2026,
                      DBBL 2024-2026).
                    type: string
                  shirtNumber:
                    description: Jersey number.
                    type: integer
                  socialMediaLinks:
                    description: Social media URLs; [""] when none.
                    items:
                      type: string
                    type: array
                  weight:
                    description: Weight in kg; 0 when unknown.
                    type: integer
                  yearJoinedBBL:
                    description: Year the player joined the league, sent as a string; can be the placeholder
                      'TODO_YEARJOINEDBBL'.
                    type: string
                type:
                - object
                - 'null'
              tvChannel:
                description: Broadcasters; an empty string instead of [] when none.
                items:
                  properties:
                    channelId:
                      description: Broadcaster id.
                      type: integer
                    logo:
                      description: Broadcaster logo URL.
                      type: string
                    name:
                      description: Broadcaster name.
                      type: string
                    url:
                      description: Broadcaster or stream URL.
                      type: string
                  type: object
