                  description: 'Season-player id: one player''s engagement with one club (kept across
                    seasons while he stays, new after a move; see README). Joins to box-score `seasonPlayer.id`,
                    action `seasonPlayerId` and /season-players/{seasonPlayerId}.'
                  type: string
                imageUrl:
                  description: Player portrait URL (per season).
                  type: string
                isAllStar:
                  description: All-Star selection flag.
                  type: boolean
                isVisible:
                  description: Shown on the site. A 0/1 integer here.
                  type: integer
                isYoung:
                  description: Young-player flag (German-trained youth rule; inferred).
                  type: boolean
                lastName:
                  description: Player's family name.
                  type: string
                nationalities:
                  description: Nationalities, ISO 3166-1 alpha-2 codes.
                  items:
                    type: string
                  type: array
                playerId:
                  description: Season-player id again (equal to `id` / `seasonPlayerId` here). NOT the
                    /seasons `playerId`.
                  type: string
                playerSourceId:
                  description: Provider source id of the person; equal to `realPlayerId` in every sample.
                  type: integer
                position:
                  description: 'Position: POINT_GUARD, SHOOTING_GUARD, SMALL_FORWARD, POWER_FORWARD, CENTER.'
                  type: string
                previousTeams:
                  description: Former clubs, free text (German names).
                  items:
                    type: string
                  type: array
                realPlayerId:
                  description: 'Global person id: the same across clubs and seasons. Joins to `realPlayerId`
                    everywhere.'
                  type: integer
                seasonId:
                  description: Season, START year (2026 = 2026-27).
                  type: integer
                seasonTeamId:
                  description: Season-team id; equal to the club `teamId` in every sample (BBL 2005-2026,
                    DBBL 2024-2026).
                  type: string
                shirtNumber:
                  description: Jersey number. An integer sent as a string (e.g. '0').
                  type: string
                socialMediaLinks:
                  description: Social media URLs; [""] when none.
                  items: {}
                  type: array
                weight:
                  description: Weight in kg; 0 when unknown.
                  type: integer
              type: object
            type: array
          team:
            description: The club.
            properties:
              address:
                description: Postal address, German.
                type: string
              bestAchievements:
                description: Honours, German free text (Deutscher Meister = German champion, Pokalsieger
                  = cup winner, Vizepokalsieger = cup runner-up).
                type:
                - string
                - 'null'
              contactPhone:
                description: Club phone, free text.
                type: string
              email:
                description: Club e-mail.
                type: string
              homepageUrl:
                description: Club website.
                type: string
              id:
                description: Club id; equal to `seasonTeamId` in every sample. Joins to /teams/{teamId}.
                type: string
              logoUrl:
                description: Logo image URL (per season).
                type: string
              mascot:
                description: Club mascot.
                type:
                - string
                - 'null'
              nameFull:
                description: Full club name.
                type: string
              nameShort:
                description: Short name (often the city); null on DBBL.
                type: string
              orderId:
                description: Display order of the club on the site; null on some clubs.
                type:
                - integer
                - 'null'
              rssFeedUrl:
                description: Club news feed; the placeholder 'TODO' in every sample.
                type: string
              seasonIds:
                description: Seasons (start years) with this player or club.
                items:
                  type: integer
                type: array
              seasonTeams:
                description: The club's seasons.
                items:
                  properties:
                    id:
                      description: Season-team id; equal to the club id in every sample.
                      type: string
                    isChampionshipWinner:
                      description: Won the championship that season.
                      type: boolean
                    isCupWinner:
                      description: Won the cup that season.
                      type: boolean
                    logoUrl:
                      description: Logo image URL (per season).
                      type: string
                    name:
                      description: Team name as listed that season (sponsor names included, e.g. 'EWE
                        Baskets Oldenburg').
                      type: string
                    seasonId:
                      description: Season, START year (2026 = 2026-27).
                      type: integer
                    seasonVenues:
                      description: Arenas used that season.
                      items: {}
                      type: array
                  type: object
                type: array
              socialMediaLinks:
                description: Social media URLs; [""] when none.
                items:
                  type: string
                type: array
              sourceId:
                description: The id as an integer (equal to `id` in every sample).
                type: integer
              ticketPhone:
                description: Ticket hotline, free text (sometimes with a URL appended).
                type: string
              ticketUrl:
                description: Ticket shop URL.
                type:
                - string
                - 'null'
              tlc:
                description: Three-letter club code.
                type: string
              yearJoinedBBL:
                description: Year the club joined the league.
                type:
                - integer
                - 'null'
            type: object
        type: object
      type: array
  securitySchemes:
    apiKey:
      description: The constant `publicWebUser`.
      in: header
      name: x-api-key
      type: apiKey
    apiSecret:
      description: 'Derived, and rotating: take the `"key":"..."` value embedded in any https://www.easycredit-bbl.de/
        page, reverse it, and replace every `:` with `-`. Scrape it on each run (it has changed at least
        once); never commit it. The BBL value also unlocks the DBBL host.'
      in: header
      name: x-api-secret
      type: apiKey
info:
  description: 'The Bundesliga sites'' data API, run by SCB on two hosts with the same routes: the men''s
    easyCredit BBL (api.basketball-bundesliga.de) and the women''s Toyota DBBL (api-1.dbbl.scb.world).
    Seasons, games (paged), box scores and play-by-play with shot x/y, standings, playoff trees, season
    stat tables, player and club profiles, referees, transfers and records. Routes from the easycredit-bbl.de
    site bundle; shapes from committed captures in scb/captures/ (captured 2026-10-12). seasonId is the
    START year (2026 = 2026-27; sdv END year = seasonId + 1). BBL history from 1966 (games) and 2005 (box
    scores); actions from 2008-09; DBBL from 2024-25. Ids are strings; players are keyed by season-player
    id (one per club engagement) and realPlayerId (the person). x-unobserved = null in every sample. Every
    request needs both security headers. Not official or supported; the BBL Impressum forbids storing
    BBL content in an information system without written permission (see the README).'
  title: 'SCB basketball API: BBL and DBBL (api.basketball-bundesliga.de, api-1.dbbl.scb.world)'
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /games:
    get:
      description: 'Hosts: BBL, DBBL. Sampled on BBL, DBBL.'
      operationId: games
      parameters:
      - description: 'Season START year: 2026 = 2026-27 (sdv END year = seasonId + 1). Omitted: the active
          season.'
        example: 2026
        in: query
        name: seasonId
        required: false
        schema: &id001
          type: integer
      - description: '1-based page number. Required: omitted, the API answers 400 with a JSON string.'
        example: 1
        in: query
        name: currentPage
        required: true
        schema: *id001
      - description: Rows per page (default 9 on /games). 500 returns a whole season of games in one page.
        example: 500
        in: query
        name: pageSize
        required: false
        schema: *id001
      - description: 'Competition filter. BBL host: BBL, BBL_CUP (Pokal), ALLSTAR, CHAMPIONS_CUP; DBBL
          host: DBBL, DBBL_CUP.'
        in: query
        name: competition
        required: false
        schema:
          enum: &id005
          - BBL
          - BBL_CUP
          - ALLSTAR
          - CHAMPIONS_CUP
          - DBBL
          - DBBL_CUP
          type: string
      - description: Finished, scheduled or all games.
        in: query
        name: gameType
        required: false
        schema:
          enum:
          - finished
          - scheduled
          - all
          type: string
      - description: Only the games of this team (home or guest).
        in: query
        name: seasonTeamId
        required: false
        schema: &id002
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Games'
          description: OK
        '400':
          content:
            application/json:
              schema: &id003
                type: string
          description: 'currentPage omitted: the JSON string "currentPage is required and needs to be
            a number".'
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: Games of a season, paged
  /games/recent:
    get:
      description: 'Hosts: BBL, DBBL. Sampled on BBL, DBBL.'
      operationId: games_recent
      parameters:
      - description: Games per bucket (present, future, past); 9 when omitted.
        in: query
        name: slotSize
        required: false
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesRecent'
          description: OK
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: Recent, live and upcoming games
  /games/{gameId}:
    get:
      description: 'Hosts: BBL, DBBL. Sampled on BBL, DBBL.'
      operationId: games_gameId
      parameters:
      - description: 'Game id (`id` in /games). One sequence per host: BBL and DBBL ids overlap numerically,
          so key a game by (host, id).'
        example: '2006920'
        in: path
        name: gameId
        required: true
        schema: *id002
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesGameId'
          description: OK
        '400':
          content:
            application/json:
              schema: *id003
          description: 'Unknown id: the JSON string "not a valid gameId".'
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: Game header
  /games/{gameId}/stats:
    get:
      description: 'Hosts: BBL, DBBL. Sampled on BBL, DBBL. Box scores from 2002-03 (earlier games answer
        204). Actions from 2008-09 (on some games; every game in recent seasons); earlier box scores come
        with actions []. See scb-returns.md for the action vocabularies and the shot coordinate system.'
      operationId: games_gameId_stats
      parameters:
      - description: 'Game id (`id` in /games). One sequence per host: BBL and DBBL ids overlap numerically,
          so key a game by (host, id).'
        example: '2006920'
        in: path
        name: gameId
        required: true
        schema: *id002
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesGameIdStats'
          description: OK
        '204':
          description: 'No box score: games before 2002-03 (1990-91, 2000-01 and 2001-02 games probed).'
        '400':
          content:
            application/json:
              schema: *id003
          description: 'Unknown id: the JSON string "not a valid gameId".'
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: Box score, play-by-play actions (shot x/y) and PDF report links
  /records/per-game/{seasonId}:
    get:
      description: 'Hosts: BBL, DBBL. Sampled on BBL, DBBL.'
      operationId: records_per_game_seasonId
      parameters:
      - description: 'Season START year: 2026 = 2026-27 (sdv END year = seasonId + 1).'
        example: 2025
        in: path
        name: seasonId
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordsPerGameSeasonId'
          description: OK
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: 'Single-game records: the season''s and all-time'
  /records/season-averages:
    get:
      description: 'Hosts: BBL, DBBL. Sampled on BBL, DBBL.'
      operationId: records_season_averages
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordsSeasonAverages'
          description: OK
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: All-time season-average records
  /referees:
    get:
      description: 'Hosts: BBL. Sampled on BBL. DBBL answers 200 with an empty page (items []), so only
        BBL is documented.'
      operationId: referees
      parameters:
      - description: '1-based page number. Required: omitted, the API answers 400 with a JSON string.'
        example: 1
        in: query
        name: currentPage
        required: true
        schema: *id001
      - description: Rows per page. 100 returns all 44 current officials (BBL, 2026-10-12) in one page.
        example: 100
        in: query
        name: pageSize
        required: false
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Referees'
          description: OK
        '400':
          content:
            application/json:
              schema: *id003
          description: 'currentPage omitted: "currentPage is required and has to be a positive number".'
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: Referees and commissioners, paged
    servers:
    - description: BBL (men, easyCredit Basketball Bundesliga)
      url: https://api.basketball-bundesliga.de
  /season-players/{seasonPlayerId}:
    get:
      description: 'Hosts: BBL, DBBL. Sampled on BBL, DBBL. Unknown ids answer 204 with an empty body.'
      operationId: season_players_seasonPlayerId
      parameters:
      - description: Season-player id (a player's engagement with one club; see the README), e.g. box-score
          `seasonPlayer.id`. Unknown ids answer 204 with no body.
        example: '56414'
        in: path
        name: seasonPlayerId
        required: true
        schema: *id002
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonPlayersSeasonPlayerId'
          description: OK
        '204':
          description: Unknown season-player id.
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: Player profile, by season-player id
  /seasons:
    get:
      description: 'Hosts: BBL, DBBL. Sampled on BBL, DBBL.'
      operationId: seasons
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seasons'
          description: OK
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: Seasons, newest first, with the active flag
  /seasons/{seasonId}:
    get:
      description: 'Hosts: BBL, DBBL. Sampled on BBL, DBBL.'
      operationId: seasons_seasonId
      parameters:
      - description: 'Season START year: 2026 = 2026-27 (sdv END year = seasonId + 1).'
        example: 2026
        in: path
        name: seasonId
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonsSeasonId'
          description: OK
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: 'One season: its teams, players (the id crosswalk) and nationalities'
  /seasons/{seasonId}/player-statistics:
    get:
      description: 'Hosts: BBL, DBBL. Sampled on BBL, DBBL.'
      operationId: seasons_seasonId_player_statistics
      parameters:
      - description: 'Season START year: 2026 = 2026-27 (sdv END year = seasonId + 1).'
        example: 2025
        in: path
        name: seasonId
        required: true
        schema: *id001
      - description: 'Which games the table covers. Required: omitted, 400 with the allowed values.'
        example: MAIN_ROUND
        in: query
        name: displayType
        required: true
        schema:
          enum: &id004
          - MAIN_ROUND
          - PLAYOFFS
          - PLAYOFFS_TOTAL
          - MAIN_ROUND_AND_PLAY_OFFS
          - CUP
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonsSeasonIdPlayerStatistics'
          description: OK
        '400':
          content:
            application/json:
              schema: *id003
          description: 'displayType omitted: "displayType must be one of the following values: ...".'
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: Season player stat table (totals and per-game)
  /seasons/{seasonId}/playoff-tree:
    get:
      description: 'Hosts: BBL, DBBL. Sampled on BBL, DBBL. A season whose playoffs have not started answers
        {seasonId, quarterFinals: [], semiFinals: [], finals: {}}.'
      operationId: seasons_seasonId_playoff_tree
      parameters:
      - description: 'Season START year: 2026 = 2026-27 (sdv END year = seasonId + 1).'
        example: 2025
        in: path
        name: seasonId
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonsSeasonIdPlayoffTree'
          description: OK
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: Playoff bracket of a season
  /seasons/{seasonId}/team-statistics:
    get:
      description: 'Hosts: BBL, DBBL. Sampled on BBL, DBBL.'
      operationId: seasons_seasonId_team_statistics
      parameters:
      - description: 'Season START year: 2026 = 2026-27 (sdv END year = seasonId + 1).'
        example: 2025
        in: path
        name: seasonId
        required: true
        schema: *id001
      - description: 'Which games the table covers. Required: omitted, 400 with the allowed values.'
        example: MAIN_ROUND
        in: query
        name: displayType
        required: true
        schema:
          enum: *id004
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonsSeasonIdTeamStatistics'
          description: OK
        '400':
          content:
            application/json:
              schema: *id003
          description: 'displayType omitted: "displayType must be one of the following values: ...".'
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: Season team stat table (totals and per-game)
  /standings:
    get:
      description: 'Hosts: BBL, DBBL. Sampled on BBL, DBBL.'
      operationId: standings
      parameters:
      - description: 'Season START year: 2026 = 2026-27 (sdv END year = seasonId + 1). Omitted: the active
          season. Seasons before about 2000 answer [] (1990 did).'
        example: 2025
        in: query
        name: seasonId
        required: false
        schema: *id001
      - description: Stages to include, sent as an array (`stages[]=MAIN_ROUND` or repeated `stages=`);
          a bare `stages=X` answers 400 "stages has to be an array".
        explode: true
        in: query
        name: stages
        required: false
        schema:
          items:
            enum:
            - MAIN_ROUND
            - PLAYINS
            - FIRST_ROUND
            - SECOND_ROUND
            - ROUND_OF_16
            - ROUND_OF_8
            - SEMI_FINALS
            - FINALS
            - THIRD_PLACE_GAME
            - QUALIFICATION
            - GROUP_STAGE
            type: string
          type: array
        style: form
      - description: Competition; BBL_CUP answered [].
        in: query
        name: competition
        required: false
        schema:
          enum: *id005
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Standings'
          description: OK
        '400':
          content:
            application/json:
              schema: *id003
          description: 'A scalar stages value: "stages has to be an array".'
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: Standings of a season
  /teams/{teamId}:
    get:
      description: 'Hosts: BBL, DBBL. Sampled on BBL, DBBL.'
      operationId: teams_teamId
      parameters:
      - description: Club id (`teamId`, equal to `seasonTeamId` in every sample).
        example: '413'
        in: path
        name: teamId
        required: true
        schema: *id002
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamsTeamId'
          description: OK
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: Club profile
  /transfers:
    get:
      description: 'Hosts: BBL. Sampled on BBL. BBL only: DBBL answers 404 {"status":"error","error":"Sorry
        cant find that!"}.'
      operationId: transfers
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfers'
          description: OK
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: Latest transfers
    servers:
    - description: BBL (men, easyCredit Basketball Bundesliga)
      url: https://api.basketball-bundesliga.de
  /transfers/teams:
    get:
      description: 'Hosts: BBL. Sampled on BBL. BBL only: DBBL answers 404.'
      operationId: transfers_teams
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransfersTeams'
          description: OK
        '401':
          description: 'BBL host without valid x-api-key / x-api-secret: an HTML 401 page.'
        '403':
          description: 'DBBL host without them: {"status":"error","error":"No valid api key provided."}.'
      summary: 'Per club: joining, leaving and current roster'
    servers:
    - description: BBL (men, easyCredit Basketball Bundesliga)
      url: https://api.basketball-bundesliga.de
security:
- apiKey: []
  apiSecret: []
servers:
- description: BBL (men, easyCredit Basketball Bundesliga)
  url: https://api.basketball-bundesliga.de
- description: DBBL (women, Toyota Damen-Basketball-Bundesliga)
  url: https://api-1.dbbl.scb.world
