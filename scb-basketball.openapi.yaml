                  last10Losses:
                    description: Losses in the last 10 games.
                    type: integer
                  last10Outcomes:
                    description: 'Results of the last games, newest first: W or L.'
                    items:
                      type: string
                    type: array
                  last10Victories:
                    description: Wins in the last 10 games.
