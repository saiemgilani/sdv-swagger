                    type: string
                  streak:
                    description: 'Current streak: W or L; empty when none.'
                    type: string
                  streakCount:
                    description: Length of the current streak.
                    type: integer
                  teamId:
                    description: Club id; equal to `seasonTeamId` in every sample. Joins to /teams/{teamId}.
                    type: string
                  ticketPhone:
                    description: Ticket hotline, free text (sometimes with a URL appended).
                    type:
                    - string
                    - 'null'
                  ticketUrl:
                    description: Ticket shop URL.
                    type:
                    - string
                    - 'null'
                  tlc:
                    description: Three-letter club code.
                    type: string
                  totalGames:
                    description: Games played. An integer sent as a string (e.g. '0').
                    type: string
                type: object
              id:
                description: 'Game id, a string. One sequence per host (see README: the scheme moved to
                  7-digit ids in 2023-24).'
                type: string
              isFreeTV:
                description: Shown on free-to-air TV.
                type: boolean
              isHidden:
                description: Hidden on the site. A 0/1 integer here.
                type: integer
              isTBD:
                description: Date or time not yet fixed.
                type: boolean
              linkLiveStream:
                description: Live-stream link (DBBL games link YouTube); empty when none.
                type: string
              matchDay:
                description: Round number within the stage (Spieltag).
                type: integer
              referee1:
                description: First referee (crew chief); null when not assigned.
