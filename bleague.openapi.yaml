        PlayByPlays:
          description: Play-by-play rows in game order (No ascending); 400-810 rows per game in the samples.
          items:
            properties:
              ActionCD1:
                description: 'Primary action code (gloss from PlayText, verified on all samples): 1 =
                  3PT made (3Pシュート○), 2 = 3PT missed (×), 3 = 2PT outside the paint made (2Pシュート アウトサイドペイント○),
                  4 = 2PT inside the paint made (インサイドペイント○), 5 = 2PT outside the paint missed, 6 = 2PT
                  inside the paint missed, 7 = free throw made (フリースロー○), 8 = free throw missed, 9 = defensive
                  rebound (ディフェンスリバウンド), 10 = offensive rebound (オフェンスリバウンド), 11 = block (ブロックショット), 12
                  = assist (アシスト), 13 = turnover (ターンオーバー), 14 = steal (スティール), 15 = foul drawn (ファウルドローン;
                  2016-17 wording ファウルオン), 16 = and-one, basket counts (バスケットカウント), 17 = team turnover
                  (チームターンオーバー), 18 = team rebound: DEFENSIVE on v2 (チームディフェンスリバウンド) but OFFENSIVE on v1
                  and the 2016-17 embed, 19 = team rebound: OFFENSIVE on v2, DEFENSIVE on v1, 22 = personal
                  foul (パーソナルファウル), 23 = offensive foul (オフェンスファウル), 24 = technical foul (テクニカルファウル),
                  25 = unsportsmanlike foul (アンスポーツマンファウル), 80 = game start (試合開始), 81 = game end (試合終了),
                  82 = period start (ピリオドスタート), 83 = period end (ピリオドエンド), 84 = clock start (タイムスタート),
                  85 = clock stop (タイムストップ), 86 = player in (プレイヤーイン), 87 = player out (プレイヤーアウト), 88
                  = timeout (タイムアウト), 89 = substitution ''out → in'' in ONE row (v1 only: PlayerID1 =
                  out, PlayerID2 = in). In the site JS but not seen: 20, 21, 26, 46 (foul icons), 44 (+2
                  points), 90 (timeout). 80, 82, 84, 85, 87 occur on v2 only. B3 (v1) never uses 4 / 6:
                  its 2PT shots are all 3 / 5.'
                type: integer
              ActionCD2:
                description: 'Secondary qualifier (shot type on field goals, free throws awarded on fouls,
                  scoring context on free throws, 24 s on team turnovers). Qualifier codes, one code space
                  shared by ActionCD2 and ActionCD3 (gloss from PlayText): 27 = jump shot (ジャンプショット),
                  28 = layup (レイアップ), 29 = dunk (ダンク); 30 / 31 / 32 / 33 = free throws awarded on the
                  foul 0 / 1 / 2 / 3 (フリースローオンファウルN); 34 = 24-second violation (24秒, on team turnovers);
                  35 = fast break (ファストブレイク), 36 = points off turnover (ポインツオフターンオーバー), 37 = second chance
                  (セカンドチャンス), 38 = fast break + points off turnover, 47 = fast break + second chance,
                  48 = points off turnover + second chance; 39 = shooting foul (シュートファウル), 40 = foul-out
                  (ファウルアウト); 90 = on timeout rows (タイムアウト; kind unverified).'
                type:
                - integer
                - 'null'
              ActionCD3:
                description: 'Tertiary qualifier (scoring context on made field goals, shooting foul /
                  foul-out on fouls). Qualifier codes, one code space shared by ActionCD2 and ActionCD3
                  (gloss from PlayText): 27 = jump shot (ジャンプショット), 28 = layup (レイアップ), 29 = dunk (ダンク);
                  30 / 31 / 32 / 33 = free throws awarded on the foul 0 / 1 / 2 / 3 (フリースローオンファウルN); 34
                  = 24-second violation (24秒, on team turnovers); 35 = fast break (ファストブレイク), 36 = points
                  off turnover (ポインツオフターンオーバー), 37 = second chance (セカンドチャンス), 38 = fast break + points
                  off turnover, 47 = fast break + second chance, 48 = points off turnover + second chance;
                  39 = shooting foul (シュートファウル), 40 = foul-out (ファウルアウト); 90 = on timeout rows (タイムアウト;
                  kind unverified).'
                type:
                - integer
                - 'null'
              Code:
                description: 'Feed/organisation code repeated on every row: 546 on every v2 sample, 6
                  on every v1 sample; meaning unverified (joins nothing captured).'
                type: integer
              GameEndRowFlg:
                description: True on the game-end row (ActionCD1 81) on the v1 feed and the 2016-17 embed;
                  false on EVERY v2 row, the 81 row included. Use ActionCD1 81 instead.
                type: boolean
