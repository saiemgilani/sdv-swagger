              team_id:
                description: 'Club: TeamID (key space: B.LEAGUE clubs; stable across seasons AND club
                  renames: 703 = Tochigi Brex in 2016-17 and Utsunomiya Brex in 2025-26). STRING on the
                  v2 feed and the HTML records (''706''), INTEGER on the v1 feed and the 2016-17 embed
                  (706). The club_detail/?TeamID= and schedule club= value. Not a player id. From the
                  club_detail/?TeamID= link.'
                type: string
              team_short:
                description: Club short name in Japanese.
                type: string
              win_pct:
                description: Win fraction 0-1 (勝率, '.750' -> 0.75).
                type: number
              wins:
                description: Wins (勝).
                type: integer
            type: object
          type: array
        season_label:
          description: Selected season label 'YYYY-YY'.
          type: string
        tab:
          description: 'Division tab (request echo, checked against the active tab): 1 = B1, 2 = B2, 3
            = B3.'
          type: integer
        year:
          description: Season START year (request echo, checked against the year-b{tab} select). sdv END
            year = year + 1.
          type: integer
      type: object
    BleagueV1Context:
      description: 'v1_contexts game context (B3; B1/B2 2018-19 and 2019-20): the v1 shape, with a richer
        Game header and two extra lists (Leaders, Points). Ids and several codes are INTEGERS here (strings
        on v2).'
      properties:
        AwayBoxscores:
          description: Away team box rows, same layout as HomeBoxscores.
          items:
            properties:
              AS:
                description: Assists.
                type: integer
              BS:
                description: Blocks made.
                type: integer
              BSON:
                description: Shots of this player that were blocked (被ブロック, BSR).
                type: integer
              Category:
                description: 'Row category: 1 = player, 2 = TEAM / COACHES row (team-credited stats; on
                  v1 it names the head coach), 3 = team totals (合計). The site''s JS treats a missing value
                  as 4. One row per (category, player, PeriodCategory).'
                type: integer
              Code:
                description: 'Feed/organisation code repeated on every row: 546 on every v2 sample, 6
                  on every v1 sample; meaning unverified (joins nothing captured).'
                type: integer
              EFF:
                description: 'Efficiency (貢献度), era-dependent, both verified on every player row of the
                  samples: v2 = points + rebounds + assists + steals + blocks + fouls drawn - missed FG
                  - missed FT - turnovers - fouls - shots blocked (PIR; 73/73 rows); v1 and the 2016-17
                  embed = points + rebounds + assists + steals + blocks - missed FG - missed FT - turnovers
                  (23/23 rows).'
                type: integer
              FOUL:
                description: Fouls committed (F).
                type: integer
              FOULON:
                description: Fouls drawn (被ファウル, FD).
                type: integer
              FTA:
                description: Free throws attempted.
                type: integer
              FTM:
                description: Free throws made.
                type: integer
              'No':
                description: Display order of the row (v1 only), integer.
                type: integer
              PT2A:
                description: 2PT field goals attempted.
                type: integer
              PT2DUNK:
                description: Dunks made (v1 only; the site sorts on it as PT2DUNK).
                type: integer
              PT2IN:
                description: 'Paint scoring, era-dependent: v2 = inside-the-paint 2PT MADE (a count; 504734
                  home players sum to 13 while Summaries PT2IN = 26 points); 2016-17 embed = points in
                  the paint (2 x made). 0 on B3, whose 2PT shots are never split by paint (codes 3/5 only).'
                type: integer
              PT2M:
                description: 2PT field goals made.
                type: integer
              PT2ND:
                description: 'Second-chance figure (セカンドチャンス). On v2 it is smaller than the Summaries
                  second-chance points (504734 home: players 5, Summaries 9), so likely made baskets;
                  unverified.'
                type: integer
              PT3A:
                description: 3PT field goals attempted.
                type: integer
              PT3M:
                description: 3PT field goals made.
                type: integer
              PTFB:
                description: 'Fast-break figure (ファストブレイク): equal to the Summaries fast-break points on
                  the 504734 home side (2); whether it counts points or baskets is unverified.'
                type: integer
              PTPFT:
                description: Points off turnovers (ポインツオフターンオーバー; v1 box rows).
                type: integer
              PeriodCategory:
                description: 'Period category of the row: 1-4 = quarters 1-4, 15 = first half, 16 = second
                  half, 18 = whole game (the site''s default). Verified by summing points (15 = Q1 + Q2,
                  18 = final score). Overtime codes unverified (no OT sample).'
                type: integer
              PlayTime:
                description: Minutes played 'mm:ss' ('200:00' on totals rows = 5 x 40:00); 'DNP' = did
                  not play; null on v2 team rows.
                type: string
              PlayerID:
                description: 'PlayerID (key space: B.LEAGUE persons, stable across seasons and clubs:
                  Makoto Hiejima = ''8589''; newer ids are longer, ''51000209'', ''5100000081''). STRING
                  on v2 (''''  on team / totals rows), INTEGER on v1 (on the team row it is the head coach''s
                  id). The roster_detail/?PlayerID= value. Not a TeamID.'
                type:
                - integer
                - 'null'
              PlayerNameE:
                description: Player name in English ('Makoto Hiejima'); '' on team / totals rows.
                type: string
              PlayerNameJ:
                description: 'Player name in Japanese (v1 team row: the head coach''s name; '''' on v2
                  team / totals rows).'
                type: string
              PlayerNo:
                description: Shirt number as a string; '' on team / totals rows.
                type: string
              PlayingFlg:
                description: 'True for the five players on court when the context was last written (for
                  a final game: at the final buzzer); the same value on every PeriodCategory row of the
                  player. '''' on v2 team / totals rows.'
                type: boolean
              Point:
                description: Points.
                type: integer
              RB_DEF:
                description: Defensive rebounds (DR).
                type: integer
              RB_OFF:
                description: Offensive rebounds (OR).
                type: integer
              RB_TOT:
                description: Total rebounds (TR).
                type: integer
              ST:
                description: Steals.
                type: integer
              ScheduleKey:
                description: 'ScheduleKey (key space: B.LEAGUE games, ONE global sequence across B1, B2,
                  B3 and every season: 1 = the 2016-17 opener, 5856 in 2020-21, 500017 in 2022-23, 504734
                  in 2025-26 B1, 505508 in 2025-26 B2, 10693 in 2025-26 B3). The {ScheduleKey} of the
                  S3 routes and of game_detail/?ScheduleKey=; the schedule page''s list-item id. Integer.'
                type: integer
              StartingFlg:
                description: 'Starter flag. v2: 1 = started, null = bench, '''' on team / totals rows.
                  v1 and the embed: boolean.'
                type: boolean
              TO:
                description: Turnovers.
                type: integer
              TeamID:
                description: 'TeamID (key space: B.LEAGUE clubs; stable across seasons AND club renames:
                  703 = Tochigi Brex in 2016-17 and Utsunomiya Brex in 2025-26). STRING on the v2 feed
                  and the HTML records (''706''), INTEGER on the v1 feed and the 2016-17 embed (706).
                  The club_detail/?TeamID= and schedule club= value. Not a player id. Null on v2 totals
                  rows (Category 3).'
                type: integer
              TeamNameE:
                description: Team name in English, uppercase ('ALVARK TOKYO').
                type: string
              TeamNameJ:
                description: Team name in Japanese.
                type: string
            type: object
          type: array
        Game:
          description: 'Game header: competition, round, venue, officials, teams and scores per period.'
