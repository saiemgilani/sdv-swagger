              type: number
            Weather:
              description: 'Weather code (v1): 3 and 1 on the samples, null on B3; code meanings unverified.'
              type: integer
            Year:
              description: Season START year (2025 = 2025-26). The sdv season key is the END year = Year
                + 1. Integer; must equal the request.
              type: integer
          type: object
