                description: 'section in English: East / Central / West division, Wild card; null for
                  a single table or an unknown heading.'
                type:
                - string
                - 'null'
              streak:
                description: 'Current streak (連勝/連敗): ''W5'' = five wins, ''L1'' = one loss.'
