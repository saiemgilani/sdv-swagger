              RecordDateTime:
                description: 'When the event was logged. v2: UTC ''YYYY-MM-DD HH:MM:SS'' (504734''s first
                  row 10:11:35 for a 19:05 JST tip-off = 10:05 UTC). v1: .NET JSON date ''/Date(epoch
