                  every row must equal the request (the capture refuses otherwise).'
                type: integer
              Score:
                description: Running score 'home-away' after the event ('0-0'). Absent on v2 player-in
                  rows (ActionCD1 86).
                type: string
              TeamID:
                description: 'Acting team: TeamID (key space: B.LEAGUE clubs; stable across seasons AND
                  club renames: 703 = Tochigi Brex in 2016-17 and Utsunomiya Brex in 2025-26). STRING
                  on the v2 feed and the HTML records (''706''), INTEGER on the v1 feed and the 2016-17
