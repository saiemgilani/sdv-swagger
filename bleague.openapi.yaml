                description: 'Play description in JAPANESE: ''#{shirt} {surname} {action} ({running count})''.
                  Glossary: 3Pシュート = 3PT shot, 2Pシュート = 2PT shot, インサイド / アウトサイドペイント = inside / outside
                  the paint, ○ = made, × = missed, フリースロー = free throw, (N点) = the player''s running points,
                  (N本) = running count of that stat, リバウンド counts ''(off-def-tot)'', fouls ''(player fouls-team
                  fouls:free throws)'' (inferred), → = substitution out → in (v1). The action words are
                  glossed on ActionCD1 / ActionCD2 / ActionCD3.'
