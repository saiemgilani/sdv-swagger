  /v1_contexts/{ScheduleKey}/latestid:
    get:
      description: 'Bare integer body (content type application/octet-stream). Not banked as a sample:
        the capture validates it (digits only) and uses it for the .json route.'
      operationId: get_bleague_v1_latestid
      parameters:
      - description: ScheduleKey (global game key; the schedule page's list-item ids). Unknown keys, and
          keys of the other feed, answer S3 403 AccessDenied (application/xml).
        example: 10693
        in: path
        name: ScheduleKey
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/octet-stream:
              example: '110'
              schema:
                description: The latest snapshot id as bare decimal digits ('110'); pass it as {latestId}.
                pattern: ^[0-9]+$
                type: string
          description: Latest snapshot id of a v1-feed game context (B3; B1/B2 2018-19 and 2019-20)
        '403':
          description: 'S3 AccessDenied (application/xml): unknown ScheduleKey, a key of the other feed,
            or a latestId that does not exist. Not retried.'
      security: []
      summary: Latest snapshot id of a v1-feed game context (B3; B1/B2 2018-19 and 2019-20)
  /v1_contexts/{ScheduleKey}/{latestId}.json:
    get:
      description: 'v1_contexts game context (B3; B1/B2 2018-19 and 2019-20): the v1 shape, with a richer
        Game header and two extra lists (Leaders, Points). Ids and several codes are INTEGERS here (strings
        on v2). Served with Content-Encoding: gzip (decompress). Ids and codes are INTEGERS (TeamID 2726,
        PlayerID 40145, ConventionKey 102, Setu 29). Team rebound codes are the reverse of v2: here 18
        = offensive, 19 = defensive.'
      operationId: get_bleague_v1_context
      parameters:
      - description: ScheduleKey (global game key; the schedule page's list-item ids). Unknown keys, and
          keys of the other feed, answer S3 403 AccessDenied (application/xml).
        example: 10693
        in: path
        name: ScheduleKey
        required: true
        schema:
          type: integer
      - description: The integer returned by .../latestid for the same ScheduleKey (the newest snapshot;
          the site's JS falls back to 0).
        example: 592
        in: path
        name: latestId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BleagueV1Context'
          description: 'v1-feed game context (B3; B1/B2 2018-19 and 2019-20): header, play-by-play, box
            scores, summaries, leaders, score track'
        '403':
          description: 'S3 AccessDenied (application/xml): unknown ScheduleKey, a key of the other feed,
            or a latestId that does not exist. Not retried.'
      security: []
      summary: 'v1-feed game context (B3; B1/B2 2018-19 and 2019-20): header, play-by-play, box scores,
        summaries, leaders, score track'
  /v2_genius_contexts/{ScheduleKey}/latestid:
    get:
