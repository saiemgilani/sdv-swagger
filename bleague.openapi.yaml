                  703 = Tochigi Brex in 2016-17 and Utsunomiya Brex in 2025-26). STRING on the v2 feed
                  and the HTML records (''706''), INTEGER on the v1 feed and the 2016-17 embed (706).
                  The club_detail/?TeamID= and schedule club= value. Not a player id. Null on v2 totals
                  rows (Category 3).'
                type:
                - string
                - 'null'
              TeamNameE:
                description: Team name in English, uppercase ('ALVARK TOKYO').
                type: string
              TeamNameJ:
