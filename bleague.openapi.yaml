              type: string
            SubRefereeNameE2:
              description: Umpire 2's name in English (v1).
              type: string
            SubRefereeNameJ1:
              description: Umpire 1's name in Japanese.
              type: string
            SubRefereeNameJ2:
              description: Umpire 2's name in Japanese.
              type: string
            Temperature:
