info:
  description: 'Japan B.LEAGUE (B1, B2, B3) game data. The site''s own JSON ''contexts'' sit on a public
    S3 bucket: GET /{feed}/{ScheduleKey}/latestid, then /{feed}/{ScheduleKey}/{latestId}.json (gzip).
    v2_genius_contexts serves B1/B2 from 2020-21 (shot x/y from 2022-23); v1_contexts serves B3 and B1/B2
    2018-19 and 2019-20. Older games (2016-17, 2017-18) exist only embedded in the game_detail page. Schedules
    (the ScheduleKey list) and standings are server-rendered HTML on www.bleague.jp (x-parsed-schema gives
    the parsed record). Keyless. Seasons are keyed by START year (Year=2025 is 2025-26; sdv END year =
    Year + 1). Field names and texts are Japanese; descriptions translate them. Shapes from captures of
    2026-10-12; x-unobserved = null in every sample. Not official or supported.'
  title: B.LEAGUE game contexts (public S3) + www.bleague.jp pages
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /game_detail/:
    get:
      description: 'text/html (server-rendered, Kuroco CMS), parsed by capture.py into the JSON record
        of x-parsed-schema (English keys). Keyless. Parsing rule: the first `_contexts_s3id.data = {...}`
        assignment in the inline script, decoded with json raw_decode; key '''' dropped; admin_name must
        be a known feed; ScheduleKey (string), Game.ScheduleKey, both TeamIDs, Year, the final flags and
        every row''s ScheduleKey must match the request.'
      operationId: get_bleague_game_detail
      parameters:
      - description: ScheduleKey (global game key; the schedule page's list-item ids).
        example: 1
        in: query
        name: ScheduleKey
        required: true
        schema:
          type: integer
      - description: 'UI tab of the game page (4 = box score). Not echoed by the page and does not change
          the embed: an UNSCOPED parameter.'
        example: 4
        in: query
        name: tab
