                  in 2025-26 B1, 505508 in 2025-26 B2, 10693 in 2025-26 B3). The {ScheduleKey} of the
                  S3 routes and of game_detail/?ScheduleKey=; the schedule page''s list-item id. Integer.'
                type: integer
              StartingFlg:
                description: 'Starter flag. v2: 1 = started, null = bench, '''' on team / totals rows.
                  v1 and the embed: boolean.'
                type:
