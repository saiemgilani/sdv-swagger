    BleagueV2Context:
      description: 'v2_genius_contexts game context (B1/B2 2020-21 onward): Game header, PlayByPlays (x/y
        from 2022-23), HomeBoxscores / AwayBoxscores (player, team and totals rows per period category)
        and Summaries (team totals per period category).'
      properties:
        AwayBoxscores:
          description: Away team box rows, same layout as HomeBoxscores.
          items:
            properties:
              AS:
                description: Assists.
