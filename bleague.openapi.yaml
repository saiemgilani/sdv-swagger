    BleagueScheduleDay:
      description: 'Record parsed from schedule/?tab=&year=&event=&mon=&day= (text/html): the request
        echoes, the season/competition selects, the club list (name -> TeamID) and every game of the day.'
      properties:
        clubs:
          description: 'The club select: every club of the division that season.'
          items:
            properties:
              name:
                description: Club short name in Japanese as the page shows it (琉球 = Ryukyu).
                type: string
              team_id:
                description: 'Club: TeamID (key space: B.LEAGUE clubs; stable across seasons AND club
                  renames: 703 = Tochigi Brex in 2016-17 and Utsunomiya Brex in 2025-26). STRING on the
                  v2 feed and the HTML records (''706''), INTEGER on the v1 feed and the 2016-17 embed
                  (706). The club_detail/?TeamID= and schedule club= value. Not a player id. From the
                  club select''s option value.'
                type: string
            type: object
          type: array
        day:
          description: Day of month (request echo, checked against the date picker's current slide).
          type: integer
        event:
          description: Competition code (request echo, checked against the selected event option); see
            events.
          type: integer
        event_label:
          description: Selected competition label in Japanese (B1リーグ = B1 league, B2リーグ = B2 league, B3リーグ
            = B3 league, B1チャンピオンシップ = B1 Championship).
          type: string
        events:
          description: Competitions offered for this tab and season (the event select).
          items:
            properties:
              event:
                description: 'Competition code: 2 = B1 league, 3 = B1 Championship, 4 = B1 relegation
                  playoffs, 5 = all-star, 7 = B2 league, 8 = B2 playoffs, 11 = B1-B2 promotion/relegation
                  games, 15 = B3 league, 32 = B3 playoffs.'
                type: integer
              label:
                description: Competition label in Japanese (see event_label).
                type: string
            type: object
          type: array
        game_days:
          description: Days of the month that have games (the date picker), integers.
          items:
            type: integer
          type: array
        games:
          description: Every game of the day (the page lists one day completely; a paged list is refused).
          items:
            properties:
              away_score:
                description: Away points (integer); null before the game.
                type: integer
              away_team:
                description: Away club short name in Japanese.
                type: string
              away_team_id:
                description: 'Away club: TeamID (key space: B.LEAGUE clubs; stable across seasons AND
                  club renames: 703 = Tochigi Brex in 2016-17 and Utsunomiya Brex in 2025-26). STRING
                  on the v2 feed and the HTML records (''706''), INTEGER on the v1 feed and the 2016-17
                  embed (706). The club_detail/?TeamID= and schedule club= value. Not a player id.'
                type: string
              date:
                description: Game date, ISO 'YYYY-MM-DD' (months 7-12 in the START year, 1-6 in the next).
                type: string
              home_score:
                description: Home points (integer); null before the game.
                type: integer
              home_team:
                description: Home club short name in Japanese.
                type: string
              home_team_id:
                description: 'Home club: TeamID (key space: B.LEAGUE clubs; stable across seasons AND
                  club renames: 703 = Tochigi Brex in 2016-17 and Utsunomiya Brex in 2025-26). STRING
                  on the v2 feed and the HTML records (''706''), INTEGER on the v1 feed and the 2016-17
                  embed (706). The club_detail/?TeamID= and schedule club= value. Not a player id. Mapped
                  from the short name through the club select (refused if unmapped).'
                type: string
              prefecture:
                description: Venue prefecture in Japanese (大阪府 = Osaka Prefecture); null when the cell
                  has no 'prefecture | venue' split.
                type: string
              round:
                description: Round number parsed from 第N節; null for other labels (playoff rounds).
                type: integer
              round_label:
                description: Round label verbatim (第1節 = round 1).
                type: string
              schedule_key:
                description: 'ScheduleKey (key space: B.LEAGUE games, ONE global sequence across B1, B2,
                  B3 and every season: 1 = the 2016-17 opener, 5856 in 2020-21, 500017 in 2022-23, 504734
                  in 2025-26 B1, 505508 in 2025-26 B2, 10693 in 2025-26 B3). The {ScheduleKey} of the
                  S3 routes and of game_detail/?ScheduleKey=; the schedule page''s list-item id. Integer
                  (the list item id; checked against its game_detail link).'
                type: integer
              state:
                description: 'Game state label verbatim: ''FINAL'' once played; null when absent.'
                type: string
              tip_time:
                description: Tip-off 'HH:MM', Japan time (JST).
                type: string
              venue:
                description: Venue short name in Japanese.
                type: string
            type: object
          type: array
        mon:
          description: Month (request echo, checked against the selected month option).
          type: integer
        season_label:
          description: Selected season label 'YYYY-YY' ('2025-26').
          type: string
        tab:
          description: 'Division tab (request echo, checked against the active tab button): 1 = B1, 2
            = B2, 3 = B3.'
          type: integer
        year:
          description: Season START year (request echo, checked against the selected year option). sdv
            END year = year + 1.
          type: integer
      type: object
