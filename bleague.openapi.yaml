            StadiumNameE:
              description: Venue name in English.
              type: string
            StadiumNameJ:
              description: Venue name in Japanese.
              type: string
            SubRefereeID1:
              description: Umpire 1's referee id (integer).
              type: integer
            SubRefereeID2:
              description: Umpire 2's referee id (integer).
              type: integer
            SubRefereeNameE1:
