  /v2_genius_contexts/{ScheduleKey}/{latestId}.json:
    get:
      description: 'v2_genius_contexts game context (B1/B2 2020-21 onward): Game header, PlayByPlays (x/y
        from 2022-23), HomeBoxscores / AwayBoxscores (player, team and totals rows per period category)
        and Summaries (team totals per period category). Served with Content-Encoding: gzip (decompress).
        Ids are STRINGS (TeamID ''706'', PlayerID ''8589'', ConventionKey ''514'', Setu ''1''); ScheduleKey
        stays an integer. Shot x/y (X, Y, AreaCD, Success) start in 2022-23: absent on every 2020-21 and
        2021-22 row (5856, 7440, 8726 checked). Side starts later: absent on 2022-23 (500017), present
        on 2025-26.'
      operationId: get_bleague_v2_context
      parameters:
      - description: ScheduleKey (global game key; the schedule page's list-item ids). Unknown keys, and
