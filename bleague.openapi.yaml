                  v1 it names the head coach), 3 = team totals (合計). The site''s JS treats a missing value
                  as 4. One row per (category, player, PeriodCategory).'
                type: integer
              Code:
                description: 'Feed/organisation code repeated on every row: 546 on every v2 sample, 6
                  on every v1 sample; meaning unverified (joins nothing captured).'
                type: integer
              DEFRTG:
                description: Defensive rating; only on team / totals rows, 0 or '' in every sample (never
                  filled).
                type: number
              EFF:
                description: 'Efficiency (貢献度), era-dependent, both verified on every player row of the
                  samples: v2 = points + rebounds + assists + steals + blocks + fouls drawn - missed FG
                  - missed FT - turnovers - fouls - shots blocked (PIR; 73/73 rows); v1 and the 2016-17
                  embed = points + rebounds + assists + steals + blocks - missed FG - missed FT - turnovers
                  (23/23 rows).'
                type: integer
              EFG:
                description: Effective field-goal percentage as a FRACTION 0-1 (0.5 = 50 %; 3PT weighted
                  1.5x). The site multiplies by 100.
                type: number
              FOUL:
                description: Fouls committed (F).
                type: integer
              FOULON:
                description: Fouls drawn (被ファウル, FD).
                type: integer
              FTA:
                description: Free throws attempted.
                type: integer
              FTM:
                description: Free throws made.
                type: integer
              NETRTG:
                description: Net rating; only on team / totals rows, 0 or '' in every sample (never filled).
                type: number
              OFFRTG:
                description: Offensive rating; only on team / totals rows, where it is 0 or '' in every
                  sample (never filled).
                type: number
              PLUSMINUS:
                description: 'Plus/minus: team point difference while the player was on court (signed
                  integer).'
                type: integer
              POSS:
                description: Possessions; only on team / totals rows, 0 or '' in every sample (never filled).
                type: number
              PT2A:
                description: 2PT field goals attempted.
                type: integer
              PT2IN:
                description: 'Paint scoring, era-dependent: v2 = inside-the-paint 2PT MADE (a count; 504734
                  home players sum to 13 while Summaries PT2IN = 26 points); 2016-17 embed = points in
                  the paint (2 x made). 0 on B3, whose 2PT shots are never split by paint (codes 3/5 only).'
                type: integer
              PT2M:
                description: 2PT field goals made.
                type: integer
              PT2ND:
                description: 'Second-chance figure (セカンドチャンス). On v2 it is smaller than the Summaries
                  second-chance points (504734 home: players 5, Summaries 9), so likely made baskets;
                  unverified.'
                type: integer
              PT3A:
                description: 3PT field goals attempted.
                type: integer
              PT3M:
                description: 3PT field goals made.
                type: integer
              PTFB:
                description: 'Fast-break figure (ファストブレイク): equal to the Summaries fast-break points on
