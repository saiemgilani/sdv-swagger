openapi: 3.1.0
info:
  title: CEBL stats API (api.data.cebl.ca)
  version: '2026-10-12'
  description: 'The Canadian Elite Basketball League''s own stats service (Django Ninja), which feeds
    the CEBL Stats Hub and cebl.ca: seasons, standings, franchises, rosters, team and player stat tables,
    leaders, player profiles, season and career stats, game logs, the schedule with results, and news.
    Paths, parameters and schemas are the service''s own `/openapi.json` (banked in cebl/upstream/); descriptions,
    examples, errors and divergence notes come from captures (cebl/captures/, 2026-10-12). Seasons are
    calendar years (May-August) = the sdv END year. Box scores and play-by-play are not here: `GameSchema.stats_url_en`
    carries the Genius match id, the join to genius-livestats/ (org CEBL). x-unobserved = never present
    in a sample. Not official or supported for third parties; see the README for the key caveat.'
  x-upstream-info:
    title: NinjaAPI
    version: 1.0.0
    description: ''
servers:
- url: https://api.data.cebl.ca
  description: CEBL stats API
security:
- APIKeyAuth: []
paths:
  /seasons/:
    get:
      operationId: apps_stats_seasons_views_list_seasons
      summary: List Seasons
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SeasonSchema'
                title: Response
                type: array
        '401':
          description: 'No X-Api-Key header, or a wrong one: `{"detail": "Unauthorized"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      security:
      - APIKeyAuth: []
      description: Every season, with the active and live flags.
  /teams/{season}/:
    get:
      operationId: apps_stats_teams_views_list_team_standings
      summary: List Team Standings
      parameters:
      - in: path
        name: season
        schema:
          title: Season
          type: string
        required: true
        description: 'Season: the calendar year the season is played in (May-August), which is also the
          sdv END year. A 4-digit string in the path. A season with no data (1999) answers 200 `[]`.'
        example: '2019'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TeamStandingSchema'
                title: Response
                type: array
        '401':
          description: 'No X-Api-Key header, or a wrong one: `{"detail": "Unauthorized"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      security:
      - APIKeyAuth: []
      description: 'Standings of a season, one row per team, with the team''s links. No body field echoes
        `season`: the request is their only guard. An unknown season answers 200 `[]`.'
  /teams/:
    get:
      operationId: apps_stats_teams_views_list_teams
      summary: List Teams
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TeamSchema'
                title: Response
                type: array
        '401':
          description: 'No X-Api-Key header, or a wrong one: `{"detail": "Unauthorized"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      security:
      - APIKeyAuth: []
      description: Every franchise, past and present.
  /teams/{team_id}/roster/{season}/:
    get:
      operationId: apps_stats_teams_views_list_team_rosters
      summary: List Team Rosters
      parameters:
      - in: path
        name: team_id
        schema:
          title: Team Id
          type: integer
        required: true
        description: CEBL team id (see /teams/). An unknown id answers 200 `[]`; the body does not echo
          it.
        example: 14
      - in: path
        name: season
        schema:
          title: Season
          type: string
        required: true
        description: 'Season: the calendar year the season is played in (May-August), which is also the
          sdv END year. A 4-digit string in the path. A season with no data (1999) answers 200 `[]`.'
        example: '2019'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PlayerTeamRosterSchema'
                title: Response
                type: array
        '401':
          description: 'No X-Api-Key header, or a wrong one: `{"detail": "Unauthorized"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      security:
      - APIKeyAuth: []
      description: 'A team''s roster in one season. No body field echoes `team_id`, `season`: the request
        is their only guard. An unknown team or an unknown season answers 200 `[]`.'
  /teams/statistics/aggregated/:
    get:
      operationId: apps_stats_teams_views_list_aggregated_team_statistics
      summary: List Aggregated Team Statistics
      parameters:
      - in: query
        name: mode
        schema:
          title: Mode
          type: string
          enum:
          - TOTALS
          - PER_GAME
        required: true
        description: 'TOTALS (sums over the selected games) or PER_GAME (per-game averages). Required:
          missing answers 422; any other value answers 200 with no rows.'
        example: TOTALS
      - in: query
        name: competition
        schema:
          title: Competition
          type: string
          enum:
          - REGULAR
          - FINALS
        required: false
        description: REGULAR (regular season) or FINALS (the playoffs). Omitted = both.
        example: REGULAR
      - in: query
        name: season
        schema:
          title: Season
          type: integer
        required: false
        description: 'Season: the calendar year (May-August) = the sdv END year. Omitted = every season
          combined (the hub''s All-Time). An unknown year answers 200 with no rows.'
        example: 2019
      - in: query
        name: segment
        schema:
          title: Segment
          type: string
          enum:
          - HOME
          - AWAY
          - L7D
          - L5G
          - L10G
          - MAY
          - JUNE
          - JULY
          - AUGUST
        required: false
        description: 'Game subset: HOME = home games; AWAY = away games; L7D = games in the last 7 days;
          L5G = the last 5 games; L10G = the last 10 games; MAY = games played in May; JUNE = games played
          in June; JULY = games played in July; AUGUST = games played in August. Omitted = all games.
          Values from the CEBL Stats Hub bundle.'
        example: HOME
      - in: query
        name: vs_team_id
        schema:
          title: Vs Team Id
          type: integer
        required: false
        description: 'CEBL team id of the opponent: only games against that team count.'
      - in: query
        name: vs_conference
        schema:
          title: Vs Conference
          type: string
          enum:
          - EAST
          - WEST
        required: false
        description: 'EAST or WEST: only games against that conference''s teams count.'
        example: EAST
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AggregatedTeamStatisticSchema'
                title: Response
                type: array
        '401':
          description: 'No X-Api-Key header, or a wrong one: `{"detail": "Unauthorized"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '422':
          description: A required query param is missing (Django Ninja validation error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - APIKeyAuth: []
      description: 'Team statistic table (totals or per game), plus a league row. No body field echoes
        `mode`, `season`, `competition`, `segment`, `vs_team_id`, `vs_conference`: the request is their
        only guard. A mode other than TOTALS or PER_GAME or an unknown season answers 200 `[]`.'
  /games/{season}/:
    get:
      operationId: apps_stats_games_views_list_season_games
      summary: List Season Games
      parameters:
      - in: path
        name: season
        schema:
          title: Season
          type: string
        required: true
        description: 'Season: the calendar year the season is played in (May-August), which is also the
          sdv END year. A 4-digit string in the path. A season with no data (1999) answers 200 `[]`.'
        example: '2019'
      - in: query
        name: team_id
        schema:
          title: Team Id
          type: integer
        required: false
        description: 'CEBL team id (see /teams/): only that team''s games. Every row then has it as `home_team_id`
          or `away_team_id`.'
        example: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GameSchema'
                title: Response
                type: array
        '401':
          description: 'No X-Api-Key header, or a wrong one: `{"detail": "Unauthorized"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      security:
      - APIKeyAuth: []
      description: Every game of a season (schedule and results), optionally one team's. An unknown season
        or an unknown team answers 200 `[]`.
  /players/statistics/aggregated/:
    get:
      operationId: apps_stats_players_views_list_aggregated_player_statistics
      summary: List Aggregated Player Statistics
      parameters:
      - in: query
        name: mode
        schema:
          title: Mode
          type: string
          enum:
          - TOTALS
          - PER_GAME
        required: true
        description: 'TOTALS (sums over the selected games) or PER_GAME (per-game averages). Required:
          missing answers 422; any other value answers 200 with no rows.'
        example: TOTALS
      - in: query
        name: competition
        schema:
          title: Competition
          type: string
          enum:
          - REGULAR
          - FINALS
        required: false
        description: REGULAR (regular season) or FINALS (the playoffs). Omitted = both.
        example: FINALS
      - in: query
        name: season
        schema:
          title: Season
          type: integer
        required: false
        description: 'Season: the calendar year (May-August) = the sdv END year. Omitted = every season
          combined (the hub''s All-Time). An unknown year answers 200 with no rows.'
        example: 2019
      - in: query
        name: segment
        schema:
          title: Segment
          type: string
          enum:
          - HOME
          - AWAY
          - L7D
          - L5G
          - L10G
          - MAY
          - JUNE
          - JULY
          - AUGUST
        required: false
        description: 'Game subset, as on /teams/statistics/aggregated/: HOME, AWAY, L7D, L5G, L10G, MAY,
          JUNE, JULY, AUGUST. Omitted = all games.'
      - in: query
        name: team_id
        schema:
          title: Team Id
          type: integer
        required: false
        description: CEBL team id (see /teams/). Limits the rows to that team's players. The rows echo
          it in `team_id`.
        example: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AggregatedPlayerStatisticSchema'
                title: Response
                type: array
        '401':
          description: 'No X-Api-Key header, or a wrong one: `{"detail": "Unauthorized"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '422':
          description: A required query param is missing (Django Ninja validation error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - APIKeyAuth: []
      description: 'Player statistic table (totals or per game). No body field echoes `mode`, `season`,
        `competition`, `segment`: the request is their only guard. A mode other than TOTALS or PER_GAME,
        an unknown season or an unknown team answers 200 `[]`.'
  /players/statistics/leaders/:
    get:
      operationId: apps_stats_players_views_list_player_statistic_leaders
      summary: List Player Statistic Leaders
      parameters:
      - in: query
        name: statistics
        schema:
          title: Statistics
          type: string
        required: true
        description: 'Comma-separated statistic names; the body has one key per name. Names the CEBL Stats
          Hub sends: POINTS, REBOUNDS, ASSISTS, BLOCKS, STEALS, TARGET_SCORES, FIELD_GOAL_PERCENTAGE,
          THREE_POINTS_MADE, THREE_POINT_PERCENTAGE, FREE_THROW_PERCENTAGE, FOULS, TURNOVERS, MINUTES.'
        example: POINTS,REBOUNDS,ASSISTS,TARGET_SCORES
      - in: query
        name: mode
        schema:
          title: Mode
          type: string
          enum:
          - TOTALS
          - PER_GAME
        required: true
        description: 'TOTALS (sums over the selected games) or PER_GAME (per-game averages). Required:
          missing answers 422; any other value answers 200 with no rows.'
        example: TOTALS
      - in: query
        name: competition
        schema:
          title: Competition
          type: string
          enum:
          - REGULAR
          - FINALS
        required: false
        description: REGULAR (regular season) or FINALS (the playoffs). Omitted = both.
      - in: query
        name: season
        schema:
          title: Season
          type: integer
        required: false
        description: 'Season: the calendar year (May-August) = the sdv END year. Omitted = every season
          combined (the hub''s All-Time). An unknown year answers 200 with no rows.'
        example: 2019
      - in: query
        name: team_id
        schema:
          title: Team Id
          type: integer
        required: false
        description: CEBL team id (see /teams/). Limits the rows to that team's players. The rows echo
          it in `team_id`.
        example: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  items:
                    $ref: '#/components/schemas/PlayerStatisticLeaderSchema'
                  type: array
                title: Response
                type: object
        '401':
          description: 'No X-Api-Key header, or a wrong one: `{"detail": "Unauthorized"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '422':
          description: A required query param is missing (Django Ninja validation error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - APIKeyAuth: []
      description: 'Top players per requested statistic. No body field echoes `mode`, `season`, `competition`:
        the request is their only guard. A mode other than TOTALS or PER_GAME, an unknown season, an unknown
        team or an unknown statistic name answers 200 with an object mapping each requested name to `[]`.'
  /players/{player_id}/statistics/:
    get:
      operationId: apps_stats_players_views_list_individual_player_statistics
      summary: List Individual Player Statistics
      parameters:
      - in: path
        name: player_id
        schema:
          title: Player Id
          type: integer
        required: true
        description: CEBL player id. The rows echo it in `id`. An unknown id answers 200 `[]`.
        example: 570965
      - in: query
        name: mode
        schema:
          title: Mode
          type: string
          enum:
          - TOTALS
          - PER_GAME
        required: true
        description: 'TOTALS (sums over the selected games) or PER_GAME (per-game averages). Required:
          missing answers 422; any other value answers 200 with no rows.'
        example: PER_GAME
      - in: query
        name: career_only
        schema:
          title: Career Only
          type: boolean
        required: true
        description: 'true: only the career row (`season` null). false: one row per season, then the career
          row.'
        example: false
      - in: query
        name: competition
        schema:
          title: Competition
          type: string
          enum:
          - REGULAR
          - FINALS
        required: false
        description: REGULAR (regular season) or FINALS (the playoffs). Omitted = both.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IndividualPlayerStatisticSchema'
                title: Response
                type: array
        '401':
          description: 'No X-Api-Key header, or a wrong one: `{"detail": "Unauthorized"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '422':
          description: A required query param is missing (Django Ninja validation error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - APIKeyAuth: []
      description: 'One player''s per-season rows and career row. No body field echoes `mode`, `competition`:
        the request is their only guard. An unknown player or a mode other than TOTALS or PER_GAME answers
        200 `[]`.'
  /players/{player_id}/:
    get:
      operationId: apps_stats_players_views_list_player_profile
      summary: List Player Profile
      parameters:
      - in: path
        name: player_id
        schema:
          title: Player Id
          type: integer
        required: true
        description: CEBL player id. The body echoes it in `id`. An unknown id answers 200 with every
          field null (never banked).
        example: 570965
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerSchema'
        '401':
          description: 'No X-Api-Key header, or a wrong one: `{"detail": "Unauthorized"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      security:
      - APIKeyAuth: []
      description: One player's profile and current team. An unknown player answers 200 with every field
        null.
  /players/{player_id}/gamelog/:
    get:
      operationId: apps_stats_players_views_list_player_game_log
      summary: List Player Game Log
      parameters:
      - in: path
        name: player_id
        schema:
          title: Player Id
          type: integer
        required: true
        description: CEBL player id. The rows do not echo it.
        example: 530
      - in: query
        name: season
        schema:
          title: Season
          type: integer
        required: false
        description: Season (calendar year = sdv END year). Omitted = every season. Every row's `game_date`
          falls in that year.
        example: 2019
      - in: query
        name: competition
        schema:
          title: Competition
          type: string
          enum:
          - REGULAR
          - FINALS
        required: false
        description: REGULAR (regular season) or FINALS (the playoffs). Omitted = both.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PlayerGameLogSchema'
                title: Response
                type: array
        '401':
          description: 'No X-Api-Key header, or a wrong one: `{"detail": "Unauthorized"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      security:
      - APIKeyAuth: []
      description: 'One player''s game log. No body field echoes `player_id`, `competition`: the request
        is their only guard. An unknown player or an unknown season answers 200 `[]`.'
  /news/articles/{language}/:
    get:
      operationId: apps_feeds_news_views_list_news_articles
      summary: List News Articles
      parameters:
      - in: path
        name: language
        schema:
          title: Language
          type: string
        required: true
        description: Language code; `en` and `fr` are the site's languages. Every value probed (en, fr,
          EN, en-ca, fr-ca, english) answered 200 `[]` on 2026-10-12.
        example: en
      - in: query
        name: team_source_id
        schema:
          title: Team Source Id
          type: integer
        required: false
        description: Team filter, by an id the empty answers never show (unverified key space; 14 answered
          `[]`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/NewsArticleSchema'
                title: Response
                type: array
        '401':
          description: 'No X-Api-Key header, or a wrong one: `{"detail": "Unauthorized"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      security:
      - APIKeyAuth: []
      description: 'News articles in one language. Answered `[]` on every probe, so its row schema is
        unobserved. No body field echoes `language`, `team_source_id`: the request is their only guard.'
components:
  schemas:
    SeasonSchema:
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: ID
          description: 'CEBL season row id (1 = 2019 ... 8 = 2026). No route takes it: routes take `year`.'
        year:
          title: Year
          type: integer
          description: 'Season: the calendar year it is played in (May-August) = the sdv END year. The
            key every route''s `season` param takes.'
        is_active:
          default: false
          title: Is Active
          type: boolean
          description: 'True for the current season (one row: 2026 on 2026-10-12).'
        is_live:
          default: false
          title: Is Live
          type: boolean
          description: 'True while the current season is in progress or open for live data (true for 2026
            on 2026-10-12, after its last game: the exact meaning is unverified).'
      required:
      - year
      title: SeasonSchema
      type: object
      description: A season row of /seasons/.
    TeamStandingSchema:
      properties:
        id:
          title: Id
          type: integer
          description: 'CEBL team id (its own key space; not a Genius id). Joins /teams/ `id`, the games''
            `home_team_id` / `away_team_id`, `team_id` in player rows and the `team_id` / `vs_team_id`
            params. A relocated or renamed franchise has a second id: the Stats Hub groups 15+56 (Saskatchewan
            Rattlers, Saskatoon Mamba), 17+53 (Calgary Surge, Guelph Nighthawks), 19+55 (Brampton, Hamilton
            Honey Badgers) and 16+54 (Vancouver, Fraser Valley Bandits).'
        name:
          deprecated: true
          title: Name
          type: string
          description: 'Deprecated upstream (`deprecated: true`): equal to `name_en` in every sample.'
        name_en:
          title: Name En
          type: string
          description: Team full name in English ('Niagara River Lions').
        short_name_en:
          title: Short Name En
          type: string
          description: Team short name in English, usually the city ('Niagara').
        name_fr:
          title: Name Fr
          type: string
          description: Team full name in French ('River Lions de Niagara').
        short_name_fr:
          title: Short Name Fr
          type: string
          description: Team short name in French, usually the city.
        conference:
          title: Conference
          type: string
          description: 'Conference: EAST or WEST.'
        logo_url:
          title: Logo Url
          type: string
          description: Team logo URL (icon with the team name) on Google Cloud Storage.
        icon_url:
          title: Icon Url
          type: string
          description: Team icon URL (without the team name) on Google Cloud Storage.
        tickets_url_en:
          title: Tickets Url En
          type: string
          description: Ticket-sales page for the team's home games (English).
        tickets_url_fr:
          title: Tickets Url Fr
          type: string
          description: Ticket-sales page for the team's home games (French).
        website_url_en:
          title: Website Url En
          type: string
          description: The team's own website (English).
        website_url_fr:
          title: Website Url Fr
          type: string
          description: The team's own website (French).
        shop_url_en:
          title: Shop Url En
          type: string
          description: The team's merchandise shop (English).
        shop_url_fr:
          title: Shop Url Fr
          type: string
          description: The team's merchandise shop (French).
        stats_url_en:
          title: Stats Url En
          type: string
          description: The team's stats page on cebl.ca (`https://cebl.ca/stats/{slug}`).
        stats_url_fr:
          title: Stats Url Fr
          type: string
          description: The team's stats page on the French cebl.ca (`https://cebl.ca/fr-ca/stats/{slug}`).
        position:
          title: Position
          type: integer
          description: Rank in the team's conference standings (1 = first), not a playing position.
        played:
          title: Played
          type: integer
          description: Regular-season games played (24 a team in 2025).
        wins:
          title: Wins
          type: integer
          description: Regular-season games won.
        win_percentage:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          title: Win Percentage
          description: Wins / games played, 0-1 with 3 decimals ('0.583'). A string.
        home_wins:
          title: Home Wins
          type: integer
          description: Regular-season home games won.
        away_wins:
          title: Away Wins
          type: integer
          description: Regular-season away games won.
        losses:
          title: Losses
          type: integer
          description: Regular-season games lost.
        home_losses:
          title: Home Losses
          type: integer
          description: Regular-season home games lost.
        away_losses:
          title: Away Losses
          type: integer
          description: Regular-season away games lost.
        games_behind:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
