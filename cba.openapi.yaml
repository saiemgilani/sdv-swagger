info:
  description: 'The keyless REST API behind https://www.cbaleague.com/data/ (CBA, men''s, 1995-96 onward
    in the season list). EVERY response is AES-128-ECB / PKCS7 encrypted (a base64 JSON string); the key
    is a constant in the site''s JavaScript bundle (x-encryption). The host is blocked at TCP from datacenter
    IPs (a residential proxy is needed) and requests need `Referer: https://www.cbaleague.com/data/`;
    POSTs need `Content-Type: application/json`. Seasons are keyed by START year (season 2025 is 2025-26;
    sdv END year = season + 1). scheduleId is a global 9-digit game id. Play-by-play exists from 2017-18
    (one quarter per request); box scores from at least 2009-10. There are NO shot x/y coordinates: shot
    location is only team and player zone splits (at rim / mid-range / three). Field names are English
    but the values are Chinese; descriptions translate them. WCBA (women) has no official source found
    and is not covered. Shapes from captures of 2026-10-12; x-unobserved = null in every sample. Not official
    or supported.'
  title: Chinese Basketball Association (CBA) data API (data-server.cbaleague.com)
  version: '2026-10-12'
openapi: 3.1.0
paths:
  /api/com-code-tables/getMatchType:
    get:
      description: 'Match type select list (id string + Chinese name). WCBA (women) is not a match type
        here and no official women''s source was found: not covered. The response is AES-128-ECB encrypted:
        see x-encryption.'
      operationId: get_cba_match_types
      parameters:
      - description: Must be https://www.cbaleague.com/data/ (the site's own page); other values were
          not tried.
        example: https://www.cbaleague.com/data/
        in: header
        name: Referer
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: base64 of the AES-128-ECB / PKCS7 ciphertext of the JSON documented by x-decrypted-schema.
                type: string
              x-decrypted-schema:
                schema:
                  $ref: '#/components/schemas/CbaMatchTypes'
                scheme: x-encryption (root)
          description: Match types (regular season, playoffs, preseason, all-star, relegation) with their
            ids
        '500':
          content:
            application/json:
              schema: &id001
                properties:
                  cause:
                    description: Null in every observed error.
                    type:
                    - string
                    - 'null'
                  detail:
                    description: Java exception text (e.g. a JSON parse error naming the offending field),
                      or null.
                    type:
                    - string
                    - 'null'
                  message:
                    description: '''服务异常'' = ''service error''.'
                    type: string
                  path:
                    description: The route path that failed.
                    type: string
                  status:
                    description: '500.'
                    type: integer
                  title:
                    description: '''非业务异常'' = ''non-business exception''.'
                    type: string
                type: object
          description: 'Unencrypted JSON error envelope: a body the API dislikes (missing or wrongly typed
            field).'
      security: []
      summary: Match types (regular season, playoffs, preseason, all-star, relegation) with their ids
  /api/com-code-tables/getSeason:
    get:
      description: 'Season select list, newest first, down to 1995-1996. The season key is the START year
        (value ''2025'' = 2025-26): the sdv END year is value + 1. The list reaches back to 1995-96; box
        data before 2009-10 is unverified. The response is AES-128-ECB encrypted: see x-encryption.'
      operationId: get_cba_season_list
      parameters:
      - description: Must be https://www.cbaleague.com/data/ (the site's own page); other values were
          not tried.
        example: https://www.cbaleague.com/data/
        in: header
        name: Referer
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: base64 of the AES-128-ECB / PKCS7 ciphertext of the JSON documented by x-decrypted-schema.
                type: string
              x-decrypted-schema:
                schema:
                  $ref: '#/components/schemas/CbaSeasonList'
                scheme: x-encryption (root)
          description: Season list (every season of the CBA data site, newest first, with the default
            flag)
        '500':
          content:
            application/json:
              schema: *id001
          description: 'Unencrypted JSON error envelope: a body the API dislikes (missing or wrongly typed
            field).'
      security: []
      summary: Season list (every season of the CBA data site, newest first, with the default flag)
  /api/com-code-tables/getTeam:
    get:
      description: 'Team select list of one season (teamId string + Chinese name of that season). The
        season parameter is not echoed: verified by diffing season=2025 (20 teams, 2025-26 names) and
        season=2009 (17 teams, 2009-10 names, e.g. 八一双鹿电池). The response is AES-128-ECB encrypted: see
        x-encryption.'
      operationId: get_cba_team_options
      parameters:
      - description: Must be https://www.cbaleague.com/data/ (the site's own page); other values were
          not tried.
        example: https://www.cbaleague.com/data/
        in: header
        name: Referer
        required: true
        schema:
          type: string
      - description: Team list flavour; types 1 and 2 returned the same 20 rows on 2026-10-12. The site
          sends 2.
        example: 2
        in: query
        name: type
        required: true
        schema:
          type: integer
      - description: Season START year (2025 = the 2025-26 season). The sdv season key is the END year
          = season + 1; map at the boundary.
        example: 2025
        in: query
        name: season
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                description: base64 of the AES-128-ECB / PKCS7 ciphertext of the JSON documented by x-decrypted-schema.
                type: string
              x-decrypted-schema:
                schema:
                  $ref: '#/components/schemas/CbaTeamOptions'
                scheme: x-encryption (root)
          description: Teams of one season as a select list (team id + display name)
        '500':
          content:
            application/json:
              schema: *id001
          description: 'Unencrypted JSON error envelope: a body the API dislikes (missing or wrongly typed
            field).'
      security: []
      summary: Teams of one season as a select list (team id + display name)
  /api/player-base-list:
    post:
      description: 'Season player box (a page). Per-game values are decimal STRINGS (''16.8''); percentages
        are percent strings with a *Sort fraction twin; the at-rim / mid-range counts are season totals
        (floats). The response is AES-128-ECB encrypted: see x-encryption.'
      operationId: post_cba_player_base
      parameters:
      - description: Must be https://www.cbaleague.com/data/ (the site's own page); other values were
          not tried.
        example: https://www.cbaleague.com/data/
        in: header
        name: Referer
        required: true
        schema:
          type: string
      - description: 1-based page number (the capture always sends 1 with a pageSize larger than any list).
        example: 1
        in: query
        name: pageNumber
        required: true
        schema:
          type: integer
      - description: Rows per page. The site sends 20 (most tables) or 60 (team overview); the capture
          sends 100 and treats a full page as possibly truncated.
        example: 100
        in: query
        name: pageSize
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CbaPlayerBaseRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: base64 of the AES-128-ECB / PKCS7 ciphertext of the JSON documented by x-decrypted-schema.
                type: string
              x-decrypted-schema:
                schema:
                  $ref: '#/components/schemas/CbaPlayerBase'
                scheme: x-encryption (root)
          description: Player season box (one page of the season player table)
        '500':
          content:
            application/json:
              schema: *id001
          description: 'Unencrypted JSON error envelope: a body the API dislikes (missing or wrongly typed
            field).'
      security: []
      summary: Player season box (one page of the season player table)
  /api/player-defensive-list:
    post:
      description: 'Season player defensive rates (a page). Rates are percent strings with Rank (0-1)
        and Sort (fraction) twins; minutes/seconds are season totals. The response is AES-128-ECB encrypted:
        see x-encryption.'
      operationId: post_cba_player_defensive
      parameters:
      - description: Must be https://www.cbaleague.com/data/ (the site's own page); other values were
          not tried.
        example: https://www.cbaleague.com/data/
        in: header
        name: Referer
        required: true
        schema:
          type: string
      - description: 1-based page number (the capture always sends 1 with a pageSize larger than any list).
        example: 1
        in: query
        name: pageNumber
        required: true
        schema:
          type: integer
      - description: Rows per page. The site sends 20 (most tables) or 60 (team overview); the capture
          sends 100 and treats a full page as possibly truncated.
        example: 100
        in: query
        name: pageSize
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
