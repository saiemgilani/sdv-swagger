components:
  schemas:
    CbaAdvanceCount:
      description: 'Advanced player box of a game: homes and visitings.'
      properties:
        homes:
          description: 'The home team''s player rows: one row per player who took part (data-count also
            has a team rebounds/turnovers row).'
          items:
            properties:
              assistsPercentage:
                description: '助攻率 assist rate: the share of teammates'' made field goals the player assisted
                  while on the court (site definition: 球员在场时队友受其助攻命中数占所有命中数的比例).'
                type: string
              assistsPercentageRank:
                description: 'Colour rank for the metric, a fraction 0-1 (1 = best, inverted for ''bad''
                  statistics such as turnovers) that the site uses to colour the cell (inferred from the
                  sample values; the base population is not documented). Metric: 助攻率 assist rate: the
                  share of teammates'' made field goals the player assisted while on the court (site definition:
                  球员在场时队友受其助攻命中数占所有命中数的比例). Null on every row of some eras: the 2017-18 and 2009-10 samples
                  have no Rank values, and the at-rim / mid-range strings are null in 2009-10 and ''0/0''
                  strings in 2025-26.'
                type:
                - number
                - 'null'
              assistsPercentageSort:
                description: 'Unformatted numeric value behind the formatted string of the same metric
                  (a fraction 0-1 for percentages), used by the site to sort the table. Metric: 助攻率 assist
                  rate: the share of teammates'' made field goals the player assisted while on the court
                  (site definition: 球员在场时队友受其助攻命中数占所有命中数的比例).'
                type: number
              blockedPercentage:
                description: '盖帽率 block rate: blocks as a share of the opponent''s two-point attempts
                  while the player is on the court (site definition).'
                type: string
              blockedPercentageRank:
                description: 'Colour rank for the metric, a fraction 0-1 (1 = best, inverted for ''bad''
                  statistics such as turnovers) that the site uses to colour the cell (inferred from the
                  sample values; the base population is not documented). Metric: 盖帽率 block rate: blocks
                  as a share of the opponent''s two-point attempts while the player is on the court (site
                  definition). Null on every row of some eras: the 2017-18 and 2009-10 samples have no
                  Rank values, and the at-rim / mid-range strings are null in 2009-10 and ''0/0'' strings
                  in 2025-26.'
                type:
                - number
                - 'null'
              blockedPercentageSort:
                description: 'Unformatted numeric value behind the formatted string of the same metric
                  (a fraction 0-1 for percentages), used by the site to sort the table. Metric: 盖帽率 block
                  rate: blocks as a share of the opponent''s two-point attempts while the player is on
                  the court (site definition).'
                type: number
              cnAlias:
                description: Player name (Chinese).
                type: string
              fieldGoalsAtRimPercentage:
                description: 'At-the-rim (篮下, inside the restricted area 合理冲撞区) field goals as the string
                  ''made/attempted''. Null on every row of some eras: the 2017-18 and 2009-10 samples
                  have no Rank values, and the at-rim / mid-range strings are null in 2009-10 and ''0/0''
                  strings in 2025-26.'
                type:
                - string
                - 'null'
              fieldGoalsAtRimPercentageRank:
                description: 'Unobserved: null in every sample. When filled: colour rank for the metric,
                  a fraction 0-1 (1 = best, inverted for ''bad'' statistics such as turnovers) that the
                  site uses to colour the cell (inferred from the sample values; the base population is
                  not documented). Metric: At-the-rim (篮下, inside the restricted area 合理冲撞区) field goals
                  as the string ''made/attempted''.'
                x-unobserved: true
              fieldGoalsAtRimPercentageSort:
                description: 'Unobserved: null in every sample. When filled: unformatted numeric value
                  behind the formatted string of the same metric (a fraction 0-1 for percentages), used
                  by the site to sort the table. Metric: At-the-rim (篮下, inside the restricted area 合理冲撞区)
                  field goals as the string ''made/attempted''.'
                x-unobserved: true
              fieldGoalsMidPercentage:
                description: 'Mid-range (中距离, two-point shots outside the restricted area) field goals
                  as the string ''made/attempted''. Null on every row of some eras: the 2017-18 and 2009-10
                  samples have no Rank values, and the at-rim / mid-range strings are null in 2009-10
                  and ''0/0'' strings in 2025-26.'
                type:
                - string
                - 'null'
              fieldGoalsMidPercentageRank:
                description: 'Unobserved: null in every sample. When filled: colour rank for the metric,
                  a fraction 0-1 (1 = best, inverted for ''bad'' statistics such as turnovers) that the
                  site uses to colour the cell (inferred from the sample values; the base population is
                  not documented). Metric: Mid-range (中距离, two-point shots outside the restricted area)
                  field goals as the string ''made/attempted''.'
                x-unobserved: true
              fieldGoalsMidPercentageSort:
                description: 'Unobserved: null in every sample. When filled: unformatted numeric value
                  behind the formatted string of the same metric (a fraction 0-1 for percentages), used
                  by the site to sort the table. Metric: Mid-range (中距离, two-point shots outside the restricted
                  area) field goals as the string ''made/attempted''.'
