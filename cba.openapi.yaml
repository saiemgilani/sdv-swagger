                type: integer
              minutes:
                description: 'Game clock, minutes REMAINING in the period (counts down: 10 or 12 at the
                  start, depending on the era).'
                type: integer
              playerCNNames:
                description: Names (Chinese surnames/short names) of the players in textualFormat, in
                  order of mention (shooter or fouler first, then assister, rebounder or fouled player).
                  0-3 names. There are NO player ids in the play-by-play.
                items:
                  type: string
                type: array
              playerFouls:
                description: 'Unobserved: null in every sample (a player''s fouls slot).'
                x-unobserved: true
              playerScore:
                description: 'Unobserved: null in every sample (a player''s points slot).'
                x-unobserved: true
              quarterNum:
                description: Period of the row (1-4; 5+ would be overtime). Equals the request's quarterNum
                  on every row.
                type: integer
              seconds:
                description: Game clock, seconds remaining within the minute.
                type: integer
              teamCNAlias1:
                description: 'Unobserved: null in every sample (a team-name slot).'
                x-unobserved: true
              teamCNAlias2:
                description: 'Unobserved: null in every sample (a team-name slot).'
                x-unobserved: true
              teamCNAlias3:
                description: 'Unobserved: null in every sample (a team-name slot).'
                x-unobserved: true
              textualFormat:
                description: Play description sentence (Chinese) naming the players; the phrase glossary
                  translates every form seen. Team names inside it can be a different era's name than
                  the game header (a 2025-26 text reads 浙江方兴渡队).
                type: string
              type:
                description: 'Team the play belongs to: 1 = home, 2 = visiting (checked on all 667 rows
                  of two games: color equals homeColor when 1 and visitingColor when 2). See the code
                  table.'
                type: integer
              visitingColor:
                description: Visiting team colour '#RRGGBB'.
                type: string
              visitorScore:
                description: Visiting team points after the play (same caveat as homeScore).
                type: integer
            type: object
          type: array
        searchCount:
          description: MyBatis-Plus flag; true in every sample (unverified meaning).
          type: boolean
        size:
          description: Page size the server applied (the pageSize query value, or the default 10 where
            none was sent; equals the row count on the play-by-play pages).
          type: integer
        total:
          description: Number of play rows of THIS quarter (the request's quarterNum); the capture requests
            every quarter and refuses a partial set.
          type: integer
      type: object
