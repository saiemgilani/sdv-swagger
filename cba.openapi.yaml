              gameStart:
                description: 'Starter flag: 1 = started the game.'
                type: integer
              isColor:
                description: Highlight flag, 1 on every sampled row (unverified meaning; the site uses
                  it to colour the row).
                type: integer
              number:
                description: Jersey number as a string.
                type: string
              playerId:
                description: 'playerId (key space: CBA persons, stable across seasons and clubs; 3-9 digits,
                  older players have short ids (393433) and newer ones 100xxxxxx). Joins the player box
                  routes, the season player lists and getPlayersByScheduleId. Not a team id.'
                type: integer
              playerTimes:
                description: 0 on every sampled row; meaning unverified (a games-played slot the game
                  route does not fill).
                type: integer
              position:
                description: 'Position label (Chinese). Eras differ: coarse 后卫 (guard) / 前锋 (forward)
                  / 中锋 (center) in older seasons, five-way 控球后卫 (point guard) / 得分后卫 (shooting guard)
                  / 小前锋 (small forward) / 大前锋 (power forward) / 中锋 (center) in newer ones; dual positions
                  are joined with ''/'' (e.g. 小前锋/大前锋).'
                type: string
              reboundsDefensivePercentage:
                description: '防守篮板率 defensive-rebound rate: the player''s defensive rebounds as a share
