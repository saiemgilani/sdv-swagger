- url: https://data-server.cbaleague.com
x-encryption:
  algorithm: AES-128-ECB
  errors: 'HTTP 500 answers an UNENCRYPTED JSON envelope (see the 500 response); an unknown or malformed
    request can also answer 200 with an EMPTY body. Neither decrypts: refuse them.'
  key: uVayqL4ONKjFbVzQ
  key-source: 'Constant in function TIe of https://www.cbaleague.com/data/assets/index.<hash>.js (index.be825570.js
    on 2026-10-12): `const t="uVayqL4ONKjFbVzQ"; ip.AES.decrypt(e, Utf8.parse(t), {mode: ECB, padding:
    Pkcs7})`. The key ships to every visitor of the site; fetch the bundle at run time and keep this value
    as the fallback.'
  padding: PKCS7
  wire-format: The response body is a JSON string literal holding base64 of the ciphertext (Content-Type
    application/json;charset=UTF-8). Decrypt, then parse the plaintext as UTF-8 JSON.
