            properties:
              btTextualFormat:
                description: Second copy of the description; equal to textualFormat on every sampled row
                  (unverified difference).
                type: string
              color:
                description: Hex colour of the acting team (homeColor or visitingColor).
                type: string
              distance:
                description: 'Unobserved: null in every sample (a shot distance slot). The API has NO
                  shot x/y coordinates.'
                x-unobserved: true
              homeColor:
                description: Home team colour '#RRGGBB'.
                type: string
              homeScore:
                description: 'Home team points after the play. NOT monotone row by row: a substitution
